ss=\"py-keyword\">from\u003c/span> exc"]},"references":[{"label":"LangChain · with_structured_output","url":"https://reference.langchain.com/python/langchain-openai/chat_models/base/ChatOpenAI/with_structured_output"},{"label":"Pydantic · Strict Mode","url":"https://docs.pydantic.dev/latest/concepts/strict_mode/"}]},{"id":"ch7-failure-states","chapter":7,"kind":"table","title":"근거 부족·검색 실패·생성 실패는 다른 결과입니다","claim":"정상적인 정보 부족은 업무 응답이며 실행 또는 검증 실패를 감추는 대체 문장이 아닙니다.","headers":["상황","분류","서비스의 처리"],"rows":[["현재 조건에서 Context가 비어 있음","근거 부족","모델 호출을 생략하고 insufficient_context 반환 가능"],["관련 문서는 있지만 정확한 마감 날짜가 없음","질문에 답할 정보 부족","구체적 날짜를 만들지 않고 부족한 정보를 안내"],["DB 연결·검색 과정의 예외","retrieval_error","오류로 전달하며 빈 검색 결과로 바꾸지 않음"],["API 연결 예외 / 거절 / 미완료","generation_error / provider_refusal / generation_not_completed","완성 답변으로 승인하지 않으며 원인과 호출 단계를 기록"],["출력 파싱·로컬 규칙 실패","output_parsing_error / answer_validation_error","잘못된 ID·상태·길이를 가진 응답은 전달하지 않음"]],"note":"HTTP 상태, AIMessage의 완료 정보, 생성 내용의 status는 서로 다른 층입니다. Context 예산 때문에 문서가 빠졌을 수도 있으므로 빈 Context를 보고 전체 DB에 자료가 없다고 단정하지 않습니다. API나 어댑터가 invoke() 중 던진 예외도 오류로 남깁니다.","references":[{"label":"LangChain · with_structured_output","url":"https://reference.langchain.com/python/langchain-openai/chat_models/base/ChatOpenAI/with_structured_output"},{"label":"FastAPI · Handling Errors","url":"https://fastapi.tiangolo.com/tutorial/handling-errors/"}]},{"id":"ch7-included-source-boundary","chapter":7,"kind":"concept","title":"허용 출처는 실제 included_docs에서만 만듭니다","claim":"검색된 전체 문서와 모델이 실제 읽은 문서를 구분해야 출처가 생성 입력과 연결됩니다.","left":[["검색 후보와 포함 문서","Retriever가 201·202·203을 반환해도 중복·개수·문자 예산 때문에 Context에는 201·202만 들어갈 수 있습니다. 이때 허용 출처도 201·202입니다."],["ID의 역할","chunk_id는 같은 청크를 구분하는 문자열이고 citation_id는 답변 source_ids에 쓰는 양의 정수입니다. 두 ID를 바꾸어 사용하지 않습니다."]],"right":[["본문·버전·위치는 서버 기록","검증한 source_ids를 included_docs의 Metadata에 연결합니다. 문서명·source_version·source_locator를 모델이 새로 만들어 반환하게 하지 않습니다."],["Chain 밖에 보존할 정보","prompt | structured_model이 반환하는 것은 생성 bundle입니다. 원래 Document의 Metadata가 자동으로 붙어 나오지는 않으므로 included_docs를 서비스 함수가 따로 보관합니다."]],"example":"검색 IDs = {201, 202, 203}\nincluded_docs의 IDs = {201, 202}\n허용 source_ids ⊆ {201, 202}","distinction":"201·202·203은 교육용 ID입니다. 실제 연결에서는 DB가 반환한 citation_id와 원문 위치를 그대로 추적하며, ID 검사 통과 뒤에도 본문이 주장을 지지하는지 확인합니다."},{"id":"ch7-response-validator-demo","chapter":7,"kind":"demo","demo":"response-validator","title":"Validation Lab: 같은 Context에서 다른 출력을 검사합니다","claim":"같은 제공 ID 집합에서 응답의 출처·상태·내용을 바꿔 어느 검사가 실패하는지 확인합니다.","left":[["먼저 출처를 고정","included_docs가 201·202인 상황에서 201, 203, 999를 각각 인용해 봅니다. 검색된 적이 있어도 Context에서 빠진 203은 허용되지 않습니다."],["형식과 상태를 바꾸기","중복 ID, 숫자 문자열 ID, 출처가 없는 answered, 부족 정보가 없는 insufficient_context를 선택하고 실패한 규칙을 읽습니다."]],"right":[["거절·미완료를 구분","raw의 완료 상태와 거절 사례, parsing_error가 있는 사례를 확인합니다. 어떤 경우도 정상적인 정보 부족으로 바꾸어 통과시키지 않습니다."],["자동 검사의 한계","[201]을 달고 20분도 지각이라고 쓰면 ID 검사는 통과할 수 있습니다. 원문에는 15분 초과 결석이라고 되어 있으므로 내용은 별도로 대조합니다."]],"note":"교육용 bundle 사례에 JavaScript로 형식·ID·상태 규칙을 적용하는 시연입니다. 실제 LLM 응답이나 Python 실행이 아니며, 의미 검사 사례의 정답은 제공한 원문과 대조하도록 준비했습니다."},{"id":"ch7-practice-guide","chapter":7,"kind":"practice","title":"실습 07 · Validation과 출처 확인","claim":"형식·상태·허용 출처를 검사하고, 검사 통과와 원문이 답변을 지지하는지를 구분합니다.","after_scene":"ch7-response-validator-demo","preparation":"본문의 검증 함수와 [201] 문서를 넣은 Context를 사용합니다. included_docs에서 허용 ID를 얻고 정상·근거 부족·미제공 ID의 고정 응답을 확인합니다.","output":"고정 응답별 통과·실패 단계와 원문 대조 이유를 남긴 검증표","levels":[{"folder":"01_basic","name":"기본필수","task":"본문 검사 함수를 재사용하고 공통 세 사례의 입력과 허용 ID를 채웁니다. 정상·근거 부족·출처 오류의 결과를 구분하고, 통과한 답변을 출석 원문과 대조합니다.","result":"세 사례의 통과·실패를 구분하고, 올바른 ID만으로 답변의 의미가 보장되지 않음을 설명합니다."},{"folder":"02_intermediate","name":"응용","task":"같은 골격으로 공통 세 사례를 확인하고 source_ids의 문자열 ID나 중복 ID 한 가지를 추가합니다. 어느 검사에서 실패했는지 기록하고 통과한 답변의 원문도 대조합니다.","result":"자료형·중복·허용 범위 검사의 차이를 찾고, 통과 결과에 필요한 원문 대조를 수행합니다."},{"folder":"03_advanced","name":"심화","task":"같은 골격으로 공통 세 사례와 완료 상태가 incomplete인 raw를 확인합니다. 미완료와 근거 부족의 차이를 적고, ID는 맞지만 원문과 다른 답변도 대조합니다.","result":"수신 상태 오류와 근거 부족을 구분하고, 자동 검사로 찾지 못하는 내용 오류를 확인합니다."}],"criterion":"공통 세 사례의 결과와 실패 이유를 설명하고, 통과한 출처 ID와 답변의 주장을 실제 Context 원문에 대조하면 완료입니다.","caution":"허용 출처는 실제 included_docs에서만 얻으며, Schema와 ID 검사를 통과한 답변도 원문이 그 주장을 지지하는지 확인합니다."},{"id":"ch7-validation-quiz","chapter":7,"kind":"quiz","title":"확인 · 검증이 보장하는 범위를 설명합니다","claim":"형식 승인·출처 참조·근거 내용·실행 실패를 서로 다른 판단으로 설명해 봅니다.","items":[["제공한 ID가 {201, 202}인데 source_ids=[203]을 받았습니다. 검색 후보에 203이 있었으면 허용할까요?","허용하지 않습니다. 기준은 전체 검색 후보가 아니라 실제 included_docs입니다. 203이 Context에서 빠졌다면 모델이 읽은 근거로 인용할 수 없습니다."],["bundle의 parsed가 있고 source_ids도 맞지만 [201] 20분 늦어도 지각이라고 했습니다. 검증 완료인가요?","형식·ID·상태 검사는 통과할 수 있지만 Grounding은 실패합니다. 출석 v2는 15분 초과 결석이며 사전 승인 예외를 따로 안내합니다. 숫자·조건·예외를 원문과 대조해야 합니다."],["DB Timeout이나 parsing_error가 생기면 고정 안내 문장과 insufficient_context를 반환해도 될까요?","안 됩니다. 검색·생성·파싱 실패는 정해진 서비스 오류로 전달합니다. insufficient_context는 현재 확보한 근거만으로 답할 수 없다는 정상 판단입니다."]]},{"id":"ch8-source-index","chapter":8,"kind":"code","title":"서비스 조립 1/3 · 포함 문서의 출처 인덱스를 만듭니다","claim":"포함 문서의 서버 Metadata로 허용 ID와 최종 출처를 연결할 작은 조회표를 만듭니다.","left":"입력: build_context가 반환한 included_docs. 각 Document에 citation_id·doc_id·source_version·source_locator가 있어야 합니다.","right":"출력: citation_id → 서버 출처 정보 딕셔너리. 이 전체 목록을 곧바로 응답하지 않고, 검증된 source_ids만 마지막에 선택합니다.","code":{"lang":"python","title":"index_sources · 서버가 보관하는 출처","raw":"def index_sources(included_docs):\n    fields = (\"citation_id\", \"doc_id\", \"source_version\",\n              \"source_locator\")\n    # 출처 ID로 원문 정보를 찾을 인덱스\n    by_id = {}\n    for doc in included_docs:\n        metadata = doc.metadata\n        cid = metadata[\"citation_id\"]\n        # 잘못된 ID나 중복 ID는 오류로 처리\n        if type(cid) is not int or cid \u003c= 0:\n            raise RagServiceError(\"invalid_source_id\")\n        if cid in by_id:\n            raise RagServiceError(\"duplicate_source_id\")\n        # 응답에 사용할 네 출처 필드만 보관\n        by_id[cid] = {key: metadata[key] for key in fields}\n    return by_id","desc":"by_id는 ID로 원문 정보를 찾는 딕셔너리입니다. {key: metadata[key] for key in fields}는 정한 네 필드만 복사합니다. 같은 ID가 서로 다른 문서를 가리키지 않도록 중복은 오류로 둡니다. pipeline_version의 현재 여부는 기존 검색 조건에서 확인하며 이 반환 구조에 추가 조회를 요구하지 않습니다.","highlighted":["\u003cspan class=\"py-keyword\">def\u003c/span> \u003cspan class=\"py-function\">index_sources\u003c/span>(included_docs):","    fields = (\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">citation_id\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>, \u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">doc_id\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>, \u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">source_version\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>,","              \u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">source_locator\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>)","    \u003cspan class=\"py-comment\"># 출처 ID로 원문 정보를 찾을 인덱스\u003c/span>","    by_id = {}","    \u003cspan class=\"py-keyword\">for\u003c/span> doc in included_docs:","        metadata = doc.metadata","        cid = metadata[\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">citation_id\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>]","        \u003cspan class=\"py-comment\"># 잘못된 ID나 중복 ID는 오류로 처리\u003c/span>","        \u003cspan class=\"py-keyword\">if\u003c/span> type(cid) is not int or cid &lt;= \u003cspan class=\"py-number\">0\u003c/span>:","            \u003cspan class=\"py-keyword\">raise\u003c/span> RagServiceError(\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">invalid_source_id\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>)","        \u003cspan class=\"py-keyword\">if\u003c/span> cid in by_id:","            \u003cspan class=\"py-keyword\">raise\u003c/span> RagServiceError(\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">duplicate_source_id\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>)","        \u003cspan class=\"py-comment\"># 응답에 사용할 네 출처 필드만 보관\u003c/span>","        by_id[cid] = {key: metadata[key] \u003cspan class=\"py-keyword\">for\u003c/span> key in fields}","    \u003cspan class=\"py-keyword\">return\u003c/span> by_id"]},"systemLocation":true},{"id":"ch8-generate-from-context","chapter":8,"kind":"code","title":"서비스 조립 2/3 · 근거가 있을 때 생성·검증합니다","claim":"빈 Context는 직접 정보 부족으로 반환하고 실제 생성 결과는 receive_bundle을 반드시 거칩니다.","left":"입력: 질문, Context, 출처 인덱스의 ID 집합, 앞 장의 generation Runnable. 로컬 validate_answer·receive_bundle을 사용합니다.","right":"출력: 검증된 KnowledgeAnswer. API·어댑터 호출 예외는 generation_error이며 정보 부족으로 바뀌지 않습니다.","code":{"lang":"python","title":"generate_from_context · 빈 근거와 호출 실패 분리","raw":"def generate_from_context(question, context, provided_ids, generation):\n    # 근거가 없으면 모델 호출 없이 정보 부족을 반환\n    if not context:\n        return validate_answer({\n            \"status\": \"insufficient_context\",\n            \"answer\": NO_ANSWER,\n            \"source_ids\": [],\n            \"missing_information\":\n                \"현재 검색 조건과 Context 예산에서 답할 근거를 확보하지 못했습니다.\",\n        }, set())\n    try:\n        # 근거가 있을 때만 질문·Context로 답변 요청\n        bundle = generation.invoke({\n            \"question\": question,\n            \"context\": context,\n        })\n    except Exception as exc:\n        raise RagServiceError(\"generation_error\") from exc\n    # 출력 조건과 제공 출처 ID를 검사한 결과만 반환\n    return receive_bundle(bundle, provided_ids)","desc":"return으로 빈 Context 분기를 끝내므로 그 경우 모델을 호출하지 않습니다. generation.invoke에는 Prompt가 요구하는 question과 context 두 키만 전달합니다. 포함 문서의 ID 집합은 별도로 보관하여 receive_bundle에 넘깁니다. 오류 원인은 from exc로 이어지며 고정 오류 코드로 전달합니다.","highlighted":["\u003cspan class=\"py-keyword\">def\u003c/span> \u003cspan class=\"py-function\">generate_from_context\u003c/span>(question, context, provided_ids, generation):","    \u003cspan class=\"py-comment\"># 근거가 없으면 모델 호출 없이 정보 부족을 반환\u003c/span>","    \u003cspan class=\"py-keyword\">if\u003c/span> not context:","        \u003cspan class=\"py-keyword\">return\u003c/span> validate_answer({","            \u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">status\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>: \u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">insufficient_context\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>,","            \u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">answer\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>: NO_ANSWER,","            \u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">source_ids\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>: [],","            \u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">missing_information\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>:","                \u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">현재 검색 조건과 Context 예산에서 답할 근거를 확보하지 못했습니다.\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>,","        }, set())","    \u003cspan class=\"py-keyword\">try\u003c/span>:","        \u003cspan class=\"py-comment\"># 근거가 있을 때만 질문·Context로 답변 요청\u003c/span>","        bundle = generation.invoke({","            \u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">question\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>: question,","            \u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">context\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>: context,","        })","    \u003cspan class=\"py-keyword\">except\u003c/span> Exception \u003cspan class=\"py-keyword\">as\u003c/span> exc:","        \u003cspan class=\"py-keyword\">raise\u003c/span> RagServiceError(\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">generation_error\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>) \u003cspan class=\"py-keyword\">from\u003c/span> exc","    \u003cspan class=\"py-comment\"># 출력 조건과 제공 출처 ID를 검사한 결과만 반환\u003c/span>","    \u003cspan class=\"py-keyword\">return\u003c/span> receive_bundle(bundle, provided_ids)"]},"references":[{"label":"LangChain · with_structured_output","url":"https://reference.langchain.com/python/langchain-openai/chat_models/base/ChatOpenAI/with_structured_output"}]},{"id":"ch8-make-rag-service","chapter":8,"kind":"code","title":"서비스 조립 3/3 · 검색부터 sources까지 연결합니다","claim":"Retriever를 한 번 호출하고 실제 선택한 문서로 생성 입력·검증·출처 응답을 일관되게 만듭니다.","left":"전제: 검증된 요청 딕셔너리, retriever·generation, build_context, 앞 두 화면의 함수. max_chars는 서비스 설정이며 Token 수가 아닙니다.","right":"출력: answer_question(req) 함수. 결과는 {result: 네 필드, sources: 서버 출처 목록}이며 예외는 RagServiceError로 구분합니다.","code":{"lang":"python","title":"make_rag_service · 실제 순서가 보이는 조립","raw":"def make_rag_service(retriever, generation, max_chars=600):\n    def answer_question(req):\n        try:\n            # 질문과 검색 조건으로 후보 문서를 가져옴\n            docs = retriever.invoke(req)\n        except Exception as exc:\n            raise RagServiceError(\"retrieval_error\") from exc\n        try:\n            # 선택한 Context와 허용 출처를 함께 구성\n            context, included_docs = build_context(\n                docs, max_items=req[\"context_k\"], max_chars=max_chars)\n            by_id = index_sources(included_docs)\n        except RagServiceError:\n            raise\n        except Exception as exc:\n            raise RagServiceError(\"context_error\") from exc\n        # 근거 부족 분기와 생성 결과 검증을 처리\n        obj = generate_from_context(\n            req[\"query\"], context, set(by_id), generation)\n        # 검사를 통과한 인용 ID의 원문 정보만 응답\n        sources = [by_id[cid] for cid in obj.source_ids]\n        return {\"result\": obj.model_dump(), \"sources\": sources}\n    return answer_question","desc":"Factory는 필요한 부품을 받아 호출 가능한 함수를 만듭니다. 안쪽 answer_question은 retriever와 generation을 기억합니다. set(by_id)는 실제 포함 ID 집합이며, sources는 검증된 obj.source_ids에 해당하는 항목만 고릅니다. 이 순서는 고정된 RAG Workflow이고, LLM이 다음 도구를 선택하는 Agent loop는 아닙니다.","highlighted":["\u003cspan class=\"py-keyword\">def\u003c/span> \u003cspan class=\"py-function\">make_rag_service\u003c/span>(retriever, generation, max_chars=\u003cspan class=\"py-number\">600\u003c/span>):","    \u003cspan class=\"py-keyword\">def\u003c/span> \u003cspan class=\"py-function\">answer_question\u003c/span>(req):","        \u003cspan class=\"py-keyword\">try\u003c/span>:","            \u003cspan class=\"py-comment\"># 질문과 검색 조건으로 후보 문서를 가져옴\u003c/span>","            docs = retriever.invoke(req)","        \u003cspan class=\"py-keyword\">except\u003c/span> Exception \u003cspan class=\"py-keyword\">as\u003c/span> exc:","            \u003cspan class=\"py-keyword\">raise\u003c/span> RagServiceError(\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">retrieval_error\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>) \u003cspan class=\"py-keyword\">from\u003c/span> exc","        \u003cspan class=\"py-keyword\">try\u003c/span>:","            \u003cspan class=\"py-comment\"># 선택한 Context와 허용 출처를 함께 구성\u003c/span>","            context, included_docs = build_context(","                docs, max_items=req[\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">context_k\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>], max_chars=max_chars)","            by_id = index_sources(included_docs)","        \u003cspan class=\"py-keyword\">except\u003c/span> RagServiceError:","            \u003cspan class=\"py-keyword\">raise\u003c/span>","        \u003cspan class=\"py-keyword\">except\u003c/span> Exception \u003cspan class=\"py-keyword\">as\u003c/span> exc:","            \u003cspan class=\"py-keyword\">raise\u003c/span> RagServiceError(\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">context_error\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>) \u003cspan class=\"py-keyword\">from\u003c/span> exc","        \u003cspan class=\"py-comment\"># 근거 부족 분기와 생성 결과 검증을 처리\u003c/span>","        obj = generate_from_context(","            req[\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">query\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>], context, set(by_id), generation)","        \u003cspan class=\"py-comment\"># 검사를 통과한 인용 ID의 원문 정보만 응답\u003c/span>","        sources = [by_id[cid] \u003cspan class=\"py-keyword\">for\u003c/span> cid in obj.source_ids]","        \u003cspan class=\"py-keyword\">return\u003c/span> {\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">result\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>: obj.model_dump(), \u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">sources\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>: sources}","    \u003cspan class=\"py-keyword\">return\u003c/span> answer_question"]}},{"id":"ch8-request-contract","chapter":8,"kind":"code","title":"요청에는 category와 서로 다른 두 개의 k가 필요합니다","claim":"기존 검색 함수가 요구하는 category와 후보·Context 개수의 범위를 API 입구에서 검사합니다.","left":"입력: JSON 요청 본문. query·category는 필수이며 candidate_k와 context_k는 생략하면 각각 3과 2입니다.","right":"출력: 공백을 제거한 질문과 검증된 RagRequest. 빠진 category, 범위 밖 k, 숫자 문자열 k는 요청 오류입니다.","code":{"lang":"python","title":"RagRequest · 기존 검색 계약에 맞추기","raw":"from pydantic import field_validator\n\nclass RagRequest(BaseModel):\n    model_config = ConfigDict(extra=\"forbid\", strict=True)\n    query: str = Field(min_length=1, max_length=1000)\n    category: Literal[\"학사\", \"시설\", \"지원\"]\n    # 검색 후보 수 상한과 Context 문서 수 상한을 분리\n    candidate_k: int = Field(default=3, ge=1, le=20)\n    context_k: int = Field(default=2, ge=1, le=3)\n\n    # 공백만 입력한 질문도 거부\n    @field_validator(\"query\")\n    @classmethod\n    def nonblank(cls, value):\n        value = value.strip()\n        if not value:\n            raise ValueError(\"빈 질문\")\n        return value","desc":"Literal은 허용 문자열을 정합니다. ge·le는 각각 이상·이하이며 candidate_k는 검색 후보 상한, context_k는 실제 Context 문서 수 상한입니다. 둘은 보장 개수가 아닙니다. @field_validator는 해당 필드를 검사하는 함수를 등록합니다. 이 예제는 category=None의 전체 검색을 새로 추가하지 않습니다.","highlighted":["\u003cspan class=\"py-keyword\">from\u003c/span> pydantic \u003cspan class=\"py-keyword\">import\u003c/span> field_validator","","\u003cspan class=\"py-keyword\">class\u003c/span> \u003cspan class=\"py-type\">RagRequest\u003c/span>(BaseModel):","    model_config = ConfigDict(extra=\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">forbid\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>, strict=\u003cspan class=\"py-keyword\">True\u003c/span>)","    query: str = Field(min_length=\u003cspan class=\"py-number\">1\u003c/span>, max_length=\u003cspan class=\"py-number\">1000\u003c/span>)","    category: Literal[\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">학사\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>, \u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">시설\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>, \u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">지원\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>]","    \u003cspan class=\"py-comment\"># 검색 후보 수 상한과 Context 문서 수 상한을 분리\u003c/span>","    candidate_k: int = Field(default=\u003cspan class=\"py-number\">3\u003c/span>, ge=\u003cspan class=\"py-number\">1\u003c/span>, le=\u003cspan class=\"py-number\">20\u003c/span>)","    context_k: int = Field(default=\u003cspan class=\"py-number\">2\u003c/span>, ge=\u003cspan class=\"py-number\">1\u003c/span>, le=\u003cspan class=\"py-number\">3\u003c/span>)","","    \u003cspan class=\"py-comment\"># 공백만 입력한 질문도 거부\u003c/span>","    @field_validator(\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">query\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>)","    @classmethod","    \u003cspan class=\"py-keyword\">def\u003c/span> \u003cspan class=\"py-function\">nonblank\u003c/span>(cls, value):","        value = value.strip()","        \u003cspan class=\"py-keyword\">if\u003c/span> not value:","            \u003cspan class=\"py-keyword\">raise\u003c/span> ValueError(\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">빈 질문\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>)","        \u003cspan class=\"py-keyword\">return\u003c/span> value"]},"references":[{"label":"Pydantic · Fields","url":"https://docs.pydantic.dev/latest/concepts/fields/"},{"label":"Pydantic · Strict Mode","url":"https://docs.pydantic.dev/latest/concepts/strict_mode/"}]},{"id":"ch8-fastapi-route","chapter":8,"kind":"code","title":"FastAPI는 요청 검사와 서비스 오류의 HTTP 표현을 맡습니다","claim":"동기 경로에서 실제 service를 호출하고 정상 정보 부족과 실행 오류를 다른 HTTP 결과로 전달합니다.","left":"입력: make_rag_service가 만든 service와 RagRequest. 동기 DB·모델 호출을 연결하는 강의 예입니다.","right":"출력: POST /rag/answer 경로가 있는 FastAPI 앱. 정상 answered·insufficient_context는 200, 입력 오류는 422, 알려진 서비스 오류는 502입니다.","code":{"lang":"python","title":"create_app · 실행할 서비스 함수를 주입","raw":"from fastapi import FastAPI, HTTPException\n\ndef create_app(service):\n    app = FastAPI()\n\n    # POST 요청 본문을 RagRequest로 검사\n    @app.post(\"/rag/answer\")\n    def rag_answer(req: RagRequest):\n        try:\n            # 검사된 요청을 dict로 바꿔 RAG 서비스를 호출\n            return service(req.model_dump())\n        # 서비스 실패를 HTTP 오류 코드로 전달\n        except RagServiceError as exc:\n            raise HTTPException(status_code=502, detail=str(exc)) from exc\n\n    return app","desc":"def 경로는 FastAPI가 thread pool에서 실행하므로 동기 DB·모델 호출을 그대로 연결하는 이 예제에 맞습니다. 여기서는 RagServiceError를 502로 매핑하며 detail에는 정한 오류 코드만 둡니다. 요청마다 새 DB 연결을 여는 앞 장의 connect_db 계약을 유지하고 전역 연결 하나를 공유하지 않습니다.","highlighted":["\u003cspan class=\"py-keyword\">from\u003c/span> fastapi \u003cspan class=\"py-keyword\">import\u003c/span> FastAPI, HTTPException","","\u003cspan class=\"py-keyword\">def\u003c/span> \u003cspan class=\"py-function\">create_app\u003c/span>(service):","    app = FastAPI()","","    \u003cspan class=\"py-comment\"># POST 요청 본문을 RagRequest로 검사\u003c/span>","    @app.post(\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">/rag/answer\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>)","    \u003cspan class=\"py-keyword\">def\u003c/span> \u003cspan class=\"py-function\">rag_answer\u003c/span>(req: RagRequest):","        \u003cspan class=\"py-keyword\">try\u003c/span>:","            \u003cspan class=\"py-comment\"># 검사된 요청을 dict로 바꿔 RAG 서비스를 호출\u003c/span>","            \u003cspan class=\"py-keyword\">return\u003c/span> service(req.model_dump())","        \u003cspan class=\"py-comment\"># 서비스 실패를 HTTP 오류 코드로 전달\u003c/span>","        \u003cspan class=\"py-keyword\">except\u003c/span> RagServiceError \u003cspan class=\"py-keyword\">as\u003c/span> exc:","            \u003cspan class=\"py-keyword\">raise\u003c/span> HTTPException(status_code=\u003cspan class=\"py-number\">502\u003c/span>, detail=str(exc)) \u003cspan class=\"py-keyword\">from\u003c/span> exc","","    \u003cspan class=\"py-keyword\">return\u003c/span> app"]},"references":[{"label":"FastAPI · Sync path operation functions","url":"https://fastapi.tiangolo.com/async/#path-operation-functions"},{"label":"FastAPI · Handling Errors","url":"https://fastapi.tiangolo.com/tutorial/handling-errors/"}]},{"id":"ch8-final-wiring","chapter":8,"kind":"code","title":"Embedding·Retriever·Generation·서비스를 실제로 연결합니다","claim":"앞에서 정의한 부품을 조립하면 검색 결과부터 검증된 출처 응답까지 하나의 호출 경로가 됩니다.","left":"전제: 앞 장의 prompt·WireAnswer·make_search_hits·make_retriever와 새 연결을 여는 connect_db. 실제 DB의 현재 자료 공개, E5 준비, OPENAI_API_KEY·지원 모델 LLM_MODEL 설정이 필요합니다.","right":"출력: app 객체. HTML이 이 코드를 실행하는 것은 아니며 서버 실행과 실제 DB·유료 모델 호출은 별도 환경에서 수행합니다.","code":{"lang":"python","title":"Final wiring · 두 모델의 역할을 구분","raw":"import os\nfrom coursekit.live import load_encoder\nfrom langchain_openai import ChatOpenAI\n\n# E5는 검색에 사용할 벡터를 생성\nembedding_model = load_encoder()\nsearch_hits = make_search_hits(embedding_model, connect_db)\nretriever = make_retriever(search_hits)\n# Chat Model은 검색 근거를 읽고 답변을 생성\nchat_model = ChatOpenAI(\n    model=os.environ[\"LLM_MODEL\"], use_responses_api=True,\n    output_version=\"responses/v1\", timeout=30, max_retries=1)\n# 답변 형식을 지정하고 Prompt와 모델을 연결\nstructured_model = chat_model.with_structured_output(\n    WireAnswer, method=\"json_schema\", strict=True, include_raw=True)\ngeneration = prompt | structured_model\n# 검색·생성·검증을 묶어 API에 연결\nservice = make_rag_service(retriever, generation, max_chars=600)\napp = create_app(service)","desc":"embedding_model은 기존 E5 검색용이고 chat_model은 답변 생성용입니다. |는 Prompt 출력을 다음 Runnable에 전달합니다. coursekit.live는 기존 11/19 프로젝트의 준비 함수를 재사용합니다. DB의 실제 citation_id를 사용하며 교육용 201·202·203이 그대로 존재한다고 가정하지 않습니다. Structured Output 지원 모델과 설치한 어댑터의 반환 계약을 확인합니다.","highlighted":["\u003cspan class=\"py-keyword\">import\u003c/span> os","\u003cspan class=\"py-keyword\">from\u003c/span> coursekit.live \u003cspan class=\"py-keyword\">import\u003c/span> load_encoder","\u003cspan class=\"py-keyword\">from\u003c/span> langchain_openai \u003cspan class=\"py-keyword\">import\u003c/span> ChatOpenAI","","\u003cspan class=\"py-comment\"># E5는 검색에 사용할 벡터를 생성\u003c/span>","embedding_model = load_encoder()","search_hits = make_search_hits(embedding_model, connect_db)","retriever = make_retriever(search_hits)","\u003cspan class=\"py-comment\"># Chat Model은 검색 근거를 읽고 답변을 생성\u003c/span>","chat_model = ChatOpenAI(","    model=os.environ[\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">LLM_MODEL\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>], use_responses_api=\u003cspan class=\"py-keyword\">True\u003c/span>,","    output_version=\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">responses/v1\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>, timeout=\u003cspan class=\"py-number\">30\u003c/span>, max_retries=\u003cspan class=\"py-number\">1\u003c/span>)","\u003cspan class=\"py-comment\"># 답변 형식을 지정하고 Prompt와 모델을 연결\u003c/span>","structured_model = chat_model.with_structured_output(","    WireAnswer, method=\u003cspan class=\"py-string\">\"\u003c/span>\u003cspan class=\"py-string\">json_schema\u003c/span>\u003cspan class=\"py-string\">\"\u003c/span>, strict=\u003cspan class=\"py-keyword\">True\u003c/span>, include_raw=\u003cspan class=\"py-keyword\">True\u003c/span>)","generation = prompt | structured_model","\u003cspan class=\"py-comment\"># 검색·생성·검증을 묶어 API에 연결\u003c/span>","service = make_rag_service(retriever, generation, max_chars=\u003cspan class=\"py-number\">600\u003c/span>)","app = create_app(service)"]},"references":[{"label":"LangChain · ChatOpenAI / Responses API","url":"https://docs.langchain.com/oss/python/integrations/chat/openai#responses-api"},{"label":"LangChain · with_structured_output","url":"https://reference.langchain.com/python/langchain-openai/chat_models/base/ChatOpenAI/with_structured_output"}]},{"id":"ch8-five-query-verification","chapter":8,"kind":"table","title":"다섯 질문으로 답변·출처·정보 부족을 함께 확인합니다","claim":"같은 공개 문서와 설정에서 중간 결과를 확인해야 성공과 실패의 원인을 구분할 수 있습니다.","headers":["질문 · category","기대하는 판단","확인할 연결"],"rows":[["15분 늦으면 어떻게 기록되나요? · 학사","현재 출석 v2: 일반 기준 15분까지 지각, 사전 승인 예외 확인","해당 청크 포함 → 출처 연결 → 숫자·조건 대조"],["과제 파일은 어디에 보관하나요? · 학사","DOC-ASSIGN의 개인 폴더","찾은 본문이 Context와 답변까지 이어지는지"],["내 과제의 정확한 마감 날짜는? · 학사","insufficient_context. 원문에는 날짜가 없음","관련 문서 존재와 답변 가능 여부를 구분"],["회의실을 이용하려면 무엇이 필요한가요? · 시설","DOC-FACILITY의 예약 승인","시설 Filter와 실제 포함 문서의 출처가 일치"],["이번 주말 날씨는 어떤가요? · 학사","제공 문서에 근거가 없으므로 정보 부족","무관한 Top-k를 근거로 날씨를 만들지 않음"]],"note":"이 표는 기대 판단이며 실제 E5·LLM 성능의 측정 결과가 아닙니다. 실행 시 질문·category·두 k·문서 버전, 검색 IDs·포함 IDs·오류 단계를 함께 기록합니다. DB 실패와 빈 Context도 따로 확인하며, API Key나 DB 비밀번호는 기록하지 않습니다."},{"id":"ch8-end-to-end-demo","chapter":8,"kind":"demo","demo":"end-to-end","title":"End-to-end Lab: 요청에서 result와 sources까지 따라갑니다","claim":"같은 요청에서 후보와 Context 수를 바꾸고 최종 출처가 실제 포함 문서에만 연결되는지 확인합니다.","left":[["같은 입력을 따라가기","query·category·candidate_k·context_k를 확인하고 Document 목록 → Context·included_docs → 생성 bundle → 로컬 검사 → sources의 순서로 읽습니다."],["빈 Context와 오류","category나 예산으로 근거를 확보하지 못한 경우와 검색 실패 사례를 구분합니다. 전자는 모델 호출 생략, 후자는 오류 전달이라는 차이를 확인합니다."]],"right":[["출처 연결 확인","result.source_ids와 sources의 citation_id를 대조합니다. 잘린 문서의 ID나 모델이 만든 경로가 sources에 섞이지 않아야 합니다."],["정확한 마감 날짜 질문","과제 안내가 검색되어도 날짜가 없으면 insufficient_context여야 합니다. 답변 status, 빈 출처 목록, missing_information이 함께 맞는지 확인합니다."]],"note":"질문별 검색 순위와 생성 응답은 교육용 고정 사례입니다. Document 매핑·문자 예산 선택·ID 검사·서버 출처 연결은 JavaScript로 계산하며 실제 DB·E5·LLM을 호출하지 않습니다."},{"id":"ch8-practice-guide","chapter":8,"kind":"practice","title":"실습 08 · FastAPI로 RAG 흐름 연결","claim":"본문 골격으로 실제 RAG 서비스를 연결하고 정상·근거 부족·요청 오류·실행 오류를 구분합니다.","after_scene":"ch8-end-to-end-demo","preparation":"본문의 최종 연결 코드와 E5·모델 설정을 준비합니다. 실습 ZIP의 tools/setup_db.py --apply로 제공 문서를 Day26 전용 d26_rag Schema에 저장·공개합니다(11/19 DB를 그대로 사용하지 않음). 정상·근거 부족·입력 오류는 실제 요청으로, 실행 실패는 고정 예시로 확인합니다.","output":"실제 요청의 200·422와 출처, 별도 오류 예시의 502 확인표","levels":[{"folder":"01_basic","name":"기본필수","task":"본문 wiring의 객체·요청 값을 채워 실제 서비스를 연결합니다. 정상·근거 부족·입력 오류 요청의 200/422와 출처를 확인하고, 502 고정 예시와 구분합니다.","result":"실제 Retriever·Chat Model·FastAPI 연결과 result·sources를 확인합니다."},{"folder":"02_intermediate","name":"응용","task":"같은 wiring으로 공통 요청을 실제 확인하고 candidate_k나 context_k 하나의 값을 바꿉니다. 포함 문서와 sources의 ID를 비교하고 실행 오류의 고정 예시도 구분합니다.","result":"실제 요청 결과에서 두 k의 역할과 출처 연결을 확인하며, 실행 실패를 별도로 기록합니다."},{"folder":"03_advanced","name":"심화","task":"같은 wiring으로 공통 요청을 실제 확인한 뒤 빈 Context 또는 Timeout의 제시 예시를 살펴봅니다. 모델 호출 여부와 반환 상태를 설명하고, 실제 결과와 예시 관찰을 구분합니다.","result":"실제 연동 결과와 출처를 확인하고, 생성 생략 또는 호출 실패 처리의 이유를 설명합니다."}],"criterion":"실제 요청의 200·422와 출처 연결을 확인하고, 근거 부족과 별도 실행 오류 예시의 차이를 설명하면 완료입니다.","caution":"DB·모델이 미준비된 경우 앞 화면의 예시를 관찰하되 해당 연동은 미실행으로 표시하고, 고정 응답과 실제 실행 결과를 구분합니다."},{"id":"ch8-next-steps-agent","chapter":8,"kind":"table","title":"다음 검색 개선과 Agent는 오늘의 계약 위에 연결합니다","claim":"오늘의 고정된 RAG Workflow를 유지한 채 검색 전·후의 개선과 후속 도구 호출을 구분합니다.","headers":["학습 단계","추가하는 역할","정확한 연결 위치"],"rows":[["오늘 · RAG Workflow","코드가 검색·Context·생성·검증 순서를 정함","공통 Document·포함 ID·검증된 응답 계약을 유지"],["11/24 · Query Rewrite","대화에서 생략된 대상을 보완해 검색 질문을 다시 구성","Retriever에 질문을 넣기 전"],["11/24 · Reranking","이미 검색한 후보 본문을 질문과 다시 대조하여 순서 결정","Retriever 뒤, 최종 Context 선택 전"],["12/2 · Agent · Tool Calling","LLM이 다음 도구 호출을 제안하고 앱이 인자·권한을 확인해 실행","오늘 Retriever를 읽기 전용 검색 Tool로 감싸 Document를 반환 가능"]],"note":"Agent는 목표와 실행 결과를 바탕으로 다음 행동을 선택하는 제어 구조입니다. 도구 결과를 State에 반영하고 반복·종료를 관리하는 Harness, Memory·MCP는 후속 수업에서 다룹니다. 오늘의 검색·생성 Chain 자체를 전체 Agent 구현이라고 부르지는 않습니다.","references":[{"label":"Anthropic · Building effective agents","url":"https://www.anthropic.com/research/building-effective-agents"}]},{"id":"ch8-final-quiz","chapter":8,"kind":"quiz","title":"전체 확인 · 공통 흐름을 실제 API로 설명합니다","claim":"Basic·Intermediate·Advanced는 같은 흐름을 이해하고 비교·오류 추적의 깊이를 늘리는 목표입니다.","items":[["Basic · candidate_k=3, context_k=2이면 검색한 세 문서를 모델이 모두 읽나요?","아닙니다. build_context가 선택한 최대 두 문서만 읽습니다. 문자 예산이나 실제 후보 수 때문에 더 적을 수 있으며 허용 출처는 included_docs에서 만듭니다."],["Intermediate · Document의 source_locator가 prompt | structured_model의 결과에 자동으로 남나요?","아닙니다. generation의 결과는 raw·parsed·parsing_error 묶음입니다. 서비스가 included_docs의 Metadata를 별도로 보관하고 검증된 source_ids만 서버 출처로 연결합니다."],["Advanced · 검색 Timeout 뒤 빈 문서 목록을 반환하면 HTTP 200 정보 부족 응답으로 끝낼 수 있습니다. 좋은 처리인가요?","아닙니다. 실제 실행 실패를 정보 부족으로 숨기게 됩니다. make_rag_service는 검색 예외를 retrieval_error로, create_app은 알려진 서비스 오류를 502로 전달합니다. 요청 오류·정상 정보 부족·실행 실패를 구분해 기록해야 합니다."]]}],"sceneAliases":{"ch1-component-roles":"ch1-rag-definition","ch1-continuity":"ch1-rag-definition","ch1-workplace-scenario":"ch1-shared-corpus","ch1-indexing-query":"ch4-existing-search-contract"},"glossary":[["Basic RAG","문서 검색 결과를 모델 입력의 근거로 사용해 답변을 생성하는 기본 흐름","출석 규정을 검색한 뒤 질문의 시간 조건에 맞게 답하기"],["Corpus","검색 대상으로 사용하는 문서들의 집합","현재 공개된 출석·과제·시설 안내 문서"],["Category","검색 범위를 나누는 분류 값","학사 질문은 category=\"학사\"로 요청"],["Indexing","검색할 단위와 벡터·출처 정보를 준비해 저장하는 과정","출석 v2 청크를 저장한 뒤 현재 버전으로 공개"],["Query","찾고 싶은 내용을 표현한 검색 요청","“15분 늦으면 어떻게 되나요?”"],["Retriever","질문과 검색 조건에 맞는 문서·청크 후보를 반환하는 역할","출석 질문에 출석 규정의 본문과 출처를 반환"],["Citation","답변이 어떤 자료를 근거로 삼았는지 가리키는 참조","source_ids=[201]을 실제 원문 위치와 연결"],["Summary","주어진 내용의 핵심을 짧게 정리한 결과","출석 규정의 주요 항목을 세 문장으로 정리"],["Fine-tuning","기존 모델을 추가 데이터로 학습해 가중치를 조정하는 과정","특정 형식의 학습 예제로 모델을 추가 학습"],["Hit","검색 결과 목록에 포함된 한 건의 레코드","출석 청크의 본문과 citation_id를 가진 Dictionary"],["citation_id","답변의 source_ids에서 근거를 가리킬 양의 정수 ID","source_ids: [201]"],["chunk_id","하나의 청크를 다른 청크와 구분하는 문자열 ID","같은 청크의 중복 포함 여부를 확인할 때 사용"],["Context","현재 질문에 답하도록 모델에게 제공하는 참고 정보","출처 [201]과 함께 담은 현재 출석 규정 본문"],["Token","모델이 텍스트를 처리할 때 나누는 단위","한글 글자 수와 모델 Token 수는 일치한다고 가정할 수 없음"],["Instruction","애플리케이션이 모델에게 정한 작업·출력·처리 규칙","답을 확인할 근거가 없으면 정보 부족으로 응답"],["Source Data","답변의 사실을 확인하기 위해 제공한 참고 내용","검색한 출석 규정 본문은 참고 자료로 사용"],["Framework","자주 필요한 기능을 미리 구현하고 함께 사용하는 방법을 제공한 개발 도구","메시지 틀·모델 연결·단계 실행을 준비된 구성요소로 사용"],["Package","관련 Python 코드와 기능을 묶어 설치하고 가져올 수 있게 만든 단위","langchain-openai를 준비한 뒤 from langchain_openai import ChatOpenAI"],["invoke","하나의 입력을 해당 구성요소에 전달해 한 번 실행하고 결과를 받는 메서드","Prompt에서는 메시지 작성, Chat Model에서는 모델 호출"],["Input / Output contract","한 단계가 받아야 할 입력과 돌려줘야 할 출력의 형식에 대한 약속","Prompt에 documents 목록 대신 question·context 두 문자열을 전달"],["Document","텍스트 본문과 관련 Metadata를 담는 LangChain 자료 객체","page_content=출석 본문, metadata의 citation_id=201"],["Metadata","본문의 정체성·출처·분류를 설명하는 이름과 값","doc_id=\"DOC-ATTEND\", source_version=\"v2\""],["Input Prefix","Embedding 입력 앞에 붙여 질문·문서의 역할을 알려 주는 문자열","query: 15분 늦으면 어떻게 기록되나요?"],["Database Schema","PostgreSQL에서 테이블을 구분해 담는 이름 공간","d24_adv08의 ingest_chunks와 다른 실습의 테이블을 구분"],["Factory","설정을 받아 사용할 함수나 객체를 만들어 반환하는 함수","모델과 연결 도구를 기억하는 search_hits 생성"],["Tuple","정해진 순서에 따라 여러 값을 담는 자료형","기존 검색의 첫 값은 citation_id, 일곱 번째 값은 distance"],["Adapter","기존 입력·출력을 다른 구성요소가 사용할 형태로 변환하는 연결 코드","검색 Hit를 LangChain Document로 변환"],["ChatPromptTemplate","역할이 있는 메시지와 채울 변수를 정의하여 호출마다 사용할 Prompt를 만드는 객체",     ).join('')}</tr></thead><tbody>${rows.map(row =>
      `<tr class="d26-table-row">${row.map((cell, index) => index === 0
        ? `<th scope="row">${esc(cell)}</th>`
        : `<td>${esc(cell)}</td>`).join('')}</tr>`
    ).join('')}</tbody></table></div>`;
  }

  function cover() {
    return `<section class="lecture-cover" aria-labelledby="lecture-title">
      <p class="cover-course">생성형 AI·LLM 및 RAG 엔지니어링</p>
      <h1 id="lecture-title" class="cover-title"><span class="cover-lead">검색한 문서로 근거 있는 답변 만들기</span><span class="cover-main">Basic RAG &amp; LangChain</span></h1>
      <div class="cover-rule" aria-hidden="true"></div>
      <div class="cover-meta"><div class="cover-session"><strong>DAY 26</strong><span>정규교과 10 / 18</span></div><time datetime="2026-11-23">2026.11.23 (월)</time></div>
    </section>`;
  }

  function contents() {
    return `<section class="keyword-contents" aria-labelledby="contents-title"><h1 id="contents-title">목차</h1><div class="contents-grid">${D.chapters.map(chapter => {
      const index = D.scenes.findIndex(scene => scene.chapter === chapter.number);
      const keywords = Array.isArray(chapter.keywords) ? chapter.keywords.join(' · ') : chapter.description;
      return `<button class="contents-item" data-jump="${index}" aria-label="${String(chapter.number).padStart(2, '0')} ${esc(chapter.title)}로 이동"><span class="contents-number">${String(chapter.number).padStart(2, '0')}</span><span class="contents-copy"><strong>${esc(chapter.title)}</strong><span class="contents-keywords">${esc(keywords)}</span></span></button>`;
    }).join('')}</div></section>`;
  }

  function codeSection(scene) {
    const code = scene.code;
    const languageKey = String(code.lang || 'python').toLowerCase();
    const language = {python: 'Python', sql: 'SQL', json: 'JSON', text: 'Text'}[languageKey] || code.lang;
    const fileMark = {python: 'py', sql: 'sql', json: '{}', text: 'txt'}[languageKey] || languageKey;
    const lines = Array.isArray(code.highlighted) ? code.highlighted : code.raw.split('\n').map(esc);
    return `<div class="io-strip"><div><b>들어오는 것 · 입력 / 전제</b><span>${esc(scene.left)}</span></div><div><b>여기서 하는 일</b><span>${esc(code.title)}</span></div><div><b>다음으로 넘길 것 · 출력 / 관찰</b><span>${esc(scene.right)}</span></div></div>
      <section class="inline-python" aria-label="본문 ${esc(language)} 코드"><section class="python-block" data-code-key="${esc(scene.id)}" aria-label="${esc(language)} · ${esc(code.title)}"><header class="python-editor-bar"><span class="python-tab"><span class="python-file-mark" aria-hidden="true">${esc(fileMark)}</span>${esc(language)}</span><h3>${esc(code.title)}</h3><button class="small d26-copy" data-code="${esc(scene.id)}" aria-label="${esc(scene.title)} 코드 복사">코드 복사</button></header><pre><code class="python-source" aria-label="${esc(language)} 소스코드">${lines.map((line, index) =>
        `<span class="python-line" data-line="${index + 1}">${line || '<br>'}</span>`
      ).join('\n')}</code></pre></section><p class="template-note">${esc(code.desc)}</p></section>`;
  }

  function learningGoals(scene) {
    return `<div class="grid3">${scene.rows.map((row, index) =>
      `<section class="card level${index === 0 ? ' baseline' : ''}"><h2>${esc(row[0])}</h2><p><b>${esc(scene.headers[1])}</b><br>${esc(row[1])}</p><p><b>${esc(scene.headers[2])}</b><br>${esc(row[2])}</p></section>`
    ).join('')}</div>${scene.note ? `<p class="smalltext muted spaced">${esc(scene.note)}</p>` : ''}`;
  }

  function demoSection(scene) {
    const renderDemo = C.demos?.[scene.demo];
    if (typeof renderDemo !== 'function') throw new Error(`Missing demo renderer: ${scene.demo}`);
    const state = C.state?.[scene.demo] ?? C.defaults?.[scene.demo];
    const title = D.demoTitles?.[scene.demo] || scene.demo;
    return `<section class="d26-demo" data-demo-root="${esc(scene.demo)}"><header class="d26-demo-head row between"><div class="row"><strong>${esc(title)}</strong><span class="chip outline">OFFLINE · 교육용 시연</span></div><button class="small" data-reset-demo="${esc(scene.demo)}">초기값</button></header><div class="d26-demo-body">${renderDemo(state)}</div></section>
      <details class="teaching-detail" data-detail-key="${esc(scene.id)}-observe"><summary>시연에서 관찰할 것</summary><div class="detail-content"><div class="cols d26-demo-explain"><section>${pairs(scene.left, 'h3')}</section><section>${pairs(scene.right, 'h3')}</section></div></div></details>${scene.note ? `<p class="smalltext muted spaced">${esc(scene.note)}</p>` : ''}`;
  }

  function practiceSection(scene) {
    return `<section class="lesson-return"><div><h2>실습 준비와 산출물</h2><p><b>입력·준비:</b> ${esc(scene.preparation)}<br><b>남길 결과:</b> ${esc(scene.output)}</p></div><button data-action="atlasOpen" class="primary">같은 지도에서 확인</button></section>
      <p class="smalltext muted">세 수준 중 하나를 선택합니다. 모든 수준의 공통 목표는 같으며, 직접 완성할 범위와 확인할 조건을 조절합니다.</p>
      <div class="grid3">${scene.levels.map((level, index) => `<section class="card level${index === 0 ? ' baseline' : ''}"><h2>${esc(level.name)}</h2><h3>${esc(level.folder)}</h3><p>${esc(level.task)}</p><p><b>확인할 결과</b><br>${esc(level.result)}</p></section>`).join('')}</div>
      <div class="action-box spaced"><h2>공통 완료 기준</h2><p>${esc(scene.criterion)}</p></div>
      <p class="smalltext muted spaced"><b>주의할 점:</b> ${esc(scene.caution)}</p>`;
  }

  function renderScene(scene) {
    if (scene.kind === 'cover') return cover();
    if (scene.kind === 'contents') return contents();
    let body = `<header class="scene-head"><h1>${esc(scene.title)}</h1><p>${esc(scene.claim)}</p></header>`;
    if (scene.systemLocation) body += C.chapterLocation(scene);
    if (scene.kind === 'architecture') {
      body += C.renderArchitecture(scene);
    } else if (scene.kind === 'concept') {
      body += `<div class="concept-grid"><div class="concept-explanation">${pairs(scene.left)}</div><section class="concept-example">${pairs(scene.right)}${scene.example ? `<pre>${esc(scene.example)}</pre>` : ''}</section></div>${scene.distinction ? `<p class="concept-distinction">${esc(scene.distinction)}</p>` : ''}`;
    } else if (scene.kind === 'table') {
      body += scene.id === 'ch8-learning-goals'
        ? learningGoals(scene)
        : comparisonTable(scene.headers, scene.rows) + (scene.note ? `<p class="smalltext muted spaced">${esc(scene.note)}</p>` : '');
    } else if (scene.kind === 'code') {
      body += codeSection(scene);
      if (scene.walkthrough?.length) {
        body += `<section class="spaced"><h2>코드가 실행되는 순서</h2>${comparisonTable(['확인할 단계', '실제로 하는 일'], scene.walkthrough)}</section>`;
      }
    } else if (scene.kind === 'quiz') {
      body += scene.items.map(([question, answer], index) =>
        `<section class="quiz-item"><p><strong>${String(index + 1).padStart(2, '0')}.</strong> ${esc(question)}</p><details data-detail-key="${esc(scene.id)}-quiz-${index}"><summary>생각한 뒤 해설 보기</summary><div class="answer-box">${esc(answer)}</div></details></section>`
      ).join('');
    } else if (scene.kind === 'glossary') {
      body += terms(scene.terms, true);
    } else if (scene.kind === 'demo') {
      body += demoSection(scene);
    } else if (scene.kind === 'practice') {
      body += practiceSection(scene);
    } else {
      throw new Error(`Unsupported scene kind: ${scene.kind}`);
    }
    if (scene.kind !== 'glossary') body += terms(scene.terms);
    return body + references(scene.references);
  }

  function renderGlossary(query = '') {
    const search = String(query).toLowerCase().trim();
    const matches = D.glossary.filter(row => !search || row.join(' ').toLowerCase().includes(search));
    return `<p class="smalltext muted">${matches.length} / ${D.glossary.length}개 용어 · 이름은 영어로 유지하고, 의미와 예시를 함께 읽습니다.</p>${terms(matches)}`;
  }

  function renderHelp(reading = false) {

      ['전체화면 / 사용 안내', 'F / ?'],

    ];
    return `<div class="d26-dialog-text"><h3>화면 탐색</h3><p>이 파일 하나를 브라우저에서 열면 강의 화면과 시연을 사용할 수 있습니다. 강의 본문·스크립트·스타일은 파일 안에 포함되어 있습니다. 원문 참고 링크를 열 때는 인터넷 연결이 필요합니다.</p>${comparisonTable(['동작', '방법'], shortcuts)}<p>입력 칸을 편집할 때는 화면 이동 단축키를 적용하지 않습니다. 각 Chapter 첫 화면에서는 같은 전체그림에서 현재 배우는 기술을 강조하고 현업 역할과 앞뒤 연결을 설명합니다. 지도를 접으면 본문을 이어서 읽을 수 있습니다. 전체 지도에서도 현재 설명 위치를 확인할 수 있습니다. 노드를 누르면 설명과 관련 개념으로 이동하는 버튼이 나타납니다. 핵심요약은 별도 창에서 열리고 그 창의 인쇄 버튼으로 출력합니다. 전체 읽기는 아래 버튼으로 열며, 이 안내의 ‘한 화면씩’으로 돌아옵니다.</p><div class="row spaced"><button data-action="glossary">용어사전</button><button data-action="read" aria-pressed="${Boolean(reading)}">${reading ? '한 화면씩' : '전체 읽기'}</button></div><h3>시연에서 실제로 계산하는 것</h3><p>Context 선택, Document 변환, Prompt 구성, Metadata Filter, 출처·상태 규칙과 실행 분기는 JavaScript로 계산합니다. Python·LangChain·E5·PostgreSQL·LLM API는 호출하지 않습니다. 검색 순위와 생성 답변은 화면에 표시한 고정 교육용 사례입니다. API Key를 입력하거나 비용을 지불할 필요가 없습니다.</p><h3>자료의 기준</h3><p><b>강의자료_기본템플릿.html</b>의 색상·글꼴·제목 및 본문 배치·코드 편집기·시연 안내 형식·하단 표기를 사용합니다. 11/17 출력 계약과 11/19 E5·문서 버전·검색 구조를 바탕으로 Basic RAG를 연결하고, 같은 흐름을 LangChain 구성요소에 대응합니다. 11/20은 개인 프로젝트로 진행했으며, 이번에는 원래 예정했던 Basic RAG를 학습합니다.</p><p>201·202·203 등의 ID는 강의용입니다. 출석·과제·시설 문서는 제공된 실습의 교육용 문서이며 실제 기관 정책을 뜻하지 않습니다. 모든 학생이 이전 단계의 DB나 과제를 같은 수준까지 완성했다고 가정하지 않습니다.</p><h3>코드 읽기</h3><p>독립 실행 가능한 순수 함수와 DB·모델·SDK 준비가 필요한 발췌를 구분해 표시했습니다. 코드 복사 버튼은 본문 코드만 복사합니다. 코드가 보인다는 이유로 HTML에서 Python이나 SQL이 실행되는 것은 아닙니다.</p><h3>실습 안내</h3><p>각 Chapter의 시연 다음에 실습 안내가 있습니다. 01_basic·02_intermediate·03_advanced 중 한 수준을 선택하고, 공통 입력과 완료 기준을 확인합니다. 수행한 코드와 결과를 설명하며, 시연 버튼을 누른 것만으로 구현 실습을 완료했다고 판단하지 않습니다.</p><h3>원문 참고</h3><ul>${uniqueReferences.map(reference =>

function renderReviewDocument() {
  const ids = chapter => (globalThis.LECTURE_DATA?.scenes || C.data?.scenes || []).filter(s=>s.chapter===chapter).map(s=>s.id);
  const sheets=[
    sheet(1,'review-rag','RAG: 검색한 근거로 답변한다',ids(1),`
      <p class="definition"><b>RAG · Retrieval-Augmented Generation</b>은 질문과 관련된 외부 자료를 검색하고, 선택한 근거를 LLM 입력에 넣어 답변을 생성하는 구성입니다.</p>
      <figure aria-label="RAG의 검색, Context 구성, 생성, 검증 흐름"><div class="flow" style="--n:4">
        <div class="flow-node today"><strong>Retrieve</strong><span>질문에 맞는 문서</span></div>
        <div class="flow-node today"><strong>Context</strong><span>실제로 제공할 근거</span></div>
        <div class="flow-node primary"><strong>Generate</strong><span>근거를 이용한 답변</span></div>
        <div class="flow-node human"><strong>Validate</strong><span>형식·출처·내용 확인</span></div>
      </div></figure>
      <div class="two-col"><div class="inline-def"><b>Indexing</b><p>문서를 나누고 검색에 필요한 정보와 함께 저장하는 준비 단계입니다.</p></div><div class="inline-def"><b>Query 처리</b><p>질문마다 검색·Context 구성·생성·검증을 수행합니다.</p></div></div>
      <div class="lesson"><strong>검색한 문서는 이번 답변의 입력 근거로 사용합니다.</strong> 관련 문서가 있어도 질문의 답이 그 안에 있는지 확인해야 합니다.</div>`),
    sheet(2,'review-document','Document · Retriever',ids(4),`
      <p class="definition"><b>Document</b>는 본문과 Metadata를 담는 자료형입니다. <b>Retriever</b>는 질문에 필요한 문서를 찾아 반환하는 역할입니다.</p>
      <figure aria-label="Document의 본문과 출처 Metadata"><div class="two-col">
        <div class="light-box"><h3>page_content</h3><p>모델의 근거로 사용할 문서 본문</p></div>
        <div class="light-box"><h3>metadata</h3><p>인용 ID·청크 ID·문서·버전·원문 위치</p></div>
      </div></figure>
      <p class="subtle">기존 E5 입력 규칙과 SQL의 현재 버전·Category·준비 상태 조건을 적용한 검색 결과를 Document로 연결합니다.</p>
      <div class="lesson"><strong>본문과 출처를 처음부터 함께 전달합니다.</strong> Document로 표현하는 것만으로 검색 조건과 근거 검증이 자동 적용되지는 않습니다.</div>`),
    sheet(3,'review-context','Context · Prompt',ids(2).concat(ids(5)),`
      <p class="definition"><b>Context</b>는 이번 답변을 위해 실제로 제공한 근거입니다. <b>ChatPromptTemplate</b>은 질문과 Context 같은 변수를 채워 모델 입력을 구성합니다.</p>
      <figure aria-label="검색 후보와 Context, 모델 입력의 구분"><div class="flow" style="--n:3">
        <div class="flow-node"><strong>검색 후보</strong><span>Retriever가 반환</span></div>
        <div class="flow-node today"><strong>선택한 Context</strong><span>본문·실제 포함 ID</span></div>
        <div class="flow-node primary"><strong>Prompt</strong><span>규칙·질문·근거</span></div>
      </div></figure>
      <div class="lesson"><strong>실제 포함한 근거의 ID를 따로 보관합니다.</strong> 길이 제한의 글자 수와 모델의 Token 수를 구분하고, 규칙과 참고 자료를 나누어 구성합니다.</div>`),
    sheet(4,'review-chain','LangChain · Runnable · Chain',ids(3).concat(ids(6)),`
      <p class="definition"><b>LangChain</b>은 LLM 애플리케이션의 구성요소를 연결하는 개발 Framework입니다. <b>Runnable</b>은 입력을 받아 작업을 실행하는 단위이며, 순차 <b>Chain</b>은 앞 단계의 출력을 다음 단계에 전달합니다.</p>
      <figure aria-label="Prompt와 모델을 연결하는 순차 실행"><div class="flow" style="--n:3">
        <div class="flow-node today"><strong>입력 dict</strong><span>question · context</span></div>

        <div class="flow-node primary"><strong>Model</strong><span>응답 또는 구조화 결과</span></div>
      </div></figure>
      <p class="subtle"><b>|</b>는 연결을 준비하고 <b>invoke()</b>가 실행합니다. 이번 Prompt는 로컬에서 메시지를 만들고 ChatOpenAI는 모델 API를 호출합니다. 공통 호출 방식과 각 단계의 입력 자료형을 구분합니다.</p>

    sheet(5,'review-citation','Citation · Grounding',ids(7),`
      <p class="definition"><b>Citation</b>은 답변이 가리키는 출처입니다. <b>Grounding</b>은 그 원문이 답변의 주장을 실제로 뒷받침하는 관계입니다.</p>
      <figure aria-label="출처 범위 확인과 원문 내용 대조"><div class="question-pair">
        <div class="question-card"><h3>출처 범위</h3><p>답변의 ID가 <b>실제 Context에 포함된 ID</b>인지 검사합니다.</p></div>
        <div class="question-card"><h3>근거 내용</h3><p>답변의 숫자·조건·예외가 <b>원문과 맞는지</b> 대조합니다.</p></div>
      </div></figure>
