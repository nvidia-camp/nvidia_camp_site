/* v9: a VS Code-style dark editor for Python source only.
   The lesson canvas, summaries, input controls and source text stay unchanged. */
.inline-python{
  --editor-bg:#1e1e1e;--editor-fg:#d4d4d4;--editor-tabs:#252526;
  --editor-border:#3c3c3c;--editor-accent:#3794ff;--editor-gutter:#999999;
  margin-top:30px;padding-top:0;border-top:0;min-width:0;
}
.inline-python .python-block{
  background:var(--editor-bg);color:var(--editor-fg);
  border:1px solid var(--editor-border);border-radius:8px;
  padding:0;margin:0 0 22px;min-width:0;overflow:hidden;
  box-shadow:0 3px 14px #142d4e12;color-scheme:dark;
}
.python-editor-bar{
  display:flex;align-items:stretch;min-width:0;
  background:var(--editor-tabs);border-bottom:1px solid #333333;
}
.python-tab{
  display:flex;align-items:center;gap:9px;flex:0 0 auto;
  padding:11px 19px 12px;color:#f0f0f0;background:var(--editor-bg);
  border-top:2px solid var(--editor-accent);border-right:1px solid #333333;

  user-select:none;
}
.python-file-mark{
  color:#78b7eb;font:600 12px/1 Consolas,'DejaVu Sans Mono',monospace;
  letter-spacing:-.5px;user-select:none;
}
.inline-python .python-block .python-editor-bar h3{
  font:500 15px/1.6 'Segoe UI','Noto Sans CJK KR','Malgun Gothic',sans-serif;
  color:#c8c8c8;margin:0;padding:11px 18px;align-self:center;
  min-width:0;word-break:keep-all;overflow-wrap:anywhere;
}
.inline-python .python-block pre{
  font-family:'Cascadia Code',Consolas,'D2Coding','Noto Sans Mono CJK KR','DejaVu Sans Mono',monospace;
  font-size:15px;line-height:1.8;font-weight:400;
  color:var(--editor-fg);background:var(--editor-bg);
  padding:18px 0 21px;margin:0;border:0;max-height:none;overflow:visible;
  white-space:normal;tab-size:4;font-variant-ligatures:none;
}
.inline-python .python-block code.python-source{
  display:flex;flex-direction:column;align-items:stretch;
  font:inherit;color:inherit;background:none;border:0;padding:0;

}

.inline-python .py-function{color:#dcdcaa;font-weight:400}

/* Day26 feature adapters for the canonical lecture HTML template.
   Append after the original 55,445-character head stylesheet.
   The template owns the shell, typography, cards, tables, concept layouts,
   front matter, navigation, maps and Python editor. These rules add only
   Day26 controls, result annotations, search, reading and print behavior. */

/* Interactive examples use the template's row, chip, card and heading rules. */
.d26-demo{margin:18px 0;min-width:0}
.d26-demo-head{margin-bottom:18px}
.d26-demo-body{min-width:0}
.d26-controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 18px;margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.d26-control{display:block;flex:1 1 180px;min-width:min(100%,150px);max-width:400px;font-weight:400}
.d26-control.wide{flex-basis:320px;max-width:none}
.d26-control>span{display:block;margin-bottom:7px;font-weight:700;line-height:1.6;overflow-wrap:anywhere}
.d26-control select,.d26-control input[type=text]{min-height:42px}
.d26-control input[type=range]{display:block;min-height:24px}
.d26-control input[type=checkbox]{vertical-align:middle;margin:0 7px 0 0}
.d26-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.d26-split>*{min-width:0}
.d26-pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;max-height:none}
.d26-demo-explain{margin-top:18px}
.d26-demo details{margin:18px 0}
.d26-demo details>summary{cursor:pointer;color:var(--blue);font-weight:600;line-height:1.6}

/* State labels reuse the template's semantic colors and chip proportions. */
.d26-status{display:inline-flex;align-items:center;padding:4px 9px;border-radius:5px;background:var(--pale);color:var(--blue);font-size:13px;font-weight:700;line-height:1.4;white-space:normal;overflow-wrap:anywhere}
.d26-status.ok{background:#e7f3ee;color:var(--ok)}
.d26-status.bad{background:var(--paper);color:var(--bad);box-shadow:inset 0 0 0 1px currentColor}
.d26-status.wait{background:#fff5e7;color:var(--warn)}
.d26-status.neutral{color:var(--muted)}
.d26-metric{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px;padding:12px 0;border-bottom:1px solid var(--line);line-height:1.7}
.d26-metric:last-child{border-bottom:0}

.d26-source-button{margin:10px 6px 0 0}

.d26-note{margin:18px 0;color:var(--muted);line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}

.d26-instruction{display:block;margin:18px 0 8px;color:var(--muted);line-height:1.6}

/* This is an additional editor action, not a replacement editor theme. */
.d26-copy{align-self:center;flex:0 0 auto;margin:8px 12px 8px auto;padding:5px 9px;border-color:#727272;background:#333333;color:#f0f0f0;font-size:13px;line-height:1.4;white-space:nowrap}

/* Reference disclosures and notation use the template's existing components. */

    </g></g></svg></div></figure><div class="d26-arch-explanations d26-arch-three"><section><h2>Retrieval · 근거 찾기</h2><p>Retriever는 질문과 검색 조건으로 관련 청크 후보를 반환합니다. Context Builder는 그중 사용할 본문을 고르고 실제 포함한 출처 ID를 남깁니다.</p></section><section><h2>Augmented · 입력 보강</h2><p>Context는 선택한 참고 정보입니다. Prompt는 답변 규칙·질문·Context를 합친 모델 입력입니다. 이번 입력을 보강하며 모델 가중치를 학습시키지는 않습니다.</p></section><section><h2>Generation · 답변 생성</h2><p>Generator가 Prompt를 받아 답변을 만듭니다. Validator는 반환값의 형식과 출처 규칙을 검사합니다. 답변이 원문의 조건·예외를 지키는지는 별도로 대조합니다.</p></section></div><p class="d26-arch-note">Citation은 답변이 근거로 삼은 자료를 가리키는 참조입니다. 검색 후보 전체가 아니라 실제 Context에 포함한 ID를 보관해야 합니다. ID 검사를 통과해도 답변 내용이 근거에 맞는지는 별도로 확인합니다.</p><details class="teaching-detail d26-refs"><summary>원문 참고 · 1개</summary><div class="detail-content"><ul><li><a href="https://docs.langchain.com/oss/python/deepagents/retrieval" target="_blank" rel="noopener noreferrer">LangChain · Retrieval / 2-Step RAG</a></li></ul></div></details></div></article><article class="d26-reader-section concept-stage"><div class="d26-reader-label">4 / 82</div><div><section class="d26-rag-source-page"><header class="scene-head"><h1>RAG는 필요한 자료를 찾아 답변의 근거로 제공합니다</h1><p>RAG(Retrieval-Augmented Generation)는 질문과 관련된 자료를 검색하고, 그 내용을 LLM의 입력에 함께 넣어 답변을 생성하는 방식입니다.</p></header><p class="d26-rag-source-lead">LLM이 알지 못하는 사내 규정이나 최신 정보를 찾아, 이번 질문의 참고 자료로 제공합니다.</p><figure class="d26-rag-source-figure"><svg xmlns="http://www.w3.org/2000/svg" class="d26-rag-source-svg" viewbox="0 0 1120 440" role="img" aria-labelledby="d26-rag-sources-title d26-rag-sources-desc">

</svg></figure><div class="d26-rag-source-notes"><p><b>조회 방식과 저장소</b>PostgreSQL + pgvector에서는 한 DB에서 SQL 조회와 Vector Search를 함께 사용할 수 있습니다.</p><p><b>오늘 배우는 부분</b>문서 청크를 Vector Search로 찾고 LLM에 전달합니다. 검색한 근거가 답변을 뒷받침하는지도 확인합니다.</p></div><details class="teaching-detail d26-rag-source-explain" data-detail-key="ch1-rag-what-and-why-explain"><summary>개념 설명과 회의실 예시 다시 보기</summary><div class="detail-content"><div class="concept-grid"><div class="concept-explanation"><section><h2>왜 필요한가</h2><p>LLM이 우리 회사의 최신 규정이나 내부 문서를 자동으로 아는 것은 아닙니다. 회사의 기준으로 답하게 하려면, 질문에 필요한 자료를 찾아 모델이 읽을 입력에 함께 제공해야 합니다.</p></section><section><h2>어떤 자료를 사용하는가</h2><p>회사 규정, 제품 매뉴얼, 리서치 문서, DB에 저장된 본문 등을 사용합니다. 여기서 외부 지식은 모델 밖에 있는 자료를 뜻하며, 회사 내부 문서도 포함합니다. 앞서 만든 문서 청크와 검색 기능이 이 자료를 찾는 데 쓰입니다.</p></section></div><section class="concept-example"><section><h2>한 질문이 처리되는 순서</h2><p>Retrieval에서 관련 자료를 찾고, Augment 단계에서 질문에 참고 자료를 더합니다. Generation에서 LLM이 그 입력을 읽고 답변을 만듭니다. 서비스 코드가 검색과 모델 호출을 연결합니다.</p></section><section><h2>회의실 안내로 이해하기 · 교육용 예시</h2><p>아래처럼 질문에 필요한 규정을 찾아 함께 전달하면, 모델이 그 규정을 참고해 답변할 수 있습니다.</p></section><pre>질문: 회의실을 어떻게 이용하나요?
검색한 문서: 회의실은 예약 승인 후 이용합니다.
모델 입력: 질문 + 찾은 문서 + 답변 규칙
답변 예: 예약 승인을 받은 후 이용합니다.</pre></section></div><p class="concept-distinction">RAG는 검색과 생성을 연결하는 서비스 구성 방식입니다. 오늘은 기존 LLM에 질문마다 참고 자료를 제공하며, 모델을 다시 학습시키지 않습니다. 자료가 틀리거나 부족하면 답변도 부정확할 수 있어 원문과 대조해야 합니다.</p><details class="teaching-detail d26-refs"><summary>원문 참고 · 3개</summary><div class="detail-content"><ul><li><a href="https://aws.amazon.com/what-is/retrieval-augmented-generation/" target="_blank" rel="noopener noreferrer">AWS · What is Retrieval-Augmented Generation?</a></li><li><a href="https://docs.langchain.com/oss/python/deepagents/retrieval" target="_blank" rel="noopener noreferrer">LangChain · Retrieval / 2-Step RAG</a></li><li><a href="https://github.com/pgvector/pgvector" target="_blank" rel="noopener noreferrer">pgvector · PostgreSQL에서 Vector Search 사용</a></li></ul></div></details></div></details></section></div></article><article class="d26-reader-section"><div class="d26-reader-label">5 / 82</div><div><header class="scene-head"><h1>국내외 5개 기업은 문서·Web 근거를 업무 답변에 활용합니다</h1><p>국내 3개와 해외 2개 사례입니다. 검색하는 자료와 실제 적용 업무를 연결해 살펴봅니다.</p></header><div class="table-wrap axis-table d26-case-table d26-neutral-table"><table><thead><tr><th scope="col">기업 · 서비스와 사용자</th><th scope="col">찾아 쓰는 자료</th><th scope="col">RAG로 지원하는 업무</th></tr></thead><tbody><tr class="d26-table-row"><th scope="row">Morgan Stanley · Assistant

KT 구성원</th><td>사규·업무 매뉴얼·인사복지·보안정책 등 사내 자료</td><td>관련 문서를 검색해 LLM 답변 생성. 업무 기준·절차와 근거 문서 확인.</td></tr></tbody></table></div><p class="smalltext muted spaced">공통 구조는 필요한 자료를 찾아 모델 입력에 넣고 답변하는 것입니다. 기업별 전체 시스템과 사용 모델은 다릅니다. 다음 페이지부터는 교육용 출석·과제·시설 문서로 이 공통 구조를 구현합니다.</p><details class="teaching-detail d26-refs"><summary>원문 참고 · 6개</summary><div class="detail-content"><ul><li><a href="https://www.morganstanley.com/press-releases/key-milestone-in-innovation-journey-with-openai" target="_blank" rel="noopener noreferrer">Morgan Stanley 공식 발표 · Assistant와 원문 링크</a></li><li><a href="https://openai.com/index/morgan-stanley/" target="_blank" rel="noopener noreferrer">OpenAI 고객 사례 · Morgan Stanley의 사내 지식 활용</a></li><li><a href="https://careersatdoordash.com/blog/large-language-modules-based-dasher-support-automation/" target="_blank" rel="noopener noreferrer">DoorDash Engineering · RAG 기반 Dasher 지원 구현</a></li><li><a href="https://www.samsungsds.com/kr/insights/samsung-sds-ai-journey.html" target="_blank" rel="noopener noreferrer">삼성SDS 공식 사례 · FabriX 사내 업무 RAG 활용 (2025.10.24)</a></li><li><a href="https://lg.co.kr/media/release/28438" target="_blank" rel="noopener noreferrer">LG 공식 발표 · ChatEXAONE 문서·Web RAG와 임직원 서비스 (2024.12.09)</a></li><li><a href="https://kode.kt.com/blog/article/8410" target="_blank" rel="noopener noreferrer">KT 공식 개발기 · 사내지식검색서비스 K-hub (2025.11.06)</a></li></ul></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">6 / 82</div><div><header class="scene-head"><h1>세 문서의 내용을 같은 기준으로 읽습니다</h1><p>모든 설명은 출석·과제·시설 문서를 사용하며, 자료에 적힌 정보와 적히지 않은 정보를 구분합니다.</p></header><div class="table-wrap axis-table d26-neutral-table"><table><thead><tr><th scope="col">문서 · 예시 ID</th><th scope="col">제공된 본문</th><th scope="col">질문에서 확인할 점</th></tr></thead><tbody><tr class="d26-table-row"><th scope="row">DOC-ATTEND · v2 · 201

6-compare-syntax-comment"># 질문과 검색 근거로 답변 초안을 요청합니다.</span></span></span><span class="d26-compare-code-line" data-line="19"><span class="d26-compare-line-number" aria-hidden="true">19</span><span>    response = chat_model.invoke(messages)</span></span><span class="d26-compare-code-line" data-line="20"><span class="d26-compare-line-number" aria-hidden="true">20</span><span>    <span class="d26-compare-syntax-keyword">return</span> response.text</span></span></code></pre></div>

      <div class="d26-compare-code"><div class="d26-compare-code-head"><b>finetuning_example.py</b><span>입력과 처리 과정 비교</span></div><pre><code><span class="d26-compare-code-line" data-line="1"><span class="d26-compare-line-number" aria-hidden="true">1</span><span><span class="d26-compare-syntax-keyword">import</span> torch</span></span><span class="d26-compare-code-line" data-line="2"><span class="d26-compare-line-number" aria-hidden="true">2</span><span> </span></span><span class="d26-compare-code-line" data-line="3"><span class="d26-compare-line-number" aria-hidden="true">3</span><span><span class="d26-compare-syntax-keyword">def</span> fine_tune(pretrained_lm, train_loader):</span></span><span class="d26-compare-code-line" data-line="4"><span class="d26-compare-line-number" aria-hidden="true">4</span><span>    optimizer = torch.optim.AdamW(</span></span><span class="d26-compare-code-line" data-line="5"><span class="d26-compare-line-number" aria-hidden="true">5</span><span>        pretrained_lm.parameters(), lr=<span class="d26-compare-syntax-number">2e-5</span></span></span><span class="d26-compare-code-line" data-line="6"><span class="d26-compare-line-number" aria-hidden="true">6</span><span>    )</span></span><span class="d26-compare-code-line" data-line="7"><span class="d26-compare-line-number" aria-hidden="true">7</span><span>    pretrained_lm.train()  <span class="d26-compare-syntax-comment"># 학습 모드로 전환합니다.</span></span></span><span class="d26-compare-code-line" data-line="8"><span class="d26-compare-line-number" aria-hidden="true">8</span><span>    <span class="d26-compare-syntax-keyword">for</span> batch <span class="d26-compare-syntax-keyword">in</span> train_loader:</span></span><span class="d26-compare-code-line" data-line="9"><span class="d26-compare-line-number" aria-hidden="true">9</span><span>        optimizer.zero_grad()  <span class="d26-compare-syntax-comment"># 이전 Batch의 기울기를 비웁니다.</span></span></span><span class="d26-compare-code-line" data-line="10"><span class="d26-compare-line-number" aria-hidden="true">10</span><span>        loss = pretrained_lm(**batch).loss  <span class="d26-compare-syntax-comment"># 현재 Batch의 예측 오차</span></span></span><span class="d26-compare-code-line" data-line="11"><span class="d26-compare-line-number" aria-hidden="true">11</span><span>        loss.backward()   <span class="d26-compare-syntax-comment"># 기울기 계산</span></span></span><span class="d26-compare-code-line" data-line="12"><span class="d26-compare-line-number" aria-hidden="true">12</span><span>        optimizer.step()  <span class="d26-compare-syntax-comment"># 가중치 갱신</span></span></span><span class="d26-compare-code-line" data-line="13"><span class="d26-compare-line-number" aria-hidden="true">13</span><span>    <span class="d26-compare-syntax-keyword">return</span> pretrained_lm</span></span></code></pre></div>
      <div class="d26-compare-explanation"><h2>Fine-tuning</h2><dl><div><dt>입력</dt><dd>사전학습 LLM과 학습용 Token·정답 labels</dd></div><div><dt>처리</dt><dd>오차인 loss를 계산하고 backward()로 기울기를 구한 뒤 step()으로 가중치를 갱신합니다.</dd></div><div><dt>결과</dt><dd>가중치가 조정된 모델</dd></div><div><dt>모델 가중치</dt><dd>학습 가능한 가중치가 변경됨</dd></div></dl><p class="d26-compare-focus">train()은 학습 모드로 바꾸는 호출입니다. 이 코드에서 실제 가중치 갱신은 optimizer.step()이 수행합니다.</p><p class="d26-compare-preparation">후속 수업의 원리 예시입니다. pretrained_lm은 다음 Token을 예측하고 loss를 반환하는 사전학습 LLM입니다. train_loader는 Token 번호인 input_ids, 유효 위치인 attention_mask, 학습 정답인 labels를 배치로 제공합니다. 모델과 배치는 같은 장치에 준비하며 데이터 준비·평가·저장은 생략했습니다.</p></div>
    </section></div>
      <p class="d26-compare-relation">Summary는 작업의 종류, RAG는 검색과 생성을 연결하는 구성 방식, Fine-tuning은 추가 학습 방법입니다. RAG로 찾은 자료를 요약하거나 Fine-tuning한 모델을 RAG에 사용할 수 있습니다.</p></div><details class="teaching-detail d26-compare-original" data-detail-key="ch1-rag-summary-finetuning-original"><summary>역할 비교와 용어 다시 보기</summary><div class="detail-content"><div class="table-wrap axis-table"><table><thead><tr><th scope="col">방식</th><th scope="col">주요 작업</th><th scope="col">출석 문서의 예</th></tr></thead><tbody><tr class="d26-table-row"><th scope="row">Summary</th><td>주어진 자료의 내용을 짧게 정리</td><td>출석 규정 전체를 몇 문장으로 요약</td></tr><tr class="d26-table-row"><th scope="row">RAG</th><td>질문에 맞는 자료를 검색한 뒤 답변 입력에 제공</td><td>“15분 늦으면?”에 필요한 규정 청크로 답변</td></tr><tr class="d26-table-row"><th scope="row">Fine-tuning</th><td>학습 예제로 모델의 가중치를 추가 학습</td><td>후속 수업에서 데이터·학습 설정과 적용 판단을 다룸</td></tr></tbody></table></div><p class="smalltext muted spaced">요약은 RAG에서 사용할 수 있는 작업이고, Fine-tuning과 RAG도 함께 쓸 수 있습니다. 오늘은 기존 Embedding 모델과 LLM을 사용하며 새 모델 학습은 수행하지 않습니다.</p><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>Summary</b><span>주어진 내용의 핵심을 짧게 정리한 결과<small>출석 규정의 주요 항목을 세 문장으로 정리</small></span></p><p><b>Fine-tuning</b><span>기존 모델을 추가 데이터로 학습해 가중치를 조정하는 과정<small>특정 형식의 학습 예제로 모델을 추가 학습</small></span></p></section><details class="teaching-detail d26-refs"><summary>원문 참고 · 3개</summary><div class="detail-content"><ul><li><a href="https://docs.langchain.com/oss/python/integrations/chat/openai" target="_blank" rel="noopener noreferrer">LangChain · ChatOpenAI 메시지 입력과 invoke</a></li><li><a href="https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial.html" target="_blank" rel="noopener noreferrer">PyTorch · backward와 optimizer.step</a></li><li><a href="https://huggingface.co/docs/transformers/training" target="_blank" rel="noopener noreferrer">Hugging Face · Fine-tuning</a></li></ul></div></details></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">8 / 82</div><div><header class="scene-head"><h1>질문에서 답변까지 중간값을 따라갑니다</h1><p>검색 결과·선택한 근거·모델 입력·답변을 차례로 구분해 봅니다.</p></header><section class="d26-demo" data-demo-root="rag-flow"><header class="d26-demo-head row between"><div class="row"><strong>RAG FLOW · 질문에서 출처까지</strong><span class="chip outline">OFFLINE · 교육용 시연</span></div><button class="small" data-reset-demo="rag-flow">초기값</button></header><div class="d26-demo-body"><div class="d26-controls"><label class="d26-control"><span>질문</span><select data-demo="rag-flow" data-key="query"><option value="attendance">출석 · 15분 늦은 경우</option><option value="deadline">과제 · 정확한 마감 날짜</option><option value="storage">과제 · 파일 보관 위치</option><option value="facility" selected>시설 · 회의실 이용 조건</option><option value="unknown">문서 밖 · 환불 비율</option></select></label></div><div class="d26-question">회의실을 이용하려면 무엇을 해야 하나요?</div><div class="d26-steps"><button data-set-demo="rag-flow" data-key="step" data-value="0" aria-pressed="true"><span>01</span>Retrieve</button><button data-set-demo="rag-flow" data-key="step" data-value="1" aria-pressed="false"><span>02</span>Context</button><button data-set-demo="rag-flow" data-key="step" data-value="2" aria-pressed="false"><span>03</span>Prompt</button><button data-set-demo="rag-flow" data-key="step" data-value="3" aria-pressed="false"><span>04</span>Generate</button><button data-set-demo="rag-flow" data-key="step" data-value="4" aria-pressed="false"><span>05</span>Validate</button><button data-set-demo="rag-flow" data-key="step" data-value="5" aria-pressed="false"><span>06</span>Response</button></div><div class="d26-split"><section class="card d26-panel"><h2>입력</h2><pre class="d26-pre">회의실을 이용하려면 무엇을 해야 하나요?</pre></section><section class="card d26-panel"><h2>출력 · 질문에 맞는 후보와 출처</h2><pre class="d26-pre">[
  {
    "citation_id": 203,
    "body": "컴퓨터 실습실은 안내에 따라 이용합니다. 회의실은 예약 승인 후 이용합니다. 장비 이상은 운영실에 알립니다.",
    "source_locator": "facility.html#main"

]</pre></section></div><p class="d26-live-note">검색 순위와 모델 답변은 준비된 교육용 사례입니다. Context 선택·Prompt 구성·출처 규칙은 이 HTML에서 계산합니다. 실제 DB나 LLM을 호출하지 않습니다.</p></div></section>
      <details class="teaching-detail" data-detail-key="ch1-rag-flow-demo-observe"><summary>시연에서 관찰할 것</summary><div class="detail-content"><div class="cols d26-demo-explain"><section><section><h3>질문과 근거</h3><p>출석 질문과 과제 마감일 질문에서 어떤 문서를 참고하는지 관찰합니다. 같은 자료 집합이라도 질문이 요구하는 정보는 다릅니다.</p></section><section><h3>Context의 경계</h3><p>검색 후보 전체와 실제 모델 입력에 포함한 근거를 구분합니다. 출처 ID가 어느 단계에서 만들어져 계속 전달되는지도 확인합니다.</p></section></section><section><section><h3>생성 뒤의 확인</h3><p>답변의 출처 ID와 문서의 숫자·조건을 대조합니다. 관련 문서가 검색되었어도 질문의 답이 없는 사례를 찾습니다.</p></section><section><h3>다음 코드에서 볼 것</h3><p>화면의 각 중간값을 Python의 문자열·목록·Dictionary로 표현합니다. 이 자료형이 LangChain 구성요소의 입력과 출력에 대응합니다.</p></section></section></div></div></details><p class="smalltext muted spaced">OFFLINE 교육용 시연입니다. 검색 순위와 생성 답변은 고정 사례이며 E5·DB·LLM을 호출한 결과가 아닙니다.</p></div></article><article class="d26-reader-section"><div class="d26-reader-label">9 / 82</div><div><header class="scene-head"><h1>실습 01 · RAG 단계와 근거 대조</h1><p>질문에 필요한 문서를 고르고 RAG 각 단계의 역할과 답변 근거를 연결합니다.</p></header><section class="lesson-return"><div><h2>실습 준비와 산출물</h2><p><b>입력·준비:</b> 본문의 출석·과제·시설 문서, RAG 단계 표와 흐름 시연을 사용합니다. 같은 문서에서 답할 수 있는 정보와 없는 정보를 구분합니다.<br><b>남길 결과:</b> 질문별 RAG 단계와 답변 근거·정보 부족 판단을 정리한 짧은 확인표</p></div><button data-action="atlasOpen" class="primary">같은 지도에서 확인</button></section>
      <p class="smalltext muted">세 수준 중 하나를 선택합니다. 모든 수준의 공통 목표는 같으며, 직접 완성할 범위와 확인할 조건을 조절합니다.</p>
      <div class="grid3"><section class="card level baseline"><h2>기본필수</h2><h3>01_basic</h3><p>본문의 출석 질문을 따라 검색부터 답변·출처 확인까지의 역할과 입력·출력을 순서대로 적습니다. 답변의 15분 기준을 출석 v2 본문에서 찾아 근거로 표시합니다.</p><p><b>확인할 결과</b><br>단계별 역할과 15분까지 지각이라는 판단을 원문 근거와 함께 설명합니다.</p></section><section class="card level"><h2>응용</h2><h3>02_intermediate</h3><p>본문의 단계 표를 따라 과제의 정확한 마감 날짜 질문에 필요한 근거를 직접 정리합니다. 검색할 문서는 있어도 답할 날짜는 없다는 차이를 원문과 함께 설명합니다.</p><p><b>확인할 결과</b><br>검색 문서가 있는 경우에도 정확한 날짜를 답할 수 없는 이유를 설명합니다.</p></section><section class="card level"><h2>심화</h2><h3>03_advanced</h3><p>출석 질문을 15분과 20분으로 바꾸어 각 단계에서 필요한 근거를 대조합니다. 문서는 같아도 답변이 달라지는 시간 경계와 사전 승인 예외를 짧게 기록합니다.</p><p><b>확인할 결과</b><br>15분까지·15분 초과·사전 승인 조건을 구분해 두 질문의 답변을 비교합니다.</p></section></div>
      <div class="action-box spaced"><h2>공통 완료 기준</h2><p>검색·Context·Prompt·생성·확인의 순서를 설명하고, 답변에 사용한 원문이나 필요한 정보가 없는 이유를 가리키면 완료입니다.</p></div>
      <p class="smalltext muted spaced"><b>주의할 점:</b> 시연의 검색 순위와 생성 답변은 고정한 교육용 사례이며, 문서의 날짜·숫자·예외를 바꾸거나 실제 DB·LLM 실행 결과로 기록하지 않습니다.</p></div></article><article class="d26-reader-section"><div class="d26-reader-label">10 / 82</div><div><header class="scene-head"><h1>이해 확인 · 검색과 답변의 역할을 설명합니다</h1><p>용어의 이름보다 각 단계가 책임지는 결과를 구분합니다.</p></header><section class="quiz-item"><p><strong>01.</strong> 출석 v2 청크를 정확히 찾았습니다. 이제 RAG 답변이 완성되었다고 할 수 있을까요?</p><details data-detail-key="ch1-quiz-quiz-0"><summary>생각한 뒤 해설 보기</summary><div class="answer-box">아직입니다. 필요한 근거를 선택하고 질문과 함께 모델 입력을 만든 뒤 답변을 생성·검증해야 합니다. 검색 결과는 관련 본문과 출처이고, 사용자에게 전달할 답변은 그 뒤의 결과입니다.</div></details></section><section class="quiz-item"><p><strong>02.</strong> 문서의 지각 기준이 바뀌면, 오늘의 RAG에서 LLM을 다시 학습해야 하나요?</p><details data-detail-key="ch1-quiz-quiz-1"><summary>생각한 뒤 해설 보기</summary><div class="answer-box">오늘 구성에서는 문서 청크와 Embedding 등 검색 데이터를 갱신하고 새 공개 버전을 검색하게 합니다. 매번 LLM 가중치를 학습시키는 과정은 아닙니다.</div></details></section><section class="quiz-item"><p><strong>03.</strong> 근거는 “15분까지 지각”인데 답변은 “15분이면 결석”입니다. 어느 결과를 더 확인해야 하나요?</p><details data-detail-key="ch1-quiz-quiz-2"><summary>생각한 뒤 해설 보기</summary><div class="answer-box">검색 근거가 맞는지 먼저 확인한 다음, 생성 답변이 숫자의 경계 조건을 잘못 읽었음을 찾아야 합니다. 출처 ID가 같다는 사실만으로 답변의 내용이 옳아지는 것은 아닙니다.</div></details></section></div></article><article class="d26-reader-section"><div class="d26-reader-label">11 / 82</div><div><header class="scene-head"><h1>함수를 연결하기 전에 중간값의 형태를 확인합니다</h1><p>다음 함수가 무엇을 받는지 알면 RAG 흐름을 한 단계씩 읽을 수 있습니다.</p></header><details class="teaching-detail d26-system-location" data-map-chapter="2" data-detail-key="ch2-intermediate-values-system-location" open><summary>전체그림에서 현재 위치 · Hit · Context</summary><div class="detail-content"><div class="atlas-figure"><svg class="atlas-svg " viewbox="0 0 1200 558" role="group" aria-label="AI 업무 서비스 전체 지도. 현재 강조: Document, Context 구성, Prompt"><defs><marker id="day26-atlas-2-arrow" markerwidth="7" markerheight="7" refx="6" refy="3.5" orient="auto" marke LangChain의 Document와 Prompt 입력으로 같은 정보를 옮깁니다.</p><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>Hit</b><span>검색 결과 목록에 포함된 한 건의 레코드<small>출석 청크의 본문과 citation_id를 가진 Dictionary</small></span></p></section></div></article><article class="d26-reader-section"><div class="d26-reader-label">12 / 82</div><div><header class="scene-head"><h1>첫 검색 결과에 본문과 출처를 함께 담습니다</h1><p>답변에서 쓸 정수 citation_id와 청크를 구분하는 문자열 chunk_id를 처음부터 보존합니다.</p></header><div class="io-strip"><div><b>들어오는 것 · 입력 / 전제</b><span>입력: 공통 출석 문서로 만든 설명용 Hit 1건. 실제 DB 검색은 실행하지 않습니다.</span></div><div><b>여기서 하는 일</b><span>한 Hit의 값 읽기 · 순수 Python</span></div><div><b>다음으로 넘길 것 · 출력 / 관찰</b><span>출력: 201 / DOC-ATTEND / v2. body에는 15분 경계와 승인 예외가 함께 들어 있습니다.</span></div></div>
      <section class="inline-python" aria-label="본문 Python 코드"><section class="python-block" data-code-key="ch2-hit-example" aria-label="Python · 한 Hit의 값 읽기 · 순수 Python"><header class="python-editor-bar"><span class="python-tab"><span class="python-file-mark" aria-hidden="true">py</span>Python</span><h3>한 Hit의 값 읽기 · 순수 Python</h3><button class="small d26-copy" data-code="ch2-hit-example" aria-label="첫 검색 결과에 본문과 출처를 함께 담습니다 코드 복사">코드 복사</button></header><pre><code class="python-source" aria-label="Python 소스코드"><span class="python-line" data-line="1"><span class="py-comment"># 검색 결과 한 건에 본문과 출처 정보를 보관합니다.</span></span>
<span class="python-line" data-line="2">example_hit = {</span>
<span class="python-line" data-line="3">    <span class="py-string">"</span><span class="py-string">citation_id</span><span class="py-string">"</span>: <span class="py-number">201</span>,</span>
<span class="python-line" data-line="4">    <span class="py-string">"</span><span class="py-string">chunk_id</span><span class="py-string">"</span>: <span class="py-string">"</span><span class="py-string">demo-attend-v2-sec1</span><span class="py-string">"</span>,</span>
<span class="python-line" data-line="5">    <span class="py-string">"</span><span class="py-string">doc_id</span><span class="py-string">"</span>: <span class="py-string">"</span><span class="py-string">DOC-ATTEND</span><span class="py-string">"</span>,</span>
<span class="python-line" data-line="6">    <span class="py-string">"</span><span class="py-string">source_version</span><span class="py-string">"</span>: <span class="py-string">"</span><span class="py-string">v2</span><span class="py-string">"</span>,</span>
<span class="python-line" data-line="7">    <span class="py-string">"</span><span class="py-string">source_locator</span><span class="py-string">"</span>: <span class="py-string">"</span><span class="py-string">attendance_v2.md#sec-1</span><span class="py-string">"</span>,</span>
<span class="python-line" data-line="8">    <span class="py-string">"</span><span class="py-string">category</span><span class="py-string">"</span>: <span class="py-string">"</span><span class="py-string">학사</span><span class="py-string">"</span>,</span>
<span class="python-line" data-line="9">    <span class="py-string">"</span><span class="py-string">body</span><span class="py-string">"</span>: (</span>
<span class="python-line" data-line="10">        <span class="py-string">"</span><span class="py-string">수업 시작 후 15분까지 입실하면 지각으로 기록합니다. </span><span class="py-string">"</span></span>
<span class="python-line" data-line="11">        <span class="py-string">"</span><span class="py-string">15분을 초과하면 결석으로 기록합니다. </span><span class="py-string">"</span></span>
<span class="python-line" data-line="12">        <span class="py-string">"</span><span class="py-string">단, 사전 승인을 받은 경우에는 운영실에 확인합니다.</span><span class="py-string">"</span></span>
<span class="python-line" data-line="13">    ),</span>
<span class="python-line" data-line="14">}</span>
<span class="python-line" data-line="15"><span class="py-comment"># Key로 필요한 출처 값을 꺼냅니다.</span></span>
<span class="python-line" data-line="16">print(example_hit[<span class="py-string">"</span><span class="py-string">citation_id</span><span class="py-string">"</span>])</span>
<span class="python-line" data-line="17">print(example_hit[<span class="py-string">"</span><span class="py-string">doc_id</span><span class="py-string">"</span>], example_hit[<span class="py-string">"</span><span class="py-string">source_version</span><span class="py-string">"</span>])</span></code></pre></section><p class="template-note">Dictionary의 ["이름"]으로 해당 값을 읽습니다. 201과 demo- 식별자는 교육용이며, 실제 DB에서 얻은 ID를 이 값으로 덮어쓰지 않습니다. 이후 코드는 example_hit이 정의된 상태에서 이어 읽습니다.</p></section><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>citation_id</b><span>답변의 source_ids에서 근거를 가리킬 양의 정수 ID<small>source_ids: [201]</small></span></p><p><b>chunk_id</b><span>하나의 청크를 다른 청크와 구분하는 문자열 ID<small>같은 청크의 중복 포함 여부를 확인할 때 사용</small></span></p></section></div></article><article class="d26-reader-section"><div class="d26-reader-label">13 / 82</div><div><header class="scene-head"><h1>한 Hit를 출처가 붙은 Context 블록으로 바꿉니다</h1><p>본문 앞에 citation_id와 원문 위치를 붙이면 모델과 서버가 같은 근거를 가리킬 수 있습니다.</p></header><div class="io-strip"><div><b>들어오는 것 · 입력 / 전제</b><span>입력: 앞 화면의 example_hit Dictionary.</span></div><div><b>여기서 하는 일</b><span>format_hit(hit) → str · 함수 정의와 호출</span></div><div><b>다음으로 넘길 것 · 출력 / 관찰</b><span>출력 첫 줄: [201] attendance_v2.md#sec-1. 다음 줄: 출석 규정의 전체 본문.</span></div></div>
      <section class="inline-python" aria-label="본문 Python 코드"><section class="python-block" data-code-key="ch2-format-hit" aria-label="Python · format_hit(hit) → str · 함수 정의와 호출"><header class="python-editor-bar"><span class="python-tab"><span class="python-file-mark" aria-hidden="true">py</span>Python</span><h3>format_hit(hit) → str · 함수 정의와 호출</h3><button class="small d26-copy" data-code="ch2-format-hit" aria-label="한 Hit를 출처가 붙은 Context 블록으로 바꿉니다 코드 복사">코드 복사</button></header><pre><code class="python-source" aria-label="Python 소스코드"><span class="python-line" data-line="1"><span class="py-keyword">def</span> <span class="py-function">format_hit</span>(hit):</span>
<span class="python-line" data-line="2">    citation_id = hit[<span class="py-string">"</span><span class="py-string">citation_id</span><span class="py-string">"</span>]</span>
<span class="python-line" data-line="3">    locator = hit[<span class="py-string">"</span><span class="py-string">source_locator</span><span class="py-string">"</span>]</span>
<span class="python-line" data-line="4">    body = hit[<span class="py-string">"</span><span class="py-string">body</span><span class="py-string">"</span>]</span>
<span class="python-line" data-line="5">    <span class="py-comment"># 본문에 출처 ID와 위치를 붙여 반환합니다.</span></span>
<span class="python-line" data-line="6">    <span class="py-keyword">return</span> <span class="py-string">f</span><span class="py-string">"</span><span class="py-string">[</span><span class="py-string">{</span>citation_id<span class="py-string">}</span><span class="py-string">] </span><span class="py-string">{</span>locator<span class="py-string">}</span><span class="py-string">\n</span><span class="py-string">{</span>body<span class="py-string">}</span><span class="py-string">"</span></span>
<span class="python-line" data-line="7"><br></span>
<span class="python-line" data-line="8">block = format_hit(example_hit)  <span class="py-comment"># Hit 하나를 Context 블록으로 변환</span></span>
<span class="python-line" data-line="9">print(block)</span></code></pre></section><p class="template-note">def는 함수의 처리 규칙을 정의하고, format_hit(example_hit)은 그 규칙을 실제 값으로 호출합니다. f-string은 변수 값을 문자열에 넣으며, \n은 줄바꿈입니다. 이 함수는 자료를 표시할 뿐 검색·생성·사실 검증은 하지 않습니다.</p></section><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>Context</b><span>현재 질문에 답하도록 모델에게 제공하는 참고 정보<small>출처 [201]과 함께 담은 현재 출석 규정 본문</small></span></p></section></div></article><article class="d26-reader-section"><div class="d26-reader-label">14 / 82</div><div><header class="scene-head"><h1>선택한 본문과 허용 출처 목록을 함께 만듭니다</h1><p>최종 Context에 넣은 Hit에서만 출처 ID를 모읍니다.</p></header><div class="io-strip"><div><b>들어오는 것 · 입력 / 전제</b><span>입력: example_hit과 format_hit. 여기서는 이미 적절하다고 확인한 Hit 1건을 사용합니다.</span></div><div><b>여기서 하는 일</b><span>선택 → 블록 변환 → 연결 · 순수 Python</span></div><div><b>다음으로 넘길 것 · 출력 / 관찰</b><span>출력: 선택 수 1, included_ids=[201], [201]로 시작하는 Context 문자열.</span></div></div>
      <section class="inline-python" aria-label="본문 Python 코드"><section class="python-block" data-code-key="ch2-join-selected-context" aria-label="Python · 선택 → 블록 변환 → 연결 · 순수 Python"><header class="python-editor-bar"><span class="python-tab"><span class="python-file-mark" aria-hidden="true">py</span>Python</span><h3>선택 → 블록 변환 → 연결 · 순수 Python</h3><button class="small d26-copy" data-code="ch2-join-selected-context" aria-label="선택한 본문과 허용 출처 목록을 함께 만듭니다 코드 복사">코드 복사</button></header><pre><code class="python-source" aria-label="Python 소스코드"><span class="python-line" data-line="1">hits = [example_hit]</span>
<span class="python-line" data-line="2">selected_hits = hits[:<span class="py-number">2</span>]  <span class="py-comment"># 앞에서 최대 2건을 선택합니다.</span></span>
<span class="python-line" data-line="3">blocks = []</span>
<span class="python-line" data-line="4">included_ids = []</span>

<span class="python-line" data-line="6"><span class="py-keyword">for</span> hit in selected_hits:</span>
<span class="python-line" data-line="7">    blocks.append(format_hit(hit))</span>
<span class="python-line" data-line="8">    included_ids.append(hit[<span class="py-string">"</span><span class="py-string">citation_id</span><span class="py-string">"</span>])</span>
<span class="python-line" data-line="9"><br></span>
<span class="python-line" data-line="10">context = <span class="py-string">"</span><span class="py-string">\n</span><span class="py-string">\n</span><span class="py-string">"</span>.join(blocks)  <span class="py-comment"># 블록 사이를 빈 줄로 연결합니다.</span></span>
<span class="python-line" data-line="11">print(len(selected_hits))  <span class="py-comment"># 1</span></span>
<span class="python-line" data-line="12">print(included_ids)       <span class="py-comment"># [201]</span></span>
<span class="python-line" data-line="13">print(context)</span></code></pre></section><p class="template-note">hits[:2]는 앞에서 최대 2건을 고르는 목록 슬라이스입니다. append는 값을 목록 뒤에 추가하고, join은 블록 사이에 빈 줄을 넣어 연결합니다. 이 작은 예시는 길이·중복을 아직 검사하지 않습니다. 6장의 build_context에서 전체 블록 선택과 중복 제거를 함께 구현합니다.</p></section></div></article><article class="d26-reader-section concept-stage"><div class="d26-reader-label">15 / 82</div><div><header class="scene-head"><h1>근거의 개수·길이·충분성을 나누어 판단합니다</h1><p>후보를 몇 개 찾았는지, 모델에 무엇을 넣었는지, 그 내용으로 답할 수 있는지는 서로 다른 판단입니다.</p></header><div class="concept-grid"><div class="concept-explanation"><section><h2>candidate_k와 context_k</h2><p>candidate_k는 검색에서 가져올 최대 후보 수이고 context_k는 최종 근거의 최대 개수입니다. 오늘 기본값은 후보 3건, Context 2건이며 결과가 적으면 그보다 적게 담깁니다.</p></section><section><h2>문장 조건을 자르지 않기</h2><p>“15분까지 지각”만 남기고 “초과 시 결석”이나 승인 예외를 잘라 버리면 의미가 달라질 수 있습니다. 예제는 출처와 본문을 하나의 블록으로 취급합니다.</p></section></div><section class="concept-example"><section><h2>글자 예산과 Token 예산</h2><p>수업의 max_chars=600은 문자열 길이로 선택을 관찰하는 글자 예산입니다. 실제 LLM에는 해당 모델의 Tokenizer로 규칙·질문·근거를 포함한 입력 길이를 확인하고 출력 여유도 확보해야 합니다.</p></section><section><h2>관련 문서와 충분한 근거</h2><p>과제 안내가 검색되어도 정확한 마감 날짜가 없으면 날짜를 답할 수 없습니다. 후보 개수나 길이 예산을 늘렸다는 사실만으로 없는 정보가 생기지는 않습니다.</p></section></section></div><p class="concept-distinction">근거가 비면 생성 호출을 생략할 수 있습니다. DB 연결 실패로 검색을 못 한 경우는 근거 부족과 구분해 오류로 처리합니다.</p><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>Token</b><span>모델이 텍스트를 처리할 때 나누는 단위<small>한글 글자 수와 모델 Token 수는 일치한다고 가정할 수 없음</small></span></p></section></div></article><article class="d26-reader-section"><div class="d26-reader-label">16 / 82</div><div><header class="scene-head"><h1>Question과 Context를 별도 값으로 전달합니다</h1><p>모델 입력을 만들 때 질문·참고 자료·처리 규칙의 역할을 구분합니다.</p></header><div class="io-strip"><div><b>들어오는 것 · 입력 / 전제</b><span>입력: 앞 화면에서 구성한 context. 여기서는 모델을 호출하지 않습니다.</span></div><div><b>여기서 하는 일</b><span>Prompt에 넘길 값 확인 · 순수 Python</span></div><div><b>다음으로 넘길 것 · 출력 / 관찰</b><span>출력: question과 context라는 두 Key. 질문은 그대로, Context에는 [201] 근거가 들어갑니다.</span></div></div>
      <section class="inline-python" aria-label="본문 Python 코드"><section class="python-block" data-code-key="ch2-prompt-input" aria-label="Python · Prompt에 넘길 값 확인 · 순수 Python"><header class="python-editor-bar"><span class="python-tab"><span class="python-file-mark" aria-hidden="true">py</span>Python</span><h3>Prompt에 넘길 값 확인 · 순수 Python</h3><button class="small d26-copy" data-code="ch2-prompt-input" aria-label="Question과 Context를 별도 값으로 전달합니다 코드 복사">코드 복사</button></header><pre><code class="python-source" aria-label="Python 소스코드"><span class="python-line" data-line="1">question = <span class="py-string">"</span><span class="py-string">15분 늦으면 어떻게 기록되나요?</span><span class="py-string">"</span></span>
<span class="python-line" data-line="2"><span class="py-comment"># Prompt의 변수 이름에 맞춰 질문과 근거를 묶습니다.</span></span>
<span class="python-line" data-line="3">prompt_input = {</span>
<span class="python-line" data-line="4">    <span class="py-string">"</span><span class="py-string">question</span><span class="py-string">"</span>: question,</span>
<span class="python-line" data-line="5">    <span class="py-string">"</span><span class="py-string">context</span><span class="py-string">"</span>: context,</span>
<span class="python-line" data-line="6">}</span>
<span class="python-line" data-line="7"><br></span>
<span class="python-line" data-line="8"><span class="py-comment"># 모델 호출 전에 입력에 필요한 값이 담겼는지 확인합니다.</span></span>
<span class="python-line" data-line="9">print(list(prompt_input))</span>
<span class="python-line" data-line="10">print(prompt_input[<span class="py-string">"</span><span class="py-string">question</span><span class="py-string">"</span>])</span>
<span class="python-line" data-line="11">print(prompt_input[<span class="py-string">"</span><span class="py-string">context</span><span class="py-string">"</span>].startswith(<span class="py-string">"</span><span class="py-string">[201]</span><span class="py-string">"</span>))</span>
<span class="python-line" data-line="12"><span class="py-comment"># ['question', 'context']</span></span>
<span class="python-line" data-line="13"><span class="py-comment"># 15분 늦으면 어떻게 기록되나요?</span></span>
<span class="python-line" data-line="14"><span class="py-comment"># True</span></span></code></pre></section><p class="template-note">Key는 Dictionary에서 값을 찾는 이름입니다. 5장에서 ChatPromptTemplate이 이 두 값을 받아 메시지를 만들고, 그 메시지를 Chat Model에 전달합니다. “근거 밖의 날짜를 추정하지 말 것” 같은 처리 규칙은 참고 문서의 본문과 구분해 둡니다.</p></section><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>Instruction</b><span>애플리케이션이 모델에게 정한 작업·출력·처리 규칙<small>답을 확인할 근거가 없으면 정보 부족으로 응답</small></span></p><p><b>Source Data</b><span>답변의 사실을 확인하기 위해 제공한 참고 내용<small>검색한 출석 규정 본문은 참고 자료로 사용</small></span></p></section></div></article><article class="d26-reader-section"><div class="d26-reader-label">17 / 82</div><div><header class="scene-head"><h1>Context에 남은 자료와 출처 ID를 함께 봅니다</h1><p>길이와 포함 수를 바꾸면서 어떤 블록이 모델 입력에 남는지 확인합니다.</p></header><section class="d26-demo" data-demo-root="context-builder"><header class="d26-demo-head row between"><div class="row"><strong>CONTEXT BUILDER · 실제 포함한 근거</strong><span class="chip outline">OFFLINE · 교육용 시연</span></div><button class="small" data-reset-demo="context-builder">초기값</button></header><div class="d26-demo-body"><div class="d26-controls"><label class="d26-control"><span>Context 글자 예산 · <output>600</output></span><input aria-label="Context 글자 예산" type="range" min="40" max="800" step="20" value="600" data-demo="context-builder" data-key="budget"></label><label class="d26-control"><span>최대 포함 개수</span><select data-demo="context-builder" data-key="maxItems"><option value="1">1개</option><option value="2" selected>2개</option><option value="3">3개</option></select></label><label class="d26-control"><span>첫 청크 중복</span><input type="checkbox" data-demo="context-builder" data-key="duplicate" aria-label="첫 청크 중복">미적용</label></div><div class="d26-split"><section><div class="d26-checklist"><label><input type="checkbox" data-demo="context-builder" data-key="include201" checked><span><strong>[201] 출석 안내 · 현재 v2</strong><small>attendance_v2.md#sec-1</small>수업 시작 후 15분까지 입실하면 지각으로 기록합니다. 15분을 초과하면 결석으로 기록합니다. 단, 사전 승인을 받은 경우에는 운영실에 확인합니다.</span></label><label><input type="checkbox" data-demo="context-builder" data-key="include202" checked><span><strong>[202] 과제 제출 안내</strong><small>assignment.txt</small>과제 파일은 개인 폴더에 보관합니다. 제출 기한은 담당자가 공지한 날짜를 따릅니다. 기한 이후 제출 가능 여부는 담당자에게 확인하세요. 답안을 제출하기 전에 파일명을 확인합니다.</span></label><label><input type="checkbox" data-demo="context-builder" data-key="include203" checked><span><strong>[203] 시설 이용 안내</strong><small>facility.html#main</small>컴퓨터 실습실은 안내에 따라 이용합니다. 회의실은 예약 승인 후 이용합니다. 장비 이상은 운영실에 알립니다.</span></label></div><div class="table-wrap"><table class=""><thead><tr><th scope="col">후보</th><th scope="col">결정</th></tr></thead><tbody><tr class="d26-table-row"><td>[201]</td><td>포함</td></tr><tr class="d26-table-row"><td>[202]</td><td>포함</td></tr><tr class="d26-table-row"><td>[203]</td><td>Context 개수 상한</td></tr></tbody></table></div></section><section class="card d26-panel"><h2>실제 Context</h2><pre class="d26-pre">[201] attendance_v2.md#sec-1

[202] assignment.txt
과제 파일은 개인 폴더에 보관합니다. 제출 기한은 담당자가 공지한 날짜를 따릅니다. 기한 이후 제출 가능 여부는 담당자에게 확인하세요. 답안을 제출하기 전에 파일명을 확인합니다.</pre><p><b>233 / 600 글자</b> · 2개</p><p>included_ids = <b>[201,202]</b></p><button class="d26-source-button" data-source="201">[201] 원문 확인</button><button class="d26-source-button" data-source="202">[202] 원문 확인</button></section></div><p class="d26-live-note">ID·원문 위치·본문·구분자를 포함한 <strong>글자 수</strong>를 계산합니다. Token 수가 아닙니다. 실제 서비스에서는 모델의 Token 한도에 질문·규칙·응답 여유도 반영합니다.</p></div></section>
      <details class="teaching-detail" data-detail-key="ch2-context-builder-demo-observe"><summary>시연에서 관찰할 것</summary><div class="detail-content"><div class="cols d26-demo-explain"><section><section><h3>포함된 블록</h3><p>선택한 본문에 붙은 ID와 실제 포함 ID 목록을 비교합니다. 한 블록이 빠지면 허용 출처에서도 빠져야 합니다.</p></section><section><h3>중복과 글자 예산</h3><p>같은 chunk_id가 반복될 때 한 번만 포함되는지, 블록 전체가 글자 예산에 들어가지 않으면 제외되는지 봅니다.</p></section></section><section><section><h3>빈 Context</h3><p>예산을 너무 줄이거나 후보가 없을 때 Context가 비는지 확인합니다. 이후 서비스는 근거가 없는 상태와 검색 오류를 다르게 처리해야 합니다.</p></section><section><h3>뒤에서 구현할 규칙</h3><p>지금 관찰한 선택을 6장에서 Document 입력의 build_context 함수로 옮깁니다. 그 함수는 Context와 실제 포함 Document를 함께 반환합니다.</p></section></section></div></div></details><p class="smalltext muted spaced">블록 선택·중복 제거·글자 길이는 브라우저에서 계산합니다. 글자 수를 LLM Token 수로 표시하지 않으며, 후보 목록은 검색 실측이 아닌 교육용 사례입니다.</p></div></article><article class="d26-reader-section"><div class="d26-reader-label">18 / 82</div><div><header class="scene-head"><h1>실습 02 · Hit에서 Context 만들기</h1><p>선택한 Hit의 본문과 출처를 Context 문자열과 included_ids에 함께 담습니다.</p></header><section class="lesson-return"><div><h2>실습 준비와 산출물</h2><p><b>입력·준비:</b> 본문의 example_hit·format_hit·선택과 join 예시를 기존 Python 환경에서 사용합니다. DB·LLM 호출 없이 작은 입력과 출력을 확인합니다.<br><b>남길 결과:</b> Context 문자열과 included_ids가 같은 선택에서 나왔는지 대조한 출력 기록</p></div><button data-action="atlasOpen" class="primary">같은 지도에서 확인</button></section>
      <p class="smalltext muted">세 수준 중 하나를 선택합니다. 모든 수준의 공통 목표는 같으며, 직접 완성할 범위와 확인할 조건을 조절합니다.</p>
      <div class="grid3"><section class="card level baseline"><h2>기본필수</h2><h3>01_basic</h3><p>본문의 example_hit과 format_hit 호출을 순서대로 따라 실행합니다. 선택·join 예시까지 연결해 Context의 [201] 본문과 included_ids=[201]을 확인합니다.</p><p><b>확인할 결과</b><br>출처가 붙은 본문과 [201] 목록이 함께 만들어지고 원문의 조건이 남습니다.</p></section><section class="card level"><h2>응용</h2><h3>02_intermediate</h3><p>본문을 참고해 format_hit의 본문·ID·위치 연결과 included_ids를 모으는 부분을 직접 완성합니다. example_hit 한 건을 넣어 기본필수와 같은 출력을 얻는지 대조합니다.</p><p><b>확인할 결과</b><br>직접 연결한 코드에서도 같은 Context와 포함 ID [201]을 확인합니다.</p></section><section class="card level"><h2>심화</h2><h3>03_advanced</h3><p>같은 작은 코드를 빈 Hit 목록과 Hit 한 건으로 각각 실행합니다. Context가 빈 문자열인 경우와 [201] 본문이 남는 경우를 비교하고, included_ids도 함께 달라지는지 적습니다.</p><p><b>확인할 결과</b><br>빈 목록은 빈 Context와 [], 한 건은 해당 본문과 [201]을 만듭니다.</p></section></div>
      <div class="action-box spaced"><h2>공통 완료 기준</h2><p>Context와 ID 목록이 같은 Hit에서 만들어짐을 출력으로 확인하고, 본문의 시간 조건과 출처를 함께 가리킬 수 있으면 완료입니다.</p></div>
      <p class="smalltext muted spaced"><b>주의할 점:</b> 글자 길이를 Token 수로 해석하지 말고, 이 장의 Hit·문자열 코드까지만 확인하며 Document 변환과 모델 호출은 뒤 장에서 다룹니다.</p></div></article><article class="d26-reader-section"><div class="d26-reader-label">19 / 82</div><div><header class="scene-head"><h1>이해 확인 · 다음 함수로 넘길 값을 고릅니다</h1><p>Context의 내용과 출처가 같은 선택 결과에서 나왔는지 확인합니다.</p></header><section class="quiz-item"><p><strong>01.</strong> 검색 후보가 201·202·203인데 최종 Context에는 201만 넣었습니다. 허용 출처를 [201, 202, 203]으로 넘겨도 될까요?</p><details data-detail-key="ch2-quiz-quiz-0"><summary>생각한 뒤 해설 보기</summary><div class="answer-box">안 됩니다. 모델이 실제로 읽은 Context에는 201만 있으므로 허용 출처도 [201]이어야 합니다. 후보 목록에서 출처를 미리 확정하면 제외한 자료까지 인용을 허용하게 됩니다.</div></details></section><section class="quiz-item"><p><strong>02.</strong> 600자 예산에 들어간 Context라면 LLM의 입력 Token 한도도 통과한 것인가요?</p><details data-detail-key="ch2-quiz-quiz-1"><summary>생각한 뒤 해설 보기</summary><div class="answer-box">아닙니다. 글자와 Token은 다른 단위입니다. 실제 모델의 Tokenizer로 규칙·질문·근거를 포함한 입력을 계산하고 출력 공간까지 고려해야 합니다. 이 예제의 600자는 선택 과정을 관찰하는 기준입니다.</div></details></section><section class="quiz-item"><p><strong>03.</strong> 과제 안내가 검색되었지만 마감 날짜는 없었습니다. 어떤 중간값을 보고 답변 가능 여부를 판단해야 하나요?</p><details data-detail-key="ch2-quiz-quiz-2"><summary>생각한 뒤 해설 보기</summary><div class="answer-box">검색 순위나 문서 제목만 보지 않고 실제 Context의 본문을 봅니다. 본문에 “담당자가 공지한 날짜”만 있으면 정확한 날짜를 답할 근거가 없으므로 정보 부족으로 처리해야 합니다.</div></details></section></div></article><article class="d26-reader-section concept-stage"><div class="d26-reader-label">20 / 82</div><div><header class="scene-head"><h1>LangChain은 LLM을 사용하는 프로그램을 만드는 개발 도구입니다</h1><p>LangChain은 LLM 애플리케이션과 Agent를 개발하기 위한 오픈소스 Framework입니다. 이번 수업에서는 그 구성요소를 사용해 검색·Prompt·모델 호출을 연결합니다.</p></header><details class="teaching-detail d26-system-location" data-map-chapter="3" data-detail-key="ch3-framework-role-system-location" open><summary>전체그림에서 현재 위치 · LangChain의 사용 위치</summary><div class="detail-content"><div class="atlas-figure"><svg class="atlas-svg " viewbox="0 0 1200 558" role="group" aria- · 후속 수업에서는 모델의 Tool 호출 요청을 앱이 검증하고 실행합니다. 도구 결과를 다시 전달하고 권한·호출 한도·종료 조건을 관리합니다." transform="translate(930,459)"><rect class="node-rect" width="230" height="76" rx="11"></rect><text class="node-kicker" x="12" y="16">이후 · 별도 보호</text><text class="node-title" x="12" y="43">권한 확인 → Tool API</text><text class="node-sub" x="12" y="66">인수·실행·결과</text></g><rect class="evaluation-outline" x="535" y="290" width="172" height="94" rx="15"></rect><text class="evaluation-label" x="621" y="401" text-anchor="middle">별도 평가 · 실행 결과 비교</text></svg><div class="atlas-legend"><span><i class="prior"></i>기존 기반·학습한 원리</span><span><i class="today"></i>오늘 배우는 영역</span><span><i class="future"></i>후속 확장</span><span><i class="eval"></i>별도 비교·평가</span><span><i class="current"></i>현재 위치</span></div></div><div class="d26-system-explanation"><p><b>현업에서의 역할</b> LLM을 사용하는 Python 서비스에서 문서 검색·메시지 작성·모델 호출을 준비된 구성요소로 연결하는 데 사용합니다.</p><p><b>앞뒤 연결</b> 기존 검색 함수가 반환한 자료를 Prompt 입력으로 정리하고, 모델 호출 결과를 다음 검증 단계에 전달하는 코드에 들어갑니다.</p><p class="d26-system-scope"><b>학습 범위</b> LangChain이 무엇인지와 사용하는 이유를 먼저 이해하고, 같은 Python 함수를 직접 실행할 때와 Chain으로 실행할 때를 비교합니다.</p></div><div class="row d26-system-actions"><button class="small" data-action="atlasOpen" data-map-chapter="3">전체지도 확대</button><span>강조된 부분의 역할과 연결을 확인한 뒤, 지도를 접고 아래 설명을 이어갑니다.</span></div></div></details><div class="concept-grid"><div class="concept-explanation"><section><h2>Framework를 구체적으로 이해하기</h2><p>자주 필요한 기능을 미리 구현하고, 그 기능들을 함께 사용하는 방법을 제공한 개발 도구입니다. LangChain에는 메시지를 만드는 틀, 모델에 요청하는 코드, 단계의 실행 순서를 연결하는 기능이 준비되어 있습니다.</p></section><section><h2>어디에서 실행되는가</h2><p>Python 환경에 Package를 설치하고 import하여 우리 프로그램 안에서 사용합니다. 서버에 둔 FastAPI 앱에서도 이 Python 코드를 실행할 수 있습니다. 모델 API를 호출하는 단계에서는 외부 모델 서비스에 요청을 보냅니다.</p></section></div><section class="concept-example"><section><h2>역할을 나누어 보기</h2><p>LLM은 입력을 읽고 답변을 생성합니다. LangChain은 그 LLM에 줄 입력을 만들고 호출·결과 전달을 연결합니다. FastAPI는 사용자 요청과 응답을 처리하고, PostgreSQL은 문서를 저장·조회합니다.</p></section><section><h2>오늘 만들 서비스에서의 위치</h2><p>“15분 늦으면?”이라는 질문에 검색한 출석 규정을 붙이고 모델에 전달합니다. LangChain은 이 연결을 표현하는 데 사용하고, 검색할 문서와 답변을 검증하는 규칙은 우리가 정합니다.</p></section></section></div><p class="concept-distinction">LangChain의 설치는 개발에 사용할 코드를 준비하는 일입니다. 답변을 생성할 모델, API 접속 설정, 검색할 데이터는 각각 준비해야 합니다.</p><details class="teaching-detail d26-refs"><summary>원문 참고 · 3개</summary><div class="detail-content"><ul><li><a href="https://docs.langchain.com/oss/python/langchain/overview" target="_blank" rel="noopener noreferrer">LangChain · Overview</a></li><li><a href="https://docs.langchain.com/oss/python/langchain/models" target="_blank" rel="noopener noreferrer">LangChain · Models</a></li><li><a href="https://reference.langchain.com/python/langchain/overview" target="_blank" rel="noopener noreferrer">LangChain · Package reference</a></li></ul></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">21 / 82</div><div><header class="scene-head"><h1>LangChain 프로젝트의 파일과 실행 구조</h1><p>왼쪽에서 파일을 열고, 오른쪽에서 실행 노드를 선택해 보세요. 코드가 저장된 위치와 데이터가 이동하는 순서를 함께 확인합니다.</p></header><div class="d26-ide-root" data-ide-root data-ide-scene="ch3-why-langchain"><p class="d26-ide-caption">VS Code 형태의 학습용 화면입니다. 미리 색인한 문서를 검색해 답변 초안을 만드는 내부 Chain을 봅니다. Context 선택·출처 검증·FastAPI 응답은 뒤 장에서 연결합니다.</p><div class="d26-ide-frame"><div class="d26-ide-titlebar"><span class="d26-ide-title-mark" aria-hidden="true">&lt;/&gt;</span><span>rag_intro <span class="d26-ide-title-sub">· 프로젝트 구조</span></span><span class="d26-ide-window-controls" aria-hidden="true">─　□　×</span></div><div class="d26-ide-workspace"><aside class="d26-ide-explorer" aria-label="프로젝트 파일 Explorer"><div class="d26-ide-pane-heading">EXPLORER</div><div class="d26-ide-project"><span aria-hidden="true">⌄</span> rag_intro</div><div class="d26-ide-tree"><div class="d26-ide-folder"><span aria-hidden="true">⌄</span><span>app</span></div><button type="button" class="d26-ide-file d26-ide-file-nested" data-ide-file="app/__init__.py" aria-pressed="false" title="app/__init__.py · app 폴더를 Pyt ="StrOutputParser가 응답 메시지의 텍스트를 꺼냅니다. 답변의 사실 여부나 출처를 검증하는 기능은 아닙니다."><span class="d26-ide-node-head"><span class="d26-ide-node-number">5</span><strong>답변 텍스트 추출</strong></span><span class="d26-ide-node-file">chain.py</span><span class="d26-ide-node-type-flow" aria-label="입력 AIMessage, 출력 str"><span>AIMessage</span><span class="d26-ide-type-arrow" aria-hidden="true">→</span><span>str</span></span></button></li></ol></aside></div><div class="d26-ide-statusbar"><span>파일 위치와 실행 순서를 함께 읽기</span><span>Python　 UTF-8</span></div></div><div class="d26-ide-notes"><p>폴더·파일은 역할에 따라 코드를 정리한 교육용 구성입니다. LangChain이 이 폴더 구조를 강제하지 않습니다.</p><p>노드는 여기서 입력을 처리하는 실행 단계를 뜻합니다. |는 앞 단계의 출력을 다음 입력으로 연결하고, chain.invoke(request)가 전체 순서를 실행합니다.</p></div><section class="d26-lesson-filemap" aria-label="실제 실습 폴더와의 대응"><strong>실제 배포 ZIP과 비교</strong><p>왼쪽의 <code>rag_intro/app/</code>은 현업 분리 원리를 보여 주는 예시입니다. 실습 ZIP에서는 <code>mentee/</code> 또는 <code>mentor/</code>에서 한 난이도를 선택해 실행합니다.</p><div class="table-wrap"><table><thead><tr><th>강의의 역할 예시</th><th>배포 실습에서 확인할 파일</th></tr></thead><tbody><tr><td>검색 · Context <code>retrieval.py</code></td><td><code>coursekit/live.py</code> · <code>coursekit/checkpoints.py</code></td></tr><tr><td>Prompt <code>prompts.py</code></td><td><code>coursekit/checkpoints.py</code>의 <code>make_prompt()</code></td></tr><tr><td>Chat Model <code>model.py</code></td><td><code>coursekit/llm.py</code></td></tr><tr><td>Chain · API <code>chain.py</code> · <code>main.py</code></td><td><code>coursekit/checkpoints.py</code>와 각 실습의 <code>main.py</code> (응용·심화는 <code>tasks.py</code> 포함)</td></tr></tbody></table></div><p>폴더·파일 이름은 예시와 다를 수 있습니다. <b>같은 것은 데이터 흐름과 각 함수의 역할</b>입니다.</p></section><details class="d26-ide-all-files" data-detail-key="ch3-why-langchain-all-files"><summary>전체 파일 코드와 추가 설명 보기 · 전체읽기·인쇄용</summary><div class="d26-ide-reference-content"><div class="d26-ide-notes d26-ide-extra-notes"><p>한 파일에 여러 노드를 둘 수 있습니다. __init__.py·환경설정·Package 목록은 실행 노드가 아닙니다.</p><p>연결 구조를 읽는 예시입니다. 실제 검색은 기존 coursekit·E5·DB를 사용하며, Context 예산·Structured Output·출처 검증은 뒤 장에서 연결합니다.</p></div><section class="d26-ide-file-reference"><h3>app/__init__.py</h3><p>app 폴더를 Python Package로 사용합니다. 실행 노드를 정의하는 파일은 아닙니다.</p><pre class="d26-ide-pre d26-ide-pre-reference" aria-label="app/__init__.py 소스코드"><code><span class="d26-ide-line" data-ide-line="1"><span class="d26-ide-line-number" aria-hidden="true">1</span><span class="d26-ide-line-code"><span class="d26-ide-syntax-comment"># app을 Python Package로 표시합니다.</span></span></span><span class="d26-ide-line" data-ide-line="2"><span class="d26-ide-line-number" aria-hidden="true">2</span><span class="d26-ide-line-code"><span class="d26-ide-syntax-comment"># 이 파일은 비워 두어도 됩니다.</span></span></span></code></pre></section><section class="d26-ide-file-reference"><h3>app/main.py</h3><p>실행의 시작점입니다. 환경변수를 읽은 후 질문을 Chain에 전달합니다.</p><pre class="d26-ide-pre d26-ide-pre-reference" aria-label="app/main.py 소스코드"><code><span class="d26-ide-line" data-ide-line="1"><span class="d26-ide-line-number" aria-hidden="true">1</span><span class="d26-ide-line-code"><span class="d26-ide-syntax-keyword">from</span> pathlib <span class="d26-ide-syntax-keyword">import</span> Path</span></span><span class="d26-ide-line" data-ide-line="2"><span class="d26-ide-line-number" aria-hidden="true">2</span><span class="d26-ide-line-code"><span class="d26-ide-syntax-keyword">from</span> dotenv <span class="d26-ide-syntax-keyword">import</span> load_dotenv</span></span><span class="d26-ide-line" data-ide-line="3"><span class="d26-ide-line-number" aria-hidden="true">3</span><span class="d26-ide-line-code"> </span></span><span class="d26-ide-line" data-ide-line="4"><span class="d26-ide-line-number" aria-hidden="true">4</span><span class="d26-ide-line-code">ROOT = Path(__file__).resolve().parents[<span class="d26-ide-syntax-number">1</span>]</span></span><span class="d26-ide-line" data-ide-line="5"><span class="d26-ide-line-number" aria-hidden="true">5</span><span class="d26-ide-line-code">load_dotenv(ROOT / <span class="d26-ide-syntax-string">".env"</span>)  <span class="d26-ide-syntax-comment"># 프로젝트 루트의 설정을 읽습니다.</span></span></span><span class="d26-ide-line" data-ide-line="6"><span class="d26-ide-line-number" aria-hidden="true">6</span><span class="d26-ide-line-code"> </span></span><span class="d26-ide-line" data-ide-line="7"><span class="d26-ide-line-number" aria-hidden="true">7</span><span class="d26-ide-line-code"><span class="d26-ide-syntax-comment"># 환경변수를 읽은 뒤 모델·DB 설정 코드를 가져옵니다.</span></span></span><span class="d26-ide-line" data-ide-line="8"><span class="d26-ide-line-number" aria-hidden="true">8</span><span class="d26-ide-line-code"><span class="d26-ide-syntax-keyword">from</span> .chain <span class="d26-ide-syntax-keyword">import</span> chain</span></span><span class="d26-ide-line" data-ide-line="9"><span class="d26-ide-line-number" aria-hidden="true">9</span><span class="d26-ide-line-code"> </span></span><span class="d26-ide-line" data-ide-line="10"><span class="d26-ide-line-number" aria-hidden="true">10</span><span class="d26-ide-line-code"><span class="d26-ide-syntax-keyword">if</span> __name__ == <span class="d26-ide-syntax-string">"__main__"</span>:</span></span><span class="d26-ide-line" data-ide-line="11"><span class="d26-ide-line-number" aria-hidden="true">11</span><span class="d26-ide-line-code">    <span class="d26-ide-syntax-comment"># 질문·분류·검색 후보 수를 첫 단계에 전달합니다.</span></span></span><span class="d26-ide-line" data-ide-line="12"><span class="d26-ide-line-number" aria-hidden="true">12</span><span class="d26-ide-line-code">    request = {</span></span><span class="d26-ide-line" data-ide-line="13"><span class="d26-ide-line-number" aria-hidden="true">13</span><span class="d26-ide-line-code">        <span class="d26-ide-syntax-string">"query"</span>: <span class="d26-ide-syntax-string">"15분 늦으면 어떻게 기록되나요?"</span>,</span></span><span class="d26-ide-line" data-ide-line="14"><span class="d26-ide-line-number" aria-hidden="true">14</span><span class="d26-ide-line-code">        <span class="d26-ide-syntax-string">"category"</span>: <span class="d26-ide-syntax-string">"학사"</span>,</span></span><span class="d26-ide-line" data-ide-line="15"><span class="d26-ide-line-number" aria-hidden="true">15</span><span class="d26-ide-line-code">        <span class="d26-ide-syntax-string">"candidate_k"</span>: <span class="d26-ide-syntax-number">3</span>,</span></span><span class="d26-ide-line" data-ide-line="16"><span class="d26-ide-line-number" aria-hidden="true">16</span><span class="d26-ide-line-code">    }</span></span><span class="d26-ide-line" data-ide-line="17"><span class="d26-ide-line-number" aria-hidden="true">17</span><span class="d26-ide-line-code">    <span class="d26-ide-syntax-comment"># 검색부터 답변 초안까지 연결된 단계를 실행합니다.</span></span></span><span class="d26-ide-line" data-ide-line="18"><span class="d26-ide-line-number" aria-hidden="true">18</span><span class="d26-ide-line-code">    answer = chain.invoke(request)</span></span><span class="d26-ide-line" data-ide-line="19"><span class="d26-ide-line-number" aria-hidden="true">19</span><span class="d26-ide-line-code">    print(answer)</span></span></code></pre></section><section class="d26-ide-file-reference"><h3>app/chain.py</h3><p>여러 파일에서 구성요소를 가져와 |로 실행 순서를 연결합니다.</p><pre class="d26-ide-pre d26-ide-pre-reference" aria-label="app/chain.py 소스코드"><code><span class="d26-ide-line" data-ide-line="1"><span class="d26-ide-line-number" aria-hidden="true">1</span><span class="d26-ide-line-code"><span class="d26-ide-syntax-keyword">from</span> langchain_core.runnables <span class="d26-ide-syntax-keyword">import</span> RunnableLambda</span></span><span class="d26-ide-line" data-ide-line="2"><span class="d26-ide-line-number" aria-hidden="true">2</span><span class="d26-ide-line-code"><span class="d26-ide-syntax-keyword">from</span> langchain_core.output_parsers <span class="d26-ide-syntax-keyword">import</span> StrOutputParser</span></span><span class="d26-ide-line" data-ide-line="3"><span class="d26-ide-line-number" aria-hidden="true">3</span><span class="d26-ide-line-code"><span class="d26-ide-syntax-keyword">from</span> .retrieval <span class="d26-ide-syntax-keyword">import</span> retrieve, prepare_context</span></span><span class="d26-ide-line" data-ide-line="4"><span class="d26-ide-line-number" aria-hidden="true">4</span><span class="d26-ide-line-code"><span class="d26-ide-syntax-keyword">from</span> .prompts <span class="d26-ide-syntax-keyword">import</span> prompt</span></span><span class="d26-ide-line" data-ide-line="5"><span class="d26-ide-line-number" aria-hidden="true">5</span><span class="d26-ide-line-code"><span class="d26-ide-syntax-keyword">from</span> .model <span class="d26-ide-syntax-keyword">import</span> chat_model</span></span><span class="d26-ide-line" data-ide-line="6"><span class="d26-ide-line-number" aria-hidden="true">6</span><span class="d26-ide-line-code">retrieve_step = RunnableLambda(retrieve)  <span class="d26-ide-syntax-comment"># 함수를 실행 단계로 감쌈</span></span></span><span class="d26-ide-line" data-ide-line="7"><span class="d26-ide-line-number" aria-hidden="true">7</span><span class="d26-ide-line-code">context_step = RunnableLambda(prepare_context)</span></span><span class="d26-ide-line" data-ide-line="8"><span class="d26-ide-line-number" aria-hidden="true">8</span><span class="d26-ide-line-code">chain = (retrieve_step  <span class="d26-ide-syntax-comment"># 앞 출력을 다음 입력으로 전달</span></span></span><span class="d26-ide-line" data-ide-line="9"><span class="d26-ide-line-number" aria-hidden="true">9</span><span class="d26-ide-line-code">         | context_step</span></span><span class="d26-ide-line" data-ide-line="10"><span class="d26-ide-line-number" aria-hidden="true">10</span><span class="d26-ide-line-code">         | prompt</span></span><span class="d26-ide-line" data-ide-line="11"><span class="d26-ide-line-number" aria-hidden="true">11</span><span class="d26-ide-line-code">         | chat_mo rue">7</span><span class="d26-ide-line-code">    <span class="d26-ide-syntax-comment"># Category 조건 안에서 후보 문서를 찾습니다.</span></span></span><span class="d26-ide-line" data-ide-line="8"><span class="d26-ide-line-number" aria-hidden="true">8</span><span class="d26-ide-line-code">    hits = search_hits(</span></span><span class="d26-ide-line" data-ide-line="9"><span class="d26-ide-line-number" aria-hidden="true">9</span><span class="d26-ide-line-code">        question, request[<span class="d26-ide-syntax-string">"category"</span>],</span></span><span class="d26-ide-line" data-ide-line="10"><span class="d26-ide-line-number" aria-hidden="true">10</span><span class="d26-ide-line-code">        k=request.get(<span class="d26-ide-syntax-string">"candidate_k"</span>, <span class="d26-ide-syntax-number">3</span>),</span></span><span class="d26-ide-line" data-ide-line="11"><span class="d26-ide-line-number" aria-hidden="true">11</span><span class="d26-ide-line-code">    )</span></span><span class="d26-ide-line" data-ide-line="12"><span class="d26-ide-line-number" aria-hidden="true">12</span><span class="d26-ide-line-code">    <span class="d26-ide-syntax-comment"># 본문과 출처 정보를 Document에 나누어 담습니다.</span></span></span><span class="d26-ide-line" data-ide-line="13"><span class="d26-ide-line-number" aria-hidden="true">13</span><span class="d26-ide-line-code">    documents = [</span></span><span class="d26-ide-line" data-ide-line="14"><span class="d26-ide-line-number" aria-hidden="true">14</span><span class="d26-ide-line-code">        Document(</span></span><span class="d26-ide-line" data-ide-line="15"><span class="d26-ide-line-number" aria-hidden="true">15</span><span class="d26-ide-line-code">            page_content=hit[<span class="d26-ide-syntax-string">"body"</span>],</span></span><span class="d26-ide-line" data-ide-line="16"><span class="d26-ide-line-number" aria-hidden="true">16</span><span class="d26-ide-line-code">            metadata={key: hit[key] <span class="d26-ide-syntax-ke
