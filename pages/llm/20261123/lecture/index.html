/* Code examples for the three different kinds of work on page 7. */
(() => {
  'use strict';
  const C = globalThis.D26;
  const esc = C.esc;
  C.comparisonState = {selected: 'summary'};
  function syntax(line) {
    const pattern = /#.*$|(?:[rubfRUBF]{0,2})(?:"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(?:def|return|for|in|if|not|import|from|as|with|class|True|False|None)\b|\b\d+(?:\.\d+)?(?:e[-+]?\d+)?\b/g;
    let result = '', start = 0;
    for (const match of line.matchAll(pattern)) {
      result += esc(line.slice(start, match.index));
      const token = match[0];
      const kind = token.startsWith('#') ? 'comment' : /^(?:[rubfRUBF]{0,2})["']/.test(token) ? 'string' : /^\d/.test(token) ? 'number' : 'keyword';
      result += `<span class="d26-compare-syntax-${kind}">${esc(token)}</span>`;
      start = match.index + token.length;
    }
    return result + esc(line.slice(start));
  }
  function lines(sample) {
    return sample.code.split('\n').map((line, i) => `<span class="d26-compare-code-line" data-line="${i+1}"><span class="d26-compare-line-number" aria-hidden="true">${i+1}</span><span>${syntax(line) || ' '}</span></span>`).join('');
  }
  function panel(sample, selected) {
    const field = (label, value) => `<div><dt>${esc(label)}</dt><dd>${esc(value)}</dd></div>`;
    return `<section class="d26-compare-panel" id="d26-compare-panel-${esc(sample.id)}" aria-label="${esc(sample.label)} 코드와 설명"${sample.id === selected ? '' : ' hidden'}>
      <div class="d26-compare-code"><div class="d26-compare-code-head"><b>${esc(sample.filename)}</b><span>입력과 처리 과정 비교</span></div><pre><code>${lines(sample)}</code></pre></div>
      <div class="d26-compare-explanation"><h2>${esc(sample.label)}</h2><dl>${field('입력',sample.input)}${field('처리',sample.operation)}${field('결과',sample.output)}${field('모델 가중치',sample.weights)}</dl><p class="d26-compare-focus">${esc(sample.focus)}</p><p class="d26-compare-preparation">${esc(sample.preparation)}</p></div>
    </section>`;
  }
  C.renderComparisonBody = function(scene) {
    const examples = scene.codeComparison;
    const selected = examples.samples.some(s=>s.id===C.comparisonState.selected) ? C.comparisonState.selected : examples.default;
    return `<div class="d26-compare-choices" role="group" aria-label="비교할 코드 선택">${examples.samples.map(sample=>`<button type="button" data-compare-choice="${esc(sample.id)}" aria-pressed="${sample.id===selected}" aria-controls="d26-compare-panel-${esc(sample.id)}"><strong>${esc(sample.label)}</strong><span>${esc(sample.subtitle)}</span></button>`).join('')}</div>
      <p class="d26-compare-intro">${esc(examples.intro)}</p>
      <div class="d26-compare-panels">${examples.samples.map(sample=>panel(sample,selected)).join('')}</div>
      <p class="d26-compare-relation">${esc(examples.relation)}</p>`;
  };
  C.renderComparison = scene => `<div class="d26-compare-root" data-code-comparison-root="${esc(scene.id)}">${C.renderComparisonBody(scene)}</div>`;
  C.selectComparison = function(scene, id) {
    if (!scene?.codeComparison?.samples.some(sample=>sample.id===id)) return false;
    C.comparisonState.selected = id;
    return true;
  };
  if (typeof document !== 'undefined') document.addEventListener('click', event => {
    const button = event.target.closest?.('[data-compare-choice]');
    if (!button) return;
    const root = button.closest('[data-code-comparison-root]');
    const scene = globalThis.LECTURE_DATA.scenes.find(s=>s.id===root?.dataset.codeComparisonRoot);
    if (!C.selectComparison(scene,button.dataset.compareChoice)) return;
    event.preventDefault();
    root.innerHTML = C.renderComparisonBody(scene);
    root.querySelector(`[data-compare-choice="${button.dataset.compareChoice}"]`)?.focus({preventScroll:true});
  });
})();

/* Page 21: a VS Code-shaped teaching view of files and Runnable stages. */
(() => {
  'use strict';
  const C = globalThis.D26;
  if (!C) throw new Error('D26 renderer must be initialized before the IDE view.');
  const esc = value => C.esc(String(value == null ? '' : value));
  C.ideState = { file: null, node: null };

  function resolveState(scene) {
    const ide = scene.ide || {};
    const files = ide.files || [];
    const nodes = ide.nodes || [];
    const file = files.find(item => item.id === C.ideState.file)
      || files.find(item => item.id === ide.defaultFile)
      || files[0];
    const node = nodes.find(item => item.id === C.ideState.node) || null;
    return { ide, files, nodes, file, node };
  }

  C.selectIDEFile = function(scene, id) {
    const state = resolveState(scene);
    if (!state.files.some(file => file.id === id)) return { ...C.ideState };
    const keepNode = state.node
      && (state.node.file === id || state.ide.defaultFile === id);
    C.ideState = { file: id, node: keepNode ? state.node.id : null };
    return { ...C.ideState };
  };

  C.selectIDENode = function(scene, id) {
    const state = resolveState(scene);
    const node = state.nodes.find(item => item.id === id);
    if (!node || !state.files.some(file => file.id === node.file)) {
      return { ...C.ideState };
    }
    C.ideState = { file: node.file, node: node.id };
    return { ...C.ideState };
  };

  function syntaxLine(line, language) {
    if (language !== 'python') return esc(line) || ' ';
    const pattern = /("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|#.*$|\b(?:from|import|as|def|return|if|elif|else|for|in|with|try|except|finally|raise|class|pass|and|or|not|is|None|True|False)\b|\b\d+(?:\.\d+)?\b)/g;
    let cursor = 0;
    let result = '';
    for (const match of line.matchAll(pattern)) {
      result += esc(line.slice(cursor, match.index));
      const token = match[0];
      const kind = token.startsWith('#') ? 'comment'
        : /^["']/.test(token) ? 'string'
        : /^\d/.test(token) ? 'number' : 'keyword';
      result += `<span class="d26-ide-syntax-${kind}">${esc(token)}</span>`;
      cursor = match.index + token.length;
    }
    return result + esc(line.slice(cursor)) || ' ';
  }

  function renderCode(file, targetLines = [], reference = false) {
    const targets = new Set(targetLines.map(Number));
    const lines = String(file.code || '').replace(/\r\n/g, '\n').split('\n');
    const html = lines.map((line, index) => {
      const number = index + 1;
      const target = targets.has(number) ? ' data-ide-target="true"' : '';
      return `<span class="d26-ide-line" data-ide-line="${number}"${target}><span class="d26-ide-line-number" aria-hidden="true">${number}</span><span class="d26-ide-line-code">${syntaxLine(line, file.language)}</span></span>`;
    }).join('');
    return `<pre class="d26-ide-pre${reference ? ' d26-ide-pre-reference' : ''}" aria-label="${esc(file.id)} 소스코드"><code>${html}</code></pre>`;
  }

  function fileIcon(file) {
    return file.language === 'python' ? 'Py'
      : file.id.endsWith('.env.example') ? '≡' : '·';
  }

  function renderExplorer(state) {
    let currentFolder = null;
    const rows = state.files.map(file => {
      let folder = '';
      const group = file.folder || '';
      if (group !== currentFolder) {
        if (group) folder = `<div class="d26-ide-folder"><span aria-hidden="true">⌄</span><span>${esc(group)}</span></div>`;
        currentFolder = group;
      }
      const selected = file.id === state.file.id;
      const nodeNames = state.nodes.filter(node => (file.nodes || []).includes(node.id)).map(node => node.title);
      const count = nodeNames.length ? `<span class="d26-ide-file-node-count" aria-label="실행 노드 ${nodeNames.length}개">${nodeNames.length}</span>` : '';
      return folder + `<button type="button" class="d26-ide-file${selected ? ' d26-ide-file-active' : ''}${group ? ' d26-ide-file-nested' : ''}" data-ide-file="${esc(file.id)}" aria-pressed="${selected}" title="${esc(file.id + ' · ' + file.role)}"><span class="d26-ide-file-icon" aria-hidden="true">${fileIcon(file)}</span><span class="d26-ide-file-name">${esc(file.name || file.id)}</span>${count}</button>`;
    }).join('');
    return `<aside class="d26-ide-explorer" aria-label="프로젝트 파일 Explorer"><div class="d26-ide-pane-heading">EXPLORER</div><div class="d26-ide-project"><span aria-hidden="true">⌄</span> ${esc(state.ide.projectName || 'rag_intro')}</div><div class="d26-ide-tree">${rows}</div><p class="d26-ide-explorer-help">파일을 누르면 코드가 열립니다.<br>파일 옆 숫자는 연결된 실행 노드 수입니다.</p></aside>`;
  }

  function renderNodes(state) {
    const shortType = value => String(value || '').split('·')[0].trim();
    const nodes = state.nodes.map((node, index) => {
      const selected = state.node && state.node.id === node.id;
      const sameFile = !selected && (state.file.nodes || []).includes(node.id);
      const file = state.files.find(item => item.id === node.file);
      return `<li class="d26-ide-node-item"><button type="button" class="d26-ide-node${selected ? ' d26-ide-node-active' : ''}${sameFile ? ' d26-ide-node-file-match' : ''}" data-ide-node="${esc(node.id)}" aria-pressed="${Boolean(selected)}" title="${esc(node.description || node.title)}"><span class="d26-ide-node-head"><span class="d26-ide-node-number">${index + 1}</span><strong>${esc(node.title)}</strong></span><span class="d26-ide-node-file">${esc(file ? file.name : node.file)}</span><span class="d26-ide-node-type-flow" aria-label="입력 ${esc(shortType(node.input))}, 출력 ${esc(shortType(node.output))}"><span>${esc(shortType(node.input))}</span><span class="d26-ide-type-arrow" aria-hidden="true">→</span><span>${esc(shortType(node.output))}</span></span></button>${index < state.nodes.length - 1 ? '<span class="d26-ide-node-arrow" aria-hidden="true">↓</span>' : ''}</li>`;
    }).join('');
    const initialInput = state.nodes.length ? String(state.nodes[0].input).replace(/^dict\s*·\s*/, '') : '';
    return `<aside class="d26-ide-flow" aria-label="LangChain 실행 노드의 연결"><div class="d26-ide-pane-heading">실행 노드 <span>위에서 아래로 실행 · 노드를 눌러 상세 보기</span></div><div class="d26-ide-flow-input"><b>시작 입력 · request</b><span>${esc(initialInput)}</span></div><ol class="d26-ide-node-list">${nodes}</ol></aside>`;
  }

  function renderNote(note) {
    const content = Array.isArray(note)
      ? `<b>${esc(note[0])}</b> ${esc(note[1])}` : esc(note);
    return `<p>${content}</p>`;
  }

  function renderAllFiles(scene, state) {
    const files = state.files.map(file => `<section class="d26-ide-file-reference"><h3>${esc(file.id)}</h3><p>${esc(file.role)}</p>${renderCode(file, [], true)}</section>`).join('');
    const extraNotes = (state.ide.notes || []).slice(2).map(renderNote).join('');
    return `<details class="d26-ide-all-files" data-detail-key="${esc(scene.id)}-all-files"><summary>전체 파일 코드와 추가 설명 보기 · 전체읽기·인쇄용</summary><div class="d26-ide-reference-content"><div class="d26-ide-notes d26-ide-extra-notes">${extraNotes}</div>${files}</div></details>`;
  }

  function renderInside(scene) {
    const state = resolveState(scene);
    if (!state.file) return '<p>표시할 프로젝트 파일이 없습니다.</p>';
    const targetLines = state.node
      ? (state.node.file === state.file.id ? state.node.lines || []
        : state.file.id === state.ide.defaultFile ? state.node.chainLines || [] : [])
      : [];
    const tabs = state.files.map(file => `<button type="button" class="d26-ide-tab${file.id === state.file.id ? ' d26-ide-tab-active' : ''}" data-ide-file="${esc(file.id)}" aria-pressed="${file.id === state.file.id}" title="${esc(file.id)}"><span class="d26-ide-file-icon" aria-hidden="true">${fileIcon(file)}</span>${esc(file.name || file.id)}</button>`).join('');
    const description = state.node
      ? `<b>${esc(state.node.title)}</b><div class="d26-ide-current-io"><span><strong>입력</strong> ${esc(state.node.input)}</span><span><strong>출력</strong> ${esc(state.node.output)}</span></div><span>${esc(state.node.description)}</span>`
      : `<b>${esc(state.file.name || state.file.id)}</b><span>${esc(state.file.role)}</span>`;
    const notes = (state.ide.notes || []).slice(0, 2).map(renderNote).join('');
    return `<p class="d26-ide-caption">${esc(state.ide.scopeNote)}</p><div class="d26-ide-frame"><div class="d26-ide-titlebar"><span class="d26-ide-title-mark" aria-hidden="true">&lt;/&gt;</span><span>${esc(state.ide.projectName || 'rag_intro')} <span class="d26-ide-title-sub">· 프로젝트 구조</span></span><span class="d26-ide-window-controls" aria-hidden="true">─　□　×</span></div><div class="d26-ide-workspace">${renderExplorer(state)}<section class="d26-ide-editor" aria-label="선택한 파일의 코드"><div class="d26-ide-tabs" aria-label="파일 탭">${tabs}</div><div class="d26-ide-breadcrumb">${esc(state.ide.projectName || 'rag_intro')} <span aria-hidden="true">›</span> ${esc(state.file.id)}</div><div class="d26-ide-code-scroll">${renderCode(state.file, targetLines)}</div><div class="d26-ide-current-explanation" aria-live="polite">${description}</div><div class="d26-ide-terminal"><div class="d26-ide-terminal-title"><b>TERMINAL</b><span>실행 명령 예시 · HTML에서 실행되지 않음</span></div><p><span class="d26-ide-prompt">PS C:\\workspace\\${esc(state.ide.projectName || 'rag_intro')}&gt;</span> <code>${esc(state.ide.command || 'python -m app.main')}</code></p></div></section>${renderNodes(state)}</div><div class="d26-ide-statusbar"><span>파일 위치와 실행 순서를 함께 읽기</span><span>Python　 UTF-8</span></div></div><div class="d26-ide-notes">${notes}</div><section class="d26-lesson-filemap" aria-label="실제 실습 폴더와의 대응"><strong>실제 배포 ZIP과 비교</strong><p>왼쪽의 <code>rag_intro/app/</code>은 현업 분리 원리를 보여 주는 예시입니다. 실습 ZIP에서는 <code>mentee/</code> 또는 <code>mentor/</code>에서 한 난이도를 선택해 실행합니다.</p><div class="table-wrap"><table><thead><tr><th>강의의 역할 예시</th><th>배포 실습에서 확인할 파일</th></tr></thead><tbody><tr><td>검색 · Context <code>retrieval.py</code></td><td><code>coursekit/live.py</code> · <code>coursekit/checkpoints.py</code></td></tr><tr><td>Prompt <code>prompts.py</code></td><td><code>coursekit/checkpoints.py</code>의 <code>make_prompt()</code></td></tr><tr><td>Chat Model <code>model.py</code></td><td><code>coursekit/llm.py</code></td></tr><tr><td>Chain · API <code>chain.py</code> · <code>main.py</code></td><td><code>coursekit/checkpoints.py</code>와 각 실습의 <code>main.py</code> (응용·심화는 <code>tasks.py</code> 포함)</td></tr></tbody></table></div><p>폴더·파일 이름은 예시와 다를 수 있습니다. <b>같은 것은 데이터 흐름과 각 함수의 역할</b>입니다.</p></section>${renderAllFiles(scene, state)}`;
  }

  C.renderIDE = function(scene) {
    return `<div class="d26-ide-root" data-ide-root data-ide-scene="${esc(scene.id)}">${renderInside(scene)}</div>`;
  };

  if (typeof document !== 'undefined' && document.addEventListener && !C.ideEventsInstalled) {
    C.ideEventsInstalled = true;
    document.addEventListener('click', event => {
      const target = event.target && typeof event.target.closest === 'function'
        ? event.target.closest('[data-ide-file], [data-ide-node]') : null;
      if (!target) return;
      const mount = target.closest('[data-ide-root]');
      if (!mount) return;
      const scene = (globalThis.LECTURE_DATA.scenes || []).find(item => item.id === mount.dataset.ideScene);
      if (!scene || !scene.ide) return;
      const kind = target.dataset.ideNode ? 'node' : 'file';
      const id = kind === 'node' ? target.dataset.ideNode : target.dataset.ideFile;
      const fromTab = target.classList && target.classList.contains('d26-ide-tab');
      const wasExpanded = Boolean(mount.querySelector('.d26-ide-all-files[open]'));
      if (kind === 'node') C.selectIDENode(scene, id);
      else C.selectIDEFile(scene, id);
      mount.innerHTML = renderInside(scene);
      if (wasExpanded) {
        const allFiles = mount.querySelector('.d26-ide-all-files');
        if (allFiles) allFiles.open = true;
      }
      const selector = kind === 'node' ? '[data-ide-node]'
        : fromTab ? '.d26-ide-tab[data-ide-file]' : '.d26-ide-file[data-ide-file]';
      const focusTarget = Array.from(mount.querySelectorAll(selector)).find(button =>
        (kind === 'node' ? button.dataset.ideNode : button.dataset.ideFile) === id);
      if (focusTarget && typeof focusTarget.focus === 'function') {
        focusTarget.focus({ preventScroll: true });
      }
      const codeScroll = mount.querySelector('.d26-ide-code-scroll');
      const targetLine = codeScroll && codeScroll.querySelector('[data-ide-target]');
      if (kind === 'node' && targetLine && codeScroll.getBoundingClientRect
          && targetLine.getBoundingClientRect) {
        codeScroll.scrollTop += targetLine.getBoundingClientRect().top
          - codeScroll.getBoundingClientRect().top - 48;
      }
      const tabbar = mount.querySelector('.d26-ide-tabs');
      const activeTab = mount.querySelector('.d26-ide-tab-active');
      if (tabbar && activeTab && tabbar.getBoundingClientRect && activeTab.getBoundingClientRect) {
        const barRect = tabbar.getBoundingClientRect();
        const tabRect = activeTab.getBoundingClientRect();
        if (tabRect.right > barRect.right) tabbar.scrollLeft += tabRect.right - barRect.right;
        else if (tabRect.left < barRect.left) tabbar.scrollLeft -= barRect.left - tabRect.left;
      }
    });
  }
})();

/* Add the two requested teaching views without changing existing renderers. */
(() => {
  'use strict';
  const C = globalThis.D26;
  const baseRender = C.renderScene;
  C.renderScene = function(scene) {
    const original = baseRender(scene);
    if (!scene.codeComparison && !scene.ide) return original;
    const cut = original.indexOf('</header>') + '</header>'.length;
    const header = original.slice(0, cut);
    const priorExplanation = original.slice(cut);
    if (scene.codeComparison) {
      return `${header}${C.renderComparison(scene)}<details class="teaching-detail d26-compare-original" data-detail-key="${C.esc(scene.id)}-original"><summary>역할 비교와 용어 다시 보기</summary><div class="detail-content">${priorExplanation}</div></details>`;
    }
    return `${header}${C.renderIDE(scene)}<details class="teaching-detail d26-ide-original" data-detail-key="${C.esc(scene.id)}-original"><summary>LangChain을 도입하는 이유와 공식 문서</summary><div class="detail-content">${priorExplanation}</div></details>`;
  };
})();

/* UI controller only. Content and demonstrations are rendered by D26 modules. */
(() => {
  'use strict';
  if (typeof document === 'undefined') return;
  const C = globalThis.D26;
  const D = globalThis.LECTURE_DATA;
  const {esc, pre} = C;
  const clone = value => JSON.parse(JSON.stringify(value));
  const chapter = number => D.chapters.find(item => item.number === number);
  const isFrontmatter = scene => scene.kind === 'cover' || scene.kind === 'contents';
  const sceneClass = scene => isFrontmatter(scene) ? 'frontmatter-stage' : scene.kind === 'concept' ? 'concept-stage' : '';

  function init() {
    const stage = document.getElementById('stage');
    if (!stage) return;
    const scroll = document.getElementById('stageScroll');
    let index = 0;
    let reading = false;
    let selectedMapNode = null;
    let selectedMapChapter = null;
    let toastTimer;

    function fromHash() {
      try {
        const hash = decodeURIComponent(location.hash.slice(1));
        const key = D.sceneAliases?.[hash] || hash;
        return D.scenes.findIndex(scene => scene.id === key);
      } catch { return -1; }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, 2500);
    }

    function closeDialogs() {
      document.querySelectorAll('dialog[open]').forEach(dialog => dialog.close());
    }

    function miniMap(scene) {
      const ch = chapter(scene.chapter);
      const label = C.mapFocusLabel?.(scene.chapter || 0) || ch?.focusLabel || '전체 서비스 · 전체 구조';
      return `<button class="mini-map-button" data-action="atlasOpen" aria-label="현재 위치를 전체 지도에서 열기">${C.mapSVG(scene.chapter || 0, {mini: true})}<span><i></i>${esc(label)}</span><small>전체 지도 열기 · M</small></button>`;
    }

    function positionBar(scene) {
      const ch = chapter(scene.chapter);
      const focus = reading ? '전체 읽기' : C.mapFocusLabel?.(scene.chapter || 0) || ch?.focusLabel || ch?.title || '전체 서비스 · 전체 구조';
      const location = reading ? `${D.scenes.length}개 화면을 이어서 읽습니다.` : ch?.location || scene.title;
      return `<div class="position-strip"><span class="position-label">현재 위치</span><div><span>AI 업무 서비스</span><b>›</b><strong>${esc(focus)}</strong><small>${esc(location)}</small></div><button class="small" data-action="atlasOpen">전체 지도</button></div>`;
    }

    function sceneOptions(scenes) {
      return scenes.map(scene => {
        const value = D.scenes.indexOf(scene);
        return `<option value="${value}"${value === index ? ' selected' : ''}>${esc(scene.id === 'cover' ? '표지' : scene.kind === 'contents' ? '목차' : scene.title)}</option>`;
      }).join('');
    }

    function render() {
      const scene = D.scenes[index];
      const ch = chapter(scene.chapter);
      const front = isFrontmatter(scene) && !reading;
      const expanded = new Set([...stage.querySelectorAll('details[data-detail-key][open]')].map(item => item.dataset.detailKey));
      stage.className = 'stage' + (!reading && sceneClass(scene) ? ` ${sceneClass(scene)}` : '');
      scroll.classList.toggle('frontmatter-scroll', front);
      stage.innerHTML = reading
        ? D.scenes.map((item, itemIndex) => `<section class="stage d26-reader-section${sceneClass(item) ? ` ${sceneClass(item)}` : ''}" id="read-${esc(item.id)}"><div class="d26-reader-label">${itemIndex + 1} / ${D.scenes.length}</div>${C.renderScene(item)}</section>`).join('')
        : C.renderScene(scene);
      stage.querySelectorAll('details[data-detail-key]').forEach(item => {
        if (expanded.has(item.dataset.detailKey)) item.open = true;
      });

      const miniMount = document.getElementById('miniMapMount');
      const positionMount = document.getElementById('positionMount');
      miniMount.hidden = front;
      positionMount.hidden = front;
      miniMount.innerHTML = front ? '' : miniMap(scene);
      positionMount.innerHTML = front ? '' : positionBar(scene);
      document.getElementById('chapters').innerHTML = D.chapters.map(item => {
        const firstIndex = D.scenes.findIndex(candidate => candidate.chapter === item.number);
        return `<button class="chapter${scene.chapter === item.number ? ' active' : ''}" data-jump="${firstIndex}"${scene.chapter === item.number ? ' aria-current="step"' : ''}><span class="num">${String(item.number).padStart(2, '0')}</span><span>${esc(item.title)}</span></button>`;
      }).join('');

      const opening = D.scenes.filter(isFrontmatter);
      const jump = document.getElementById('sceneJump');
      jump.innerHTML = isFrontmatter(scene)
        ? sceneOptions(opening)
        : `<optgroup label="시작">${sceneOptions(opening)}</optgroup><optgroup label="${esc(ch.title)}">${sceneOptions(D.scenes.filter(item => item.chapter === scene.chapter))}</optgroup>`;
      jump.value = String(index);
      document.getElementById('sceneFooter').textContent = reading ? `전체 읽기 · ${D.scenes.length}개 화면` : `${index + 1} / ${D.scenes.length}`;
      document.getElementById('progress').style.width = `${(index + 1) / D.scenes.length * 100}%`;
      document.getElementById('prevScene').disabled = index === 0;
      document.getElementById('nextScene').disabled = index === D.scenes.length - 1;
      document.title = `${reading ? '전체 읽기' : `${index + 1}/${D.scenes.length} ${scene.title}`} · DAY26 Basic RAG & LangChain`;
      document.getElementById('sceneStatus').textContent = reading ? `전체 읽기. ${D.scenes.length}개 화면.` : `${index + 1} / ${D.scenes.length}. ${scene.title}`;
      scroll.scrollTop = 0;
    }

    function go(target, updateHash = true) {
      const key = typeof target === 'string' ? (D.sceneAliases?.[target] || target) : target;
      const next = typeof key === 'string' ? D.scenes.findIndex(scene => scene.id === key) : key;
      if (!Number.isFinite(next) || (typeof target === 'string' && next < 0)) return;
      index = Math.min(D.scenes.length - 1, Math.max(0, Math.floor(next)));
      reading = false;
      selectedMapNode = null;
      selectedMapChapter = null;
      closeDialogs();
      render();
      if (updateHash) {
        try { history.replaceState(null, '', `#${D.scenes[index].id}`); }
        catch { location.hash = D.scenes[index].id; }
      }
    }

    function dialog(id, body) {
      const element = document.getElementById(id);
      if (body !== undefined) element.querySelector('.dialog-body').innerHTML = body;
      if (!element.open) {
        closeDialogs();
        element.showModal();
      }
      return element;
    }

    function ioStrip(ch) {
      return ch ? `<div class="io-strip"><div><b>들어오는 것</b><span>${esc(ch.input)}</span></div><div><b>여기서 하는 일</b><span>${esc(ch.work)}</span></div><div><b>다음으로 넘길 것</b><span>${esc(ch.output)}</span></div></div>` : '';
    }

    function mapInspection() {
      const node = C.mapNodes.find(item => item.id === selectedMapNode);
      if (!node) return '';
      const target = node.target;
      const targetIndex = D.scenes.findIndex(scene => scene.id === target);
      return `<div class="atlas-inspect" role="status"><div><h3>${esc(node.title)}</h3><p>${esc(node.desc)}</p></div><div class="stack">${targetIndex >= 0 ? `<button class="small" data-action="atlasJump" data-scene="${esc(target)}">이 개념 설명으로 이동</button>` : `<span class="chip outline">${node.kind === 'future' ? '오늘은 위치만 확인' : '기존 맥락 확인'}</span>`}<button class="small" data-action="atlasClear">설명 접기</button></div></div>`;
    }

    function atlasModalBody() {
      const scene = D.scenes[index];
      const mapChapter = selectedMapChapter ?? scene.chapter;
      const ch = chapter(mapChapter);
      const heading = ch ? `<div class="row between"><div><h2>${esc(ch.location)}</h2></div></div>` : '<h2>전체 시스템</h2>';
      return `${heading}<div class="atlas-figure">${C.mapSVG(mapChapter || 0, {selected: selectedMapNode})}${C.mapLegend()}</div>${C.learningLocation(mapChapter)}${ioStrip(ch)}${mapInspection()}`;
    }

    function chapterFromMapElement(element) {
      const value = Number(element?.dataset?.mapChapter || element?.closest?.('[data-map-chapter]')?.dataset?.mapChapter);
      return D.chapters.some(item => item.number === value) ? value : null;
    }

    function openMap(element) {
      selectedMapNode = null;
      selectedMapChapter = chapterFromMapElement(element);
      dialog('atlasDialog', atlasModalBody());
    }

    function inspectMapNode(id, element) {
      if (id !== null && !C.mapNodes.some(node => node.id === id)) return;
      const mapDialog = document.getElementById('atlasDialog');
      if (!mapDialog.open) {
        selectedMapChapter = chapterFromMapElement(element);
        selectedMapNode = id;
        dialog('atlasDialog', atlasModalBody());
        return;
      }
      selectedMapNode = id;
      const body = mapDialog.querySelector('.dialog-body');
      const scrollTop = body.scrollTop;
      body.innerHTML = atlasModalBody();
      const focus = id === null ? mapDialog.querySelector('[data-action="atlasClose"]') : mapDialog.querySelector(`[data-action="atlasNode"][data-node="${id}"]`);
      focus?.focus({preventScroll: true});
      body.scrollTop = scrollTop;
    }

    function openReview() {
      const reviewWindow = window.open('', '_blank');
      if (!reviewWindow) {
        showToast('새 창이 차단되었습니다. 팝업을 허용한 뒤 핵심요약을 다시 누르세요.');
        return;
      }
      reviewWindow.document.open();
      reviewWindow.document.write(C.renderReviewDocument());
      reviewWindow.document.close();
    }

    function openGlossary() {
      dialog('glossaryDialog', `<label for="glossarySearch" class="d26-instruction">영어 이름 또는 한국어 설명으로 찾기</label><input id="glossarySearch" class="d26-search" type="search" placeholder="예: Document, Context, 출처"><div id="glossaryResults" class="d26-glossary-search-results">${C.renderGlossary()}</div>`);
    }

    function updateDemo(name, key, value, restoreFocus = false) {
      if (!Object.hasOwn(C.state, name) || !Object.hasOwn(C.state[name], key)) return;
      const active = document.activeElement;
      const selection = active?.dataset?.demo === name && active?.dataset?.key === key && typeof active.selectionStart === 'number'
        ? [active.selectionStart, active.selectionEnd] : null;
      C.state[name][key] = typeof C.state[name][key] === 'number' ? Number(value) : value;
      const shell = document.querySelector(`[data-demo-root="${name}"]`);
      if (!shell) return;
      shell.querySelector('.d26-demo-body').innerHTML = C.demos[name](C.state[name]);
      if (restoreFocus) {
        const input = shell.querySelector(`[data-key="${key}"]`);
        input?.focus({preventScroll: true});
        if (selection && typeof input?.setSelectionRange === 'function') input.setSelectionRange(...selection);
      }
    }

    async function copyCode(id) {
      const code = D.scenes.find(scene => scene.id === id)?.code?.raw;
      if (code === undefined) return;
      try {
        if (globalThis.navigator?.clipboard?.writeText) {
          await globalThis.navigator.clipboard.writeText(code);
          showToast('코드를 복사했습니다.');
          return;
        }
        const area = document.createElement('textarea');
        area.value = code;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        let copied;
        try { area.select(); copied = document.execCommand('copy'); }
        finally { area.remove(); }
        if (!copied) throw new Error('Copy unavailable');
        showToast('코드를 복사했습니다.');
      } catch {
        dialog('sourceDialog', `<p class="smalltext muted">자동 복사를 사용할 수 없습니다. 아래 코드를 선택해 복사하세요.</p>${pre(code)}`);
      }
    }

    async function fullScreen() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch { showToast('브라우저의 전체화면 기능을 이용하세요.'); }
    }

    const actions = {
      next: () => go(index + 1),
      prev: () => go(index - 1),
      atlasOpen: openMap,
      atlasClose: () => { document.getElementById('atlasDialog').close(); selectedMapNode = null; selectedMapChapter = null; },
      atlasNode: element => inspectMapNode(element.dataset.node, element),
      atlasClear: () => inspectMapNode(null),
      atlasJump: element => go(element.dataset.scene),
      review: openReview,
      glossary: openGlossary,
      help: () => dialog('helpDialog', C.renderHelp(reading)),
      fullscreen: fullScreen,
      read: () => { reading = !reading; selectedMapNode = null; closeDialogs(); render(); },
      close: closeDialogs
    };

    document.addEventListener('click', event => {
      const element = event.target.closest?.('button,a,[data-action]');
      if (!element) return;
      if (element.hasAttribute('data-jump')) { event.preventDefault(); go(Number(element.dataset.jump)); }
      else if (element.dataset.action && actions[element.dataset.action]) { event.preventDefault(); actions[element.dataset.action](element); }
      else if (element.dataset.code) copyCode(element.dataset.code);
      else if (element.dataset.setDemo) updateDemo(element.dataset.setDemo, element.dataset.key, element.dataset.value);
      else if (element.dataset.resetDemo) {
        const name = element.dataset.resetDemo;
        if (!Object.hasOwn(C.defaults, name)) return;
        C.state[name] = clone(C.defaults[name]);
        element.closest('[data-demo-root]').querySelector('.d26-demo-body').innerHTML = C.demos[name](C.state[name]);
      } else if (element.dataset.source) {
        const hit = C.corpus.find(item => item.citation_id === Number(element.dataset.source));
        if (hit) dialog('sourceDialog', `<div class="d26-dialog-text"><h3>[${hit.citation_id}] ${esc(hit.title)}</h3><p><strong>${esc(hit.doc_id)}</strong> · ${esc(hit.source_version)} · ${esc(hit.category)}</p><p>${esc(hit.source_locator)}</p><div class="d26-question">${esc(hit.body)}</div><p class="smalltext muted">교육용 문서 · 실제 DB ID가 아닌 강의용 ID입니다. 이 위치는 모델이 만든 경로가 아니라 시연 Corpus의 레코드에서 가져왔습니다.</p></div>`);
      }
    });

    document.addEventListener('change', event => {
      const element = event.target;
      if (element.id === 'sceneJump') go(Number(element.value));
      else if (element.dataset.demo) updateDemo(element.dataset.demo, element.dataset.key, element.type === 'checkbox' ? element.checked : element.value, true);
    });

    document.addEventListener('input', event => {
      const element = event.target;
      if (element.id === 'glossarySearch') document.getElementById('glossaryResults').innerHTML = C.renderGlossary(element.value);
      else if (element.type === 'range' && element.dataset.demo) {
        const output = element.closest('label')?.querySelector('output');
        if (output) output.textContent = element.value;
      }
    });

    document.addEventListener('keydown', event => {
      const element = event.target;
      if (event.ctrlKey || event.altKey || event.metaKey) return;
      if (element.matches('input,select,textarea') || element.isContentEditable) {
        if (event.key === 'Enter' && element.type === 'text' && element.dataset.demo) {
          event.preventDefault();
          updateDemo(element.dataset.demo, element.dataset.key, element.value, true);
        }
        return;
      }
      const mapNode = element.closest?.('[data-action="atlasNode"]');
      if (mapNode && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        inspectMapNode(mapNode.dataset.node);
        return;
      }
      if (document.querySelector('dialog[open]')) return;
      if (reading && ['PageDown', 'PageUp', 'Home', 'End', ' '].includes(event.key)) return;
      const key = event.key.toLowerCase();
      const keys = {
        arrowright: () => go(index + 1), pagedown: () => go(index + 1),
        arrowleft: () => go(index - 1), pageup: () => go(index - 1),
        home: () => go(0), end: () => go(D.scenes.length - 1),
        m: openMap, g: openGlossary, f: fullScreen,
        '?': () => dialog('helpDialog', C.renderHelp(reading))
      };
      if (key === ' ' && !element.closest('button,a,summary')) { event.preventDefault(); go(index + 1); }
      else if (keys[key]) { event.preventDefault(); keys[key](); }
    });

    window.addEventListener('hashchange', () => {
      const next = fromHash();
      if (next >= 0 && (next !== index || reading)) go(next, false);
    });

    document.getElementById('atlasDialog').addEventListener('close', () => { selectedMapNode = null; });
    C.player = {go, render, openMap, openReview, get currentIndex() { return index; }, get reading() { return reading; }};
    const initial = fromHash();
    if (initial >= 0) index = initial;
    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, {once: true});
  else init();
})();



</script></body></html>
