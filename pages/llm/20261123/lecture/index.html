irements.txt</h3><p>이 화면에서 추가로 읽는 LangChain 관련 의존성입니다. 설치 버전과 전체 목록은 배포 실습자료를 따릅니다.</p><pre class="d26-ide-pre d26-ide-pre-reference" aria-label="requirements.txt 소스코드"><code><span class="d26-ide-line" data-ide-line="1"><span class="d26-ide-line-number" aria-hidden="true">1</span><span class="d26-ide-line-code"># 구조 이해에 필요한 주요 Package 이름</span></span><span class="d26-ide-line" data-ide-line="2"><span class="d26-ide-line-number" aria-hidden="true">2</span><span class="d26-ide-line-code">langchain-core  # Runnable·Prompt·Document의 기본 기능</span></span><span class="d26-ide-line" data-ide-line="3"><span class="d26-ide-line-number" aria-hidden="true">3</span><span class="d26-ide-line-code">langchain-openai  # OpenAI Chat Model 연결</span></span><span class="d26-ide-line" data-ide-line="4"><span class="d26-ide-line-number" aria-hidden="true">4</span><span class="d26-ide-line-code">python-dotenv  # .env의 환경 설정 읽기</span></span><span class="d26-ide-line" data-ide-line="5"><span class="d26-ide-line-number" aria-hidden="true">5</span><span class="d26-ide-line-code"> </span></span><span class="d26-ide-line" data-ide-line="6"><span class="d26-ide-line-number" aria-hidden="true">6</span><span class="d26-ide-line-code"># E5·DB 및 전체 버전은 기존 실습 requirements를 이어 사용합니다.</span></span></code></pre></section></div></details></div><details class="teaching-detail d26-ide-original" data-detail-key="ch3-why-langchain-original"><summary>LangChain을 도입하는 이유와 공식 문서</summary><div class="detail-content"><div class="table-wrap axis-table"><table><thead><tr><th scope="col">서비스를 바꿀 때 생기는 작업</th><th scope="col">직접 코드에서 관리할 부분</th><th scope="col">LangChain이 제공하는 도움</th></tr></thead><tbody><tr class="d26-table-row"><th scope="row">같은 규칙에 질문·문서를 바꾸기</th><td>메시지의 역할과 변수 삽입 코드를 여러 곳에서 일관되게 유지</td><td>Prompt Template에 고정 규칙과 바뀌는 값을 나누어 정의</td></tr><tr class="d26-table-row"><th scope="row">모델 제공자를 바꾸어 비교하기</th><td>제공자마다 다른 요청·응답 형식에 맞추어 호출 코드 수정</td><td>Chat Model의 공통 호출 방식과 제공자별 연결 구현 사용</td></tr><tr class="d26-table-row"><th scope="row">검색·근거 구성·생성 단계를 연결하기</th><td>앞 단계의 반환값을 다음 단계로 전달하는 실행 코드 작성</td><td>Runnable로 실행 단위를 맞추고 Chain으로 순서 표현</td></tr></tbody></table></div><p class="smalltext muted spaced">여기서 SDK는 외부 API를 Python 함수나 객체로 호출하도록 제공하는 코드 묶음입니다. LangChain은 연결을 돕지만 질문·근거의 선택이나 답변 품질을 자동으로 결정하지 않습니다. 모델을 바꾸면 지원 기능·설정·응답 품질을 다시 확인합니다.</p><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>도입 판단</b><span>API를 한 번 부르는 작은 기능은 직접 코드가 더 단순할 수 있습니다. 여러 구성요소를 반복해서 연결·교체할 때 공통 방식의 이점을 비교합니다.<small>공통 기능을 얻는 대신 LangChain의 객체·자료형·Package 호환 관계도 배워야 합니다.</small></span></p></section><details class="teaching-detail d26-refs"><summary>원문 참고 · 6개</summary><div class="detail-content"><ul><li><a href="https://docs.langchain.com/oss/python/langchain/models" target="_blank" rel="noopener noreferrer">LangChain · Models</a></li><li><a href="https://reference.langchain.com/python/langchain-core/runnables/base/Runnable" target="_blank" rel="noopener noreferrer">LangChain Core · Runnable</a></li><li><a href="https://reference.langchain.com/python/langchain-core/runnables/base/RunnableSequence" target="_blank" rel="noopener noreferrer">LangChain Core · RunnableSequence와 | 연결</a></li><li><a href="https://reference.langchain.com/python/langchain-core/prompts/chat/ChatPromptTemplate" target="_blank" rel="noopener noreferrer">LangChain Core · ChatPromptTemplate</a></li><li><a href="https://reference.langchain.com/python/langchain-core/output_parsers/string/StrOutputParser" target="_blank" rel="noopener noreferrer">LangChain Core · StrOutputParser</a></li><li><a href="https://docs.langchain.com/oss/python/deepagents/retrieval" target="_blank" rel="noopener noreferrer">LangChain · Retrieval / 2-step RAG의 검색 후 생성 흐름</a></li></ul></div></details></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">22 / 82</div><div><header class="scene-head"><h1>LangChain은 업무 입력을 모델 작업으로 연결하는 곳에 사용합니다</h1><p>아래는 현업 서비스를 설계할 때의 적용 예시입니다. 화면과 DB를 포함한 전체 서비스 안에서 LangChain이 담당할 코드를 구분해 봅니다.</p></header><div class="table-wrap axis-table"><table><thead><tr><th scope="col">업무와 입력</th><th scope="col">LangChain을 사용하는 부분</th><th scope="col">서비스가 계속 맡는 부분</th></tr></thead><tbody><tr class="d26-table-row"><th scope="row">보고서 요약
사용자가 선택한 보고서 본문</th><td>요약 규칙과 본문으로 Prompt를 만들고 모델을 호출해 요약 결과 수신</td><td>보고서 조회·접근 권한, 요약 결과 검증·저장, 사용자에게 응답</td></tr><tr class="d26-table-row"><th scope="row">문서 Q&amp;A · 오늘
질문과 검색한 규정의 본문·출처</th><td>검색 결과를 Document로 표현하고, Context·Prompt·모델 호출을 연결</td><td>현재 공개 문서 검색 조건, 실제 포함 출처 보관, 답변·근거 확인</td></tr><tr class="d26-table-row"><th scope="row">도구를 사용하는 업무 지원 · 후속
사용자 목표와 실행 가능한 도구</th><td>모델과 Tool을 연결하는 Agent 기능에도 같은 모델·메시지 구성요소 사용</td><td>도구 권한, 실행 허용 범위, 실패 처리와 종료 조건</td></tr></tbody></table></div><p class="smalltext muted spaced">전체그림의 FastAPI 안에서 RAG 서비스 코드가 실행되고, 그 코드가 LangChain 구성요소를 사용합니다. LangChain을 배운다고 웹 API·DB·모델의 역할이 합쳐지는 것은 아닙니다. 오늘은 문서 Q&amp;A의 정해진 순서를 구현합니다.</p><details class="teaching-detail d26-refs"><summary>원문 참고 · 2개</summary><div class="detail-content"><ul><li><a href="https://docs.langchain.com/oss/python/langchain/overview" target="_blank" rel="noopener noreferrer">LangChain · Overview</a></li><li><a href="https://docs.langchain.com/oss/python/langchain/models" target="_blank" rel="noopener noreferrer">LangChain · Models</a></li></ul></div></details></div></article><article class="d26-reader-section concept-stage"><div class="d26-reader-label">23 / 82</div><div><header class="scene-head"><h1>공통 실행 방식은 입력을 넣고 결과를 받는 방법을 맞춥니다</h1><p>Python에서는 clean_question(raw)처럼 함수를 실행합니다. LangChain의 Runnable은 실행할 기능을 객체로 준비한 뒤 step.invoke(raw)라는 방식으로 호출합니다.</p></header><div class="concept-grid"><div class="concept-explanation"><section><h2>객체 준비와 실행을 나누기</h2><p>객체는 필요한 설정과 기능을 함께 담아 준비한 값입니다. Class는 그런 객체를 만드는 설계입니다. RunnableLambda(clean_question)은 clean_question 함수를 실행 대상으로 담은 객체를 만듭니다. 이때 함수의 결과를 계산하지는 않습니다.</p></section><section><h2>점(.)과 괄호를 읽기</h2><p>step.invoke(raw)에서 step은 실행할 객체, invoke는 그 객체의 실행 기능, raw는 전달할 입력입니다. 객체가 가진 함수를 메서드라고 합니다. 입력을 처리한 결과는 반환값으로 받습니다.</p></section></div><section class="concept-example"><section><h2>같은 invoke가 하는 서로 다른 일</h2><p>Python 함수를 감싼 객체는 그 함수를 실행합니다. Prompt 객체는 질문·근거로 메시지를 만들고, Chat Model 객체는 메시지로 모델을 호출합니다. 호출 방법을 맞추어도 각 객체가 맡은 작업은 다릅니다.</p></section><section><h2>입력의 모양은 확인하기</h2><p>같은 invoke를 사용해도 어떤 단계는 문자열, 다른 단계는 question·context가 있는 dict를 받습니다. 앞 단계의 출력이 다음 단계에서 사용할 수 있는 형태인지 개발자가 맞춰야 합니다.</p></section><pre>clean_question(raw)       # Python 함수 실행
step = RunnableLambda(clean_question)  # 실행할 함수를 보관
result = step.invoke(raw)  # 입력을 넣어 실제 실행</pre></section></div><p class="concept-distinction">공통 Interface는 “어떤 방법으로 호출하고 결과를 받을지”에 대한 약속입니다. 여기서는 invoke라는 실행 방법을 맞춥니다. 모든 객체가 같은 입력을 받거나 모두 모델 API를 호출한다는 뜻은 아닙니다.</p><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>Runnable</b><span>입력을 받아 작업을 실행하고 결과를 돌려주는 LangChain의 실행 단위<small>Python 함수·Prompt·Chat Model을 공통 실행 방식으로 다루기</small></span></p><p><b>invoke</b><span>하나의 입력을 넣어 해당 실행 단위의 작업을 수행하고 결과를 받는 메서드<small>함수 실행인지 메시지 작성인지 모델 호출인지는 실행 대상에 따라 결정</small></span></p></section><details class="teaching-detail d26-refs"><summary>원문 참고 · 3개</summary><div class="detail-content"><ul><li><a href="https://reference.langchain.com/python/langchain-core/runnables/base/Runnable" target="_blank" rel="noopener noreferrer">LangChain Core · Runnable</a></li><li><a href="https://reference.langchain.com/python/langchain-core/runnables/base/RunnableLambda" target="_blank" rel="noopener noreferrer">LangChain Core · RunnableLambda</a></li><li><a href="https://docs.langchain.com/oss/python/langchain/models" target="_blank" rel="noopener noreferrer">LangChain · Models</a></li></ul></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">24 / 82</div><div><header class="scene-head"><h1>먼저 Python 함수 사이에서 값이 이동하는 과정을 봅니다</h1><p>질문의 앞뒤 공백을 제거한 뒤 dict에 담습니다. 첫 함수의 반환값을 두 번째 함수에 전달하는 원리부터 확인합니다.</p></header><div class="io-strip"><div><b>들어오는 것 · 입력 / 전제</b><span>입력: 앞뒤에 공백이 있는 문자열 "  15분 늦으면?  ". 일반 Python으로 실행합니다.</span></div><div><b>여기서 하는 일</b><span>일반 Python · 중간값을 변수로 전달</span></div><div><b>다음으로 넘길 것 · 출력 / 관찰</b><span>출력: 공백을 제거한 문자열, 그리고 {"question": "15분 늦으면?"}.</span></div></div>
      <section class="inline-python" aria-label="본문 Python 코드"><section class="python-block" data-code-key="ch3-python-value-flow" aria-label="Python · 일반 Python · 중간값을 변수로 전달"><header class="python-editor-bar"><span class="python-tab"><span class="python-file-mark" aria-hidden="true">py</span>Python</span><h3>일반 Python · 중간값을 변수로 전달</h3><button class="small d26-copy" data-code="ch3-python-value-flow" aria-label="먼저 Python 함수 사이에서 값이 이동하는 과정을 봅니다 코드 복사">코드 복사</button></header><pre><code class="python-source" aria-label="Python 소스코드"><span class="python-line" data-line="1"><span class="py-keyword">def</span> <span class="py-function">clean_question</span>(question: str) -&gt; str:</span>
<span class="python-line" data-line="2">    <span class="py-keyword">return</span> question.strip()  <span class="py-comment"># 질문 양끝의 공백만 제거합니다.</span></span>
<span class="python-line" data-line="3"><br></span>
<span class="python-line" data-line="4"><span class="py-keyword">def</span> <span class="py-function">make_input</span>(question: str) -&gt; dict:</span>
<span class="python-line" data-line="5">    <span class="py-keyword">return</span> {<span class="py-string">"</span><span class="py-string">question</span><span class="py-string">"</span>: question}  <span class="py-comment"># 질문을 이름 있는 입력값으로 묶습니다.</span></span>
<span class="python-line" data-line="6"><br></span>
<span class="python-line" data-line="7">raw = <span class="py-string">"</span><span class="py-string">  15분 늦으면?  </span><span class="py-string">"</span></span>
<span class="python-line" data-line="8">cleaned = clean_question(raw)</span>
<span class="python-line" data-line="9"><span class="py-comment"># 앞 함수의 출력을 다음 함수에 전달합니다.</span></span>
<span class="python-line" data-line="10">direct = make_input(cleaned)</span>
<span class="python-line" data-line="11">print(cleaned)</span>
<span class="python-line" data-line="12">print(direct)</span></code></pre></section><p class="template-note">strip()은 문자열 양끝의 공백을 제거합니다. return은 처리한 값을 함수를 호출한 곳으로 돌려줍니다. cleaned에 그 값을 보관하고 다음 함수에 넣습니다.</p></section><section class="spaced"><h2>코드가 실행되는 순서</h2><div class="table-wrap axis-table"><table><thead><tr><th scope="col">확인할 단계</th><th scope="col">실제로 하는 일</th></tr></thead><tbody><tr class="d26-table-row"><th scope="row">① 공백 제거</th><td>clean_question(raw)에 "  15분 늦으면?  "를 넣으면 "15분 늦으면?"를 반환합니다. cleaned는 이 문자열입니다.</td></tr><tr class="d26-table-row"><th scope="row">② dict에 담기</th><td>make_input(cleaned)는 바로 그 문자열을 받아 {"question": "15분 늦으면?"}를 반환합니다. direct가 이 dict입니다.</td></tr><tr class="d26-table-row"><th scope="row">③ 출력 확인</th><td>첫 print는 15분 늦으면?를, 두 번째 print는 {'question': '15분 늦으면?'}를 표시합니다. 다음 페이지에서도 같은 두 함수와 입력을 사용합니다.</td></tr></tbody></table></div></section><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>반환값 전달</b><span>앞 함수가 돌려준 결과를 다음 함수의 입력으로 사용하는 것입니다. 지금은 중간값 cleaned를 코드에 직접 적어 연결했습니다.<small>함수 호출 순서와 실제 전달되는 값을 먼저 읽습니다.</small></span></p></section></div></article><article class="d26-reader-section"><div class="d26-reader-label">25 / 82</div><div><header class="scene-head"><h1>같은 두 함수를 Runnable로 연결하고 invoke로 실행합니다</h1><p>앞 페이지와 같은 작업입니다. 이번에는 각 함수를 Runnable로 감싸고, 앞 단계의 반환값이 다음 단계로 전달되도록 순서를 연결합니다.</p></header><div class="io-strip"><div><b>들어오는 것 · 입력 / 전제</b><span>입력: "  15분 늦으면?  ". langchain-core가 설치된 Python 환경에서 실행합니다.</span></div><div><b>여기서 하는 일</b><span>LangChain · 같은 작업을 Chain으로 실행</span></div><div><b>다음으로 넘길 것 · 출력 / 관찰</b><span>출력: {"question": "15분 늦으면?"}. 앞 페이지의 direct와 같은 결과입니다.</span></div></div>
      <section class="inline-python" aria-label="본문 Python 코드"><section class="python-block" data-code-key="ch3-python-to-runnable" aria-label="Python · LangChain · 같은 작업을 Chain으로 실행"><header class="python-editor-bar"><span class="python-tab"><span class="python-file-mark" aria-hidden="true">py</span>Python</span><h3>LangChain · 같은 작업을 Chain으로 실행</h3><button class="small d26-copy" data-code="ch3-python-to-runnable" aria-label="같은 두 함수를 Runnable로 연결하고 invoke로 실행합니다 코드 복사">코드 복사</button></header><pre><code class="python-source" aria-label="Python 소스코드"><span class="python-line" data-line="1"><span class="py-keyword">from</span> langchain_core.runnables <span class="py-keyword">import</span> RunnableLambda</span>
<span class="python-line" data-line="2"><br></span>
<span class="python-line" data-line="3"><span class="py-keyword">def</span> <span class="py-function">clean_question</span>(question: str) -&gt; str:</span>
<span class="python-line" data-line="4">    <span class="py-keyword">return</span> question.strip()</span>
<span class="python-line" data-line="5"><br></span>
<span class="python-line" data-line="6"><span class="py-keyword">def</span> <span class="py-function">make_input</span>(question: str) -&gt; dict:</span>
<span class="python-line" data-line="7">    <span class="py-keyword">return</span> {<span class="py-string">"</span><span class="py-string">question</span><span class="py-string">"</span>: question}</span>
<span class="python-line" data-line="8"><br></span>
<span class="python-line" data-line="9"><span class="py-comment"># Python 함수를 Runnable 실행 단위로 감쌉니다.</span></span>
<span class="python-line" data-line="10">clean_step = RunnableLambda(clean_question)</span>
<span class="python-line" data-line="11">input_step = RunnableLambda(make_input)</span>
<span class="python-line" data-line="12">chain = clean_step | input_step  <span class="py-comment"># 실행 순서만 연결합니다.</span></span>
<span class="python-line" data-line="13"><span class="py-comment"># invoke()에서 연결한 두 함수를 실행합니다.</span></span>
<span class="python-line" data-line="14">result = chain.invoke(<span class="py-string">"</span><span class="py-string">  15분 늦으면?  </span><span class="py-string">"</span>)</span>
<span class="python-line" data-line="15">print(result)</span></code></pre></section><p class="template-note">RunnableLambda에는 def로 만든 함수 자체를 넘깁니다. clean_question은 함수이고, clean_question(raw)는 함수를 실행하는 표현입니다. |는 실행 순서를 준비하며, 이 연결 문장 자체는 두 함수를 실행하지 않습니다.</p></section><section class="spaced"><h2>코드가 실행되는 순서</h2><div class="table-wrap axis-table"><table><thead><tr><th scope="col">확인할 단계</th><th scope="col">실제로 하는 일</th></tr></thead><tbody><tr class="d26-table-row"><th scope="row">① invoke로 시작</th><td>chain.invoke(...)가 "  15분 늦으면?  "를 clean_step에 전달합니다. clean_question이 실행되어 "15분 늦으면?"를 반환합니다.</td></tr><tr class="d26-table-row"><th scope="row">② 다음 단계에 전달</th><td>Chain이 그 문자열을 input_step의 입력으로 전달합니다. make_input이 실행되어 {"question": "15분 늦으면?"}를 반환합니다.</td></tr><tr class="d26-table-row"><th scope="row">③ 마지막 결과 받기</th><td>마지막 단계의 dict가 chain.invoke(...)의 반환값이 되어 result에 담깁니다. 이 예제는 모델·DB를 호출하지 않습니다.</td></tr></tbody></table></div></section><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>Chain</b><span>여러 실행 단위를 연결한 작업 흐름. 이 예제의 순차 Chain은 앞 단계의 반환값을 다음 단계의 입력으로 사용합니다.<small>clean_step | input_step을 만들고 chain.invoke(raw)로 실행</small></span></p><p><b>주의할 점</b><span>순서를 뒤집어 실행하면 dict가 문자열용 strip()에 들어가 오류가 납니다. 연결 기호는 입력 형식을 자동으로 맞추지 않습니다.<small>지금은 question만 준비했습니다. 실제 RAG Prompt에는 context도 필요합니다.</small></span></p></section><details class="teaching-detail d26-refs"><summary>원문 참고 · 2개</summary><div class="detail-content"><ul><li><a href="https://reference.langchain.com/python/langchain-core/runnables/base/RunnableLambda" target="_blank" rel="noopener noreferrer">LangChain Core · RunnableLambda</a></li><li><a href="https://reference.langchain.com/python/langchain-core/runnables/base/RunnableSequence" target="_blank" rel="noopener noreferrer">LangChain Core · RunnableSequence</a></li></ul></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">26 / 82</div><div><header class="scene-head"><h1>필요한 기능을 Package에서 가져와 사용합니다</h1><p>앞 예제의 RunnableLambda는 langchain-core에 들어 있습니다. 이번 수업은 공통 구성요소와 모델 제공자 연결 Package를 나누어 사용합니다.</p></header><div class="table-wrap axis-table"><table><thead><tr><th scope="col">준비할 Package</th><th scope="col">코드에서 가져오는 것</th><th scope="col">이번 수업의 역할</th></tr></thead><tbody><tr class="d26-table-row"><th scope="row">langchain-core</th><td>langchain_core.documents / prompts / runnables</td><td>Document·ChatPromptTemplate·RunnableLambda</td></tr><tr class="d26-table-row"><th scope="row">langchain-openai</th><td>langchain_openai.ChatOpenAI</td><td>OpenAI API에 연결하는 Chat Model</td></tr><tr class="d26-table-row"><th scope="row">pydantic · v2</th><td>BaseModel·ConfigDict</td><td>생성 결과의 자료형과 애플리케이션 규칙 검사</td></tr><tr class="d26-table-row"><th scope="row">기존 검색 환경</th><td>E5 encoder·encode_query·search_current</td><td>기존 pgvector 데이터와 공개 버전 조건 재사용</td></tr></tbody></table></div><p class="smalltext muted spaced">Package는 설치할 코드 묶음이며, import는 그중 사용할 기능을 가져오는 문장입니다. 설치 이름 langchain-core의 하이픈(-)과 코드 경로 langchain_core의 밑줄(_)을 구분합니다. 호환되는 Package를 준비한 뒤 실행합니다.</p><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>langchain-core</b><span>Document·Prompt·Runnable 등 LangChain 생태계에서 사용하는 공통 자료형과 실행 기능<small>from langchain_core.runnables import RunnableLambda</small></span></p><p><b>langchain-openai</b><span>공통 Chat Model 호출을 OpenAI 모델 API와 연결하는 구현<small>from langchain_openai import ChatOpenAI</small></span></p><p><b>langchain</b><span>Agent 구성 등 상위 기능을 제공하는 Package. 오늘의 고정 RAG 예제는 core와 제공자 연결 기능을 직접 사용합니다.<small>설치 이름이 모두 langchain 하나인 것은 아닙니다.</small></span></p></section><details class="teaching-detail d26-refs"><summary>원문 참고 · 2개</summary><div class="detail-content"><ul><li><a href="https://reference.langchain.com/python/langchain/overview" target="_blank" rel="noopener noreferrer">LangChain · Package reference</a></li><li><a href="https://docs.langchain.com/oss/python/langchain/models" target="_blank" rel="noopener noreferrer">LangChain · Models</a></li></ul></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">27 / 82</div><div><header class="scene-head"><h1>자료를 담는 객체와 작업을 실행하는 객체를 구분합니다</h1><p>작은 함수 예제에서 확인한 입력과 출력의 자리에, 이제 RAG의 문서·메시지·모델 응답을 넣어 봅니다.</p></header><div class="table-wrap axis-table"><table><thead><tr><th scope="col">구성요소와 역할</th><th scope="col">넣는 값</th><th scope="col">다음 단계에 전달할 값</th></tr></thead><tbody><tr class="d26-table-row"><th scope="row">Document · 자료 보관</th><td>검색 본문 page_content와 출처 metadata</td><td>본문과 출처를 읽을 수 있는 데이터 객체. 여러 개면 list[Document]</td></tr><tr class="d26-table-row"><th scope="row">Retriever · 검색 실행</th><td>우리 어댑터의 query·category·candidate_k가 있는 dict</td><td>조건에 맞게 검색한 list[Document]</td></tr><tr class="d26-table-row"><th scope="row">ChatPromptTemplate · 메시지 작성</th><td>question·context가 있는 dict</td><td>ChatPromptValue: 모델이 읽을 메시지들을 담은 값</td></tr><tr class="d26-table-row"><th scope="row">Chat Model · 답변 요청</th><td>ChatPromptValue 또는 메시지 목록</td><td>AIMessage: 모델이 반환한 응답 본문과 호출 정보를 담은 값</td></tr></tbody></table></div><p class="smalltext muted spaced">Document는 데이터를 담는 객체이므로 Document.invoke로 답변을 만들지 않습니다. 우리 Retriever는 Python 검색 함수를 RunnableLambda로 감싼 구현입니다. 검색 결과를 Context 문자열로 정리한 뒤 question과 함께 Prompt에 전달합니다.</p><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>Input / Output contract</b><span>한 단계가 받아야 할 입력과 돌려줘야 할 출력의 형식에 대한 약속<small>Prompt에 documents 목록 대신 question·context 두 문자열을 전달</small></span></p></section><details class="teaching-detail d26-refs"><summary>원문 참고 · 2개</summary><div class="detail-content"><ul><li><a href="https://reference.langchain.com/python/langchain-core/documents/base/Document" target="_blank" rel="noopener noreferrer">LangChain Core · Document</a></li><li><a href="https://reference.langchain.com/python/langchain-core/runnables/base/RunnableLambda" target="_blank" rel="noopener noreferrer">LangChain Core · RunnableLambda</a></li></ul></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">28 / 82</div><div><header class="scene-head"><h1>익힌 연결 원리를 실제 RAG 구성요소에 적용합니다</h1><p>공통 실행 방법과 입출력을 이해했다면, 전체그림에서 본 RAG의 각 역할을 코드의 어느 구성요소로 구현하는지 읽을 수 있습니다.</p></header><figure class="d26-arch-figure d26-arch-langchain"><div class="d26-arch-scroll"><svg class="d26-arch-svg" xmlns="http://www.w3.org/2000/svg" viewbox="0 0 1120 350" role="img" aria-labelledby="d26-arch-langchain-2-title d26-arch-langchain-2-desc" data-arch-mode="langchain">
        <title id="d26-arch-langchain-2-title">같은 RAG 역할에 LangChain 구성요소 대응하기</title><desc id="d26-arch-langchain-2-desc">질문과 조건은 Retriever, Context Builder, Prompt, Generator, Validation과 Source 연결을 순서대로 거쳐 API 응답이 됩니다. Context에 실제 포함한 문서와 ID는 생성 결과와 별도로 보관하여 Validation에 전달합니다. LangChain 대응에서는 검색 어댑터와 Document, build_context, ChatPromptTemplate, ChatOpenAI, Python과 Pydantic 검증을 사용합니다.</desc>

    </g></g></svg></div></figure><div class="d26-arch-explanations d26-arch-three"><section><h2>검색 함수에서 Document로</h2><p>기존 검색 함수에 RunnableLambda를 붙입니다. 검색 본문과 출처는 Document에 담아 다음 단계로 보냅니다. 무엇을 검색할지는 기존 E5·SQL 조건으로 결정합니다.</p></section><section><h2>Context에서 모델 입력으로</h2><p>Python 함수가 사용할 근거를 고릅니다. ChatPromptTemplate이 question·context로 메시지를 만들고, ChatOpenAI가 그 메시지로 모델 API를 호출합니다.</p></section><section><h2>생성 결과에서 API 응답으로</h2><p>모델 응답을 받은 뒤 Python 검증 코드가 형식·출처 규칙을 확인합니다. 실제 포함한 문서 정보는 별도로 보관하여 원문 출처를 연결합니다.</p></section></div><p class="d26-arch-note">LangChain이 제공하는 부품을 사용해도 검색 조건·근거 선택·검증 책임은 애플리케이션에 남습니다. 오늘은 코드가 정한 순서대로 실행하며, 모델이 다음 도구를 선택하는 Agent 제어는 후속 수업에서 배웁니다.</p><details class="teaching-detail d26-refs"><summary>원문 참고 · 2개</summary><div class="detail-content"><ul><li><a href="https://docs.langchain.com/oss/python/langchain/models" target="_blank" rel="noopener noreferrer">LangChain · Models</a></li><li><a href="https://reference.langchain.com/python/langchain-core/runnables/base/RunnableSequence" target="_blank" rel="noopener noreferrer">LangChain Core · RunnableSequence</a></li></ul></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">29 / 82</div><div><header class="scene-head"><h1>시연 · 구성요소의 입력과 출력을 맞춥니다</h1><p>각 구성요소가 받는 값과 내보내는 값을 짚으면 LangChain 코드의 연결 지점을 찾을 수 있습니다.</p></header><section class="d26-demo" data-demo-root="component-map"><header class="d26-demo-head row between"><div class="row"><strong>LANGCHAIN COMPONENTS · 입력과 출력</strong><span class="chip outline">OFFLINE · 교육용 시연</span></div><button class="small" data-reset-demo="component-map">초기값</button></header><div class="d26-demo-body"><div class="d26-controls"><label class="d26-control"><span>구성요소</span><select data-demo="component-map" data-key="component"><option value="document">Document</option><option value="retriever" selected>Retriever</option><option value="prompt">ChatPromptTemplate</option><option value="model">Chat Model</option><option value="chain">RunnableSequence</option><option value="structured">Structured Output</option></select></label></div><p class="d26-question">retriever.invoke(request)</p><div class="d26-split"><section class="card d26-panel"><h2>입력</h2><pre class="d26-pre">{
  "query": "회의실을 이용하려면 무엇을 해야 하나요?",
  "category": "시설",
  "candidate_k": 3
}</pre></section><section class="card d26-panel"><h2>출력·자료 표현</h2><pre class="d26-pre">[
  {
    "page_content": "컴퓨터 실습실은 안내에 따라 이용합니다. 회의실은 예약 승인 후 이용합니다. 장비 이상은 운영실에 알립니다.",
    "metadata": {
      "citation_id": 203,

      "doc_id": "DOC-FACILITY",
      "source_version": "v1",
      "source_locator": "facility.html#main",
      "category": "시설"
    }
  }
]</pre></section></div><p class="d26-note">이 강의의 검색 Runnable은 요청 dict를 받고 Document 목록을 반환합니다. 일반 BaseRetriever의 질문 문자열 계약과 구분합니다.</p><p class="d26-live-note">Python 객체의 입력·출력을 설명하기 위한 표현입니다. 이 HTML에서 LangChain을 실행하지 않습니다. 선택한 구성요소마다 자료형이 어떻게 달라지는지 확인합니다.</p></div></section>
      <details class="teaching-detail" data-detail-key="ch3-component-map-demo-observe"><summary>시연에서 관찰할 것</summary><div class="detail-content"><div class="cols d26-demo-explain"><section><section><h3>Document부터 확인</h3><p>시설 이용 본문과 citation_id가 어디에 담기는지 확인합니다. 본문을 담는 page_content와 출처를 담는 metadata의 역할을 구분합니다.</p></section><section><h3>Prompt의 입력 확인</h3><p>검색 결과 목록이 Context 문자열로 바뀐 뒤 question과 함께 전달되는 지점을 찾습니다.</p></section></section><section><section><h3>모델 호출 지점 확인</h3><p>Prompt의 결과인 ChatPromptValue를 Chat Model이 받습니다. Prompt 작성만으로는 모델 답변이 생기지 않는 이유를 설명합니다.</p></section><section><h3>반환값 확인</h3><p>Chat Model에서 돌아오는 AIMessage와 원래 Document를 구분합니다. 원문 출처를 계속 보관할 위치도 찾아봅니다.</p></section></section></div></div></details><p class="smalltext muted spaced">구성요소와 자료형의 관계를 보여 주는 오프라인 시연입니다. Python 객체를 실제 실행하거나 LLM·DB에 접속하지 않습니다.</p></div></article><article class="d26-reader-section"><div class="d26-reader-label">30 / 82</div><div><header class="scene-head"><h1>실습 03 · 객체의 입력·출력과 invoke 읽기</h1><p>LangChain 객체가 보관하는 값과 invoke로 실행하는 작업을 구분합니다.</p></header><section class="lesson-return"><div><h2>실습 준비와 산출물</h2><p><b>입력·준비:</b> LangChain의 정의·사용 이유·현업 위치와 작은 함수 연결 예제를 먼저 읽습니다. 구성요소 시연에서 입력·작업·출력을 확인한 뒤 기존 3단계 실습을 수행합니다.<br><b>남길 결과:</b> 객체별 입력·출력과 데이터 읽기·호출 실행의 차이를 예시로 정리한 대응표</p></div><button data-action="atlasOpen" class="primary">같은 지도에서 확인</button></section>
      <p class="smalltext muted">세 수준 중 하나를 선택합니다. 모든 수준의 공통 목표는 같으며, 직접 완성할 범위와 확인할 조건을 조절합니다.</p>
      <div class="grid3"><section class="card level baseline"><h2>기본필수</h2><h3>01_basic</h3><p>본문의 표를 따라 Document·Retriever·Prompt·Chat Model의 입력과 출력을 연결합니다. 값을 보관하는 객체와 invoke로 일을 실행하는 객체를 구분해 표시합니다.</p><p><b>확인할 결과</b><br>Document의 본문 읽기, Prompt의 메시지 작성, 모델의 답변 생성을 구분합니다.</p></section><section class="card level"><h2>응용</h2><h3>02_intermediate</h3><p>본문을 잠시 보지 않고 네 구성요소의 입력과 출력을 직접 정리합니다. 다시 본문과 대조하여 Prompt 작성과 모델 호출의 반환값이 뒤바뀐 곳을 고칩니다.</p><p><b>확인할 결과</b><br>Prompt의 ChatPromptValue와 모델의 AIMessage 반환을 구분합니다.</p></section><section class="card level"><h2>심화</h2><h3>03_advanced</h3><p>Document 목록을 Prompt에 바로 넣거나 Document.invoke로 답변을 얻는 연결을 가정합니다. 본문의 입력·출력 약속에 맞지 않는 지점을 찾아 올바른 연결로 설명합니다.</p><p><b>확인할 결과</b><br>잘못된 연결 두 곳을 찾아 필요한 입력과 각 객체의 역할을 바르게 설명합니다.</p></section></div>
      <div class="action-box spaced"><h2>공통 완료 기준</h2><p>LangChain이 하는 일을 자신의 말로 설명하고, 준비·실행·반환값 전달을 예제로 짚습니다. Document의 자료 읽기, Prompt의 메시지 작성, 모델의 답변 생성을 구분하면 완료입니다.</p></div>
      <p class="smalltext muted spaced"><b>주의할 점:</b> 이 장에서는 객체의 역할과 입출력을 설명하며 실제 Prompt 생성·호출은 5장 이후에 진행하므로 모델 API를 실행하지 않습니다.</p></div></article><article class="d26-reader-section"><div class="d26-reader-label">31 / 82</div><div><header class="scene-head"><h1>핵심 확인 · LangChain의 역할과 실행 원리를 설명합니다</h1><p>용어를 외우는 데서 그치지 않고, 사용 이유와 실제 실행 과정을 자신의 말로 설명해 봅니다.</p></header><section class="quiz-item"><p><strong>01.</strong> LangChain은 무엇이며, 우리 서비스의 어느 부분에서 사용하나요?</p><details data-detail-key="ch3-quiz-quiz-0"><summary>생각한 뒤 해설 보기</summary><div class="answer-box">LLM 애플리케이션과 Agent를 만드는 개발 Framework입니다. 오늘은 Python 서비스 코드 안에서 검색 결과·Prompt·모델 호출을 공통 구성요소로 연결합니다. 답변을 생성하는 주체는 연결된 LLM입니다.</div></details></section><section class="quiz-item"><p><strong>02.</strong> 기존 Python·SDK 코드로도 구현할 수 있는데 사용하는 이유는 무엇인가요?</p><details data-detail-key="ch3-quiz-quiz-1"><summary>생각한 뒤 해설 보기</summary><div class="answer-box">반복되는 Prompt 작성·모델 연결·단계 조합을 공통 방식으로 다루기 위해서입니다. 작은 단발성 호출은 직접 코드가 더 단순할 수 있고, LangChain을 쓰면 객체·자료형·의존성도 이해해야 합니다.</div></details></section><section class="quiz-item"><p><strong>03.</strong> chain = clean_step | input_step을 작성했습니다. 두 함수는 언제 실행되나요?</p><details data-detail-key="ch3-quiz-quiz-2"><summary>생각한 뒤 해설 보기</summary><div class="answer-box">이 줄은 실행 순서를 준비합니다. chain.invoke(raw)에서 첫 함수가 실행되고 그 반환값이 다음 함수의 입력이 됩니다. 연결할 두 단계의 입출력 형식은 맞아야 합니다.</div></details></section><section class="quiz-item"><p><strong>04.</strong> prompt.invoke와 chat_model.invoke는 무엇을 하나요? Document도 같은 실행 객체인가요?</p><details data-detail-key="ch3-quiz-quiz-3"><summary>생각한 뒤 해설 보기</summary><div class="answer-box">이번 Prompt는 로컬에서 메시지를 만들고, ChatOpenAI는 모델 API에 요청해 응답을 받습니다. Document는 검색한 본문과 출처를 담은 자료입니다. invoke라는 이름만으로 API 호출 여부를 판단하지 않습니다.</div></details></section></div></article><article class="d26-reader-section concept-stage"><div class="d26-reader-label">32 / 82</div><div><header class="scene-head"><h1>Document는 본문과 Metadata를 함께 보관합니다</h1><p>기존 Hit의 정보를 LangChain이 다루는 Document로 옮겨도 원문과의 연결을 유지합니다.</p></header><details class="teaching-detail d26-system-location" data-map-chapter="4" data-detail-key="ch4-document-meaning-system-location" open><summary>전체그림에서 현재 위치 · Document · Retriever</summary><div class="detail-content"><div class="atlas-figure"><svg class="atlas-svg " viewbox="0 0 1200 558" role="group" aria-label="AI 업무 서비스 전체 지도. 현재 강조: PostgreSQL, Document, Embedding, 문서 인덱스, Retriever"><defs><marker id="day26-atlas-4-arrow" markerwidth="7" markerheight="7" refx="6" refy="3.5" orient="auto" markerunits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"></path></marker></defs><rect class="atlas-boundary" x="138" y="28" width="1043" height="515" rx="18"></rect><text x="157" y="57" class="atlas-boundary-title">애플리케이션 · Backend</text><text x="1160" y="57" text-anchor="end" class="atlas-scope-label">Day26 · Basic RAG · LangChain</text><text x="158" y="126" class="atlas-lane">요청 처리 · 오늘의 관찰 경로</text><text x="158" y="451" class="atlas-lane">검색 기반</text><g class="atlas-edge request"><path d="M124 173H158" marker-end="url(#day26-atlas-4-arrow)"></path><text x="141" y="163" text-anchor="middle">질문</text></g><g class="atlas-edge return"><path d="M158 202H124" marker-end="url(#day26-atlas-4-arrow)"></path><text x="141" y="218" text-anchor="middle">응답</text></g><g class="atlas-edge request"><path d="M300 185H345" marker-end="url(#day26-atlas-4-arrow)"></path><text x="322" y="173" text-anchor="middle">질문</text></g><g class="atlas-edge request"><path d="M499 185H544" marker-end="url(#day26-atlas-4-arrow)"></path><text x="522" y="173" text-anchor="middle">문맥</text></g><g class="atlas-edge request"><path d="M698 185H743" marker-end="url(#day26-atlas-4-arrow)"></path><text x="720" y="173" text-anchor="middle">입력</text></g><g class="atlas-edge request"><path d="M885 185H930" marker-end="url(#day26-atlas-4-arrow)"></path><text x="907" y="173" text-anchor="middle">응답</text></g><g class="atlas-edge source"><path d="M190 223V299" marker-end="url(#day26-atlas-4-arrow)"></path>< text class="node-sub" x="12" y="66">원문 · 주장 · 인용</text></g><g class="atlas-node prior current-node" data-action="atlasNode" data-node="embedding" role="button" tabindex="0" aria-label="Embedding · 앞서 학습 · 기존 E5 모델과 접두어·Token 길이 검사·정규화 규칙을 재사용합니다. 같은 차원이라도 다른 모델로 만든 벡터와 혼합할 수 없습니다." transform="translate(158,459)"><rect class="node-rect" width="142" height="76" rx="11"></rect><text class="node-kicker" x="12" y="16">앞서 학습</text><text class="node-title" x="12" y="43">Embedding</text><text class="node-sub" x="12" y="66">E5 · query: · passage:</text><circle class="current-dot" cx="134" cy="1" r="8"></circle></g><g class="atlas-node prior current-node" data-action="atlasNode" data-node="index" role="button" tabindex="0" aria-label="문서 인덱스 · 앞서 학습 · 11/19 · 앞서 준비한 문서·청크·Embedding을 검색에 사용합니다. Indexing은 준비 단계이고 질문이 들어올 때마다 문서를 다시 인덱싱하지 않습니다." transform="translate(345,459)"><rect class="node-rect" width="154" height="76" rx="11"></rect><text class="node-kicker" x="12" y="16">앞서 학습 · 11/19</text><text class="node-title" x="12" y="43">문서 인덱스</text><text class="node-sub" x="12" y="66">청크·벡터·버전</text><circle class="current-dot" cx="146" cy="1" r="8"></circle></g><g class="atlas-node today current-node" data-action="atlasNode" data-node="retriever" role="button" tabindex="0" aria-label="Retriever · LangChain · 오늘 · 기존 E5·SQL 검색 함수를 RunnableLambda로 연결합니다. 이 수업의 어댑터는 질문·Category·후보 수가 담긴 요청 dict를 받고 Document 목록을 반환합니다." transform="translate(544,459)"><rect class="node-rect" width="154" height="76" rx="11"></rect><text class="node-kicker" x="12" y="16">LangChain · 오늘</text><text class="node-title" x="12" y="43">Retriever</text><text class="node-sub" x="12" y="66">요청 → Document 목록</text><circle class="current-dot" cx="146" cy="1" r="8"></circle></g><g class="atlas-node future" data-action="atlasNode" data-node="agent" role="button" tabindex="0" aria-label="Agent 제어 · 이후 · 12/2 · 후속 Agent는 도구 결과를 보고 다음 호출이나 종료를 판단합니다. 오늘은 코드가 순서를 정한 RAG를 배우며, 이 Retriever를 검색 Tool로 재사용할 수 있습니다." transform="translate(743,459)"><rect class="node-rect" width="142" height="76" rx="11"></rect><text class="node-kicker" x="12" y="16">이후 · 12/2</text><text class="node-title" x="12" y="43">Agent 제어</text><text class="node-sub" x="12" y="66">분기·상태·종료</text></g><g class="atlas-node future" data-action="atlasNode" data-node="tool" role="button" tabindex="0" aria-label="권한 확인 → Tool API · 이후 · 별도 보호 · 후속 수업에서는 모델의 Tool 호출 요청을 앱이 검증하고 실행합니다. 도구 결과를 다시 전달하고 권한·호출 한도·종료 조건을 관리합니다." transform="translate(930,459)"><rect class="node-rect" width="230" height="76" rx="11"></rect><text class="node-kicker" x="12" y="16">이후 · 별도 보호</text><text class="node-title" x="12" y="43">권한 확인 → Tool API</text><text class="node-sub" x="12" y="66">인수·실행·결과</text></g><rect class="evaluation-outline" x="535" y="290" width="172" height="94" rx="15"></rect><text class="evaluation-label" x="621" y="401" text-anchor="middle">별도 평가 · 실행 결과 비교</text></svg><div class="atlas-legend"><span><i class="prior"></i>기존 기반·학습한 원리</span><span><i class="today"></i>오늘 배우는 영역</span><span><i class="future"></i>후속 확장</span><span><i class="eval"></i>별도 비교·평가</span><span><i class="current"></i>현재 위치</span></div></div><div class="d26-system-explanation"><p><b>현업에서의 역할</b> 현재 공개된 문서에서 질문에 맞는 근거를 찾고, 본문·버전·원문 위치를 함께 다음 단계로 전달하는 부분입니다.</p><p><b>앞뒤 연결</b> 질문·검색 조건과 기존 Embedding·문서 인덱스 → Retriever → Document 목록 → Context 구성으로 이어집니다.</p><p class="d26-system-scope"><b>학습 범위</b> 앞서 만든 E5·SQL·문서 버전 조건을 재사용하고 검색 결과를 Document로 변환합니다. 새 Embedding 모델을 학습하거나 문서 인덱스를 다시 만드는 단계는 아닙니다.</p></div><div class="row d26-system-actions"><button class="small" data-action="atlasOpen" data-map-chapter="4">전체지도 확대</button><span>강조된 부분의 역할과 연결을 확인한 뒤, 지도를 접고 아래 설명을 이어갑니다.</span></div></div></details><div class="concept-grid"><div class="concept-explanation"><section><h2>page_content · 읽을 본문</h2><p>Document의 page_content에는 한 검색 청크의 텍스트를 넣습니다. PDF 전체를 뜻하는 이름이 아니며, 오늘은 Hit의 body가 이 값이 됩니다.</p></section><section><h2>metadata · 본문을 설명하는 정보</h2><p>metadata는 ID·문서 버전·원문 위치 등 이름과 값의 묶음입니다. 모델이 답한 source_ids를 실제 원문에 연결할 때 서버가 사용합니다.</p></section></div><section class="concept-example"><section><h2>한 Hit의 대응</h2><p>body는 page_content로, citation_id·chunk_id·doc_id·source_version·source_locator·category는 metadata로 옮깁니다. 문자열 201로 바꾸지 않고 기존 정수 ID를 유지합니다.</p></section><section><h2>모델 입력으로 가는 다음 단계</h2><p>Document 목록을 그대로 Chat Model에 보내지는 않습니다. 선택한 Document를 출처가 붙은 Context 문자열로 정리하고, 질문·규칙과 함께 메시지를 만듭니다.</p></section></section></div><p class="concept-distinction">Document는 검색 자료를 표현하는 객체입니다. Document가 만들어졌다는 사실만으로 모델 호출이나 출처 검증이 실행되지는 않습니다.</p><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>Document</b><span>텍스트 본문과 관련 Metadata를 담는 LangChain 자료 객체<small>page_content=출석 본문, metadata의 citation_id=201</small></span></p><p><b>Metadata</b><span>본문의 정체성·출처·분류를 설명하는 이름과 값<small>doc_id="DOC-ATTEND", source_version="v2"</small></span></p></section><details class="teaching-detail d26-refs"><summary>원문 참고 · 1개</summary><div class="detail-content"><ul><li><a href="https://reference.langchain.com/python/langchain-core/documents/base/Document" target="_blank" rel="noopener noreferrer">LangChain · Document</a></li></ul></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">33 / 82</div><div><header class="scene-head"><h1>기존 E5 검색의 입력과 필터 조건을 그대로 사용합니다</h1><p>LangChain에 연결해도 모델·입력 접두어·공개 버전 조건은 기존 검색과 같아야 합니다.</p></header><div class="table-wrap axis-table"><table><thead><tr><th scope="col">확인할 조건</th><th scope="col">11/19 helper가 수행하는 일</th><th scope="col">오늘 유지하는 이유</th></tr></thead><tbody><tr class="d26-table-row"><th scope="row">Embedding 모델</th><td>load_encoder(): intfloat/multilingual-e5-small, CPU, 384차원</td><td>저장 벡터와 질문 벡터의 모델을 일치시킴</td></tr><tr class="d26-table-row"><th scope="row">입력과 길이 검사</th><td>한국어도 문서는 passage: , 질문은 query: 접두어. 같은 Tokenizer로 실제 입력 길이 검사</td><td>긴 입력을 조용히 잘라 다른 의미로 검색하지 않음</td></tr><tr class="d26-table-row"><th scope="row">벡터 검사</th><td>encode_query(): normalize_embeddings=True, 384차원·유한값 확인</td><td>기존 문서 벡터와 같은 비교 조건 유지</td></tr><tr class="d26-table-row"><th scope="row">공개 조건</th><td>search_current(): 현재 source_version·pipeline_version이고 ready인 청크</td><td>과거 버전이나 미완료 자료가 근거로 섞이지 않음</td></tr><tr class="d26-table-row"><th scope="row">Category · Top-k</th><td>category는 필수, k는 정수 1~20. Cosine Distance가 작은 순서로 조회</td><td>검색 범위와 최대 후보 수를 명시</td></tr></tbody></table></div><p class="smalltext muted spaced">11/18의 MiniLM 벡터와 11/19의 E5 질문 벡터는 둘 다 384차원이어도 섞어 비교하지 않습니다. pipeline_version은 검색 조건에서 검사하지만 기존 반환값에는 없으므로 Document에 임의로 만들어 넣지 않습니다.</p><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>Input Prefix</b><span>Embedding 입력 앞에 붙여 질문·문서의 역할을 알려 주는 문자열<small>query: 15분 늦으면 어떻게 기록되나요?</small></span></p></section><details class="teaching-detail d26-refs"><summary>원문 참고 · 1개</summary><div class="detail-content"><ul><li><a href="https://huggingface.co/intfloat/multilingual-e5-small" target="_blank" rel="noopener noreferrer">Multilingual E5-small · Model Card</a></li></ul></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">34 / 82</div><div><header class="scene-head"><h1>검색마다 새 DB 연결을 열고 E5 모델은 준비해 둡니다</h1><p>검색 함수가 받을 연결 도구에 pgvector 등록과 사용할 Schema 선택을 포함합니다.</p></header><div class="io-strip"><div><b>들어오는 것 · 입력 / 전제</b><span>전제: 11/19 coursekit을 import할 수 있고 E5·pgvector가 준비된 환경. 예시는 --live-db 실행으로 d24_adv08 저장·공개를 마친 경우입니다.</span></div><div><b>여기서 하는 일</b><span>기존 helper로 연결 준비 · 실제 실행 환경이 필요한 예시</span></div><div><b>다음으로 넘길 것 · 출력 / 관찰</b><span>출력: 새 연결을 반환하는 connect_db 함수와 준비된 embedding_model. 이 화면 자체는 DB·모델을 실행하지 않습니다.</span></div></div>
      <section class="inline-python" aria-label="본문 Python 코드"><section class="python-block" data-code-key="ch4-connection-and-model" aria-label="Python · 기존 helper로 연결 준비 · 실제 실행 환경이 필요한 예시"><header class="python-editor-bar"><span class="python-tab"><span class="python-file-mark" aria-hidden="true">py</span>Python</span><h3>기존 helper로 연결 준비 · 실제 실행 환경이 필요한 예시</h3><button class="small d26-copy" data-code="ch4-connection-and-model" aria-label="검색마다 새 DB 연결을 열고 E5 모델은 준비해 둡니다 코드 복사">코드 복사</button></header><pre><code class="python-source" aria-label="Python 소스코드"><span class="python-line" data-line="1"><span class="py-keyword">from</span> coursekit.live <span class="py-keyword">import</span> connect_db <span class="py-keyword">as</span> open_db, load_encoder</span>
<span class="python-line" data-line="2"><span class="py-keyword">from</span> coursekit.db <span class="py-keyword">import</span> use_schema</span>
<span class="python-line" data-line="3"><br></span>
<span class="python-line" data-line="4">DB_SCOPE = <span class="py-string">"</span><span class="py-string">d24_adv08</span><span class="py-string">"</span></span>
<span class="python-line" data-line="5"><br></span>
<span class="python-line" data-line="6"><span class="py-keyword">def</span> <span class="py-function">connect_db</span>():</span>
<span class="python-line" data-line="7">    conn = open_db()</span>
<span class="python-line" data-line="8">    <span class="py-keyword">try</span>:</span>
<span class="python-line" data-line="9">        <span class="py-comment"># 실습에서 사용하는 Schema로 범위를 정합니다.</span></span>
<span class="python-line" data-line="10">        use_schema(conn, DB_SCOPE)</span>
<span class="python-line" data-line="11">    <span class="py-keyword">except</span> Exception:</span>
<span class="python-line" data-line="12">        conn.close()  <span class="py-comment"># Schema 설정이 실패하면 연결을 닫습니다.</span></span>
<span class="python-line" data-line="13">        <span class="py-keyword">raise</span></span>
<span class="python-line" data-line="14">    <span class="py-keyword">return</span> conn</span>
<span class="python-line" data-line="15"><br></span>
<span class="python-line" data-line="16">embedding_model = load_encoder()  <span class="py-comment"># 검색용 E5 모델은 한 번 준비합니다.</span></span></code></pre></section><p class="template-note">open_db는 기존 DB 설정을 읽고 pgvector를 연결에 등록합니다. use_schema는 기존 실습의 전용 Schema를 선택합니다. 기본 실행만으로 DB가 채워지지는 않습니다. d24_adv07은 출석 문서만 다루므로 같은 자료 집합이라고 가정하지 않습니다. 다른 날짜의 동명 coursekit을 불러오지 않도록 경로를 확인합니다.</p></section><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>Database Schema</b><span>PostgreSQL에서 테이블을 구분해 담는 이름 공간<small>d24_adv08의 ingest_chunks와 다른 실습의 테이블을 구분</small></span></p></section><details class="teaching-detail d26-refs"><summary>원문 참고 · 1개</summary><div class="detail-content"><ul><li><a href="https://www.psycopg.org/psycopg3/docs/basic/usage.html#connection-context" target="_blank" rel="noopener noreferrer">Psycopg 3 · Connection context</a></li></ul></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">35 / 82</div><div><header class="scene-head"><h1>기존 검색의 일곱 값을 이름 있는 Hit로 바꿉니다</h1><p>검색 조건은 기존 helper에 맡기고, 반환된 Tuple에 필드 이름을 붙여 다음 단계에 전달합니다.</p></header><div class="io-strip"><div><b>들어오는 것 · 입력 / 전제</b><span>전제: 앞 화면의 embedding_model과 connect_db. search_current의 반환 순서는 기존 11/19 코드와 같습니다.</span></div><div><b>여기서 하는 일</b><span>make_search_hits · 기존 검색 helper를 연결하는 Factory</span></div><div><b>다음으로 넘길 것 · 출력 / 관찰</b><span>search_hits(question, category, k=3) → list[dict]. 원래 순위와 실제 ID를 유지하며 결과가 없으면 []입니다.</span></div></div>
      <section class="inline-python" aria-label="본문 Python 코드"><section class="python-block" data-code-key="ch4-make-search-hits" aria-label="Python · make_search_hits · 기존 검색 helper를 연결하는 Factory"><header class="python-editor-bar"><span class="python-tab"><span class="python-file-mark" aria-hidden="true">py</span>Python</span><h3>make_search_hits · 기존 검색 helper를 연결하는 Factory</h3><button class="small d26-copy" data-code="ch4-make-search-hits" aria-label="기존 검색의 일곱 값을 이름 있는 Hit로 바꿉니다 코드 복사">코드 복사</button></header><pre><code class="python-source" aria-label="Python 소스코드"><span class="python-line" data-line="1"><span class="py-keyword">from</span> coursekit.live <span class="py-keyword">import</span> encode_query</span>
<span class="python-line" data-line="2"><span class="py-keyword">from</span> coursekit.db <span class="py-keyword">import</span> search_current</span>
<span class="python-line" data-line="3"><br></span>
<span class="python-line" data-line="4"><span class="py-keyword">def</span> <span class="py-function">make_search_hits</span>(model, connect_db):</span>
<span class="python-line" data-line="5">    <span class="py-keyword">def</span> <span class="py-function">search_hits</span>(question, category, k=<span class="py-number">3</span>):</span>
<span class="python-line" data-line="6">        <span class="py-comment"># 질문을 검색용 Embedding으로 바꿉니다.</span></span>
<span class="python-line" data-line="7">        vector = encode_query(model, question)</span>
<span class="python-line" data-line="8">        <span class="py-comment"># 요청 조건에 맞는 현재 문서를 검색합니다.</span></span>
<span class="python-line" data-line="9">        <span class="py-keyword">with</span> connect_db() <span class="py-keyword">as</span> conn:</span>
<span class="python-line" data-line="10">            rows = search_current(conn, vector, category, k)</span>
<span class="python-line" data-line="11">        hits = []</span>
<span class="python-line" data-line="12">        <span class="py-comment"># DB의 일곱 열을 이름 있는 Hit 필드로 옮깁니다.</span></span>
<span class="python-line" data-line="13">        <span class="py-keyword">for</span> row in rows:</span>
<span class="python-line" data-line="14">            cid, chunk, body, locator, doc, version, distance = row</span>
<span class="python-line" data-line="15">            hits.append({</span>
<span class="python-line" data-line="16">                <span class="py-string">"</span><span class="py-string">citation_id</span><span class="py-string">"</span>: cid, <span class="py-string">"</span><span class="py-string">chunk_id</span><span class="py-string">"</span>: chunk,</span>
<span class="python-line" data-line="17">                <span class="py-string">"</span><span class="py-string">body</span><span class="py-string">"</span>: body, <span class="py-string">"</span><span class="py-string">source_locator</span><span class="py-string">"</span>: locator,</span>
<span class="python-line" data-line="18">                <span class="py-string">"</span><span class="py-string">doc_id</span><span class="py-string">"</span>: doc, <span class="py-string">"</span><span class="py-string">source_version</span><span class="py-string">"</span>: version,</span>
<span class="python-line" data-line="19">                <span class="py-string">"</span><span class="py-string">category</span><span class="py-string">"</span>: category, <span class="py-string">"</span><span class="py-string">cosine_distance</span><span class="py-string">"</span>: distance,</span>
<span class="python-line" data-line="20">            })</span>
<span class="python-line" data-line="21">        <span class="py-keyword">return</span> hits</span>
<span class="python-line" data-line="22">    <span class="py-comment"># 실제 검색은 반환된 함수를 호출할 때 실행됩니다.</span></span>
<span class="python-line" data-line="23">    <span class="py-keyword">return</span> search_hits</span>
<span class="python-line" data-line="24"><br></span>
<span class="python-line" data-line="25">search_hits = make_search_hits(embedding_model, connect_db)</span></code></pre></section><p class="template-note">cid, chunk, … = row는 일곱 값을 순서대로 받습니다. 안쪽 함수는 준비한 model과 connect_db를 사용하며, search_hits("15분 늦으면?", "학사", k=3)이 실제 검색을 실행합니다. with 블록을 나가면 연결이 닫힙니다. category는 SQL에 전달한 필수 조건에서 보충하고, DB 오류를 빈 목록으로 바꾸지 않습니다.</p></section><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>Factory</b><span>설정을 받아 사용할 함수나 객체를 만들어 반환하는 함수<small>모델과 연결 도구를 기억하는 search_hits 생성</small></span></p><p><b>Tuple</b><span>정해진 순서에 따라 여러 값을 담는 자료형<small>기존 검색의 첫 값은 citation_id, 일곱 번째 값은 distance</small></span></p></section><details class="teaching-detail d26-refs"><summary>원문 참고 · 1개</summary><div class="detail-content"><ul><li><a href="https://www.psycopg.org/psycopg3/docs/basic/usage.html#connection-context" target="_blank" rel="noopener noreferrer">Psycopg 3 · Connection context</a></li></ul></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">36 / 82</div><div><header class="scene-head"><h1>어댑터가 보존할 필드를 명시합니다</h1><p>조회한 값을 그대로 옮기는 필드와 검색 조건에서 보충하는 필드를 구분합니다.</p></header><div class="table-wrap axis-table"><table><thead><tr><th scope="col">기존 Hit</th><th scope="col">Document에 넣을 위치</th><th scope="col">보존할 의미</th></tr></thead><tbody><tr class="d26-table-row"><th scope="row">body</th><td>page_content</td><td>검색된 청크의 본문 그대로</td></tr><tr class="d26-table-row"><th scope="row">citation_id · chunk_id</th><td>metadata의 동일한 Key</td><td>답변용 정수 ID와 중복 확인용 문자열 ID</td></tr><tr class="d26-table-row"><th scope="row">doc_id · source_version</th><td>metadata의 동일한 Key</td><td>어떤 문서의 어떤 원문 버전인지</td></tr><tr class="d26-table-row"><th scope="row">source_locator · category</th><td>metadata의 동일한 Key</td><td>원문 위치와 검색에 사용한 Category</td></tr><tr class="d26-table-row"><th scope="row">cosine_distance</th><td>이번 최소 어댑터에서는 생략</td><td>Hit에는 보존. 필요할 때 별도 관찰용 Metadata로 확장</td></tr></tbody></table></div><p class="smalltext muted spaced">search_current는 pipeline_version을 현재 포인터와 대조하지만 결과 열로 반환하지 않습니다. 이 값이 필요해지는 서비스라면 조회 계약을 확장해야 하며, 현재 예시에서는 반환하지 않은 값을 추정해 붙이지 않습니다.</p><section class="notation-primer d26-terms" aria-label="용어의 의미와 예시"><p><b>Adapter</b><span>기존 입력·출력을 다른 구성요소가 사용할 형태로 변환하는 연결 코드<small>검색 Hit를 LangChain Document로 변환</small></span></p></section><details class="teaching-detail d26-refs"><summary>원문 참고 · 1개</summary><div class="detail-content"><ul><li><a href="https://reference.langchain.com/python/langchain-core/documents/base/Document" target="_blank" rel="noopener noreferrer">LangChain · Document</a></li></ul></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">37 / 82</div><div><header class="scene-head"><h1>본문과 여섯 Metadata 필드를 Document로 옮깁니다</h1><p>Document 변환은 검색 결과의 내용과 순서를 보존하는 작은 함수로 만듭니다.</p></header><div class="io-strip"><div><b>들어오는 것 · 입력 / 전제</b><span>입력: make_search_hits가 반환한 Hit 목록. 아래 호출은 앞서 정의한 example_hit 1건으로 확인합니다.</span></div><div><b>여기서 하는 일</b><span>hits_to_documents(hits) → list[Document]</span></div><div><b>다음으로 넘길 것 · 출력 / 관찰</b><span>출력: list[Document]. 예시 문서의 citation_id는 정수 201이며 원문 위치도 그대로 남습니다.</span></div></div>
      <section class="inline-python" aria-label="본문 Python 코드"><section class="python-block" data-code-key="ch4-hits-to-documents" aria-label="Python · hits_to_documents(hits) → list[Document]"><header class="python-editor-bar"><span class="python-tab"><span class="python-file-mark" aria-hidden="true">py</span>Python</span><h3>hits_to_documents(hits) → list[Document]</h3><button class="small d26-copy" data-code="ch4-hits-to-documents" aria-label="본문과 여섯 Metadata 필드를 Document로 옮깁니다 코드 복사">코드 복사</button></header><pre><code class="python-source" aria-label="Python 소스코드"><span class="python-line" data-line="1"><span class="py-keyword">from</span> langchain_core.documents <span class="py-keyword">import</span> Document</span>
<span class="python-line" data-line="2"><br></span>
<span class="python-line" data-line="3"><span class="py-keyword">def</span> <span class="py-function">hits_to_documents</span>(hits):</span>
<span class="python-line" data-line="4">    <span class="py-comment"># 본문과 함께 보존할 출처 필드를 고릅니다.</span></span>
<span class="python-line" data-line="5">    keys = (<span class="py-string">"</span><span class="py-string">citation_id</span><span class="py-string">"</span>, <span class="py-string">"</span><span class="py-string">chunk_id</span><span class="py-string">"</span>, <span class="py-string">"</span><span class="py-string">doc_id</span><span class="py-string">"</span>,</span>
<span class="python-line" data-line="6">            <span class="py-string">"</span><span class="py-string">source_version</span><span class="py-string">"</span>, <span class="py-string">"</span><span class="py-string">source_locator</span><span class="py-string">"</span>, <span class="py-string">"</span><span class="py-string">category</span><span class="py-string">"</span>)</span>
<span class="python-line" data-line="7">    documents = []</span>
<span class="python-line" data-line="8">    <span class="py-keyword">for</span> hit in hits:</span>
<span class="python-line" data-line="9">        metadata = {key: hit[key] <span class="py-keyword">for</span> key in keys}</span>
<span class="python-line" data-line="10">        <span class="py-comment"># 본문은 page_content, 출처는 metadata에 담습니다.</span></span>
<span class="python-line" data-line="11">        documents.append(Document(</span>
<span class="python-line" data-line="12">            page_content=hit[<span class="py-string">"</span><span class="py-string">body</span><span class="py-string">"</span>], metadata=metadata</span>
<span class="python-line" data-line="13">        ))</span>
<span class="python-line" data-line="14">    <span class="py-keyword">return</span> documents</span>
<span class="python-line" data-line="15"><br></span>
<span class="python-line" data-line="16"><span class="py-comment"># 검색 Hit를 LangChain Document로 변환합니다.</span></span>
<span class="python-line" data-line="17">documents = hits_to_documents([example_hit])</span>
<span class="python-line" data-line="18">print(documents[<span class="py-number">0</span>].metadata[<span class="py-string">"</span><span class="py-string">citation_id</span><span class="py-string">"</span>])  <span class="py-comment"># 201</span></span>
<span class="python-line" data-line="19">print(documents[<span class="py-number">0</span>].page_content == example_hit[<span class="py-string">"</span><span class="py-string">body</span><span class="py-string">"</span>])  <span class="py-comment"># True</span></span></code></pre></section><p class="template-note">keys는 옮길 필드의 이름 목록입니다. {key: hit[key] for key in keys}는 각 이름과 값을 모아 새 Dictionary를 만듭니다. .page_content와 .metadata로 객체의 값을 읽습니다. 빈 hits는 빈 목록이 되고, 필수 Key가 빠졌다면 원인을 확인할 수 있도록 오류가 납니다.</p></section><details class="teaching-detail d26-refs"><summary>원문 참고 · 1개</summary><div class="detail-content"><ul><li><a href="https://reference.langchain.com/python/langchain-core/documents/base/Document" target="_blank" rel="noopener noreferrer">LangChain · Document</a></li></ul></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">38 / 82</div><div><header class="scene-head"><h1>검색 함수를 Runnable로 감싸 invoke로 실행합니다</h1><p>이 Retriever 어댑터는 질문·Category·후보 수를 담은 요청 Dictionary에서 Document 목록을 만듭니다.</p></header><div class="io-strip"><div><b>들어오는 것 · 입력 / 전제</b><span>전제: 실제 준비된 search_hits와 앞의 hits_to_documents. request의 query·category는 필수입니다.</span></div><div><b>여기서 하는 일</b><span>make_retriever · 검색 역할을 수행하는 RunnableLambda</span></div><div><b>다음으로 넘길 것 · 출력 / 관찰</b><span>retriever.invoke(request) → list[Document]. 실제 ID와 건수는 DB 조회 결과를 확인합니다.</span></div></div>
      <section class="inline-python" aria-label="본문 Python 코드"><section class="python-block" data-code-key="ch4-make-retriever" aria-label="Python · make_retriever · 검색 역할을 수행하는 RunnableLambda"><header class="python-editor-bar"><span class="python-tab"><span class="python-file-mark" aria-hidden="true">py</span>Python</span><h3>make_retriever · 검색 역할을 수행하는 RunnableLambda</h3><button class="small d26-copy" data-code="ch4-make-retriever" aria-label="검색 함수를 Runnable로 감싸 invoke로 실행합니다 코드 복사">코드 복사</button></header><pre><code class="python-source" aria-label="Python 소스코드"><span class="python-line" data-line="1"><span class="py-keyword">from</span> langchain_core.runnables <span class="py-keyword">import</span> RunnableLambda</span>
<span class="python-line" data-line="2"><br></span>
<span class="python-line" data-line="3"><span class="py-keyword">def</span> <span class="py-function">make_retriever</span>(search_hits):</span>
<span class="python-line" data-line="4">    <span class="py-keyword">def</span> <span class="py-function">retrieve</span>(request):</span>
<span class="python-line" data-line="5">        <span class="py-comment"># 요청의 질문·Category·후보 수로 검색합니다.</span></span>
<span class="python-line" data-line="6">        hits = search_hits(</span>
<span class="python-line" data-line="7">            request[<span class="py-string">"</span><span class="py-string">query</span><span class="py-string">"</span>], request[<span class="py-string">"</span><span class="py-string">category</span><span class="py-string">"</span>],</span>
<span class="python-line" data-line="8">            k=request.get(<span class="py-string">"</span><span class="py-string">candidate_k</span><span class="py-string">"</span>, <span class="py-number">3</span>),</span>
<span class="python-line" data-line="9">        )</span>
<span class="python-line" data-line="10">        <span class="py-keyword">return</span> hits_to_documents(hits)</span>
<span class="python-line" data-line="11">    <span class="py-keyword">return</span> RunnableLambda(retrieve)  <span class="py-comment"># invoke로 실행할 수 있게 감쌉니다.</span></span>
<span class="python-line" data-line="12"><br></span>
<span class="python-line" data-line="13">retriever = make_retriever(search_hits)</span>
<span class="python-line" data-line="14">request = {</span>
<span class="python-line" data-line="15">    <span class="py-string">"</span><span class="py-string">query</span><span class="py-string">"</span>: <span class="py-string">"</span><span class="py-string">15분 늦으면 어떻게 기록되나요?</span><span class="py-string">"</span>,</span>
<span class="python-line" data-line="16">    <span class="py-string">"</span><span class="py-string">category</span><span class="py-string">"</span>: <span class="py-string">"</span><span class="py-string">학사</span><span class="py-string">"</span>, <span class="py-string">"</span><span class="py-string">candidate_k</span><span class="py-string">"</span>: <span class="py-number">3</span>,</span>
<span class="python-line" data-line="17">}</span>
<span class="python-line" data-line="18"><span class="py-comment"># 이 호출에서 검색과 Document 변환이 실행됩니다.</span></span>
<span class="python-line" data-line="19">documents = retriever.invoke(request)</span>
<span class="python-line" data-line="20">print([doc.metadata[<span class="py-string">"</span><span class="py-string">citation_id</span><span class="py-string">"</span>] <span class="py-keyword">for</span> doc in documents])</span></code></pre></section><p class="template-note">get("candidate_k", 3)은 Key가 없으면 기본값 3을 씁니다. RunnableLambda는 Python 함수를 LangChain의 공통 실행 형태로 감쌉니다. 여기서는 필터를 전달하려고 요청 dict를 받으며, BaseRetriever를 상속한 구현이라고 부르지 않습니다. k의 1~20 검사는 기존 검색 helper에서 유지됩니다.</p></section><details class="teaching-detail d26-refs"><summary>원문 참고 · 1개</summary><div class="detail-content"><ul><li><a href="https://reference.langchain.com/python/langchain-core/runnables/base/RunnableLambda" target="_blank" rel="noopener noreferrer">LangChain · RunnableLambda</a></li></ul></div></details></div></article><article class="d26-reader-section"><div class="d26-reader-label">39 / 82</div><div><header class="scene-head"><h1>검색 레코드가 Document로 바뀌는 위치를 봅니다</h1><p>본문·ID·원문 위치가 어댑터 전후에 어떻게 대응하는지 확인합니다.</p></header><section class="d26-demo" data-demo-root="document-adapter"><header class="d26-demo-head row between"><div class="row"><strong>DOCUMENT ADAPTER · 본문과 Metadata</strong><span class="chip outline">OFFLINE · 교육용 시연</span></div><button class="small" data-reset-demo="document-adapter">초기값</button></header><div class="d26-demo-body"><div class="d26-controls"><label class="d26-control"><span>검색 결과</span><select data-demo="document-adapter" data-key="source"><option value="201">[201] 출석 안내 · 현재 v2</option><option value="202">[202] 과제 제출 안내</option><option value="203" selected>[203] 시설 이용 안내</option></select></label><label class="d26-control"><span>Metadata 함께 전달</span><input type="checkbox" checked data-demo="document-adapter" data-key="metadata" aria-label="Metadata 함께 전달">적용</label></div><div class="d26-split"><section class="card d26-panel"><h2>입력 · Hit dict</h2><pre class="d26-pre">{
  "citation_id": 203,
  "chunk_id": "demo-facility-v1-sec1",
  "body": "컴퓨터 실습실은 안내에 따라 이용합니다. 회의실은 예약 승인 후 이용합니다. 장비 이상은 운영실에 알립니다.",
  "source_locator": "facility.html#main",
  "doc_id": "DOC-FACILITY",
  "source_version": "v1",
  "cosine_distance": 0.12,
  "category": "시설"
}</pre></section><section class="card d26-panel"><h2>출력 · Document 표현</h2><pre class="d26-pre">{
  "page_content": "컴퓨터 실습실은 안내에 따라 이용합니다. 회의실은 예약 승인 후 이용합니다. 장비 이상은 운영실에 알립니다.",
  "metadata": {
    "citation_id": 203,
    "chunk_id": "demo-facility-v1-sec1",

}</pre></section></div><div class="table-wrap"><table class=""><thead><tr><th scope="col">값</th><th scope="col">Document에서의 위치</th><th scope="col">역할</th></tr></thead><tbody><tr class="d26-table-row"><td>body</td><td>page_content</td><td>근거 본문</td></tr><tr class="d26-table-row"><td>citation_id · chunk_id</td><td>metadata</td><td>인용·중복 검사</td></tr><tr class="d26-table-row"><td>doc_id · source_version · source_locator</td><td>metadata</td><td>원문·버전·위치</td></tr><tr class="d26-table-row"><td>category</td><td>metadata</td><td>실제 사용한 검색 조건</td></tr></tbody></table></div><p class="d26-answer">본문과 출처가 함께 남습니다. 모델용 Context를 구성할 때 이 Metadata에서 인용 ID를 붙입니다.</p><p class="d26-live-note">거리 0.12는 구조를 설명하는 임의 값이며 실제 E5 측정값이 아닙니다. pipeline_version은 기존 SQL의 검색 조건에서 확인하지만 반환 필수 Metadata로 가정하지 않습니다.</p></div></section>
      <details class="teaching-detail" data-detail-key="ch4-document-adapter-demo-observe"><summary>시연에서 관찰할 것</summary><div class="detail-content"><div class="cols d26-demo-explain"><section><section><h3>본문과 Metadata</h3><p>입력 Hit의 body가 page_content로 이동하고, 여섯 필드가 Metadata에 남는지 확인합니다. 정수 citation_id와 문자열 chunk_id의 차이도 봅니다.</p></section><section><h3>기존 검색의 조건</h3><p>Category는 검색에 사용한 필수 조건입니다. 현재 버전·처리 버전·ready 검사는 기존 SQL의 역할이며, Document 변환이 그 검사를 대신하지 않습니다.</p></section></section><section><section><h3>다음 단계와 연결</h3><p>Document가 만들어지면 Context Builder가 필요한 문서를 선택합니다. 원문 위치는 답변을 서버 출처에 연결할 때까지 보존합니다.</p></section><section><h3>반환하지 않은 값</h3><p>pipeline_version은 기존 결과 열에 없으므로 이 어댑터가 새 값으로 만들어 넣지 않습니다. distance도 이번 최소 Document 필수 필드에는 넣지 않습니다.</p></section></section></div></div></details><p class="smalltext muted spaced">Hit → Document 형태의 매핑은 JavaScript로 계산합니다. 입력 레코드는 미리 준비한 교육용 예시이며 PostgreSQL 조회·E5 추론·실제 LangChain 실행 결과가 아닙니다.</p></div></article><article class="d26-reader-section"><div class="d26-reader-label">40 / 82</div><div><header class="scene-head"><h1>실습 04 · 검색 Hit를 Document로 변환하기</h1><p>기존 검색 레코드의 본문과 출처를 Document로 옮기고 변환 전후의 값을 대조합니다.</p></header><section class="lesson-return"><div><h2>실습 준비와 산출물</h2><p><b>입력·준비:</b> 본문의 변환 함수와 준비된 LangChain 환경을 사용합니다. 변환할 입력은 DB 검색 Hit 또는 본문의 example_hit입니다.<br><b>남길 결과:</b> 입력 Hit와 Document의 본문·Metadata를 대조하고 입력 출처를 밝힌 기록</p></div><button data-action="atlasOpen" class="primary">같은 지도에서 확인</button></section>
      <p class="smalltext muted">세 수준 중 하나를 선택합니다. 모든 수준의 공통 목표는 같으며, 직접 완성할 범위와 확인할 조건을 조절합니다.</p>
      <div class="grid3"><section class="card level baseline"><h2>기본필수</h2><h3>01_basic</h3><p>Hit 한 건을 목록에 담아 hits_to_documents를 호출합니다. 본문과 Metadata 여섯 값이 입력 Hit와 같은지 대조하고 citation_id의 정수 형식과 원문 위치를 확인합니다.</p><p><b>확인할 결과</b><br>본문은 같고 여섯 Metadata 필드와 citation_id의 정수 형식이 유지됩니다.</p></section><section class="card level"><h2>응용</h2><h3>02_intermediate</h3><p>Metadata에 옮길 여섯 Key를 직접 적고 본문 골격에 맞춰 변환 부분을 완성합니다. 기본필수와 같은 Hit를 넣어 본문·ID·버전·위치가 보존되는지 대조합니다.</p><p><b>확인할 결과</b><br>직접 완성한 변환도 같은 본문·출처를 보존하며 새 값을 추정해 넣지 않습니다.</p></section><section class="card level"><h2>심화</h2><h3>03_advanced</h3><p>빈 Hit 목록과 복사한 Hit에서 source_locator를 뺀 예시를 각각 변환합니다. 빈 결과와 필수 정보 누락 오류를 구분하고, 정상 Hit의 출처가 보존되는지 확인합니다.</p><p><b>확인할 결과</b><br>빈 목록은 [], 출처 누락은 오류이며 정상 Hit는 본문과 출처를 함께 보존합니다.</p></section></div>
      <div class="action-box spaced"><h2>공통 완료 기준</h2><p>본문·정수 ID·원문 위치가 변환 뒤에도 유지됨을 확인하고, 사용한 입력이 실제 검색 결과인지 본문 예시인지 밝히면 완료입니다.</p></div>
      <p class="smalltext muted spaced"><b>주의할 점:</b> DB가 준비되지 않았다면 본문 Hit 예시로 변환만 확인하고, 예시의 ID·출력이나 Document 변환 성공을 실제 검색 성공으로 기록하지 않습니다.</p></div></article><article class="d26-reader-section"><div class="d26-reader-label">41 / 82</div><div><header class="scene-head"><h1>이해 확인 · 연결 뒤에도 검색 조건을 지킵니다</h1><p>LangChain으로 표현이 바뀌어도 데이터와 검색의 전제가 유지되는지 판단합니다.</p></header><section class="quiz-item"><p><strong>01.</strong> 저장된 벡터는 MiniLM인데 질문만 E5로 만들었습니다. 둘 다 384차원이면 비교해도 되나요?</p><details data-detail-key="ch4-quiz-quiz-0"><summary>생각한 뒤 해설 보기</summary><div class="answer-box">안 됩니다. 차원은 숫자의 개수일 뿐 같은 의미 공간을 보장하지 않습니다. 저장 벡터와 질문에 같은 모델·입력 규칙을 사용해야 하며, 모델을 바꾸면 검색 대상의 재임베딩을 검토해야 합니다.</div></details></section><section class="quiz-item"><p><strong>02.</strong> 회의실 질문을 category="학사"로 검색해 결과가 없었습니다. 전체 문서에도 답이 없다고 판단해도 될까요?</p><details data-detail-key="ch4-quiz-quiz-1"><summary>생각한 뒤 해설 보기</summary><div class="answer-box">그렇게 단정하면 안 됩니다. 검색이 제한된 범위를 먼저 확인해야 합니다. 시설 자료는 학사 필터에서 제외되므로 질문·Category를 대조한 뒤 올바른 범위에서 다시 확인합니다.</div></details></section><section class="quiz-item"><p><strong>03.</strong> Document 변환에서 body만 옮기고 ID와 원문 위치를 버렸습니다. 답변 문장이 만들어지면 연결이 성공한 것인가요?</p><details data-detail-key="ch4-quiz-quiz-2"><summary>생각한 뒤 해설 보기</summary><div class="answer-box">문장은 만들 수 있어도 출처를 추적하는 계약이 끊겼습니다. 실제 포함한 citation_id를 검증하고 서버가 원문 위치를 연결할 수 있도록 Metadata를 함께 보존해야 합니다. Runnable로 감싼 사실이 이 정보를 복원해 주지는 않습니다.</div></details></section></div></article><article class="d26-reader-section concept-stage"><div class="d26-reader-label">42 / 82</div><div><header class="scene-head"><h1>Prompt에는 답변 규칙·질문·근거가 함께 필요합니다</h1><p>ChatPromptTemplate은 고정할 규칙과 매번 달라지는 질문·Context를 나누어 메시지를 만드는 틀입니다.</p></header><details class="teaching-detail d26-system-location" data-map-chapter="5" data-detail-key="ch5-prompt-structure-system-location" open><summary>전체그림에서 현재 위치 · Prompt · Chat Model</summary><div class="detail-content"><div class="atlas-figure"><svg class="atlas-svg " viewbox="0 0 1200 558" role="group" aria-label=
