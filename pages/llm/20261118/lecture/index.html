일 · 검색","질문을 입력하면 후보 지식의 ID·제목·본문을 자동으로 찾습니다."],["19·20일 · 연결","실제 문서를 Chunk로 나누고 Retriever 결과를 Prompt·LLM에 연결합니다."]],"example":"기존: selected = [102]  →  질문과 지식 102 직접 전달\n오늘: retrieve(question, k=3) → 후보 ID·원문\n후속: 검토된 후보 → Context → LLM Client","distinction":"오늘의 검색 결과는 답변 생성 결과가 아닙니다. Top-k가 정답을 보증하지도 않습니다.","codes":[],"flow":[["기존 자료","101·102·103"],["Embedding","질문·본문"],["Retriever","후보 k개"],["Context","검토 후 선별"]],"mergedFrom":{"chapter":1,"id":"why-search","title":"자료가 많아지면 지식 ID를 일일이 선택하기 어렵습니다","claim":"Semantic Search는 표현이 달라도 내용상 가까운 자료 후보를 찾기 위한 방법입니다.","kind":"concept","focus":"embedding","left":[["문제","질문을 보고 모든 문서를 열어보거나 자료 번호를 직접 지정하는 것은 규모가 커질수록 어렵습니다."],["해결의 일부","짧은 질문과 원문을 벡터로 표현하고 가까운 후보를 찾아 검토합니다."]],"right":[["Keyword Search와 다름","일치하는 단어가 없어도 비슷한 표현을 후보로 찾는 것을 목표로 합니다."],["보장하지 않는 것","숫자·부정·기한·고유명사를 항상 정확하게 처리하는 것은 아닙니다."]],"example":"질문: “서버 어디서 켜요?”\n원문 102: “프로젝트 폴더에서 서버를 실행합니다.”","distinction":"반대로 “파일을 몇 년 보관하나요?”는 위치를 알려주는 101과 주제가 비슷해도 답할 근거가 없습니다.","codes":[],"flow":[]}},{"chapter":1,"id":"what-embedding","title":"Embedding은 문장을 숫자 벡터로 표현합니다","claim":"학습된 모델이 텍스트를 정해진 차원의 실수 배열로 변환합니다.","kind":"concept","focus":"embedding","left":[["입력","사람이 읽는 질문·제목·지식 본문입니다."],["출력","예: 384차원이라면 각 문장마다 384개의 숫자가 만들어집니다."]],"right":[["비교","같은 표현 공간에 있는 벡터끼리 거리 또는 유사도를 계산합니다."],["원문","벡터만으로 사용자에게 보여줄 설명은 부족합니다. 항상 ID와 원문을 연결합니다."]],"example":"“프로젝트 폴더에서 서버를 실행합니다.”\n   ↓ Embedding model\n[0.014, −0.023, … 384개]   (숫자 형태 예시)","distinction":"위 숫자 조각은 설명용 표기입니다. 모델을 실제 실행해 측정한 벡터가 아닙니다.","codes":[],"flow":[]},{"chapter":1,"id":"model-vs-vector","title":"생성 모델과 Embedding 모델은 역할이 다릅니다","claim":"GPT의 답변 생성과 E5의 벡터 생성은 같은 종류의 결과가 아닙니다.","kind":"concept","focus":"embedding","left":[["LLM · Generation","입력 질문과 문맥을 바탕으로 다음 텍스트를 생성합니다."],["Embedding model","입력 문장을 비교 가능한 고정 길이 벡터로 인코딩합니다."]],"right":[["PostgreSQL + pgvector","이미 생성된 벡터를 저장하고 거리 연산·검색을 지원합니다."],["검색 서비스","검색된 ID와 원문을 응답으로 묶어 줍니다."]],"example":"E5가 원문의 내용을 이해해서 자연어 답변을 작성하는 것이 아닙니다.\npgvector가 E5 모델을 직접 실행하는 것도 아닙니다.","distinction":"18일에는 검색된 원문까지 반환합니다. 생성형 답변과 연결하는 일은 20일 RAG 수업의 목표입니다.","codes":[],"flow":[]},{"chapter":1,"id":"symmetric-asymmetric","title":"FAQ 질문끼리 비교할까, 질문으로 지식 본문을 찾을까?","claim":"FAQ 질문끼리 비교하는 검색과 질문으로 지식 본문을 찾는 검색은 입력 역할이 다릅니다.","kind":"concept","focus":"embedding","left":[["질문 ↔ 질문","같은 성격의 짧은 문장끼리 가까운 표현을 찾는 대칭 검색 예시입니다."],["질문 → 본문","짧은 질문으로 설명·지식 본문을 찾는 비대칭 검색 예시입니다."]],"right":[["기존 PPT","FAQ 12건의 question만 Embedding하고 answer 원문을 반환했습니다."],["이번 강의","16·17일의 지식 101~103을 유지하고 지식 본문을 검색 대상으로 확장합니다."]],"example":"질의: “서버를 어디서 실행해요?”\n검색 대상: [102] “프로젝트 폴더에서 서버를 실행합니다.”","distinction":"비대칭 검색에서는 선택한 모델의 query / passage 규칙을 각각 적용해야 합니다.","codes":[],"flow":[]},{"chapter":1,"id":"data-contract","title":"기존 지식 101·102·103의 원문을 유지합니다","claim":"11월 16~17일과 같은 ID·제목·본문을 고정하고 추가 자료만 새 버전으로 구분합니다.","kind":"concept","focus":"embedding","left":[["고정 스냅샷","101 파일 보관 · 102 서버 실행 · 103 질문 작성"],["추가 교육용 지식","104~109는 오늘의 검색 후보를 늘리기 위한 가상 자료입니다."]],"right":[["ID 의미","지식 ID는 교육용 번호이며, 기존 DB의 자동 생성 ID와 같다고 가정하지 않습니다."],["추가 버전","새 항목은 knowledge_search_v2로 구분합니다. 101~103의 원문을 덮어쓰지 않습니다."]],"example":"101 | 실습 파일은 개인 폴더에 보관합니다.\n102 | 프로젝트 폴더에서 서버를 실행합니다.\n103 | 오류 메시지와 시도한 작업을 함께 적습니다.","distinction":"16일 Development 질문의 D01과 참고한 FAQ 예제의 D01을 혼동하지 않도록, 여기서는 지식 ID와 query_01 식별자를 사용합니다.","codes":[],"flow":[]},{"chapter":1,"id":"knowledge-list","title":"오늘 사용할 가상 지식 9개를 구분합니다","claim":"기존 3개와 추가 6개를 함께 읽되, 실제 기관 규정으로 해석하지 않습니다.","kind":"knowledge","focus":"embedding"},{"chapter":1,"id":"lane-demo","title":"자료 준비와 질문 처리, 두 경로를 전환합니다","claim":"저장할 자료는 미리 Embedding하고, 요청 때는 사용자 질문만 새로 Embedding합니다.","kind":"lanes","focus":"embedding","mergedFrom":{"chapter":1,"id":"two-lanes","title":"자료 준비와 질문 처리의 실행 시점이 다릅니다","claim":"저장할 자료는 준비할 때 임베딩하고, 질문이 들어오면 질문 벡터를 만듭니다.","kind":"concept","focus":"embedding","left":[["자료 준비 · 사전 작업","원문·ID 검증 → passage Embedding → PostgreSQL의 vector 열에 저장"],["질문 처리 · 반복 작업","질문 검사 → query Embedding → Top-k SQL → 결과 ID·원문 반환"]],"right":[["재사용","본문과 모델 계약이 변하지 않았다면 같은 문서 벡터를 재사용할 수 있습니다."],["변경","본문 또는 모델 계약이 바뀌면 관련 문서 벡터를 다시 생성해야 합니다."]],"example":"수강생이 질문할 때마다 지식 9개를 다시 임베딩하지 않습니다.","distinction":"문서 파싱·Chunking·대규모 Indexing 파이프라인은 19일에 확대합니다.","codes":[],"flow":[]}},{"chapter":1,"id":"practice-1","title":"실습 01 · 검색 대상과 ID를 구분합니다","claim":"Basic·Intermediate·Advanced 중 한 수준을 선택하고, 공통 목표를 확인합니다.","kind":"practice","focus":"embedding","levels":[["Basic (기본필수)","지식 101~103의 ID·제목·본문을 확인하고 어떤 필드를 Embedding 입력으로 사용할지 표시합니다."],["Intermediate (응용)","새 가상 지식 104~109를 포함해 중복 ID·누락된 본문을 점검합니다."],["Advanced (심화)","입력 계약·원문 버전·검색 대상 필드를 구분해 오류를 기록합니다."]],"output":"지식 ID·원문·Embedding 입력 필드·버전 대응표"},{"chapter":1,"id":"quiz-1","title":"핵심 점검 · Embedding의 역할","claim":"먼저 생각한 뒤 정답과 이유를 확인합니다.","kind":"quiz","focus":"embedding","items":[["384차원은 문장을 384글자로 자른다는 뜻일까요?","아닙니다. Embedding 결과에 실수가 384개 있다는 뜻입니다."],["pgvector가 Python의 Embedding 모델도 실행할까요?","아닙니다. 모델은 Python에서 실행하고 PostgreSQL의 pgvector는 벡터 저장·연산을 맡습니다."],["검색된 후보가 하나 있으면 반드시 답할 근거도 있나요?","아닙니다. 검색 점수와 질문의 필수 정보 충족은 별도로 판단합니다."]]},{"chapter":2,"id":"vector-norm","title":"벡터의 길이(norm)와 두 점 사이 거리(distance)는 다릅니다","claim":"2차원 화살표로 방향과 크기를 보되, 실제 모델의 좌표별 의미는 알 수 없습니다.","kind":"concept","focus":"embedding","left":[["Vector","(x, y)처럼 숫자를 순서대로 갖는 배열입니다."],["L2 norm","원점에서 벡터 끝까지의 길이입니다. (3,4)의 길이는 5입니다."]],"right":[["Distance","두 벡터 끝점 사이의 거리입니다."],["실제 Embedding","384차원이라 한 화면에 모두 그릴 수 없어 2차원을 설명에 사용합니다."]],"example":"v=(3,4) → 길이 √(3²+4²)=5\nunit vector는 길이가 1인 벡터입니다.","distinction":"2차원 각 축을 출석·환불 같은 업무 의미와 일대일로 연결하지 않습니다.","codes":[],"flow":[]},{"chapter":2,"id":"dot-product","title":"Dot Product는 같은 위치의 숫자를 곱해 더합니다","claim":"내적은 방향뿐 아니라 벡터 길이의 영향도 받을 수 있습니다.","kind":"concept","focus":"embedding","left":[["계산","q=(1,0), A=(0.8,0.6) → 1×0.8+0×0.6=0.8"],["해석","같은 공간의 벡터에서 모델이 의도한 척도로 사용해야 합니다."]],"right":[["주의","항상 0~1 사이 값이 아닙니다."],["정규화","두 벡터의 길이를 1로 맞추면 내적과 Cosine similarity가 같아집니다."]],"example":"q=(1,0), U=(1,0), V=(10,10)\nDot: q·U=1, q·V=10 → V가 앞\nCosine: U=1, V≈0.707 → U가 앞","distinction":"여기서 계산한 값은 설명용이며 실제 문장 Embedding 점수가 아닙니다.","codes":[],"flow":[]},{"chapter":2,"id":"cosine","title":"Cosine similarity와 Cosine distance를 구분합니다","claim":"pgvector의 Cosine distance = 1 − Cosine similarity. 유사도는 크게, 거리는 작게 정렬합니다.","kind":"concept","focus":"embedding","left":[["공식","cos(q,d) = (q·d) / (‖q‖ × ‖d‖)"],["값의 범위","영벡터가 아니면 이론적으로 −1부터 1입니다."]],"right":[["정렬","Cosine similarity는 큰 값이 먼저입니다."],["오해","0.8을 정답 확률 80%라고 읽지 않습니다."]],"example":"q=(1,0), A=(0.8,0.6): 내적=0.8, 길이=1과 1 → Cosine=0.8","distinction":"−1은 수학적으로 반대 방향이며 문장의 논리적 부정이라는 확정 판정은 아닙니다.","codes":[],"flow":[],"mergedFrom":{"chapter":2,"id":"cosine-distance","title":"pgvector의 <=>는 Cosine distance입니다","claim":"거리값은 작을수록 가까우며, Cosine similarity와 정렬 방향이 반대입니다.","kind":"concept","focus":"embedding","left":[["연산자","embedding <=> query_vector"],["변환","Cosine distance = 1 − Cosine similarity"]],"right":[["정렬","ORDER BY embedding <=> q ASC LIMIT k"],["표시","원하면 SELECT에서 1 − distance로 유사도 형태를 계산할 수 있습니다."]],"example":"Cosine 0.8 → Distance 0.2\nCosine 0.0 → Distance 1.0\nCosine −1.0 → Distance 2.0","distinction":"인덱스 사용을 고려하면 ORDER BY에는 원래 거리 연산자를 그대로 사용합니다.","codes":[],"flow":[]}},{"chapter":2,"id":"l2","title":"L2 distance는 두 벡터 사이의 직선거리입니다","claim":"좌표 차이의 제곱을 더해 제곱근을 구합니다.","kind":"concept","focus":"embedding","left":[["계산","q=(1,0), A=(0.8,0.6) → 차이 (0.2,−0.6)"],["결과","√(0.2² + (−0.6)²)=√0.4≈0.6325"]],"right":[["정렬","L2 distance도 작을수록 가까운 후보입니다."],["정규화 영향","벡터 길이를 1로 맞추면 Cosine과 L2의 가까운 순서가 일치합니다."]],"example":"단위 벡터의 L2² = 2 − 2×Cosine similarity","distinction":"정규화되지 않은 임의의 벡터에서 Dot·Cosine·L2 순위가 같다고 가정하면 안 됩니다.","codes":[],"flow":[]},{"chapter":2,"id":"vector-demo","title":"직접 벡터를 움직여 세 계산값을 비교합니다","claim":"수학용 2차원 좌표를 조작하며 유사도와 거리의 차이를 관찰합니다.","kind":"vector-demo","focus":"embedding"},{"chapter":2,"id":"normalization","title":"정규화는 벡터의 방향을 유지하면서 길이를 1로 맞춥니다","claim":"0이 아닌 벡터 v를 그 길이로 나눕니다.","kind":"concept","focus":"embedding","left":[["공식","v_normalized = "},{"chapter":4,"id":"install-errors","title":"pgvector Windows 설치 오류를 증상별로 구분합니다","claim":"빌드·설치·DB 활성화·Python 연결은 오류를 해결하는 위치가 서로 다릅니다.","kind":"install-errors","focus":"index"},{"chapter":4,"id":"practice-4","title":"실습 04 · 서버 확장과 Python 연결 확인","claim":"Basic·Intermediate·Advanced 중 한 수준을 선택하고, 공통 목표를 확인합니다.","kind":"practice","focus":"index","levels":[["Basic (기본필수)","pgAdmin에서 확장 제공 상태를 조회하고, 준비된 지침에 따라 활성화·거리 계산을 확인합니다."],["Intermediate (응용)","기존 가상환경에서 Python 패키지와 DB 연결별 타입 등록을 확인합니다."],["Advanced (심화)","빌드·권한·DB 선택·Python 환경 오류를 별개 원인으로 분리합니다."]],"output":"PostgreSQL·pgvector 버전·DB명·SQL 결과·Python 연동 체크표"},{"chapter":4,"id":"quiz-4","title":"핵심 점검 · pgvector 설치","claim":"먼저 생각한 뒤 정답과 이유를 확인합니다.","kind":"quiz","focus":"index","items":[["pip install pgvector만 하면 vector.dll도 서버에 설치되나요?","아닙니다. Python 어댑터 패키지와 PostgreSQL 서버 확장은 별개입니다."],["CREATE EXTENSION을 postgres DB에서 실행하면 모든 DB에 적용되나요?","아닙니다. 현재 연결한 데이터베이스에만 등록합니다."],["기본 터미널 Git Bash에서 nmake 빌드를 진행하나요?","아닙니다. 빌드 단계에 한해 관리자 권한의 x64 Native Tools Command Prompt를 사용합니다."]]},{"chapter":5,"id":"search-contract","title":"저장할 단위는 원문·ID·Embedding이 연결된 한 행입니다","claim":"PostgreSQL 테이블에 vector 컬럼을 추가해 기존 SQL과 함께 사용합니다.","kind":"concept","focus":"retriever","left":[["id·title·content","원문 식별과 사용자에게 돌려줄 지식입니다."],["category·source_version","필터 및 데이터 변경의 추적 정보입니다."]],"right":[["embedding_model","벡터를 만든 모델 ID를 남깁니다."],["embedding vector(384)","이번 E5 모델의 출력 차원을 DB 차원 계약으로 검증합니다."]],"example":"id=102 · title=서버 실행 · content=프로젝트 폴더에서 서버를 실행합니다.\nembedding=[... 384개 실수]","distinction":"DB는 모델 버전이 실제로 동일한지, 질문에 답할 근거인지 자동으로 알지 못합니다.","codes":[],"flow":[]},{"chapter":5,"id":"schema-create","title":"검색용 테이블은 기존 지식 테이블과 분리합니다","claim":"이날의 검색 인덱스 연습 때문에 기존 knowledge CRUD 테이블을 삭제하거나 초기화하지 않습니다.","kind":"code","focus":"retriever","codes":["table-schema"],"left":"테이블 생성 후 컬럼·타입을 조회하여 구조가 맞는지 확인합니다.","right":"Collection은 제품마다 의미가 다릅니다. pgvector에서는 PostgreSQL 테이블과 WHERE 조건으로 검색 범위를 정합니다.","note":""},{"chapter":5,"id":"id-pair","title":"원문 순서가 달라지면 벡터와 잘못 연결될 수 있습니다","claim":"같은 개수라는 사실만으로 ID·본문·벡터 대응이 올바르다고 보장할 수 없습니다.","kind":"concept","focus":"retriever","left":[["생성 순서","knowledge 순서대로 Embedding을 계산하면 벡터의 행 순서가 대응합니다."],["저장 전","ID 중복, 행 수, 벡터 수, 원문 변경을 검사합니다."]],"right":[["원문과 한 행","id=102와 102의 본문 벡터를 한 행에 넣습니다."],["재계산","본문이 바뀌거나 E5 계약이 바뀌면 같은 조건으로 다시 Embedding합니다."]],"example":"잘못된 짝: id=102 + 지식 101의 embedding → SQL은 성공해도 의미 검색이 틀립니다.","distinction":"전체 학습 자료 9개는 설명용입니다. 인덱스 성능 개선을 측정하기 위한 규모가 아닙니다.","codes":[],"flow":[]},{"chapter":5,"id":"upsert","title":"INSERT · ON CONFLICT로 원문과 벡터를 함께 저장합니다","claim":"벡터와 원문이 불일치하지 않도록 같은 행의 갱신을 한 트랜잭션에서 관리합니다.","kind":"code","focus":"retriever","codes":["insert-row"],"left":"ON CONFLICT는 수업용 검색 테이블의 ID가 이미 있는 경우를 정의합니다.","right":"기존 knowledge 원본 데이터를 무조건 덮어쓰는 코드가 아닙니다.","note":""},{"chapter":5,"id":"topk-demo","title":"Top-k의 의미와 Metadata Filter를 직접 확인합니다","claim":"k는 최대 반환 개수이며 Cosine distance가 작은 후보부터 선택합니다. 아래 숫자는 수학용 2차원 예시입니다.","kind":"topk-demo","focus":"retriever","mergedFrom":{"chapter":5,"id":"topk-definition","title":"Top-k는 가까운 후보를 최대 k개 반환합니다","claim":"Exact Search는 검색 대상 전체의 거리를 비교하는 정확한 최근접 이웃 기준선입니다.","kind":"concept","focus":"retriever","left":[["q","질문을 같은 Embedding 모델로 만든 384차원 벡터입니다."],["k","검색으로 가져올 후보의 최대 개수입니다. k=3이면 최대 3건입니다."]],"right":[["정렬","Cosine distance가 작은 순서로 정렬합니다."],["결과","ID·원문·거리·필터 조건을 함께 받습니다."]],"example":"정렬 이전: 후보 전체 → 거리 계산\n정렬 이후: 작은 거리부터 → LIMIT k","distinction":"관련 자료가 전혀 없는 질문이어도 가장 가까운 벡터는 나올 수 있습니다.","codes":[],"flow":[]}},{"chapter":5,"id":"sql-topk","title":"Top-k SQL과 Metadata Filter SQL을 비교합니다","claim":"같은 벡터·정렬 규칙에서 category 조건을 추가하면 파라미터와 검색 범위가 달라집니다.","kind":"code-pair","focus":"retriever","codes":["topk-py","filtered-py"],"left":"데이터는 SQL이 계산합니다. HTML에서는 사용자 DB와 연결하지 않습니다.","right":"%s는 값 바인딩용이며 테이블·열 이름을 문자열로 합쳐 넣지 않습니다.","note":"","mergedFrom":{"chapter":5,"id":"sql-filter","title":"category 조건과 가까운 순서를 함께 적용합니다","claim":"Exact Search에서는 category 조건을 만족하는 전체 행의 거리를 비교합니다.","kind":"code","focus":"retriever","codes":["filtered-py"],"left":"쿼리 파라미터는 (qvec, category, qvec, k)입니다.","right":"필터가 있는 ANN 검색의 반환 개수 문제는 다음 단원에서 별도로 설명합니다.","note":""}},{"chapter":5,"id":"operator-table","title":"유사도에 맞는 pgvector 거리 연산자를 선택합니다","claim":"연산자와 인덱스 operator class는 같은 검색 척도로 맞춥니다.","kind":"concept","focus":"retriever","left":[["Cosine distance","<=> · vector_cosine_ops · 작은 값이 가까움"],["L2 distance","<-> · vector_l2_ops · 작은 값이 가까움"]],"right":[["Negative inner product","<#> · vector_ip_ops · 작을수록 큰 내적에 해당"],["이번 기준","E5 벡터를 normalize_embeddings=True로 만들고 Cosine distance를 사용합니다."]],"example":"ORDER BY embedding <=> %s ASC LIMIT 3","distinction":"Cosine 0.8을 “80% 정답”으로 표시하지 않습니다. 모델별 분포를 모른 채 고정 threshold를 적용하지 않습니다.","codes":[],"flow":[]},{"chapter":5,"id":"practice-5","title":"실습 05 · 검색용 테이블과 Top-k","claim":"Basic·Intermediate·Advanced 중 한 수준을 선택하고, 공통 목표를 확인합니다.","kind":"practice","focus":"retriever","levels":[["Basic (기본필수)","준비한 벡터를 저장하고 SQL로 상위 3건의 ID·원문을 반환합니다."],["Intermediate (응용)","k와 category를 변경해 결과 집합을 비교합니다."],["Advanced (심화)","중복·누락·원문 버전·쿼리 파라미터 순서를 검사합니다."]],"output":"저장 행 수·Top-k ID·원문·거리·실행 조건 기록"},{"chapter":5,"id":"quiz-5","title":"핵심 점검 · 저장과 Top-k","claim":"먼저 생각한 뒤 정답과 이유를 확인합니다.","kind":"quiz","focus":"retriever","items":[["ORDER BY embedding <=> q에서 ASC 또는 DESC?","ASC입니다. <=>는 거리이므로 작을수록 가까운 후보입니다."],["k=3이면 언제나 3개가 반환되나요?","아닙니다. 자료가 부족하거나 필터로 제외되면 3개 미만일 수 있습니다."],["검색됐다는 이유만으로 KnowledgeAnswer.status=answered를 정해도 되나요?","아닙니다. 실제 원문에 질문이 요구하는 정보가 있는지 확인해야 합니다."]]},{"chapter":6,"id":"hnsw-graph","title":"Exact Search와 HNSW 탐색을 비교합니다","claim":"HNSW(Hierarchical Navigable Small World)는 ANN 인덱스입니다. Exact Search는 전체, HNSW는 일부 후보를 탐색합니다.","kind":"hnsw-demo","focus":"index","mergedFrom":{"chapter":6,"id":"exact-vs-ann","title":"Exact Search와 ANN의 차이는 탐색 범위입니다","claim":"ANN은 Approximate Nearest Neighbor: 근사 최근접 이웃 검색입니다.","kind":"concept","focus":"index","left":[["Exact Search","모든 비교 대상의 거리를 계산하는 기준선입니다."],["ANN · 근사 검색","인덱스를 따라 일부 후보를 찾아 더 빠르게 검색하려고 합니다."]],"right":[["대가","정확 기준선에서 나오던 가까운 후보를 놓칠 수 있습니다."],["목표","결과 품질·응답시간·메모리 사용을 함께 보며 선택합니다."]],"example":"오늘의 지식 9건은 정확 검색만으로도 충분히 원리를 확인할 수 있습니다.","distinction":"여기서 ANN은 딥러닝에서의 Artificial Neural Network가 아닙니다.","codes":[],"flow":[]}},{"chapter":6,"id":"index-class","title":"거리 연산자와 인덱스 설정이 같아야 합니다","claim":"Cosine 인덱스를 만들었다고 L2 정렬 쿼리도 같은 인덱스를 사용한다고 가정하지 않습니다.","kind":"concept","focus":"index","left":[["정렬 쿼리","ORDER BY embedding <=> q ASC LIMIT k"],["인덱스","USING hnsw (embedding vector_cosine_ops)"]],"right":[["인덱스 생성 성공","SQL 객체가 존재한다는 사실입니다."],["실제 사용","EXPLAIN의 실행 계획에서 어떤 Scan을 택했는지 확인합니다."]],"example":"HNSW는 선택 구현입니다. 먼저 Exact Search 결과를 기준으로 보관합니다.","distinction":"이론상의 인덱스 구조만으로 몇 배의 속도 향상을 단정하지 않습니다.","codes":[],"flow":[]},{"chapter":6,"id":"hnsw-create","title":"HNSW Cosine 인덱스 정의","claim":"작은 데이터에서 인덱스 사용이 반드시 유리한 것은 아니므로 선택 실습으로 다룹니다.","kind":"code","focus":"index","codes":["hnsw"],"left":"인덱스 생성 후 ANALYZE로 통계를 갱신합니다.","right":"기존 인덱스의 정의가 다르다면 IF NOT EXISTS가 이를 고쳐주지 않습니다.","note":""},{"chapter":6,"id":"explain-query","title":"EXPLAIN으로 실제 실행 계획을 읽습니다","claim":"Index Scan 또는 Seq Scan 등 플래너의 선택을 확인합니다.","kind":"code","focus":"index","codes":["explain-real"],"left":"EXPLAIN ANALYZE는 SELECT를 실제 실행해 관측값을 출력합니다.","right":"cost는 실행시간(ms)이 아닙니다. 9건에서 Seq Scan은 정상일 수 있습니다.","note":""},{"chapter":6,"id":"hnsw-tuning","title":"HNSW의 탐색 폭을 크게 하면 무엇이 달라질까?","claim":"다양한 설정이 있지만 처음에는 구축과 조회의 역할부터 구분합니다.","kind":"concept","focus":"index","left":[["m · ef_construction","인덱스를 만들 때 연결 수·후보 탐색 폭에 영향을 줍니다."],["hnsw.ef_search","질의할 때 탐색할 후보 폭을 바꾸는 파라미터입니다."]],"right":[["가능한 효과","탐색 폭이 커지면 누락이 줄어들 수 있습니다."],["비용","질의 시간·자원 사용이 늘 수 있어 실제 측정 없이 최댓값을 선택하지 않습니다."]],"example":"작은 학습 데이터로는 ANN의 품질·속도 비교를 일반화할 수 없습니다.","distinction":"IVFFlat은 목록 기반 근사 인덱스이며 세부 튜닝은 비교용으로만 소개합니다.","codes":[],"flow":[]},{"chapter":6,"id":"ann-filter-warning","title":"ANN에 Metadata 필터를 적용하면 k개보다 적을 수 있습니다","claim":"ANN이 일부 후보를 찾은 뒤 WHERE 조건을 적용하면 통과 후보가 부족할 수 있습니다.","kind":"concept","focus":"index","left":[["예시","k=3이지만 ANN이 본 후보 중 category 조건에 맞는 것은 1건일 수 있습니다."],["중요한 구분","전체 DB에 조건 일치 자료가 더 있어도 탐색하지 못했을 수 있습니다."]],"right":[["대응","먼저 Exact Search 기준선과 필터의 결과를 확인합니다."],["확장","pgvector 버전이 지원한다면 iterative scan으로 더 탐색할 수 있지만 완전 보장은 아닙니다."]],"example":"pgvector 0.8.x에서 iterative scan은 설정과 탐색 상한의 영향을 받습니다.","distinction":"이 화면의 k=3, 반환=1은 설명용 시나리오이며 실제 측정 결과가 아닙니다.","codes":[],"flow":[]},{"chapter":6,"id":"practice-6","title":"실습 06 · 인덱스와 정확 검색 비교","claim":"Basic·Intermediate·Advanced 중 한 수준을 선택하고, 공통 목표를 확인합니다.","kind":"practice","focus":"index","levels":[["Basic (기본필수)","Exact Search와 HNSW의 원리·정렬·한계를 말로 설명합니다."],["Intermediate (응용)","인덱스를 만들고 EXPLAIN으로 실제 Scan 종류를 확인합니다."],["Advanced (심화)","동일 질의·필터에서 Exact Search 결과와 ANN 후보의 차이를 기록합니다."]],"output":"인덱스 정의·실행 계획·검색 품질·시간의 구분표"},{"chapter":6,"id":"quiz-6","title":"핵심 점검 · 인덱스의 의미","claim":"먼저 생각한 뒤 정답과 이유를 확인합니다.","kind":"quiz","focus":"index","items":[["HNSW 인덱스만 만들면 DB가 반드시 인덱스를 사용하나요?","아닙니다. PostgreSQL 플래너가 Seq Scan을 선택할 수 있습니다."],["ANN은 모든 가까운 후보를 반드시 반환하나요?","아닙니다. Exact Search의 후보를 일부 놓칠 수 있습니다."],["EXPLAIN의 cost 숫자는 밀리초인가요?","아닙니다. cost는 플래너의 비용 추정 단위입니다."]]},{"chapter":7,"id":"quality-demo","title":"관련성 기준으로 Retrieval 결과를 평가합니다","claim":"Top-k 순위와 답변 가능성을 구분하고, 검색된 원문이 필요한 사실을 포함하는지 검토합니다.","kind":"quality-demo","focus":"retriever","mergedFrom":{"chapter":7,"id":"what-quality","title":"가장 가까운 벡터와 가장 도움이 되는 지식은 다를 수 있습니다","claim":"Retrieval 품질은 검색 점수만이 아니라 질문에 필요한 정보를 포함하는지로 판단합니다.","kind":"concept","focus":"retriever","left":[["관련","원문이 질문이 요구한 사실을 직접 제공합니다."],["부분 관련","주제는 비슷하지만 필요한 속성이나 조건이 빠져 있습니다."]],"right":[["무관","표현이나 주제가 비슷해 보여도 필요한 사실이 없습니다."],["실패 기록","후보가 나타난 이유와 실제 답할 수 없는 이유를 함께 남깁니다."]],"example":"질문: “실습 파일을 몇 년 보관하나요?”\n101: “실습 파일은 개인 폴더에 보관합니다.” → 기간 정보 없음","distinction":"이 자료를 근거로 “3년” 등을 추측하면 안 됩니다.","codes":[],"flow":[]}},{"chapter":7,"id":"out-of-scope","title":"범위 밖 질문에도 Top-k 결과가 나올 수 있습니다","claim":"질문이 검색 데이터의 범위 밖이어도 가장 가까운 후보는 반환될 수 있습니다.","kind":"concept","focus":"retriever","left":[["예시","“회사 비밀번호가 무엇인가요?” → 공개 수업 지식에 해당 정보가 없습니다."],["잘못된 대응","상위 후보를 강제로 근거로 사용해 사실을 만들어냅니다."]],"right":[["적절한 대응","검색 점수·원문·권한·필수 정보 포함 여부를 검토해 중단 또는 정보 부족으로 연결합니다."],["이후","20일 RAG에서 이 판정을 Context 및 KnowledgeAnswer와 연결합니다."]],"example":"Top-k로 반환된 ID 집합 ⊇ 실제로 Context에 넣을 ID 집합(검토 후)","distinction":"출처로 인용할 수 있는 ID는 DB 전체도, 후보 전체도 아니라 실제로 전달하고 검증한 자료에 한정합니다.","codes":[],"flow":[]},{"chapter":7,"id":"empty-error","title":"빈 결과와 검색 시스템 장애는 다릅니다","claim":"정상 조회에서 후보가 없는 것과 PostgreSQL 접속 실패를 같은 결과로 반환하지 않습니다.","kind":"concept","focus":"retriever","left":[["정상 0건","category에 맞는 자료가 없으면 rows=[]가 될 수 있습니다."],["오류","DB 연결 오류·잘못된 vector 차원·SQL 오류는 실패 기록이 필요합니다."]],"right":[["원문 관련성 부족","조회된 자료가 있어도 질문을 해결하지 못할 수 있습니다."],["기록","empty / error / irrelevant를 분리해 이후 Agent의 분기 근거로 남깁니다."]],"example":"결과 0건 = 검색 대상 없음\nDB 예외 = 이번 검색 실행 실패\nTop-k 3건 = 가까운 후보가 있을 뿐","distinction":"DB 장애를 “자료 부족”으로 바꾸면 운영 문제가 숨겨집니다.","codes":[],"flow":[]},{"chapter":7,"id":"qualitative-score","title":"Top-k 정성평가에서 무엇을 기록할까?","claim":"결과 ID·순위·원문·사람의 관련성 등급과 이유를 같이 적습니다.","kind":"concept","focus":"retriever","left":[["질문별 평가","같은 질문·데이터·모델 계약으로 결과를 비교합니다."],["품질 판정","관련 / 부분 관련 / 무관을 원문의 문장과 연결해 설명합니다."]],"right":[["검색 설정","k, category, 모델 ID·revision, 원문 버전 등을 기록합니다."],["경계","정식 Recall@k·MRR·nDCG는 25일에 배우므로 오늘은 원문 중심의 정성평가에 집중합니다."]],"example":"query_01 · k=3 · 근거 원문 · 사람이 판정한 이유","distinction":"오늘의 결과표는 수강생 실행 후 기록할 템플릿이지, 이미 측정한 성공률이 아닙니다.","codes":[],"flow":[]},{"chapter":7,"id":"update-contract","title":"원문이나 모델이 바뀌면 기존 결과를 그대로 믿지 않습니다","claim":"검색 데이터를 갱신한 뒤에는 임베딩과 버전의 관계를 점검합니다.","kind":"concept","focus":"retriever","left":[["content 변경","해당 문서가 Embedding 입력에 포함되면 다시 계산합니다."],["category 변경","본문이 그대로라면 벡터는 재사용 가능할 수 있지만 필터 결과는 바뀝니다."]],"right":[["모델 변경","같은 384차원이어도 다른 공간이므로 기존 문서·질의를 함께 재생성합니다."],["ID 변경","실제 원문과 벡터가 같은 자료를 가리키는지 다시 확인합니다."]],"example":"점수만으로는 검색 품질의 변화를 추적하기 어렵습니다. 모델과 원문 버전을 함께 기록합니다.","distinction":"19일의 문서 수집·변경·인덱싱 파이프라인에서 본격적으로 확대합니다.","codes":[],"flow":[]},{"chapter":7,"id":"practice-7","title":"실습 07 · Top-k 결과의 관련성을 평가합니다","claim":"Basic·Intermediate·Advanced 중 한 수준을 선택하고, 공통 목표를 확인합니다.","kind":"practice","focus":"retriever","levels":[["Basic (기본필수)","질문 3개에 대한 Top-k 결과의 원문을 읽고 관련·무관을 판단합니다."],["Intermediate (응용)","k와 분류 조건을 바꾸고 결과·관련성 변화를 설명합니다."],["Advanced (심화)","범위 밖 질문·중복·자료 버전 변화로 인한 실패를 분리합니다."]],"output":"질문별 Top-k 원문·관련성 등급·근거·실패 사유 표"},{"chapter":7,"id":"quiz-7","title":"핵심 점검 · 검색 결과 판정","claim":"먼저 생각한 뒤 정답과 이유를 확인합니다.","kind":"quiz","focus":"retriever","items":[["유사도 점수가 높으면 답을 보장하나요?","아닙니다. 원문에 필요한 사실이 있어야 합니다."],["DB 오류를 정보 부족으로 바꿔도 되나요?","안 됩니다. DB 장애와 정상적인 빈 결과는 서로 다른 처리 대상입니다."],["Top-k 후보 3개를 모두 GPT에게 넣어야 하나요?","아닙니다. 실제 질문에 적절하고 전달 허용된 자료만 선택해야 합니다."]]},{"chapter":8,"id":"integration-map","title":"검색 모듈의 입출력 계약과 기존 기능의 연결","claim":"Retriever 결과를 16일 Context 구성과 17일 LLM Client 앞단에 연결할 위치를 확인합니다.","kind":"integration-map","focus":"context","mergedFrom":{"chapter":8,"id":"search-module","title":"검색 모듈은 입력과 출력의 계약으로 연결합니다","claim":"한 함수가 모든 책임을 떠맡기보다 단계별 반환을 정합니다.","kind":"concept","focus":"context","left":[["입력 검사","질문 문자열·k·분류 조건·권한 범위를 검사합니다."],["Embedding","같은 모델·정규화 계약으로 1차원 질의 벡터를 만듭니다."]],"right":[["검색","DB의 Exact Top-k를 호출하고 ID·거리·원문을 반환합니다."],["기록","모델 버전·DB 버전·k·필터·성공/실패를 별도 보존합니다."]],"example":"validate_request → embed_query → search_exact → format_results → record_run","distinction":"이 함수 이름은 수업용 설계 예시이며 pgvector나 OpenAI SDK가 제공하는 고정 인터페이스가 아닙니다.","codes":[],"flow":[]}},{"chapter":8,"id":"retrieval-output","title":"검색한 원문을 기존 Context 계약에 맞게 정리합니다","claim":"17일의 LLM Client는 수정하지 않고 검색 모듈이 고른 지식 목록을 받을 수 있게 설계합니다.","kind":"code","focus":"context","codes":["read-result"],"left":"검색 결과에는 distance가 있지만, 다음 단계에서 이를 사실성 점수로 바꾸지 않습니다.","right":"현재 날짜의 필수 과제는 실제 GPT 답변 생성까지 이어 붙이는 것이 아닙니다.","note":""},{"chapter":8,"id":"source-scope","title":"검색된 후보 전체와 실제 전달한 출처 목록은 다릅니다","claim":"16일의 provided_ids와 17일의 KnowledgeAnswer 검증 규칙이 여전히 필요합니다.","kind":"concept","focus":"context","left":[["retrieved_ids","검색으로 가져온 후보 전체의 ID입니다."],["included_ids","관련성·권한·버전을 확인해 이번 Context에 넣은 ID입니다."]],"right":[["source_ids","LLM이 최종 응답에서 인용한 ID 목록입니다."],["검증","source_ids가 included_ids 범위에 있는지와 실제 본문 근거를 별도로 확인합니다."]],"example":"검색 후보 [101,102,107] → Context [102] → 응답 source_ids [102]","distinction":"사용할 수 없는 자료를 검색했다는 사실만으로 모델에게 전송하는 것은 아닙니다.","codes":[],"flow":[]},{"chapter":8,"id":"embedding-rebuild","title":"모델과 전처리를 바꿀 때 검색 집합을 관리합니다","claim":"실무에서는 한 테이블에 다른 Embedding 공간의 벡터를 무심코 섞지 않습니다.","kind":"code","focus":"context","codes":["version-update"],"left":"문서·질의 모두 새 계약으로 재임베딩해야 합니다.","right":"동일한 384차원이라는 사실만으로 벡터 공간 호환성을 보장하지 않습니다.","note":""},{"chapter":8,"id":"practice-8","title":"실습 08 · AI Agent용 검색 모듈의 입출력 검증","claim":"Basic·Intermediate·Advanced 중 한 수준을 선택하고, 공통 목표를 확인합니다.","kind":"practice","focus":"context","levels":[["Basic (기본필수)","질문 하나로 Embedding·Top-k·원문 출력까지 연결하고 설명합니다."],["Intermediate (응용)","category·k를 설정으로 분리하고 빈 결과를 구분합니다."],["Advanced (심화)","버전·오류·실행시간·원문 관련성 기록을 통합합니다."]],"output":"질문→후보 ID·원문 반환 + 설정·실행·평가 기록"},{"chapter":8,"id":"quiz-8","title":"최종 확인 · 오늘 어디까지 완성했을까?","claim":"먼저 생각한 뒤 정답과 이유를 확인합니다.","kind":"quiz","focus":"context","items":[["오늘은 LLM의 답변 생성까지 반드시 구현했나요?","아닙니다. 오늘 필수 범위는 Embedding → 저장 → Top-k → 원문 반환입니다."],["retrieved_ids와 source_ids가 항상 같아야 하나요?","아닙니다. 실제로 Context에 포함한 ID만 최종 출처가 될 수 있습니다."],["내일은 어떤 흐름을 더하나요?","문서 파싱·Chunking·Metadata와 인덱싱 파이프라인을 본격적으로 구현합니다."]]},{"chapter":8,"id":"closing","title":"오늘의 검색 기능과 다음 수업의 연결","claim":"원문 검색을 완료하고 19일 문서 Indexing, 20일 Basic RAG로 확장할 위치를 정리합니다.","kind":"closing","focus":"context","mergedFrom":{"chapter":8,"id":"next-classes","title":"11월 19일은 문서 Indexing, 20일은 RAG로 확장합니다","claim":"18일의 검색 모듈은 19일 문서 인덱싱과 20일 Basic RAG의 기반입니다.","kind":"concept","focus":"context","left":[["19일 · Indexing","문서 파싱→정제→Chunking→Metadata→Embedding→DB 저장을 확장합니다."],["20일 · RAG","질문→Retriever→Context→Prompt→LLM Client→검증·Citation을 연결합니다."]],"right":[["11월 23일 · Hybrid","Keyword Search와 Dense Search를 융합해 Retriever를 개선합니다."],["11월 24~25일 · 개선·평가","Reranking과 Recall@k·MRR·nDCG 등 정식 지표를 다룹니다."]],"example":"전체 경로: 사용자 → Retriever → Context → LLM → 검증 → 답변","distinction":"AI Agent의 상태 관리·도구 실행·권한·승인은 이후 차시의 주제입니다.","codes":[],"flow":[]}}],"codes":{"pg-env":{"title":"서버의 버전·DB·확장 제공 여부 조회","lang":"sql","raw":"-- 실행: pgAdmin → 수업용 DB → Query Tool\nSELECT version();\nSELECT current_database(), current_user;\nSELECT name, default_version, installed_version\nFROM pg_available_extensions\nWHERE name = 'vector';","desc":"확장 제공 여부(행 존재)와 현재 DB 설치 여부(installed_version)를 별도로 봅니다.","independent":true,"html_lines":["<span class=\"py-comment\">-- 실행: pgAdmin → 수업용 DB → Query Tool</span>","<span class=\"py-keyword\">SELECT</span> <span class=\"py-keyword\">version</span>();","<span class=\"py-keyword\">SELECT</span> current_database(), <span class=\"py-keyword\">current_user</span>;","<span class=\"py-keyword\">SELECT</span> name, default_version, installed_version","<span class=\"py-keyword\">FROM</span> pg_available_extensions","<span class=\"py-keyword\">WHERE</span> name <span class=\"py-operator\">=</span> <span class=\"py-string\">&#x27;vector&#x27;</span>;"]},"pg-config":{"title":"PostgreSQL 18.6 설치 경로 확인","lang":"cmd","raw":"REM 실행: Windows 명령 프롬프트(cmd)\n\"C:\\Program Files\\PostgreSQL\\18\\bin\\pg_config.exe\" --version\n\"C:\\Program Files\\PostgreSQL\\18\\bin\\pg_config.exe\" --includedir-server\n\"C:\\Program Files\\PostgreSQL\\18\\bin\\pg_config.exe\" --pkglibdir","desc":"수강생 공통: PostgreSQL 18.6 및 C:\\Program Files\\PostgreSQL\\18 경로","independent":true,"html_lines":["<span class=\"py-comment\">REM 실행: Windows 명령 프롬프트(cmd)</span>","<span class=\"py-string\">&quot;</span><span class=\"py-string\">C:\\Program Files\\PostgreSQL\\18\\bin\\pg_config.exe</span><span class=\"py-string\">&quot;</span> --version","<span class=\"py-string\">&quot;</span><span class=\"py-string\">C:\\Program Files\\PostgreSQL\\18\\bin\\pg_config.exe</span><span class=\"py-string\">&quot;</span> --includedir ir</span> <span class=\"py-string\">&quot;</span>%PGROOT%<span class=\"py-string\">\\lib\\vector.dll</span><span class=\"py-string\">&quot;</span>","<span class=\"py-keyword\">dir</span> <span class=\"py-string\">&quot;</span>%PGROOT%<span class=\"py-string\">\\share\\extension\\vector.control</span><span class=\"py-string\">&quot;</span>","<span class=\"py-keyword\">dir</span> <span class=\"py-string\">&quot;</span>%PGROOT%<span class=\"py-string\">\\share\\extension\\vector--*.sql</span><span class=\"py-string\">&quot;</span>"]},"enable-vector":{"title":"현재 DB에서 pgvector 활성화·버전 확인","lang":"sql","raw":"-- 실행: pgAdmin Query Tool · 정확한 수업용 DB 선택\nSELECT current_database();\nSELECT name, default_version, installed_version\nFROM pg_available_extensions\nWHERE name='vector';\n-- 서버 확장이 제공되고 권한이 있을 때만 아래 실행\nCREATE EXTENSION IF NOT EXISTS vector;\nSELECT extname, extversion\nFROM pg_extension\nWHERE extname='vector';","desc":"CREATE EXTENSION은 현재 DB에만 적용됩니다. 권한과 트랜잭션 상태를 확인합니다.","independent":true,"html_lines":["<span class=\"py-comment\">-- 실행: pgAdmin Query Tool · 정확한 수업용 DB 선택</span>","<span class=\"py-keyword\">SELECT</span> current_database();","<span class=\"py-keyword\">SELECT</span> name, default_version, installed_version","<span class=\"py-keyword\">FROM</span> pg_available_extensions","<span class=\"py-keyword\">WHERE</span> name<span class=\"py-operator\">=</span><span class=\"py-string\">&#x27;vector&#x27;</span>;","<span class=\"py-comment\">-- 서버 확장이 제공되고 권한이 있을 때만 아래 실행</span>","<span class=\"py-keyword\">CREATE</span> EXTENSION <span class=\"py-keyword\">IF</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">EXISTS</span> vector;","<span class=\"py-keyword\">SELECT</span> extname, extversion","<span class=\"py-keyword\">FROM</span> pg_extension","<span class=\"py-keyword\">WHERE</span> extname<span class=\"py-operator\">=</span><span class=\"py-string\">&#x27;vector&#x27;</span>;"]},"vector-math":{"title":"숫자 벡터로 거리 계산 확인","lang":"sql","raw":"-- 설명용 3차원 벡터, 모델의 실제 출력 아님\nSELECT\n  '[1,0,0]'::vector <=> '[1,0,0]'::vector AS same_direction,\n  '[1,0,0]'::vector <=> '[0,1,0]'::vector AS perpendicular,\n  '[1,0,0]'::vector <=> '[-1,0,0]'::vector AS opposite_direction;","desc":"수학적 기대값은 0 · 1 · 2입니다. 실제 PC 실행 결과는 SQL에서 확인합니다.","independent":true,"html_lines":["<span class=\"py-comment\">-- 설명용 3차원 벡터, 모델의 실제 출력 아님</span>","<span class=\"py-keyword\">SELECT</span>","  <span class=\"py-string\">&#x27;[1,0,0]&#x27;</span>::vector <span class=\"py-operator\">&lt;</span><span class=\"py-operator\">=</span><span class=\"py-operator\">&gt;</span> <span class=\"py-string\">&#x27;[1,0,0]&#x27;</span>::vector <span class=\"py-keyword\">AS</span> same_direction,","  <span class=\"py-string\">&#x27;[1,0,0]&#x27;</span>::vector <span class=\"py-operator\">&lt;</span><span class=\"py-operator\">=</span><span class=\"py-operator\">&gt;</span> <span class=\"py-string\">&#x27;[0,1,0]&#x27;</span>::vector <span class=\"py-keyword\">AS</span> perpendicular,","  <span class=\"py-string\">&#x27;[1,0,0]&#x27;</span>::vector <span class=\"py-operator\">&lt;</span><span class=\"py-operator\">=</span><span class=\"py-operator\">&gt;</span> <span class=\"py-string\">&#x27;[-1,0,0]&#x27;</span>::vector <span class=\"py-keyword\">AS</span> opposite_direction;"]},"vector-temp":{"title":"기존 테이블을 건드리지 않는 임시 검색 검사","lang":"sql","raw":"-- 별도 트랜잭션을 시작하지 않은 Query Tool에서 실행\nBEGIN;\nCREATE TEMP TABLE day23_vector_check (\n  id integer PRIMARY KEY,\n  label text NOT NULL,\n  embedding vector(3) NOT NULL\n) ON COMMIT DROP;\nINSERT INTO day23_vector_check (id,label,embedding) VALUES\n  (1,'같은 방향','[1,0,0]'),\n  (2,'가까운 방향','[0.8,0.6,0]'),\n  (3,'직각 방향','[0,1,0]');\nSELECT id,label,\n       embedding <=> '[1,0,0]'::vector AS distance\nFROM day23_vector_check\nORDER BY embedding <=> '[1,0,0]'::vector ASC\nLIMIT 3;\nCOMMIT;","desc":"예상 ID 순서: 1 → 2 → 3. COMMIT 시 임시 테이블을 삭제합니다.","independent":true,"html_lines":["<span class=\"py-comment\">-- 별도 트랜잭션을 시작하지 않은 Query Tool에서 실행</span>","<span class=\"py-keyword\">BEGIN</span>;","<span class=\"py-keyword\">CREATE</span> TEMP <span class=\"py-keyword\">TABLE</span> day23_vector_check (","  id <span class=\"py-function\">integer</span> <span class=\"py-keyword\">PRIMARY</span> <span class=\"py-keyword\">KEY</span>,","  label <span class=\"py-function\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  embedding vector(<span class=\"py-number\">3</span>) <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>",") <span class=\"py-keyword\">ON</span> <span class=\"py-keyword\">COMMIT</span> <span class=\"py-keyword\">DROP</span>;","<span class=\"py-keyword\">INSERT</span> <span class=\"py-keyword\">INTO</span> day23_vector_check (id,label,embedding) <span class=\"py-keyword\">VALUES</span>","  (<span class=\"py-number\">1</span>,<span class=\"py-string\">&#x27;같은 방향&#x27;</span>,<span class=\"py-string\">&#x27;[1,0,0]&#x27;</span>),","  (<span class=\"py-number\">2</span>,<span class=\"py-string\">&#x27;가까운 방향&#x27;</span>,<span class=\"py-string\">&#x27;[0.8,0.6,0]&#x27;</span>),","  (<span class=\"py-number\">3</span>,<span class=\"py-string\">&#x27;직각 방향&#x27;</span>,<span class=\"py-string\">&#x27;[0,1,0]&#x27;</span>);","<span class=\"py-keyword\">SELECT</span> id,label,","       embedding <span class=\"py-operator\">&lt;</span><span class=\"py-operator\">=</span><span class=\"py-operator\">&gt;</span> <span class=\"py-string\">&#x27;[1,0,0]&#x27;</span>::vector <span class=\"py-keyword\">AS</span> distance","<span class=\"py-keyword\">FROM</span> day23_vector_check","<span class=\"py-keyword\">ORDER</span> <span class=\"py-keyword\">BY</span> embedding <span class=\"py-operator\">&lt;</span><span class=\"py-operator\">=</span><span class=\"py-operator\">&gt;</span> <span class=\"py-string\">&#x27;[1,0,0]&#x27;</span>::vector <span class=\"py-keyword\">ASC</span>","<span class=\"py-keyword\">LIMIT</span> <span class=\"py-number\">3</span>;","<span class=\"py-keyword\">COMMIT</span>;"]},"gitbash-env":{"title":"기존 Python 가상환경과 패키지 확인","lang":"bash","raw":"# 실행: VS Code의 Git Bash / 기존 환경을 재사용\npython -c \"import sys; print(sys.executable)\"\npython -m pip show psycopg pgvector python-dotenv\n# 없는 패키지에 한해 설치\npython -m pip install pgvector\n# psycopg[ binary ]와 dotenv가 없는 경우에만\npython -m pip install 'psycopg[binary]' python-dotenv\npython -m pip check","desc":"pip 설치는 서버에 vector.dll을 설치하는 작업이 아닙니다.","independent":true,"html_lines":["<span class=\"py-comment\"># 실행: VS Code의 Git Bash / 기존 환경을 재사용</span>","python -c <span class=\"py-string\">&quot;import sys; print(sys.executable)&quot;</span>","python -m pip show psycopg pgvector python-dotenv","<span class=\"py-comment\"># 없는 패키지에 한해 설치</span>","python -m pip install pgvector","<span class=\"py-comment\"># psycopg[ binary ]와 dotenv가 없는 경우에만</span>","python -m pip install <span class=\"py-string\">&#x27;psycopg[binary]&#x27;</span> python-dotenv","python -m pip check"]},"dotenv":{"title":"실습용 .env · 본인 PC에만 저장","lang":"dotenv","raw":"PGHOST=127.0.0.1\nPGPORT=5432\nPGDATABASE=knowledge_lab\nPGUSER=본인_DB계정\nPGPASSWORD=본인_DB비밀번호","desc":"DB명·포트·계정은 pgAdmin에서 실제 확인한 값으로 교체합니다. Git에 업로드하지 않습니다.","independent":false,"html_lines":["PGHOST<span class=\"py-operator\">=</span><span class=\"py-string\">127.0.0.1</span>","PGPORT<span class=\"py-operator\">=</span><span class=\"py-string\">5432</span>","PGDATABASE<span class=\"py-operator\">=</span><span class=\"py-string\">knowledge_lab</span>","PGUSER<span class=\"py-operator\">=</span><span class=\"py-string\">본인_DB계정</span>","PGPASSWORD<span class=\"py-operator\">=</span><span class=\"py-string\">본인_DB비밀번호</span>"]},"db-python":{"title":"Python ↔ PostgreSQL 벡터 연결 확인","lang":"python","raw":"from pathlib import Path\nimport psycopg\nfrom dotenv import dotenv_values\nfrom pgvector import Vector\nfrom pgvector.psycopg import register_vector\n\ncfg = dotenv_values(Path(__file__).with_name('.env'), interpolate=False)\nrequired = ['PGHOST', 'PGPORT', 'PGDATABASE', 'PGUSER', 'PGPASSWORD']\nif any(not cfg.get(key) for key in required):\n    raise RuntimeError('DB 설정이 부족합니다.')\nwith psycopg.connect(host=cfg['PGHOST'], port=int(cfg['PGPORT']),\n                     dbname=cfg['PGDATABASE'], user=cfg['PGUSER'],\n                     password=cfg['PGPASSWORD']) as conn:\n    register_vector(conn)  # 연결마다 vector 타입 등록\n    test = Vector([1.0, 0.0, 0.0])\n    dims, dist = conn.execute(\n        'SELECT vector_dims(%s::vector), %s::vector <=> %s::vector',\n        (test, test, test)\n    ).fetchone()\n    assert dims == 3 and abs(float(dist)) < 1e-6\n    print('DB 연결 및 pgvector 변환 확인 완료')","desc":"확장 활성화·DB 권한이 먼저 준비돼야 하며, 이 코드는 실제 DB에 연결합니다.","independent":true,"html_lines":["<span class=\"py-keyword\">from</span> pathlib <span class=\"py-keyword\">import</span> Path","<span class=\"py-keyword\">import</span> psycopg","<span class=\"py-keyword\">from</span> dotenv <span class=\"py-keyword\">import</span> dotenv_values","<span class=\"py-keyword\">from</span> pgvector <span class=\"py-keyword\">import</span> Vector","<span class=\"py-keyword\">from</span> pgvector.psycopg <span class=\"py-keyword\">import</span> register_vector","","cfg <span class=\"py-operator\">=</span> dotenv_values(Path(__file__)<span class=\"py-operator\">.</span>with_name(<span class=\"py-string\">&#x27;</span><span class=\"py-string\">.env</span><span class=\"py-string\">&#x27;</span>), interpolate<span class=\"py-operator\">=</span><span class=\"py-keyword\">False</span>)","required <span class=\"py-operator\">=</span> [<span class=\"py-string\">&#x27;</span><span class=\"py-string\">PGHOST</span><span class=\"py-string\">&#x27;</span>, <span class=\"py-string\">&#x27;</span><span class=\"py-string\">PGPORT</span><span class=\"py-string\">&#x27;</span>, <span class=\"py-string\">&#x27;</span><span class=\"py-string\">PGDATABASE</span><span class=\"py-string\">&#x27;</s KNOWLEDGE), 384)\nassert query_vecs.shape == (1, 384)\nassert np.isfinite(doc_vecs).all()\nprint(doc_vecs.shape, query_vecs.shape)","desc":"이 예시는 앞서 정의한 model과 KNOWLEDGE가 준비된 뒤 실행하는 코드 발췌입니다.","independent":false,"html_lines":["<span class=\"py-keyword\">import</span> numpy <span class=\"py-keyword\">as</span> np","","<span class=\"py-comment\"># KNOWLEDGE: ID · title · content를 가진 지식 목록</span>","passages <span class=\"py-operator\">=</span> [<span class=\"py-string\">&#x27;</span><span class=\"py-string\">passage: </span><span class=\"py-string\">&#x27;</span> <span class=\"py-operator\">+</span> row[<span class=\"py-string\">&#x27;</span><span class=\"py-string\">title</span><span class=\"py-string\">&#x27;</span>] <span class=\"py-operator\">+</span> <span class=\"py-string\">&#x27;</span><span class=\"py-string\"> </span><span class=\"py-string\">&#x27;</span> <span class=\"py-operator\">+</span> row[<span class=\"py-string\">&#x27;</span><span class=\"py-string\">content</span><span class=\"py-string\">&#x27;</span>]","            <span class=\"py-keyword\">for</span> row <span class=\"py-operator\">in</span> KNOWLEDGE]","questions <span class=\"py-operator\">=</span> [<span class=\"py-string\">&#x27;</span><span class=\"py-string\">서버는 어디에서 실행하나요?</span><span class=\"py-string\">&#x27;</span>]","query_inputs <span class=\"py-operator\">=</span> [<span class=\"py-string\">&#x27;</span><span class=\"py-string\">query: </span><span class=\"py-string\">&#x27;</span> <span class=\"py-operator\">+</span> q <span class=\"py-keyword\">for</span> q <span class=\"py-operator\">in</span> questions]","","<span class=\"py-comment\"># 동일 모델·동일 정규화 정책, 역할별 접두어 사용</span>","doc_vecs <span class=\"py-operator\">=</span> model<span class=\"py-operator\">.</span>encode(passages, normalize_embeddings<span class=\"py-operator\">=</span><span class=\"py-keyword\">True</span>,","                        convert_to_numpy<span class=\"py-operator\">=</span><span class=\"py-keyword\">True</span>, batch_size<span class=\"py-operator\">=</span><span class=\"py-number\">8</span>)","query_vecs <span class=\"py-operator\">=</span> model<span class=\"py-operator\">.</span>encode(query_inputs, normalize_embeddings<span class=\"py-operator\">=</span><span class=\"py-keyword\">True</span>,","                          convert_to_numpy<span class=\"py-operator\">=</span><span class=\"py-keyword\">True</span>)","<span class=\"py-keyword\">assert</span> doc_vecs<span class=\"py-operator\">.</span>shape <span class=\"py-operator\">==</span> (<span class=\"py-function\">len</span>(KNOWLEDGE), <span class=\"py-number\">384</span>)","<span class=\"py-keyword\">assert</span> query_vecs<span class=\"py-operator\">.</span>shape <span class=\"py-operator\">==</span> (<span class=\"py-number\">1</span>, <span class=\"py-number\">384</span>)","<span class=\"py-keyword\">assert</span> np<span class=\"py-operator\">.</span>isfinite(doc_vecs)<span class=\"py-operator\">.</span>all()","<span class=\"py-function\">print</span>(doc_vecs<span class=\"py-operator\">.</span>shape, query_vecs<span class=\"py-operator\">.</span>shape)"]},"check-embedding":{"title":"모델 출력의 기본 검사","lang":"python","raw":"import numpy as np\n\ndef validate_vectors(arr, rows, dims=384):\n    values = np.asarray(arr, dtype=np.float32)\n    if values.shape != (rows, dims):\n        raise ValueError('벡터 shape가 모델 계약과 다릅니다.')\n    if not np.isfinite(values).all():\n        raise ValueError('NaN 또는 Inf가 있습니다.')\n    lengths = np.linalg.norm(values, axis=1)\n    if np.any(lengths <= 1e-12):\n        raise ValueError('영벡터가 있습니다.')\n    if not np.allclose(lengths, 1, rtol=0, atol=1e-5):\n        raise ValueError('정규화 조건 불일치')\n    return values","desc":"출력값이 유효하다고 해서 실제 관련성까지 검증됐다는 뜻은 아닙니다.","independent":true,"html_lines":["<span class=\"py-keyword\">import</span> numpy <span class=\"py-keyword\">as</span> np","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">validate_vectors</span>(arr, rows, dims<span class=\"py-operator\">=</span><span class=\"py-number\">384</span>):","    values <span class=\"py-operator\">=</span> np<span class=\"py-operator\">.</span>asarray(arr, dtype<span class=\"py-operator\">=</span>np<span class=\"py-operator\">.</span>float32)","    <span class=\"py-keyword\">if</span> values<span class=\"py-operator\">.</span>shape <span class=\"py-operator\">!=</span> (rows, dims):","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&#x27;</span><span class=\"py-string\">벡터 shape가 모델 계약과 다릅니다.</span><span class=\"py-string\">&#x27;</span>)","    <span class=\"py-keyword\">if</span> <span class=\"py-operator\">not</span> np<span class=\"py-operator\">.</span>isfinite(values)<span class=\"py-operator\">.</span>all():","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&#x27;</span><span class=\"py-string\">NaN 또는 Inf가 있습니다.</span><span class=\"py-string\">&#x27;</span>)","    lengths <span class=\"py-operator\">=</span> np<span class=\"py-operator\">.</span>linalg<span class=\"py-operator\">.</span>norm(values, axis<span class=\"py-operator\">=</span><span class=\"py-number\">1</span>)","    <span class=\"py-keyword\">if</span> np<span class=\"py-operator\">.</span>any(lengths <span class=\"py-operator\">&lt;</span><span class=\"py-operator\">=</span> <span class=\"py-number\">1e-12</span>):","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&#x27;</span><span class=\"py-string\">영벡터가 있습니다.</span><span class=\"py-string\">&#x27;</span>)","    <span class=\"py-keyword\">if</span> <span class=\"py-operator\">not</span> np<span class=\"py-operator\">.</span>allclose(lengths, <span class=\"py-number\">1</span>, rtol<span class=\"py-operator\">=</span><span class=\"py-number\">0</span>, atol<span class=\"py-operator\">=</span><span class=\"py-number\">1e-5</span>):","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&#x27;</span><span class=\"py-string\">정규화 조건 불일치</span><span class=\"py-string\">&#x27;</span>)","    <span class=\"py-keyword\">return</span> values"]},"python-math":{"title":"간단한 벡터의 세 지표 계산","lang":"python","raw":"import numpy as np\nq = np.array([1.0, 0.0])\na = np.array([0.8, 0.6])\ndot = float(q @ a)\ncosine = dot / (np.linalg.norm(q) * np.linalg.norm(a))\nl2 = float(np.linalg.norm(q - a))\nprint('dot', round(dot, 4))          # 0.8\nprint('cosine', round(cosine, 4))    # 0.8\nprint('L2', round(l2, 4))            # 0.6325","desc":"실제 문장 Embedding이 아니라 수학 설명용 2차원 벡터입니다.","independent":true,"html_lines":["<span class=\"py-keyword\">import</span> numpy <span class=\"py-keyword\">as</span> np","q <span class=\"py-operator\">=</span> np<span class=\"py-operator\">.</span>array([<span class=\"py-number\">1.0</span>, <span class=\"py-number\">0.0</span>])","a <span class=\"py-operator\">=</span> np<span class=\"py-operator\">.</span>array([<span class=\"py-number\">0.8</span>, <span class=\"py-number\">0.6</span>])","dot <span class=\"py-operator\">=</span> <span class=\"py-function\">float</span>(q <span class=\"py-operator\">@</span> a)","cosine <span class=\"py-operator\">=</span> dot <span class=\"py-operator\">/</span> (np<span class=\"py-operator\">.</span>linalg<span class=\"py-operator\">.</span>norm(q) <span class=\"py-operator\">*</span> np<span class=\"py-operator\">.</span>linalg<span class=\"py-operator\">.</span>norm(a))","l2 <span class=\"py-operator\">=</span> <span class=\"py-function\">float</span>(np<span class=\"py-operator\">.</span>linalg<span class=\"py-operator\">.</span>norm(q <span class=\"py-operator\">-</span> a))","<span class=\"py-function\">print</span>(<span class=\"py-string\">&#x27;</span><span class=\"py-string\">dot</span><span class=\"py-string\">&#x27;</span>, <span class=\"py-function\">round</span>(dot, <span class=\"py-number\">4</span>))          <span class=\"py-comment\"># 0.8</span>","<span class=\"py-function\">print</span>(<span class=\"py-string\">&#x27;</span><span class=\"py-string\">cosine</span><span class=\"py-string\">&#x27;</span>, <span class=\"py-function\">round</span>(cosine, <span class=\"py-number\">4</span>))    <span class=\"py-comment\"># 0.8</span>","<span class=\"py-function\">print</span>(<span class=\"py-string\">&#x27;</span><span class=\"py-string\">L2</span><span class=\"py-string\">&#x27;</span>, <span class=\"py-function\">round</span>(l2, <span class=\"py-number\">4</span>))            <span class=\"py-comment\"># 0.6325</span>"]},"table-schema":{"title":"기존 지식 테이블을 보존하는 별도 검색 테이블","lang":"sql","raw":"-- 수업용 DB에서 한 번 생성. 기존 knowledge 테이블은 수정하지 않음.\nCREATE TABLE IF NOT EXISTS day23_search_docs (\n  id integer PRIMARY KEY,\n  title text NOT NULL,\n  content text NOT NULL,\n  category text NOT NULL,\n  source_version text NOT NULL,\n  embedding_model text NOT NULL,\n  embedding vector(384) NOT NULL\n);\n-- 이미 같은 이름이 있다면 컬럼 구조를 먼저 점검합니다.\nSELECT column_name, data_type, udt_name\nFROM information_schema.columns\nWHERE table_name = 'day23_search_docs'\nORDER BY ordinal_position;","desc":"vector(384)는 차원을 검사하지만 모델 버전·본문-벡터 대응까지 알아주지 않습니다.","independent":true,"html_lines":["<span class=\"py-comment\">-- 수업용 DB에서 한 번 생성. 기존 knowledge 테이블은 수정하지 않음.</span>","<span class=\"py-keyword\">CREATE</span> <span class=\"py-keyword\">TABLE</span> <span class=\"py-keyword\">IF</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">EXISTS</span> day23_search_docs (","  id <span class=\"py-function\">integer</span> <span class=\"py-keyword\">PRIMARY</span> <span class=\"py-keyword\">KEY</span>,","  title <span class=\"py-function\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  content <span class=\"py-function\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  category <span class=\"py-function\">text</span> <span class=\"py-keyword\">NOT</span> <span class  <span class=\"py-operator\">=</span> <span class=\"py-string\">&quot;&quot;&quot;</span>","<span class=\"py-string\">INSERT INTO day23_search_docs</span>","<span class=\"py-string\">(id, title, content, category, source_version,</span>","<span class=\"py-string\"> embedding_model, embedding)</span>","<span class=\"py-string\">VALUES (</span><span class=\"py-string\">%s</span><span class=\"py-string\">, </span><span class=\"py-string\">%s</span><span class=\"py-string\">, </span><span class=\"py-string\">%s</span><span class=\"py-string\">, </span><span class=\"py-string\">%s</span><span class=\"py-string\">, </span><span class=\"py-string\">%s</span><span class=\"py-string\">, </span><span class=\"py-string\">%s</span><span class=\"py-string\">, </span><span class=\"py-string\">%s</span><span class=\"py-string\">)</span>","<span class=\"py-string\">ON CONFLICT (id) DO UPDATE SET</span>","<span class=\"py-string\">  title = EXCLUDED.title,</span>","<span class=\"py-string\">  content = EXCLUDED.content,</span>","<span class=\"py-string\">  category = EXCLUDED.category,</span>","<span class=\"py-string\">  source_version = EXCLUDED.source_version,</span>","<span class=\"py-string\">  embedding_model = EXCLUDED.embedding_model,</span>","<span class=\"py-string\">  embedding = EXCLUDED.embedding</span>","<span class=\"py-string\">&quot;&quot;&quot;</span>","conn<span class=\"py-operator\">.</span>execute(sql, (row[<span class=\"py-string\">&#x27;</span><span class=\"py-string\">id</span><span class=\"py-string\">&#x27;</span>], row[<span class=\"py-string\">&#x27;</span><span class=\"py-string\">title</span><span class=\"py-string\">&#x27;</span>], row[<span class=\"py-string\">&#x27;</span><span class=\"py-string\">content</span><span class=\"py-string\">&#x27;</span>],","                   row[<span class=\"py-string\">&#x27;</span><span class=\"py-string\">category</span><span class=\"py-string\">&#x27;</span>], row[<span class=\"py-string\">&#x27;</span><span class=\"py-string\">source_version</span><span class=\"py-string\">&#x27;</span>],","                   MODEL_ID, doc_vec))","<span class=\"py-comment\"># 실제 갱신 기준은 원문·모델 버전 등을 먼저 비교해 결정합니다.</span>"]},"topk-py":{"title":"Psycopg 3에서 질의 벡터로 Top-k 검색","lang":"python","raw":"# conn은 register_vector(conn) 등록 완료 상태\n# qvec은 같은 모델로 임베딩한 (384,) 1차원 벡터\nk = 3\nsql = \"\"\"\nSELECT id, title, content, category, source_version,\n       embedding <=> %s AS cosine_distance\nFROM day23_search_docs\nORDER BY embedding <=> %s ASC\nLIMIT %s\n\"\"\"\nrows = conn.execute(sql, (qvec, qvec, k)).fetchall()\nfor item in rows:\n    print(item[0], item[1], item[5], item[2])","desc":"같은 질의 벡터가 SELECT와 ORDER BY에서 두 번 전달됩니다. 결과는 실제 DB에서 확인합니다.","independent":false,"html_lines":["<span class=\"py-comment\"># conn은 register_vector(conn) 등록 완료 상태</span>","<span class=\"py-comment\"># qvec은 같은 모델로 임베딩한 (384,) 1차원 벡터</span>","k <span class=\"py-operator\">=</span> <span class=\"py-number\">3</span>","sql <span class=\"py-operator\">=</span> <span class=\"py-string\">&quot;&quot;&quot;</span>","<span class=\"py-string\">SELECT id, title, content, category, source_version,</span>","<span class=\"py-string\">       embedding &lt;=&gt; </span><span class=\"py-string\">%s</span><span class=\"py-string\"> AS cosine_distance</span>","<span class=\"py-string\">FROM day23_search_docs</span>","<span class=\"py-string\">ORDER BY embedding &lt;=&gt; </span><span class=\"py-string\">%s</span><span class=\"py-string\"> ASC</span>","<span class=\"py-string\">LIMIT </span><span class=\"py-string\">%s</span>","<span class=\"py-string\">&quot;&quot;&quot;</span>","rows <span class=\"py-operator\">=</span> conn<span class=\"py-operator\">.</span>execute(sql, (qvec, qvec, k))<span class=\"py-operator\">.</span>fetchall()","<span class=\"py-keyword\">for</span> item <span class=\"py-operator\">in</span> rows:","    <span class=\"py-function\">print</span>(item[<span class=\"py-number\">0</span>], item[<span class=\"py-number\">1</span>], item[<span class=\"py-number\">5</span>], item[<span class=\"py-number\">2</span>])"]},"filtered-py":{"title":"분류 필터와 거리 정렬을 함께 사용","lang":"python","raw":"category = 'development'\nk = 3\nsql = \"\"\"\nSELECT id, title, content,\n       embedding <=> %s AS distance\nFROM day23_search_docs\nWHERE category = %s\nORDER BY embedding <=> %s ASC\nLIMIT %s\n\"\"\"\nrows = conn.execute(sql, (qvec, category, qvec, k)).fetchall()\n# WHERE %s와 벡터 %s는 SQL 값 파라미터입니다.","desc":"파라미터 순서는 SQL 안의 %s 등장 순서와 일치해야 합니다.","independent":false,"html_lines":["category <span class=\"py-operator\">=</span> <span class=\"py-string\">&#x27;</span><span class=\"py-string\">development</span><span class=\"py-string\">&#x27;</span>","k <span class=\"py-operator\">=</span> <span class=\"py-number\">3</span>","sql <span class=\"py-operator\">=</span> <span class=\"py-string\">&quot;&quot;&quot;</span>","<span class=\"py-string\">SELECT id, title, content,</span>","<span class=\"py-string\">       embedding &lt;=&gt; </span><span class=\"py-string\">%s</span><span class=\"py-string\"> AS distance</span>","<span class=\"py-string\">FROM day23_search_docs</span>","<span class=\"py-string\">WHERE category = </span><span class=\"py-string\">%s</span>","<span class=\"py-string\">ORDER BY embedding &lt;=&gt; </span><span class=\"py-string\">%s</span><span class=\"py-string\"> ASC</span>","<span class=\"py-string\">LIMIT </span><span class=\"py-string\">%s</span>","<span class=\"py-string\">&quot;&quot;&quot;</span>","rows <span class=\"py-operator\">=</span> conn<span class=\"py-operator\">.</span>execute(sql, (qvec, category, qvec, k))<span class=\"py-operator\">.</span>fetchall()","<span class=\"py-comment\"># WHERE %s와 벡터 %s는 SQL 값 파라미터입니다.</span>"]},"hnsw":{"title":"HNSW 코사인 인덱스 생성과 통계 갱신","lang":"sql","raw":"-- 예시 테이블이 준비된 뒤 실행. 데이터가 적으면 필수 아님.\nCREATE INDEX IF NOT EXISTS day23_search_docs_hnsw\nON day23_search_docs\nUSING hnsw (embedding vector_cosine_ops);\nANALYZE day23_search_docs;","desc":"인덱스 생성과 실제 쿼리에서 사용되는 것은 다른 문제입니다.","independent":true,"html_lines":["<span class=\"py-comment\">-- 예시 테이블이 준비된 뒤 실행. 데이터가 적으면 필수 아님.</span>","<span class=\"py-keyword\">CREATE</span> <span class=\"py-keyword\">INDEX</span> <span class=\"py-keyword\">IF</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">EXISTS</span> day23_search_docs_hnsw","<span class=\"py-keyword\">ON</span> day23_search_docs","<span class=\"py-keyword\">USING</span> hnsw (embedding vector_cosine_ops);","<span class=\"py-keyword\">ANALYZE</span> day23_search_docs;"]},"explain-real":{"title":"384차원 검색 계획을 Python에서 관찰","lang":"python","raw":"# qvec: (384,) NumPy 벡터 / conn: 등록된 연결\nplan = conn.execute('''EXPLAIN (ANALYZE, BUFFERS)\nSELECT id FROM day23_search_docs\nORDER BY embedding <=> %s ASC LIMIT %s\n''', (qvec, 3)).fetchall()\nfor line, in plan:\n    print(line)\n# Seq Scan도 작은 테이블에서는 정상적인 계획일 수 있습니다.","desc":"EXPLAIN ANALYZE는 SELECT를 실제로 실행합니다. 비용(cost)과 시간(ms)은 다른 값입니다.","independent":false,"html_lines":["<span class=\"py-comment\"># qvec: (384,) NumPy 벡터 / conn: 등록된 연결</span>","plan <span class=\"py-operator\">=</span> conn<span class=\"py-operator\">.</span>execute(<span class=\"py-string\">&#x27;&#x27;&#x27;</span><span class=\"py-string\">EXPLAIN (ANALYZE, BUFFERS)</span>","<span class=\"py-string\">SELECT id FROM day23_search_docs</span>","<span class=\"py-string\">ORDER BY embedding &lt;=&gt; </span><span class=\"py-string\">%s</span><span class=\"py-string\"> ASC LIMIT </span><span class=\"py-string\">%s</span>","<span class=\"py-string\">&#x27;&#x27;&#x27;</span>, (qvec, <span class=\"py-number\">3</span>))<span class=\"py-operator\">.</span>fetchall()","<span class=\"py-keyword\">for</span> line, <span class=\"py-operator\">in</span> plan:","    <span class=\"py-function\">print</span>(line)","<span class=\"py-comment\"># Seq Scan도 작은 테이블에서는 정상적인 계획일 수 있습니다.</span>"]},"read-result":{"title":"검색 결과를 Context 후보로 변환","lang":"python","raw":"# rows는 앞의 Top-k SQL이 반환한 실제 조회 결과\n# 자동 정답 판정이나 GPT API 호출은 아직 하지 않습니다.\nretrieved = [\n    {'id': int(item[0]), 'title': item[1],\n     'content': item[2], 'category': item[3],\n     'source_version': item[4], 'distance': float(item[5])}\n    for item in rows\n]\nfor hit in retrieved:\n    print(hit['id'], hit['title'], hit['content'])\n# 후속 RAG: 검토·선택한 항목만 context_json에 포함합니다.","desc":"rows는 거리 열이 6번째인 필터 없는 Top-k 결과를 가정합니다. 필터 쿼리와 섞지 않습니다.","independent":false,"html_lines":["<span class=\"py-comment\"># rows는 앞의 Top-k SQL이 반환한 실제 조회 결과</span>","<span class=\"py-comment\"># 자동 정답 판정이나 GPT API 호출은 아직 하지 않습니다.</span>","retrieved <span class=\"py-operator\">=</span> [","    {<span class=\"py-string\">&#x27;</span><span class=\"py-string\">id</span><span class=\"py-string\">&#x27;</span>: <span class=\"py-function\">int</span>(item[<span class=\"py-number\">0</span>]), <span class=\"py-string\">&#x27;</span><span class=\"py-string\">title</span><span class=\"py-string\">&#x27;</span>: item[<span class=\"py-number\">1</span>],","     <span class=\"py-string\">&#x27;</span><span class=\"py-string\">content</span><span class=\"py-string\">&#x27;</span>: item[<span class=\"py-number\">2</span>], <span class=\"py-string\">&#x27;</span><span class=\"py-string\">category</span><span class=\"py-string\">&#x27;</span>: item[<span class=\"py-number\">3</span>],","     <span class=\"py-string\">&#x27;</span><span class=\"py-string\">source_version</span><span class=\"py-string\">&#x27;</span>: item[<span class=\"py-number\">4</span>], <span class=\"py-string\">&#x27;</span><span class=\"py-string\">distance</span><span class=\"py-string\">&#x27;</span>: <span class=\"py-function\">float</span>(item[<span class=\"py-number\">5</span>])}","    <span class=\"py-keyword\">for</span> item <span class=\"py-operator\">in</span> rows","]","<span class=\"py-keyword\">for</span> hit <span class=\"py-operator\">in</span> retrieved:","    <span class=\"py-function\">print</span>(hit[<span class=\"py-string\ ;overflow-wrap:anywhere}\n\n/* Scoped Day23 captions only; the original summary stylesheet is unchanged. */\n.d23-summary-table{border-collapse:collapse;width:100%;font-size:16px;margin:18px 0}\n.d23-summary-table th,.d23-summary-table td{padding:15px 18px;border-bottom:1px solid var(--line);text-align:left;line-height:1.7}\n.d23-summary-table th{background:var(--pale);font-weight:750;color:var(--navy)}\n.d23-summary-code{background:var(--navy);color:#f3f7fb;border-radius:10px;padding:19px 25px;overflow-x:auto;white-space:pre-wrap;font:15px/1.7 Consolas,'D2Coding',monospace}\n.d23-flow-title{font-size:15px;font-weight:700;color:var(--blue);margin:12px 0 9px}\n@media(max-width:800px){.d23-summary-table{font-size:13px}.d23-summary-table th,.d23-summary-table td{padding:10px}.d23-summary-code{font-size:12px}}\n</style></head><body><header class=\"review-top\"><div><div class=\"tag\">DAY 23 · 핵심요약</div><h1>Embedding · pgvector</h1><p>질문에서 필요한 자료를 찾는 Retriever의 기본 구조</p></div><button class=\"review-print\" type=\"button\" onclick=\"window.print()\">인쇄</button></header><main>\n<section class=\"sheet\" id=\"review-flow\"><div class=\"sheet-heading\"><span class=\"sheet-number\">01</span><h2>전체 흐름: 검색으로 필요한 지식을 찾는다</h2></div>\n<p class=\"definition\">16일은 <b>Context 선택·출력 계약</b>, 17일은 <b>LLM API 호출</b>, 18일은 <b>지식 검색(Retrieval)</b>입니다. 오늘은 검색된 원문 후보를 반환하고, RAG의 생성 연결은 후속 차시에 합니다.</p>\n<figure aria-label=\"사용자 질문에서 문장 임베딩, pgvector 검색, 원문 후보, 이후 문맥과 모델 호출로 이어지는 흐름\"><div class=\"flow-labels\"><span>입력</span><span class=\"input-range\">오늘의 검색</span><span class=\"model-range\">반환</span><span class=\"output-range\">이후 연결</span></div>\n<div class=\"flow\" style=\"--n:6\"><div class=\"flow-node\"><strong>질문</strong><span>검색할 정보</span></div><div class=\"flow-node today\"><strong>Embedding</strong><span>query: 입력<br>384차원</span></div><div class=\"flow-node today\"><strong>pgvector</strong><span>거리 계산<br>Top-k</span></div><div class=\"flow-node today\"><strong>원문 후보</strong><span>ID · 본문<br>관련성 확인</span></div><div class=\"flow-node primary\"><strong>Context</strong><span>선택한 근거</span></div><div class=\"flow-node human\"><strong>LLM·검증</strong><span>17일의 호출<br>16일의 검사</span></div></div>\n<figcaption>오늘의 범위는 검색으로 ID와 원문 후보를 반환하는 단계까지입니다. 높은 점수만으로 정답·전달 권한·근거 적합성을 확정하지 않습니다.</figcaption></figure>\n<div class=\"three-col\"><div class=\"inline-def\"><b>자료 준비</b><p>원문·ID → passage: Embedding → PostgreSQL 저장</p></div><div class=\"inline-def\"><b>질문 처리</b><p>질문 → query: Embedding → Top-k 원문 반환</p></div><div class=\"inline-def\"><b>다음 수업</b><p>문서 Parsing·Chunking·Metadata → RAG 연결</p></div></div><div class=\"lesson\"><strong>Embedding은 후보를 찾고, 원문이 질문에 도움이 되는지는 별도로 판단합니다.</strong></div></section>\n<section class=\"sheet\" id=\"review-vectors\"><div class=\"sheet-heading\"><span class=\"sheet-number\">02</span><h2>Vector · Similarity · Distance</h2></div><p class=\"definition\">문장을 <b>벡터</b>로 표현하면 숫자로 가까움을 비교할 수 있습니다. 이번 모델의 384차원은 숫자 384개라는 뜻이지, 384글자 또는 384개 정답이 아닙니다.</p>\n<table class=\"d23-summary-table\"><thead><tr><th>척도</th><th>뜻</th><th>가까운 순서</th></tr></thead><tbody><tr><td><b>Cosine similarity</b></td><td>두 벡터 방향의 유사도</td><td>큰 값 우선</td></tr><tr><td><b>Cosine distance</b></td><td>1 − Cosine similarity</td><td>작은 값 우선</td></tr><tr><td><b>Dot Product</b></td><td>좌표별 곱의 합, 벡터 길이 영향 가능</td><td>큰 값 우선</td></tr><tr><td><b>L2 distance</b></td><td>두 점 사이의 유클리드 거리</td><td>작은 값 우선</td></tr></tbody></table>\n<div class=\"two-col\"><div class=\"inline-def\"><b>정규화</b><p>벡터를 길이 1로 맞춥니다. 영벡터에는 코사인 유사도를 정의할 수 없습니다.</p></div><div class=\"inline-def\"><b>주의</b><p>Cosine 0.8은 정답 확률 80%가 아닙니다. 같은 차원만으로 서로 다른 모델의 벡터를 섞지 않습니다.</p></div></div><div class=\"lesson\"><strong>같은 Embedding 계약의 벡터를, 같은 거리 기준으로 비교합니다.</strong></div></section>\n<section class=\"sheet\" id=\"review-embedding\"><div class=\"sheet-heading\"><span class=\"sheet-number\">03</span><h2>Sentence Transformers: 질문과 지식의 역할 구분</h2></div><p class=\"definition\">교육용 후보인 <b>intfloat/multilingual-e5-small</b>은 384차원 벡터를 출력합니다. 검색용 입력에는 모델 지침에 따라 <code>query: </code>와 <code>passage: </code> 접두어를 구분합니다.</p>\n<div class=\"two-col\"><div class=\"inline-def\"><b>질문</b><p><code>query: 파일은 어디에 보관하나요?</code><br>질의 벡터를 만듭니다.</p></div><div class=\"inline-def\"><b>지식 원문</b><p><code>passage: 실습 파일은 개인 폴더에 보관합니다.</code><br>사전 준비할 문서 벡터입니다.</p></div></div>\n<table class=\"d23-summary-table\"><tbody><tr><th>기록할 것</th><td>모델 ID·revision, 입력 규칙, 벡터 차원·정규화, 원문 버전</td></tr><tr><th>바뀌면?</th><td>모델·입력 계약 변경 시 문서와 질의 벡터를 함께 재생성하고 검증</td></tr><tr><th>실습 원칙</th><td>기존 가상환경 재사용 · Python 패키지는 필요한 것만 설치 · CPU 우선</td></tr></tbody></table><div class=\"lesson\"><strong>오늘의 encode는 모델 가중치를 다시 학습하지 않고 Embedding을 계산합니다.</strong></div></section>\n<section class=\"sheet\" id=\"review-install\"><div class=\"sheet-heading\"><span class=\"sheet-number\">04</span><h2>Windows 11 · PostgreSQL 18.6 · pgvector 설치</h2></div><p class=\"definition\">강사와 수강생의 공통 환경은 <b>Windows 11·PostgreSQL 18.6 x64·VS Code·Git Bash</b>입니다. Docker/WSL 없이 기존 PostgreSQL에 확장을 추가합니다.</p>\n<div class=\"flow\" style=\"--n:4\"><div class=\"flow-node today\"><strong>서버 파일</strong><span>MSVC·Build Tools<br>pgvector 빌드</span></div><div class=\"flow-node today\"><strong>DB 활성화</strong><span>pgAdmin<br>CREATE EXTENSION</span></div><div class=\"flow-node today\"><strong>SQL 확인</strong><span>vector(3)<br>거리 계산</span></div><div class=\"flow-node today\"><strong>Python 연결</strong><span>기존 venv<br>register_vector</span></div></div>\n<p class=\"d23-flow-title\">실행하는 프로그램이 다릅니다</p><table class=\"d23-summary-table\"><thead><tr><th>작업</th><th>실행 위치</th><th>핵심 확인</th></tr></thead><tbody><tr><td>소스 빌드·확장 파일 배치</td><td>x64 Native Tools Command Prompt (관리자)</td><td>vector.dll · vector.control · SQL 파일</td></tr><tr><td>확장 활성화</td><td>pgAdmin Query Tool</td><td>pg_extension의 extversion</td></tr><tr><td>Python 패키지 설치</td><td>VS Code · Git Bash · 기존 가상환경</td><td>import 및 pip check</td></tr></tbody></table>\n<pre class=\"d23-summary-code\">-- 현재 데이터베이스에서 실행\nCREATE EXTENSION IF NOT EXISTS vector;\nSELECT extname, extversion FROM pg_extension WHERE extname = 'vector';\nSELECT '[1,0,0]'::vector &lt;=&gt; '[0,1,0]'::vector AS cosine_distance;</pre><p class=\"subtle\">설치 버전 `v0.8.7`은 수업용 후보입니다. 실제 서버 확장 버전과 설치 성공은 각 PC에서 조회·검증해야 합니다.</p><div class=\"lesson\"><strong>Python용 pgvector를 pip로 설치해도 PostgreSQL 서버 확장 설치가 자동으로 끝나지는 않습니다.</strong></div></section>\n<section class=\"sheet\" id=\"review-search\"><div class=\"sheet-heading\"><span class=\"sheet-number\">05</span><h2>Exact Top-k · Metadata · HNSW</h2></div><p class=\"definition\"><b>Top-k</b>는 질문과 가까운 후보를 최대 k개 반환합니다. 이번 SQL의 <code>&lt;=&gt;</code>는 Cosine distance이므로 값이 <b>작은 순서(ASC)</b>로 검색합니다.</p>\n<pre class=\"d23-summary-code\">SELECT id, title, content,\n       embedding &lt;=&gt; %s AS distance\nFROM day23_search_docs\nORDER BY embedding &lt;=&gt; %s ASC\nLIMIT %s;</pre>\n<div class=\"three-col\"><div class=\"inline-def\"><b>Exact Search</b><p>전체 후보를 비교하는 정확 검색 기준선입니다.</p></div><div class=\"inline-def\"><b>HNSW</b><p>근사 검색을 위한 그래프 인덱스입니다. 기준선 후보를 놓칠 수 있습니다.</p></div><div class=\"inline-def\"><b>EXPLAIN</b><p>쿼리 계획을 확인합니다. 작은 테이블에서 Seq Scan도 정상일 수 있습니다.</p></div></div>\n<div class=\"lesson\"><strong>인덱스 생성 성공, 실제 인덱스 사용, 검색 품질 향상은 서로 다른 검증입니다.</strong></div></section>\n<section class=\"sheet\" id=\"review-evaluation\"><div class=\"sheet-heading\"><span class=\"sheet-number\">06</span><h2>Retrieval 결과와 RAG 연결</h2></div><p class=\"definition\">검색 결과가 존재한다는 사실과, 질문에 답할 수 있다는 판단은 다릅니다. <b>검색 순위 → 원문 확인 → 필요한 사실 확인</b>를 구분해 판단합니다.</p>\n<div class=\"two-col\"><div class=\"question-card\"><h3>“파일은 어디에 보관하나요?”</h3><p>지식 101에 위치 정보가 있습니다. 적절한 근거 후보입니다.</p><code>source ID: 101</code></div><div class=\"question-card missing\"><h3>“파일은 몇 년 보관하나요?”</h3><p>지식 101에는 기간이 없습니다. 유사한 후보를 찾았어도 답의 사실이 부족합니다.</p><code>insufficient_context 검토 필요</code></div></div>\n<table class=\"d23-summary-table\"><thead><tr><th>날짜</th><th>단계</th><th>결과</th></tr></thead><tbody><tr><td>11/16</td><td>Prompt·Context·검증</td><td>답변 가능한 범위와 출력 계약</td></tr><tr><td>11/17</td><td>LLM Client</td><td>실제 생성 요청·응답 상태·사용량</td></tr><tr><td><b>11/18</b></td><td><b>Embedding·pgvector</b></td><td><b>지식 ID·원문을 찾는 검색기</b></td></tr><tr><td>11/19~20</td><td>Chunking·RAG</td><td>문서 인덱싱과 검색 결과의 답변 연결</td></tr></tbody></table><div class=\"lesson\"><strong>18일의 산출물은 ‘검색 모듈’입니다. GPT를 연결해 최종 답변을 생성하는 것은 다음 차시입니다.</strong></div></section>\n</main><footer class=\"review-footer\">한로 강민준 · Day23 Embedding · pgvector</footer></body></html>";

function vectorSVG(v){const w=570,h=316,cx=270,cy=160,scale=92, tx=cx+v.x*scale,ty=cy-v.y*scale;return `<svg class="d23-vector-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="설명용 2차원 벡터. q=(1,0), A=(${fmt(v.x)},${fmt(v.y)})"><defs><marker id="d23varr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#326d9f"/></marker><marker id="d23qarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2d816f"/></marker></defs><path d="M30 ${cy} H540 M${cx} 10 V300" stroke="#a8bbcf" stroke-width="1.7"/><text x="540" y="${cy-8}" fill="#617993">x</text><text x="${cx+10}" y="18" fill="#617993">y</text>${[-2,-1,1,2].map(a=>`<text x="${cx+a*scale}" y="${cy+20}" fill="#8899a9" text-anchor="middle" font-size="12">${a}</text>`).join('')}<line x1="${cx}" y1="${cy}" x2="${cx+scale}" y2="${cy}" stroke="#2d816f" stroke-width="5" marker-end="url(#d23qarr)"/><line x1="${cx}" y1="${cy}" x2="${tx}" y2="${ty}" stroke="#326d9f" stroke-width="5" marker-end="url(#d23varr)"/><circle cx="${tx}" cy="${ty}" r="6" fill="#326d9f"/><text x="${Math.min(520,tx+15)}" y="${Math.max(22,ty-14)}" fill="#244b78" font-size="18" font-weight="700">A</text><text x="${cx+scale+12}" y="${cy+24}" fill="#2d816f" font-size="18" font-weight="700">q</text><text x="${cx+10}" y="${cy+22}" fill="#64778b" font-size="12">0</text></svg>`;}
