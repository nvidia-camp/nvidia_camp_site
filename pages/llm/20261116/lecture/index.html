all;overflow-wrap:anywhere}\n</style></head><body><header class=\"review-top\">\n  <div><div class=\"tag\">DAY 21 · 핵심요약</div><h1>Prompt · Context Engineering</h1><p>지시와 문맥을 설계하고, 응답을 검증하며 개선한다.</p></div>\n  <button class=\"review-print\" type=\"button\" onclick=\"window.print()\">인쇄</button>\n</header>\n<main>\n<section class=\"sheet\" id=\"review-flow\" aria-labelledby=\"r1-title\" data-source-pages=\"3,11,15,38,82\">\n  <div class=\"sheet-heading\"><span class=\"sheet-number\">01</span><h2 id=\"r1-title\">전체 흐름: 입력을 만들고, 결과를 확인한다</h2></div>\n  <p class=\"definition\">오늘 다루는 것은 <b>LLM을 새로 학습하는 일</b>이 아니라, <b>모델 호출 전의 입력 설계와 호출 후의 출력 확인</b>입니다.</p>\n  <figure aria-label=\"질문을 받아 문맥을 선택하고 Prompt로 조립한 뒤 응답의 형식과 근거를 확인하는 흐름\">\n    <div class=\"flow-labels\" aria-hidden=\"true\"><span>서비스 입구</span><span class=\"input-range\">입력 설계</span><span class=\"model-range\">생성</span><span class=\"output-range\">출력 확인</span></div>\n    <div class=\"flow\" style=\"--n:6\">\n      <div class=\"flow-node\"><strong>질문</strong><span>무엇을<br>알고 싶은가?</span></div>\n      <div class=\"flow-node today\"><strong>Context</strong><span>필요한<br>자료 선택</span></div>\n      <div class=\"flow-node today\"><strong>Prompt</strong><span>지시·질문·자료<br>입력 조립</span></div>\n      <div class=\"flow-node primary\"><strong>LLM 응답</strong><span>검사할<br>결과 생성</span></div>\n      <div class=\"flow-node today\"><strong>자동 검사</strong><span>문법·구조<br>참조·상태</span></div>\n      <div class=\"flow-node human\"><strong>근거 대조</strong><span>질문·답·원문을<br>사람이 확인</span></div>\n    </div>\n    <div class=\"evaluation-band\"><b>A/B 평가 → 입력 개선</b><span>여러 실행의 조건·응답·실패 기록을 모아 비교합니다.</span></div>\n    <figcaption>실행 흐름과 평가 흐름을 구분합니다. A/B 평가는 매 요청이 반드시 통과하는 직렬 처리 단계가 아닙니다.</figcaption>\n  </figure>\n  <div class=\"three-col\">\n    <div class=\"inline-def\"><b>지시</b><p>무엇을 하고, 무엇을 하지 말아야 하는가?</p></div>\n    <div class=\"inline-def\"><b>문맥</b><p>이번 답변에 실제로 어떤 정보를 넣는가?</p></div>\n    <div class=\"inline-def\"><b>검증</b><p>형식이 맞고, 답을 뒷받침하는 근거가 있는가?</p></div>\n  </div>\n  <p class=\"scope-line\">이 교안은 직접 관찰한 모델 응답이나 미리 작성한 샘플을 사용합니다. 실제 API·검색·Agent 도구 실행은 후속 연결 영역입니다.</p>\n  <div class=\"lesson\"><strong>좋은 입력을 만드는 일과, 나온 답을 확인하는 일은 함께 필요합니다.</strong></div>\n</section>\n\n<section class=\"sheet\" id=\"review-prompt\" aria-labelledby=\"r2-title\" data-source-pages=\"17,18,19,20,21,24,25,27,47\">\n  <div class=\"sheet-heading\"><span class=\"sheet-number\">02</span><h2 id=\"r2-title\">Prompt: 무엇을 어떻게 수행할지 전달하는 입력</h2></div>\n  <p class=\"definition\"><b>Prompt</b>에는 지시뿐 아니라 질문·자료·예제·출력 조건을 담을 수 있습니다. <b>Prompt Engineering</b>은 성공 기준을 지시로 표현하고, 결과를 비교하며 개선하는 과정입니다.</p>\n  <figure aria-label=\"역할, 작업, 입력, 제약, 실패, 출력의 여섯 요소로 Prompt를 설계하고 고정 규칙과 요청별 값을 합치는 그림\">\n    <div class=\"six-slots\">\n      <div class=\"slot\"><b>역할</b><span>누구를 돕는가?</span></div><div class=\"slot\"><b>작업</b><span>무엇을 수행하는가?</span></div><div class=\"slot\"><b>입력</b><span>무엇을 읽는가?</span></div>\n      <div class=\"slot\"><b>제약</b><span>어디까지 답하는가?</span></div><div class=\"slot\"><b>실패</b><span>근거가 없으면?</span></div><div class=\"slot\"><b>출력</b><span>어떤 형식으로 돌려주는가?</span></div>\n    </div>\n    <div class=\"assembly\" style=\"margin-top:18px\">\n      <div class=\"assembly-box\"><b>고정된 템플릿</b><span>작업·범위·실패 기준·출력 계약</span></div><div class=\"operator plus\" aria-hidden=\"true\">+</div>\n      <div class=\"assembly-box\"><b>요청마다 바뀌는 값</b><span>이번 질문 + 선택한 지식</span></div><div class=\"operator\" aria-hidden=\"true\">→</div>\n      <div class=\"assembly-box result\"><b>완성된 Prompt</b><span>모델에 전달할 입력</span></div>\n    </div>\n    <figcaption>여섯 요소는 이 교안의 설계 틀입니다. 참고 자료 안의 문장을 앱의 실행 지시와 혼동하지 않습니다.</figcaption>\n  </figure>\n  <div class=\"shot-compare\">\n    <div><b>Zero-shot</b>입력→출력 예제 없이 작업과 기준을 설명합니다.</div>\n    <div><b>Few-shot</b>입력→바람직한 출력 예제를 함께 줍니다. 예제의 출처 ID를 본 질문에 복사하지 않습니다.</div>\n  </div>\n  <p class=\"subtle\" style=\"margin-top:13px\">예제를 넣어도 모델 가중치를 학습하는 것은 아닙니다. 더 길거나 예제가 많다고 항상 더 좋은 것은 아닙니다.</p>\n  <div class=\"lesson\">핵심은 문장의 화려함이 아니라 <strong>성공·실패를 확인할 수 있는 요청</strong>입니다.</div>\n</section>\n\n<section class=\"sheet\" id=\"review-context\" aria-labelledby=\"r3-title\" data-source-pages=\"5,16,32,34,38,39,40,41,42,43\">\n  <div class=\"sheet-heading\"><span class=\"sheet-number\">03</span><h2 id=\"r3-title\">Context: 이번 답변에 실제로 제공한 정보</h2></div>\n  <p class=\"definition\"><b>Context Engineering</b>은 필요한 정보를 고르고 배치하며 출처·유효성·길이를 관리하는 일입니다. 여기서는 그중 <b>이번 요청에 선택해 넣은 지식</b>을 다룹니다.</p>\n  <figure aria-label=\"저장된 지식 세 건에서 101만 선택해 이번 문맥에 넣는 과정\">\n    <div class=\"knowledge-flow\">\n      <div class=\"knowledge-stack\"><div class=\"knowledge-item chosen\"><b>101</b><span>파일 보관</span></div><div class=\"knowledge-item muted\"><b>102</b><span>서버 실행</span></div><div class=\"knowledge-item muted\"><b>103</b><span>질문 작성</span></div></div>\n      <div class=\"operator\" aria-hidden=\"true\">→</div><div class=\"selection\"><strong>[101]</strong><p>질문에 필요한 자료 선택<br>ID·본문·순서 보존</p></div>\n      <div class=\"operator\" aria-hidden=\"true\">→</div><div class=\"knowledge-content\"><div class=\"mini-title\">이번에 전달한 근거</div><p>“실습 파일은<br>개인 폴더에 보관합니다.”</p></div>\n    </div>\n    <figcaption>101~103은 교안의 지식 ID입니다. DB에 존재하는 것 ≠ 이번에 전달한 것. 선택할 때 관련성·전달 권한·유효한 버전·길이를 확인합니다.</figcaption>\n  </figure>\n  <div class=\"question-pair\">\n    <div class=\"question-card\"><h3>“어디에 보관하나요?”</h3><p>필요한 사실은 <b>위치</b>입니다. 101의 본문에 있으므로 답과 출처를 제시합니다.</p><code>answered · source_ids: [101]</code></div>\n    <div class=\"question-card missing\"><h3>“몇 년 보관하나요?”</h3><p>필요한 사실은 <b>기간</b>입니다. 본문에 없으므로 추측하지 않고 부족한 정보를 적습니다.</p><code>insufficient_context · source_ids: []</code></div>\n  </div>\n  <div class=\"budget-strip\" role=\"img\" aria-label=\"문맥 공간은 지시, 질문, 예제, 근거뿐 아니라 출력용 공간과 여유까지 나누어 사용한다. 칸의 너비는 실제 비율이 아니다.\"><span>입력: 지시·질문·예제·근거</span><span>출력용 공간</span><span>여유</span></div>\n  <p class=\"subtle\" style=\"margin-top:8px\"><b>Context Window</b>는 한 번의 생성에서 다룰 문맥 길이의 한도입니다. 출력 공간도 남깁니다. 위 칸의 너비는 실제 비율이 아닙니다.</p>\n  <div class=\"lesson\"><strong>자료를 많이 넣는 것보다, 필요한 사실이 실제로 들어 있는지가 중요합니다.</strong></div>\n</section>\n\n<section class=\"sheet\" id=\"review-validation\" aria-labelledby=\"r4-title\" data-source-pages=\"7,8,56,57,58,59,60,61,62,63,88\">\n  <div class=\"sheet-heading\"><span class=\"sheet-number\">04</span><h2 id=\"r4-title\">출력 계약과 검증: 형식과 내용은 따로 확인한다</h2></div>\n  <p class=\"definition\"><b>출력 계약(Output Contract)</b>은 응답이 따라야 할 필드·자료형·상태별 규칙입니다. <b>검증</b>은 실제 응답이 정한 규칙과 근거에 맞는지 확인하는 과정입니다.</p>\n  <div class=\"contract-row\">\n    <div class=\"contract-card\"><div class=\"mini-title\">답변 가능 상태의 작성 예시</div><pre>{\n  \"status\": \"answered\",\n  \"answer\": \"개인 폴더에 보관합니다.\",\n  \"source_ids\": [101],\n  \"missing_information\": \"\"\n}</pre></div>\n    <dl class=\"contract-defs\"><dt>JSON</dt><dd>데이터를 표현하는 텍스트 형식</dd><dt>Schema</dt><dd>허용할 필드·자료형을 기술한 명세</dd><dt>Pydantic</dt><dd>Python에서 데이터 구조를 선언하고 검사</dd><dt>정보 부족</dt><dd><code>status: insufficient_context</code><br>출처는 <code>[]</code>, 필요한 정보의 이름을 기록<br>답은 “제공된 지식으로는 답할 수 없습니다.”</dd></dl>\n  </div>\n  <figure class=\"gate-flow\" aria-label=\"JSON 문법, Schema 구조, 참조 및 상태 규칙을 자동 검사한 다음 사람의 근거 검토를 수행한다\">\n    <div class=\"flow\" style=\"--n:4\">\n      <div class=\"flow-node\"><span class=\"gate-index\">1 · 문법</span><strong>JSON으로 읽히는가?</strong><span>괄호·따옴표 등</span></div>\n      <div class=\"flow-node\"><span class=\"gate-index\">2 · 구조</span><strong>계약에 맞는가?</strong><span>필수 필드·자료형</span></div>\n      <div class=\"flow-node\"><span class=\"gate-index\">3 · 규칙</span><strong>참조·상태가 맞는가?</strong><span>이번에 전달한 ID·필드 조합</span></div>\n      <div class=\"flow-node human\"><span class=\"gate-index\">4 · 내용</span><strong>원문이 답을 뒷받침하는가?</strong><span>질문·주장·인용 대조</span></div>\n    </div>\n    <div class=\"gate-group-label\"><span>앞의 세 단계: 자동 검사</span><span>마지막 단계: 사람의 근거 검토</span></div>\n  </figure>\n  <div class=\"counterexample\"><p><b>반례</b> · 101·102·103을 전달하고, 서버 실행 위치에 “프로젝트 폴더”라고 답하면서 <b>101</b>을 인용했습니다.</p><p><span class=\"pass-tag\">제공 ID이므로 참조 검사 통과</span> → <span class=\"fail-tag\">101은 파일 보관 자료이므로 근거 불일치</span></p></div>\n  <div class=\"lesson\"><strong>자동 검사 통과 ≠ 답의 정확성.</strong> 출처 ID가 존재하는 것과, 그 본문이 답을 뒷받침하는 것은 별개입니다.</div>\n</section>\n\n<section class=\"sheet\" id=\"review-retry\" aria-labelledby=\"r5-title\" data-source-pages=\"9,66,67,68,69,70,71\">\n  <div class=\"sheet-heading\"><span class=\"sheet-number\">05</span><h2 id=\"r5-title\">재시도: 원인을 나누고, 멈출 조건을 둔다</h2></div>\n  <p class=\"definition\"><b>재시도</b>는 응답을 다시 요청하는 일입니다. 이번 교안에서는 <b>JSON·Schema 형식 오류만 한 번 수정 요청</b>하며, 모든 실패를 반복하지 않습니다.</p>\n  <figure class=\"branch-map\" aria-label=\"정상 응답은 생성 종료 후 근거 검토, 형식 오류는 한 번 수정 후 재검사, 참조 및 상태 위반은 중단하는 분기\">\n    <div class=\"branch-root\">자동 검사 결과</div>\n    <div class=\"branches\">\n      <div class=\"branch normal\"><div class=\"branch-condition\"><b>정상 답 / 정상 정보 부족</b><span>자동 규칙을 통과한 응답</span></div><div class=\"operator\" aria-hidden=\"true\">→</div><div class=\"branch-result\"><b>생성 종료 → 근거 검토</b><span>정보 부족 판단의 적절성도 확인</span></div></div>\n      <div class=\"branch repair\"><div class=\"branch-condition\"><b>JSON·Schema 오류</b><span>문법·필드·자료형 문제</span></div><div class=\"operator\" aria-hidden=\"true\">→</div><div class=\"branch-result\"><b>수정 1회 → 다시 검사</b><span>통과하면 검토, 다시 실패하면 중단</span></div></div>\n      <div class=\"branch stop\"><div class=\"branch-condition\"><b>출처·상태 규칙 위반</b><span>없는 출처·모순된 조합</span></div><div class=\"operator\" aria-hidden=\"true\">→</div><div class=\"branch-result\"><b>자동 재생성 없이 중단</b><span>문맥과 규칙을 다시 점검</span></div></div>\n    </div>\n  </figure>\n  <div class=\"attempt-strip\"><b>최초 응답 1회</b><span>+</span><b>형식 수정 1회</b><span>=</span><strong>최대 2회</strong></div>\n  <div class=\"two-col\" style=\"margin-top:22px\">\n    <div class=\"inline-def\"><b>수정할 때 유지할 것</b><p>같은 질문·문맥·출력 계약. 확인된 오류만 요약하고 최초·수정 응답을 따로 기록합니다.</p></div>\n    <div class=\"inline-def\"><b>자료가 부족할 때</b><p>답이 나올 때까지 반복하지 않습니다. 자료가 부족하다는 응답도 정상적인 종료 결과입니다.</p></div>\n  </div>\n  <div class=\"lesson\"><strong>형식은 고칠 수 있어도, 재시도가 없는 근거를 만들어 주지는 않습니다.</strong></div>\n</section>\n\n<section class=\"sheet\" id=\"review-evaluation\" aria-labelledby=\"r6-title\" data-source-pages=\"10,27,28,47,48,49,50,51,52,53\">\n  <div class=\"sheet-heading\"><span class=\"sheet-number\">06</span><h2 id=\"r6-title\">A/B 평가: 한 가지를 바꾸고 같은 기준으로 비교한다</h2></div>\n  <p class=\"definition\"><b>A/B 비교</b>는 두 입력 설계의 차이를 관찰하는 실험입니다. 개선안이 좋아 보이는지는 가설이고, <b>실제 결과와 실패 기록</b>으로 판단합니다.</p>\n  <figure aria-label=\"질문, 문맥, 표시된 모델명, 출력 계약, 채점 기준을 고정하고 Prompt의 규칙 한 개만 바꾸어 A와 B를 비교하는 그림\">\n    <div class=\"ab-common\"><b>공통 조건 고정</b>같은 질문 · 문맥 · 표시된 모델명 · 출력 계약 · 채점 기준</div>\n    <div class=\"ab-fork\" aria-hidden=\"true\"></div>\n    <div class=\"ab-variants\"><div class=\"variant\"><span class=\"letter\">A</span><div><p>기준 지시문</p><small>현재 버전의 규칙</small></div></div><div class=\"variant changed\"><span class=\"letter\">B</span><div><p>A + 근거 부족 규칙 한 개</p><small>그 외 문맥·예제·실행 조건은 같게</small></div></div></div>\n    <div class=\"compare-result\">첫 응답 원문 보존 → 형식·참조 검사 → 사람의 근거 평가 → 차이와 한계 기록</div>\n  </figure>\n  <div class=\"flow eval-order\" style=\"--n:3\" role=\"group\" aria-label=\"개선용 D 세트로 고친 다음 Prompt 버전을 고정하고 최종 확인용 H 세트로 확인한다\">\n    <div class=\"flow-node\"><strong>Development (D)</strong><span>개선용 질문으로 수정</span></div><div class=\"flow-node primary\"><strong>Prompt 버전 고정</strong><span>비교 조건도 함께 보존</span></div><div class=\"flow-node human\"><strong>Holdout (H)</strong><span>남겨 둔 질문으로 최종 확인</span></div>\n  </div>\n  <p class=\"record-note\"><b>A/B는 Prompt 버전, D/H는 질문 묶음의 용도입니다.</b> D·H는 Development·Holdout의 첫 글자이며, D01은 개선용 질문 1번입니다. 같은 질문으로만 고치고 확인하지 않도록 두 묶음을 나눕니다.</p>\n  <div class=\"two-col\">\n    <div class=\"inline-def\"><b>실제 모델 응답 ≠ Fixture</b><p><code>manual_chat</code>은 실제 모델 출력의 관찰, <code>fixture</code>는 작성한 샘플로 검사기를 확인한 결과입니다. 두 종류의 결과는 따로 기록합니다.</p></div>\n    <div class=\"inline-def\"><b>분모와 상태를 보존</b><p>실패·미실행·미평가를 숨기지 않습니다. 첫 응답과 재시도 후 평가 결과도 따로 봅니다.</p></div>\n  </div>\n  <p class=\"record-note\">N은 한 Prompt 버전에서 비교 대상으로 정한 첫 응답 수입니다. 사람의 근거 평가는 실제 평가한 수를 분모로 씁니다. Holdout 결과로 다시 고쳤다면 새 버전·새 확인 질문이 필요합니다. 이 교안의 Holdout은 공개된 교육용 묶음입니다.</p>\n  <div class=\"lesson\"><strong>B가 반드시 이겨야 하는 것이 아닙니다.</strong> 어떤 오류가 줄고 새로 생겼는지 설명합니다.</div>\n</section>\n</main>\n<footer class=\"review-footer\">한로 강민준 · Day21 Prompt·Context Engineering</footer>\n</body></html>";
const DAY21_EDITOR_LINES={"placeholder": ["<span class=\"py-keyword\">from</span> <span class=\"py-variable\">string</span> <span class=\"py-keyword\">import</span> <span class=\"py-type\">Template</span>", "", "<span class=\"py-comment\"># Python 변수에는 $를 붙이지 않습니다.</span>", "<span class=\"py-variable\">question</span> = <span class=\"py-string\">&quot;파일은 어디에 보관하나요?&quot;</span>", "", "<span class=\"py-comment\"># 따옴표 안의 $question은 값을 채울 자리입니다.</span>", "<span class=\"py-variable\">template</span> = <span class=\"py-type\">Template</span>(<span class=\"py-string\">&quot;질문: $question&quot;</span>)", "", "<span class=\"py-comment\"># 왼쪽 question은 자리 이름, 오른쪽 question은 위 변수의 값입니다.</span>", "<span class=\"py-variable\">prompt</span> = <span class=\"py-variable\">template</span>.<span class=\"py-function\">substitute</span>(<span class=\"py-variable\">question</span>=<span class=\"py-variable\">question</span>)", "<span class=\"py-function\">print</span>(<span class=\"py-variable\">prompt</span>)  <span class=\"py-comment\"># 질문: 파일은 어디에 보관하나요?</span>", "", "<span class=\"py-comment\"># $ 자체를 출력하려면 템플릿 안에 $$를 씁니다.</span>", "<span class=\"py-function\">print</span>(<span class=\"py-type\">Template</span>(<span class=\"py-string\">&quot;기호: $$&quot;</span>).<span class=\"py-function\">substitute</span>())  <span class=\"py-comment\"># 기호: $</span>"], "prompt-basic": ["<span class=\"py-comment\"># ID는 자료를 구별하는 식별자입니다. 101은 이 예제의 파일 보관 안내 번호입니다.</span>", "<span class=\"py-comment\"># prompt는 모델에 보낼 입력을 담는 Python 문자열입니다.</span>", "<span class=\"py-variable\">prompt</span> = <span class=\"py-string\">&quot;&quot;&quot;[작업] 제공된 자료로 질문에 답하세요.</span>", "<span class=\"py-string\">[질문] 파일은 어디에 보관하나요?</span>", "<span class=\"py-string\">[자료] 101: 실습 파일은 개인 폴더에 보관합니다.</span>", "<span class=\"py-string\">[조건] 자료에 없는 사실은 추측하지 마세요.&quot;&quot;&quot;</span>", "", "<span class=\"py-comment\"># print는 입력을 확인할 뿐 모델에 요청하지 않습니다.</span>", "<span class=\"py-function\">print</span>(<span class=\ 'use strict';
const C=Day21Core,D=DAY21_DATA;
const $=(q,el=document)=>el.querySelector(q);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('ko-KR');
const S={i:0,openCase:'D01',reveal:false,mapStep:0,promptFields:[true,true,true,true,true,true],promptQuestion:C.CASES[0].question,promptRule:true,few:true,changes:['rule'],decomp:0,decompCase:'D03',contextIds:'102',contextMode:'normal',budget:[8192,800,600,1600,256],abmode:'manual_chat',abset:'D',frozen:false,abcase:'D01',abvariant:'A',records:{manual_chat:[],fixture:[]},valFixture:'good',valRaw:C.FIXTURES.good.raw,valIds:'101',valStrict:false,valResult:null,evidenceId:101,evidenceReveal:false,retryScenario:'recover',retryStep:0,integrateCase:'good',integrateStep:0,quiz:{},criteria:{},code:false,codePage:null,archivePage:1,archiveSearch:''};
function btn(text,action,extra='',cls=''){return `<button class="${cls}" data-action="${action}" ${extra}>${text}</button>`;}
function chip(text,type=''){return `<span class="chip ${type}">${esc(text)}</span>`;}
function callout(text,type=''){return `<div class="callout ${type}">${text}</div>`;}
function card(title,body,cls=''){return `<section class="card ${cls}">${title?`<h2>${title}</h2>`:''}${body}</section>`;}
function KCard(k,selected=false,control=false){return `<article class="knowledge ${selected?'selected':''}"><header><span><b class="id">${k.id}</b> · ${esc(k.title)}</span>${control?btn(selected?'제외하기':'포함하기','toggleKnowledge',`data-id="${k.id}"`,'small'):chip('지식 스냅샷')}</header><p>${esc(k.content)}</p></article>`;}
function flow(names,active=-1,done=-1){return `<div class="flow">${names.map((n,i)=>`${i?'<span class="arrow" aria-hidden="true">→</span>':''}<div class="node ${i===active?'active':''} ${i<done?'done':''}"><span class="step">${i+1}</span><strong>${esc(n[0])}</strong><small>${esc(n[1])}</small></div>`).join('')}</div>`;}
function gates(result){const names=['JSON 문법','Schema 구조','참조·상태 규칙','사람의 근거 검토'];const state=result?.stages||['pending','pending','pending','pending'];return `<div class="gates">${names.map((name,i)=>{const s=state[i],label={pass:'통과',fail:'실패',pending:i===3?'사람 검토 대기':'대기',skipped:'미수행'}[s];return `<div class="gate ${s}"><span class="symbol">${label}</span><strong>${i+1}. ${name}</strong><small>${['괄호·따옴표·파싱','필드·자료형·길이','전달 ID·상태 조합','질문·주장·인용 본문'][i]}</small></div>`;}).join('')}</div>`;}
function caseSelect(id,value,set){return `<select id="${id}">${C.CASES.filter(c=>!set||c.set===set).map(c=>`<option value="${c.id}" ${c.id===value?'selected':''}>${current().chapter>=5?c.id+" · ":""}${esc(c.question)}</option>`).join('')}</select>`;}
function findCase(id){return C.CASES.find(c=>c.id===id)||C.CASES[0];}
function parsedIds(txt){const clean=txt.trim();if(!clean)return[];const a=clean.split(',').map(x=>x.trim());if(a.some(x=>!/^\d+$/.test(x)||!Number.isSafeInteger(Number(x))))throw new Error('ID는 쉼표로 구분한 0 이상의 정수로 입력하세요.');return a.map(Number);}

function opening(){let c=findCase(S.openCase),missing=c.id==='D03';return `<div class="cols wide-left">${card('',`<p class="hero">좋은 답변은<br>설계하고 확인합니다.</p><p>가상 사내 교육·온보딩 도움말.<br>지식 하나를 보고 두 가지 질문에 답해 봅니다.</p>${KCard(C.KNOWLEDGE[0])}<div class="callout">오늘의 질문: <b>무엇을 넣고, 어떤 결과를 통과시킬 것인가?</b></div>`,'dark')}${card('이 질문에는 답할 수 있을까요?',`<div class="stack">${['D01','D03'].map(id=>btn(esc(findCase(id).question),'openQuestion',`data-id="${id}"`, 'question-choice '+(S.openCase===id?'selected':''))).join('')}</div><div class="gap"></div>${chip('교안의 작성 예시','fixture')}<p class="muted">실제 모델을 호출하거나 답변을 생성하지 않습니다.</p>${btn(S.reveal?'해설 감추기':'예측 후 해설 보기','openingReveal','','primary')}<div class="gap"></div>${S.reveal?`<div class="revealed"><div class="result-title">${missing?'정보 부족이 적절한 응답입니다.':'개인 폴더라고 답할 근거가 있습니다.'}</div><p>${missing?'101에는 보관 위치만 있습니다. 보관 기간을 추측하지 않습니다.':'사용한 근거 101을 함께 표시합니다.'}</p><details><summary class="smalltext">네 필드 JSON 예시 펼치기</summary><p class="smalltext">status는 상태, answer는 안내문, source_ids는 출처 ID 목록, missing_information은 부족한 정보입니다. answered는 답변 가능, insufficient_context는 문맥의 정보 부족입니다.</p><div class="code-box spaced"><pre>${esc(C.raw(missing?C.insufficient('보관 기간'):C.answer('개인 폴더에 보관합니다.',[101])))}</pre></div></details></div>`:'<div class="callout">먼저 예측하세요. 질문에 답하는 데 필요한 정보를 자료에서 찾을 수 있나요?</div>'}`)}</div>`;}
function mapView(){const stages=[['큰 서비스','사용자 → FastAPI → Agent 실행 제어'],['모델 호출의 앞뒤','Context·Prompt → 응답 → 검증·검토'],['작은 함수','build_context · build_prompt · validate'],['필드 하나','source_ids[0] = 101']];let k=S.mapStep;return `${flow(stages,k,k)}<div class="stagebar">${btn('이전 확대','mapPrev','', 'small')}${btn('다음 범위로 확대','mapNext','','primary')}<span class="smalltext muted">${k+1} / 4 · 포함 관계를 보는 지도입니다. 모델 내부 사고의 재현이 아닙니다.</span></div><div class="cols spaced">${card(stages[k][0],[`<div class="row"><span class="route-pill">사용자</span>→<span class="route-pill">기존 FastAPI</span>→<span class="route-pill">Agent 실행 제어 · 후속</span></div><p class="spaced">오늘은 전체 Agent를 만드는 날이 아닙니다. 모델 호출 <b>직전의 입력 구성</b>과 <b>직후의 검증</b>을 설계합니다.</p>`,`${flow([['입력 구성','Context + Prompt'],['응답 받기','수동 관찰 / fixture'],['출력 확인','검사 + 사람 검토']],0)}<p class="spaced">실제 API 호출·Streaming·사용량 처리는 11월 17일에 연결합니다.</p>`,`<div class="stack"><div class="knowledge"><b>build_context</b><p>선택한 지식을 순서대로 직렬화</p></div><div class="knowledge"><b>build_prompt</b><p>질문·문맥·출력 계약을 조립</p></div><div class="knowledge"><b>validate</b><p>문법·구조·참조·상태를 검사</p></div></div>`,`<div class="badge-num">101</div><p>정수·양수인가?<br>이번에 제공한 ID인가?<br>그 본문이 답의 근거인가?</p>${callout('작은 필드 하나라도 실제 업무의 잘못된 인용을 막는 검사와 연결됩니다.')}`][k])}${card('오늘의 범위',`<div class="row">${chip('수동 ChatGPT 관찰')}${chip('로컬 Python 검사')}</div><hr class="divider"><p class="muted">새 API·DB·벡터 검색·도구 실행은 추가하지 않습니다.</p><p class="smalltext">이 강의의 날짜는 원본 표기의 2026.11.16입니다. 후속 실제 API 연결은 2026.11.17입니다.</p>`,'soft')}</div>`;}
function criteria(){return `<div class="grid3">${card('01 · 형식',`<div class="big">약속한 필드인가?</div><p>설명문이 예쁘게 작성되어 있어도 네 필드 계약을 지키지 않으면 구조 검사를 통과하지 못합니다.</p>`)}${card('02 · 근거',`<div class="big">자료에 있는가?</div><p>101에는 개인 폴더라는 위치만 있습니다. 공용 드라이브나 보관 기간은 추가하지 않습니다.</p>`)}${card('03 · 질문 대응',`<div class="big">물은 것에 답했는가?</div><p>보관 기간을 물었는데 보관 위치를 답하면 질문에 대응한 것이 아닙니다.</p>`)}</div><div class="card spaced"><div class="row between"><h2>어떤 응답을 정답으로 볼지 먼저 말해 봅시다.</h2>${chip('답변 평가 기준')}</div><div class="table-wrap"><table><thead><tr><th>질문</th><th>기대 응답</th><th>실패</th></tr></thead><tbody><tr><td>어디에 보관하나요?</td><td>개인 폴더 + 출처 101</td><td>없는 장소를 추가</td></tr><tr><td>몇 년 보관하나요?</td><td>보관 기간 정보 부족</td><td>자료에 없는 보관 기간을 단정</td></tr><tr><td>JSON으로 답해 주세요.</td><td>약속한 필드·자료형</td><td>필드 누락·설명문만 반환</td></tr></tbody></table></div></div>`;}
const promptParts=[['역할','초보 수강생의 실습 도움말 작성자'],['작업','질문에 한국어 2문장 이내로 답하기'],['입력','사용자 질문 + 선택된 지식'],['제약','제공한 근거 범위에서만 답하기'],['실패','없는 사실은 추측하지 않고 정보 부족 표시'],['출력','status, answer, source_ids, missing_information의 JSON']];
function currentContext(){try{return C.buildContext(C.KNOWLEDGE,parsedIds(S.contextIds));}catch(e){return[];}}
function promptText(){let ctx=currentContext();const parts=promptParts.filter((p,i)=>S.promptFields[i]).map(p=>`[${p[0]}]\n${p[1]}`);parts.push('[질문]\n'+S.promptQuestion,'[지식 데이터]\n'+C.raw(ctx),'[계약 상세]\n모든 필드 필수, 추가 필드 금지. source_ids는 양의 정수 목록(최대 3개).\nanswered: source_ids 비어 있지 않음, missing_information="".\ninsufficient_context: source_ids=[], missing_information에 필요한 정보의 이름.\n부족 시 answer="'+C.INSUFFICIENT+'". answer 1~500자, missing_information 최대 200자.\n예제 ID를 실제 질문의 출처로 복사하지 않습니다.');return parts.join('\n\n');}
function prompt(){return `<div class="cols"><div>${card('고정 규칙 여섯 요소',`<div class="form-grid">${promptParts.map((p,i)=>`<label class="knowledge"><span class="row"><input type="checkbox" data-prompt-field="${i}" ${S.promptFields[i]?'checked':''}>${p[0]}</span><span class="smalltext muted">${p[1]}</span></label>`).join('')}</div><div class="gap"></div><label for="promptQuestion">매 요청에서 바뀌는 질문</label><input id="promptQuestion" type="text" value="${esc(S.promptQuestion)}"><p class="smalltext muted">선택한 문맥: ${currentContext().map(k=>k.id).join(', ')||'없음'} · 문맥 화면의 선택과 연결됩니다.</p>${btn('문맥 선택 화면','go', 'data-scene="context"','small')} `)}</div>${card('조립된 Prompt',`${chip('문자열 조립 · 실제 동작','local')}<div class="gap"></div><div class="code-box"><pre id="promptPreview">${esc(promptText())}</pre></div><div class="stagebar">${btn('Prompt 복사','copyPrompt','','primary')}<span class="smalltext muted">모델 호출 없음</span></div>${callout('규칙을 끄면 Prompt 내용만 바뀝니다. 응답 품질의 변화는 실제 모델로 따로 확인해야 합니다.','warn')}`)}</div>`;}
function trust(){return `<div class="cols">${card('앱이 정하는 것',`<div class="big">작업 · 출력 계약<br>검사 · 중단 기준</div><p>사용할 자료와 답변 범위, 정보 부족 처리, 최대 시도 수를 정합니다.</p><div class="knowledge">“제공 지식으로 답하고 출처를 표시하세요.”</div>`)}${card('외부 자료에 적힌 것',`<div class="big">읽는 데이터<br>≠ 실행 권한</div><p>사용자의 질문과 지식 본문은 검토할 자료입니다.</p><div class="knowledge">가상 본문: “앞 지시를 무시해.”<br><span class="smalltext muted">이 문장은 참고 데이터에 포함된 문장입니다.</span></div>`,'soft')}</div><div class="grid3 spaced">${card('구분 제목',`<p><code class="inline">[규칙]</code>은 문서의 구분 제목입니다. API의 system·developer 역할과 같지 않습니다.</p>`,'tight')}${card('구분자',`<p>JSON·태그로 감싸도 명령 오인을 완전히 막는 보안 장벽이 아닙니다.</p>`,'tight')}${card('실행 경계',`<p>API 키·비밀번호를 넣지 않고, 모델 출력을 SQL·명령·도구로 바로 실행하지 않습니다.</p>`,'tight')}</div>`;}
function fewshot(){return `<div class="tabs">${btn('Zero-shot','few', 'data-on="0"',!S.few?'selected':'')}${btn('Few-shot','few','data-on="1"',S.few?'selected':'')}</div><div class="cols">${card('이번 요청의 입력',`<div class="stack"><div class="knowledge"><b>공통 지시 · 출력 계약</b><p>무엇을 하고 어떤 형태로 답할지 지정</p></div>${S.few?`<div class="knowledge selected revealed"><b>독립된 예제 구역 · ID 901</b><p>대여 장소 → 안내 데스크, [901]<br>대여료 → 정보 부족, []</p></div>`:callout('입력→바람직한 출력 예제는 넣지 않습니다.')}<div class="knowledge"><b>현재 질문 · 현재 문맥 101</b><p>파일을 어디에 보관하나요?<br>실습 파일은 개인 폴더에 보관합니다.</p></div></div>`)}${card('예제 ID는 현재 출처가 아닙니다.',`<p class="big">901 <span class="muted">≠</span> 101</p><p>예제의 지식·질문·응답은 한 구역에서 완결됩니다. 예제의 ID를 본 질문의 source_ids로 복사하지 않습니다.</p>${callout('이 전환은 입력 구성을 바꿉니다. 모델 가중치를 학습시키지 않습니다.')}<p class="smalltext spaced">예제를 더 넣기 전: 일관성 · 대표성 · 평가 세트와의 분리 · 문맥 예산을 확인합니다. Few-shot이 항상 더 좋다고 단정하지 않습니다.</p>`,'soft')}</div>`;}
function versions(){return `<div class="cols">${card('A · 기준안 / answer_v1',`<div class="quote">제공된 지식을 참고하여 질문에 답한다.<br>출처에는 이번 지식의 ID를 적는다.</div><p class="smalltext muted">두 상태·네 필드의 계약은 A와 B가 공유합니다.</p>`)}${card('B · 변경안 / answer_v2',`<div class="quote">A의 규칙을 그대로 유지한다.</div><div class="callout ok"><b>+ 추가 규칙 하나</b><br>질문의 답을 뒷받침할 사실이 없으면 insufficient_context(문맥의 정보 부족)로 두고 부족한 정보의 이름을 적는다.</div><p class="smalltext muted">추가 규칙이 실제로 효과가 있는지는 아직 미확인입니다.</p>`)}</div><div class="card spaced"><div class="row between"><h2>버전 이름과 실제 본문을 함께 보존</h2></div><div class="grid3"><div class="knowledge"><b>Prompt</b><p>answer_v1 / answer_v2<br>변경 이유·가설·실제 본문</p></div><div class="knowledge"><b>Context</b><p>knowledge_v1<br>선택 ID·순서·스냅샷</p></div><div class="knowledge"><b>Schema</b><p>answer_schema_v1<br>필드·자료형·상태 규칙</p></div></div><p class="smalltext muted spaced">해시(Hash)는 같은 방식으로 표현한 입력 내용을 비교할 때 쓰는 요약값입니다. 아래 코드의 SHA-256은 해시 함수의 이름이며, 자료의 정확성이나 전달 권한을 보증하지 않습니다.</p></div>`;}
function controls(){const opts=[['rule','근거 부족 규칙'],['question','질문'],['context','문맥'],['model','표시된 모델명'],['schema','출력 계약'],['example','예제'],['rubric','채점 기준']];let clean=S.changes.length===1&&S.changes[0]==='rule';return `<div class="cols">${card('이번 비교에서 바꿀 요소 선택',`<div class="stack">${opts.map(([id,name])=>`<label class="row"><input type="checkbox" data-change="${id}" ${S.changes.includes(id)?'checked':''}>${name}</label>`).join('')}</div>`)}${card('비교 조건 점검',`<div class="badge-num">${S.changes.length}</div><p>변경된 요소</p>${callout(clean?'이번 교안의 비교 설계입니다. 근거 부족 규칙 하나만 변경하고 나머지는 고정합니다.':S.changes.length===0?'변경점이 없습니다. 비교하려는 가설을 먼저 정하세요.':'이번 교안의 A/B와 다른 실험입니다. 여러 요소를 바꾸면 근거 부족 규칙만의 영향을 분리하기 어렵습니다.',clean?'ok':'warn')}<p class="spaced">이 화면은 <b>비교 설계</b>만 확인합니다. 선택을 바꿨다고 모델 성능 지표가 생성되지는 않습니다.</p>`,'soft')}</div>`;}
function decompose(){let c=findCase(S.decompCase);const known=c.id==='D01';const words=[['질문 파악','어떤 사실인가?'],['근거 대조','자료에 있는가?'],['답변·상태','답변 / 정보 부족'],['외부 검사','필드·출처·내용']];const descriptions=[`질문에 답하는 데 필요한 정보는 <b>${esc(c.needed)}</b>입니다.`,known?'지식 101의 “개인 폴더”가 보관 위치를 뒷받침합니다.':'지식 101은 보관 위치만 말합니다. 보관 기간을 뒷받침하지 않습니다.',known?'answered · 개인 폴더 · source_ids=[101]':'insufficient_context · source_ids=[] · missing_information="보관 기간"','문법·구조·참조 규칙은 코드로, 실제 본문 뒷받침은 사람이 확인합니다.'];return `<div class="row"><label for="decompCase">질문</label><select id="decompCase" style="max-width:560px">${['D01','D03'].map(id=>`<option value="${id}" ${id===c.id?'selected':''}>${esc(findCase(id).question)}</option>`).join('')}</select>${chip('작업 분해 설명 모형')}</div><div class="spaced">${flow(words,S.decomp,S.decomp)}</div><div class="stagebar">${btn('이전 단계','decompPrev','','small')}${btn('다음 단계','decompNext','','primary')} </div><div class="cols spaced">${card('현재 확인할 것',`<div class="step-description big">${descriptions[S.decomp]}</div>`)}${card('이 화면은 모델 내부 사고의 재현이 아닙니다.',`<p>이 흐름은 서비스의 <b>설계·검증 관점</b>입니다. 모델 내부가 반드시 이 순서로 생각한다는 설명이 아닙니다.</p><p>CoT의 이해와 별개로 평가 대상은 긴 풀이가 아니라 결과·근거·검증할 수 있는 작업 결과입니다.</p>`,'soft')}</div>`;}
function states(){return `<div class="cols">${card('업무 결과 · 정보 부족',`${chip('오늘의 출력 계약','local')}<p class="big">insufficient_context</p><p>질문은 가능하지만 이번 자료에 필요한 사실이 없습니다.</p><div class="code-box"><pre>${esc(C.raw(C.insufficient('보관 기간')))}</pre></div>`)}${card('모델 제공사·서비스의 요청 거절',`${chip('후속 API 처리','outline')}<p class="big">별도의 실행 상태</p><p>모델 제공사의 거절, 출력 중단, 통신 실패를 정상 KnowledgeAnswer로 억지 변환하지 않습니다.</p>${callout('API 응답 상태 처리와 어댑터 연결은 11월 17일 범위입니다.','warn')}`,'soft')}</div>${callout('이번 교안의 정책: 질문에 답하는 데 필요한 정보가 부족하면 정보 부족으로 처리합니다. 부분 답변 정책을 임의로 추가하지 않습니다.')}`;}
function context(){let ids=[],rows=C.KNOWLEDGE;let result=null,error='';try{ids=parsedIds(S.contextIds);if(S.contextMode==='duplicate')rows=[...rows,{...rows[0]}];result=C.buildContext(rows,ids);}catch(e){error=e.message;}const chosen=result?.map(k=>k.id)||[],excluded=C.KNOWLEDGE.filter(k=>!chosen.includes(k.id));return `<div class="cols"><div class="stack">${C.KNOWLEDGE.map(k=>KCard(k,chosen.includes(k.id),true)).join('')}<div class="card tight"><label for="contextIds">선택 ID 순서 · 쉼표 구분</label><input id="contextIds" type="text" value="${esc(S.contextIds)}" placeholder="예: 102,101,102"><div class="row spaced">${btn('선택 중복 예시','contextPreset','data-value="102,101,102"','small')}${btn('없는 ID 예시','contextPreset','data-value="999"','small')}${btn(S.contextMode==='duplicate'?'원본 중복 해제':'원본 rows에 중복 ID 주입','contextDuplicate','','small')}</div></div></div>${card('build_context의 실제 결과',`${chip('브라우저에서 규칙 계산','local')}<div class="gap"></div>${error?callout(esc(error),'fail'):`<div class="code-box"><pre>${esc(C.raw(result))}</pre></div><p class="smalltext spaced">포함 ID: <b>[${chosen.join(', ')}]</b><br>제외 ID: [${excluded.map(k=>k.id).join(', ')}] · 이번 수동 선택에 포함하지 않음</p>`}${callout('<b>두 종류의 중복은 다릅니다.</b><br>원본 rows의 중복 ID → 오류.<br>selected_ids의 중복 → 첫 등장 순서대로 한 번만 포함.')}<p class="smalltext muted">id·title·content는 원본 16쪽에 명시된 값입니다. category의 실제 값은 제시되지 않아 만들지 않았습니다. 이 화면은 검색·권한 검사를 구현하지 않습니다.</p>`)}</div>`;}
function budgetView(){let b;try{b=C.budget(...S.budget);}catch(e){return callout(esc(e.message),'fail');}let totalParts=S.budget.slice(1).reduce((a,b)=>a+b,0)+Math.max(0,b.context);let denom=Math.max(b.total,totalParts,1);const seg=[['지시·질문',b.instruction],['예제',b.examples],['근거 문맥',Math.max(0,b.context)],['출력용 공간',b.output],['여유',b.reserve]];return `<div class="row between">${chip('가상 토큰 예산 · 실제 산술 계산','local')}${btn('8,192 예시로 초기화','budgetReset','','small')}</div><div class="cols spaced">${card('값을 바꿔 남는 공간 확인',`<div class="form-grid">${[['전체 예산',0,32768],['지시·질문',1,12000],['예제',2,12000],['출력용 공간',3,12000],['여유',4,4096]].map(([n,i,max])=>`<label>${n}<input type="number" min="0" max="131072" step="1" data-budget="${i}" value="${S.budget[i]}"><input type="range" aria-label="${n} 조절" min="0" max="${max}" step="1" data-budget="${i}" value="${S.budget[i]}"></label>`).join('')}</div>`)}${card('근거에 남는 예산',`<div id="budgetResult"><div class="badge-num" style="color:${b.context<0?'var(--bad)':'var(--teal)'}">${fmt(b.context)}</div><p>tokens ${b.context<0?'· 예산 초과':'· 남은 근거를 넣을 공간'}</p><div class="token-bar" aria-label="가상 예산 분배">${seg.map(([n,v])=>`<div class="token-segment" style="width:${100*v/denom}%" title="${n}: ${v}">${v/denom>.13?esc(n):''}</div>`).join('')}</div><div class="legend">${seg.map(([n,v],i)=>`<span style="--swatch:${['#46668d','#708ca9','#2b6f65','#a07940','#a6adb7'][i]}">${n} ${fmt(v)}</span>`).join('')}</div><p class="count spaced">${fmt(b.total)} − ${fmt(b.instruction)} − ${fmt(b.examples)} − ${fmt(b.output)} − ${fmt(b.reserve)} = ${fmt(b.context)}</p>${callout(b.context<0?'입력 구성부터 줄여야 합니다. 출력 공간을 없애서 맞는 것처럼 표시하지 않습니다.':'예제를 늘리면 같은 전체 예산에서 근거에 남는 공간이 줄어듭니다.',b.context<0?'fail':'ok')}</div>`,'soft')}</div>${callout('8,192는 특정 모델의 사양이 아닌 교안의 계산 연습값입니다. 글자 수를 토큰 수로 바꾸지 않습니다. 실제 입력은 해당 모델의 tokenizer 또는 API 측정으로 확인합니다.','warn')}`;}
function contextBoundary(){return `<div class="grid4">${[['권한·신뢰','보내도 되는 자료인가?','비밀·개인정보를 빼고 가상 자료로 설명합니다.'],['관련성','질문에 답하는 데 필요한 정보인가?','서버 실행 질문에 직접 관련한 지식은 102입니다.'],['유효성','버전·적용 범위가 맞는가?','날짜가 새롭다는 이유만으로 상위 정책을 덮어쓰지 않습니다.'],['예산','출력 공간을 남겼는가?','중복·무관한 항목부터 제외하고 이유를 기록합니다.']].map(([a,b,c])=>card(a,`<h3>${b}</h3><p>${c}</p>`,'tight')).join('')}</div><div class="cols spaced">${card('요약해 넣을 때',`<div class="quote">수치 · 조건 · 예외 · 원본 ID</div><p>정보를 줄인 뒤에도 의미가 바뀌지 않았는지 원문과 대조합니다.</p>`)}${card('빼야 할 때',`<div class="code-box"><pre>included_ids\nexcluded_ids\n제외 이유\ncontext_version</pre></div><p class="smalltext spaced">입력 한도에 들어간다는 것과 모델이 내용을 정확히 활용한다는 것은 다릅니다.</p>`,'soft')}</div>`;}
function evalset(){return `<div class="cols">${card('Development · 개선용 질문',`<div class="stack">${C.CASES.filter(c=>c.set==='D').map(c=>`<div class="knowledge"><b>${c.id}</b><p>${esc(c.question)}</p><span class="smalltext muted">문맥 [${c.ids.join(',')}] · 기대 응답: ${c.expect}</span></div>`).join('')}</div>`)}${card('Holdout · 최종 확인용 질문',`<p>Development 질문으로 개선한 뒤 Prompt를 고정합니다. Holdout 결과로 다시 수정하면 새 버전과 새 최종 확인 질문 묶음이 필요합니다.</p><label class="row"><input id="freezePrompt" type="checkbox" ${S.frozen?'checked':''}>Prompt 고정 후 확인 단계로 진행</label>${S.frozen?`<div class="stack spaced revealed">${C.CASES.filter(c=>c.set==='H').map(c=>`<div class="knowledge"><b>${c.id}</b><p>${esc(c.question)}</p><span class="smalltext muted">문맥 [${c.ids.join(',')}] · ${c.expect}</span></div>`).join('')}</div>`:callout('Holdout 질문은 Prompt를 고정한 뒤 확인합니다. 교안에 공개된 교육용 묶음이므로 비공개 평가 데이터를 구현한 것은 아닙니다.')}<p class="smalltext muted spaced">이 체크는 수업 진행 안내입니다. 데이터 접근 제어나 모델 실행 기능이 아닙니다.</p>`,'soft')}</div>${callout('A와 B는 각각 독립된 대화에서 실행하고 첫 응답을 그대로 보존합니다. 수동 UI에서 설정할 수 없는 조건은 “미확인”으로 기록합니다.')}`;}
function abRecord(){return S.records[S.abmode].find(r=>r.case_id===S.abcase&&r.variant===S.abvariant);}
function ratingSelect(id,value,label){return `<label class="smalltext">${label}<select id="${id}"><option value="pending" ${value===null||value===undefined?'selected':''}>미평가</option><option value="pass" ${value===true?'selected':''}>적합</option><option value="fail" ${value===false?'selected':''}>부적합</option></select></label>`;}
function metricBlock(variant,m){return `<div class="card tight"><div class="row between"><h3>${variant} · 첫 응답</h3>${chip(`실행 ${m.executed}/${m.N}`)}</div>${[['JSON',m.json,m.N],['Schema',m.schema,m.N],['참조·상태',m.reference,m.N],['사람의 근거 평가',m.humanPass,m.humanN]].map(([name,n,d])=>`<div class="metric-line ${variant==='B'?'alt':''}"><span>${name}</span><div class="meter"><span style="width:${d?100*n/d:0}%"></span></div><span class="val">${d?`${n}/${d}`:'—'}</span></div>`).join('')}<p class="smalltext muted">미실행 ${m.unexecuted} · 사람 평가 전 ${m.humanPending}<br>구조·규칙 오류로 검토하지 못한 응답 ${m.unreviewable}</p></div>`;}
function ab(){const c=findCase(S.abcase),r=abRecord(),rr=S.records[S.abmode],set=C.CASES.filter(c=>c.set===S.abset),m=C.metrics(rr,set),v=r?C.validate(r.raw_text,c.ids):null;return `<div class="row between"><div class="tabs">${btn('수동 관찰 입력','abmode','data-mode="manual_chat"',S.abmode==='manual_chat'?'selected':'')}${btn('교육용 fixture','abmode','data-mode="fixture"',S.abmode==='fixture'?'selected':'')}</div>${chip(S.abmode==='fixture'?'직접 작성한 샘플 · 모델 품질 수치 아님':'실제 모델에서 받은 응답을 입력합니다.',S.abmode==='fixture'?'fixture':'outline')}</div><div class="row"><label>질문 세트 <select id="abset" style="width:280px;max-width:100%"><option value="D" ${S.abset==='D'?'selected':''}>Development (D) · 개선용</option><option value="H" ${S.abset==='H'?'selected':''} ${S.frozen?'':'disabled'}>Holdout (H) · 최종 확인용</option></select></label>${S.abmode==='fixture'?btn('교육용 샘플 불러오기','loadFixtures','','small'):''}${btn('선택한 응답 유형의 기록 내보내기','exportAB','','small')}${!S.frozen?'<span class="smalltext muted">Holdout은 질문 묶음 화면에서 Prompt 고정 후 선택</span>':''}</div><div class="cols wide-left spaced"><div>${card('응답 원문과 사람 평가',`<div class="form-grid"><label>질문${caseSelect('abcase',S.abcase,S.abset)}</label><label>Prompt 버전<select id="abvariant"><option value="A" ${S.abvariant==='A'?'selected':''}>A · 기준안</option><option value="B" ${S.abvariant==='B'?'selected':''}>B · 변경안</option></select></label></div><p class="smalltext muted">고정 문맥 [${c.ids.join(', ')}] · 첫 응답 attempt=1 · ${r?'원문 저장됨: 변경하지 않고 보존':'아직 미실행'}</p><textarea id="abraw" aria-label="첫 응답 원문" spellcheck="false" ${r?'readonly':''} placeholder="실제 관찰한 첫 응답을 그대로 붙여 넣습니다. 미실행이면 빈칸으로 둡니다.">${esc(r?.raw_text||'')}</textarea><div class="form-grid spaced"><label class="smalltext">표시된 모델명<input type="text" id="abmodel" value="${esc(r?.model_label||'미확인')}" ${r?'readonly':''}></label><label class="smalltext">실제 관찰 일시<input type="text" id="abdate" placeholder="미확인 또는 실제 관찰 일시" value="${esc(r?.observed_at||'미확인')}" ${r?'readonly':''}></label></div><div class="form-grid spaced">${ratingSelect('abevidence',r?.evidence_ok,'사람: 근거 적합성')}${ratingSelect('abquestion',r?.question_ok,'사람: 질문 대응')}${ratingSelect('abinsufficient',r?.insufficiency_ok,'사람: 정보 부족 처리')}</div><div class="stagebar">${btn(r?'사람 평가 저장':'첫 응답 저장·자동 검사','saveAB','','primary')}</div>${v?`<div class="smalltext spaced">검사: <b>${esc(v.error||'자동 통과')}</b> · ${esc(v.detail)}</div>`:''}<p class="smalltext muted spaced">원문은 최초 저장 후 덮어쓰지 않습니다. 이 화면은 강사의 설명 보조이며 별도 실습 과제가 아닙니다. 기록은 메모리에만 있으며 새로고침하면 사라집니다.</p>`)}</div><div class="stack">${metricBlock('A',m.A)}${metricBlock('B',m.B)}${callout('N은 한 버전의 첫 응답 대상 수입니다. 현재 N='+set.length+'입니다. 미실행을 따로 표시하며, 비교 완료를 뜻하지 않습니다. 사람의 근거 평가는 <b>실제로 평가한 수</b>가 분모입니다. 전체 요청 성공률이 아닙니다.','warn')}</div></div><div class="table-wrap spaced"><table><thead><tr><th>질문</th><th>A 첫 응답</th><th>B 첫 응답</th><th>기대 응답 · 실측 아님</th></tr></thead><tbody>${set.map(c=>`<tr><td>${c.id}</td>${['A','B'].map(v=>{let r=rr.find(r=>r.case_id===c.id&&r.variant===v),vv=r?C.validate(r.raw_text,c.ids):null;return `<td>${r?esc(vv.error||'자동 통과 · 사람평가 '+(r.evidence_ok===true?'적합':r.evidence_ok===false?'부적합':'대기')):'미실행'}</td>`;}).join('')}<td>${c.expect}</td></tr>`).join('')}</tbody></table></div>`;}
function provenance(){return `<div class="grid3">${card('manual_chat · 수동 관찰',`${chip('실제 수동 관찰','outline')}<h3 class="spaced">모델을 사용하는 화면에서 관찰한 출력</h3><p>질문·표시된 모델명·실행 조건·원문을 남깁니다.</p>${callout('이 결과를 같은 API 모델의 성능 검증이라고 단정하지 않습니다.','warn')}`)}${card('fixture · 작성한 샘플',`${chip('직접 작성한 샘플','fixture')}<h3 class="spaced">검사 흐름을 확인하는 입력</h3><p>성공·실패를 의도적으로 만들어 분기와 횟수를 점검합니다.</p>${callout('Prompt B가 더 좋다는 실측 증거가 아닙니다.','warn')}`)}${card('api · 프로그램으로 호출',`${chip('11/17 후속 범위','outline')}<h3 class="spaced">실제 API 응답과 조건</h3><p>호출·사용량·응답 상태를 실제 실행에서 기록합니다.</p>${callout('이 HTML은 API를 호출하지 않습니다.','warn')}`,'soft')}</div><div class="takeaway"><b>기록 원칙</b><span>미실행은 미실행, 미평가는 미평가. 예상값을 실제 결과 칸에 채우지 않습니다.</span></div>`;}
function contract(){return `<div class="cols">${card('출력 계약 v1',`<div class="table-wrap"><table><thead><tr><th>필드</th><th>자료형·규칙</th></tr></thead><tbody><tr><td><code>status</code></td><td>answered: 답변 가능<br>insufficient_context: 문맥의 정보 부족</td></tr><tr><td><code>answer</code></td><td>문자열 1~500자</td></tr><tr><td><code>source_ids</code></td><td>양의 정수 목록 · 최대 3개</td></tr><tr><td><code>missing_information</code></td><td>문자열 · 최대 200자</td></tr></tbody></table></div>${callout('모든 필드 필수 · 추가 필드 금지 · 상태별 조합은 별도 검사<br>500자·출처 3개·200자는 이번 교안의 계약 한도이며 모델의 한도가 아닙니다.')}`)}${card('같은 틀, 다른 상태',`${chip('교안의 작성 예시','fixture')}<div class="stack spaced"><div class="knowledge"><b>answered</b><p>출처 목록이 비어 있지 않음<br>missing_information은 빈 문자열</p></div><div class="knowledge"><b>insufficient_context</b><p>source_ids는 []<br>부족한 정보의 이름 + 정해진 부족 안내문</p></div></div><hr class="divider"><p class="smalltext">“JSON으로 답해”는 요청입니다.<br>로컬 Pydantic은 받은 데이터를 검사합니다.<br>API Structured Outputs의 생성 제약과는 구분합니다.</p>`,'soft')}</div>`;}
function validator(){let v=S.valResult;return `<div class="row between">${chip('브라우저에서 실행하는 검사기','local')}</div><div class="cols wide-left spaced">${card('입력을 직접 바꿔 검사',`<label for="valFixture">직접 작성한 교육용 입력</label><select id="valFixture">${Object.entries(C.FIXTURES).map(([k,f])=>`<option value="${k}" ${S.valFixture===k?'selected':''}>${esc(f.label)}</option>`).join('')}</select><div class="gap"></div><textarea id="valRaw" aria-label="검사할 JSON" spellcheck="false">${esc(S.valRaw)}</textarea><div class="form-grid spaced"><label class="smalltext">이번에 제공한 ID<input type="text" id="valIds" value="${esc(S.valIds)}"></label><label class="smalltext">JSON 파싱 정책<select id="valParser"><option value="basic" ${!S.valStrict?'selected':''}>교안 기본 파서 동작</option><option value="strict" ${S.valStrict?'selected':''}>부록 엄격 파서 동작</option></select></label></div><div class="stagebar">${btn('검사 실행','validate','','primary')}${btn('원래 샘플로 되돌리기','valReset','','small')}</div>`)}<div>${card('검사 결과',`${gates(v)}${v?`${callout(`<b>${esc(v.error||'자동 검사 통과')}</b><br>${esc(v.detail)}`,v.error?'fail':'ok')}${v.error?'':callout('사람의 근거 검토는 아직 수행하지 않았습니다. 정답 승인이나 도구 실행 허가가 아닙니다.','warn')}`:callout('검사 실행 전입니다. 앞 단계가 실패하면 뒤 단계는 “미수행”으로 남습니다.')}<p class="smalltext muted spaced">브라우저에서 Python/Pydantic을 실행하지는 않습니다. 원본의 규칙을 구현한 설명용 검사기이며 대응 코드와 테스트 결과를 별도로 제공합니다.</p>`)}</div></div><p class="smalltext muted spaced">기본 모드: 중복 JSON 키의 마지막 값 사용, NaN/Infinity는 다음 Schema 단계에서 확인. 엄격 모드: 중복 키와 비표준 수치를 파싱 단계에서 거부. 입력 20,000 UTF-8 바이트·깊이 80·JS 안전 정수 범위는 이 데모의 별도 제한입니다.</p>`;}
function evidence(){let obj=C.answer('프로젝트 폴더에서 서버를 실행합니다.',[S.evidenceId]);let v=C.validate(C.raw(obj),[101,102,103]);if(S.evidenceReveal)v.stages[3]=S.evidenceId===102?'pass':'fail';return `${chip('고정 반례의 해설 · 일반 의미 자동 판정 아님','fixture')}<div class="cols spaced">${card('같은 답, 바꿔 보는 인용',`<p class="smalltext muted">질문: 서버는 어느 폴더에서 실행하나요?<br>제공 문맥: [101, 102, 103]</p><div class="quote">프로젝트 폴더에서 서버를 실행합니다.</div><label class="spaced">source_ids에 넣을 ID<select id="evidenceId">${C.KNOWLEDGE.map(k=>`<option value="${k.id}" ${S.evidenceId===k.id?'selected':''}>${k.id} · ${k.title}</option>`).join('')}</select></label><div class="gap"></div>${KCard(C.KNOWLEDGE.find(k=>k.id===S.evidenceId),true)}<div class="stagebar">${btn('원문 대조 후 교안 해설 보기','evidenceReveal','','primary')}</div>`)}${card('어느 검사 단계에서 드러나는가?',`${gates(v)}${S.evidenceReveal?callout(S.evidenceId===102?'이 고정 예시에서는 102가 서버 실행 위치를 뒷받침합니다.':'자동 검사는 통과하지만 인용 본문이 서버 실행 위치를 뒷받침하지 않습니다.',S.evidenceId===102?'ok':'fail'):callout('앞의 세 검사 단계은 모두 통과합니다. 마지막 판정은 지금 사람이 본문과 대조할 차례입니다.','warn')}<p class="smalltext spaced">해설 공개 버튼은 <b>교안에 정해진 반례</b>를 보여줍니다. 임의의 답을 자동으로 채점하는 LLM judge가 아닙니다.</p>`,'soft')}</div>`;}
function triage(){const rows=[['JSON 닫는 괄호 누락','json_error','형식 수정 1회'],['필드 누락 · 잘못된 자료형','schema_error','같은 계약으로 수정 1회'],['제공하지 않은 출처 · 상태 모순','rule_error','자동 재생성하지 않고 점검'],['정상 정보 부족','업무 결과','생성 종료 후 적절성 검토'],['거절 · 미완료 · 통신 실패','별도 실행 상태','후속 API 어댑터에서 처리']];return `<div class="table-wrap"><table><thead><tr><th>관찰한 상황</th><th>분류</th><th>다음 행동</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="cols spaced">${card('수정할 수 있는 형식',`<div class="big">같은 질문·문맥·계약</div><p>확인된 JSON·Schema 오류만 요약해서 다시 요청합니다.</p>`)}${card('없는 사실은 만들지 않기',`<div class="big">재시도 ≠ 새 근거</div><p>근거 부족이나 권한 문제를 답이 나올 때까지 반복해서 해결하려 하지 않습니다.</p>`,'soft')}</div>`;}
function retryEvents(){const s=C.RETRIES[S.retryScenario],run=C.runRetry(s.seq.map(k=>C.FIXTURES[k].raw));let events=[{phase:0,title:'아직 응답을 받지 않았습니다.',desc:'최초 1회 + 형식 수정 1회까지만 허용합니다.',calls:0}];for(let j=0;j<run.history.length;j++){const h=run.history[j];events.push({phase:1,title:`${h.attempt}회차 응답 받기`,desc:'직접 작성한 Fixture 문자열을 전달합니다. 실제 모델 호출이 아닙니다.',calls:h.attempt,raw:h.raw_text});events.push({phase:2,title:`${h.attempt}회차 자동 검사`,desc:h.error||'자동 검사 통과 · 사람 검토 필요',calls:h.attempt,result:h.result});if(!h.error){events.push({phase:4,title:h.result.obj.status==='insufficient_context'?'정상 정보 부족: 생성 종료':'자동 통과: 생성 종료',desc:'반환한 객체는 사람이 근거·질문 대응을 검토합니다.',calls:h.attempt});break;}if(!['json_error','schema_error'].includes(h.error)){events.push({phase:4,title:'규칙 위반: 자동 재생성 없이 중단',desc:'성공 객체를 반환하지 않고 문맥·출처·규칙을 점검합니다.',calls:h.attempt});break;}if(h.attempt===2){events.push({phase:4,title:'두 번째 실패: 중단',desc:'None과 기록을 반환합니다. 마지막 실패 뒤 수정 요청도 추가하지 않습니다.',calls:2});break;}events.push({phase:3,title:'형식 수정 요청을 한 번 구성',desc:'같은 질문·문맥·계약을 유지합니다. 첫 응답 원문은 보존합니다.',calls:1});}return events;}
function retry(){let events=retryEvents(),idx=Math.min(S.retryStep,events.length-1),e=events[idx];return `<div class="row between"><select id="retryScenario" style="max-width:560px" aria-label="재시도 시나리오">${Object.entries(C.RETRIES).map(([id,s])=>`<option value="${id}" ${S.retryScenario===id?'selected':''}>${esc(s.label)} · 예상 ${s.expected}회</option>`).join('')}</select>${chip('Fixture로 재시도 흐름 확인','fixture')}</div><div class="spaced">${flow([['응답 받기','최초 또는 수정 응답'],['자동 검사','JSON·Schema·규칙'],['수정 요청','형식 오류만 1회'],['종료·검토','정상 또는 중단']],e.phase===4?3:Math.max(0,e.phase-1))}</div><div class="stagebar">${btn('초기화','retryReset','','small')}${btn('이전 단계','retryPrev',idx===0?'disabled':'','small')}${btn(idx===events.length-1?'종료됨':'다음 단계','retryNext',idx===events.length-1?'disabled':'','primary')}<span class="smalltext muted">Space로 한 단계 진행 · 자동 무한 재생 없음</span></div><div class="cols spaced">${card(e.title,`<p class="big">${e.calls} <span class="muted">/ 2회</span></p><p>${e.desc}</p>${e.raw?`<div class="code-box"><pre>${esc(e.raw)}</pre></div>`:''}${e.result?gates(e.result):''}`)}${card('이번 실행의 기록',`<div class="log">${events.slice(1,idx+1).map(x=>`<div class="log-entry"><b>${x.title}</b><small>${esc(x.desc)}</small></div>`).join('')||'<p class="muted">아직 실행 전입니다.</p>'}</div><p class="smalltext muted">이 호출 수는 샘플 응답 함수를 호출한 횟수입니다. 실제 API 호출·모델 복구 성능을 측정한 것이 아닙니다.</p>`,'soft')}</div>`;}
function repair(){return `<div class="cols">${card('전달할 내용',`<div class="code-box"><pre>${esc(D.codes[68].text)}</pre></div>`)}${card('전달하지 않을 것',`<div class="stack"><div class="knowledge"><b>전체 traceback</b><p>실행 경로·내부 정보가 포함될 수 있습니다.</p></div><div class="knowledge"><b>비밀 값 · 원문 전체 재전달</b><p>확인된 오류의 제한된 요약만 사용합니다.</p></div><div class="knowledge"><b>출처 ID를 임의로 바꾸기</b><p>999를 편의상 101로 바꿔 성공처럼 처리하지 않습니다.</p></div></div>${callout('형식 수정 요청과 Prompt 개선 A/B 실험은 다릅니다.','warn')}`,'soft')}</div>`;}
function integration(){const f=C.FIXTURES[S.integrateCase],idx=S.integrateStep,ctx=C.buildContext(C.KNOWLEDGE,f.ids),seq=S.integrateCase==='broken'?[f.raw,C.FIXTURES.good.raw]:[f.raw],run=C.runRetry(seq,f.ids),last=run.history[run.history.length-1],names=[['Context','실제로 넣은 자료'],['Prompt','지시·질문·계약'],['응답 받기','수동 관찰 / fixture'],['검증·분기','최대 2회'],['사람 검토','주장·근거·질문']];let bodies=[`<p>질문: <b>${esc(f.question)}</b></p><div class="code-box"><pre>${esc(C.raw(ctx))}</pre></div>`,`<div class="code-box"><pre>${esc('[작업] 제공 지식으로 한국어 2문장 이내로 답하기\n[질문] '+f.question+'\n[문맥 ID] '+f.ids.join(', ')+'\n[출력] status, answer, source_ids, missing_information\n[실패] 근거가 없으면 정보 부족. 없는 사실은 추측하지 않기.')}</pre></div><p class="smalltext muted">설명용 핵심 발췌입니다. 전체 계약은 출력 검증과 참고자료에서 확인합니다.</p>`,`<div class="row">${chip('직접 작성한 Fixture','fixture')}<span class="smalltext">LLM 호출 아님</span></div><div class="code-box spaced"><pre>${esc(f.raw)}</pre></div>`,`<div class="row"><b>응답 받기 함수 ${run.calls}회</b>${chip(run.obj?'자동 검사를 통과한 객체 반환':'None 반환')}</div>${gates(last.result)}<div class="log">${run.history.map(h=>`<div class="log-entry">attempt ${h.attempt} · ${esc(h.error||'자동 검사 통과')}</div>`).join('')}</div>`,run.obj?`<div class="big">자동 통과.<br>최종 승인은 아직입니다.</div><p>질문·답·인용 본문을 나란히 읽고, 정보 부족 판단과 사용자 대응을 사람이 확인합니다.</p>${callout('이 화면은 자동 정답 판정을 수행하지 않습니다.','warn')}`:`<div class="big">실패를 성공으로<br>반환하지 않습니다.</div><p>원문·오류 단계·시도 수를 남기고 입력과 규칙을 점검합니다.</p>`];return `<div class="row between"><select id="integrateCase" style="max-width:560px" aria-label="전체 흐름 시나리오">${[['good','정상 위치 질문'],['missing','정보 부족 질문'],['broken','형식 오류 후 수정 샘플'],['false_evidence','잘못된 인용 반례'],['unknown','제공하지 않은 출처']].map(([key,n])=>`<option value="${key}" ${key===S.integrateCase?'selected':''}>${n}</option>`).join('')}</select>${chip('모듈 연결 시연','fixture')}</div><div class="spaced">${flow(names,idx,idx)}</div><div class="stagebar">${btn('처음부터','integrateReset','','small')}${btn('이전 단계','integratePrev',idx===0?'disabled':'','small')}${btn('다음 단계','integrateNext',idx===4?'disabled':'','primary')}</div><div class="cols spaced">${card(names[idx][0],bodies[idx])}${card('같은 흐름, 그대로 이어지는 실습',`<p>실습 01~07에서 만든 지시·문맥·검사·재시도 설계를 연결합니다.</p><div class="stack"><div class="knowledge"><b>H01~H03 확인</b><p>고정한 A/B 각각 3개 첫 응답 보존</p></div><div class="knowledge"><b>실패 fixture 별도 확인</b><p>규칙·분기·횟수를 점검</p></div><div class="knowledge"><b>사람이 근거 대조</b><p>과잉 단정과 과도한 정보 부족 구분</p></div></div>`,'soft')}</div>`;}

function loadFixtures(){if(S.abmode!=='fixture')return;const make=(id,variant)=>{let c=findCase(id),obj;if(id==='D01')obj=variant==='A'?C.answer('개인 폴더에 보관합니다.',[101]):C.insufficient('보관 위치');if(id==='D02')obj=C.answer('프로젝트 폴더에서 서버를 실행합니다.',[102]);if(id==='D03')obj=variant==='A'?C.answer('보관 기간은 3년입니다.',[101]):C.insufficient('보관 기간');if(id==='H01')obj=C.answer('오류 메시지와 시도한 작업을 함께 적습니다.',[103]);if(id==='H02')obj=C.insufficient('서버 접속 비밀번호');if(id==='H03')obj=C.answer('실습 파일은 개인 폴더에 보관하고 서버는 프로젝트 폴더에서 실행합니다. 오류 질문에는 오류 메시지와 시도한 작업을 함께 적습니다.',[101,102,103]);return {case_id:id,variant,attempt:1,raw_text:C.raw(obj),source_mode:'fixture',model_label:'모델 미호출 · HTML용 직접 작성한 샘플',observed_at:'해당 없음',prompt_version:variant==='A'?'answer_v1':'answer_v2',context_version:'knowledge_v1',schema_version:'answer_schema_v1',evidence_ok:null,question_ok:null,insufficiency_ok:null};};for(const c of C.CASES.filter(c=>c.set===S.abset))for(const v of ['A','B']){if(!S.records.fixture.some(r=>r.case_id===c.id&&r.variant===v))S.records.fixture.push(make(c.id,v));}render();toast('교육용 샘플만 불러왔습니다. 수동 관찰 기록은 변경하지 않았습니다.');}

function metricsView(){let definitions={unexecuted:'미실행',json:'JSON 문법 실패',schema:'Schema 실패',pending:'자동 검사 통과 · 근거 미평가',pass:'자동 검사 통과 · 근거 적합',fail:'자동 검사 통과 · 근거 부적합'};let cases=C.CASES.filter(c=>c.set==='D'),records=[];cases.forEach((c,i)=>{let kind=S.metricStates[i];if(kind==='unexecuted')return;let obj=c.id==='D03'?C.insufficient('보관 기간'):C.answer(c.id==='D01'?'개인 폴더에 보관합니다.':'프로젝트 폴더에서 서버를 실행합니다.',c.ids);records.push({case_id:c.id,variant:'A',attempt:1,source_mode:'fixture',raw_text:kind==='json'?'{"status":':kind==='schema'?'{}':C.raw(obj),evidence_ok:kind==='pass'?true:kind==='fail'?false:null});});let m=C.metrics(records,cases).A;return `<div class="row between">${chip('분모 설명용 가상 기록 · 실제 평가 아님','fixture')}${btn('한 건만 평가한 예시','metricPreset','data-preset="one"','small')}${btn('모두 미실행','metricPreset','data-preset="none"','small')}</div><div class="grid3 spaced">${cases.map((c,i)=>card(c.id,`<p>${c.question}</p><label class="smalltext">이 기록의 상태<select data-metric-index="${i}">${Object.entries(definitions).map(([k,v])=>`<option value="${k}" ${S.metricStates[i]===k?'selected':''}>${v}</option>`).join('')}</select></label>`,'tight')).join('')}</div><div class="metrics-explainer spaced">${card('첫 응답 JSON 통과',`<div class="fraction"><b>${m.json}</b><span>/</span><b>${m.N}</b></div><p>분모는 전체 대상 <b>3건</b>입니다.</p><div class="mini-meter"><span style="width:${m.json/m.N*100}%"></span></div><p class="smalltext muted">실행 ${m.executed} · 미실행 ${m.unexecuted}<br>실패·미실행을 지워 분모를 줄이지 않습니다.</p>`)}${card('사람이 평가한 근거 적합률',`<div class="fraction"><b>${m.humanN?m.humanPass:'—'}</b><span>/</span><b>${m.humanN||'—'}</b></div><p>분모는 <b>실제로 평가한 ${m.humanN}건</b>입니다.</p><div class="mini-meter human"><span style="width:${m.humanN?m.humanPass/m.humanN*100:0}%"></span></div><p class="smalltext muted">자동 검사 통과 후 사람 평가 전 ${m.humanPending}<br>자동 오류로 검토하지 못한 응답 ${m.unreviewable}</p>`,'soft')}${card('이 숫자만으로 말할 수 없는 것',`<p class="big">1/1<br>≠ 전체 3건 성공</p><p>한 건을 평가해 적합했다면 그 한 건에 대한 조건부 결과입니다. 나머지 기록의 상태를 함께 공개합니다.</p>`,'tight')}</div>${callout('이 보드는 분모를 설명하려고 만든 별도 fixture 상태입니다. 수동 관찰 A/B 기록이나 실제 모델 성능표를 변경하지 않습니다.','warn')}`;}
function outputMethods(){const opts=[['Prompt 요청','생성 전에','“JSON 객체 하나로 답하세요.”','형식을 요청하지만, 요청을 따랐는지는 응답을 받아 확인해야 합니다.'],['로컬 JSON·Pydantic','응답을 받은 뒤','parse_answer(raw) / model_validate(data)','받은 문자열의 문법·구조를 검사합니다. 모델의 생성 자체를 제약하는 설정이 아닙니다.'],['API 생성 제약','후속 API 연결에서','API가 지원하는 Schema로 Structured Outputs 설정','교안에서는 개념을 비교합니다. 실제 적용·지원 범위·거절·미완료 처리는 11/17에 연결합니다.']];let x=opts[S.method];return `<div class="method-track">${opts.map(([name,when],i)=>`<button class="method-node ${S.method===i?'active':''}" data-action="method" data-n="${i}"><small>${when}</small><b>${name}</b><span>${i===2?'후속 범위':'오늘 연결'}</span></button>`).join('')}</div><div class="cols spaced">${card(x[0],`<div class="quote">${x[2]}</div><p class="spaced">${x[3]}</p>`)}${card('공통으로 남는 검사',`<p class="big">형식 준수<br>≠ 내용의 정확성</p><p>구조를 지켜도 답의 주장을 출처가 뒷받침하는지 따로 확인해야 합니다.</p><p class="smalltext muted">KnowledgeAnswer는 오늘의 답변 계약입니다. 기존 CRUD 입력 모델이나 도구 실행 스키마를 바꾸는 것이 아닙니다.</p>`,'soft')}</div>${teachingDetail('Schema 정의와 데이터 검사의 역할',`<p><code>model_json_schema()</code>는 로컬 Schema를 생성합니다.<br><code>model_validate(data)</code>는 받은 데이터를 검사합니다.</p><p>길이·양수·필수 필드를 선언해도 외부 provided_ids나 사람의 근거 검토까지 자동으로 표현되는 것은 아닙니다.</p>`)}`;}
function stateContractView(){let obj=S.stateContract==='answered'?C.answer('개인 폴더에 보관합니다.',[101]):C.insufficient('보관 기간');if(S.statePreset==='source')obj.source_ids=S.stateContract==='answered'?[]:[101];if(S.statePreset==='missing')obj.missing_information=S.stateContract==='answered'?'보관 기간':'';if(S.statePreset==='answer')obj.answer=S.stateContract==='answered'?'   ':'보관 기간은 3년입니다.';let v=C.validate(C.raw(obj),[101]);let presets={valid:'올바른 조합',source:'상태와 맞지 않는 출처 목록',missing:'상태와 맞지 않는 missing_information',answer:S.stateContract==='answered'?'공백만 있는 answer':'고정 부족 안내문 위반'};return `<div class="tabs">${['answered','insufficient_context'].map(k=>btn(k==='answered'?'answered · 답변 가능':'insufficient_context · 정보 부족','stateContract',`data-mode="${k}"`,S.stateContract===k?'selected':'')).join('')}</div><div class="cols">${card('필드 조합 바꾸기',`<label>확인할 조합<select id="statePreset">${Object.entries(presets).map(([k,v])=>`<option value="${k}" ${S.statePreset===k?'selected':''}>${v}</option>`).join('')}</select></label><div class="spaced">${codePanelSnippet(C.raw(obj))}</div>`)}${card('어느 단계의 오류인가?',`${gates(v)}${callout(`<b>${v.error||'자동 규칙 통과'}</b><br>${esc(v.detail)}`,v.error?'fail':'ok')}<p class="spaced">이 예시는 필드와 자료형이 그대로여도 업무 규칙에서 실패할 수 있음을 보여 줍니다.</p>`,'soft')}</div><div class="io-strip spaced"><div><b>answered</b><span>출처 ≥ 1개 · missing_information=""</span></div><div><b>insufficient_context</b><span>출처 [] · 부족한 정보의 이름 · 고정 안내문</span></div><div><b>공통</b><span>공백 답 금지 · 출처 중복 금지 · 전달 ID 안</span></div></div>`;}
function schemaFocus(){const vals=['101','"101"','true','101.0','0','-1','999'];let raw=`{"status":"answered","answer":"개인 폴더에 보관합니다.","source_ids":[${S.schemaValue}],"missing_information":""}`,v=C.validate(raw,[101]);let notes={'101':'양의 정수입니다. 자료형과 제공 ID 검사를 통과합니다.','"101"':'JSON 문자열입니다. strict 계약에서는 정수로 자동 변환하지 않습니다.',true:'JSON 불리언입니다. 이 계약의 출처 정수로 받지 않습니다.','101.0':'Python 기본 JSON 파싱에서는 실수입니다. 이 교안의 strict 정수 계약을 통과하지 못합니다.','0':'정수이지만 양수가 아닙니다.','-1':'정수이지만 양수가 아닙니다.','999':'양의 정수여서 구조는 통과합니다. 그러나 이번 provided_ids=[101] 밖입니다.'};return `<div class="literal-buttons">${vals.map(v=>btn(`<code>${esc(v)}</code>`,'schemaValue',`data-value="${esc(v)}"`,S.schemaValue===v?'selected':'')).join('')}</div><div class="cols spaced">${card('확대할 필드 하나',`<div class="source-id-zoom"><small>source_ids[0] · 출처 목록의 첫 항목</small><b>${esc(S.schemaValue)}</b></div><p>${notes[S.schemaValue]}</p><div class="rule-equation"><code>int</code><span>+</span><code>strict=True</code><span>+</span><code>gt=0</code></div><p class="smalltext">int는 정수, gt는 greater than(초과)입니다. gt=0은 0보다 커야 한다는 조건입니다.</p>`)}${card('같은 검사기에 넣은 결과',`${gates(v)}${callout(`<b>${v.error||'자동 검사 통과 · 사람 검토 대기'}</b><br>${esc(v.detail)}`,v.error?'fail':'ok')}<p class="smalltext spaced">브라우저 JavaScript에서는 101과 101.0의 표기가 사라질 수 있어, 데모 파서는 숫자 표기를 구분한 뒤 교안 규칙을 적용합니다. Python/Pydantic 전체 런타임의 구현은 아닙니다.</p>`,'soft')}</div>`;}
function validationWalk(){let f=C.FIXTURES[S.gateSample],v=C.validate(f.raw,f.ids),step=S.gateStep;let names=['JSON 문법','Schema 구조','참조·상태 규칙','사람의 근거 검토'];let failure=v.stages.indexOf('fail'),failed=failure>=0&&failure<=step;let shown={...v,stages:v.stages.map((x,i)=>failed&&i>failure?'skipped':i<=step?x:'pending')};let texts=['문자열을 JSON 데이터로 읽을 수 있는가? 괄호·따옴표·JSON 밖 문자를 확인합니다.','네 필드가 모두 있고, 자료형·길이·추가 필드 규칙을 지키는가?','이번에 전달한 ID인가? 중복은 없는가? 상태별 필드 조합이 맞는가?','질문에 답하는 데 필요한 정보를 답했는가? 인용한 원문이 답의 주장을 뒷받침하는가?'];let blocked=v.stages[step]==='skipped';return `<div class="row between"><label class="journey-choice">따라갈 응답<select id="gateSample">${['good','broken','string_id','unknown','false_evidence','missing'].map(k=>`<option value="${k}" ${S.gateSample===k?'selected':''}>${C.FIXTURES[k].label}</option>`).join('')}</select></label>${chip('Fixture 입력 · 브라우저에서 검사','fixture')}</div><div class="spaced">${gates(shown)}</div><div class="stagebar">${btn('처음','gateReset','','small')}${btn('이전 검사','gatePrev',step===0?'disabled':'','small')}${btn('다음 검사','gateNext',step===3?'disabled':'','primary')}</div><div class="cols spaced">${card(`${step+1}. ${names[step]}`,`<p class="big">${blocked?'미수행':step===3?'사람 검토 대기':v.stages[step]==='pass'?'통과':'실패'}</p><p>${texts[step]}</p>${callout(blocked?'앞 단계가 실패했으므로 이 단계는 진행하지 않습니다. 결과를 임의로 통과로 채우지 않습니다.':step===3?'앞의 자동 검사를 통과해도 evidence_ok는 아직 미평가입니다.':v.stages[step]==='fail'?`${v.error} · ${esc(v.detail)}`:'이 단계가 확인한 것만 통과입니다. 다음 단계의 성공을 의미하지 않습니다.',blocked||v.stages[step]==='fail'?'warn':'')}`)}${card('검사 대상 원문',`${codePanelSnippet(f.raw)}<p class="smalltext spaced">질문: ${f.question}<br>제공 ID: [${f.ids.join(', ')}]</p>`,'soft')}</div>`;}
function triageMap(){const kinds={broken:['JSON 괄호 누락','json_error','retry'],string_id:['문자열 출처','schema_error','retry'],unknown:['제공하지 않은 출처','unknown_source','stop'],status:['상태 조합 위반','status_rule','stop'],missing:['정상 정보 부족',null,'review'],good:['정상 답변',null,'review']};let [label,err,dest]=kinds[S.triageCase],f=C.FIXTURES[S.triageCase],v=C.validate(f.raw,f.ids);return `<div class="row between"><label class="journey-choice">응답 상황<select id="triageCase">${Object.entries(kinds).map(([k,x])=>`<option value="${k}" ${S.triageCase===k?'selected':''}>${x[0]}</option>`).join('')}</select></label>${chip('이번 교안의 제한된 정책','outline')}</div><div class="decision-source"><b>검사 결과</b><code>${v.error||'자동 검사 통과'}</code></div><div class="branch-stems"><span>형식 오류</span><span>참조·상태 위반</span><span>정상 업무 결과</span></div><div class="grid3">${[['retry','수정 요청 한 번','json_error · schema_error','최초 1회 + 수정 1회. 같은 질문·문맥·계약을 유지합니다.'],['stop','자동 재생성 없이 중단','unknown_source · status_rule 등','문맥·출처·규칙을 점검합니다. 임의로 유효한 ID로 바꾸지 않습니다.'],['review','생성 종료 → 사람 검토','answered · insufficient_context','정상 정보 부족도 생성 반복을 끝냅니다. 부족 판단의 적절성은 검토합니다.']].map(([id,t,sub,desc])=>card(t,`<p class="smalltext">${sub}</p><p>${desc}</p>${dest===id?chip('이번 입력이 가는 경로','local'):''}`,'branch-card '+(dest===id?'chosen':'dimmed'))).join('')}</div><div class="cols spaced">${card('이번 응답 원문',codePanelSnippet(f.raw))}${card('다시 요청해도 생기지 않는 것',`<p class="big">없는 사실<br>실행 권한</p><p>형식 복구는 자료에 없는 사실을 만들거나 권한을 우회하는 과정이 아닙니다.</p><p class="smalltext muted">모델 제공사의 거절·출력 중단·통신 실패는 이 계약의 내용 상태와 다릅니다. 후속 API 어댑터에서 분류합니다.</p>`,'soft')}</div>`;}

function builderStepsV4(){
 const choices={normal:['정상 선택',[102],false],'selected-duplicate':['선택 목록 중복',[102,101,102],false],missing:['없는 ID 선택',[999],false],'rows-duplicate':['원본 데이터의 ID 중복',[101],true]};

 const unique=[...new Set(selected)],rowBad=new Set(rows.map(r=>r.id)).size!==rows.length,unknown=unique.some(id=>!C.KNOWLEDGE.some(k=>k.id===id));
 const error=rowBad?'중복 ID를 확인하세요':unknown?'선택한 ID가 없습니다':null;

 const names=['원본 중복 검사','선택 중복 제거','없는 ID 검사','선택 순서 보존','JSON 직렬화'];
 const explains=[rowBad?'원본에 같은 ID가 두 번 있습니다. 이 지점에서 ValueError로 중단합니다.':'원본 ID는 101·102·103으로 서로 다릅니다. 원본 중복 검사를 통과합니다.',`dict.fromkeys는 첫 등장 순서를 보존합니다. [${selected}] → [${unique}]`,unknown?'원본에 없는 999를 선택했습니다. 조용히 제외하지 않고 ValueError로 중단합니다.':'선택한 ID가 모두 원본에 있습니다.',`chosen은 [${unique}] 순서로 원본 행을 가져옵니다. 숫자 정렬이나 의미 검색이 아닙니다.`,'선택한 행을 JSON 문자열로 직렬화합니다.'];
 return `<div class="row between"><label class="journey-choice">입력 상황<select id="builderCase">${Object.entries(choices).map(([k,v])=>`<option value="${k}" ${S.builderCase===k?'selected':''}>${v[0]}</option>`).join('')}</select></label>${chip('Python 예제와 같은 규칙으로 계산','local')}</div><div class="step-pills spaced">${names.map((n,i)=>`<span class="${i===actual?'on':''} ${i>stops?'not-run':''}">${i+1}. ${n}</span>`).join('')}</div><div class="stagebar">${btn('초기화','builderReset','','small')}${btn(done?'현재 경로 끝':'다음 단계','builderNext',done?'disabled':'','primary')}</div><div class="builder-story spaced">${card('이번 입력',`<p><b>원본 데이터의 ID</b><br>[${rows.map(k=>k.id).join(', ')}]</p><p><b>selected_ids</b><br>[${selected.join(', ')}]</p><p class="smalltext muted">원본 ID 중복과 선택 목록 중복은 서로 다른 상황입니다.</p>`)}${card(names[actual],`<p class="big">${error&&done?'중단':'선택 '+JSON.stringify(actual===0?selected:unique)}</p>${callout(explains[actual],error&&done?'fail':'')}${actual===4?`<div class="spaced">${codePanelSnippet(C.raw(C.buildContext(rows,selected)))}</div>`:''}${error&&done?'<p>뒤의 단계는 실행하지 않습니다. 오류를 숨기고 빈 배열을 반환하지 않습니다.</p>':''}`,'soft')}</div>`;
