/* v9: a VS Code-style dark editor for Python source only.
   The lesson canvas, summaries, input controls and source text stay unchanged. */
.inline-python{
  --editor-bg:#1e1e1e;--editor-fg:#d4d4d4;--editor-tabs:#252526;
  --editor-border:#3c3c3c;--editor-accent:#3794ff;--editor-gutter:#999999;
  margin-top:30px;padding-top:0;border-top:0;min-width:0;
}
.inline-python .python-block{
  background:var(--editor-bg);color:var(--editor-fg);
  border:1px solid var(--editor-border);border-radius:8px;
  padding:0;margin:0 0 22px;min-width:0;overflow:hidden;
  box-shadow:0 3px 14px #142d4e12;color-scheme:dark;
}
.python-editor-bar{
  display:flex;align-items:stretch;min-width:0;
  background:var(--editor-tabs);border-bottom:1px solid #333333;
}
.python-tab{
  display:flex;align-items:center;gap:9px;flex:0 0 auto;
  padding:11px 19px 12px;color:#f0f0f0;background:var(--editor-bg);
  border-top:2px solid var(--editor-accent);border-right:1px solid #333333;

}

  color:#78b7eb;font:600 12px/1 Consolas,'DejaVu Sans Mono',monospace;
  letter-spacing:-.5px;user-select:none;
}

  font:500 15px/1.6 PretendardLecture, 'Segoe UI','Noto Sans CJK KR','Malgun Gothic',sans-serif;

  min-width:0;word-break:keep-all;overflow-wrap:anywhere;
}

  font-family:'Cascadia Code',Consolas,'D2Coding','Noto Sans Mono CJK KR','DejaVu Sans Mono',monospace;
  font-size:15px;line-height:1.8;font-weight:400;
  color:var(--editor-fg);background:var(--editor-bg);

  display:flex;flex-direction:column;align-items:stretch;

  display:block;position:relative;margin:0;

  content:attr(data-line);position:absolute;left:0;top:0;

/* v9: a VS Code-style dark editor for Python source only.
   The lesson canvas, summaries, input controls and source text stay unchanged. */
.inline-python{
  --editor-bg:#1e1e1e;--editor-fg:#d4d4d4;--editor-tabs:#252526;
  --editor-border:#3c3c3c;--editor-accent:#3794ff;--editor-gutter:#999999;
  margin-top:30px;padding-top:0;border-top:0;min-width:0;
}
.inline-python .python-block{
  background:var(--editor-bg);color:var(--editor-fg);
  border:1px solid var(--editor-border);border-radius:8px;
  padding:0;margin:0 0 22px;min-width:0;overflow:hidden;
  box-shadow:0 3px 14px #142d4e12;color-scheme:dark;
}
.python-editor-bar{
  display:flex;align-items:stretch;min-width:0;
  background:var(--editor-tabs);border-bottom:1px solid #333333;
}
.python-tab{
  display:flex;align-items:center;gap:9px;flex:0 0 auto;
  padding:11px 19px 12px;color:#f0f0f0;background:var(--editor-bg);
  border-top:2px solid var(--editor-accent);border-right:1px solid #333333;
  font:500 14px/1.45 PretendardLecture, 'Segoe UI','Noto Sans CJK KR',sans-serif;
  user-select:none;
}
.python-file-mark{
  color:#78b7eb;font:600 12px/1 Consolas,'DejaVu Sans Mono',monospace;
  letter-spacing:-.5px;user-select:none;
}

  font:500 15px/1.6 PretendardLecture, 'Segoe UI','Noto Sans CJK KR','Malgun Gothic',sans-serif;
  color:#c8c8c8;margin:0;padding:11px 18px;align-self:center;
  min-width:0;word-break:keep-all;overflow-wrap:anywhere;
}
.inline-python .python-block pre{
  font-family:'Cascadia Code',Consolas,'D2Coding','Noto Sans Mono CJK KR','DejaVu Sans Mono',monospace;
  font-size:15px;line-height:1.8;font-weight:400;
  color:var(--editor-fg);background:var(--editor-bg);
  padding:18px 0 21px;margin:0;border:0;max-height:none;overflow:visible;
  white-space:normal;tab-size:4;font-variant-ligatures:none;
}

  display:flex;flex-direction:column;align-items:stretch;
  font:inherit;color:inherit;background:none;border:0;padding:0;
  white-space:normal;
}
.inline-python .python-line{
  display:block;position:relative;margin:0;
  padding:0 22px 0 68px;min-height:1.8em;line-height:1.8;

  border:0;box-shadow:none;background:transparent;
}

  content:attr(data-line);position:absolute;left:0;top:0;
  width:47px;padding-right:12px;color:var(--editor-gutter);

}

.inline-python .py-number{color:#b5cea8;font-weight:400}
.inline-python .py-function{color:#dcdcaa;font-weight:400}

 자바스크립트 없이도 볼 수 있습니다.</noscript><script>const DATA={"chapters":[{"id":1,"name":"프로젝트 이해·요구사항","keywords":"SRS · Use Case · Traceability"},{"id":2,"name":"데이터 및 DB 설계","keywords":"ERD · Read-only · Vector Freshness"},{"id":3,"name":"AI Agent 아키텍처 설계","keywords":"Architecture · Module · Interface · Tool Calling"},{"id":4,"name":"RAG Pipeline 설계","keywords":"Retriever · Reranker · Runnable · Grounding"},{"id":5,"name":"API·검증·신뢰성","keywords":"API Contract · Trace · Evaluation"},{"id":6,"name":"구현 전략·프로젝트","keywords":"Bottom-up · Live Coding · Acceptance"}],"scenes":[{"id":"cover","chapter":0,"title":"표지","claim":"","minutes":1,"body":"","source":"","focus":["agent"],"take":""},{"id":"contents","chapter":0,"title":"목차","claim":"","minutes":1,"body":"","source":"","focus":[],"take":""},{"id":"problem","chapter":1,"title":"현업의 문제: 보고서 내용과 현재 상태는 다른 정보다","claim":"기술 조직의 보고서를 근거로 설명하고, 현재 인덱싱 상태를 실제 DB에서 확인하는 서비스입니다.","minutes":1,"body":"<div class=\"cols\"><section class=\"card \"><h2>문서 내용에 대한 질문</h2><p>“RAG 근거 인용 정확도 향상 계획의 핵심은?”</p><p>보고서 원문을 찾아 Context를 구성하고 근거 기반으로 설명합니다.</p><div class=\"d25-mono\">rag_search(query, category_code, k)</div></section><section class=\"card soft\"><h2>구조화된 상태에 대한 질문</h2><p>“보고서 63의 현재 인덱싱 상태와 Revision은?”</p><p>DB의 현재 행을 직접 읽습니다. 문서에 적힌 과거 설명과 구별합니다.</p><div class=\"d25-mono\">lookup_status(report_id)</div></section></div><div class=\"callout \"><b>복합 질문:</b> “보고서 63의 내용과 현재 인덱싱 상태를 함께 알려줘.” → 두 정보원이 필요합니다.</div>","source":"SRS §1·§7","focus":["agent","rag","lookup"],"take":"Single Agent가 문서의 기술적 근거와 DB의 현재 상태를 결합합니다."},{"id":"before-after","chapter":1,"title":"11월 20일 서비스와 오늘의 Agent는 무엇이 다른가?","claim":"기존 데이터는 재사용하되, 애플리케이션은 독립적으로 새로 설계합니다.","minutes":2,"body":"<div class=\"cols\"><section class=\"card \"><h2>Day25 · 보고서 관리 서비스</h2><div class=\"flow d25-flow\"><div class=\"node\"><strong>요청</strong><small>action / CRUD</small></div> <span class=\"arrow\" aria-hidden=\"true\">→</span><div class=\"node\"><strong>Service</strong><small>등록·조회·검색·요약</small></div> <span class=\"arrow\" aria-hidden=\"true\">→</span><div class=\"node\"><strong>DB</strong><small>원문 + 벡터</small></div></div><p>Basic은 사용자가 action을 지정하는 고정 Router였습니다. 실제 LLM Tool Calling은 상위 단계였습니다.</p></section><section class=\"card soft\"><h2>Day30 · AI Technical Report Agent</h2><div class=\"flow d25-flow\"><div class=\"node\"><strong>질문</strong><small>자연어</small></div> <span class=\"arrow\" aria-hidden=\"true\">→</span><div class=\"node\"><strong>Agent</strong><small>LLM Tool 선택</small></div> <span class=\"arrow\" aria-hidden=\"true\">→</span><div class=\"node\"><strong>Tools</strong><small>RAG / 상태 조회</small></div></div><p>Basic부터 실제 create_agent를 사용합니다. 보고서 등록·수정·삭제를 구현하지 않습니다.</p></section></div><div class=\"callout \">재사용: 기존 <b>report_agent_lab</b> 및 이미 적재된 데이터·Vector. 금지: 이전 Python 코드·API·프로젝트 폴더 재사용, 신규 DDL·Seed·재색인.</div>","source":"SRS 시작·§1·§4·§5; Day25 오전 강의","focus":["db","agent"],"take":"이전 시스템은 데이터의 생산·관리, 오늘 시스템은 데이터의 활용·질의에 집중합니다."},{"id":"trace","chapter":1,"title":"요구사항을 설계·코드·테스트까지 추적한다","claim":"SRS(Software Requirements Specification)는 무엇을 만들고 어떤 조건에서 완료인지 정하는 기준입니다.","minutes":2,"body":"<div data-widget=\"trace\" class=\"d30-widget\"></div>","source":"SRS §9·§10; common/docs/requirements_traceability.csv","focus":["repo","retriever","validate"],"take":"Traceability: Requirement → Design → Interface → Implementation → Acceptance Test."},{"id":"boundary","chapter":2,"title":"기존 DB와 신규 애플리케이션의 경계","claim":"DB가 이미 존재하는 프로젝트에서는 재설치보다 계약 확인과 데이터 보호가 먼저입니다.","minutes":1,"body":"<div class=\"cols\"><section class=\"card \"><h2>Preflight · 먼저 확인</h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Gate</th><th scope=\"col\">확인 대상</th></tr></thead><tbody><tr><td>P-01</td><td>현재 DB = report_agent_lab</td></tr><tr><td>P-02</td><td>테이블·VIEW·6종 Category</td></tr><tr><td>P-03</td><td>유효 Vector 수와 검색 가능 여부</td></tr><tr><td>P-04</td><td>CUDA 사용 가능 여부 · cuda:0</td></tr><tr><td>P-05</td><td>API Key·Model ID 설정 (실제 호출 검증은 별도)</td></tr></tbody></table></div></section><section class=\"card soft\"><h2>Read-only 접근</h2><p>Repository가 고정 SELECT와 Bind Parameter를 사용합니다. Connection은 읽기 전용 Transaction으로 실행합니다.</p><p>기존 DB의 현재 상태를 보존합니다. 보고서 수를 180건으로 강제로 맞추지 않습니다.</p><div class=\"d25-mono\">SET TRANSACTION READ ONLY</div><p>실제 운영에서는 별도 최소권한 SELECT 계정과 인증을 추가 설계합니다. 이번 실습의 범위는 로컬입니다.</p></section></div><div class=\"callout \">기존 DB나 Vector가 부족하면 문제를 기록하고 사전 준비를 확인합니다. Day30 코드에서 자동 복구를 위한 쓰기 작업을 하지 않습니다.</div><details class=\"teaching-detail\"><summary>Health가 통과해도 실제 추론 성공은 아니다</summary><div class=\"detail-content\"><p>Basic의 <code>/health</code>는 DB와 6종 Category, pgvector, 유효 Vector 수(1개 이상), CUDA 사용 가능 여부, API Key·Model ID 설정을 확인합니다. 전체 10개 테이블·원문 데이터와 검색 품질은 제공 SQL·Live Test로 별도 확인합니다. E5·Reranker의 실제 모델 로드와 LLM 인증·Tool Calling은 이 단계에서 시험하지 않습니다. CPU Fallback은 금지합니다.</p></div></details>","source":"SRS §2·§4·§12; app/db/connection.py, app/core/preflight.py, repository.py","focus":["db","repo"],"take":"Read-only Transaction은 기존 로그인 계정 자체에 쓰기 권한이 없다는 의미는 아닙니다."},{"id":"erd","chapter":2,"title":"기존 전체 ERD에서 이번 Agent가 읽는 관계를 찾는다","claim":"10개 물리 테이블과 통합 읽기 VIEW를 재사용합니다. 새로운 테이블의 설계도가 아닙니다.","minutes":2,"body":"<div data-widget=\"erd\" class=\"d30-widget\"></div>","source":"SRS §4; common/docs/report_agent_full_erd_v1_3.svg","focus":["db","repo"],"take":"report_id가 원문·개요·벡터·출처를 연결하는 식별자입니다."},{"id":"data","chapter":2,"title":"같은 보고서라도 데이터마다 역할이 다르다","claim":"검색용 Overview와 답변의 근거가 되는 Content를 분리해야 합니다.","minutes":2,"body":"<div class=\"cols\"><section class=\"card \"><h2>저장된 데이터 · PostgreSQL</h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">데이터</th><th scope=\"col\">저장 위치 / 역할</th></tr></thead><tbody><tr><td>Content</td><td>6종 상세 테이블 → report_read_view / 답변 근거</td></tr><tr><td>Overview</td><td>reports.overview / 검색 대표 텍스트</td></tr><tr><td>Embedding</td><td>report_embeddings.embedding / vector(384)</td></tr><tr><td>Revision·Hash</td><td>reports.revision / indexed_revision 및 Overview SHA-256</td></tr></tbody></table></div></section><section class=\"card soft\"><h2>실행 중 만들어지는 데이터</h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">데이터</th><th scope=\"col\">역할</th></tr></thead><tbody><tr><td>Query Vector</td><td>사용자 검색어의 384차원 E5 벡터</td></tr><tr><td>Document</td><td>원문 + Metadata를 가진 LangChain 객체</td></tr><tr><td>Source ID</td><td>RPT-63처럼 report_id에 대응하는 근거 식별자</td></tr><tr><td>Context</td><td>최종 후보의 실제 LLM 입력 자료</td></tr></tbody></table></div></section></div><div class=\"callout \">이번 Basic은 <b>Report-level RAG</b>: 보고서당 Overview Vector 1개를 활용합니다. Chunk별 Vector를 DB에 새로 저장하지 않습니다.</div><details class=\"teaching-detail\"><summary>Report-level RAG를 선택한 이유와 한계</summary><div class=\"detail-content\"><p>이번 DB에는 보고서별 Overview Embedding이 1개씩 있습니다. 기존 데이터를 그대로 검색하고 본문을 확장하여 읽는 방식은 재색인 비용과 구조 변경을 줄입니다. 다만 Overview가 본문의 세부 내용을 대표하지 못하면 검색 누락이 발생할 수 있습니다. Chunk-level RAG는 더 세밀한 검색에 유리할 수 있으나 별도 Chunk 색인과 갱신 정책이 필요합니다. Intermediate의 선택적 In-memory Chunking은 조회 후 Context를 나누는 작업이지 새로운 Vector Search가 아닙니다.</p></div></details>","source":"SRS §4·§6; app/rag/documents.py","focus":["db","doc","context"],"take":"검색은 개요 벡터로, 답변은 원문으로, 근거 추적은 Metadata로 수행합니다."},{"id":"fresh","chapter":2,"title":"Vector가 있다고 해서 모두 검색 대상은 아니다","claim":"검색 전에 유효성을 검증합니다. 오래된 벡터나 다른 모델로 만든 벡터는 비교 대상에서 제외합니다.","minutes":2,"body":"<div data-widget=\"fresh\" class=\"d30-widget\"></div>","source":"SRS B-05·T-03; app/db/repository.py FRESH","focus":["repo","retriever","db","index"],"take":"WHERE에서 유효성·Category·명시 ID 조건을 적용하고, Cosine Distance 오름차순으로 Top-k를 선택합니다."},{"id":"architecture","chapter":3,"title":"전체 시스템 아키텍처: 단일 Agent와 두 Tool","claim":"전체 지도에서 실제 요청·Tool 선택·RAG·DB 조회·최종 검증의 위치를 확인합니다.","minutes":3,"body":"<div data-widget=\"map\" class=\"d30-widget\"></div>","source":"SRS §3·§6·§7; mentor/01_basic 실제 호출 구조","focus":["agent","rag","lookup"],"take":"Single Agent, Tool 2개, 기존 PostgreSQL, cuda:0에서 실행하는 E5·Cross-Encoder, 외부 LLM API로 구성합니다."},{"id":"responsibility","chapter":3,"title":"기능을 어떻게 나누어야 하는가?","claim":"폴더를 많이 만드는 것이 목표가 아니라, 변경과 테스트의 범위를 줄이는 것이 목표입니다.","minutes":2,"body":"<div class=\"cols\"><section class=\"card \"><h2>한 파일에 모든 책임이 섞인 경우</h2><div class=\"d30-monolith\"><b>main.py</b><div class=\"grid3\"><div>HTTP</div><div>SQL</div><div>E5</div><div>Rerank</div><div>Prompt</div><div>Agent</div><div>검증</div><div>오류 처리</div><div>측정</div></div></div><p>SQL 오류, GPU 오류, JSON 오류가 뒤섞입니다. 다른 서비스에서 검색 기능만 재사용하기도 어렵습니다.</p></section><section class=\"card soft\"><h2>책임을 분리한 경우</h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">모듈</th><th scope=\"col\">책임</th></tr></thead><tbody><tr><td>api/ · schemas/</td><td>HTTP 계약과 자료형 검증</td></tr><tr><td>agent.py · tools/</td><td>Tool Calling Loop 및 Tool Contract</td></tr><tr><td>rag/</td><td>검색·순위 조정·Context·생성</td></tr><tr><td>db/</td><td>연결과 고정 SELECT</td></tr><tr><td>services/ · core/</td><td>검증·호출 상한·오류·객체 조립</td></tr></tbody></table></div></section></div><div class=\"callout \"><b>설계 원칙:</b> Separation of Concerns(관심사 분리), Single Responsibility(단일 책임), High Cohesion(높은 응집도), Low Coupling(낮은 결합도). 과도한 계층은 오히려 복잡도를 높입니다.</div>","source":"SRS §5; mentor/01_basic 실제 폴더","focus":["api","agent","rag","repo","validate"],"take":"기능이 바뀔 때 수정해야 할 범위를 작게 만들도록 모듈을 분리합니다."},{"id":"dependency","chapter":3,"title":"의존성의 방향과 Runtime의 역할","claim":"Dependency는 모듈이 동작하기 위해 필요로 하는 객체입니다. Runtime은 필요한 객체를 외부에서 전달해 역할을 분리합니다.","minutes":2,"body":"<div data-widget=\"dependencies\" class=\"d30-widget\"></div>","source":"app/core/runtime.py; app/main.py; SRS A-01·T-15","focus":["api","agent","repo","rag"],"take":"Dependency Injection(DI): 실제 구현 객체와 Test Double을 교체할 수 있도록 의존 객체를 전달합니다."},{"id":"choice","chapter":3,"title":"모든 AI 서비스가 Agent일 필요는 없다","claim":"업무가 정해진 순서인지, 사용자가 요구하는 기능이 달라지는지 먼저 판단합니다.","minutes":2,"body":"<div data-widget=\"choice\" class=\"d30-widget\"></div>","source":"SRS §1·§7; Day25 Basic Action Router 비교","focus":["agent","rag","lookup"],"take":"필요한 기능을 동적으로 선택해야 하는 이번 과제에는 Agent가 적합합니다."},{"id":"tools","chapter":3,"title":"Tool은 모델에 제공하는 업무 인터페이스다","claim":"모델은 도구 이름과 인수를 제안합니다. 실제 실행과 데이터 접근은 서버 코드가 수행합니다.","minutes":2,"body":"<div data-widget=\"tools\" class=\"d30-widget\"></div>","source":"SRS §7.1; app/tools/{rag_tool,db_tool}.py; app/schemas/agent.py","focus":["agent","rag","lookup"],"take":"Tool Schema는 호출 계약, Output Contract는 실제 반환값의 계약입니다. 임의 SQL 실행 권한을 주지 않습니다."},{"id":"sequence","chapter":3,"title":"Agent 내부에서는 실제로 무엇이 일어나는가?","claim":"create_agent는 모델 호출과 Tool 실행을 반복하고 ToolMessage를 다시 모델에 전달합니다.","minutes":2,"body":"<div data-widget=\"sequence\" class=\"d30-widget\"></div>","source":"SRS §7.2; app/agent.py, app/services/validator.py","focus":["agent","llm","rag","lookup"],"take":"모델의 도구 호출 요청과 서버의 실제 실행을 구분합니다. 실행 순서는 모델에 따라 달라집니다."},{"id":"control","chapter":3,"title":"LLM에게 맡기는 판단과 코드로 통제하는 영역","claim":"Agent에게 자율성을 부여해도 데이터 접근 권한과 종료 조건은 개발자가 통제해야 합니다.","minutes":2,"body":"<div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">구분</th><th scope=\"col\">LLM의 판단 (확률적)</th><th scope=\"col\">서버의 통제 (결정론적)</th></tr></thead><tbody><tr><td>Tool</td><td>어떤 기능이 필요할까?</td><td>등록된 rag_search · lookup_status만</td></tr><tr><td>인수</td><td>어떤 query·report_id?</td><td>Pydantic 타입·범위·명시 ID, RAG Category 제한</td></tr><tr><td>DB</td><td>어떤 정보를 원하나?</td><td>고정 SQL + Parameter Binding + Read-only</td></tr><tr><td>반복</td><td>추가 Tool이 필요한가?</td><td>기본 Tool 4회 · Model 14회 상한 · LLM 요청 Timeout 30초</td></tr><tr><td>답변</td><td>근거를 어떻게 설명할까?</td><td>실제 출처·Tool Trace·출력 Schema 검증</td></tr><tr><td>보안</td><td>본문의 문장을 읽음</td><td>원문은 Untrusted Data · 비밀값 비노출 정책</td></tr></tbody></table></div><div class=\"callout \">상한은 설정값이며, 현재 구현은 전체 HTTP 요청에 대한 강제 wall-clock 취소까지 구현한 것은 아닙니다. Category는 검색 필터이지 사용자 인증이 아닙니다.</div><details class=\"teaching-detail\"><summary>운영 설계에서 추가로 고려해야 하는 범위</summary><div class=\"detail-content\"><p>Model Call 상한은 Agent뿐 아니라 내부 RAG LLM 호출도 Meter에서 함께 집계합니다. Prompt Injection 방어를 위한 지시와 제한된 Tool은 위험을 줄이지만 완전한 보안 보장은 아닙니다. 현재는 인증·사용자별 Authorization이 없는 로컬 서비스입니다. 실제 서비스에서는 접근 권한, 민감정보 필터링, 외부 LLM으로 전송하는 데이터의 범위를 별도로 설계해야 합니다.</p></div></details>","source":"SRS §7·§12; app/services/metrics.py, app/agent.py, .env.example","focus":["agent","validate","repo"],"take":"모델에 맡길 범위가 작고 명확할수록 검증과 운영이 쉬워집니다."},{"id":"rerank","chapter":4,"title":"Retriever와 Reranker를 분리하는 이유","claim":"Bi-Encoder는 빠르게 후보를 찾고, Cross-Encoder는 같은 후보를 질문과 함께 다시 평가합니다.","minutes":2,"body":"<div data-widget=\"rerank\" class=\"d30-widget\"></div>","source":"SRS §6·B-07; app/rag/reranker.py, pipeline.py","focus":["embed","retriever","rerank"],"take":"Top-k 후보를 늘리면 검색 기회가 늘지만 재정렬 계산량도 증가합니다. 점수는 확률이 아닙니다."},{"id":"document","chapter":4,"title":"Document · Metadata · Context의 설계","claim":"검색에서 찾은 report_id를 원문과 연결하고, 최종 LLM 입력에 실제로 포함된 근거를 기록합니다.","minutes":1,"body":"<div data-widget=\"document\" class=\"d30-widget\"></div>","source":"SRS §6; app/rag/documents.py, pipeline.py","focus":["doc","context"],"take":"보고서 단위의 식별자를 유지해야 답변의 출처를 다시 검증할 수 있습니다."},{"id":"runnable","chapter":4,"title":"LangChain Runnable RAG를 Tool 안에 구성한다","claim":"LangChain은 LLM·검색·Tool을 연결하는 Framework입니다. Runnable과 LCEL로 고정 RAG를 구성하고 Agent가 호출합니다.","minutes":2,"body":"<div class=\"flow d25-flow\"><div class=\"node\"><strong>Prepare</strong><small>RunnableLambda · 검색·Context</small></div> <span class=\"arrow\" aria-hidden=\"true\">→</span><div class=\"node\"><strong>Prompt</strong><small>ChatPromptTemplate</small></div> <span class=\"arrow\" aria-hidden=\"true\">→</span><div class=\"node\"><strong>Chat Model</strong><small>근거 기반 JSON 생성</small></div> <span class=\"arrow\" aria-hidden=\"true\">→</span><div class=\"node\"><strong>Validator</strong><small>Chain 실행 후 검사</small></div></div><div class=\"d30-explain\"><b>Runnable</b>: <code>invoke(input)</code>으로 실행할 수 있는 공통 인터페이스. <b>LCEL</b>(LangChain Expression Language)의 <code>|</code>는 앞 Runnable의 출력을 다음 Runnable의 입력으로 연결합니다.</div><div data-codebox=\"runnable\"></div><div class=\"callout \">이 호출은 Agent의 모델 호출과 별개입니다. Agent가 rag_search를 실행하면 내부 RAG도 LLM을 사용할 수 있습니다. 실제 코드에는 예산·오류·출처 검증이 추가됩니다.</div><details class=\"teaching-detail\"><summary>원래 질문(question)과 검색 질문(query), 그리고 호출 비용</summary><div class=\"detail-content\"><p><code>question</code>은 사용자의 원래 업무 요청, <code>query</code>는 문서 검색에 사용하는 텍스트입니다. <code>context</code>는 선택된 원문 자료입니다. 이 세 값으로 ChatPromptTemplate이 메시지를 구성합니다. 예를 들어 한 번의 rag_search를 실행하고 바로 최종 답변을 만드는 경우 Agent 모델 호출 2회(선택·최종) + RAG 모델 호출 1회로 총 3회입니다. 실제 횟수는 Tool 선택과 반복에 따라 달라집니다. Query Rewrite·Multi-query는 Intermediate 확장입니다.</p></div></details>","source":"SRS B-08; app/rag/pipeline.py (발췌·주석 보강)","focus":["context","prompt","llm","ragvalidate"],"take":"RAG는 정해진 순서의 작업 모듈, Agent는 필요에 따라 그 모듈을 호출하는 제어 계층입니다."},{"id":"citation","chapter":4,"title":"답변 근거와 출처의 검증 범위를 설계한다","claim":"검색한 모든 후보를 출처로 허용하지 않습니다. Context에 실제 포함된 ID와 답변에서 인용한 ID를 대조합니다.","minutes":2,"body":"<div data-widget=\"citation\" class=\"d30-widget\"></div>","source":"SRS B-13·T-09; app/services/validator.py citation_ids(), app/rag/pipeline.py","focus":["context","ragvalidate","validate"],"take":"RAG 내부와 최종 Agent 모두 Citation을 검사합니다. ID 일치는 Faithfulness를 보장하지 않습니다."},{"id":"noanswer","chapter":4,"title":"검색 결과가 있다고 답할 수 있는 것은 아니다","claim":"가장 가까운 후보는 항상 존재할 수 있지만, 질문에 답할 실제 근거가 없을 수 있습니다.","minutes":1,"body":"<div data-widget=\"noanswer\" class=\"d30-widget\"></div>","source":"SRS §6·§10; app/rag/pipeline.py, validator.py","focus":["retriever","context","validate"],"take":"후보 없음과 근거 부족은 모두 RAG Tool의 not_found가 될 수 있습니다. 최종 상태는 필요한 Tool의 결과까지 보고 결정합니다."},{"id":"api","chapter":5,"title":"API Contract: 사용자 요청과 Tool 인수는 다르다","claim":"외부 HTTP 요청은 간단하게 유지하고 내부 Tool 입력과 서버 정책은 따로 정의합니다.","minutes":2,"body":"<div data-widget=\"api\" class=\"d30-widget\"></div>","source":"SRS §8; app/schemas/agent.py, app/api/agent.py","focus":["api","agent","validate"],"take":"사용자는 question과 category_code만 전달합니다. 모델과 호출 예산은 서버 설정입니다."},{"id":"status","chapter":5,"title":"HTTP 200과 업무 완료는 같은 의미가 아니다","claim":"HTTP는 통신·처리 결과를 표현하고, 업무 상태는 근거와 필요한 작업의 충족 여부를 표현합니다.","minutes":2,"body":"<div data-widget=\"status\" class=\"d30-widget\"></div>","source":"SRS §8.3·§8.6; app/services/{errors,validator}.py","focus":["validate","api","client"],"take":"completed는 서버의 구조적 검증 기준을 충족한 상태입니다. 모든 자연어 의도나 문장별 사실성의 보증은 아닙니다."},{"id":"trace-id","chapter":5,"title":"실제 Agent 실행을 어떻게 증명하는가?","claim":"AIMessage의 호출 요청, ToolMessage의 결과, 서버 Execution Ledger를 같은 Call ID로 대조합니다.","minutes":2,"body":"<div data-widget=\"traceid\" class=\"d30-widget\"></div>","source":"SRS T-07·T-09; app/services/validator.py trace_from_messages(), app/services/metrics.py","focus":["agent","validate"],"take":"모델이 최종 JSON에 직접 써 넣은 tool_trace를 실행 증거로 인정하지 않습니다."},{"id":"evaluation","chapter":5,"title":"AI 서비스의 품질은 세 영역에서 검증한다","claim":"검색 성공, 답변의 근거, Agent 업무 완료는 각각 다른 평가 대상입니다.","minutes":2,"body":"<div data-widget=\"evaluation\" class=\"d30-widget\"></div>","source":"SRS §10.2~10.4; common/data/evaluation/gold.json","focus":["eval","review","retriever"],"take":"Basic은 실제 Tool·출처·오류 검증 필수, 응용 Recall@k·MRR, 심화 graded nDCG 및 회귀·운영 검증."},{"id":"roadmap","chapter":6,"title":"구현은 작은 기능부터 검증하며 연결한다","claim":"설계는 전체 구조를 먼저 파악하고, 실제 개발은 선행 의존성부터 Bottom-up으로 진행합니다.","minutes":2,"body":"<div data-widget=\"roadmap\" class=\"d30-widget\"></div>","source":"common/docs/IMPLEMENTATION_ORDER.md; 민준튜터 프로젝트 구현 흐름 완주 안내서","focus":["repo","embed","rag","agent"],"take":"실행되는 작은 단계부터 완성하면 장애 위치가 좁혀집니다. 이 순서로 80분 시연합니다."},{"id":"levels","chapter":6,"title":"오후 개인 프로젝트: 난이도별 시작점과 목표","claim":"같은 요구사항명세서와 기존 DB를 사용하되 제공되는 코드의 양과 구현 범위가 다릅니다.","minutes":1,"body":"<div data-widget=\"levels\" class=\"d30-widget\"></div>","source":"SRS §5·§9; 실제 mentee/mentor ZIP","focus":["agent","validate"],"take":"Basic 11개 TODO · 응용 폴더만 · 심화 빈 폴더. 상위 단계는 하위 요구사항을 포함합니다."},{"id":"done","chapter":6,"title":"완료는 실제 실행 증거로 판단한다","claim":"코드 작성 완료, 단위 테스트 통과, 실제 환경 통합 완료를 서로 구분합니다.","minutes":2,"body":"<div class=\"cols\"><section class=\"card \"><h2>제출물 · 실제 증거</h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">대상</th><th scope=\"col\">남길 증거</th></tr></thead><tbody><tr><td>새 프로젝트</td><td>소스·requirements·README</td></tr><tr><td>DB·GPU</td><td>Preflight, 384차원, 동일 후보 Rerank, 전후 Snapshot</td></tr><tr><td>API·Agent</td><td>Health, 정상/오류 Postman, Tool Trace, Citation</td></tr><tr><td>검증 보고</td><td>T-01~10 + 해당 상위 시나리오, 미완료·해결 내역</td></tr></tbody></table></div></section><section class=\"card soft\"><h2>오후 시작 전 설계 메모</h2><div class=\"stack\"><div class=\"knowledge\"><b>01 · Requirement</b><p>어떤 업무 질문에 답할까?</p></div><div class=\"knowledge\"><b>02 · Architecture</b><p>어떤 구성요소가 필요한가?</p></div><div class=\"knowledge\"><b>03 · Interface</b><p>입출력과 책임은 무엇인가?</p></div><div class=\"knowledge\"><b>04 · Verification</b><p>어떤 결과가 나와야 완료인가?</p></div></div></section></div><div class=\"callout \">설계 메모는 권장 사항입니다. 실제 완료 기준은 기존 SRS와 checklist를 사용합니다. API Key·비밀번호·.env·DB Dump는 제출하지 않습니다.</div>","source":"SRS §10·§11; common/docs/acceptance_checklist.csv","focus":["validate","api","client"],"take":"HTTP 200 한 개가 아니라, 요구사항별 검증 증거를 남기고 미완료를 정직하게 기록합니다."}]};
const CODES={"runnable": {"raw": "# app/rag/pipeline.py · 일부 발췌 (설명용 줄바꿈)\nprepared = RunnableLambda(prepare).invoke(None)  # 검색·Context 준비\n# 유효한 sources가 없으면 LLM 호출 없이 not_found 반환 (생략)\nchain = (\n    RunnableLambda(lambda data: {key: data[key] for key in\n                                ('question', 'query', 'context')})\n    | RAG_PROMPT | model  # LCEL: 앞 단계 출력 → 다음 단계 입력\n)\nmessage = chain.invoke(prepared)  # Chat Model을 실제 호출 (Agent 모델 호출과 별개)", "name": "app/rag/pipeline.py", "lang": "python"}, "runtime": {"raw": "# Runtime이 객체를 생성하고 의존성을 전달 (발췌)\nself.pipeline = RagPipeline(self.settings,\n    Retriever(self.repo, self.embedder),\n    self.reranker, self.model_factory)\nself.agent = AgentService(self.settings, self.repo,\n    self.pipeline, self.model_factory)", "name": "app/core/runtime.py · 발췌", "lang": "python"}, "agent": {"raw": "# 등록된 Tool과 호출 제한을 연결 (발췌)\nagent = create_agent(model=self.model_factory(), tools=tools,\n    system_prompt=SYSTEM + '\\n권장 Context k=' + str(self.settings.context_k),\n    middleware=middleware)\n# invoke에서 모델 선택 → Tool 실행 → 결과 전달의 Loop 시작\nresult = agent.invoke({'messages': [\n    {'role': 'user', 'content': question + '\\n[검색 Category: '\n        + str(category) + ']'}]},\n    config={'recursion_limit': 2*self.settings.max_model_calls+8})", "name": "app/agent.py · 발췌", "lang": "python"}};
const SUMMARY_HTML="<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"only light\"><title>Day30 핵심요약 · AI Technical Report Agent<\/title><style>:root{--navy:#1c2b40;--blue:#426fa3;--line:#d7e0eb;--ink:#222f44}*{box-sizing:border-box}html{font-family:PretendardLecture, \"Malgun Gothic\",sans-serif;color:var(--ink);background:#f3f6fa}body{max-width:1100px;margin:auto;padding:35px 25px}h1{font-size:29px;margin:5px 0}h2{font-size:19px;color:#2f557e}p,li{line-height:1.75}header{margin-bottom:30px}small{color:#607387}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:22px;margin:0 0 14px}.card p{font-size:14px}.flow{background:#eef3fa;padding:14px;border-radius:8px;font-weight:bold;color:#2b5278;line-height:1.9}.end{color:#167062}.print{float:right;background:white;border:1px solid #cbd8e7;border-radius:7px;padding:8px 12px;cursor:pointer}@media(max-width:730px){.row{grid-template-columns:1fr}}@media print{body{padding:0;background:white}.card{break-inside:avoid}.print{display:none}}<\/style><\/head><body><header><small>Day 30 · 2026.11.27 (금) · 오전 50분<\/small><button class=\"print\" onclick=\"print()\">인쇄<\/button><h1>LangChain 기반 AI Technical Report Agent · 핵심요약<\/h1><p>요구사항에서 설계와 구현·검증까지 연결합니다.<\/p><\/header><div class=\"card\"><h2>01 · 요구사항과 설계<\/h2><div class=\"flow\">SRS → Architecture → Interface → Implementation → Acceptance<\/div><p>기존 DB만 읽기 전용 재사용. 신규 코드·Single Agent·Tool 2개.<\/p><\/div><div class=\"card\"><h2>02 · 데이터 계약<\/h2><p>Overview → 저장된 E5 vector(384); Content → report_read_view; Metadata → RPT-ID·Revision. 유효 벡터: ready·동일 모델·384차원·Revision·Overview SHA-256 일치(영벡터 제외).<\/p><\/div><div class=\"card\"><h2>03 · 아키텍처<\/h2><div class=\"flow\">Client → FastAPI → Agent ↔ LLM → Tool 실행 → Agent → Validator → Response<\/div><p>rag_search: CUDA E5 → pgvector → Document → CUDA Rerank → Context → Runnable LLM. lookup_status: report_id → 고정 SELECT → 실제 상태. LLM은 Tool을 선택하고 실제 실행은 Python이 담당. 상태값은 DB 조회 결과로 구성.<\/p><\/div><div class=\"row\"><div class=\"card\"><h2>04 · RAG 설계<\/h2><p>RETRIEVE_K=8 / CONTEXT_K=3(권장). E5 query: Prefix·L2 Normalization; 같은 후보를 Cross-Encoder로 재정렬. 실제 Context → Tool sources → 최종 인용. No-answer 허용.<\/p><\/div><div class=\"card\"><h2>05 · 신뢰성·평가<\/h2><p>200 completed / insufficient_evidence / incomplete 구분. 422 입력, 503 의존성, 504 timeout, 500 계약 오류. Call ID·Execution Ledger 대조; Citation 일치 ≠ Faithfulness. Gold는 검색과 분리. 완료 판정 규칙은 자연어 의도 전체를 보장하지 않음.<\/p><\/div><\/div><div class=\"card\"><h2>06 · 구현·제출<\/h2><div class=\"flow\">Preflight → DB → E5/Retriever/Document → Reranker → Runnable → Tools/Agent → FastAPI → Test<\/div><p>Basic: 11 TODO / T-01~10. 응용: 폴더만 / T-01~14. 심화: 빈 폴더 / T-01~19. 실제 GPU·DB·LLM·Postman 및 DB 전후 Snapshot 비교. 비밀값 제외.<\/p><\/div><p><small>Day30 SRS v1.0 및 배포 실습자료 기준. 교육용 시각화의 점수와 상태는 실측 결과가 아닙니다.<\/small><\/p><\/body><\/html>";

function cover(){return `<section class="lecture-cover" aria-labelledby="lecture-title"><p class="cover-course">생성형 AI·LLM 및 RAG 엔지니어링</p><h1 class="cover-title" id="lecture-title"><span class="cover-lead">요구사항에서 시스템 설계와 구현까지</span><span class="cover-main">LangChain 기반<br>AI Technical Report Agent</span></h1><div class="cover-rule"></div><div class="cover-meta"><div class="cover-session"><strong>Day 30</strong><span>정규교과 14/18 · 오전 50분</span></div><time datetime="2026-11-27">2026.11.27 (금)</time></div></section>`;}
function contents(){return `<section class="keyword-contents"><h1>목차</h1><div class="contents-grid">${DATA.chapters.map(x=>`<button class="contents-item" data-action="chapter" data-value="${x.id}"><span class="contents-number">${String(x.id).padStart(2,'0')}</span><span class="contents-copy"><strong>${esc(x.name)}</strong><span class="contents-keywords">${esc(x.keywords)}</span></span></button>`).join('')}</div><div class="d25-cover-note">오전 50분 설계 강의 → 80분 구현 시연 → 오후 개인 일일 프로젝트</div></section>`;}
function render(){let s=current(),front=s.chapter===0;$('#stage').className='stage '+(front?'frontmatter-stage':s.id==='architecture'?'map-stage':'d30-compact');$('#stage').dataset.scene=s.id;$('#stageScroll').classList.toggle('frontmatter-scroll',front);let content=front?(s.id==='cover'?cover():contents()):`<div class="scene-head"><h1>${esc(s.title)}</h1><p>${esc(s.claim)}</p></div>${s.body}${s.take?`<div class="d30-take"><b>핵심</b><span>${esc(s.take)}</span></div>`:''}${s.source?`<p class="d30-source-note">기준 · ${esc(s.source)}</p>`:''}`;$('#stage').innerHTML=content;all('[data-widget]',$('#stage')).forEach(el=>el.innerHTML=WIDGETS[el.dataset.widget]());all('[data-codebox]',$('#stage')).forEach(el=>el.innerHTML=codeBox(el.dataset.codebox));$('#positionMount').innerHTML=front?'':`<div class="position-strip"><span class="position-label">현재 위치</span><div><strong>${String(s.chapter).padStart(2,'0')} · ${esc(DATA.chapters.find(c=>c.id===s.chapter).name)}</strong><span>${esc(s.focus.map(k=>nd(k)?.[5]).filter(Boolean).join(' · '))}</span></div>${btn('전체 지도','openMap')}</div>`;$('#miniMapMount').innerHTML=`<button type="button" class="mini-map-button" data-action="openMap" aria-label="전체 지도 열기">${mapSVG(true,'all',-1,s.focus)}<span><i></i>${front?'전체 지도':esc(s.focus.slice(0,3).map(k=>nd(k)?.[5]).filter(Boolean).join(' · '))}</span><small>클릭하여 확대</small></button>`;$('#chapters').innerHTML=DATA.chapters.map(c=>`<button type="button" class="chapter ${c.id===s.chapter?'active':''}" data-action="chapter" data-value="${c.id}"><span class="num">${String(c.id).padStart(2,'0')}</span><span>${esc(c.name)}<small>${esc(c.keywords)}</small></span></button>`).join('');$('#sceneJump').innerHTML=DATA.scenes.map((x,i)=>`<option value="${x.id}" ${i===state.index?'selected':''}>${i+1}. ${esc(x.title)}</option>`).join('');$('#sceneFooter').textContent=`${state.index+1} / ${DATA.scenes.length}`;$('#progress').style.width=(100*(state.index+1)/DATA.scenes.length)+'%';$('#prevScene').disabled=state.index===0;$('#nextScene').disabled=state.index===DATA.scenes.length-1;}
function goIndex(i){mapStop();state.index=Math.max(0,Math.min(DATA.scenes.length-1,i));state.route='all';state.mapStep=-1;state.selectedNode=null;render();$('#stageScroll').scrollTop=0;try{history.replaceState(null,'','#'+current().id);}catch(e){}}
function redraw(){let stage=$('#stageScroll'),y=stage.scrollTop,modal=$('#atlasDialog'),my=$('#atlasBody').scrollTop;render();stage.scrollTop=y;if(modal.open){$('#atlasBody').innerHTML=mapPanel();$('#atlasBody').scrollTop=my;}if($('#erdDialog').open){let y=$('#erdBody .d30-erd-viewport')?.scrollTop||0;$('#erdBody').innerHTML=erd(true);$('#erdBody .d30-erd-viewport').scrollTop=y;}}
function openMap(){mapStop();state.route='all';state.mapStep=-1;state.selectedNode=null;$('#atlasBody').innerHTML=mapPanel();if(!$('#atlasDialog').open)$('#atlasDialog').showModal();}
function openErd(){$('#erdBody').innerHTML=erd(true);$('#erdDialog').showModal();}
function showSummary(){let w=window.open('','_blank');if(w){w.document.open();w.document.write(SUMMARY_HTML);w.document.close();}else{const body=$('#helpBody');body.innerHTML='<iframe class="d30-summary-frame" title="핵심요약"></iframe>';body.querySelector('iframe').srcdoc=SUMMARY_HTML;$('#helpDialog').showModal();}}
function help(){$('#helpBody').innerHTML=`<div class="d30-help"><h2>Day30 · 사용 안내 및 기준 자료</h2><p>← / → 또는 이전·다음 버튼으로 이동합니다. 화면 선택, 목차, M(전체 지도), F(전체화면)를 사용합니다. 전체 지도에서 경로 선택, 단계별/자동 이동, 노드 클릭이 가능합니다.</p><p>교육용 화면의 가상 점수와 상태는 실제 모델 실행 결과가 아닙니다. 이 HTML은 네트워크로 PostgreSQL·E5·LLM을 호출하지 않습니다.</p><p>기준: Day30 SRS v1.0 · Day30 실습자료의 mentor/01_basic 및 common · 민준튜터 프로젝트 구현 흐름 완주 안내서 · 11월 20일 오전 강의 · Day28(11월 25일) 공통 전체 지도 · 강의자료_기본템플릿.html.</p><p>실환경: Windows 11, VS Code, Git Bash, 기존 CUDA venv·PostgreSQL·pgvector. 사전 점검에서 모델·DB·API Key를 확인해야 합니다. 실제 통합 검증은 교실에서 진행합니다.</p></div>`;$('#helpDialog').showModal();}
function toast(msg){let el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,2200);}
async function copyCode(k){let raw=CODES[k]?.raw;if(!raw)return;let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(raw);ok=true;}}catch(e){}if(!ok){let el=document.createElement('textarea');el.value=raw;el.style.position='fixed';el.style.left='-9999px';document.body.appendChild(el);el.select();try{ok=document.execCommand('copy');}catch(e){}el.remove();}toast(ok?'코드를 복사했습니다.':'복사할 코드를 직접 선택하세요.');}
const SIMPLE=['trace','dep','choice','tool','doc','citation','noanswer','api','status','traceid','evalOrder','level'];
const ACTIONS={prev:()=>goIndex(state.index-1),next:()=>goIndex(state.index+1),chapter:v=>goIndex(DATA.scenes.findIndex(s=>s.chapter===Number(v))),openMap,openErd,openSummary:showSummary,help,close:(v,el)=>{mapStop();$('#'+el.dataset.dialog)?.close();redraw();},fullscreen:()=>{try{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.();}catch(e){}},copy:copyCode,route:v=>{mapStop();state.route=v;state.mapStep=-1;state.selectedNode=null;redraw();},mapReset:()=>{mapStop();state.mapStep=-1;redraw();},mapPrev:()=>{mapStop();state.mapStep=Math.max(-1,state.mapStep-1);redraw();},mapNext:()=>{mapStop();mapAdvance();},mapPlay:()=>{if(state.mapPlaying){mapStop();redraw();return;}if(state.mapStep>=routes[state.route].seq.length-1)state.mapStep=-1;state.mapPlaying=true;mapAdvance();if(state.mapPlaying)state.mapTimer=setInterval(mapAdvance,1700);},mapNode:v=>{state.selectedNode=v;redraw();},mapClear:()=>{state.selectedNode=null;redraw();},freshReset:()=>{state.fresh.fill(true);redraw();},seqCase:v=>{state.seqCase=v;state.seqStep=0;redraw();},seqReset:()=>{state.seqStep=0;redraw();},seqPrev:()=>{state.seqStep=Math.max(0,state.seqStep-1);redraw();},seqNext:()=>{state.seqStep=Math.min(seqEvents().length-1,state.seqStep+1);redraw();},rerank:v=>{state.rerank=v==='after';redraw();},road:v=>{state.road=Number(v);redraw();},erdZoom:v=>{state.erdZoom=v;redraw();}};
SIMPLE.forEach(k=>ACTIONS[k]=v=>{state[k]=v;redraw();});
document.addEventListener('click',e=>{let el=e.target.closest?.('[data-action]');if(el&&!el.disabled&&ACTIONS[el.dataset.action])ACTIONS[el.dataset.action](el.dataset.value,el);});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='sceneJump'){let i=DATA.scenes.findIndex(x=>x.id===el.value);if(i>=0)goIndex(i);}else if(el.dataset.fresh!==undefined){state.fresh[Number(el.dataset.fresh)]=el.checked;redraw();}else if(el.dataset.range){state[el.dataset.range]=Number(el.value);redraw();}});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;let el=e.target;if(el.closest?.('.atlas-node')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();ACTIONS.mapNode(el.closest('.atlas-node').dataset.value);return;}if(/INPUT|SELECT|TEXTAREA|BUTTON/.test(el.tagName)||all('dialog[open]').length)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();goIndex(state.index+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();goIndex(state.index-1);}else if(e.key.toLowerCase()==='m')openMap();else if(e.key.toLowerCase()==='f')ACTIONS.fullscreen();});
$('#atlasDialog').addEventListener('close',()=>{mapStop();redraw();});
window.addEventListener('hashchange',()=>{let i=DATA.scenes.findIndex(x=>x.id===location.hash.slice(1));if(i>=0&&i!==state.index)goIndex(i);});
let init=DATA.scenes.findIndex(x=>x.id===location.hash.slice(1));if(init>=0)state.index=init;render();window.Day30App={DATA,state,goIndex,render,redraw};
</script></body></html>
