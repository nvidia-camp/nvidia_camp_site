/* v9: a VS Code-style dark editor for Python source only.
   The lesson canvas, summaries, input controls and source text stay unchanged. */
.inline-python{
  --editor-bg:#1e1e1e;--editor-fg:#d4d4d4;--editor-tabs:#252526;
  --editor-border:#3c3c3c;--editor-accent:#3794ff;--editor-gutter:#999999;

}
.inline-python .python-block{
  background:var(--editor-bg);color:var(--editor-fg);

  padding:0;margin:0 0 22px;min-width:0;overflow:hidden;
  box-shadow:0 3px 14px #142d4e12;color-scheme:dark;
}
.python-editor-bar{
  display:flex;align-items:stretch;min-width:0;

}
.python-tab{

  font:500 15px/1.6 PretendardLecture, 'Segoe UI','Noto Sans CJK KR','Malgun Gothic',sans-serif;

  min-width:0;word-break:keep-all;overflow-wrap:anywhere;
}

  font-family:'Cascadia Code',Consolas,'D2Coding','Noto Sans Mono CJK KR','DejaVu Sans Mono',monospace;
  font-size:15px;line-height:1.8;font-weight:400;

/* Day26 feature adapters for the canonical lecture HTML template.
   Append after the original 55,445-character head stylesheet.
   The template owns the shell, typography, cards, tables, concept layouts,
   front matter, navigation, maps and Python editor. These rules add only
   Day26 controls, result annotations, search, reading and print behavior. */

/* Interactive examples use the template's row, chip, card and heading rules. */
.d26-demo{margin:18px 0;min-width:0}
.d26-demo-head{margin-bottom:18px}
.d26-demo-body{min-width:0}
.d26-controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 18px;margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.d26-control{display:block;flex:1 1 180px;min-width:min(100%,150px);max-width:400px;font-weight:400}
.d26-control.wide{flex-basis:320px;max-width:none}
.d26-control>span{display:block;margin-bottom:7px;font-weight:700;line-height:1.6;overflow-wrap:anywhere}
.d26-control select,.d26-control input[type=text]{min-height:42px}
.d26-control input[type=range]{display:block;min-height:24px}
.d26-control input[type=checkbox]{vertical-align:middle;margin:0 7px 0 0}
.d26-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.d26-split>*{min-width:0}
.d26-pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;max-height:none}
.d26-demo-explain{margin-top:18px}
.d26-demo details{margin:18px 0}
.d26-demo details>summary{cursor:pointer;color:var(--blue);font-weight:600;line-height:1.6}

/* State labels reuse the template's semantic colors and chip proportions. */
.d26-status{display:inline-flex;align-items:center;padding:4px 9px;border-radius:5px;background:var(--pale);color:var(--blue);font-size:13px;font-weight:700;line-height:1.4;white-space:normal;overflow-wrap:anywhere}
.d26-status.ok{background:#e7f3ee;color:var(--ok)}
.d26-status.bad{background:var(--paper);color:var(--bad);box-shadow:inset 0 0 0 1px currentColor}
.d26-status.wait{background:#fff5e7;color:var(--warn)}
.d26-status.neutral{color:var(--muted)}
.d26-metric{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px;padding:12px 0;border-bottom:1px solid var(--line);line-height:1.7}
.d26-metric:last-child{border-bottom:0}

.d26-checklist label{display:flex;align-items:flex-start;gap:10px;font-weight:400;line-height:1.75}

.d26-source-button{margin:10px 6px 0 0}
.d26-live-note{padding:14px 17px;margin:18px 0;border-left:4px solid var(--warn);border-radius:10px;background:#fff5e7;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
.d26-note{margin:18px 0;color:var(--muted);line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
.d26-note strong{color:var(--ink)}
.d26-instruction{display:block;margin:18px 0 8px;color:var(--muted);line-height:1.6}

/* This is an additional editor action, not a replacement editor theme. */
.d26-copy{align-self:center;flex:0 0 auto;margin:8px 12px 8px auto;padding:5px 9px;border-color:#727272;background:#333333;color:#f0f0f0;font-size:13px;line-height:1.4;white-space:nowrap}

/* Reference disclosures and notation use the template's existing components. */
.d26-refs{margin-top:24px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7}

/* Search and indexes are additions to the existing scrollable dialogs. */

"kind":"concept","title":"RAG Evaluation은 무엇이며 왜 필요한가요?","claim":"RAG Evaluation은 실제 업무 질문을 기준으로 검색·생성·출처·지연시간을 점검해, 어느 모듈을 고쳐야 하는지 판단하는 품질 검증 절차입니다.","left":[["무엇을 하나요?","질문 세트와 정답 기준을 고정한 뒤 현재 서비스 버전을 실행하고, 검색 순위·답변·출처·실행시간을 함께 기록합니다."],["왜 필요한가요?","답변이 틀렸을 때 Retriever 문제인지, Reranker 문제인지, LLM 생성 문제인지 구분해야 실제 수정 대상을 결정할 수 있습니다."]],"right":[["현업에서는 어디에?","사내 지식검색, 고객지원 Copilot, 의료·금융 상담 Assistant를 배포하기 전에 회귀 테스트와 품질 승인 절차로 사용합니다."],["한 건의 평가 결과","question_id, gold_chunk_ids, retrieved_ids, included_ids, answer, source_ids, latency_ms, status를 한 행으로 남기면 나중에 원인 분석이 가능합니다."]],"distinction":"평가는 “모델이 똑똑해 보이는가”를 보는 일이 아니라, 실제 업무 질문에 대해 어떤 입력에서 어떤 출력이 나왔는지 재현 가능하게 검증하는 절차입니다.","references":[{"label":"LangSmith · Evaluate a RAG application","url":"https://docs.langchain.com/langsmith/evaluate-rag-tutorial"},{"label":"LangSmith · Evaluation quickstart","url":"https://docs.langchain.com/langsmith/evaluation-quickstart"}]},{"id":"d28-c1-two-stages","chapter":1,"kind":"table","title":"검색 실패와 생성 실패는 별개의 문제입니다","claim":"RAG의 최종 답이 틀렸다고 해서 무조건 LLM을 바꾸거나 Prompt를 수정해서는 안 됩니다.","headers":["발생 위치","관찰할 결과","원인 후보"],"rows":[["Retriever","Gold 문서가 검색 후보 Top-k에 없음","검색 표현·필터·인덱스·Embedding"],["Reranker","Gold 문서는 후보에 있지만 Context Top-N에서 제외","재정렬 모델·후보 수·선택 전략"],["Generator","정답 문서가 Context에 있는데 잘못된 사실을 답함","Prompt·근거 활용·모델 출력"],["Validator","허위 Source ID를 정상 응답에 포함","출처 검증·입출력 Schema"],["Service","성능 지표는 통과하지만 응답 지연·도구 호출 실패","Latency·오류 처리·비용"]],"note":"먼저 오류가 발생한 위치를 찾고, 해당 단계에 맞는 개선책을 선택합니다."},{"id":"d28-c1-pipeline","chapter":1,"kind":"concept","title":"평가를 수행하는 네 단계","claim":"Dataset → Target Runner → Evaluator → Report는 현업 RAG 품질 검증의 기본 절차입니다. 각 단계의 입력·출력과 담당 역할을 분리해야 재현 가능한 평가가 됩니다.","left":[["01 · Dataset","평가 질문·정답 근거를 준비합니다. 예: 금융 민원 FAQ, 보험 약관 QA, 의료 안내 문서 질의응답, 사내 인사규정 검색 질문 세트."],["02 · Target Runner","채점 대상 서비스입니다. 예: FastAPI /ask 엔드포인트를 호출하거나, LangChain Runnable.invoke()로 동일한 질문을 실행해 retrieved_ids·included_ids·answer를 수집합니다."]],"right":[["03 · Evaluator","Retrieval 지표를 계산하고 답변을 검토합니다. 예: Recall@k 표, MRR 리포트, Faithfulness 검토표, 사람 검수 코멘트 또는 LLM Judge 결과."],["04 · Report","버전별 평균 점수와 실패 사례를 묶습니다. 예: CSV 평가표, JSONL 실행 로그, 팀 회의용 비교 보고서, 배포 승인 체크리스트."]],"distinction":"Dataset은 정답 기준, Target Runner는 채점 대상 시스템, Evaluator는 채점 규칙, Report는 의사결정을 위한 결과 문서입니다. Gold 문서 ID를 검색 입력에 넣지 않습니다.","references":[{"label":"LangSmith · Evaluation quickstart","url":"https://docs.langchain.com/langsmith/evaluation-quickstart"}]},{"id":"d28-c1-trace-model","chapter":1,"kind":"code","title":"평가 기록 하나를 Python dict로 구성합니다","claim":"질문·검색 결과·LLM 응답을 같은 ID로 묶어야 원인을 추적할 수 있습니다.","left":"질문·Gold 레이블·실제 검색 후보","right":"같은 question_id로 결합한 평가 기록","code":{"lang":"python","title":"eval_record.py · 첫 실행 기록","raw":"run = {\n    \"question_id\": \"Q01\",           # 평가 질문의 ID\n    \"question\": \"15분 늦으면 어떻게 되나요?\",\n    \"gold_chunk_ids\": [\"C1\", \"C2\"], # 정답 후보: 검색에는 전달하지 않음\n    \"retrieved_ids\": [\"C4\", \"C1\", \"C3\"],\n    \"included_ids\": [\"C1\"],       # 실제 LLM Context에 넣은 ID\n    \"answer\": \"15분까지는 지각으로 처리합니다.\",\n    \"status\": \"answered\",\n}\n# 출력만 기록합니다. gold_chunk_ids는 평가기가 읽는 정답입니다.\nprint(run[\"question_id\"], run[\"retrieved_ids\"])\n","desc":"dict는 모델이 아니라 데이터를 보관하는 Python 객체입니다. 문서·답변의 실제 출처와 평가 정답을 별도로 유지합니다.","highlighted":["<span class=\"py-variable\">run</span> = {","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">question_id</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">Q01</span><span class=\"py-string\">&quot;</span>,           <span class=\"py-comment\"># 평가 질문의 ID</span>","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">question</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">15분 늦으면 어떻게 되나요?</span><span class=\"py-string\">&quot;</span>,","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">gold_chunk_ids</span><span class=\"py-string\">&quot;</span>: [<span class=\"py-string\">&quot;</span><span class=\"py-string\">C1</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C2</span><span class=\"py-string\">&quot;</span>], <span class=\"py-comment\"># 정답 후보: 검색에는 전달하지 않음</span>","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">retrieved_ids</span><span class=\"py-string\">&quot;</span>: [<span class=\"py-string\">&quot;</span><span class=\"py-string\">C4</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C1</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C3</span><span class=\"py-string\">&quot;</span>],","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">included_ids</span><span class=\"py-string\">&quot;</span>: [<span class=\"py-string\">&quot;</span><span class=\"py-string\">C1</span><span class=\"py-string\">&quot;</span>],       <span class=\"py-comment\"># 실제 LLM Context에 넣은 ID</span>","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">answer</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">15분까지는 지각으로 처리합니다.</span><span class=\"py-string\">&quot;</span>,","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">status</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">answered</span><span class=\"py-string\">&quot;</span>,","}","<span class=\"py-comment\"># 출력만 기록합니다. gold_chunk_ids는 평가기가 읽는 정답입니다.</span>","<span class=\"py-function\">print</span>(<span class=\"py-variable\">run</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">question_id</span><span class=\"py-string\">&quot;</span>], <span class=\"py-variable\">run</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">retrieved_ids</span><span class=\"py-string\">&quot;</span>])"]},"flowTrace":[],"introTerms":[{"term":"Gold Label","meaning":"사전에 사람이 정한 관련 문서 ID나 정답입니다.","use":"검색 함수에는 전달하지 않고 평가 시에만 비교합니다."},{"term":"retrieved_ids","meaning":"Retriever가 이번 실행에서 반환한 문서 ID 목록입니다.","use":"정답이 아니라 관측된 검색 결과입니다."}]},{"id":"d28-c1-failure-demo","chapter":1,"kind":"demo","title":"시연 · 실패 단계를 바꾸면 개선 방법이 달라집니다","claim":"검색 후보 없음과 답변 환각은 서로 다른 개선 대상입니다.","demo":"failure-lab","left":[["검색 단계","Gold 문서가 후보에 들어오는지 확인합니다."],["생성 단계","Context가 충분한지와 답변이 근거를 지키는지 확인합니다."]],"right":[["운영 문제","시간 초과·모델 인증 실패는 정확도와 별도로 기록합니다."],["다음 연결","11/26 Agent Tool에도 동일한 검사 경계를 유지합니다."]],"note":"고정된 교육용 사례입니다. 실제 DB·LLM 실행이나 측정 결과가 아닙니다."},{"id":"d28-c1-practice","chapter":1,"kind":"practice","title":"실습 01 안내 · RAG 실패 위치 분류","claim":"질문별 기록을 보고 어느 Stage가 문제인지 구분합니다.","preparation":"전날 RAG 기록 4종·오류 예시·단계별 확인표","output":"Failure Stage·증거·개선 방향 표","levels":[{"name":"01_basic · 기본필수","folder":"01_basic","task":"제공된 예시 3건의 실패 위치를 분류하고 근거 한 줄을 작성합니다.","result":"핵심 입출력·실행 흐름 확인"},{"name":"02_intermediate · 응용","folder":"02_intermediate","task":"Retriever·Reranker·Generation별 판정 함수를 분리합니다.","result":"기능 분리·조건별 테스트"},{"name":"03_advanced · 심화","folder":"03_advanced","task":"Stage별 오류 코드, 원본 입력 보존, 처리시간과 검증 기록을 추가합니다.","result":"운영 경계·로그·재현성 검증"}],"criterion":"검색 오류와 생성 오류를 동일하게 표현하지 않고 이유를 설명합니다.","caution":"정답 문서가 검색 후보 밖에 있을 때 Reranking으로 해결된다고 판단하지 않습니다.","check_questions":[["정답 문서가 Top-10에 없고 LLM이 오답을 생성했습니다. 어디부터 확인하나요?","검색 후보·필터·Indexing을 먼저 확인합니다. 정답 근거가 없으면 Generator만 개선해도 제한적입니다."],["Gold Label과 retrieved_ids는 같은 역할인가요?","아닙니다. Gold는 사전 정답 기준, retrieved_ids는 실제 검색 결과입니다."],["검색 정확도가 좋아졌는데 API가 느려졌습니다. 평가가 끝난 건가요?","아니요. Latency·오류율·비용도 함께 비교해야 합니다."]],"check_title":"이해 확인 · 평가의 목적"},{"id":"d28-c2-gold-meaning","chapter":2,"kind":"concept","title":"Gold Label은 누가 정하고 어디에 사용하는가?","claim":"Gold Label은 특정 질문에 대해 “관련 있다”고 사람이 판정한 정답 문서·청크 ID 집합입니다. Retrieval 평가의 기준선이므로 질문 예시와 함께 명확히 보여 줘야 합니다.","left":[["명확한 예시","질문 “회의실 신청과 취소는 어떻게 하나요?”에는 C3(회의실 취소 절차)와 C4(회의실 예약 신청)가 모두 Gold입니다. C5(실습실 위치)는 검색되더라도 이 질문의 Gold가 아닙니다."],["다수의 정답 가능","한 질문이 여러 청크를 동시에 요구할 수 있습니다. 따라서 Gold는 보통 ID 하나가 아니라 집합 또는 graded relevance 형태가 됩니다."]],"right":[["Reference Answer와 차이","Gold Label은 검색 정답, Reference Answer는 생성 답변의 기준 설명입니다. 같은 질문에서도 자료형과 쓰임이 다릅니다."],["현업 예시","업무 담당자가 최신 규정 버전을 확인하고 질문별 관련 청크를 검토한 뒤, 검수 날짜·버전·판정자를 함께 기록합니다."]],"distinction":"Gold Label은 “관련 문서”의 기준이고, 검색 결과가 좋아 보인다고 나중에 정답을 바꾸면 안 됩니다. 질문·문서 버전·판정 기준을 함께 고정해야 합니다."},{"id":"d28-c2-dataset-fields","chapter":2,"kind":"table","title":"질문 데이터셋의 필수 필드","claim":"수강생이 평가 레코드의 모든 열이 무엇인지 이해한 뒤 코드를 작성하도록 합니다.","headers":["필드","예시 값","의미"],"rows":[["question_id","Q01","여러 실행에서 같은 질문을 연결하는 ID"],["question","15분 지각 기준은?","사용자 원 질문"],["gold_chunk_ids","[C1, C2]","사전에 정한 관련 문서 집합"],["reference_answer","15분까지 지각, 초과는 결석","사람이 검토한 기준 답변"],["expected_status","answered / insufficient_context","해당 질문에 답할 근거가 있는가"],["corpus_version","policy_2026_v2","레이블이 어떤 문서 집합을 기준으로 하는지"]],"note":"source_locator·Category·권한 필터와 문서 버전은 평가 재현성을 위해 실행 메타데이터로도 저장합니다."},{"id":"d28-c2-labels-grades","chapter":2,"kind":"concept","title":"Binary Relevance와 Graded Relevance는 어떻게 다를까요?","claim":"Binary는 문서가 관련 있는지 0/1로, Graded는 관련성 수준을 0/1/2처럼 구별합니다.","left":[["Binary · Recall/MRR","C1·C2 관련(1), C3 무관(0)처럼 표시합니다. Recall@k·MRR 계산에 적합합니다."],["Graded · nDCG","C1 매우 관련(2), C2 부분 관련(1), C3 무관(0)처럼 정도를 구별합니다. 높은 등급 문서를 앞에 둘수록 좋습니다."]],"right":[["두 레이블의 연결","평가 정책에서 grade>0을 binary 관련 문서로 변환할 수 있습니다. 변환 기준을 먼저 고정해야 합니다."],["주의","비슷한 문자열의 문서가 반드시 관련 있는 것은 아닙니다. 질문에 실제 답변 근거를 제공하는지 확인합니다."]],"distinction":"숫자 등급은 모델의 점수가 아니라 사람이 정의한 정답 레이블입니다."},{"id":"d28-c2-gold-schema","chapter":2,"kind":"code","title":"Gold Dataset을 JSON으로 읽고 기본 계약을 검사합니다","claim":"예시를 정답 목록으로 만든 다음 데이터 누락·중복·유효하지 않은 레이블을 검사합니다.","left":"별도 파일에 저장한 정답 질문 목록","right":"중복·누락이 없는 질문별 Gold 레이블","code":{"lang":"python","title":"dataset_check.py · Gold JSON 검증","raw":"import json\nfrom pathlib import Path\n\n# 학생이 사용할 수 있는 평가 정답은 검색 결과와 별도 파일로 보관합니다.\npath = Path(\"data/gold_questions.json\")\n# 파일이 준비되어 있다는 전제의 예제입니다.\nrows = json.loads(path.read_text(encoding=\"utf-8\"))\nfor row in rows:\n    assert row[\"question_id\"] and row[\"question\"].strip()\n    ids = row[\"gold_chunk_ids\"]\n    assert len(ids) == len(set(ids)), \"중복된 Gold 문서 ID\"\n    assert row[\"expected_status\"] in {\"answered\", \"insufficient_context\"}\n    grades = row.get(\"relevance_grades\", {})  # 선택적 0·1·2 관련성 등급\n    assert all(isinstance(v, int) and not isinstance(v, bool) and v in (0, 1, 2)\n               for v in grades.values()), \"잘못된 관련성 등급\"\nprint(\"검증된 질문 수:\", len(rows))\n","desc":"JSON 파일은 아직 제작하지 않습니다. 이번 강의에서는 필드 뜻과 읽기·검증 코드를 설명합니다. Graded Relevance를 사용할 때는 등급 0·1·2를 같은 기준으로 검사합니다.","highlighted":["<span class=\"py-keyword\">import</span> <span class=\"py-variable\">json</span>","<span class=\"py-keyword\">from</span> <span class=\"py-variable\">pathlib</span> <span class=\"py-keyword\">import</span> <span class=\"py-variable\">Path</span>","","<span class=\"py-comment\"># 학생이 사용할 수 있는 평가 정답은 검색 결과와 별도 파일로 보관합니다.</span>","<span class=\"py-variable\">path</span> = <span class=\"py-variable\">Path</span>(<span class=\"py-string\">&quot;</span><span class=\"py-string\">data/gold_questions.json</span><span class=\"py-string\">&quot;</span>)","<span class=\"py-comment\"># 파일이 준비되어 있다는 전제의 예제입니다.</span>","<span class=\"py-variable\">rows</span> = <span class=\"py-variable\">json</span>.<span class=\"py-variable\">loads</span>(<span class=\"py-variable\">path</span>.<span class=\"py-variable\">read_text</span>(<span class=\"py-variable\">encoding</span>=<span class=\"py-string\">&quot;</span><span class=\"py-string\">utf-8</span><span class=\"py-string\">&quot;</span>))","<span class=\"py-keyword\">for</span> <span class=\"py-variable\">row</span> in <span class=\"py-variable\">rows</span>:","    <span class=\"py-keyword\">assert</span> <span class=\"py-variable\">row</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">question_id</span><span class=\"py-string\">&quot;</span>] and <span class=\"py-variable\">row</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">question</span><span class=\"py-string\">&quot;</span>].<span class=\"py-variable\">strip</span>()","    <span class=\"py-variable\">ids</span> = <span class=\"py-variable\">row</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">gold_chunk_ids</span><span class=\"py-string\">&quot;</span>]","    <span class=\"py-keyword\">assert</span> <span class=\"py-function\">len</span>(<span class=\"py-variable\">ids</span>) == <span class=\"py-function\">len</span>(<span class=\"py-function\">set</span>(<span class=\"py-variable\">ids</span>)), <span class=\"py-string\">&quot;</span><span class=\"py-string\">중복된 Gold 문서 ID</span><span class=\"py-string\">&quot;</span>","    <span class=\"py-keyword\">assert</span> <span class=\"py-variable\">row</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">expected_status</span><span class=\"py-string\">&quot;</span>] in {<span class=\"py-string\">&quot;</span><span class=\"py-string\">answered</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">insufficient_context</span><span class=\"py-string\">&quot;</span>}","    <span class=\"py-variable\">grades</span> = row.get(<span class=\"py-string\">\"relevance_grades\"</span>, {})  <span class=\"py-comment\"># 선택적 0·1·2 관련성 등급</span>","    <span class=\"py-keyword\">assert</span> <span class=\"py-function\">all</span>(<span class=\"py-function\">isinstance</span>(v, <span class=\"py-function\">int</span>) <span class=\"py-keyword\">and not</span> <span class=\"py-function\">isinstance</span>(v, <span class=\"py-function\">bool</span>) <span class=\"py-keyword\">and</span> v <span class=\"py-keyword\">in</span> (<span class=\"py-number\">0</span>, <span class=\"py-number\">1</span>, <span class=\"py-number\">2</span>)","               <span class=\"py-keyword\">for</span> v <span class=\"py-keyword\">in</span> grades.values()), <span class=\"py-string\">\"잘못된 관련성 등급\"</span>","<span class=\"py-function\">print</span>(<span class=\"py-string\">&quot;</span><span class=\"py-string\">검증된 질문 수:</span><span class=\"py-string\">&quot;</span>, <span class=\"py-function\">len</span>(<span class=\"py-variable\">rows</span>))"]},"flowTrace":[],"introTerms":[{"term":"json.loads","meaning":"JSON 문자열을 Python list·dict로 변환합니다.","use":"파일에서 읽은 텍스트를 Python 자료형으로 바꿉니다."},{"term":"set()","meaning":"중복 없는 원소 집합을 만듭니다.","use":"Gold ID가 중복되었는지 비교합니다."}]},{"id":"d28-c2-gold-samples","chapter":2,"kind":"table","title":"같은 Corpus에서 질문별 관련 문서는 다릅니다","claim":"같은 C1 문서가 질문에 따라 정답이거나 무관할 수 있습니다.","headers":["질문","Gold ID · Binary","Reference의 핵심"],"rows":[["Q01 · 15분 지각 기준","C1, C2","15분까지 지각, 초과는 결석"],["Q02 · 회의실 예약 취소","C3","운영실에 철회 요청"],["Q03 · 회의실 신청과 취소","C3, C4","신청 승인과 취소 절차 두 부분"],["Q04 · 과제 마감 정확한 날짜","없음: ∅","정확한 날짜를 자료로 확인 불가"],["Q05 · 시설 위치와 이용 시간","C5, C6","위치와 이용 시간 분리"]],"note":"예시는 교육용 문서·레이블이며 실제 기관 규정이 아닙니다."},{"id":"d28-c2-noanswer","chapter":2,"kind":"concept","title":"정답 문서가 없는 질문도 Dataset에 넣어야 합니다","claim":"근거가 없는 질문에서 없는 사실을 만들어 대답하지 않는지 확인하기 위해서입니다.","left":[["No-answer Case","Q04는 본문에 정확한 제출 날짜가 없으므로 gold_chunk_ids=[]이고 expected_status=insufficient_context입니다."],["Recall의 분모가 0","관련 문서가 0개이면 Recall@k를 0으로 단정하지 않습니다. N/A로 표시하고 이 질문은 근거 부족·거절 평가에 사용합니다."]],"right":[["무조건 실패가 아닙니다","질문에 정답 문서가 없는데 시스템이 정보 부족을 반환한다면 좋은 동작입니다."],["주의할 데이터","문서가 실제로 있는데 색인이 누락되어 Gold가 비어 있다고 잘못 표시하면 평가가 왜곡됩니다."]],"distinction":"No-answer의 정답 레이블은 Retrieval Recall 평균에서 별도 관리하며, 답변 거절 성공률은 별도 기록합니다."},{"id":"d28-c2-gold-demo","chapter":2,"kind":"demo","title":"시연 · Gold Label을 바꾸면 지표의 기준도 바뀝니다","claim":"같은 검색 결과라도 관련 문서를 무엇으로 정의했는지에 따라 점수가 달라집니다.","demo":"gold-lab","left":[["Gold 선정","질문과 문서 본문을 보고 정답을 정의합니다."],["자료형","여러 정답을 집합으로 관리합니다."]],"right":[["누출 방지","시연 입력 Gold는 계산에만 사용합니다."],["개선 전제","평가 레이블은 비교 전에 확정해야 합니다."]],"note":"교육용 조작입니다. 실제 업무의 정답 레이블은 담당자 검토가 필요합니다."},{"id":"d28-c2-annotation","chapter":2,"kind":"concept","title":"현업의 Gold Label 검수는 어떻게 하나요?","claim":"복수 검토자가 판단 기준을 공유하고 이견을 기록해야 평가셋의 신뢰도를 높일 수 있습니다.","left":[["정답 판정 기준","질문의 모든 조건을 지원하는가, 날짜·버전이 맞는가, 부분만 답하는가를 기준표로 정의합니다."],["두 사람의 이견","C4를 관련/무관으로 다르게 판단했다면 문서 본문과 질문 의도를 재검토하여 최종 레이블을 확정합니다."]],"right":[["Dataset Split","예시를 만든 뒤 같은 문구를 Prompt나 Reranker 튜닝에 반복 사용하면 평가가 낙관적으로 나올 수 있습니다."],["업무 흐름","초기에는 10~20개 소형 평가셋에서 시작하고 실패 질문을 모아 범위를 늘립니다."]],"distinction":"문서 버전·레이블 작성자·평가일·정답 변경 이력을 보관하면 회귀 테스트가 가능합니다."},{"id":"d28-c2-practice","chapter":2,"kind":"practice","title":"실습 02 안내 · Gold Dataset 작성","claim":"질문과 관련 청크 ID, 기준 답변을 구조화해 기록합니다.","preparation":"교육용 질문 5개·근거 문서·Gold Label 설계표","output":"question_id별 Gold JSON·검증 결과","levels":[{"name":"01_basic · 기본필수","folder":"01_basic","task":"제공된 질문 3개에 관련 문서 ID를 채우고 중복을 검사합니다.","result":"핵심 입출력·실행 흐름 확인"},{"name":"02_intermediate · 응용","folder":"02_intermediate","task":"관련성 등급과 No-answer Case를 분리하여 모듈화합니다.","result":"기능 분리·조건별 테스트"},{"name":"03_advanced · 심화","folder":"03_advanced","task":"버전·정답 변경 이력·레이블 검토자·평가셋 누출 방지를 점검합니다.","result":"운영 경계·로그·재현성 검증"}],"criterion":"답변 정답과 문서 정답이 분리되고 no-answer를 식별할 수 있습니다.","caution":"정답 레이블을 실제 검색 결과를 보고 임의로 변경하지 않습니다.","check_questions":[["한 질문에 관련 문서가 두 개일 수 있나요?","예. Gold Label은 여러 문서 ID의 집합이 될 수 있으며 Recall의 분모는 Gold 문서 수입니다."],["정답 문서가 없는 질문의 Recall@k를 무조건 0으로 계산해야 하나요?","아니요. 분모가 0이므로 N/A 처리하고 정보 부족 응답을 별도로 평가합니다."],["모델 결과를 보고 Gold를 새로 정해도 되나요?","평가 편향이 생깁니다. 사람의 독립적인 검토와 변경 이력 관리가 필요합니다."]],"check_title":"이해 확인 · 정답 데이터"},{"id":"d28-c3-retrieval-metrics","chapter":3,"kind":"concept","title":"Recall@k·Precision@k·Hit@k는 무엇인가요?","claim":"Recall@k, Precision@k, Hit@k는 “Top-k 검색 결과가 Gold 문서를 얼마나 포함했는가”를 보는 Retrieval 평가 지표입니다. 새로운 개념이므로 분모와 의미를 분리해서 이해해야 합니다.","left":[["Recall@k는 무엇인가?","전체 Gold 문서 중 Top-k 안에서 찾은 문서의 비율입니다. 관련 문서 4개 중 3개를 찾으면 Recall@k=0.75입니다. “놓치지 않았는가?”를 봅니다."],["Precision@k는 무엇인가?","Top-k로 가져온 문서 k개 중 실제로 관련인 문서의 비율입니다. 5개를 가져와 2개가 관련이면 Precision@5=0.4입니다. “가져온 것 중 맞는가?”를 봅니다."]],"right":[["Hit@k는 무엇인가?","Top-k 안에 관련 문서가 하나라도 있으면 1, 하나도 없으면 0입니다. 빠른 포함 여부 확인용입니다."],["어디에 쓰이나?","E5 Retriever의 candidate_k 비교, Reranker 전후 비교, Context로 넘어가기 전 후보 품질 확인에 사용합니다."]],"distinction":"세 지표는 모두 Top-k를 사용하지만 분모가 다릅니다. Recall의 분모는 Gold 개수, Precision의 분모는 k, Hit의 분모는 없고 0/1 값입니다.","references":[{"label":"Microsoft · Fundamentals of Text Retrieval","url":"https://www.microsoft.com/en-us/research/wp-content/uploads/2017/06/fntir2018-neuralir-mitra.pdf"}]},{"id":"d28-c3-metric-formulas","chapter":3,"kind":"table","title":"세 가지 분모를 정확히 구분합니다","claim":"Gold가 {C1,C2,C3}이고 Top-3가 [C4,C2,C1]인 경우를 계산합니다.","headers":["지표","계산식","예제 결과"],"rows":[["Hit@3","Gold∩Top-3 ≠ ∅이면 1","1 (C1 또는 C2 존재)"],["Recall@3","|Gold∩Top-3| / |Gold|","2 / 3 ≈ 0.667"],["Precision@3","|Gold∩Top-3| / 3","2 / 3 ≈ 0.667"],["Candidate-k","Retriever 결과 후보 개수","Top-3는 세 건으로 제한"],["Gold=∅","관련 문서 없음","Recall@k N/A · No-answer 별도 평가"]],"note":"Precision@k는 수업에서 분모를 k로 고정합니다. 반환 결과가 k개보다 적은 사례도 같은 정의로 계산하고, 실제 반환 수를 별도 기록합니다. 동일 chunk_id의 중복 반환은 두 정답으로 세지 않으며, Gold=∅의 Recall은 N/A로 분리합니다."},{"id":"d28-c3-compute-recall","chapter":3,"kind":"code","title":"Recall@k를 Python으로 직접 계산해 봅니다","claim":"공식의 집합 교집합을 코드로 그대로 옮기면 지표가 어려운 수학이 아니라는 사실을 알 수 있습니다.","left":"검색 문서 ID 리스트·Gold ID 집합·k","right":"0~1 Recall 점수 또는 None(N/A)","code":{"lang":"python","title":"retrieval_metrics.py · Recall@k","raw":"def recall_at_k(retrieved: list[str], gold: set[str], k: int):\n    # Gold가 비어 있으면 나눌 수 없으므로 None = N/A\n    if k < 1:\n        raise ValueError(\"k must be positive\")\n    if not gold:\n        return None\n    top = set(retrieved[:k])  # 중복 ID는 한 번만 셉니다.\n    matched = top & gold     # 교집합: 양쪽에 존재하는 문서\n    return len(matched) / len(gold)\n\nprint(recall_at_k([\"C4\", \"C2\", \"C1\"], {\"C1\", \"C2\", \"C3\"}, 3))\n# 0.6666666666666666 = 2/3\n","desc":"Recall 계산은 별도 ML 모델이 아니라 기본 Python 수치 계산입니다. 관련 문서는 전체 Gold를 기준으로 세어야 합니다.","highlighted":["<span class=\"py-keyword\">def</span> <span class=\"py-function\">recall_at_k</span>(<span class=\"py-variable\">retrieved</span>: <span class=\"py-function\">list</span>[<span class=\"py-function\">str</span>], <span class=\"py-variable\">gold</span>: <span class=\"py-function\">set</span>[<span class=\"py-function\">str</span>], <span class=\"py-variable\">k</span>: <span class=\"py-function\">int</span>):","    <span class=\"py-comment\"># Gold가 비어 있으면 나눌 수 없으므로 None = N/A</span>","    <span class=\"py-keyword\">if</span> <span class=\"py-variable\">k</span> &lt; <span class=\"py-number\">1</span>:","        <span class=\"py-keyword\">raise</span> <span class=\"py-variable\">ValueError</span>(<span class=\"py-string\">&quot;</span><span class=\"py-string\">k must be positive</span><span class=\"py-string\">&quot;</span>)","    <span class=\"py-keyword\">if</span> not <span class=\"py-variable\">gold</span>:","        <span class=\"py-keyword\">return</span> <span class=\"py-keyword\">None</span>","    <span class=\"py-variable\">top</span> = <span class=\"py-function\">set</span>(<span class=\"py-variable\">retrieved</span>[:<span class=\"py-variable\">k</span>])  <span class=\"py-comment\"># 중복 ID는 한 번만 셉니다.</span>","    <span class=\"py-variable\">matched</span> = <span class=\"py-variable\">top</span> &amp; <span class=\"py-variable\">gold</span>     <span class=\"py-comment\"># 교집합: 양쪽에 존재하는 문서</span>","    <span class=\"py-keyword\">return</span> <span class=\"py-function\">len</span>(<span class=\"py-variable\">matched</span>) / <span class=\"py-function\">len</span>(<span class=\"py-variable\">gold</span>)","","<span class=\"py-function\">print</span>(<span class=\"py-variable\">recall_at_k</span>([<span class=\"py-string\">&quot;</span><span class=\"py-string\">C4</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C2</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C1</span><span class=\"py-string\">&quot;</span>], {<span class=\"py-string\">&quot;</span><span class=\"py-string\">C1</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C2</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C3</span><span class=\"py-string\">&quot;</span>}, <span class=\"py-number\">3</span>))","<span class=\"py-comment\"># 0.6666666666666666 = 2/3</span>",""]},"flowTrace":[{"label":"Top-k 선택","input":"[C4,C2,C1] · k=3","output":"{C4,C2,C1}","line":7,"why":"앞의 세 문서를 집합으로 변환합니다."},{"label":"교집합 계산","input":"Gold {C1,C2,C3}","output":"일치 {C1,C2}","line":8,"why":"C1·C2 두 문서만 양쪽에 있습니다."},{"label":"Recall 반환","input":"일치 2건 / Gold 3건","output":"0.6667","line":9,"why":"분모는 검색 후보 수가 아니라 전체 Gold 수입니다."}],"introTerms":[{"term":"set() / 교집합(&)","meaning":"중복 없는 ID 집합을 만들어 양쪽에 포함된 문서를 찾습니다.","use":"검색된 관련 문서의 개수를 계산하는 데 사용합니다."},{"term":"None","meaning":"이 경우 계산할 수 없는 상태를 뜻합니다.","use":"Gold가 없는 질문은 Recall 평균에서 제외합니다."}]},{"id":"d28-c3-precision-hit","chapter":3,"kind":"code","title":"Precision@k와 Hit@k를 같은 입력으로 계산합니다","claim":"같은 관련 문서 2건이라도 Precision은 비율, Hit는 하나라도 존재하는지만 봅니다.","left":"Top-k 검색 문서 ID·Gold ID","right":"Precision 비율과 Hit 0/1","code":{"lang":"python","title":"retrieval_metrics.py · Precision@k · Hit@k","raw":"def precision_at_k(retrieved: list[str], gold: set[str], k: int):\n    if k < 1:\n        raise ValueError(\"k must be positive\")\n    matched = len(set(retrieved[:k]) & gold)\n    return matched / k  # 수업의 정의: 분모는 항상 k\n\ndef hit_at_k(retrieved: list[str], gold: set[str], k: int):\n    if k < 1:\n        raise ValueError(\"k must be positive\")\n    # Hit은 단 하나의 관련 문서만 있어도 1입니다.\n    return int(bool(set(retrieved[:k]) & gold))\n\ngold = {\"C1\", \"C2\", \"C3\"}\nids = [\"C4\", \"C2\", \"C1\"]\nprint(precision_at_k(ids, gold, 3))  # 2/3\nprint(hit_at_k(ids, gold, 3))        # 1\n","desc":"Precision@k와 Hit@k는 같은 교집합을 활용하지만 분모·반환 형태가 다릅니다.","highlighted":["<span class=\"py-keyword\">def</span> <span class=\"py-function\">precision_at_k</span>(<span class=\"py-variable\">retrieved</span>: <span class=\"py-function\">list</span>[<span class=\"py-function\">str</span>], <span class=\"py-variable\">gold</span>: <span class=\"py-function\">set</span>[<span class=\"py-function\">str</span>], <span class=\"py-variable\">k</span>: <span class=\"py-function\">int</span>):","    <span class=\"py-keyword\">if</span> <span class=\"py-variable\">k</span> &lt; <span class=\"py-number\">1</span>:","        <span class=\"py-keyword\">raise</span> <span class=\"py-variable\">ValueError</span>(<span class=\"py-string\">&quot;</span><span class=\"py-string\">k must be positive</span><span class=\"py-string\">&quot;</span>)","    <span class=\"py-variable\">matched</span> = <span class=\"py-function\">len</span>(<span class=\"py-function\">set</span>(<span class=\"py-variable\">retrieved</span>[:<span class=\"py-variable\">k</span>]) &amp; <span class=\"py-variable\">gold</span>)","    <span class=\"py-keyword\">return</span> <span class=\"py-variable\">matched</span> / <span class=\"py-variable\">k</span>  <span class=\"py-comment\"># 수업의 정의: 분모는 항상 k</span>","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">hit_at_k</span>(<span class=\"py-variable\">retrieved</span>: <span class=\"py-function\">list</span>[<span class=\"py-function\">str</span>], <span class=\"py-variable\">gold</span>: <span class=\"py-function\">set</span>[<span class=\"py-function\">str</span>], <span class=\"py-variable\">k</span>: <span class=\"py-function\">int</span>):","    <span class=\"py-keyword\">if</span> <span class=\"py-variable\">k</span> &lt; <span class=\"py-number\">1</span>:","        <span class=\"py-keyword\">raise</span> <span class=\"py-variable\">ValueError</span>(<span class=\"py-string\">&quot;</span><span class=\"py-string\">k must be positive</span><span class=\"py-string\">&quot;</span>)","    <span class=\"py-comment\"># Hit은 단 하나의 관련 문서만 있어도 1입니다.</span>","    <span class=\"py-keyword\">return</span> <span class=\"py-function\">int</span>(<span class=\"py-function\">bool</span>(<span class=\"py-function\">set</span>(<span class=\"py-variable\">retrieved</span>[:<span class=\"py-variable\">k</span>]) &amp; <span class=\"py-variable\">gold</span>))","","<span class=\"py-variable\">gold</span> = {<span class=\"py-string\">&quot;</span><span class=\"py-string\">C1</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C2</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C3</span><span class=\"py-string\">&quot;</span>}","<span class=\"py-variable\">ids</span> = [<span class=\"py-string\">&quot;</span><span class=\"py-string\">C4</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C2</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C1</span><span class=\"py-string\">&quot;</span>]","<span class=\"py-function\">print</span>(<span class=\"py-variable\">precision_at_k</span>(<span class=\"py-variable\">ids</span>, <span class=\"py-variable\">gold</span>, <span class=\"py-number\">3</span>))  <span class=\"py-comment\"># 2/3</span>","<span class=\"py-function\">print</span>(<span class=\"py-variable\">hit_at_k</span>(<span class=\"py-variable\">ids</span>, <span class=\"py-variable\">gold</span>, <span class=\"py-number\">3</span>))        <span class=\"py-comment\"># 1</span>",""]},"flowTrace":[],"introTerms":[{"term":"bool()","meaning":"값이 존재하면 True, 비어 있으면 False로 변환합니다.","use":"교집합에 Gold 문서가 하나라도 있는지 판단합니다."},{"term":"int()","meaning":"True를 1, False를 0으로 변환할 수 있습니다.","use":"Hit@k를 0/1로 기록합니다."}]},{"id":"d28-c3-context-vs-candidate","chapter":3,"kind":"concept","title":"Candidate Recall과 실제 Context Recall은 왜 다른가요?","claim":"Retriever 후보에는 정답이 있어도 Context 선택 단계에서 빠질 수 있기 때문입니다.","left":[["Candidate-k=10","E5 검색에서 관련 Gold를 찾은 비율입니다. Reranker가 평가할 문서가 충분한지 판단합니다."],["Context-k=3","LLM에 실제 포함된 문서만 평가합니다. Context Builder의 길이 제한·Top-N 때문에 Gold가 빠질 수 있습니다."]],"right":[["현업 문제","Candidate Recall@10은 높지만 Context Recall@3이 낮다면 검색만 늘리기보다 Reranking·Context 전략을 확인합니다."],["출처 경계","실제로 포함된 ID만 Citation 검증에 사용해야 합니다. 검색만 했던 다른 문서는 근거로 인정하지 않습니다."]],"distinction":"같은 Recall 공식이라도 평가에 사용하는 목록이 candidate_ids인지 included_ids인지 명시해야 합니다."},{"id":"d28-c3-recall-demo","chapter":3,"kind":"demo","title":"시연 · Top-k를 바꾸며 세 지표를 직접 계산합니다","claim":"같은 Gold와 후보에 대해 k를 바꿔 Hit·Recall·Precision 값의 차이를 확인합니다.","demo":"recall-lab","left":[["정답 레이블","관련 문서를 둘 이상 지정한 사례를 사용합니다."],["k","검색 상위 몇 개를 비교하는지 변경합니다."]],"right":[["세 지표","분모가 달라 점수가 서로 달라질 수 있습니다."],["N/A","Gold=∅이면 Recall은 계산 대상이 아닙니다."]],"note":"표의 ID·순위는 교육용 고정 결과이며 실제 검색 모델 측정값이 아닙니다."},{"id":"d28-c3-practice","chapter":3,"kind":"practice","title":"실습 03 안내 · Recall·Precision·Hit 계산","claim":"실제 LangChain Retriever의 반환 Document ID와 Gold를 비교하는 함수를 구현합니다.","preparation":"교육용 검색 ID·정답 ID·k=1~5","output":"질문별 Recall@k·Precision@k·Hit@k 표","levels":[{"name":"01_basic · 기본필수","folder":"01_basic","task":"Recall 함수의 집합 교집합·분모를 TODO로 완성합니다.","result":"핵심 입출력·실행 흐름 확인"},{"name":"02_intermediate · 응용","folder":"02_intermediate","task":"Precision·Hit과 중복/반환 부족 검사를 모듈로 나눕니다.","result":"기능 분리·조건별 테스트"},{"name":"03_advanced · 심화","folder":"03_advanced","task":"No-answer·필터·빈 후보·k 초과·평균 집계 정책을 테스트합니다.","result":"운영 경계·로그·재현성 검증"}],"criterion":"Gold와 retrieved를 분리하고 지표의 분모를 설명할 수 있습니다.","caution":"Gold가 빈 질문을 Recall=0으로 계산해 평균을 왜곡하지 않습니다.","check_questions":[["Gold가 4개인데 Top-5에서 2개를 찾았다면 Recall@5는?","2/4=0.5입니다. 분모는 Gold 전체 문서 수입니다."],["Top-5 중 2개가 관련이라면 Precision@5는?","2/5=0.4입니다. 수업의 정의에서는 k를 분모로 사용합니다."],["Hit@5=1이면 관련 문서를 모두 찾은 건가요?","아닙니다. 최소 한 문서가 들어 있다는 뜻일 뿐입니다."]],"check_title":"이해 확인 · 포함률 지표"},{"id":"d28-c4-ranking-definition","chapter":4,"kind":"concept","title":"MRR과 nDCG는 어떤 문제를 해결하나요?","claim":"정답을 찾았는지 여부만으로는 “정답을 몇 번째로 보여 줬는가”를 판단하기 어렵기 때문입니다.","left":[["MRR · 처음 정답의 순위","관련 문서가 처음 등장한 위치를 역수로 계산하고 여러 질문의 평균을 냅니다."],["nDCG · 등급과 순위","매우 관련된 문서를 앞에 두면 점수가 더 커지도록 순위 위치와 관련성 등급을 함께 평가합니다."]],"right":[["전날 Reranking과 연결","Cross-Encoder가 후보 순위를 바꾼다면 Recall@10은 그대로일 수 있어도 MRR·nDCG는 달라질 수 있습니다."],["현업 사용","검색 상위 2~3개를 LLM Context에 넣는 RAG에서 “정답이 상위에 오는가”를 판단합니다."]],"distinction":"MRR은 첫 관련 문서만 반영합니다. 여러 관련 문서의 전체 정렬 품질은 nDCG처럼 다른 지표로 봐야 합니다.","references":[{"label":"Microsoft · Fundamentals of Text Retrieval","url":"https://www.microsoft.com/en-us/research/wp-content/uploads/2017/06/fntir2018-neuralir-mitra.pdf"},{"label":"scikit-learn · Ranking metric nDCG","url":"https://scikit-learn.org/stable/modules/model_evaluation.html#ndcg-score"}]},{"id":"d28-c4-rr-mrr","chapter":4,"kind":"table","title":"Reciprocal Rank에서 MRR로 넘어가는 계산","claim":"관련 문서의 첫 순위 r이 정해지면 Reciprocal Rank=1/r입니다.","headers":["질문","첫 관련 문서 순위","RR = 1/r"],"rows":[["Q1","1위","1.000"],["Q2","3위","0.333"],["Q3","2위","0.500"],["Q4","Top-k 안에 없음","0.000"],["4개 질문 평균","(1+0.333+0.5+0)/4","MRR ≈ 0.458"]],"note":"MRR의 분모는 평가에 포함된 질문 수입니다. No-answer 질문의 처리 여부는 평가셋 정책으로 분리해야 합니다."},{"id":"d28-c4-compute-mrr","chapter":4,"kind":"code","title":"MRR을 Python으로 직접 계산합니다","claim":"각 질문에서 첫 관련 문서의 순위를 찾고 역수의 평균을 구합니다.","left":"여러 질문의 ranked_ids · Gold ID","right":"각 RR과 전체 MRR","code":{"lang":"python","title":"ranking_metrics.py · MRR","raw":"def reciprocal_rank(ranked_ids: list[str], gold_ids: set[str], k: int):\n    # 순위는 0부터 세는 Python index가 아니라 1부터 시작합니다.\n    for rank, doc_id in enumerate(ranked_ids[:k], start=1):\n        if doc_id in gold_ids:\n            return 1.0 / rank  # 첫 정답만 사용합니다.\n    return 0.0\n\nquestions = [\n    ([\"C1\", \"C2\"], {\"C1\"}),     # 첫 정답: 1위\n    ([\"C4\", \"C2\", \"C3\"], {\"C3\"}), # 첫 정답: 3위\n    ([\"C1\", \"C5\"], {\"C5\"}),     # 첫 정답: 2위\n    ([\"C7\", \"C8\"], {\"C2\"}),     # 정답 후보 없음\n]\nrr = [reciprocal_rank(ids, gold, 3) for ids, gold in questions]\nmrr = sum(rr) / len(rr)\nprint(round(mrr, 3))  # 0.458\n","desc":"Reciprocal Rank(개별 질문)와 MRR(질문 평균)을 구분합니다. 평가할 질문 집합은 미리 정의합니다.","highlighted":["<span class=\"py-keyword\">def</span> <span class=\"py-function\">reciprocal_rank</span>(<span class=\"py-variable\">ranked_ids</span>: <span class=\"py-function\">list</span>[<span class=\"py-function\">str</span>], <span class=\"py-variable\">gold_ids</span>: <span class=\"py-function\">set</span>[<span class=\"py-function\">str</span>], <span class=\"py-variable\">k</span>: <span class=\"py-function\">int</span>):","    <span class=\"py-comment\"># 순위는 0부터 세는 Python index가 아니라 1부터 시작합니다.</span>","    <span class=\"py-keyword\">for</span> <span class=\"py-variable\">rank</span>, <span class=\"py-variable\">doc_id</span> in <span class=\"py-function\">enumerate</span>(<span class=\"py-variable\">ranked_ids</span>[:<span class=\"py-variable\">k</span>], <span class=\"py-variable\">start</span>=<span class=\"py-number\">1</span>):","        <span class=\"py-keyword\">if</span> <span class=\"py-variable\">doc_id</span> in <span class=\"py-variable\">gold_ids</span>:","            <span class=\"py-keyword\">return</span> <span class=\"py-number\">1.0</span> / <span class=\"py-variable\">rank</span>  <span class=\"py-comment\"># 첫 정답만 사용합니다.</span>","    <span class=\"py-keyword\">return</span> <span class=\"py-number\">0.0</span>","","<span class=\"py-variable\">questions</span> = [","    ([<span class=\"py-string\">&quot;</span><span class=\"py-string\">C1</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C2</span><span class=\"py-string\">&quot;</span>], {<span class=\"py-string\">&quot;</span><span class=\"py-string\">C1</span><span class=\"py-string\">&quot;</span>}),     <span class=\"py-comment\"># 첫 정답: 1위</span>","    ([<span class=\"py-string\">&quot;</span><span class=\"py-string\">C4</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C2</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C3</span><span class=\"py-string\">&quot;</span>], {<span class=\"py-string\">&quot;</span><span class=\"py-string\">C3</span><span class=\"py-string\">&quot;</span>}), <span class=\"py-comment\"># 첫 정답: 3위</span>","    ([<span class=\"py-string\">&quot;</span><span class=\"py-string\">C1</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C5</span><span class=\"py-string\">&quot;</span>], {<span class=\"py-string\">&quot;</span><span class=\"py-string\">C5</span><span class=\"py-string\">&quot;</span>}),     <span class=\"py-comment\"># 첫 정답: 2위</span>","    ([<span class=\"py-string\">&quot;</span><span class=\"py-string\">C7</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C8</span><span class=\"py-string\">&quot;</span>], {<span class=\"py-string\">&quot;</span><span class=\"py-string\">C2</span><span class=\"py-string\">&quot;</span>}),     <span class=\"py-comment\"># 정답 후보 없음</span>","]","<span class=\"py-variable\">rr</span> = [<span class=\"py-variable\">reciprocal_rank</span>(<span class=\"py-variable\">ids</span>, <span class=\"py-variable\">gold</span>, <span class=\"py-number\">3</span>) <span class=\"py-keyword\">for</span> <span class=\"py-variable\">ids</span>, <span class=\"py-variable\">gold</span> in <span class=\"py-variable\">questions</span>]","<span class=\"py-variable\">mrr</span> = <span class=\"py-function\">sum</span>(<span class=\"py-variable\">rr</span>) / <span class=\"py-function\">len</span>(<span class=\"py-variable\">rr</span>)","<span class=\"py-function\">print</span>(<span class=\"py-function\">round</span>(<span class=\"py-variable\">mrr</span>, <span class=\"py-number\">3</span>))  <span class=\"py-comment\"># 0.458</span>"]},"flowTrace":[{"label":"첫 정답 탐색","input":"Q2: C4,C2,C3 / Gold=C3","output":"첫 정답=3위","line":3,"why":"1위부터 살펴보고 최초 관련 문서를 찾습니다."},{"label":"RR 계산","input":"rank=3","output":"1/3≈0.333","line":5,"why":"앞에 있을수록 점수가 큽니다."},{"label":"MRR 집계","input":"4개 질문의 RR","output":"평균≈0.458","line":17,"why":"평가 질문 수로 나눕니다."}],"introTerms":[{"term":"enumerate(..., start=1)","meaning":"리스트 원소와 1부터 시작하는 순위를 함께 반환합니다.","use":"문서 순위를 1위, 2위로 계산합니다."},{"term":"RR / MRR","meaning":"RR은 한 질문의 첫 정답 순위 역수, MRR은 여러 RR의 평균입니다.","use":"Reranker 전후 상위 정답 위치 비교에 사용합니다."}]},{"id":"d28-c4-dcg-intro","chapter":4,"kind":"concept","title":"DCG는 왜 로그로 순위에 할인을 적용하나요?","claim":"앞쪽 문서가 뒤쪽 문서보다 사용될 가능성이 높다고 보고, 아래 순위일수록 기여를 낮추는 방식입니다.","left":[["관련성 등급을 반영","0(무관)·1(부분 관련)·2(매우 관련)처럼 레이블을 정의해 높은 등급 문서를 더 높게 평가합니다."],["위치 할인","같은 등급 2 문서라도 1위면 3점을, 3위면 3/log2(4)=1.5점을 더합니다."]],"right":[["DCG@k","Σ (2^grade − 1) / log2(rank + 1). 등급 0 문서는 0점을 더합니다."],["IDCG@k","같은 후보의 Gold 등급을 가장 이상적인 순서로 나열했을 때 얻는 DCG입니다."]],"distinction":"nDCG@k = DCG@k / IDCG@k입니다. 검색된 후보만 이상 정렬하는 것이 아니라 평가 가능한 Gold 등급 기준으로 이상 순서를 정의해야 합니다.","references":[{"label":"scikit-learn · Ranking metric nDCG","url":"https://scikit-learn.org/stable/modules/model_evaluation.html#ndcg-score"}]},{"id":"d28-c4-dcg-steps","chapter":4,"kind":"table","title":"nDCG 계산 · 예시 숫자를 순서대로 따라갑니다","claim":"문서의 graded Gold가 C3=2, C1=1, 나머지는 0인 상황입니다.","headers":["순위","문서·등급·Gain","DCG 기여값"],"rows":[["1","C1 · 등급 1 · Gain=1","1 / log₂(2) = 1.000"],["2","C2 · 등급 0 · Gain=0","0 / log₂(3) = 0"],["3","C3 · 등급 2 · Gain=3","3 / log₂(4) = 1.500"],["DCG@3","1 + 0 + 1.5","2.500"],["IDCG@3","이상 순위: C3(2), C1(1), C2(0)","3 + 1/log₂(3) ≈ 3.631"],["nDCG@3","2.500 / 3.631","≈ 0.689"]],"note":"일관된 gain 정의 2^grade−1을 사용합니다. grade가 0만 있으면 IDCG=0이므로 N/A 처리합니다. 순위 계산 전 중복 청크는 제거하고 Gold가 없는 질문은 별도 평가합니다."},{"id":"d28-c4-ndcg-code","chapter":4,"kind":"code","title":"nDCG@k를 Python으로 직접 계산합니다","claim":"입력 문서의 Gold 관련성 등급으로 DCG와 이상적인 IDCG를 계산합니다.","left":"검색 순위·등급 dict·k","right":"0~1 nDCG 또는 None","code":{"lang":"python","title":"ranking_metrics.py · nDCG@k","raw":"from math import log2\n\ndef dcg_at_k(ranked_ids: list[str], grades: dict[str, int], k: int):\n    # 교육용 예시에서는 미등급 문서를 0으로 가정합니다. 실무는 미판정과 무관을 구별합니다.\n    return sum((2 ** grades.get(doc_id, 0) - 1) / log2(rank + 1)\n               for rank, doc_id in enumerate(ranked_ids[:k], start=1))\n\ndef ndcg_at_k(ids: list[str], grades: dict[str, int], k: int):\n    ideal = sorted(grades, key=grades.get, reverse=True)\n    best = dcg_at_k(ideal, grades, k)  # 이상적인 순서의 DCG\n    if best == 0:\n        return None  # 평가 가능한 관련 문서 없음\n    return dcg_at_k(ids, grades, k) / best\n\nlabels = {\"C3\": 2, \"C1\": 1, \"C2\": 0}\nprint(round(ndcg_at_k([\"C1\", \"C2\", \"C3\"], labels, 3), 3))\n# 0.689\n","desc":"이 코드는 2^grade-1 Gain을 사용하는 교육용 nDCG입니다. 실제 평가에서는 미판정(unjudged) 문서를 무관(0)과 구별하고 판정 범위를 명시해야 합니다.","highlighted":["<span class=\"py-keyword\">from</span> <span class=\"py-variable\">math</span> <span class=\"py-keyword\">import</span> <span class=\"py-variable\">log2</span>","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">dcg_at_k</span>(<span class=\"py-variable\">ranked_ids</span>: <span class=\"py-function\">list</span>[<span class=\"py-function\">str</span>], <span class=\"py-variable\">grades</span>: <span class=\"py-function\">dict</span>[<span class=\"py-function\">str</span>, <span class=\"py-function\">int</span>], <span class=\"py-variable\">k</span>: <span class=\"py-function\">int</span>):","    <span class=\"py-comment\"># 교육용 예시에서는 미등급 문서를 0으로 가정합니다. 실무는 미판정과 무관을 구별합니다.</span>","    <span class=\"py-keyword\">return</span> <span class=\"py-function\">sum</span>((<span class=\"py-number\">2</span> ** <span class=\"py-variable\">grades</span>.<span class=\"py-variable\">get</span>(<span class=\"py-variable\">doc_id</span>, <span class=\"py-number\">0</span>) - <span class=\"py-number\">1</span>) / <span class=\"py-variable\">log2</span>(<span class=\"py-variable\">rank</span> + <span class=\"py-number\">1</span>)","               <span class=\"py-keyword\">for</span> <span class=\"py-variable\">rank</span>, <span class=\"py-variable\">doc_id</span> in <span class=\"py-function\">enumerate</span>(<span class=\"py-variable\">ranked_ids</span>[:<span class=\"py-variable\">k</span>], <span class=\"py-variable\">start</span>=<span class=\"py-number\">1</span>))","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">ndcg_at_k</span>(<span class=\"py-variable\">ids</span>: <span class=\"py-function\">list</span>[<span class=\"py-function\">str</span>], <span class=\"py-variable\">grades</span>: <span class=\"py-function\">dict</span>[<span class=\"py-function\">str</span>, <span class=\"py-function\">int</span>], <span class=\"py-variable\">k</span>: <span class=\"py-function\">int</span>):","    <span class=\"py-variable\">ideal</span> = <span class=\"py-function\">sorted</span>(<span class=\"py-variable\">grades</span>, <span class=\"py-variable\">key</span>=<span class=\"py-variable\">grades</span>.<span class=\"py-variable\">get</span>, <span class=\"py-variable\">reverse</span>=<span class=\"py-keyword\">True</span>)","    <span class=\"py-variable\">best</span> = <span class=\"py-variable\">dcg_at_k</span>(<span class=\"py-variable\">ideal</span>, <span class=\"py-variable\">grades</span>, <span class=\"py-variable\">k</span>)  <span class=\"py-comment\"># 이상적인 순서의 DCG</span>","    <span class=\"py-keyword\">if</span> <span class=\"py-variable\">best</span> == <span class=\"py-number\">0</span>:","        <span class=\"py-keyword\">return</span> <span class=\"py-keyword\">None</span>  <span class=\"py-comment\"># 평가 가능한 관련 문서 없음</span>","    <span class=\"py-keyword\">return</span> <span class=\"py-variable\">dcg_at_k</span>(<span class=\"py-variable\">ids</span>, <span class=\"py-variable\">grades</span>, <span class=\"py-variable\">k</span>) / <span class=\"py-variable\">best</span>","","<span class=\"py-variable\">labels</span> = {<span class=\"py-string\">&quot;</span><span class=\"py-string\">C3</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">2</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C1</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">1</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C2</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">0</span>}","<span class=\"py-function\">print</span>(<span class=\"py-function\">round</span>(<span class=\"py-variable\">ndcg_at_k</span>([<span class=\"py-string\">&quot;</span><span class=\"py-string\">C1</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C2</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">C3</span><span class=\"py-string\">&quot;</span>], <span class=\"py-variable\">labels</span>, <span class=\"py-number\">3</span>), <span class=\"py-number\">3</span>))","<span class=\"py-comment\"># 0.689</span>",""]},"flowTrace":[],"introTerms":[{"term":"DCG / IDCG","meaning":"DCG는 현재 순위의 점수, IDCG는 이상적인 순위의 점수입니다.","use":"nDCG를 0~1 범위로 정규화합니다."},{"term":"log2()","meaning":"밑이 2인 로그 함수입니다.","use":"뒤쪽 순위의 이득을 점점 작게 합니다."}]},{"id":"d28-c4-ranking-demo","chapter":4,"kind":"demo","title":"시연 · 문서의 순서와 등급을 바꾸며 MRR·nDCG 계산","claim":"Gold와 후보가 같아도 순서가 달라지면 MRR·nDCG가 달라집니다.","demo":"ranking-lab","left":[["첫 정답 순위","정답을 1위로 옮겼을 때 RR의 변화를 봅니다."],["등급","매우 관련한 문서가 상위인지 확인합니다."]],"right":[["DCG 분자","현재 순위의 등급별 할인 점수를 합산합니다."],["IDCG 분모","이상 정렬 점수로 정규화합니다."]],"note":"모든 후보·점수는 교육용 고정 데이터입니다. 공식에 따라 브라우저가 수치를 직접 계산합니다."},{"id":"d28-c4-practice","chapter":4,"kind":"practice","title":"실습 04 안내 · MRR과 nDCG 계산","claim":"Reranking 전후의 문서 순서에 따라 순위 지표를 계산합니다.","preparation":"Gold 등급·문서 순위 4종·k 설정","output":"RR/MRR·DCG/IDCG/nDCG 표","levels":[{"name":"01_basic · 기본필수","folder":"01_basic","task":"첫 관련 문서의 순위를 찾고 RR을 계산합니다.","result":"핵심 입출력·실행 흐름 확인"},{"name":"02_intermediate · 응용","folder":"02_intermediate","task":"MRR 집계와 등급별 DCG를 함수로 분리합니다.","result":"기능 분리·조건별 테스트"},{"name":"03_advanced · 심화","folder":"03_advanced","task":"동률·No-answer·미반환·평균 정책을 검사하고 리포트를 출력합니다.","result":"운영 경계·로그·재현성 검증"}],"criterion":"MRR과 nDCG가 서로 다른 질문에 답한다는 것을 설명합니다.","caution":"정답이 하나도 없는 질문을 nDCG=1 같은 성공으로 오인하지 않습니다.","check_questions":[["첫 정답이 4위라면 RR은?","1/4=0.25입니다."],["nDCG가 MRR보다 추가로 평가하는 것은?","관련성 등급이 다른 여러 문서의 순서와 위치입니다."],["Rerank 후 Recall@10은 같고 MRR만 높아질 수 있나요?","예. 후보 집합은 같고 관련 문서가 더 높은 순위로 이동했다면 가능합니다."]],"check_title":"이해 확인 · 순위 평가"},{"id":"d28-c5-gen-triad","chapter":5,"kind":"table","title":"Faithfulness · Relevance · Correctness를 비교합니다","claim":"세 지표의 비교 대상이 다르므로 평가 결과가 서로 다를 수 있습니다.","headers":["지표","비교하는 것","핵심 질문"],"rows":[["Faithfulness · 충실성","생성 답변의 주장 ↔ 제공된 Context","근거에서 이 주장을 추론할 수 있는가?"],["Answer Relevance · 관련성","사용자 질문 ↔ 생성 답변","사용자가 물은 것에 제대로 답했는가?"],["Answer Correctness · 정답성","생성 답변 ↔ Reference Answer/업무 사실","실제 정답과 사실·조건이 맞는가?"],["Citation Validity","출처 ID ↔ 실제 included_ids","모델이 넣은 ID가 제공된 자료 안에 있는가?"],["Human Review","질문·문서·답변을 사람이 직접 검토","숫자·예외·표현이 실제로 올바른가?"]],"note":"Faithfulness가 높아도 답변 내용이 짧거나 질문에서 벗어나면 Relevance가 낮을 수 있습니다.","references":[{"label":"Ragas · Faithfulness metric","url":"https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/faithfulness/"},{"label":"LangSmith · Evaluate a RAG application","url":"https://docs.langchain.com/langsmith/evaluate-rag-tutorial"}]},{"id":"d28-c5-faithfulness","chapter":5,"kind":"concept","title":"Faithfulness를 계산할 때 문장을 주장 단위로 나누는 이유","claim":"하나의 답변에 지지되는 사실과 지지되지 않는 사실이 섞여 있을 수 있기 때문입니다.","left":[["Claim 분해","“15분까지 지각이고, 20분 후에는 결석 처리됩니다.” → 주장1: 15분까지 지각 / 주장2: 20분 후 결석."],["Context 대조","현재 규정에 ‘15분 초과 결석’이 있으면 주장2도 지원될 수 있지만, 문서에 없는 예외를 만들면 그 주장은 비지원입니다."]],"right":[["예시","3개 주장 중 2개가 Context에서 확인되면 Claim-level Faithfulness=2/3입니다."],["주의","주장을 나누는 방식과 지원 판정이 주관적일 수 있어 LLM Judge와 사람 판정을 함께 비교해야 합니다."]],"distinction":"지원된 주장 수 / 전체 주장 수는 이해용 기본 정의입니다. 자동 평가 도구의 세부 프롬프트와 정책에 따라 점수 차이가 생길 수 있습니다.","references":[{"label":"Ragas · Faithfulness metric","url":"https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/faithfulness/"}]},{"id":"d28-c5-three-cases","chapter":5,"kind":"table","title":"같은 질문인데 평가 결과가 다를 수 있습니다","claim":"원 질문: “정확한 과제 마감 날짜는 언제인가요?”","headers":["예시 답변","Faithfulness","Relevance · Correctness"],"rows":[["“담당자가 공지한 날짜를 따릅니다.”","높음: Context에 그대로 있음","관련 높음 · 정확한 날짜는 설명하지 못하므로 불완전"],["“내일 18시까지입니다.”","낮음: 근거에 없음","질문에 직접 답하지만 실제 정답성 보장 불가"],["“회의실 예약을 신청하세요.”","낮음 또는 무관","질문 관련성 낮음"],["“제공된 문서에는 정확한 날짜가 없습니다.”","Context와 일치 가능","No-answer 정책에 적합"]],"note":"이 표는 직관 설명용 정성 판정이며 모델이 계산한 정량 평가 결과가 아닙니다."},{"id":"d28-c5-claim-scoring","chapter":5,"kind":"code","title":"주장별 지원 여부를 계산해 Faithfulness의 뜻을 확인합니다","claim":"문장의 주장마다 Context 지원 여부를 사람이 정한 뒤 비율을 계산합니다.","left":"답변에서 추출한 주장·문서 지원 여부","right":"Claim-level Faithfulness 점수","code":{"lang":"python","title":"generation_metrics.py · Claim 지원 비율","raw":"# 사람이 판정한 학습용 Claim입니다. 실제 RAG/LLM 호출 없음.\nclaims = [\n    {\"text\": \"15분까지는 지각입니다.\", \"supported\": True},\n    {\"text\": \"15분 초과는 결석입니다.\", \"supported\": True},\n    {\"text\": \"벌금은 5만원입니다.\", \"supported\": False},\n]\n\ndef faithfulness_from_labels(items: list[dict]):\n    if not items:\n        return None  # 주장 0개는 100% 충실한 답으로 간주하지 않음\n    supported = sum(bool(item[\"supported\"]) for item in items)\n    return supported / len(items)\n\nprint(faithfulness_from_labels(claims))  # 2/3 = 0.667\n","desc":"실제 자동 평가 시에는 주장 추출과 문서 지원 판정 자체가 LLM Judge의 판단일 수 있습니다.","highlighted":["<span class=\"py-comment\"># 사람이 판정한 학습용 Claim입니다. 실제 RAG/LLM 호출 없음.</span>","<span class=\"py-variable\">claims</span> = [","    {<span class=\"py-string\">&quot;</span><span class=\"py-string\">text</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">15분까지는 지각입니다.</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">supported</span><span class=\"py-string\">&quot;</span>: <span class=\"py-keyword\">True</span>},","    {<span class=\"py-string\">&quot;</span><span class=\"py-string\">text</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">15분 초과는 결석입니다.</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">supported</span><span class=\"py-string\">&quot;</span>: <span class=\"py-keyword\">True</span>},","    {<span class=\"py-string\">&quot;</span><span class=\"py-string\">text</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">벌금은 5만원입니다.</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">supported</span><span class=\"py-string\">&quot;</span>: <span class=\"py-keyword\">False</span>},","]","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">faithfulness_from_labels</span>(<span class=\"py-variable\">items</span>: <span class=\"py-function\">list</span>[<span class=\"py-function\">dict</span>]):","    <span class=\"py-keyword\">if</span> not <span class=\"py-variable\">items</span>:","        <span class=\"py-keyword\">return</span> <span class=\"py-keyword\">None</span>  <span class=\"py-comment\"># 주장 0개는 100% 충실한 답으로 간주하지 않음</span>","    <span class=\"py-variable\">supported</span> = <span class=\"py-function\">sum</span>(<span class=\"py-function\">bool</span>(<span class=\"py-variable\">item</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">supported</span><span class=\"py-string\">&quot;</span>]) <span class=\"py-keyword\">for</span> <span class=\"py-variable\">item</span> in <span class=\"py-variable\">items</span>)","    <span class=\"py-keyword\">return</span> <span class=\"py-variable\">supported</span> / <span class=\"py-function\">len</span>(<span class=\"py-variable\">items</span>)","","<span class=\"py-function\">print</span>(<span class=\"py-variable\">faithfulness_from_labels</span>(<span class=\"py-variable\">claims</span>))  <span class=\"py-comment\"># 2/3 = 0.667</span>"]},"flowTrace":[],"introTerms":[{"term":"Claim","meaning":"답변에서 참/거짓 또는 근거 지원 여부를 판단할 수 있는 개별 주장입니다.","use":"긴 답변을 작게 쪼개 근거와 대조합니다."},{"term":"supported","meaning":"그 주장을 Context가 실제로 지지하면 True입니다.","use":"사람 또는 평가 모델이 판정합니다."}]},{"id":"d28-c5-llm-as-judge","chapter":5,"kind":"concept","title":"LLM-as-a-Judge는 무엇이고 왜 보조 도구인가요?","claim":"평가용 LLM에게 질문·근거·답변·평가 기준을 주어 답변의 품질을 판정하게 하는 방식입니다.","left":[["도입 이유","답변이 자연어라 완전한 문자열 일치만으로 사실성·유용성을 평가하기 어렵습니다."],["독립성","평가용 모델이 생성 모델과 같다면 공통 오류·편향이 나타날 수 있습니다. 사람이 일부 사례를 확인해야 합니다."]],"right":[["평가 입력","question, retrieved_contexts, response, reference_answer(정답성 평가인 경우)를 구분해 전달합니다."],["비용·개인정보","Judge 호출도 API 비용과 시간이 들며, 민감 문서를 외부 모델로 전송할 때는 권한·정책 검토가 필요합니다."]],"distinction":"LLM Judge 결과는 객관적 진실 판정기가 아닙니다. 불일치 사례를 샘플링해 사람이 검수합니다. 자동 평가와 사람 판정이 어긋나면 점수를 무조건 평균내지 않고 해당 문서·주장·평가 기준을 다시 확인합니다.","references":[{"label":"LangSmith · Evaluate a RAG application","url":"https://docs.langchain.com/langsmith/evaluate-rag-tutorial"}]},{"id":"d28-c5-judge-schema","chapter":5,"kind":"code","title":"Pydantic으로 평가 결과의 형태를 정의합니다","claim":"평가 LLM이 생성하는 값의 자료형을 고정하고, 평가 이유를 함께 기록합니다.","left":"Context·Claim·평가용 Chat Model","right":"supported + reason 구조화 평가 결과","code":{"lang":"python","title":"judge.py · Structured Output 계약","raw":"from pydantic import BaseModel, Field\nfrom langchain_core.prompts import ChatPromptTemplate\n\nclass JudgeResult(BaseModel):\n    supported: bool = Field(description=\"주장이 Context로 지지되는가\")\n    reason: str = Field(description=\"본문의 근거 또는 반례\")\n\njudge_prompt = ChatPromptTemplate.from_messages([\n    (\"system\", \"제공된 Context만으로 주장의 지지 여부를 판정하세요.\"),\n    (\"human\", \"Context:\\n{context}\\n\\nClaim:\\n{claim}\"),\n])\n# model은 별도로 설정한 평가용 Chat Model입니다.\n# 실제 API 요청 시 비용 발생: 아래 코드의 마지막 두 줄은 발췌입니다.\n# judge_chain = judge_prompt | judge_model.with_structured_output(JudgeResult)\n# result = judge_chain.invoke({\"context\": context, \"claim\": claim})\n","desc":"LangChain의 ChatPromptTemplate와 Structured Output을 복습합니다. 주석 처리된 호출은 실제 모델 설정 후 연결합니다.","highlighted":["<span class=\"py-keyword\">from</span> <span class=\"py-variable\">pydantic</span> <span class=\"py-keyword\">import</span> <span class=\"py-variable\">BaseModel</span>, <span class=\"py-variable\">Field</span>","<span class=\"py-keyword\">from</span> <span class=\"py-variable\">langchain_core</span><span class=\"py-variable\">.</span><span class=\"py-variable\">prompts</span> <span class=\"py-keyword\">import</span> <span class=\"py-variable\">ChatPromptTemplate</span>","","<span class=\"py-keyword\">class</span> <span class=\"py-type\">JudgeResult</span>(<span class=\"py-variable\">BaseModel</span>):","    <span class=\"py-variable\">supported</span>: <span class=\"py-function\">bool</span> = <span class=\"py-variable\">Field</span>(<span class=\"py-variable\">description</span>=<span class=\"py-string\">&quot;</span><span class=\"py-string\">주장이 Context로 지지되는가</span><span class=\"py-string\">&quot;</span>)","    <span class=\"py-variable\">reason</span>: <span class=\"py-function\">str</span> = <span class=\"py-variable\">Field</span>(<span class=\"py-variable\">description</span>=<span class=\"py-string\">&quot;</span><span class=\"py-string\">본문의 근거 또는 반례</span><span class=\"py-string\">&quot;</span>)","","<span class=\"py-variable\">judge_prompt</span> = <span class=\"py-variable\">ChatPromptTemplate</span>.<span class=\"py-variable\">from_messages</span>([","    (<span class=\"py-string\">&quot;</span><span class=\"py-string\">system</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">제공된 Context만으로 주장의 지지 여부를 판정하세요.</span><span class=\"py-string\">&quot;</span>),","    (<span class=\"py-string\">&quot;</span><span class=\"py-string\">human</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">Context:</span><span class=\"py-string\">\\n</span><span class=\"py-string\">{context}</span><span class=\"py-string\">\\n</span><span class=\"py-string\">\\n</span><span class=\"py-string\">Claim:</span><span class=\"py-string\">\\n</span><span class=\"py-string\">{claim}</span><span class=\"py-string\">&quot;</span>),","])","<span class=\"py-comment\"># model은 별도로 설정한 평가용 Chat Model입니다.</span>","<span class=\"py-comment\"># 실제 API 요청 시 비용 발생: 아래 코드의 마지막 두 줄은 발췌입니다.</span>","<span class=\"py-comment\"># judge_chain = judge_prompt | judge_model.with_structured_output(JudgeResult)</span>","<span class=\"py-comment\"># result = judge_chain.invoke({&quot;context&quot;: context, &quot;claim&quot;: claim})</span>"]},"flowTrace":[],"introTerms":[{"term":"LLM-as-a-Judge","meaning":"별도의 LLM이 생성 답변을 일정한 평가 기준으로 판정하는 방식입니다.","use":"정성 평가를 자동화할 때 사용합니다."},{"term":"with_structured_output()","meaning":"LLM 응답을 지정한 Pydantic Schema 형태로 받도록 구성합니다.","use":"bool과 설명 문자열의 형태를 검사합니다."}]},{"id":"d28-c5-human-rubric","chapter":5,"kind":"table","title":"사람 평가표는 어떻게 작성해야 하나요?","claim":"자동 지표와 다른 문제를 발견할 수 있도록 질문 목적과 증거를 기준으로 평가합니다.","headers":["평가 기준","1점(미흡)","3점(양호)"],"rows":[["질문 적합성","질문에 답하지 않음","질문의 대상·요구를 직접 충족"],["근거 일치","문서와 다른 숫자·조건 추가","주장 모두 Context에서 확인"],["정답 사실","Reference와 충돌","핵심 조건이 실제 정답과 일치"],["출처 검토","출처 누락·원문 불일치","사용한 문서의 위치와 주장 확인"],["안전한 보류","근거 없는데 임의 답변","필요한 정보 부족을 명시"]],"note":"1점과 3점 사이 2점은 부분 충족입니다. 평가 예시 기준이며 팀별로 최종 기준표를 문서화해야 합니다."},{"id":"d28-c5-generation-demo","chapter":5,"kind":"demo","title":"시연 · 답변의 주장별 근거와 질문 적합성을 판정합니다","claim":"Claim 지원 상태와 질문 관련성을 바꾸며 Faithfulness와 Relevance가 다르게 나오는 이유를 확인합니다.","demo":"generation-lab","left":[["Claim 분해","각 주장이 근거 문장에 의해 지지되는지 봅니다."],["Faithfulness","지원 주장 수 / 전체 주장 수를 계산합니다."]],"right":[["Relevance","질문에 직접 답했는지 별도로 확인합니다."],["정답성","Reference Answer와 다른 결론인지 검사합니다."]],"note":"지원 여부는 교육용으로 사전 부여된 레이블이며 이 HTML은 자동 Judge나 LLM API를 실행하지 않습니다."},{"id":"d28-c5-practice","chapter":5,"kind":"practice","title":"실습 05 안내 · 답변의 충실성과 적합성 확인","claim":"생성 답변을 Claim 단위로 분리하여 근거와 일치 여부를 평가합니다.","preparation":"교육용 답변·Context·Reference·사람 평가표","output":"Claim-level Faithfulness·질문 적합성 비교표","levels":[{"name":"01_basic · 기본필수","folder":"01_basic","task":"주어진 Claim 지원 레이블로 Faithfulness 비율을 계산합니다.","result":"핵심 입출력·실행 흐름 확인"},{"name":"02_intermediate · 응용","folder":"02_intermediate","task":"Relevance·Correctness 평가 기준을 함수/JSON Schema로 분리합니다.","result":"기능 분리·조건별 테스트"},{"name":"03_advanced · 심화","folder":"03_advanced","task":"LLM Judge 출력 Schema·이견 기록·사람 검수 샘플링을 설계합니다.","result":"운영 경계·로그·재현성 검증"}],"criterion":"Faithfulness와 정답성·관련성 차이를 사례로 설명합니다.","caution":"실제 자동 판정 결과와 제공된 정답 레이블을 혼동하지 않습니다.","check_questions":[["질문에 직접 답했지만 문서에 없는 날짜를 말했습니다. 어떤 문제가 있나요?","Relevance는 높을 수 있지만 Faithfulness가 낮습니다. 정답성도 별도 검토해야 합니다."],["출처 ID가 존재하면 Faithfulness는 자동으로 1인가요?","아니요. 실제 문서 본문이 답변의 각 주장을 지지하는지 확인해야 합니다."],["LLM Judge의 점수가 높으면 사람이 평가할 필요가 없나요?","아닙니다. 편향·오판·민감 정보·업무 예외를 확인해야 합니다."]],"check_title":"이해 확인 · 답변 평가지표"},{"id":"d28-c6-lc-why","chapter":6,"kind":"concept","title":"LangChain RAG 평가에서 무엇을 재사용하나요?","claim":"새 RAG를 만들지 않습니다. 전날의 Runnable을 같은 질문 데이터셋으로 실행하고 중간 결과를 수집합니다.","left":[["Day27 재사용","rewrite_stage, retrieval_stage, rerank_stage, context_stage, generation_chain의 역할과 입력·출력을 그대로 사용합니다."],["바뀌는 것","평가용 Runner는 question_id·Gold를 별도로 보관하고, Runnable.invoke()의 결과를 기록한 뒤 계산 함수에 넘깁니다."]],"right":[["왜 LangChain인가","각 단계의 입출력 구조가 일관되면 동일 Runner로 새로운 Prompt나 Reranker 버전을 비교할 수 있습니다."],["주의","LangChain만 사용한다고 자동 평가가 만들어지지는 않습니다. Dataset·Evaluator·보고서를 우리가 구성합니다."]],"distinction":"Gold 레이블을 RAG Service의 입력으로 넣지 않습니다. Runner는 Target 출력과 정답을 실행 후에만 결합합니다.","references":[{"label":"LangChain · Python overview","url":"https://docs.langchain.com/oss/python/langchain/overview"},{"label":"LangSmith · Evaluation quickstart","url":"https://docs.langchain.com/langsmith/evaluation-quickstart"}]},{"id":"d28-c6-lc-contract","chapter":6,"kind":"table","title":"LangChain Stage별 평가용 데이터 계약","claim":"Document·State dict·Chat Model 결과의 타입을 다시 연결해 봅니다.","headers":["Stage","입력 → 출력","평가용으로 보관할 필드"],"rows":[["rewrite_stage.invoke","state{question, history} → state{status, search_query}","원 질문·변환 질문·확인 필요 여부"],["retrieval_stage.invoke","state{search_query, category} → state{candidate_docs}","Document 목록의 후보 ID·검색 순위·출처"],["rerank_stage.invoke","state{candidate_docs} → state{ranked_docs}","재정렬 후 후보 순위·모델 ID·실행시간"],["context_stage.invoke","state{ranked_docs} → state{context, included_ids}","실제 포함 문서 ID·Context"],["generation_chain.invoke","{question, context} → AIMessage 또는 Structured Output","모델 원응답. 검증·출처 연결은 이후 서버에서 수행"],["Evaluator","RunRecord + Gold → metrics dict","검색 지표·생성 답변 판정"]],"note":"LangChain Runnable Stage는 state dict에 중간값을 추가합니다. 그 내부의 base_retriever.invoke()는 list[Document]를 반환합니다. Chat Model의 AIMessage와 서버가 검증한 최종 API 응답도 구분합니다."},{"id":"d28-c6-runner","chapter":6,"kind":"code","title":"기존 Runnable.invoke()로 질문별 실행을 수집합니다","claim":"Target Runner는 평가 질문을 하나씩 실행하고 필요한 필드만 저장합니다.","left":"기존 rag Runnable + 샘플 질문","right":"question_id와 검색/생성 기록","code":{"lang":"python","title":"runner.py · LangChain Target 호출","raw":"from langchain_core.runnables import Runnable\n\ndef run_target(rag: Runnable, sample: dict) -> dict:\n    # Gold는 실행 입력에 포함하지 않습니다.\n    request = {\"question\": sample[\"question\"],\n               \"category\": sample[\"category\"],\n               \"history\": sample.get(\"history\", [])}\n    result = rag.invoke(request)  # DB·GPU·LLM을 실제 호출할 수 있습니다.\n    # 평가용 Trace Adapter가 검색 중간값을 제공해야 합니다.\n    required = {\"candidate_ids\", \"ranked_ids\", \"included_ids\", \"answer\", \"status\"}\n    missing = required - result.keys()\n    if missing:\n        raise ValueError(f\"evaluation trace fields missing: {sorted(missing)}\")\n    return {\"question_id\": sample[\"question_id\"],\n            \"candidate_ids\": result[\"candidate_ids\"],\n            \"ranked_ids\": result[\"ranked_ids\"],\n            \"included_ids\": result[\"included_ids\"],\n            \"answer\": result[\"answer\"],\n            \"status\": result[\"status\"]}\n# rag = 전날 완성한 Enhanced RAG에 평가용 Trace Adapter를 붙인 Runnable\n","desc":"기존 RAG API가 ranked_ids 등을 반환하지 않을 수 있으므로 평가용 Trace Adapter가 필요합니다. 필수 필드가 없으면 빈 검색 결과로 둔갑시키지 않고 명시적으로 오류를 반환합니다.","highlighted":["<span class=\"py-keyword\">from</span> <span class=\"py-variable\">langchain_core</span><span class=\"py-variable\">.</span><span class=\"py-variable\">runnables</span> <span class=\"py-keyword\">import</span> <span class=\"py-variable\">Runnable</span>","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">run_target</span>(<span class=\"py-variable\">rag</span>: <span class=\"py-variable\">Runnable</span>, <span class=\"py-variable\">sample</span>: <span class=\"py-function\">dict</span>) -&gt; <span class=\"py-function\">dict</span>:","    <span class=\"py-comment\"># Gold는 실행 입력에 포함하지 않습니다.</span>","    <span class=\"py-variable\">request</span> = {<span class=\"py-string\">&quot;</span><span class=\"py-string\">question</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">sample</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">question</span><span class=\"py-string\">&quot;</span>],","               <span class=\"py-string\">&quot;</span><span class=\"py-string\">category</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">sample</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">category</span><span class=\"py-string\">&quot;</span>],","               <span class=\"py-string\">&quot;</span><span class=\"py-string\">history</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">sample</span>.<span class=\"py-variable\">get</span>(<span class=\"py-string\">&quot;</span><span class=\"py-string\">history</span><span class=\"py-string\">&quot;</span>, [])}","    <span class=\"py-variable\">result</span> = <span class=\"py-variable\">rag</span>.<span class=\"py-variable\">invoke</span>(<span class=\"py-variable\">request</span>)  <span class=\"py-comment\"># DB·GPU·LLM을 실제 호출할 수 있습니다.</span>","    <span class=\"py-comment\"># 평가용 Trace Adapter가 검색 중간값을 제공해야 합니다.</span>","    <span class=\"py-variable\">required</span> = {<span class=\"py-string\">&quot;</span><span class=\"py-string\">candidate_ids</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">ranked_ids</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">included_ids</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">answer</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">status</span><span class=\"py-string\">&quot;</span>}","    <span class=\"py-variable\">missing</span> = <span class=\"py-variable\">required</span> - <span class=\"py-variable\">result</span>.<span class=\"py-variable\">keys</span>()","    <span class=\"py-keyword\">if</span> <span class=\"py-variable\">missing</span>:","        <span class=\"py-keyword\">raise</span> <span class=\"py-variable\">ValueError</span>(<span class=\"py-string\">f</span><span class=\"py-string\">&quot;</span><span class=\"py-string\">evaluation trace fields missing: </span><span class=\"py-string\">{</span><span class=\"py-function\">sorted</span>(<span class=\"py-variable\">missing</span>)<span class=\"py-string\">}</span><span class=\"py-string\">&quot;</span>)","    <span class=\"py-keyword\">return</span> {<span class=\"py-string\">&quot;</span><span class=\"py-string\">question_id</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">sample</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">question_id</span><span class=\"py-string\">&quot;</span>],","            <span class=\"py-string\">&quot;</span><span class=\"py-string\">candidate_ids</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">result</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">candidate_ids</span><span class=\"py-string\">&quot;</span>],","            <span class=\"py-string\">&quot;</span><span class=\"py-string\">ranked_ids</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">result</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">ranked_ids</span><span class=\"py-string\">&quot;</span>],","            <span class=\"py-string\">&quot;</span><span class=\"py-string\">included_ids</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">result</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">included_ids</span><span class=\"py-string\">&quot;</span>],","            <span class=\"py-string\">&quot;</span><span class=\"py-string\">answer</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">result</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">answer</span><span class=\"py-string\">&quot;</span>],","            <span class=\"py-string\">&quot;</span><span class=\"py-string\">status</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">result</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">status</span><span class=\"py-string\">&quot;</span>]}","<span class=\"py-comment\"># rag = 전날 완성한 Enhanced RAG에 평가용 Trace Adapter를 붙인 Runnable</span>",""]},"flowTrace":[{"label":"입력 준비","input":"question, category, history","output":"request dict","line":5,"why":"Gold ID는 서비스 입력에서 제외합니다."},{"label":"Target 실행","input":"rag Runnable + request","output":"result dict","line":8,"why":"실제 RAG Pipeline이 실행됩니다."},{"label":"결과 추출","input":"검색 후보·출처·답변","output":"RunRecord","line":9,"why":"Evaluator가 읽을 필드만 일관되게 저장합니다."}],"introTerms":[{"term":"Runnable","meaning":"LangChain에서 입력을 받아 결과를 반환하는 공통 실행 단위입니다.","use":"기존 RAG를 하나의 평가 Target으로 취급합니다."},{"term":"invoke()","meaning":"Runnable에 입력을 전달해 실제 처리를 실행하는 메서드입니다.","use":"E5·DB·Cross-Encoder·LLM이 연결돼 있으면 실제 호출될 수 있습니다."}]},{"id":"d28-c6-trace-intro","chapter":6,"kind":"concept","title":"Trace와 Evaluation Report는 왜 다르나요?","claim":"Trace는 “어떻게 실행됐나”를, Evaluation은 “잘 실행됐나”를 보여 줍니다.","left":[["Trace · 실행 기록","개별 Runnable의 입력·출력·시간·오류를 시간순으로 기록합니다. API Key나 민감한 사용자 데이터는 원문 저장을 제한해야 합니다."],["Evaluation · 점수","Trace나 최종 결과를 Gold·Reference·규칙과 비교한 평가 점수입니다."]],"right":[["LangSmith의 위치","LangSmith는 LangChain과 함께 사용할 수 있는 별도의 관측·평가 서비스입니다. 필수 기능은 아닙니다."],["이번 수업 선택","기본필수는 로컬 JSON/CSV로 평가를 완성하고, 확장 단계에서 LangSmith 실험·Trace를 소개합니다."]],"distinction":"실행 로그를 남겼다고 품질이 자동으로 검증되지는 않습니다.","references":[{"label":"LangSmith · Evaluation quickstart","url":"https://docs.langchain.com/langsmith/evaluation-quickstart"}]},{"id":"d28-c6-eval-function","chapter":6,"kind":"code","title":"검색 평가를 RunnableLambda로 감쌀 수 있습니다","claim":"일반 Python 함수를 LangChain의 Runnable 실행 단위로 만들어 기존 코드와 조합합니다.","left":"RunRecord와 Gold가 결합된 dict","right":"검색 지표 dict","code":{"lang":"python","title":"evaluators.py · RunnableLambda 평가기","raw":"from langchain_core.runnables import RunnableLambda\n\ndef score_retrieval(row: dict) -> dict:\n    # row는 사전에 결합한 RunRecord + Gold Label입니다.\n    ids = row[\"ranked_ids\"]\n    gold = set(row[\"gold_chunk_ids\"])\n    k = row.get(\"k\", 3)\n    return {\"question_id\": row[\"question_id\"],\n            \"recall_at_k\": recall_at_k(ids, gold, k),\n            \"reciprocal_rank\": reciprocal_rank(ids, gold, k)}\n\nretrieval_evaluator = RunnableLambda(score_retrieval)\n# 실제 계산은 invoke()를 호출할 때 실행됩니다.\n# score = retrieval_evaluator.invoke(merged_row)\n","desc":"recall_at_k와 reciprocal_rank는 이전 Chapter에서 구현했다고 가정한 함수입니다.","highlighted":["<span class=\"py-keyword\">from</span> <span class=\"py-variable\">langchain_core</span><span class=\"py-variable\">.</span><span class=\"py-variable\">runnables</span> <span class=\"py-keyword\">import</span> <span class=\"py-variable\">RunnableLambda</span>","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">score_retrieval</span>(<span class=\"py-variable\">row</span>: <span class=\"py-function\">dict</span>) -&gt; <span class=\"py-function\">dict</span>:","    <span class=\"py-comment\"># row는 사전에 결합한 RunRecord + Gold Label입니다.</span>","    <span class=\"py-variable\">ids</span> = <span class=\"py-variable\">row</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">ranked_ids</span><span class=\"py-string\">&quot;</span>]","    <span class=\"py-variable\">gold</span> = <span class=\"py-function\">set</span>(<span class=\"py-variable\">row</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">gold_chunk_ids</span><span class=\"py-string\">&quot;</span>])","    <span class=\"py-variable\">k</span> = <span class=\"py-variable\">row</span>.<span class=\"py-variable\">get</span>(<span class=\"py-string\">&quot;</span><span class=\"py-string\">k</span><span class=\"py-string\">&quot;</span>, <span class=\"py-number\">3</span>)","    <span class=\"py-keyword\">return</span> {<span class=\"py-string\">&quot;</span><span class=\"py-string\">question_id</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">row</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">question_id</span><span class=\"py-string\">&quot;</span>],","            <span class=\"py-string\">&quot;</span><span class=\"py-string\">recall_at_k</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">recall_at_k</span>(<span class=\"py-variable\">ids</span>, <span class=\"py-variable\">gold</span>, <span class=\"py-variable\">k</span>),","            <span class=\"py-string\">&quot;</span><span class=\"py-string\">reciprocal_rank</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">reciprocal_rank</span>(<span class=\"py-variable\">ids</span>, <span class=\"py-variable\">gold</span>, <span class=\"py-variable\">k</span>)}","","<span class=\"py-variable\">retrieval_evaluator</span> = <span class=\"py-variable\">RunnableLambda</span>(<span class=\"py-variable\">score_retrieval</span>)","<span class=\"py-comment\"># 실제 계산은 invoke()를 호출할 때 실행됩니다.</span>","<span class=\"py-comment\"># score = retrieval_evaluator.invoke(merged_row)</span>"]},"flowTrace":[],"introTerms":[{"term":"RunnableLambda","meaning":"일반 Python 함수를 Runnable로 감싸는 LangChain 클래스입니다.","use":"Evaluator도 일관된 invoke()로 실행할 수 있습니다."},{"term":"|","meaning":"왼쪽 Runnable의 출력을 오른쪽 Runnable의 입력으로 넘깁니다.","use":"평가용 변환 → 지표 계산 순서를 연결할 때 사용할 수 있습니다."}]},{"id":"d28-c6-vscode","chapter":6,"kind":"ide","title":"VS Code · 데이터가 Target에서 Report까지 이동하는 흐름","claim":"Explorer의 파일과 오른쪽 실행 Stage를 클릭하며 실제 Python 모듈과 자료형 변화를 함께 확인합니다."},{"id":"d28-c6-langsmith","chapter":6,"kind":"concept","title":"LangSmith는 무엇이며 평가에서 어디에 사용할까요?","claim":"LangSmith는 LLM 애플리케이션의 실행 Trace·Dataset·평가 실험을 관리하는 선택적 외부 서비스입니다.","left":[["이점","동일 Dataset으로 Prompt/RAG 버전을 반복 실행하고 질문별 실행 기록과 점수를 비교할 수 있습니다."],["필수는 아닙니다","교육용 Python 테스트와 JSON/CSV만으로도 지표 계산은 가능합니다. LangSmith 계정·API Key를 실습의 필수 조건으로 두지 않습니다."]],"right":[["LangChain과 관계","LangChain 자체가 지표를 자동으로 판정하는 것이 아니라 LangSmith·자체 Evaluator가 별도 평가 작업을 담당합니다."],["운영 주의","Trace 원문에 개인정보나 기업 문서를 외부로 전송할 수 있으므로 보관·비식별·권한 정책을 확인합니다."]],"distinction":"기본 수업은 로컬 평가, 도구 이해 차원에서 LangSmith를 소개합니다.","references":[{"label":"LangSmith · Evaluation quickstart","url":"https://docs.langchain.com/langsmith/evaluation-quickstart"},{"label":"LangSmith · evaluate API reference","url":"https://reference.langchain.com/python/langsmith/evaluation/_runner/evaluate"}]},{"id":"d28-c6-pipeline-demo","chapter":6,"kind":"demo","title":"시연 · LangChain 평가 Runner의 단계별 입출력 확인","claim":"Dataset·Target·Evaluator·Report 중 어느 단계가 무엇을 받는지 추적합니다.","demo":"pipeline-lab","left":[["Dataset","원 질문과 Gold는 별도 보관합니다."],["Target","기존 Runnable.invoke()로 결과를 생성합니다."]],"right":[["Evaluator","실행 후 Gold와 결과를 비교해 지표 계산합니다."],["Report","질문 ID별 수치를 저장합니다."]],"note":"코드 실행 단계의 형태를 보여 주는 교육용 Fixture이며 HTML 안에서 실제 Python을 실행하지 않습니다."},{"id":"d28-c6-practice","chapter":6,"kind":"practice","title":"실습 06 안내 · LangChain Evaluation Runner","claim":"전날 RAG Runnable을 불러 질문별 입력·출력·평가 결과를 연결합니다.","preparation":"기존 Enhanced RAG 코드·Gold Dataset·Evaluation Record","output":"질문별 검색/생성 결과 + 로컬 평가 리포트","levels":[{"name":"01_basic · 기본필수","folder":"01_basic","task":"제공된 Runnable의 invoke() 결과에서 ID를 추출합니다.","result":"핵심 입출력·실행 흐름 확인"},{"name":"02_intermediate · 응용","folder":"02_intermediate","task":"Target·Evaluator·Reporter 파일로 나눠 소규모 실행 루프를 완성합니다.","result":"기능 분리·조건별 테스트"},{"name":"03_advanced · 심화","folder":"03_advanced","task":"실패 Stage·로그·민감정보 마스킹·실험 버전·선택적 LangSmith 연결을 준비합니다.","result":"운영 경계·로그·재현성 검증"}],"criterion":"Gold가 RAG 실행 입력으로 들어가지 않고 질문 ID로 결과가 결합됩니다.","caution":"실제 LLM·DB 호출과 고정 Fixture를 하나의 실험으로 섞어 비교하지 않습니다.","check_questions":[["RunnableLambda를 만들기만 하면 RAG 평가가 실행되나요?","아니요. invoke() 또는 호출하는 상위 Pipeline을 실행해야 합니다."],["Gold 문서 ID를 rag.invoke() 입력에 넣어도 되나요?","안 됩니다. RAG의 검색/생성에는 전달하지 않고 Evaluator가 결과와 비교합니다."],["LangSmith를 사용하지 않으면 RAG 평가를 할 수 없나요?","아닙니다. Python 평가 함수와 로컬 결과 파일로도 가능합니다."]],"check_title":"이해 확인 · LangChain에서 무엇이 실행되나요?"},{"id":"d28-c7-comparison","chapter":7,"kind":"concept","title":"A/B 비교란 무엇이고 왜 필요한가요?","claim":"기준 버전(Baseline)과 변경 버전(Improved)을 동일한 질문·데이터에서 실행해 차이를 확인합니다.","left":[["Baseline · 기존 경로","11월 23일 Basic RAG 또는 24일 Rerank OFF 경로처럼 기존 동작을 기록한 버전입니다."],["Improved · 변경 경로","동일 문서·권한 조건에서 Rewrite ON 또는 Rerank ON 등 한 요소를 추가합니다."]],"right":[["A/B에서 통제할 것","Gold·질문·Corpus Version·Category·Candidate-k·Context-k·모델 버전·캐시 조건"],["의미 있는 결론","관련 문서가 얼마나 앞에 왔는지와 부작용(Latency·오류)을 질문별로 분석합니다."]],"distinction":"이번 강의의 A/B는 동일한 고정 질문을 두 버전에 실행하는 오프라인 비교(Pair
