ed Evaluation)입니다. 실서비스에서 사용자를 무작위 배분하는 온라인 A/B Test와는 다릅니다. Rewrite와 Rerank를 동시에 바꾸면 어떤 변경이 원인인지 단정할 수 없습니다."},{"id":"d28-c7-experiment-matrix","chapter":7,"kind":"table","title":"한 번에 하나씩 바꾸는 실험 매트릭스","claim":"동일한 질문·문서·모델 설정을 기준으로 각 기능의 효과를 구분합니다.","headers":["실험 ID","Rewrite","Rerank · 해석"],"rows":[["A · Baseline","OFF","OFF · 기존 기준선"],["B · Rewrite only","ON","OFF · 질문 변환의 영향"],["C · Rerank only","OFF","ON · 고정 후보 순위 변경 영향"],["D · Both","ON","ON · 통합 결과 확인"]],"note":"Rewrite가 바뀌면 Candidate Set도 바뀔 수 있습니다. Rerank만의 효과는 동일 후보를 고정한 C와 A를 비교합니다."},{"id":"d28-c7-baseline-code","chapter":7,"kind":"code","title":"평가 레코드를 버전별로 비교합니다","claim":"점수 차이를 계산할 때 질문 ID와 실험 조건이 동일해야 합니다.","left":"같은 질문의 평가 결과 두 개","right":"지표별 delta(개선 차이)","code":{"lang":"python","title":"compare.py · Baseline vs Improved","raw":"def compare_runs(baseline: dict, improved: dict) -> dict:\n    # 다른 질문의 결과끼리 비교하지 않습니다.\n    if baseline[\"question_id\"] != improved[\"question_id\"]:\n        raise ValueError(\"question_id mismatch\")\n    # metric은 이미 평가기가 계산한 같은 정의의 수치입니다.\n    keys = (\"recall_at_3\", \"reciprocal_rank\", \"ndcg_at_3\")\n    delta = {key: round(improved[key] - baseline[key], 3)\n             for key in keys if baseline.get(key) is not None\n             and improved.get(key) is not None}\n    return {\"question_id\": baseline[\"question_id\"], \"delta\": delta}\n\nbefore = {\"question_id\": \"Q01\", \"recall_at_3\": .5, \"reciprocal_rank\": .25, \"ndcg_at_3\": .42}\nafter = {\"question_id\": \"Q01\", \"recall_at_3\": .5, \"reciprocal_rank\": 1., \"ndcg_at_3\": .79}\nprint(compare_runs(before, after))\n","desc":"데이터 계약을 고정한 비교용 코드입니다. RR은 질문별 순위이고 MRR은 질문 집합의 평균이므로 질문 단위 비교에는 `reciprocal_rank` 키를 사용합니다.","highlighted":["<span class=\"py-keyword\">def</span> <span class=\"py-function\">compare_runs</span>(<span class=\"py-variable\">baseline</span>: <span class=\"py-function\">dict</span>, <span class=\"py-variable\">improved</span>: <span class=\"py-function\">dict</span>) -&gt; <span class=\"py-function\">dict</span>:","    <span class=\"py-comment\"># 다른 질문의 결과끼리 비교하지 않습니다.</span>","    <span class=\"py-keyword\">if</span> <span class=\"py-variable\">baseline</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">question_id</span><span class=\"py-string\">&quot;</span>] != <span class=\"py-variable\">improved</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">question_id</span><span class=\"py-string\">&quot;</span>]:","        <span class=\"py-keyword\">raise</span> <span class=\"py-variable\">ValueError</span>(<span class=\"py-string\">&quot;</span><span class=\"py-string\">question_id mismatch</span><span class=\"py-string\">&quot;</span>)","    <span class=\"py-comment\"># metric은 이미 평가기가 계산한 같은 정의의 수치입니다.</span>","    <span class=\"py-variable\">keys</span> = (<span class=\"py-string\">&quot;</span><span class=\"py-string\">recall_at_3</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">reciprocal_rank</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">ndcg_at_3</span><span class=\"py-string\">&quot;</span>)","    <span class=\"py-variable\">delta</span> = {<span class=\"py-variable\">key</span>: <span class=\"py-function\">round</span>(<span class=\"py-variable\">improved</span>[<span class=\"py-variable\">key</span>] - <span class=\"py-variable\">baseline</span>[<span class=\"py-variable\">key</span>], <span class=\"py-number\">3</span>)","             <span class=\"py-keyword\">for</span> <span class=\"py-variable\">key</span> in <span class=\"py-variable\">keys</span> <span class=\"py-keyword\">if</span> <span class=\"py-variable\">baseline</span>.<span class=\"py-variable\">get</span>(<span class=\"py-variable\">key</span>) is not <span class=\"py-keyword\">None</span>","             and <span class=\"py-variable\">improved</span>.<span class=\"py-variable\">get</span>(<span class=\"py-variable\">key</span>) is not <span class=\"py-keyword\">None</span>}","    <span class=\"py-keyword\">return</span> {<span class=\"py-string\">&quot;</span><span class=\"py-string\">question_id</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">baseline</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">question_id</span><span class=\"py-string\">&quot;</span>], <span class=\"py-string\">&quot;</span><span class=\"py-string\">delta</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">delta</span>}","","<span class=\"py-variable\">before</span> = {<span class=\"py-string\">&quot;</span><span class=\"py-string\">question_id</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">Q01</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">recall_at_3</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">.5</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">reciprocal_rank</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">.25</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">ndcg_at_3</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">.42</span>}","<span class=\"py-variable\">after</span> = {<span class=\"py-string\">&quot;</span><span class=\"py-string\">question_id</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">Q01</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">recall_at_3</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">.5</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">reciprocal_rank</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">1.</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">ndcg_at_3</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">.79</span>}","<span class=\"py-function\">print</span>(<span class=\"py-variable\">compare_runs</span>(<span class=\"py-variable\">before</span>, <span class=\"py-variable\">after</span>))"]},"flowTrace":[],"introTerms":[{"term":"Baseline","meaning":"수정 전 비교 기준이 되는 서비스 버전입니다.","use":"개선 효과를 판단할 출발점입니다."},{"term":"Delta (Δ)","meaning":"개선 후 값에서 이전 값을 뺀 차이입니다.","use":"양수·음수 방향과 지표 정의를 함께 확인합니다."}]},{"id":"d28-c7-failure-taxonomy","chapter":7,"kind":"table","title":"낮은 점수에서 실제 수정할 모듈로 이동하기","claim":"점수와 Stage를 연결하면 무작정 모델을 교체하는 실수를 줄일 수 있습니다.","headers":["관찰","추가 확인","수정할 후보"],"rows":[["Recall@k 낮음","Gold 문서가 검색되는지·필터/Index","Query Rewrite·Retriever·Corpus"],["MRR 낮고 Recall@k 높음","정답은 있는데 뒤쪽에 위치","Reranker·정렬·Top-N"],["Faithfulness 낮음","Context 대비 지원되지 않는 Claim","Prompt·Generation·근거 해석"],["Correctness 낮음","Reference와 조건·숫자 충돌","검색 문서 버전·Generator"],["Latency 급증","새 LLM 호출·후보 수·GPU/DB 소요시간","Query 수·batch_size·캐시 정책"],["오류 상태 증가","Timeout·401·DB 연결·VRAM OOM","환경·예외 처리·자원"]],"note":"실제 접근 권한·현재 버전 정책은 높은 검색 점수로 우회할 수 없습니다. 후보 밖의 정답 문서는 Reranker로 되살릴 수 없으므로 먼저 Retriever의 검색 범위부터 확인합니다."},{"id":"d28-c7-timing","chapter":7,"kind":"code","title":"Latency를 CPU 코드와 GPU 추론에서 구분해 측정합니다","claim":"GPU 연산은 비동기일 수 있으므로 실제 완료 시간을 측정할 때 CUDA 동기화가 필요합니다.","left":"측정할 함수·GPU 사용 여부","right":"함수 결과 + 경과 시간(ms)","code":{"lang":"python","title":"latency.py · GPU 구간 시간 측정","raw":"from time import perf_counter\nimport torch\n\ndef measure_stage(fn, gpu_stage=False):\n    # 실제 GPU 추론인 경우 시작·끝에서 동기화합니다.\n    if gpu_stage:\n        if not torch.cuda.is_available():\n            raise RuntimeError(\"CUDA GPU 필요\")\n        torch.cuda.synchronize()\n    start = perf_counter()\n    result = fn()\n    if gpu_stage:\n        torch.cuda.synchronize()\n    elapsed_ms = (perf_counter() - start) * 1000\n    return result, round(elapsed_ms, 1)\n\n# Cross-Encoder 추론: measure_stage(lambda: reranker.predict(pairs), True)\n# DB·원격 LLM API: measure_stage(lambda: service.invoke(request))\n","desc":"GPU 모델 추론은 CUDA를 기본으로 하며 비용 측정은 모델 호출과 구분합니다.","highlighted":["<span class=\"py-keyword\">from</span> <span class=\"py-variable\">time</span> <span class=\"py-keyword\">import</span> <span class=\"py-variable\">perf_counter</span>","<span class=\"py-keyword\">import</span> <span class=\"py-variable\">torch</span>","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">measure_stage</span>(<span class=\"py-variable\">fn</span>, <span class=\"py-variable\">gpu_stage</span>=<span class=\"py-keyword\">False</span>):","    <span class=\"py-comment\"># 실제 GPU 추론인 경우 시작·끝에서 동기화합니다.</span>","    <span class=\"py-keyword\">if</span> <span class=\"py-variable\">gpu_stage</span>:","        <span class=\"py-keyword\">if</span> not <span class=\"py-variable\">torch</span>.<span class=\"py-variable\">cuda</span>.<span class=\"py-variable\">is_available</span>():","            <span class=\"py-keyword\">raise</span> <span class=\"py-variable\">RuntimeError</span>(<span class=\"py-string\">&quot;</span><span class=\"py-string\">CUDA GPU 필요</span><span class=\"py-string\">&quot;</span>)","        <span class=\"py-variable\">torch</span>.<span class=\"py-variable\">cuda</span>.<span class=\"py-variable\">synchronize</span>()","    <span class=\"py-variable\">start</span> = <span class=\"py-variable\">perf_counter</span>()","    <span class=\"py-variable\">result</span> = <span class=\"py-variable\">fn</span>()","    <span class=\"py-keyword\">if</span> <span class=\"py-variable\">gpu_stage</span>:","        <span class=\"py-variable\">torch</span>.<span class=\"py-variable\">cuda</span>.<span class=\"py-variable\">synchronize</span>()","    <span class=\"py-variable\">elapsed_ms</span> = (<span class=\"py-variable\">perf_counter</span>() - <span class=\"py-variable\">start</span>) * <span class=\"py-number\">1000</span>","    <span class=\"py-keyword\">return</span> <span class=\"py-variable\">result</span>, <span class=\"py-function\">round</span>(<span class=\"py-variable\">elapsed_ms</span>, <span class=\"py-number\">1</span>)","","<span class=\"py-comment\"># Cross-Encoder 추론: measure_stage(lambda: reranker.predict(pairs), True)</span>","<span class=\"py-comment\"># DB·원격 LLM API: measure_stage(lambda: service.invoke(request))</span>"]},"flowTrace":[],"introTerms":[{"term":"perf_counter()","meaning":"짧은 실행시간 간격을 정밀하게 측정하는 Python 타이머입니다.","use":"시작과 종료 시각의 차이를 구합니다."},{"term":"torch.cuda.synchronize()","meaning":"비동기 CUDA GPU 연산이 끝날 때까지 기다립니다.","use":"GPU 추론 구간의 실제 Latency 측정에 사용합니다."}]},{"id":"d28-c7-meaningful-report","chapter":7,"kind":"concept","title":"좋은 평가 리포트는 평균만 보여 주지 않습니다","claim":"평균 점수만 있으면 어떤 질문이 나빠졌는지, 어떤 수정이 위험한지 알기 어렵습니다.","left":[["질문별 Drill-down","Q01은 MRR 상승, Q03은 Rewrite의 의미 이탈로 Recall 하락처럼 구체적으로 남깁니다."],["실험 재현","dataset_version·corpus_version·model_id·prompt_version·K·GPU·시행시간·오류 코드를 기록합니다."]],"right":[["운영 Trade-off","Recall↑, Latency↑처럼 상충하는 변화는 서비스 목표에 따라 허용 가능한지 결정해야 합니다."],["다음 날 연결","Agent는 검색 Tool을 호출합니다. 따라서 Tool 자체의 품질·오류 처리·응답 계약을 먼저 확인해야 합니다."]],"distinction":"한 번의 우연한 개선이 모든 질문의 개선을 뜻하지 않습니다. 실제 서비스에서는 반복 측정과 사람 검토를 병행합니다."},{"id":"d28-c7-write-report","chapter":7,"kind":"code","title":"질문별 평가 기록을 JSONL로 남기는 방법","claim":"후속 개발자가 특정 질문의 실행 결과를 재현할 수 있도록 같은 필드를 한 줄씩 저장합니다.","left":"질문별 실험 이름과 지표 dict","right":"outputs/eval_runs.jsonl","code":{"lang":"python","title":"report.py · 평가 리포트 기록","raw":"import json\nfrom pathlib import Path\n\n# JSONL: 실행 기록 하나를 JSON 한 줄로 저장하는 파일 형식\nrows = [\n    {\"question_id\": \"Q01\", \"variant\": \"baseline\", \"recall_at_3\": 0.5},\n    {\"question_id\": \"Q01\", \"variant\": \"rerank\", \"recall_at_3\": 0.5},\n]\nout = Path(\"outputs/eval_runs.jsonl\")\nout.parent.mkdir(parents=True, exist_ok=True)\nwith out.open(\"w\", encoding=\"utf-8\") as f:\n    for row in rows:\n        f.write(json.dumps(row, ensure_ascii=False) + \"\\n\")\nprint(out)  # outp 가 실용적입니다."],["Generation Gate","Faithfulness·정답성·출처·No-answer 동작을 사람 검토와 함께 확인합니다."]],"right":[["운영 Gate","권한 위반 0건, 실패 코드 분리, 예상 호출 시간·비용 범위를 확인합니다."],["실패 시 행동","새 Agent Tool 연결을 보류하고 실패한 질문·근거·버전 정보를 남깁니다."]],"distinction":"수업에서 제시하는 임계값은 교육용 정책 예시이며 실서비스의 보편적 합격 기준이 아닙니다."},{"id":"d28-c8-ready-checklist","chapter":8,"kind":"table","title":"Agent에 연결하기 전 RAG 기능의 점검표","claim":"모든 영역의 전문가가 아니라도 개발자가 최소한의 계약과 실패 처리를 알아야 합니다.","headers":["확인 항목","완료 조건","문제 시 행동"],"rows":[["Dataset","Gold 질문·문서 Version 고정","변경 후 재평가"],["Retriever·Reranker","관련 문서가 후보·Context에 포함","Query/Ranking 개선"],["Generator","문서 주장과 답변 일치","근거 미확인 시 거절"],["Citation","실제 included_ids만 반환","허위 출처 제거·오류 처리"],["API·권한","허용 문서만 검색하고 상태별 오류 구분","권한·오류 계약 수정"],["운영","GPU·DB·API 호출의 오류·지연 기록","자원·Timeout·비용 조정"]],"note":"Model API 인증 오류는 정보 부족 답변과 다른 상태로 기록해야 합니다."},{"id":"d28-c8-gate-code","chapter":8,"kind":"code","title":"평가 결과로 간단한 Release Gate를 구현합니다","claim":"Retrieval·순위·출처·권한에 대한 1차 품질 기준을 검사합니다. 전체 Agent 배포 승인과는 구분합니다.","left":"평가 리포트의 평균·오류·권한 지표","right":"ready True/False와 항목별 판정","code":{"lang":"python","title":"quality_gate.py · Agent Tool 준비","raw":"def pass_quality_gate(report: dict) -> dict:\n    # 1차 Gate 예시: 실제 Agent 배포 승인은 별도의 Generation/운영 검토가 필요합니다.\n    checks = {\n        \"retrieval\": report[\"recall_mean\"] >= 0.70,\n        \"ranking\": report[\"mrr_mean\"] >= 0.60,\n        \"citation\": report[\"invalid_sources\"] == 0,\n        \"permission\": report[\"permission_violations\"] == 0,\n    }\n    return {\"precheck_passed\": all(checks.values()), \"checks\": checks}\n\nsample = {\"recall_mean\": 0.75, \"mrr_mean\": 0.68,\n          \"invalid_sources\": 0, \"permission_violations\": 0}\nprint(pass_quality_gate(sample))\n# 위 4개 점검 통과는 전체 Agent 배포 승인과 다릅니다.\n","desc":"수업용 예시 임계값입니다. Generation의 Faithfulness·Correctness, No-answer, API 오류·Latency 등은 추가 점검이 필요합니다.","highlighted":["<span class=\"py-keyword\">def</span> <span class=\"py-function\">pass_quality_gate</span>(<span class=\"py-variable\">report</span>: <span class=\"py-function\">dict</span>) -&gt; <span class=\"py-function\">dict</span>:","    <span class=\"py-comment\"># 1차 Gate 예시: 실제 Agent 배포 승인은 별도의 Generation/운영 검토가 필요합니다.</span>","    <span class=\"py-variable\">checks</span> = {","        <span class=\"py-string\">&quot;</span><span class=\"py-string\">retrieval</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">report</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">recall_mean</span><span class=\"py-string\">&quot;</span>] &gt;= <span class=\"py-number\">0.70</span>,","        <span class=\"py-string\">&quot;</span><span class=\"py-string\">ranking</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">report</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">mrr_mean</span><span class=\"py-string\">&quot;</span>] &gt;= <span class=\"py-number\">0.60</span>,","        <span class=\"py-string\">&quot;</span><span class=\"py-string\">citation</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">report</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">invalid_sources</span><span class=\"py-string\">&quot;</span>] == <span class=\"py-number\">0</span>,","        <span class=\"py-string\">&quot;</span><span class=\"py-string\">permission</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">report</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">permission_violations</span><span class=\"py-string\">&quot;</span>] == <span class=\"py-number\">0</span>,","    }","    <span class=\"py-keyword\">return</span> {<span class=\"py-string\">&quot;</span><span class=\"py-string\">precheck_passed</span><span class=\"py-string\">&quot;</span>: <span class=\"py-function\">all</span>(<span class=\"py-variable\">checks</span>.<span class=\"py-variable\">values</span>()), <span class=\"py-string\">&quot;</span><span class=\"py-string\">checks</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">checks</span>}","","<span class=\"py-variable\">sample</span> = {<span class=\"py-string\">&quot;</span><span class=\"py-string\">recall_mean</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">0.75</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">mrr_mean</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">0.68</span>,","          <span class=\"py-string\">&quot;</span><span class=\"py-string\">invalid_sources</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">0</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">permission_violations</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">0</span>}","<span class=\"py-function\">print</span>(<span class=\"py-variable\">pass_quality_gate</span>(<span class=\"py-variable\">sample</span>))","<span class=\"py-comment\"># 위 4개 점검 통과는 전체 Agent 배포 승인과 다릅니다.</span>",""]},"flowTrace":[],"introTerms":[{"term":"Quality Gate","meaning":"품질 기준을 통과했는지 보고 다음 배포·연결을 허용하는 검사입니다.","use":"Agent Tool에 사용하기 전에 평가 결과를 확인합니다."},{"term":"all()","meaning":"모든 조건이 True일 때만 True를 반환하는 Python 함수입니다.","use":"어느 한 게이트라도 실패하면 ready=False입니다."}]},{"id":"d28-c8-roles","chapter":8,"kind":"table","title":"네 직무가 평가에서 맡는 역할도 연결합니다","claim":"Agent Platform이 중심이지만 Data·AI Core·Infra가 모두 품질 결과에 영향을 줍니다.","headers":["분야","오늘 관찰할 것","11/27~12/4 프로젝트 연결"],"rows":[["Data Analysis","Gold 질문·레이블·문서 품질","업무 데이터·평가셋 설계"],["AI Core","E5·Reranker·LLM 품질·GPU 실측","검색 모델·생성 품질 개선"],["Agent Platform · 중심","Runnable·Evaluator·출처/오류 계약","Tool·Agent Loop와 품질 Gate"],["Infra","DB·GPU·API 오류·Latency·실행 재현","운영·테스트·배포 준비"]],"note":"모든 학생은 네 분야의 전체 흐름을 익히되, 주요 개발은 Agent Platform에서 이루어집니다."},{"id":"d28-c8-pipeline-summary","chapter":8,"kind":"code","title":"평가 Runner의 전체 실행 순서를 하나로 정리합니다","claim":"수강생이 코드로 오늘 수행할 전체 절차를 설명할 수 있어야 합니다.","left":"LangChain RAG Runnable · Dataset 샘플·k","right":"Retrieval 점수 + Generation Review 대기 기록","code":{"lang":"python","title":"evaluation_pipeline.py · 전체 평가 흐름","raw":"def evaluate_one(rag, sample, k=3):\n    # 1) Gold는 RAG 입력에 전달하지 않습니다.\n    result = rag.invoke({\"question\": sample[\"question\"],\n                         \"category\": sample[\"category\"],\n                         \"history\": sample.get(\"history\", [])})\n    # 평가용 Trace Adapter는 순위와 실제 Context ID를 반환해야 합니다.\n    required = {\"ranked_ids\", \"included_ids\", \"answer\"}\n    if not required.issubset(result):\n        raise ValueError(\"evaluation trace is incomplete\")\n    # 2) 검색/재정렬 결과를 Gold와 비교합니다. 빈 목록으로 대체하지 않습니다.\n    ranked = result[\"ranked_ids\"]\n    gold = set(sample[\"gold_chunk_ids\"])\n    retrieval = {\"recall_at_k\": recall_at_k(ranked, gold, k),\n                 \"rr\": reciprocal_rank(ranked, gold, k)}\n    # 3) 생성 답변의 근거 일치는 별도 Judge/Human 단계로 평가합니다.\n    return {\"question_id\": sample[\"question_id\"],\n            \"retrieval\": retrieval,\n            \"answer\": result[\"answer\"],\n            \"included_ids\": result[\"included_ids\"],\n            \"generation_review\": \"pending\"}\n","desc":"전체 실행 흐름을 보여 주는 발췌 코드입니다. recall_at_k·reciprocal_rank는 앞 Chapter의 함수이며, 실제 Target은 평가용 Trace Adapter를 제공해야 합니다.","highlighted":["<span class=\"py-keyword\">def</span> <span class=\"py-function\">evaluate_one</span>(<span class=\"py-variable\">rag</span>, <span class=\"py-variable\">sample</span>, <span class=\"py-variable\">k</span>=<span class=\"py-number\">3</span>):","    <span class=\"py-comment\"># 1) Gold는 RAG 입력에 전달하지 않습니다.</span>","    <span class=\"py-variable\">result</span> = <span class=\"py-variable\">rag</span>.<span class=\"py-variable\">invoke</span>({<span class=\"py-string\">&quot;</span><span class=\"py-string\">question</span><span class=\"py-string\">&quot;</span>: <span class=\"py-variable\">sample</span>[<span class=\"py-string\">&quot;</span><span class=\"py-string\">q   for (const role of globalThis.LECTURE_DATA?.chapterRoles || []) {
    focusByChapter[role.chapter] = role.focus.filter(id => nodeById(id));
  }
  const todayNodes = nodes.filter(node => node.kind === 'today' || node.kind === 'evaluation').map(node => node.id);
  for (const node of nodes) {
    node.chapters = Object.keys(focusByChapter).map(Number).filter(chapter => focusByChapter[chapter].includes(node.id));
  }

  // Optional route focus retains the original renderer behavior. No toolbar
  // or extra graph is added to the map modal.
  const routes = {
    all:{nodes:nodes.map(node => node.id),seq:['user','api','db','snapshot','context','prompt','llm','validator','review','api','user']},
    summary:{nodes:['user','api','context','prompt','llm','validator','review','retry','eval'],seq:['user','api','context','prompt','llm','validator','review','api','user']},
    grounded:{nodes:['user','api','db','snapshot','context','prompt','llm','validator','review','retry','eval','embedding','index','retriever'],seq:['user','api','db','embedding','index','retriever','context','prompt','llm','validator','review','api','user']},
    tools:{nodes:['user','api','context','prompt','llm','validator','review','retry','eval','agent','tool'],seq:['user','api','context','prompt','llm','agent','tool','agent','llm','validator','review','api','user']}
  };

  function mapFocus(chapter = 0) {
    return (focusByChapter[Number(chapter)] || []).slice();
  }

  function mapFocusLabel(chapter = 0) {
    const number = Number(chapter);
    const metadata = (globalThis.LECTURE_DATA?.chapters || C.data?.chapters || []).find(item => Number(item.number) === number);
    if (metadata?.focusLabel) return metadata.focusLabel;
    const labels = mapFocus(number).map(id => nodeById(id).title);
    return labels.length ? labels.join(' · ') : '전체 서비스 · 전체 구조';
  }

  function mapSVG(chapter = 0, options = {}) {
    const {mini = false, selected = null, scope = false} = options;
    const mode = Object.hasOwn(routes, options.mode) ? options.mode : 'all';
    const route = routes[mode];
    const step = Number.isInteger(options.step) && options.step >= 0
      ? Math.min(options.step, route.seq.length - 1) : -1;
    const routeNode = step >= 0 ? route.seq[step] : null;
    const baseFocus = Array.isArray(options.focus) ? options.focus.filter(id => nodeById(id)) : mapFocus(chapter);
    const focus = scope ? todayNodes : routeNode ? [routeNode] : baseFocus;
    const marker = 'day26-atlas-' + (++serial) + '-arrow';
    const visibleEdges = edges.filter(edge => edge[6] !== 'agent' || mode === 'tools' || mode === 'all');
    const accessible = mini ? 'aria-hidden="true"' :
      'role="group" aria-label="' + esc('AI 업무 서비스 전체 지도. 현재 강조: ' + focus.map(id => nodeById(id).title).join(', ')) + '"';

    return '<svg class="atlas-svg ' + (mini ? 'mini' : '') + '" viewBox="0 0 1200 558" ' + accessible + '>' +
      '<defs><marker id="' + marker + '" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs>' +
      '<rect class="atlas-boundary" x="138" y="28" width="1043" height="515" rx="18"/>' +
      (mini ? '' :
        '<text x="157" y="57" class="atlas-boundary-title">애플리케이션 · Backend</text>' +
        '<text x="1160" y="57" text-anchor="end" class="atlas-scope-label">Day28 · RAG Evaluation & Debugging</text>' +
        '<text x="158" y="126" class="atlas-lane">요청 처리 · 오늘의 관찰 경로</text>' +
        '<text x="158" y="451" class="atlas-lane">검색 기반</text>') +
      visibleEdges.map(([from,to,path,label,x,y,kind]) => {
        const involved = route.nodes.includes(from) && route.nodes.includes(to);
        const hot = routeNode && from === route.seq[step - 1] && to === routeNode;
        const dim = mode !== 'all' && !involved;
        return '<g class="atlas-edge ' + kind + (dim ? ' dim' : '') + (hot ? ' traversing' : '') + '">' +
          '<path d="' + path + '" marker-end="url(#' + marker + ')"/>' +
          (mini ? '' : '<text x="' + x + '" y="' + y + '" text-anchor="middle">' + esc(label) + '</text>') +
          '</g>';
      }).join('') +
      nodes.map(node => {
        const current = focus.includes(node.id);
        const dim = mode !== 'all' && !route.nodes.includes(node.id);
        const inspected = selected === node.id;
        const attributes = mini ? '' :
          'data-action="atlasNode" data-node="' + node.id + '" role="button" tabindex="0" aria-label="' +
          esc(node.title + ' · ' + node.kicker + ' · ' + node.desc) + '"';
        return '<g class="atlas-node ' + node.kind + (current ? ' current-node' : '') + (dim ? ' dim' : '') + (inspected ? ' inspected' : '') +
          '" ' + attributes + ' transform="translate(' + node.x + ',' + node.y + ')">' +
          '<rect class="node-rect" width="' + node.w + '" height="' + node.h + '" rx="11"/>' +
          (mini ? '' :
            '<text class="node-kicker" x="12" y="16">' + esc(node.kicker) + '</text>' +
            '<text class="node-title" x="12" y="43">' + esc(node.title) + '</text>' +
            '<text class="node-sub" x="12" y="' + (node.h - 10) + '">' + esc(node.sub) + '</text>') +
          (current ? '<circle class="current-dot" cx="' + (node.w - 8) + '" cy="1" r="' + (mini ? 12 : 8) + '"/>' : '') +
          '</g>';
      }).join('') +
      (mini ? '' :
        '<rect class="evaluation-outline" x="535" y="290" width="172" height="94" rx="15"/>' +
        '<text class="evaluation-label" x="621" y="401" text-anchor="middle">별도 평가 · 실행 결과 비교</text>') +
      '</svg>';
  }

  function mapLegend() {
    return '<div class="atlas-legend"><span><i class="prior"></i>기존 기반·학습한 원리</span><span><i class="today"></i>오늘 배우는 영역</span><span><i class="future"></i>후속 확장</span><span><i class="eval"></i>별도 비교·평가</span><span><i class="current"></i>현재 위치</span></div>';
  }

  function mapFigure(chapter = 0, options = {}) {
    return '<div class="atlas-figure">' + mapSVG(chapter, options) + mapLegend() + '</div>';
  }

  Object.assign(C, {
    mapNodes:nodes,
    mapEdges:edges,
    mapFocus,
    mapFocusLabel,
    mapSVG,
    mapLegend,
    mapFigure
  });
})();


/* Day26 architecture orientation. Pure SVG/string rendering; no DOM or network. */
(() => {
  'use strict';
  const C = globalThis.D26;
  if (!C) throw new Error('Load D26 before architecture_diagrams.js');
  const esc = C.esc || (value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])));
  const color = {ink:'#222f44',navy:'#1c2b40',blue:'#426fa3',pale:'#edf3f9',line:'#d7e0eb',muted:'#5c6b7c',teal:'#2b6f65',white:'#ffffff'};
  let serial = 0;

  function label(x, y, value, size = 18, options = {}) {
    return `<text x="${x}" y="${y}" font-size="${size}" font-weight="${options.bold ? 700 : 400}" text-anchor="${options.anchor || 'middle'}" fill="${options.fill || color.ink}">${esc(value)}</text>`;
  }

  function box({key, x, y, w, h, title, subtitle, note, active = false, muted = false}) {
    const stroke = active ? color.blue : color.line;
    const fill = active ? color.pale : color.white;
    return `<g data-arch-node="${esc(key)}"${active ? ' data-arch-active="true"' : ''}>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="${active ? 3 : 1.7}"/>
      ${active ? `<rect x="${x}" y="${y+12}" width="5" height="${h-24}" rx="2" fill="${color.blue}"/>` : ''}
      ${label(x+w/2,y+(note ? 30 : 32),title,21,{bold:true,fill:muted ? color.muted : color.navy})}
      ${label(x+w/2,y+(note ? 55 : 58),subtitle,16,{fill:muted ? color.muted : color.ink})}
      ${note ? label(x+w/2,y+77,note,14,{fill:color.muted}) : ''}
    </g>`;
  }

  function setup(mode, title, description) {
    const uid = `d26-arch-${mode}-${++serial}`;
    return {
      uid,
      start: `<svg class="d26-arch-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-labelledby="${uid}-title ${uid}-desc" data-arch-mode="${mode}">
        <title id="${uid}-title">${esc(title)}</title><desc id="${uid}-desc">${esc(description)}</desc>
        <g font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif">`,
      path(d, options = {}) {
        // Explicit arrowheads also render in offline SVG engines without marker support.
        // Architecture connectors use absolute M/H/V commands only.
        const tokens = d.match(/[MHV]|-?\d+(?:\.\d+)?/g) || [];
        let x = 0, y = 0, dx = 0, dy = 0, i = 0;
        while (i < tokens.length) {
          const command = tokens[i++];
          if (command === 'M') {x = Number(tokens[i++]); y = Number(tokens[i++]);}
          else if (command === 'H') {const next = Number(tokens[i++]); dx = next-x; dy = 0; x = next;}
          else if (command === 'V') {const next = Number(tokens[i++]); dx = 0; dy = next-y; y = next;}
          else throw new Error(`Unsupported architecture connector command: ${command}`);
        }
        const length = Math.hypot(dx,dy);
        if (!length) throw new Error('Architecture connector requires a final nonzero segment');
        const ux = dx/length, uy = dy/length;
        const arrowLength = options.width && options.width < 2 ? 7 : 8;
        const halfWidth = options.width && options.width < 2 ? 3.5 : 4;
        const bx = x-ux*arrowLength, by = y-uy*arrowLength;
        const points = `${x},${y} ${bx-uy*halfWidth},${by+ux*halfWidth} ${bx+uy*halfWidth},${by-ux*halfWidth}`;
        const stroke = options.teal ? color.teal : color.blue;
        return `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${options.width || 2}"${options.dash ? ' stroke-dasharray="6 5"' : ''}/><polygon class="d26-arch-arrowhead" points="${points}" fill="${stroke}"/>`;
      }
    };
  }

  function service(mode) {
    const focus = mode === 'scope';
    const S = setup(mode, focus ? '전체 서비스에서 오늘의 RAG 연결 위치' : '문서 기반 답변 서비스의 전체 구조',
      '위쪽은 문서가 바뀔 때 실행하는 Indexing입니다. 업무 문서를 정제하고 나누어 Embedding과 출처를 저장합니다. 아래쪽은 질문마다 실행하는 Query입니다. 사용자가 FastAPI로 질문하면 RAG Service가 저장소의 관련 청크를 찾고 LLM API를 호출한 뒤 답변과 출처를 돌려줍니다. 오늘은 RAG Service의 내부 연결을 학습합니다.');
    const nodes = [
      {key:'documents',x:20,y:43,w:220,h:81,title:'업무 문서',subtitle:'규정 · 매뉴얼 · FAQ',muted:focus},
      {key:'indexing',x:320,y:43,w:330,h:81,title:'Indexing',subtitle:'Parse · Clean · Chunk · Embedding',muted:focus},
      {key:'store',x:790,y:43,w:310,h:81,title:'PostgreSQL + pgvector',subtitle:'청크 · 벡터 · 출처 · 버전',muted:focus},
      {key:'user',x:20,y:190,w:190,h:92,title:'사용자',subtitle:'질문 / 답변·출처'},
      {key:'api',x:270,y:190,w:200,h:92,title:'FastAPI',subtitle:'요청·응답 계약'},
      {key:'rag',x:530,y:190,w:270,h:92,title:'RAG Service',subtitle:'검색 · 근거 선택 · 생성·검증',active:true},
      {key:'model',x:880,y:190,w:220,h:92,title:'LLM API',subtitle:'근거를 읽고 답변 생성'}
    ];
    return S.start +
      label(20,25,'문서 준비 · 문서가 바뀔 때',16,{bold:true,anchor:'start',fill:color.muted}) +
      (focus ? `<rect x="10" y="174" width="1100" height="124" rx="14" fill="#f6f9fc" stroke="${color.blue}" stroke-width="1.5" stroke-dasharray="6 5"/>` : '') +
      label(20,165,'질문 처리 · 질문마다',16,{bold:true,anchor:'start',fill:color.blue}) +
      (focus ? label(270,165,'오늘: RAG Service 내부를 연결',16,{bold:true,anchor:'start',fill:color.blue}) : '') +
      S.path('M240 84 H320') + label(280,72,'원문',14,{fill:color.muted}) +
      S.path('M650 84 H790') + label(720,72,'검증·공개',14,{fill:color.muted}) +
      S.path('M945 124 V148 H665 V190') + label(820,141,'관련 청크·출처',14,{fill:color.blue}) +
      S.path('M740 190 V173 H1020 V124',{teal:true,width:1.4}) + label(900,166,'질문·검색 조건',14,{fill:color.teal}) +
      S.path('M210 216 H270') + S.path('M270 259 H210') +
      S.path('M470 216 H530') + S.path('M530 259 H470') +
      S.path('M800 216 H880') + label(840,206,'Prompt',14,{fill:color.blue}) +
      S.path('M880 259 H800') + label(840,280,'생성 결과',14,{fill:color.muted}) +
      nodes.map(box).join('') +
      label(20,326,'아래쪽의 양방향 화살표: 요청을 보내고 결과를 돌려받는 경로',14,{anchor:'start',fill:color.muted}) +
      label(1100,326,'후속 확장: Agent가 RAG 기능을 Tool로 호출',14,{anchor:'end',fill:color.muted}) +
      '</g></svg>';
  }

  function rag(mode) {
    const lc = mode === 'langchain';
    const S = setup(mode, lc ? '같은 RAG 역할에 LangChain 구성요소 대응하기' : 'RAG Service 내부의 다섯 단계와 반환 흐름',
      '질문과 조건은 Retriever, Context Builder, Prompt, Generator, Validation과 Source 연결을 순서대로 거쳐 API 응답이 됩니다. Context에 실제 포함한 문서와 ID는 생성 결과와 별도로 보관하여 Validation에 전달합니다. LangChain 대응에서는 검색 어댑터와 Document, build_context, ChatPromptTemplate, ChatOpenAI, Python과 Pydantic 검증을 사용합니다.');
    const nodes = [
      {key:'retrieval',x:40,y:77,w:300,h:81,title:'01  Retriever',subtitle:lc ? 'RunnableLambda · Document' : '질문·조건 → 관련 청크 후보',active:lc},
      {key:'context',x:410,y:77,w:300,h:81,title:'02  Context Builder',subtitle:lc ? 'build_context · included_docs' : '선택한 근거 → Context + ID'},
      {key:'prompt',x:780,y:77,w:300,h:81,title:'03  Prompt',subtitle:lc ? 'ChatPromptTemplate' : '규칙 + 질문 + Context',active:lc},
      {key:'model',x:780,y:231,w:300,h:81,title:'04  Generator',subtitle:lc ? 'ChatOpenAI' : '모델 호출 → 생성 결과',active:lc},
      {key:'validation',x:410,y:231,w:300,h:81,title:'05  Validation · Sources',subtitle:lc ? 'Python · Pydantic · source_index' : '형식·출처 검사 → 원문 연결'},
      {key:'response',x:40,y:231,w:300,h:81,title:'API 응답',subtitle:lc ? 'result · sources' : '답변 + 실제 출처'}
    ];
    return S.start +
      `<rect x="10" y="8" width="1100" height="332" rx="14" fill="#f8fafc" stroke="${color.line}" stroke-width="1.7"/>` +
      label(40,38,lc ? 'RAG Service 내부 · 역할은 유지하고 연결 방식을 대응' : 'RAG Service 내부 · 한 질문이 답변이 되는 경로',19,{bold:true,anchor:'start',fill:color.navy}) +
      label(40,65,'입력: 질문·검색 조건',14,{anchor:'start',fill:color.muted}) +
      (lc ? label(1080,65,'공통 실행: invoke · 순차 연결: |',14,{anchor:'end',fill:color.blue}) : '') +
      S.path('M340 118 H410') + S.path('M710 118 H780') +
      S.path('M930 158 V231') + label(942,199,'모델 입력',14,{anchor:'start',fill:color.blue}) +
      S.path('M780 272 H710') + S.path('M410 272 H340') +
      S.path('M560 158 V231',{teal:true,dash:true}) +
      `<rect x="423" y="174" width="274" height="41" rx="5" fill="#f8fafc"/>` +
      label(560,191,lc ? 'included_docs → provided_ids' : '실제 포함한 문서와 ID',15,{bold:true,fill:color.teal}) +
      label(560,210,'생성 결과와 별도로 보관',14,{fill:color.teal}) +
      nodes.map(box).join('') +
      '</g></svg>';

  function architectureSVG(mode, options = {}) {
    if (!['service','scope','rag','langchain'].includes(mode)) throw new Error(`Unknown architecture mode: ${mode}`);
    const captions = {
      service:'문서 준비와 질문 처리를 분리하고, RAG Service가 검색 결과와 모델 호출을 연결합니다.',
      scope:'이미 준비한 문서·검색·API 경험을 활용하여, 오늘은 RAG Service의 입력부터 답변·출처까지 연결합니다.',

    };
    const caption = options.caption === false ? '' : `<figcaption class="d26-arch-caption">${esc(typeof options.caption === 'string' ? options.caption : captions[mode])}</figcaption>`;
    return `<figure class="d26-arch-figure d26-arch-${mode}"><div class="d26-arch-scroll">${mode === 'service' || mode === 'scope' ? service(mode) : rag(mode)}</div>${caption}</figure>`;

  }

  Object.assign(C, {architectureSVG, chapterLocator});
})();

/* Progressive architecture explanations, using the existing lesson headings. */
(() => {

  const C = globalThis.D26;

  function renderArchitecture(scene) {

      body += `<div class="d26-arch-explanations d26-arch-${columns}">${scene.sections.map(([title, text]) =>

      ).join('')}</ol>`;

/* Day26 content renderer using the original lecture template's HTML patterns.

(() => {

    ).join('');

  function cover() {

ad><body><header class=\"review-top\"><div><div class=\"tag\">DAY 28 · 2026.11.25 · 핵심요약</div><h1>RAG Evaluation &amp; Debugging</h1><p>검색 평가 · 생성 평가 · LangChain 실행 흐름 · Agent 연결 준비</p></div><button class=\"review-print\" onclick=\"window.print()\">인쇄</button></header><main><section class=\"sheet\" id=\"review-1\"><div class=\"sheet-heading\"><span class=\"sheet-number\">01</span><h2>평가 전체 흐름</h2></div><p class=\"definition\"><strong>Dataset → Target Runner → Evaluator → Report</strong></p><p>RAG 품질은 Retrieval·Generation·서비스 운영으로 나누어 평가합니다.</p><div class=\"two-col\"><div class=\"inline-def\"><b>Dataset</b><p>질문·Gold 문서·Reference Answer를 사전에 고정</p></div><div class=\"inline-def\"><b>Target</b><p>기존 LangChain RAG.invoke() 실행</p></div><div class=\"inline-def\"><b>Evaluator</b><p>결과와 Gold·근거·정답 비교</p></div><div class=\"inline-def\"><b>Report</b><p>질문별 실패·버전·점수 저장</p></div></div><div class=\"lesson\"><strong>핵심</strong> 결과를 보고 Gold를 임의로 고치지 않고, 실제 모델 호출과 고정 사례를 구분합니다.</div></section><section class=\"sheet\" id=\"review-2\"><div class=\"sheet-heading\"><span class=\"sheet-number\">02</span><h2>Gold Dataset</h2></div><p class=\"definition\"><strong>검색 정답 문서와 생성 정답의 역할 구분</strong></p><p>Gold Chunk ID는 Retrieval 평가, Reference Answer는 Generation Correctness 평가에 사용합니다.</p><div class=\"two-col\"><div class=\"inline-def\"><b>관련 문서가 복수</b><p>Gold={C1,C2,C3}처럼 여러 정답 가능</p></div><div class=\"inline-def\"><b>Graded Label</b><p>0=무관, 1=부분 관련, 2=매우 관련</p></div><div class=\"inline-def\"><b>No-answer</b><p>Gold=∅이면 Recall N/A, 거절 행동 별도 확인</p></div><div class=\"inline-def\"><b>Version</b><p>Corpus Snapshot·출처·권한 조건 기록</p></div></div><div class=\"lesson\"><strong>핵심</strong> 정답 데이터는 RAG Target 실행 입력에 누출하지 않습니다.</div></section><section class=\"sheet\" id=\"review-3\"><div class=\"sheet-heading\"><span class=\"sheet-number\">03</span><h2>Recall@k · Precision@k · Hit@k</h2></div><p class=\"definition\"><strong>포함 비율의 분모가 각각 다릅니다</strong></p><p>Gold={C1,C2,C3}, Top-3=[C4,C2,C1]이면 일치한 Gold는 C1·C2 두 건입니다.</p><div class=\"two-col\"><div class=\"inline-def\"><b>Hit@3</b><p>관련 문서 최소 한 건 존재 → 1</p></div><div class=\"inline-def\"><b>Recall@3</b><p>2/3≈0.667 · 전체 Gold 기준</p></div><div class=\"inline-def\"><b>Precision@3</b><p>2/3≈0.667 · Top-k 기준</p></div><div class=\"inline-def\"><b>Context 비교</b><p>candidate_ids와 included_ids의 차이 관찰</p></div></div><div class=\"lesson\"><strong>핵심</strong> Gold가 없으면 Recall은 N/A입니다. 여기서는 Precision@k의 분모를 k로 고정합니다.</div></section><section class=\"sheet\" id=\"review-4\"><div class=\"sheet-heading\"><span class=\"sheet-number\">04</span><h2>RR · MRR · nDCG</h2></div><p class=\"definition\"><strong>순위가 얼마나 좋은지 계산합니다</strong></p><p>RR은 첫 관련 문서 순위 역수이고 MRR은 질문별 RR 평균입니다.</p><div class=\"two-col\"><div class=\"inline-def\"><b>RR</b><p>정답이 3위 → 1/3</p></div><div class=\"inline-def\"><b>MRR</b><p>평가 질문 집합의 RR 평균</p></div><div class=\"inline-def\"><b>DCG</b><p>Σ(2^grade−1)/log₂(rank+1)</p></div><div class=\"inline-def\"><b>nDCG</b><p>DCG/IDCG · 이상 순서로 정규화</p></div></div><div class=\"lesson\"><strong>핵심</strong> MRR은 첫 정답만 보고, nDCG는 여러 문서의 등급과 위치를 함께 평가합니다.</div></section><section class=\"sheet\" id=\"review-5\"><div class=\"sheet-heading\"><span class=\"sheet-number\">05</span><h2>Generation Evaluation</h2></div><p class=\"definition\"><strong>Faithfulness · Answer Relevance · Correctness</strong></p><p>관련 문서를 찾았어도 Generator가 원문에 없는 사실을 답하면 실패일 수 있습니다.</p><div class=\"two-col\"><div class=\"inline-def\"><b>Faithfulness</b><p>생성 Claim ↔ Context 근거</p></div><div class=\"inline-def\"><b>Relevance</b><p>원래 질문 ↔ 생성 답변</p></div><div class=\"inline-def\"><b>Correctness</b><p>생성 답변 ↔ Reference Answer</p></div><div class=\"inline-def\"><b>Human Review</b><p>자동 Judge와 실제 원문·사람 판단 대조</p></div></div><div class=\"lesson\"><strong>핵심</strong> 출처 ID가 존재한다는 사실만으로 답변의 주장이 근거와 일치하지는 않습니다.</div></section><section class=\"sheet\" id=\"review-6\"><div class=\"sheet-heading\"><span class=\"sheet-number\">06</span><h2>LangChain Evaluation Runner</h2></div><p class=\"definition\"><strong>같은 Runnable을 같은 Dataset에 반복 실행</strong></p><p>Dataset은 원 질문·Gold를 보관하고 Runner는 Gold 없이 RAG를 호출합니다.</p><div class=\"two-col\"><div class=\"inline-def\"><b>Runnable.invoke()</b><p>실제 검색·GPU Reranker·LLM 실행 가능</p></div><div class=\"inline-def\"><b>Document.metadata</b><p>chunk_id·citation_id·source_locator 보관</p></div><div class=\"inline-def\"><b>Evaluator</b><p>반환 ID를 Gold와 비교해 점수 계산</p></div><div class=\"inline-def\"><b>LangSmith</b><p>선택적 Trace/Experiment 플랫폼</p></div></div><div class=\"lesson\"><strong>핵심</strong> Trace는 실행 기록, Evaluation은 정답 기준의 품질 판정입니다.</div></section><section class=\"sheet\" id=\"review-7\"><div class=\"sheet-heading\"><span class=\"sheet-number\">07</span><h2>A/B · Debugging · Quality Gate</h2></div><p class=\"definition\"><strong>평균 점수보다 질문별 실패 원인을 먼저 추적</strong></p><p>Baseline과 Improved는 동일 Corpus·질문·Gold·권한·k에서 비교합니다.</p><div class=\"two-col\"><div class=\"inline-def\"><b>Recall↓</b><p>Query·Retriever·필터·Index 확인</p></div><div class=\"inline-def\"><b>MRR↓</b><p>같은 후보라면 Reranker·Top-N 확인</p></div><div class=\"inline-def\"><b>Faithfulness↓</b><p>Prompt·Context·모델 주장 확인</p></div><div class=\"inline-def\"><b>Latency↑</b><p>GPU·DB·LLM 각 구간 실측</p></div></div><div class=\"lesson\"><strong>핵심</strong> 11/26 Agent Tool에 연결하기 전 Retrieval·Generation·권한·출처·운영 Gate를 확인합니다.</div></section><section class=\"sheet\" id=\"review-8\"><div class=\"sheet-heading\"><span class=\"sheet-number\">08</span><h2>다음 날 · Agent Fundamentals</h2></div><p class=\"definition\"><strong>검증된 RAG를 Tool Calling Agent에서 재사용</strong></p><p>11월 26일에는 rag_search와 읽기 전용 DB Tool을 Agent에 연결합니다.</p><div class=\"two-col\"><div class=\"inline-def\"><b>RAG Tool</b><p>검색한 근거와 출처·상태 반환</p></div><div class=\"inline-def\"><b>Tool Schema</b><p>인수·자료형·필터 조건 검증</p></div><div class=\"inline-def\"><b>Agent Loop</b><p>선택 → 실행 → 결과 반환 → 다음 판단</p></div><div class=\"inline-def\"><b>11/27 개인 프로젝트</b><p>단일 Agent + Tool 2개 이상 + API</p></div></div><div class=\"lesson\"><strong>핵심</strong> 오늘은 평가가 중심입니다. Agent의 create_agent 구현은 내일 다룹니다.</div></section></main><footer class=\"review-footer\">Day28 · RAG Evaluation &amp; Debugging · 2026.11.25</footer></body></html>";

  const files = {"query.py":"# Rewrite Chain은 이전 수업의 Prompt와 Chat Model을 연결한 Runnable입니다.\ndef rewrite_step(state, rewrite_chain):\n    # API의 history 목록도 받을 수 있도록 검색용 문자열로 준비합니다.\n    history_text = state.get(\"history_text\", \"\")\n    if not history_text:\n        history_text = \"\\n\".join(\n            f'{m.get(\"role\", \"user\")}: {m.get(\"content\", \"\")}'\n            for m in state.get(\"history\", []))\n    result = rewrite_chain.invoke({\n        \"history\": history_text,\n        \"question\": state[\"question\"],\n    })\n    if result.needs_clarification:\n        return {**state, \"status\": \"needs_clarification\"}\n    return {**state, \"status\": \"ready\",\n            \"search_query\": result.standalone_query}","retrieval.py":"from coursekit.checkpoints import make_retriever\n\n# Day26 E5 + pgvector 검색을 다시 만들지 않고 재사용합니다.\ndef retrieve_step(state, search_hits):\n    retriever = make_retriever(search_hits)\n    docs = retriever.invoke({\n        \"query\": state[\"search_query\"],\n        \"category\": state[\"category\"],\n        \"candidate_k\": state.get(\"candidate_k\", 10),\n    })\n    # 반환된 것은 dict Hit가 아니라 LangChain Document 목록입니다.\n    return {**state, \"candidate_docs\": docs}","rerank.py":"import math\n\n# CrossEncoder가 Document 후보를 점수화합니다 (기본 CUDA GPU).\ndef rerank_step(state, cross_encoder):\n    docs = state[\"candidate_docs\"]\n    if not docs:\n        return {**state, \"ranked_docs\": []}\n    pairs = [(state[\"search_query\"], doc.page_content) for doc in docs]\n    scores = cross_encoder.predict(pairs, batch_size=4)\n    if len(scores) != len(docs) or not all(math.isfinite(float(s)) for s in scores):\n        raise ValueError(\"invalid rerank scores\")\n    ranked = sorted(zip(scores, docs), key=lambda pair: float(pair[0]), reverse=True)\n    # Document 원본을 순서만 바꾸므로 citation_id와 metadata는 유지됩니다.\n    return {**state, \"ranked_docs\": [doc for _, doc in ranked[:3]]}","pipeline.py":"from langchain_core.runnables import RunnableLambda\nfrom .query import rewrite_step\nfrom .retrieval import retrieve_step\nfrom .rerank import rerank_step\n\n# 위 단계를 하나의 RAG 서비스로 조립하는 교육용 예시입니다.\ndef create_service(rewrite_chain, search_hits, cross_encoder,\n                   build_context, generation_chain, validate_and_attach):\n    def run(request):\n        state = rewrite_step(request, rewrite_chain)\n        if state[\"status\"] != \"ready\":\n            return {\"status\": \"needs_clarification\", \"answer\": \"질문 대상을 알려주세요.\"}\n        state = retrieve_step(state, search_hits)\n        state = rerank_step(state, cross_encoder)\n        context, docs = build_context(state[\"ranked_docs\"], max_items=3)\n        if not docs:\n            return {\"status\": \"insufficient_context\", \"answer\": \"근거가 부족합니다.\"}\n        # 검색용 질문 대신 사용자 원 질문으로 답변합니다.\n        raw = generation_chain.invoke({\"question\": request[\"question\"],\n                                       \"context\": context})\n        ids = [doc.metadata[\"citation_id\"] for doc in docs]\n        # 생성과 출처 검증에서 같은 입력·출처 집합을 확인합니다.\n        state = {**state, \"context\": context, \"included_ids\": ids}\n        return validate_and_attach(raw, ids, state)\n    return RunnableLambda(run)  # 서비스가 invoke될 때 내부 단계 실행","api.py":"from fastapi import APIRouter, HTTPException\nfrom pydantic import BaseModel, Field\n\nclass EnhancedRagRequest(BaseModel):\n    question: str\n    category: str\n    history: list[dict[str, str]] = Field(default_factory=list)\n    candidate_k: int = Field(default=10, ge=1, le=20)\n\n# 실제 앱 시작 시 생성한 service Runnable을 주입받습니다.\ndef create_router(service):\n    router = APIRouter()\n\n    @router.post(\"/api/v1/rag/enhanced\")\n    def ask(req: EnhancedRagRequest):\n        try:\n            return service.invoke(req.model_dump())\n        except ValueError as exc:\n            raise HTTPException(status_code=422, detail=str(exc)) from exc\n        except Exception as exc:\n            raise HTTPException(status_code=502, detail=\"RAG 처리 실패\") from exc\n\n    return router"};

 function scores(ids, gold, k){

 }

 function ndcg(ids, grades, k){const ideal=Object.keys(grades).sort((a,b)=>grades[b]-grades[a]);const best=dcg(ideal,grades,k);return {dcg:dcg(ids,grades,k),idcg:best,score:best?dcg(ids,grades,k)/best:null};}

    }

    function inspectMapNode(id, element) {
      if (id !== null && !C.mapNodes.some(node => node.id === id)) return;
      const mapDialog = document.getElementById('atlasDialog');
      if (!mapDialog.open) {
        selectedMapChapter = chapterFromMapElement(element);
        selectedMapNode = id;
        dialog('atlasDialog', atlasModalBody());
        return;
      }
      selectedMapNode = id;
      const body = mapDialog.querySelector('.dialog-body');
      const scrollTop = body.scrollTop;
      body.innerHTML = atlasModalBody();
      const focus = id === null ? mapDialog.querySelector('[data-action="atlasClose"]') : mapDialog.querySelector(`[data-action="atlasNode"][data-node="${id}"]`);
      focus?.focus({preventScroll: true});
      body.scrollTop = scrollTop;
    }

    function openReview() {
      const reviewWindow = window.open('', '_blank');
      if (!reviewWindow) {
        showToast('새 창이 차단되었습니다. 팝업을 허용한 뒤 핵심요약을 다시 누르세요.');
        return;
      }
      reviewWindow.document.open();
      reviewWindow.document.write(C.renderReviewDocument());
      reviewWindow.document.close();
    }

    function openGlossary() {
      dialog('glossaryDialog', `<label for="glossarySearch" class="d26-instruction">영어 이름 또는 한국어 설명으로 찾기</label><input id="glossarySearch" class="d26-search" type="search" placeholder="예: Document, Context, 출처"><div id="glossaryResults" class="d26-glossary-search-results">${C.renderGlossary()}</div>`);
    }

    function updateDemo(name, key, value, restoreFocus = false) {
      if (!Object.hasOwn(C.state, name) || !Object.hasOwn(C.state[name], key)) return;
      const active = document.activeElement;
      const selection = active?.dataset?.demo === name && active?.dataset?.key === key && typeof active.selectionStart === 'number'
        ? [active.selectionStart, active.selectionEnd] : null;
      C.state[name][key] = typeof C.state[name][key] === 'number' ? Number(value) : value;
      const shell = document.querySelector(`[data-demo-root="${name}"]`);
      if (!shell) return;
      shell.querySelector('.d26-demo-body').innerHTML = C.demos[name](C.state[name]);
      if (restoreFocus) {
        const input = shell.querySelector(`[data-key="${key}"]`);
        input?.focus({preventScroll: true});
        if (selection && typeof input?.setSelectionRange === 'function') input.setSelectionRange(...selection);
      }
    }

    async function copyCode(id) {
      const code = D.scenes.find(scene => scene.id === id)?.code?.raw;
      if (code === undefined) return;
      try {
        if (globalThis.navigator?.clipboard?.writeText) {
          await globalThis.navigator.clipboard.writeText(code);
          showToast('코드를 복사했습니다.');
          return;
        }
        const area = document.createElement('textarea');
        area.value = code;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        let copied;
        try { area.select(); copied = document.execCommand('copy'); }
        finally { area.remove(); }
        if (!copied) throw new Error('Copy unavailable');
        showToast('코드를 복사했습니다.');
      } catch {
        dialog('sourceDialog', `<p class="smalltext muted">자동 복사를 사용할 수 없습니다. 아래 코드를 선택해 복사하세요.</p>${pre(code)}`);
      }
    }

    async function fullScreen() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch { showToast('브라우저의 전체화면 기능을 이용하세요.'); }
    }

    const actions = {
      next: () => go(index + 1),
      prev: () => go(index - 1),
      atlasOpen: openMap,
      atlasClose: () => { document.getElementById('atlasDialog').close(); selectedMapNode = null; selectedMapChapter = null; },
      atlasNode: element => inspectMapNode(element.dataset.node, element),
      atlasClear: () => inspectMapNode(null),
      atlasJump: element => go(element.dataset.scene),
      review: openReview,
      glossary: openGlossary,
      help: () => dialog('helpDialog', C.renderHelp(reading)),
      fullscreen: fullScreen,
      read: () => { reading = !reading; selectedMapNode = null; closeDialogs(); render(); },
      close: closeDialogs
    };

    document.addEventListener('click', event => {
      const element = event.target.closest?.('button,a,[data-action]');
      if (!element) return;
      if (element.hasAttribute('data-jump')) { event.preventDefault(); go(Number(element.dataset.jump)); }
      else if (element.dataset.action && actions[element.dataset.action]) { event.preventDefault(); actions[element.dataset.action](element); }
      else if (element.dataset.code) copyCode(element.dataset.code);
      else if (element.dataset.setDemo) updateDemo(element.dataset.setDemo, element.dataset.key, element.dataset.value);
      else if (element.dataset.resetDemo) {
        const name = element.dataset.resetDemo;
        if (!Object.hasOwn(C.defaults, name)) return;
        C.state[name] = clone(C.defaults[name]);
        element.closest('[data-demo-root]').querySelector('.d26-demo-body').innerHTML = C.demos[name](C.state[name]);
      } else if (element.dataset.source) {
        const hit = C.corpus.find(item => item.citation_id === Number(element.dataset.source));
        if (hit) dialog('sourceDialog', `<div class="d26-dialog-text"><h3>[${hit.citation_id}] ${esc(hit.title)}</h3><p><strong>${esc(hit.doc_id)}</strong> · ${esc(hit.source_version)} · ${esc(hit.category)}</p><p>${esc(hit.source_locator)}</p><div class="d26-question">${esc(hit.body)}</div><p class="smalltext muted">교육용 문서 · 실제 DB ID가 아닌 강의용 ID입니다. 이 위치는 모델이 만든 경로가 아니라 시연 Corpus의 레코드에서 가져왔습니다.</p></div>`);
      }
    });

    document.addEventListener('change', event => {
      const element = event.target;
      if (element.id === 'sceneJump') go(Number(element.value));
      else if (element.dataset.demo) updateDemo(element.dataset.demo, element.dataset.key, element.type === 'checkbox' ? element.checked : element.value, true);
    });

    document.addEventListener('input', event => {
      const element = event.target;
      if (element.id === 'glossarySearch') document.getElementById('glossaryResults').innerHTML = C.renderGlossary(element.value);
      else if (element.type === 'range' && element.dataset.demo) {
        const output = element.closest('label')?.querySelector('output');
        if (output) output.textContent = element.value;
      }
    });

    document.addEventListener('keydown', event => {
      const element = event.target;
      if (event.ctrlKey || event.altKey || event.metaKey) return;
      if (element.matches('input,select,textarea') || element.isContentEditable) {
        if (event.key === 'Enter' && element.type === 'text' && element.dataset.demo) {
          event.preventDefault();
          updateDemo(element.dataset.demo, element.dataset.key, element.value, true);
        }
        return;
      }
      const mapNode = element.closest?.('[data-action="atlasNode"]');
      if (mapNode && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        inspectMapNode(mapNode.dataset.node);
        return;
      }
      if (document.querySelector('dialog[open]')) return;
      if (reading && ['PageDown', 'PageUp', 'Home', 'End', ' '].includes(event.key)) return;
      const key = event.key.toLowerCase();
      const keys = {
        arrowright: () => go(index + 1), pagedown: () => go(index + 1),
        arrowleft: () => go(index - 1), pageup: () => go(index - 1),
        home: () => go(0), end: () => go(D.scenes.length - 1),
        m: openMap, g: openGlossary, f: fullScreen,
        '?': () => dialog('helpDialog', C.renderHelp(reading))
      };
      if (key === ' ' && !element.closest('button,a,summary')) { event.preventDefault(); go(index + 1); }
      else if (keys[key]) { event.preventDefault(); keys[key](); }
    });

    window.addEventListener('hashchange', () => {
      const next = fromHash();
      if (next >= 0 && (next !== index || reading)) go(next, false);
    });

    document.getElementById('atlasDialog').addEventListener('close', () => { selectedMapNode = null; });
    C.player = {go, render, openMap, openReview, get currentIndex() { return index; }, get reading() { return reading; }};
    const initial = fromHash();
    if (initial >= 0) index = initial;
    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, {once: true});
  else init();
})();

   const src=d.sources.map(f=>`<div class="d28-source-snippet"><div><strong>${esc(f.file)}</strong><span>${esc(f.kind)} · ${esc(f.id)}</span></div><pre>${esc(f.text)}</pre></div>`).join('');
   return smallLabel('평가 Dataset은 단순한 문서 저장소가 아니라, <b>원천 데이터(정형·비정형)와 질문별 Gold 정답을 연결한 평가용 레코드</b>입니다. 아래는 필드가 실제로 채워진 예시입니다.')+
     `<div class="d28-domain-tabs">${domains}</div><div class="d28-artifact-chipline">${esc(d.kind)} · 개인정보 없이 만든 수업용 합성 레코드</div><div class="d28-artifact-two"><section class="d28-artifact-box"><h3>01. 원천 데이터 · CSV/Markdown</h3>${src}</section><section class="d28-artifact-box"><h3>02. eval_questions.jsonl · 질문·Gold</h3><pre class="d28-jsonl-pre">${esc(jsonl)}</pre><p><b>Gold Label:</b> 각 질문에 정답 근거가 되는 chunk_id 목록입니다. Target Runner에는 이 필드를 전달하지 않습니다.</p></section></div>`;
 }
 function renderTarget(){
   const steps=['eval_questions.jsonl','run_eval.py','evaluation/runner.py','Target.invoke()','Trace Adapter','Evaluator'];
   const flow=`<div class="d28-eval-flow">${steps.map((v,i)=>`${i?'<b>→</b>':''}<span>${esc(v)}</span>`).join('')}</div>`;
   const files=Object.keys(codeHTML);
   const fileButtons=files.map(name=>`<button type="button" data-d28-code-file="${esc(name)}" aria-pressed="${name===codeFile}">${esc(name)}</button>`).join('');
   return smallLabel('Target Runner는 기존 <b>LangChain RAG를 실제 호출</b>하는 코드입니다. 데이터의 <code>gold_chunk_ids</code>는 입력에서 제거하고, 실행 뒤 Trace Adapter에서 <code>ranked_ids</code>를 수집합니다.')+
   flow+`<section class="d28-vscode" aria-label="VS Code 형태의 평가 실행 코드"><aside class="d28-vscode-explorer"><h3>EXPLORER · RAG_EVAL</h3><nav class="d28-file-tabs">${fileButtons}</nav></aside><div class="d28-vscode-editor"><div class="d28-vscode-heading">Python · ${esc(codeFile)} · UTF-8</div><div class="d28-vscode-code">${codeHTML[codeFile]}</div><div class="d28-vscode-state">INPUT: question · category · candidate_k  →  OUTPUT: ranked_ids · included_ids · answer · status</div></div></section><p class="d28-report-mininote">구현 주의: <code>app.factory.build_evaluation_target()</code>은 기존 Day27 서비스와 Trace Adapter를 준비하는 프로젝트 함수입니다. API 응답에 ranked_ids가 없다면 평가용 Trace에서 수집해야 합니다. 이 화면은 역할별 소스 구조를 보여 주는 발췌입니다. build_evaluation_target()과 요청별 TraceStore는 실제 Day27 프로젝트에 연결해야 실행됩니다. HTML 자체는 GPU/DB/LLM을 실행하지 않습니다.</p>`;
 }
 function renderEvaluator(){
   const rows=observations.map(q=>[q.question_id,q.question,q.gold.join(', ')||'∅',q.ranked_ids.slice(0,3).join(' → '),fmt(q.recall),q.answerable?fmt(q.rr):'별도 No-answer 검사']);
   return smallLabel('Evaluator는 <b>질문별 검색 출력과 Gold 레이블을 비교</b>하여 점수를 계산합니다. 아래 숫자는 페이지의 동일한 고정 예시 데이터에서 실제 공식을 적용해 산출한 값입니다.')+summary()+table(['Q ID','업무 질문','Gold','Top-3 결과','Recall@3','RR@3'],rows)+`<div class="d28-artifact-two"><div class="d28-artifact-box"><h3>계산 절차 · Q01</h3><p>Gold: C3, C4 · Top-3: C5, C3, C1</p><p><strong>Recall@3</strong> = 1 / 2 = 0.500<br><strong>Precision@3</strong> = 1 / 3 = 0.333<br><strong>RR@3</strong> = 1 / 2 = 0.500</p></div><div class="d28-artifact-box"><h3>Generation 검토 예시</h3><p>“Context가 지원하는 주장인가?”를 사람 또는 별도의 LLM Judge가 판정합니다.</p>${table(['검토항목','예시 결과'],[['Citation ID','Context 안의 ID만 허용'],['Faithfulness','근거 문장 대조 필요'],['Correctness','Reference Answer와 별도 비교']])}</div></div><p class="d28-report-mininote">Q04에는 사전에 판정한 관련 문서가 없어 Recall을 N/A로 표시하고, 정보 부족 응답 여부를 별도 평가합니다. Q01~Q03만 평균 지표에 포함합니다.</p>`;
 }
 function renderReport(){
   const status=stats.recall>=0.8&&stats.mrr>=0.6?'기준 충족 · 추가 검토':'개선 후 재평가 필요';
   const rows=observations.map(q=>[q.question_id,q.question,q.gold.join(', ')||'∅',fmt(q.recall),q.answerable?fmt(q.rr):'별도 검사',q.status]);
   return smallLabel('Report는 단순 점수 출력이 아니라 <b>실패 질문, 개선 이유, 담당 모듈, 다음 검증 기준</b>을 포함하는 의사결정 문서입니다.')+
   `<article class="d28-eval-report"><div class="d28-report-heading"><span>RAG QUALITY ASSURANCE · EVALUATION REPORT</span><h3>RAG Retrieval 품질 검토 보고서</h3><div class="d28-report-meta"><span>문서 번호: D28-EVAL-001</span><span>일자: 2026-11-25</span><span>대상: rag-v0.3 (고정 예시)</span><span>평가셋: d28-sample-v1</span></div></div>${summary()}<div class="d28-report-decision"><strong>검토 결론 · ${esc(status)}</strong><div>교육용 목표(예시): Recall@3 ≥ 0.800 · MRR@3 ≥ 0.600. 현재 평균은 Recall@3 ${fmt(stats.recall)}, MRR@3 ${fmt(stats.mrr)}입니다.</div></div><h3 style="font-size:17px;margin:16px 0 10px">질문별 분석 결과</h3>${table(['ID','질문','Gold','Recall@3','RR@3','상태'],rows)}<div class="d28-report-cols"><div><h4>발견 사항</h4><ol><li>Q01: 신청·취소 문서 두 건 중 취소 근거만 Top-3에 포함되어 Recall@3=0.500입니다.</li><li>Q02: 지각·예외 근거 두 건 중 예외만 Top-3에 있으며, 답변에도 지각 기준이 빠져 Generation 검토가 필요합니다.</li><li>Q03: 취소 근거는 찾았지만 3위이므로 RR@3=0.333입니다.</li><li>Q04: 관련 Gold가 없는 질문은 정보 부족 응답 정책으로 별도 검증해야 합니다.</li></ol></div><div><h4>개선 조치 · 담당 및 재평가</h4><p><b>Retrieval 담당:</b> 질문 확장·후보 수·Category Filter를 고정 평가셋으로 점검합니다.</p><p><b>Reranking 담당:</b> 같은 Candidate Set에서 C3 순위가 개선되는지 재비교합니다.</p><p><b>Agent Platform 담당:</b> Gold 없는 질문의 거절, 출처·권한 검증을 확인합니다.</p><p><b>재평가 기준:</b> 문서/모델 버전을 고정한 상태에서 같은 4건을 반복 실행합니다.</p></div></div><p class="d28-report-mininote">※ 이 보고서는 수업용 합성 Dataset에 적용한 실제 지표 계산과 분석 문장으로 구성된 예시입니다. 실제 금융·의료기관의 평가 결과, 운영 측정, 배포 승인 기록은 아닙니다.</p></article>`;
 }
 const renderers={dataset:renderDataset,target:renderTarget,evaluator:renderEvaluator,report:renderReport};
 function update(){
   const dialog=document.getElementById('d28ArtifactsDialog');
   document.getElementById('d28ArtifactsTitle').textContent=exampleNames[current];
   document.getElementById('d28ArtifactTabs').innerHTML=tabs();
   document.getElementById('d28ArtifactContent').innerHTML=renderers[current]();
   dialog.querySelector('.dialog-body').scrollTop=0;
 }
 function open(id){
   if(!exampleIds.includes(id))return;
   current=id;
   update();
   const dlg=document.getElementById('d28ArtifactsDialog');
   if(!dlg.open){document.querySelectorAll('dialog[open]').forEach(x=>x.close());dlg.showModal();}
 }
 document.addEventListener('click',e=>{
   const t=e.target.closest?.('[data-d28-artifact-open],[data-d28-artifact-tab],[data-d28-domain],[data-d28-code-file],[data-d28-artifact-close],[data-d28-artifact-row]');
   if(!t)return;
   if(t.hasAttribute('data-d28-artifact-close')){document.getElementById('d28ArtifactsDialog').close();return;}
   if(t.hasAttribute('data-d28-domain')){domain=t.dataset.d28Domain;update();return;}
   if(t.hasAttribute('data-d28-code-file')){codeFile=t.dataset.d28CodeFile;update();return;}
   if(t.hasAttribute('data-d28-artifact-tab')){current=t.dataset.d28ArtifactTab;update();return;}
   if(t.hasAttribute('data-d28-artifact-open')){open(t.dataset.d28ArtifactOpen);return;}
   if(t.hasAttribute('data-d28-artifact-row'))open(t.dataset.d28ArtifactRow);
 });
})();
</script>
</body></html>
