ines":["<span class=\"py-keyword\">from</span> hashlib <span class=\"py-keyword\">import</span> sha256","<span class=\"py-keyword\">from</span> pathlib <span class=\"py-keyword\">import</span> Path","ROOT <span class=\"py-keyword\">=</span> Path(__file__)<span class=\"py-keyword\">.</span>resolve()<span class=\"py-keyword\">.</span>parent","path <span class=\"py-keyword\">=</span> ROOT <span class=\"py-keyword\">/</span> <span class=\"py-string\">&quot;data&quot;</span> <span class=\"py-keyword\">/</span> <span class=\"py-string\">&quot;raw&quot;</span> <span class=\"py-keyword\">/</span> <span class=\"py-string\">&quot;assignment.txt&quot;</span>","raw <span class=\"py-keyword\">=</span> path<span class=\"py-keyword\">.</span>read_bytes()","record <span class=\"py-keyword\">=</span> {","    <span class=\"py-string\">&quot;doc_id&quot;</span>: <span class=\"py-string\">&quot;DOC-ASSIGN&quot;</span>,","    <span class=\"py-string\">&quot;source_version&quot;</span>: <span class=\"py-string\">&quot;v1&quot;</span>,","    <span class=\"py-string\">&quot;source_uri&quot;</span>: path<span class=\"py-keyword\">.</span>as_uri(),","    <span class=\"py-string\">&quot;size_bytes&quot;</span>: <span class=\"py-function\">len</span>(raw),","    <span class=\"py-string\">&quot;raw_sha256&quot;</span>: sha256(raw)<span class=\"py-keyword\">.</span>hexdigest(),","    <span class=\"py-string\">&quot;status&quot;</span>: <span class=\"py-string\">&quot;collected&quot;</span>,","}","<span class=\"py-function\">print</span>(record[<span class=\"py-string\">&quot;doc_id&quot;</span>], record[<span class=\"py-string\">&quot;size_bytes&quot;</span>], record[<span class=\"py-string\">&quot;raw_sha256&quot;</span>])"]},"decode":{"title":"TXT의 명시적 UTF-8 디코딩","lang":"python","raw":"from pathlib import Path\nROOT = Path(__file__).resolve().parent\nraw = (ROOT / \"data\" / \"raw\" / \"assignment.txt\").read_bytes()\ntry:\n    text = raw.decode(\"utf-8\")\nexcept UnicodeDecodeError:\n    status, text = \"decode_error\", None\nelse:\n    status = \"parsed\" if text.strip() else \"empty\"\nprint(status)","desc":"errors=\"ignore\"를 사용하지 않습니다. 디코딩 실패와 빈 결과는 다른 상태입니다. 강의용 독립 예제는 이 .py 파일을 mentee/mentor 루트에 둘 때의 경로입니다. 실습 하위 폴더에서는 coursekit.io.DATA를 사용합니다.","independent":true,"html_lines":["<span class=\"py-keyword\">from</span> pathlib <span class=\"py-keyword\">import</span> Path","ROOT <span class=\"py-keyword\">=</span> Path(__file__)<span class=\"py-keyword\">.</span>resolve()<span class=\"py-keyword\">.</span>parent","raw <span class=\"py-keyword\">=</span> (ROOT <span class=\"py-keyword\">/</span> <span class=\"py-string\">&quot;data&quot;</span> <span class=\"py-keyword\">/</span> <span class=\"py-string\">&quot;raw&quot;</span> <span class=\"py-keyword\">/</span> <span class=\"py-string\">&quot;assignment.txt&quot;</span>)<span class=\"py-keyword\">.</span>read_bytes()","<span class=\"py-keyword\">try</span>:","    text <span class=\"py-keyword\">=</span> raw<span class=\"py-keyword\">.</span>decode(<span class=\"py-string\">&quot;utf-8&quot;</span>)","<span class=\"py-keyword\">except</span> UnicodeDecodeError:","    status, text <span class=\"py-keyword\">=</span> <span class=\"py-string\">&quot;decode_error&quot;</span>, <span class=\"py-keyword\">None</span>","<span class=\"py-keyword\">else</span>:","    status <span class=\"py-keyword\">=</span> <span class=\"py-string\">&quot;parsed&quot;</span> <span class=\"py-keyword\">if</span> text<span class=\"py-keyword\">.</span>strip() <span class=\"py-keyword\">else</span> <span class=\"py-string\">&quot;empty&quot;</span>","<span class=\"py-function\">print</span>(status)"]},"html-parse":{"title":"Beautiful Soup · HTML main 추출","lang":"python","raw":"from pathlib import Path\nfrom bs4 import BeautifulSoup\nROOT = Path(__file__).resolve().parent\nhtml_text = (ROOT / \"data\" / \"raw\" / \"facility.html\").read_text(encoding=\"utf-8\")\nsoup = BeautifulSoup(html_text, \"html.parser\")\nmain = soup.select_one(\"main\")\nif main is None:\n    raise ValueError(\"main_not_found\")\nfor tag in main.select(\"script, style\"):\n    tag.decompose()\ntext = main.get_text(\"\\n\", strip=True)\nprint(text)","desc":"문자열만 추출하므로 표의 행·열 보존 여부는 원문과 별도 대조해야 합니다. 강의용 독립 예제는 이 .py 파일을 mentee/mentor 루트에 둘 때의 경로입니다. 실습 하위 폴더에서는 coursekit.io.DATA를 사용합니다.","independent":true,"html_lines":["<span class=\"py-keyword\">from</span> pathlib <span class=\"py-keyword\">import</span> Path","<span class=\"py-keyword\">from</span> bs4 <span class=\"py-keyword\">import</span> BeautifulSoup","ROOT <span class=\"py-keyword\">=</span> Path(__file__)<span class=\"py-keyword\">.</span>resolve()<span class=\"py-keyword\">.</span>parent","html_text <span class=\"py-keyword\">=</span> (ROOT <span class=\"py-keyword\">/</span> <span class=\"py-string\">&quot;data&quot;</span> <span class=\"py-keyword\">/</span> <span class=\"py-string\">&quot;raw&quot;</span> <span class=\"py-keyword\">/</span> <span class=\"py-string\">&quot;facility.html&quot;</span>)<span class=\"py-keyword\">.</span>read_text(encoding<span class=\"py-keyword\">=</span><span class=\"py-string\">&quot;utf-8&quot;</span>)","soup <span class=\"py-keyword\">=</span> BeautifulSoup(html_text, <span class=\"py-string\">&quot;html.parser&quot;</span>)","main <span class=\"py-keyword\">=</span> soup<span class=\"py-keyword\">.</span>select_one(<span class=\"py-string\">&quot;main&quot;</span>)","<span class=\"py-keyword\">if</span> main <span class=\"py-keyword\">is</span> <span class=\"py-keyword\">None</span>:","    <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&quot;main_not_found&quot;</span>)","<span class=\"py-keyword\">for</span> tag <span class=\"py-keyword\">in</span> main<span class=\"py-keyword\">.</span>select(<span class=\"py-string\">&quot;script, style&quot;</span>):","    tag<span class=\"py-keyword\">.</span>decompose()","text <span class=\"py-keyword\">=</span> main<span class=\"py-keyword\">.</span>get_text(<span class=\"py-string\">&quot;\\n&quot;</span>, strip<span class=\"py-keyword\">=True</span>)","<span class=\"py-function\">print</span>(text)"]},"pdf-parse":{"title":"pypdf · 페이지별 추출과 위치 기록","lang":"python","raw":"from pathlib import Path\nfrom pypdf import PdfReader\nROOT = Path(__file__).resolve().parent\npath = ROOT / \"data\" / \"raw\" / \"career.pdf\"\nreader = PdfReader(str(path))\nunits = []\nfor page_number, page in enumerate(reader.pages, start=1):\n    text = page.extract_text() or \"\"\n    units.append({\n        \"doc_id\": \"DOC-CAREER\", \"source_version\": \"v1\",\n        \"unit_id\": f\"page-{page_number}\",\n        \"page_number\": page_number,\n        \"source_locator\": f\"career.pdf#page={page_number}\",\n        \"raw_text\": text,\n    })\nprint([(u[\"unit_id\"], len(u[\"raw_text\"])) for u in units])","desc":"빈 페이지 추출을 무조건 OCR 문서라고 확정하지 않습니다. 강의용 독립 예제는 이 .py 파일을 mentee/mentor 루트에 둘 때의 경로입니다. 실습 하위 폴더에서는 coursekit.io.DATA를 사용합니다.","independent":true,"html_lines":["<span class=\"py-keyword\">from</span> pathlib <span class=\"py-keyword\">import</span> Path","<span class=\"py-keyword\">from</span> pypdf <span class=\"py-keyword\">import</span> PdfReader","ROOT <span class=\"py-keyword\">=</span> Path(__file__)<span class=\"py-keyword\">.</span>resolve()<span class=\"py-keyword\">.</span>parent","path <span class=\"py-keyword\">=</span> ROOT <span class=\"py-keyword\">/</span> <span class=\"py-string\">&quot;data&quot;</span> <span class=\"py-keyword\">/</span> <span class=\"py-string\">&quot;raw&quot;</span> <span class=\"py-keyword\">/</span> <span class=\"py-string\">&quot;career.pdf&quot;</span>","reader <span class=\"py-keyword\">=</span> PdfReader(<span class=\"py-function\">str</span>(path))","units <span class=\"py-keyword\">=</span> []","<span class=\"py-keyword\">for</span> page_number, page <span class=\"py-keyword\">in</span> <span class=\"py-function\">enumerate</span>(reader<span class=\"py-keyword\">.</span>pages, start<span class=\"py-keyword\">=</span><span class=\"py-number\">1</span>):","    text <span class=\"py-keyword\">=</span> page<span class=\"py-keyword\">.</span>extract_text() <span class=\"py-keyword\">or</span> <span class=\"py-string\">&quot;&quot;</span>","    units<span class=\"py-keyword\">.</span>append({","        <span class=\"py-string\">&quot;doc_id&quot;</span>: <span class=\"py-string\">&quot;DOC-CAREER&quot;</span>, <span class=\"py-string\">&quot;source_version&quot;</span>: <span class=\"py-string\">&quot;v1&quot;</span>,","        <span class=\"py-string\">&quot;unit_id&quot;</span>: <span class=\"py-string\">f&quot;page-{</span>page_number<span class=\"py-string\">}&quot;</span>,","        <span class=\"py-string\">&quot;page_number&quot;</span>: page_number,","        <span class=\"py-string\">&quot;source_locator&quot;</span>: <span class=\"py-string\">f&quot;career.pdf#page={</span>page_number<span class=\"py-string\">}&quot;</span>,","        <span class=\"py-string\">&quot;raw_text&quot;</span>: text,","    })","<span class=\"py-function\">print</span>([(u[<span class=\"py-string\">&quot;unit_id&quot;</span>], <span class=\"py-function\">len</span>(u[<span class=\"py-string\">&quot;raw_text&quot;</span>])) <span class=\"py-keyword\">for</span> u <span class=\"py-keyword\">in</span> units])"]},"clean-code":{"title":"일반 본문에만 적용하는 최소 Cleaning","lang":"python","raw":"import re\nimport unicodedata\n\ndef clean_prose(text: str) -> str:\n    text = text.replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\")\n    text = unicodedata.normalize(\"NFC\", text)\n    lines = [re.sub(r\"[ \\t]+\", \" \", line).strip()\n             for line in text.split(\"\\n\")]\n    return \"\\n\".join(lines).strip()\n\nprint(repr(clean_prose(\"출석   안내\\r\\n\\r\\n10분  초과\")))","desc":"표·코드 블록·탭 구분 파일은 별도 Cleaning 정책이 필요합니다.","independent":true,"html_lines":["<span class=\"py-keyword\">import</span> re","<span class=\"py-keyword\">import</span> unicodedata"," ","<span class=\"py-keyword\">def</span> <span class=\"py-function\">clean_prose</span>(text: <span class=\"py-function\">str</span>) <span class=\"py-keyword\">-&gt;</span> <span class=\"py-function\">str</span>:","    text <span class=\"py-keyword\">=</span> text<span class=\"py-keyword\">.</span>replace(<span class=\"py-string\">&quot;\\r\\n&quot;</span>, <span class=\"py-string\">&quot;\\n&quot;</span>)<span class=\"py-keyword\">.</span>replace(<span class=\"py-string\">&quot;\\r&quot;</span>, <span class=\"py-string\">&quot;\\n&quot;</span>)","    text <span class=\"py-keyword\">=</span> unicodedata<span class=\"py-keyword\">.</span>normalize(<span class=\"py-string\">&quot;NFC&quot;</span>, text)","    lines <span class=\"py-keyword\">=</span> [re<span class=\"py-keyword\">.</span>sub(<span class=\"py-string\">r&quot;[ \\t]+&quot;</span>, <span class=\"py-string\">&quot; &quot;</span>, line)<span class=\"py-keyword\">.</span>strip()","             <span class=\"py-keyword\">for</span> line <span class=\"py-keyword\">in</span> text<span class=\"py-keyword\">.</span>split(<span class=\"py-string\">&quot;\\n&quot;</span>)]","    <span class=\"py-keyword\">return</span> <span class=\"py-string\">&quot;\\n&quot;</span><span class=\"py-keyword\">.</span>join(lines)<span class=\"py-keyword\">.</span>strip()"," ","<span class=\"py-function\">print</span>(<span class=\"py-function\">repr</span>(clean_prose(<span class=\"py-string\">&quot;출석   안내\\r\\n\\r\\n10분  초과&quot;</span>)))"]},"clean-record":{"title":"Cleaning 결과·버전·해시 기록","lang":"python","raw":"from hashlib import sha256\n# raw_text는 이미 파싱한 문자열, clean_prose는 앞서 정의한 함수\nclean_text = clean_prose(raw_text)\nclean_record = {\n    \"cleaner_version\": \"clean-v1\",\n    \"clean_text\": clean_text,\n    \"clean_hash\": sha256(clean_text.encode(\"utf-8\")).hexdigest(),\n    \"chars_before\": len(raw_text),\n    \"chars_after\": len(clean_text),\n}\nassert clean_prose(clean_text) == clean_text","desc":"앞 단계의 raw_text와 clean_prose()가 필요합니다. 완전한 독립 실행 코드는 아닙니다.","independent":false,"html_lines":["<span class=\"py-keyword\">from</span> hashlib <span class=\"py-keyword\">import</span> sha256","<span class=\"py-comment\"># raw_text는 이미 파싱한 문자열, clean_prose는 앞서 정의한 함수</span>","clean_text <span class=\"py-keyword\">=</span> clean_prose(raw_text)","clean_record <span class=\"py-keyword\">=</span> {","    <span class=\"py-string\">&quot;cleaner_version&quot;</span>: <span class=\"py-string\">&quot;clean-v1&quot;</span>,","    <span class=\"py-string\">&quot;clean_text&quot;</span>: clean_text,","    <span class=\"py-string\">&quot;clean_hash&quot;</span>: sha256(clean_text<span class=\"py-keyword\">.</span>encode(<span class=\"py-string\">&quot;utf-8&quot;</span>))<span class=\"py-keyword\">.</span>hexdigest(),","    <span class=\"py-string\">&quot;chars_before&quot;</span>: <span class=\"py-function\">len</span>(raw_text),","    <span class=\"py-string\">&quot;chars_after&quot;</span>: <span class=\"py-function\">len</span>(clean_text),","}","<span class=\"py-keyword\">assert</span> clean_prose(clean_text) <span class=\"py-keyword\">==</span> clean_text"]},"windows-code":{"title":"문자 기반 Chunk Generator","lang":"python","raw":"def windows(text: str, size: int, overlap: int):\n    if not (isinstance(size, int) and isinstance(overlap, int)):\n        raise TypeError(\"size and overlap must be integers\")\n    if not (size > 0 and 0 <= overlap < size):\n        raise ValueError(\"invalid chunk window\")\n    start = 0\n    while start < len(text):\n        end = min(start + size, len(text))\n        yield start, end, text[start:end]\n        if end == len(text):\n            break\n        start = end - overlap\n\nprint([(a, b) for a, b, _ in windows(\"a\" * 71, 40, 10)])","desc":"설명용 문자 창입니다. 실제 모델 Token 제한과 의미 보존은 별도 검증합니다.","independent":true,"html_lines":["<span class=\"py-keyword\">def</span> <span class=\"py-function\">windows</span>(text: <span class=\"py-function\">str</span>, size: <span class=\"py-function\">int</span>, overlap: <span class=\"py-function\">int</span>):","    <span class=\"py-keyword\">if</span> <span class=\"py-keyword\">not</span> (<span class=\"py-function\">isinstance</span>(size, <span class=\"py-function\">int</span>) <span class=\"py-keyword\">and</span> <span class=\"py-function\">isinstance</span>(overlap, <span class=\"py-function\">int</span>)):","        <span class=\"py-keyword\">raise</span> TypeError(<span class=\"py-string\">&quot;size and overlap must be integers&quot;</span>)","    <span class=\"py-keyword\">if</span> <span class=\"py-keyword\">not</span> (size <span class=\"py-keyword\">&gt;</span> <span class=\"py-number\">0</span> <span class=\"py-keyword\">and</span> <span class=\"py-number\">0</span> <span class=\"py-keyword\">&lt;=</span> overlap <span class=\"py-keyword\">&lt;</span> size):","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&quot;invalid chunk window&quot;</span>)","    start <span class=\"py-keyword\">=</span> <span class=\"py-number\">0</span>","    <span class=\"py-keyword\">while</span> start <span class=\"py-keyword\">&lt;</span> <span class=\"py-function\">len</span>(text):","        end <span class=\"py-keyword\">=</span> <span class=\"py-function\">min</span>(start <span class=\"py-keyword\">+</span> size, <span class=\"py-function\">len</span>(text))","        <span class=\"py-keyword\">yield</span> start, end, text[start:end]","        <span class=\"py-keyword\">if</span> end <span class=\"py-keyword\">==</span> <span class=\"py-function\">len</span>(text):","            <span class=\"py-keyword\">break</span>","        start <span class=\"py-keyword\">=</span> end <span class=\"py-keyword\">-</span> overlap"," ","<span class=\"py-function\">print</span>([(a, b) <span class=\"py-keyword\">for</span> a, b, _ <span class=\"py-keyword\">in</span> windows(<span class=\"py-string\">&quot;a&quot;</span> <span class=\"py-keyword\">*</span> <span class=\"py-number\">71</span>, <span class=\"py-number\">40</span>, <span class=\"py-number\">10</span>)])"]},"e5-length":{"title":"E5 Tokenizer로 최종 Embedding 입력 검사","lang":"python","raw":"from sentence_transformers import SentenceTransformer\nmodel_id = \"intfloat/multilingual-e5-small\"\nmodel = SentenceTransformer(model_id, device=\"cpu\")\nchunk_text = \"10분을 초과하면 결석으로 기록합니다.\"\nembedding_text = \"passage: \" + chunk_text\nids = model.tokenizer(\n    embedding_text, add_special_tokens=True,\n    truncation=False,\n)[\"input_ids\"]\nlimit = model.max_seq_length\nprint(\"토큰 수:\", len(ids), \"모델 입력 한도:\", limit)\nif len(ids) > limit:\n    raise ValueError(\"rechunk_required\")","desc":"모델 다운로드가 필요합니다. 512는 모델 기본 한도이지만 실제 model.max_seq_length와 Tokenizer 설정을 확인합니다.","independent":true,"html_lines":["<span class=\"py-keyword\">from</span> sentence_transformers <span class=\"py-keyword\">import</span> SentenceTransformer","model_id <span class=\"py-keyword\">=</span> <span class=\"py-string\">&quot;intfloat/multilingual-e5-small&quot;</span>","model <span class=\"py-keyword\">=</span> SentenceTransformer(model_id, device<span class=\"py-keyword\">=</span><span class=\"py-string\">&quot;cpu&quot;</span>)","chunk_text <span class=\"py-keyword\">=</span> <span class=\"py-string\">&quot;10분을 초과하면 결석으로 기록합니다.&quot;</span>","embedding_text <span class=\"py-keyword\">=</span> <span class=\"py-string\">&quot;passage: &quot;</span> <span class=\"py-keyword\">+</span> chunk_text","ids <span class=\"py-keyword\">=</span> model<span class=\"py-keyword\">.</span>tokenizer(","    embedding_text, add_special_tokens<span class=\"py-keyword\">=True</span>,","    truncation<span class=\"py-keyword\">=False</span>,",")[<span class=\"py-string\">&quot;input_ids&quot;</span>]","limit <span class=\"py-keyword\">=</span> model<span class=\"py-keyword\">.</span>max_seq_length","<span class=\"py-function\">print</span>(<span class=\"py-string\">&quot;토큰 수:&quot;</span>, <span class=\"py-function\">len</span>(ids), <span class=\"py-string\">&quot;모델 입력 한도:&quot;</span>, limit)","<span class=\"py-keyword\">if</span> <span class=\"py-function\">len</span>(ids) <span class=\"py-keyword\">&gt;</span> limit:","    <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&quot;rechunk_required&quot;</span>)"]},"span-code":{"title":"중간 Span(text)의 Offset과 문자열 일치 검사","lang":"python","raw":"def validate_span(span: dict, clean_text: str) -> None:\n    # 중간 Character Window: {char_start, char_end, text}\n    a, b = span[\"char_start\"], span[\"char_end\"]\n    if type(a) is not int or type(b) is not int:\n        raise ValueError(\"invalid span\")\n    if not 0 <= a < b <= len(clean_text):\n        raise ValueError(\"invalid span\")\n    if span[\"text\"] != clean_text[a:b]:\n        raise ValueError(\"span mismatch\")\n    if not span[\"text\"].strip():\n        raise ValueError(\"empty chunk\")\n\n# build_chunk()가 검증된 span['text']를 최종 chunk['body']로 복사합니다.","desc":"coursekit.processing.validate_span()의 계약입니다. Span의 text는 분할 중간 결과이며 최종 Chunk는 body·embedding_text를 사용합니다.","independent":true,"html_lines":["<span class=\"py-keyword\">def</span> <span class=\"py-function\">validate_span</span>(span: <span class=\"py-type\">dict</span>, clean_text: <span class=\"py-type\">str</span>) -&gt; <span class=\"py-keyword\">None</span>:","    <span class=\"py-comment\"># 중간 Character Window: {char_start, char_end, text}</span>","    a, b = span[<span class=\"py-string\">&quot;</span><span class=\"py-string\">char_start</span><span class=\"py-string\">&quot;</span>], span[<span class=\"py-string\">&quot;</span><span class=\"py-string\">char_end</span><span class=\"py-string\">&quot;</span>]","    <span class=\"py-keyword\">if</span> <span class=\"py-type\">type</span>(a) is not <span class=\"py-type\">int</span> or <span class=\"py-type\">type</span>(b) is not <span class=\"py-type\">int</span>:","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&quot;</span><span class=\"py-string\">invalid span</span><span class=\"py-string\">&quot;</span>)","    <span class=\"py-keyword\">if</span> not <span class=\"py-number\">0</span> &lt;= a &lt; b &lt;= <span class=\"py-type\">len</span>(clean_text):","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&quot;</span><span class=\"py-string\">invalid span</span><span class=\"py-string\">&quot;</span>)","    <span class=\"py-keyword\">if</span> span[<span class=\"py-string\">&quot;</span><span class=\"py-string\">text</span><span class=\"py-string\">&quot;</span>] != clean_text[a:b]:","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&quot;</span><span class=\"py-string\">span mismatch</span><span class=\"py-string\">&quot;</span>)","    <span class=\"py-keyword\">if</span> not span[<span class=\"py-string\">&quot;</span><span class=\"py-string\">text</span><span class=\"py-string\">&quot;</span>].strip():","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&quot;</span><span class=\"py-string\">empty chunk</span><span class=\"py-string\">&quot;</span>)","","<span class=\"py-comment\"># build_chunk()가 검증된 span[&#x27;text&#x27;]를 최종 chunk[&#x27;body&#x27;]로 복사합니다.</span>"]},"coverage-code":{"title":"구간 병합으로 Coverage 계산","lang":"python","raw":"def coverage(length: int, spans: list[tuple[int, int]]):\n    if length == 0:\n        return None\n    if length < 0:\n        raise ValueError(\"invalid_length\")\n    merged = []\n    for start, end in sorted(spans):\n        if not (0 <= start < end <= length):\n            raise ValueError(\"invalid_span\")\n        if merged and start <= merged[-1][1]:\n            merged[-1] = (merged[-1][0], max(merged[-1][1], end))\n        else:\n            merged.append((start, end))\n    covered = sum(end - start for start, end in merged)\n    return covered / length\n\nprint(coverage(20, [(0, 8), (6, 14), (12, 20)]))","desc":"전체 본문 길이만 계산합니다. 파싱에서 누락된 내용은 이 지표로 잡을 수 없습니다.","independent":true,"html_lines":["<span class=\"py-keyword\">def</span> <span class=\"py-function\">coverage</span>(length: <span class=\"py-function\">int</span>, spans: <span class=\"py-function\">list</span>[<span class=\"py-function\">tuple</span>[<span class=\"py-function\">int</span>, <span class=\"py-function\">int</span>]]):","    <span class=\"py-keyword\">if</span> length <span class=\"py-keyword\">==</span> <span class=\"py-number\">0</span>:","        <span class=\"py-keyword\">return</span> <span class=\"py-keyword\">None</span>","    <span class=\"py-keyword\">if</span> length <span class=\"py-keyword\">&lt;</span> <span class=\"py-number\">0</span>:","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&quot;invalid_length&quot;</span>)","    merged <span class=\"py-keyword\">=</span> []","    <span class=\"py-keyword\">for</span> start, end <span class=\"py-keyword\">in</span> <span class=\"py-function\">sorted</span>(spans):","        <span class=\"py-keyword\">if</span> <span class=\"py-keyword\">not</span> (<span class=\"py-number\">0</span> <span class=\"py-keyword\">&lt;=</span> start <span class=\"py-keyword\">&lt;</span> end <span class=\"py-keyword\">&lt;=</span> length):","            <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&quot;invalid_span&quot;</span>)","        <span class=\"py-keyword\">if</span> merged <span class=\"py-keyword\">and</span> start <span class=\"py-keyword\">&lt;=</span> merged[<span class=\"py-keyword\">-</span><span class=\"py-number\">1</span>][<span class=\"py-number\">1</span>]:","            merged[<span class=\"py-keyword\">-</span><span class=\"py-number\">1</span>] <span class=\"py-keyword\">=</span> (merged[<span class=\"py-keyword\">-</span><span class=\"py-number\">1</span>][<span class=\"py-number\">0</span>], <span class=\"py-function\">max</span>(merged[<span class=\"py-keyword\">-</span><span class=\"py-number\">1</span>][<span class=\"py-number\">1</span>], end))","        <span class=\"py-keyword\">else</span>:","            merged<span class=\"py-keyword\">.</span>append((start, end))","    covered <span class=\"py-keyword\">=</span> <span class=\"py-function\">sum</span>(end <span class=\"py-keyword\">-</span> start <span class=\"py-keyword\">for</span> start, end <span class=\"py-keyword\">in</span> merged)","    <span class=\"py-keyword\">return</span> covered <span class=\"py-keyword\">/</span> length"," ","<span class=\"py-function\">print</span>(coverage(<span class=\"py-number\">20</span>, [(<span class=\"py-number\">0</span>, <span class=\"py-number\">8</span>), (<span class=\"py-number\">6</span>, <span class=\"py-number\">14</span>), (<span class=\"py-number\">12</span>, <span class=\"py-number\">20</span>)]))"]},"validate-all":{"title":"검증 결과를 별도 오류로 기록하는 골격","lang":"python","raw":"# clean_units: (doc_id, source_version, unit_id) -> clean_text\n# chunks: 최종 Chunk (body / embedding_text 보유)\nerrors, passed = [], []\nfor chunk in chunks:\n    key = (chunk[\"doc_id\"], chunk[\"source_version\"], chunk[\"unit_id\"])\n    clean_text = clean_units.get(key)\n    if clean_text is None:\n        errors.append((chunk[\"chunk_id\"], \"missing_source\"))\n        continue\n    span = {\"char_start\": chunk[\"char_start\"],\n            \"char_end\": chunk[\"char_end\"], \"text\": chunk[\"body\"]}\n    try:\n        validate_span(span, clean_text)  # 앞 페이지에서 정의\n    except (ValueError, TypeError) as exc:\n        errors.append((chunk[\"chunk_id\"], str(exc)))\n    else:\n        passed.append(chunk)\nprint(\"passed:\", len(passed), \"quarantined:\", len(errors))","desc":"최종 Chunk에는 text 키가 없습니다. body를 중간 Span의 text로 명시적으로 연결해 검증합니다. 추가로 Coverage·Token·중복을 검사합니다.","independent":false,"html_lines":["<span class=\"py-comment\"># clean_units: (doc_id, source_version, unit_id) -&gt; clean_text</span>","<span class=\"py-comment\"># chunks: 최종 Chunk (body / embedding_text 보유)</span>","errors, passed = [], []","<span class=\"py-keyword\">for</span> chunk in chunks:","    key = (chunk[<span class=\"py-string\">&quot;</span><span class=\"py-string\">doc_id</span><span class=\"py-string\">&quot;</span>], chunk[<span class=\"py-string\">&quot;</span><span class=\"py-string\">source_version</span><span class=\"py-string\">&quot;</span>], chunk[<span class=\"py-string\">&quot;</span><span class=\"py-string\">unit_id</span><span class=\"py-string\">&quot;</span>])","    clean_text = clean_units.get(key)","    <span class=\"py-keyword\">if</span> clean_text is <span class=\"py-keyword\">None</span>:","        errors.append((chunk[<span class=\"py-string\">&quot;</span><span class=\"py-string\">chunk_id</span><span class=\"py-string\">&quot;</span>], <span class=\"py-string\">&quot;</span><span class=\"py-string\">missing_source</span><span class=\"py-string\">&quot;</span>))","        <span class=\"py-keyword\">continue</span>","    span = {<span class=\"py-string\">&quot;</span><span class=\"py-string\">char_start</span><span class=\"py-string\">&quot;</span>: chunk[<span class=\"py-string\">&quot;</span><span class=\"py-string\">char_start</span><span class=\"py-string\">&quot;</span>],","            <span class=\"py-string\">&quot;</span><span class=\"py-string\">char_end</span><span class=\"py-string\">&quot;</span>: chunk[<span class=\"py-string\">&quot;</span><span class=\"py-string\">char_end</span><span class=\"py-string\">&quot;</span>], <span class=\"py-string\">&quot;</span><span class=\"py-string\">text</span><span class=\"py-string\">&quot;</span>: chunk[<span class=\"py-string\">&quot;</span><span class=\"py-string\">body</span><span class=\"py-string\">&quot;</span>]}","    <span class=\"py-keyword\">try</span>:","        validate_span(span, clean_text)  <span class=\"py-comment\"># 앞 페이지에서 정의</span>","    <span class=\"py-keyword\">except</span> (ValueError, TypeError) <span class=\"py-keyword\">as</span> exc:","        errors.append((chunk[<span class=\"py-string\">&quot;</span><span class=\"py-string\">chunk_id</span><span class=\"py-string\">&quot;</span>], <span class=\"py-type\">str</span>(exc)))","    <span class=\"py-keyword\">else</span>:","        passed.append(chunk)","<span class=\"py-type\">print</span>(<span class=\"py-string\">&quot;</span><span class=\"py-string\">passed:</span><span class=\"py-string\">&quot;</span>, <span class=\"py-type\">len</span>(passed), <span class=\"py-string\">&quot;</span><span class=\"py-string\">quarantined:</span><span class=\"py-string\">&quot;</span>, <span class=\"py-type\">len</span>(errors))"]},"metadata-record":{"title":"청크별 출처·버전·위치 Metadata","lang":"python","raw":"metadata = {\n    \"doc_id\": \"DOC-ATTEND\",\n    \"source_version\": \"v1\",\n    \"pipeline_version\": \"ingest-e5-v1\",\n    \"unit_id\": \"sec-1\",\n    \"source_locator\": \"attendance.md#지각-결석\",\n    \"category\": \"학사\",\n    \"page_number\": None,        # Markdown에는 페이지 개념이 없음\n    \"char_start\": 0,\n    \"char_end\": 40,\n}\n# char_end는 Python 문자열 Slice의 제외 끝점입니다.\n# 중간 span[\"text\"]가 최종 chunk[\"body\"]가 됩니다.\n# E5 입력은 chunk[\"embedding_text\"] = \"passage: \" + chunk[\"body\"]입니다.","desc":"이 Metadata는 교육용 필드 예제이며 실제 Span 40자를 보증하는 관측값이 아닙니다.","independent":true,"html_lines":["metadata = {","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">doc_id</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">DOC-ATTEND</span><span class=\"py-string\">&quot;</span>,","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">source_version</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">v1</span><span class=\"py-string\">&quot;</span>,","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">pipeline_version</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">ingest-e5-v1</span><span class=\"py-string\">&quot;</span>,","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">unit_id</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">sec-1</span><span class=\"py-string\">&quot;</span>,","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">source_locator</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">attendance.md#지각-결석</span><span class=\"py-string\">&quot;</span>,","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">category</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">학사</span><span class=\"py-string\">&quot;</span>,","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">page_number</span><span class=\"py-string\">&quot;</span>: <span class=\"py-keyword\">None</span>,        <span class=\"py-comment\"># Markdown에는 페이지 개념이 없음</span>","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">char_start</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">0</span>,","    <span class=\"py-string\">&quot;</span><span class=\"py-string\">char_end</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">40</span>,","}","<span class=\"py-comment\"># char_end는 Python 문자열 Slice의 제외 끝점입니다.</span>","<span class=\"py-comment\"># 중간 span[&quot;text&quot;]가 최종 chunk[&quot;body&quot;]가 됩니다.</span>","<span class=\"py-comment\"># E5 입력은 chunk[&quot;embedding_text&quot;] = &quot;passage: &quot; + chunk[&quot;body&quot;]입니다.</span>"]},"chunk-id":{"title":"버전·처리 조건·위치를 묶은 결정적 ID","lang":"python","raw":"import hashlib\nimport json\n\ndef stable_chunk_id(doc, unit_id, pipeline_version, start, end):\n    identity = {\n        \"doc_id\": doc[\"doc_id\"],\n        \"source_version\": doc[\"source_version\"],\n        \"pipeline_version\": pipeline_version,\n        \"unit_id\": unit_id,\n        \"span\": [start, end],\n    }\n    payload = json.dumps(\n        identity, sort_keys=True, separators=(\",\", \":\"),\n        ensure_ascii=False,\n    ).encode(\"utf-8\")\n    return hashlib.sha256(payload).hexdigest()\n\ndoc = {\"doc_id\": \"DOC-ATTEND\", \"source_version\": \"v1\"}\nprint(stable_chunk_id(doc, \"sec-1\", \"ingest-e5-v1\", 0, 40))","desc":"실습 coursekit.processing.stable_chunk_id()와 동일한 필드·순서·직렬화 옵션입니다. chunk_index는 입력에 포함하지 않습니다. Span 0~40은 설명용 위치입니다.","independent":true,"html_lines":["<span class=\"py-keyword\">import</span> hashlib","<span class=\"py-keyword\">import</span> json","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">stable_chunk_id</span>(doc, unit_id, pipeline_version, start, end):","    identity = {","        <span class=\"py-string\">&quot;</span><span class=\"py-string\">doc_id</span><span class=\"py-string\">&quot;</span>: doc[<span class=\"py-string\">&quot;</span><span class=\"py-string\">doc_id</span><span class=\"py-string\">&quot;</span>],","        <span class=\"py-string\">&quot;</span><span class=\"py-string\">source_version</span><span class=\"py-string\">&quot;</span>: doc[<span class=\"py-string\">&quot;</span><span class=\"py-string\">source_version</span><span class=\"py-string\">&quot;</span>],","        <span class=\"py-string\">&quot;</span><span class=\"py-string\">pipeline_version</span><span class=\"py-string\">&quot;</span>: pipeline_version,","        <span class=\"py-string\">&quot;</span><span class=\"py-string\">unit_id</span><span class=\"py-string\">&quot;</span>: unit_id,","        <span class=\"py-string\">&quot;</span><span class=\"py-string\">span</span><span class=\"py-string\">&quot;</span>: [start, end],","    }","    payload = json.dumps(","        identity, sort_keys=<span class=\"py-keyword\">True</span>, separators=(<span class=\"py-string\">&quot;</span><span class=\"py-string\">,</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">:</span><span class=\"py-string\">&quot;</span>),","        ensure_ascii=<span class=\"py-keyword\">False</span>,","    ).encode(<span class=\"py-string\">&quot;</span><span class=\"py-string\">utf-8</span><span class=\"py-string\">&quot;</span>)","    <span class=\"py-keyword\">return</span> hashlib.sha256(payload).hexdigest()","","doc = {<span class=\"py-string\">&quot;</span><span class=\"py-string\">doc_id</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">DOC-ATTEND</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">source_version</span><span class=\"py-string\">&quot;</span>: <span class=\"py-string\">&quot;</span><span class=\"py-string\">v1</span><span class=\"py-string\">&quot;</span>}","<span class=\"py-type\">print</span>(stable_chunk_id(doc, <span class=\"py-string\">&quot;</span><span class=\"py-string\">sec-1</span><span class=\"py-string\">&quot;</span>, <span class=\"py-string\">&quot;</span><span class=\"py-string\">ingest-e5-v1</span><span class=\"py-string\">&quot;</span>, <span class=\"py-number\">0</span>, <span class=\"py-number\">40</span>))"]},"filtered-sql":{"title":"현재 공개 버전의 Metadata Filter + Top-k","lang":"sql","raw":"-- Psycopg 파라미터 자리: (query_vector, category, query_vector, k)\n-- 실제 연결은 coursekit.db.use_schema()로 전용 Schema를 선택합니다.\nSELECT c.citation_id, c.chunk_id, c.body, c.source_locator,\n       c.doc_id, c.source_version,\n       c.embedding <=> %s AS cosine_distance\nFROM ingest_chunks AS c\nJOIN ingest_documents AS d ON d.doc_id = c.doc_id\nJOIN ingest_versions AS v\n  ON v.doc_id = c.doc_id\n AND v.source_version = c.source_version\n AND v.pipeline_version = c.pipeline_version\nWHERE c.source_version = d.current_version\n  AND c.pipeline_version = d.current_pipeline_version\n  AND v.status = 'ready'\n  AND c.category = %s\nORDER BY c.embedding <=> %s ASC, c.chunk_id ASC\nLIMIT %s;","desc":"실습 coursekit.db.search_current()의 실제 검색 조건과 동일합니다. %s는 Psycopg 파라미터이며 pgAdmin에 이 형태로 바로 실행하지 않습니다.","independent":false,"html_lines":["<span class=\"py-comment\">-- Psycopg 파라미터 자리: (query_vector, category, query_vector, k)</span>","<span class=\"py-comment\">-- 실제 연결은 coursekit.db.use_schema()로 전용 Schema를 선택합니다.</span>","<span class=\"py-keyword\">SELECT</span> <span class=\"py-keyword\">c</span>.citation_id, <span class=\"py-keyword\">c</span>.chunk_id, <span class=\"py-keyword\">c</span>.body, <span class=\"py-keyword\">c</span>.source_locator,","       <span class=\"py-keyword\">c</span>.doc_id, <span class=\"py-keyword\">c</span>.source_version,","       <span class=\"py-keyword\">c</span>.embedding &lt;=&gt; %s <span class=\"py-keyword\">AS</span> cosine_distance","<span class=\"py-keyword\">FROM</span> ingest_chunks <span class=\"py-keyword\">AS</span> <span class=\"py-keyword\">c</span>","<span class=\"py-keyword\">JOIN</span> ingest_documents <span class=\"py-keyword\">AS</span> d <span class=\"py-keyword\">ON</span> d.doc_id = <span class=\"py-keyword\">c</span>.doc_id","<span class=\"py-keyword\">JOIN</span> ingest_versions <span class=\"py-keyword\">AS</span> v","  <span class=\"py-keyword\">ON</span> v.doc_id = <span class=\"py-keyword\">c</span>.doc_id"," <span class=\"py-keyword\">AND</span> v.source_version = <span class=\"py-keyword\">c</span>.source_version"," <span class=\"py-keyword\">AND</span> v.pipeline_version = <span class=\"py-keyword\">c</span>.pipeline_version","<span class=\"py-keyword\">WHERE</span> <span class=\"py-keyword\">c</span>.source_version = d.current_version","  <span class=\"py-keyword\">AND</span> <span class=\"py-keyword\">c</span>.pipeline_version = d.current_pipeline_version","  <span class=\"py-keyword\">AND</span> v.status = <span class=\"py-string\">&#x27;ready&#x27;</span>","  <span class=\"py-keyword\">AND</span> <span class=\"py-keyword\">c</span>.category = %s","<span class=\"py-keyword\">ORDER</span> <span class=\"py-keyword\">BY</span> <span class=\"py-keyword\">c</span>.embedding &lt;=&gt; %s <span class=\"py-keyword\">ASC</span>, <span class=\"py-keyword\">c</span>.chunk_id <span class=\"py-keyword\">ASC</span>","<span class=\"py-keyword\">LIMIT</span> %s;"]},"sql-schema":{"title":"Day24용 신규 문서·버전·청크 DB 스키마","lang":"sql","raw":"-- 실습 DB 구조 설명용: 전용 Schema가 이미 선택된 상태의 DDL입니다.\n-- 실행 준비(Git Bash): python tools/setup_db.py --apply\n-- 생성 대상: d24_basic07 / d24_inter07 / d24_adv07 / d24_adv08\n-- 선택한 PostgreSQL DB에 pgvector 확장이 활성화되어 있어야 합니다.\nCREATE TABLE IF NOT EXISTS ingest_documents (\n  doc_id text PRIMARY KEY,\n  source_uri text NOT NULL,\n  current_version text,\n  current_pipeline_version text\n);\nCREATE TABLE IF NOT EXISTS ingest_versions (\n  doc_id text NOT NULL REFERENCES ingest_documents(doc_id),\n  source_version text NOT NULL,\n  pipeline_version text NOT NULL,\n  status text NOT NULL CHECK(status IN ('staging','ready','failed')),\n  expected_count integer NOT NULL CHECK(expected_count >= 1),\n  PRIMARY KEY (doc_id, source_version, pipeline_version)\n);\nCREATE TABLE IF NOT EXISTS ingest_chunks (\n  citation_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  chunk_id text NOT NULL UNIQUE,\n  doc_id text NOT NULL,\n  source_version text NOT NULL,\n  pipeline_version text NOT NULL,\n  unit_id text NOT NULL,\n  category text NOT NULL,\n  source_locator text NOT NULL,\n  char_start integer NOT NULL,\n  char_end integer NOT NULL,\n  body text NOT NULL CHECK(length(body) > 0),\n  embedding vector(384) NOT NULL,\n  metadata jsonb NOT NULL,\n  CHECK (char_start >= 0 AND char_end > char_start),\n  FOREIGN KEY (doc_id, source_version, pipeline_version)\n    REFERENCES ingest_versions(doc_id, source_version, pipeline_version)\n);\nCREATE INDEX IF NOT EXISTS ingest_chunks_category_idx ON ingest_chunks(category);","desc":"실습의 coursekit.db.SCHEMA_SQL과 같은 DDL입니다. 기존 public 스키마에 별도 테이블을 만들지 말고, Git Bash에서 tools/setup_db.py --apply로 4개 전용 Schema를 준비합니다.","independent":false,"html_lines":["<span class=\"py-comment\">-- 실습 DB 구조 설명용: 전용 Schema가 이미 선택된 상태의 DDL입니다.</span>","<span class=\"py-comment\">-- 실행 준비(Git Bash): python tools/setup_db.py --apply</span>","<span class=\"py-comment\">-- 생성 대상: d24_basic07 / d24_inter07 / d24_adv07 / d24_adv08</span>","<span class=\"py-comment\">-- 선택한 PostgreSQL DB에 pgvector 확장이 활성화되어 있어야 합니다.</span>","<span class=\"py-keyword\">CREATE</span> <span class=\"py-keyword\">TABLE</span> <span class=\"py-keyword\">IF</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">EXISTS</span> ingest_documents (","  doc_id <span class=\"py-type\">text</span> <span class=\"py-keyword\">PRIMARY</span> <span class=\"py-keyword\">KEY</span>,","  source_uri <span class=\"py-type\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  current_version <span class=\"py-type\">text</span>,","  current_pipeline_version <span class=\"py-type\">text</span>",");","<span class=\"py-keyword\">CREATE</span> <span class=\"py-keyword\">TABLE</span> <span class=\"py-keyword\">IF</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">EXISTS</span> ingest_versions (","  doc_id <span class=\"py-type\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span> <span class=\"py-keyword\">REFERENCES</span> ingest_documents(doc_id),","  source_version <span class=\"py-type\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  pipeline_version <span class=\"py-type\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  status <span class=\"py-type\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span> <span class=\"py-keyword\">CHECK</span>(status <span class=\"py-keyword\">IN</span> (<span class=\"py-string\">&#x27;staging&#x27;</span>,<span class=\"py-string\">&#x27;ready&#x27;</span>,<span class=\"py-string\">&#x27;failed&#x27;</span>)),","  expected_count <span class=\"py-type\">integer</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span> <span class=\"py-keyword\">CHECK</span>(expected_count &gt;= <span class=\"py-number\">1</span>),","  <span class=\"py-keyword\">PRIMARY</span> <span class=\"py-keyword\">KEY</span> (doc_id, source_version, pipeline_version)",");","<span class=\"py-keyword\">CREATE</span> <span class=\"py-keyword\">TABLE</span> <span class=\"py-keyword\">IF</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">EXISTS</span> ingest_chunks (","  citation_id <span class=\"py-type\">bigint</span> <span class=\"py-keyword\">GENERATED</span> ALWAYS <span class=\"py-keyword\">AS</span> <span class=\"py-keyword\">IDENTITY</span> <span class=\"py-keyword\">PRIMARY</span> <span class=\"py-keyword\">KEY</span>,","  chunk_id <span class=\"py-type\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span> <span class=\"py-keyword\">UNIQUE</span>,","  doc_id <span class=\"py-type\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  source_version <span class=\"py-type\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  pipeline_version <span class=\"py-type\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  unit_id <span class=\"py-type\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  category <span class=\"py-type\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  source_locator <span class=\"py-type\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  char_start <span class=\"py-type\">integer</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  char_end <span class=\"py-type\">integer</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  body <span class=\"py-type\">text</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span> <span class=\"py-keyword\">CHECK</span>(<span class=\"py-keyword\">length</span>(body) &gt; <span class=\"py-number\">0</span>),","  embedding vector(<span class=\"py-number\">384</span>) <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  metadata jsonb <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">NULL</span>,","  <span class=\"py-keyword\">CHECK</span> (char_start &gt;= <span class=\"py-number\">0</span> <span class=\"py-keyword\">AND</span> char_end &gt; char_start),","  <span class=\"py-keyword\">FOREIGN</span> <span class=\"py-keyword\">KEY</span> (doc_id, source_version, pipeline_version)","    <span class=\"py-keyword\">REFERENCES</span> ingest_versions(doc_id, source_version, pipeline_version)",");","<span class=\"py-keyword\">CREATE</span> <span class=\"py-keyword\">INDEX</span> <span class=\"py-keyword\">IF</span> <span class=\"py-keyword\">NOT</span> <span class=\"py-keyword\">EXISTS</span> ingest_chunks_category_idx <span class=\"py-keyword\">ON</span> ingest_chunks(category);"]},"embed-and-save":{"title":"E5 passage Embedding과 벡터 검사","lang":"python","raw":"import numpy as np\n# model: intfloat/multilingual-e5-small (이미 한 번 로드됨)\n# chunks: body/embedding_text가 있는 검증 통과 최종 Chunk\ntexts = [c[\"embedding_text\"] for c in chunks]\nif any(not t.startswith(\"passage: \") for t in texts):\n    raise ValueError(\"missing E5 passage prefix\")\nif any(len(model.tokenizer(t, add_special_tokens=True,\n                           truncation=False)[\"input_ids\"]) > model.max_seq_length\n       for t in texts):\n    raise ValueError(\"rechunk required\")\nvectors = model.encode(texts, batch_size=8,\n    normalize_embeddings=True, convert_to_numpy=True)\nif vectors.shape != (len(chunks), 384):\n    raise ValueError(\"shape_mismatch\")\nif not np.isfinite(vectors).all():\n    raise ValueError(\"non_finite\")\nif not np.allclose(np.linalg.norm(vectors, axis=1), 1.0,\n                   rtol=0, atol=1e-5):\n    raise ValueError(\"normalization_mismatch\")\nrows = list(zip(chunks, vectors, strict=True))","desc":"최종 Chunk의 embedding_text는 coursekit.processing.build_chunk()가 생성한 passage: + body입니다. 실습의 encode_passages()처럼 Token 길이·384차원·유한값·Normalize를 검증합니다.","independent":false,"html_lines":["<span class=\"py-keyword\">import</span> numpy <span class=\"py-keyword\">as</span> np","<span class=\"py-comment\"># model: intfloat/multilingual-e5-small (이미 한 번 로드됨)</span>","<span class=\"py-comment\"># chunks: body/embedding_text가 있는 검증 통과 최종 Chunk</span>","texts = [c[<span class=\"py-string\">&quot;</span><span class=\"py-string\">embedding_text</span><span class=\"py-string\">&quot;</span>] <span class=\"py-keyword\">for</span> c in chunks]","<span class=\"py-keyword\">if</span> <span class=\"py-type\">any</span>(not t.startswith(<span class=\"py-string\">&quot;</span><span class=\"py-string\">passage: </span><span class=\"py-string\">&quot;</span>) <span class=\"py-keyword\">for</span> t in texts):","    <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&quot;</span><span class=\"py-string\">missing E5 passage prefix</span><span class=\"py-string\">&quot;</span>)","<span class=\"py-keyword\">if</span> <span class=\"py-type\">any</span>(<span class=\"py-type\">len</span>(model.tokenizer(t, add_special_tokens=<span class=\"py-keyword\">True</span>,","                           truncation=<span class=\"py-keyword\">False</span>)[<span class=\"py-string\">&quot;</span><span class=\"py-string\">input_ids</span><span class=\"py-string\">&quot;</span>]) &gt; model.max_seq_length","       <span class=\"py-keyword\">for</span> t in texts):","    <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&quot;</span><span class=\"py-string\">rechunk required</span><span class=\"py-string\">&quot;</span>)","vectors = model.encode(texts, batch_size=<span class=\"py-number\">8</span>,","    normalize_embeddings=<span class=\"py-keyword\">True</span>, convert_to_numpy=<span class=\"py-keyword\">True</span>)","<span class=\"py-keyword\">if</span> vectors.shape != (<span class=\"py-type\">len</span>(chunks), <span class=\"py-number\">384</span>):","    <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&quot;</span><span class=\"py-string\">shape_mismatch</span><span class=\"py-string\">&quot;</span>)","<span class=\"py-keyword\">if</span> not np.isfinite(vectors).all():","    <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&quot;</span><span class=\"py-string\">non_finite</span><span class=\"py-string\">&quot;</span>)","<span class=\"py-keyword\">if</span> not np.allclose(np.linalg.norm(vectors, axis=<span class=\"py-number\">1</span>), <span class=\"py-number\">1.0</span>,","                   rtol=<span class=\"py-number\">0</span>, atol=<span class=\"py-number\">1e-5</span>):","    <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&quot;</span><span class=\"py-string\">normalization_mismatch</span><span class=\"py-string\">&quot;</span>)","rows = <span class=\"py-type\">list</span>(<span class=\"py-type\">zip</span>(chunks, vectors, strict=<span class=\"py-keyword\">True</span>))"]},"sql-publish":{"title":"완전 적재 검증 → ready → 공개 포인터 전환","lang":"python","raw":"from coursekit.db import publish_version\n\n# conn: 전용 Schema를 선택한 Psycopg 연결(autocommit=True)\n# 새 버전의 Chunk·Embedding은 이미 Staging 완료 상태입니다.\nwith conn.transaction():\n    publish_version(conn, doc_id, source_version, pipeline_version)\n\n# 내부 과정:\n# 1) SELECT ... FOR UPDATE로 version 행 잠금\n# 2) expected_count와 실제 Chunk 수 비교\n# 3) ingest_versions.status = 'ready'\n# 4) ingest_documents의 current_version/파이프라인 포인터 변경\n# 도중 실패하면 ROLLBACK → 기존 공개 포인터 유지","desc":"coursekit.db.publish_version()을 한 Transaction 안에서 호출하는 실제 실습 계약입니다. ready 표시만으로는 공개되지 않으며 공개 포인터 변경까지 검증합니다.","independent":false,"html_lines":["<span class=\"py-keyword\">from</span> coursekit.db <span class=\"py-keyword\">import</span> publish_version","","<span class=\"py-comment\"># conn: 전용 Schema를 선택한 Psycopg 연결(autocommit=True)</span>","<span class=\"py-comment\"># 새 버전의 Chunk·Embedding은 이미 Staging 완료 상태입니다.</span>","<span class=\"py-keyword\">with</span> conn.transaction():","    publish_version(conn, doc_id, source_version, pipeline_version)","","<span class=\"py-comment\"># 내부 과정:</span>","<span class=\"py-comment\"># 1) SELECT ... FOR UPDATE로 version 행 잠금</span>","<span class=\"py-comment\"># 2) expected_count와 실제 Chunk 수 비교</span>","<span class=\"py-comment\"># 3) ingest_versions.status = &#x27;ready&#x27;</span>","<span class=\"py-comment\"># 4) ingest_documents의 current_version/파이프라인 포인터 변경</span>","<span class=\"py-comment\"># 도중 실패하면 ROLLBACK → 기존 공개 포인터 유지</span>"]},"sql-retrieve":{"title":"동일 검색 계약으로 공개 Chunk 조회","lang":"python","raw":"from coursekit.live import encode_query\nfrom coursekit.db import search_current\n\n# conn: connect_db()로 열고 use_schema()를 적용한 연결\n# model: load_encoder()로 로드한 동일 E5-small\n# question, category: 검사된 질문과 필터\nquery_vector = encode_query(model, question)  # 'query: ' 접두어\nrows = search_current(conn, query_vector, category, k=3)\nfor citation_id, chunk_id, body, locator, doc_id, version, distance in rows:\n    print(citation_id, chunk_id, version, locator, distance)\n\n# search_current() 내부:\n# current source/pipeline version + ready + category를 SQL로 필터링\n# 정수 citation_id와 최종 Chunk 본문(body)을 함께 반환","desc":"실습의 coursekit.live.encode_query()와 coursekit.db.search_current()를 사용합니다. 연결 시 register_vector(conn) 처리와 use_schema() 호출이 필요합니다. 실측 DB 결과를 뜻하지 않습니다.","independent":false,"html_lines":["<span class=\"py-keyword\">from</span> coursekit.live <span class=\"py-keyword\">import</span> encode_query","<span class=\"py-keyword\">from</span> coursekit.db <span class=\"py-keyword\">import</span> search_current","","<span class=\"py-comment\"># conn: connect_db()로 열고 use_schema()를 적용한 연결</span>","<span class=\"py-comment\"># model: load_encoder()로 로드한 동일 E5-small</span>","<span class=\"py-comment\"># question, category: 검사된 질문과 필터</span>","query_vector = encode_query(model, question)  <span class=\"py-comment\"># &#x27;query: &#x27; 접두어</span>","rows = search_current(conn, query_vector, category, k=<span class=\"py-number\">3</span>)","<span class=\"py-keyword\">for</span> citation_id, chunk_id, body, locator, doc_id, version, distance in rows:","    <span class=\"py-type\">print</span>(citation_id, chunk_id, version, locator, distance)","","<span class=\"py-comment\"># search_current() 내부:</span>","<span class=\"py-comment\"># current source/pipeline version + ready + category를 SQL로 필터링</span>","<span class=\"py-comment\"># 정수 citation_id와 최종 Chunk 본문(body)을 함께 반환</span>"]},"pipeline-code":{"title":"End-to-End Ingestion 설계 발췌","lang":"python","raw":"from coursekit.documents import parse_one\nfrom coursekit.processing import clean_prose, make_chunks, validate_span\nfrom coursekit.live import encode_passages\nfrom coursekit.db import stage_version, publish_version\n\ndef ingest_document(doc, config, model, conn):\n    parsed = parse_one(doc)\n    if parsed[\"status\"] != \"parsed\":\n        return {\"status\": parsed[\"status\"], \"chunks\": 0}\n\n    chunks = []\n    for unit in parsed[\"units\"]:\n        clean_text = clean_prose(unit[\"raw_text\"])\n        for c in make_chunks(doc, unit, config[\"size\"], config[\"overlap\"],\n                             config[\"pipeline_version\"]):\n            span = {\"char_start\": c[\"char_start\"], \"char_end\": c[\"char_end\"],\n                    \"text\": c[\"body\"]}\n            validate_span(span, clean_text)\n            chunks.append(c)\n    if not chunks:\n        raise ValueError(\"empty validated chunks\")\n\n    vectors = encode_passages(model, chunks)  # Token·차원·Norm 검증\n    with conn.transaction():\n        stage_version(conn, doc, doc[\"file\"], chunks, vectors)\n        publish_version(conn, doc[\"doc_id\"], doc[\"source_version\"],\n                        config[\"pipeline_version\"])\n    return {\"status\": \"published\", \"chunks\": len(chunks)}","desc":"실습의 실제 공통 함수명·호출 인자를 적용한 조립 예시입니다. 사전 조건: Manifest 문서·config 준비, E5 로딩, 전용 Schema 선택, pgvector 연결. 실제 운영에서는 중복·Coverage·장애 기록도 검증해야 합니다.","independent":false,"html_lines":["<span class=\"py-keyword\">from</span> coursekit.documents <span class=\"py-keyword\">import</span> parse_one","<span class=\"py-keyword\">from</span> coursekit.processing <span class=\"py-keyword\">import</span> clean_prose, make_chunks, validate_span","<span class=\"py-keyword\">from</span> coursekit.live <span class=\"py-keyword\">import</span> encode_passages","<span class=\"py-keyword\">from</span> coursekit.db <span class=\"py-keyword\">import</span> stage_version, publish_version","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">ingest_document</span>(doc, config, model, conn):","    parsed = parse_one(doc)","    <span class=\"py-keyword\">if</span> parsed[<span class=\"py-string\">&quot;</span><span class=\"py-string\">status</span><span class=\"py-string\">&quot;</span>] != <span class=\"py-string\">&quot;</span><span class=\"py-string\">parsed</span><span class=\"py-string\">&quot;</span>:","        <span class=\"py-keyword\">return</span> {<span class=\"py-string\">&quot;</span><span class=\"py-string\">status</span><span class=\"py-string\">&quot;</span>: parsed[<span class=\"py-string\">&quot;</span><span class=\"py-string\">status</span><span class=\"py-string\">&quot;</span>], <span class=\"py-string\">&quot;</span><span class=\"py-string\">chunks</span><span class=\"py-string\">&quot;</span>: <span class=\"py-number\">0</span>}","","    chunks = []","    <span class=\"py-keyword\">for</span> unit in parsed[<span class=\"py-string\">&quot;</span><span class=\"py-string\">units</span><span class=\"py-string\">&quot;</span>]:","        clean_text = clean_prose(unit[<span class=\"py-string\">&quot;</span><span class=\"py-string\">raw_text</span><span class=\"py-string\">&quot;</span>])","        <span class=\"py-keyword\">for</span> c in make_chunks(doc, unit, config[<span class=\"py-string\">&quot;</span><span class=\"py-string\">size</span><span class=\"py-string\">&quot;</span>], config[<span class=\"py-string\">&quot;</span><span class=\"py-string\">overlap</span><span class=\"py-string\">&quot;</span>],","                             config[<span class=\"py-string\">&quot;</span><span class=\"py-string\">pipeline_version</span><span class=\"py-string\">&quot;</span>]):","            span = {<span class=\"py-string\">&quot;</span><span class=\"py-string\">char_start</span><span class=\"py-string\">&quot;</span>: c[<span class=\"py-string\">&quot;</span><span class=\"py-string\">char_start</span><span class=\"py-string\">&quot;</span>], <span class=\"py-string\">&quot;</span><span class=\"py-string\">char_end</span><span class=\"py-string\">&quot;</span>: c[<span class=\"py-string\">&quot;</span><span class=\"py-string\">char_end</span><span class=\"py-string\">&quot;</span>],","                    <span class=\"py-string\">&quot;</span><span class=\"py-string\">text</span><span class=\"py-string\">&quot;</span>: c[<span class=\"py-string\">&quot;</span><span class=\"py-string\">body</span><span class=\"py-string\">&quot;</span>]}","            validate_span(span, clean_text)","            chunks.append(c)","    <span class=\"py-keyword\">if</span> not chunks:","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">&quot;</span><span class=\"py-string\">empty validated chunks</span><span class=\"py-string\">&quot;</span>)","","    vectors = encode_passages(model, chunks)  <span class=\"py-comment\"># To d24-range{display:grid;grid-template-columns:110px minmax(0,1fr) 100px;gap:10px;align-items:center;font-size:15px}\n.d24-track{height:27px;border-radius:6px;background:#e5edf4;position:relative;overflow:hidden}\n.d24-fill{position:absolute;top:0;bottom:0;background:var(--blue);border-radius:4px}.d24-range:nth-child(even) .d24-fill{background:var(--teal)}\n.d24-range>code{text-align:right;color:var(--navy)}\n.d24-statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0}\n.d24-stat{border:1px solid var(--line);border-radius:10px;padding:17px;background:#fff}\n.d24-stat small{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}.d24-stat strong{font-size:25px;color:var(--blue)}\n.d24-evidence{border-left:4px solid var(--blue);background:var(--pale);padding:15px 19px;font-size:16px;line-height:1.8;margin:20px 0}\n.d24-evidence strong{color:var(--navy)}\n.d24-mono{font-family:Consolas,'Malgun Gothic',monospace;overflow-wrap:anywhere}\n.d24-chain{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin:20px 0}\n.d24-chain>div{border:1px solid var(--line);background:#f7f9fc;border-radius:11px;padding:18px;line-height:1.7}\n.d24-chain b{display:block;color:var(--blue);font-size:19px}.d24-chain span{display:block;font-size:15px}\n@media(max-width:900px){.d24-flow{grid-template-columns:repeat(2,minmax(0,1fr))}.d24-columns{grid-template-columns:1fr}.d24-statrow{grid-template-columns:1fr 1fr}.d24-chain{grid-template-columns:1fr}.d24-range{grid-template-columns:85px 1fr 85px}}\n@media(max-width:560px){.d24-statrow{grid-template-columns:1fr}.d24-tbl{font-size:13px}.d24-tbl td,.d24-tbl th{padding:8px}.d24-range{font-size:12px;grid-template-columns:75px 1fr 70px}.d24-pre{font-size:12px}}\n@media print{.d24-panel,.d24-step,.d24-stat,.d24-chain>div{break-inside:avoid}.d24-fill{print-color-adjust:exact;-webkit-print-color-adjust:exact}}\n</style><style id=\"d24-review-terms\">\n/* 핵심요약: 전문 용어는 처음 등장한 시트에서 바로 해설합니다. */\n.d24-summary-terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:11px;margin:12px 0 19px;background:#f1f6fb;border:1px solid #c9dbea;border-left:4px solid var(--blue);border-radius:9px}\n.d24-summary-terms>div{padding:10px 13px;background:white;border:1px solid #d7e4ef;border-radius:7px;font-size:13px;line-height:1.7;word-break:keep-all}\n.d24-summary-terms b{display:block;font-size:15px;color:#25476e;margin:0 0 5px}\n.d24-summary-terms code{font-size:12px;overflow-wrap:anywhere}\n@media(max-width:760px){.d24-summary-terms{grid-template-columns:1fr}.d24-summary-terms>div{font-size:12px}}\n</style></head><body>\n<header class=\"review-top\"><div><div class=\"tag\">DAY 24 · 핵심요약</div><h1>Document Parsing · Chunking · Indexing</h1><p>원문을 검증 가능한 Chunk와 출처·버전·Embedding으로 변환하는 Document Ingestion Pipeline</p></div><button type=\"button\" class=\"review-print\" onclick=\"window.print()\">인쇄</button></header>\n<main>\n<section class=\"sheet\" id=\"review-flow\" aria-labelledby=\"r1\"><div class=\"sheet-heading\"><span class=\"sheet-number\">01</span><h2 id=\"r1\">전체 흐름: Raw File에서 검색 가능한 Chunk까지</h2></div>\n<p class=\"definition\">오늘은 <b>Raw File → Document Parsing → Text Cleaning → Chunking → Validation → Embedding → Indexing</b>을 연결합니다. 답변 생성은 11월 20일 Basic RAG에서 다룹니다.</p>\n<div class=\"d24-flow\" role=\"group\" aria-label=\"Document Ingestion 처리 단계\">\n<div class=\"d24-step\"><b>01 · Collect</b><span>원본 bytes·doc_id·source_version·SHA-256</span></div>\n<div class=\"d24-step\"><b>02 · Parse</b><span>TXT·Markdown·HTML·PDF에서 본문·구조 추출</span></div>\n<div class=\"d24-step\"><b>03 · Clean</b><span>줄바꿈·공백 정리 / 숫자·조건 보존</span></div>\n<div class=\"d24-step\"><b>04 · Chunk</b><span>절·문단·Token 길이 / Overlap</span></div>\n<div class=\"d24-step accent\"><b>05 · Validate</b><span>Span·Token 한도·Coverage·중복·출처</span></div>\n<div class=\"d24-step accent\"><b>06 · Embed</b><span>E5-small · 384차원 · passage: 입력</span></div>\n<div class=\"d24-step accent\"><b>07 · Index</b><span>pgvector에 Chunk·Metadata·Vector 저장</span></div>\n<div class=\"d24-step accent\"><b>08 · Retrieve</b><span>Top-k 검색·원문·source_locator 반환</span></div>\n</div>\n<div class=\"d24-columns\"><div class=\"d24-panel\"><h3>18일과 이어지는 부분</h3><p><b>E5-small</b>과 PostgreSQL 18.6의 <b>pgvector</b>를 재사용하며, 같은 모델·접두어·정규화 계약을 지킵니다.</p></div><div class=\"d24-panel safe\"><h3>20일에 연결하는 부분</h3><p>검색된 Chunk를 16일의 Context Builder와 17일의 LLM Client에 연결합니다. 아직 생성형 답변은 만들지 않습니다.</p></div></div>\n<div class=\"lesson\"><strong>검색 결과의 신뢰도는 Embedding 모델뿐 아니라, 입력 문서를 준비한 과정에도 달려 있습니다.</strong></div></section>\n<section class=\"sheet\" id=\"review-parsing\" aria-labelledby=\"r2\"><div class=\"sheet-heading\"><span class=\"sheet-number\">02</span><h2 id=\"r2\">Document Parsing: 형식·구조·원문 위치</h2></div>\n<p class=\"definition\"><b>Parsing</b>은 파일 내부 구조를 해석하는 작업이고, <b>Text Extraction</b>은 검색에 사용할 문자열을 꺼내는 작업입니다. 문자열을 추출했다고 표·읽기 순서까지 보존된 것은 아닙니다.</p>\n<div class=\"d24-summary-terms\" aria-label=\"Document Parsing의 기본 용어\">\n<div><b>UTF-8 · Unicode Transformation Format – 8-bit</b>Unicode 문자를 bytes로 표현하는 Encoding입니다. <code>\"가\".encode(\"utf-8\")</code> 결과는 3bytes이고, 문자열 <code>\"가\"</code>는 한 글자입니다.</div>\n<div><b>Encoding / Decoding</b>Encoding은 <code>str → bytes</code>, Decoding은 <code>bytes → str</code>로 해석하는 과정입니다. 서로 다른 규칙으로 읽으면 문자 오류가 발생할 수 있습니다.</div>\n</div>\n<table class=\"d24-tbl\"><thead><tr><th scope=\"col\">형식</th><th scope=\"col\">주요 도구</th><th scope=\"col\">보존·검사할 정보</th></tr></thead><tbody>\n<tr><td><b>TXT</b></td><td><code>bytes.decode(\"utf-8\")</code></td><td>인코딩 오류·빈 줄·문단</td></tr>\n<tr><td><b>Markdown</b></td><td>Markdown parser</td><td>Heading Path·목록·코드 블록</td></tr>\n<tr><td><b>HTML</b></td><td>Beautiful Soup</td><td><code>main</code> 본문·표의 행과 열 / 메뉴 제외</td></tr>\n<tr><td><b>PDF</b></td><td>pypdf</td><td>페이지·다단 읽기 순서·표·source_locator</td></tr>\n<tr><td><b>Scan PDF</b></td><td>OCR 필요 여부 판단</td><td>pypdf는 이미지 속 문자를 직접 인식하지 않음</td></tr>\n</tbody></table>\n<div class=\"d24-columns\"><div class=\"d24-panel\"><h3>ParsedUnit의 핵심 필드</h3><div class=\"d24-pre\">doc_id: DOC-CAREER<br>unit_id: page-1<br>page_number: 1<br>source_locator: career.pdf#page=1<br>raw_text: 추출된 페이지 텍스트</div></div><div class=\"d24-panel critical\"><h3>빈 추출 ≠ 스캔 확정</h3><p>빈 페이지·손상·암호화·이미지 페이지 등 원인을 확인합니다. 실제로 OCR이 필요한 문서만 <code>needs_ocr</code>로 분류하며, 조용히 삭제하지 않습니다.</p></div></div>\n<div class=\"lesson\"><strong>Raw File·ParsedUnit·원문 위치를 연결해야 검색한 근거를 다시 확인할 수 있습니다.</strong></div></section>\n<section class=\"sheet\" id=\"review-clean\" aria-labelledby=\"r3\"><div class=\"sheet-heading\"><span class=\"sheet-number\">03</span><h2 id=\"r3\">Text Cleaning: 형식을 정리하고 의미를 보존</h2></div>\n<p class=\"definition\"><b>Text Cleaning</b>은 형식상의 잡음을 줄이는 작업입니다. 숫자·부정어·단위·예외 조건까지 지우는 것은 좋은 Cleaning이 아닙니다.</p>\n<div class=\"d24-summary-terms\" aria-label=\"Unicode 정규화의 기본 용어\">\n<div><b>NFC · Normalization Form C</b>정준적으로 같은 Unicode 표현을 분해·재조합하는 정규화입니다. <code>ᄀ+ᅡ → 가</code>. 일반 본문에서 표기를 통일하는 기본 정책입니다.</div>\n<div><b>NFKC · Normalization Form KC</b>호환 문자까지 분해·재조합해 <code>① → 1</code>, <code>² → 2</code>처럼 표기를 바꿀 수 있습니다. 번호·지수 의미에 영향을 줄 수 있으므로 무조건 적용하지 않습니다.</div>\n</div>\n<div class=\"d24-columns\"><div class=\"d24-panel\"><h3>가능한 변환</h3><div class=\"d24-pre\">\"출석   안내\\r\\n\\r\\n10분  초과\"<br>↓<br>\"출석 안내\\n\\n10분 초과\"</div><p>CRLF/CR을 LF로 통일하고 가로 공백을 정리하되 문단 경계를 유지합니다.</p></div><div class=\"d24-panel critical\"><h3>거부할 변환</h3><div class=\"d24-pre\">원문: 제출할 수 없습니다.<br>오류: 제출할 수 있습니다.</div><p>부정어 삭제로 안내의 의미가 반대로 바뀌었습니다. 표·코드·TSV에도 일반 본문용 공백 규칙을 그대로 적용하면 안 됩니다.</p></div></div>\n<div class=\"d24-chain\"><div><b>raw_sha256</b><span>원본 파일의 bytes를 해시합니다.</span></div><div><b>clean_hash</b><span>정제된 문자열을 UTF-8로 해시합니다.</span></div><div><b>char_start/end</b><span>청크의 문자열 범위는 <code>clean_text</code> 기준입니다.</span></div></div>\n<div class=\"d24-evidence\"><strong>Offset 계약:</strong> <code>clean_text[start:end]</code>의 <code>end</code>는 제외합니다. 이 값은 PDF 화면 좌표나 원본 파일의 바이트 위치가 아닙니다.</div>\n<div class=\"lesson\"><strong>정제 결과가 짧아졌다는 사실보다 중요한 정보가 남아 있는지 검증하는 것이 더 중요합니다.</strong></div></section>\n<section class=\"sheet\" id=\"review-chunk\" aria-labelledby=\"r4\"><div class=\"sheet-heading\"><span class=\"sheet-number\">04</span><h2 id=\"r4\">Chunking: Size·Overlap·Token 한도를 함께 본다</h2></div>\n<p class=\"definition\"><b>Chunk</b>는 문서에서 검색·Embedding에 사용하는 본문 단위입니다. 실제로는 Heading·문단·표 구조를 고려하고, 한도를 초과하는 부분만 추가로 분할합니다.</p>\n<div class=\"d24-ranges\" role=\"group\" aria-label=\"71자 본문을 Size 40, Overlap 10으로 나눈 설명용 문자 범위\">\n<div class=\"d24-range\"><b>Chunk 1</b><div class=\"d24-track\"><span class=\"d24-fill\" style=\"left:0%;width:56.34%\"></span></div><code>[0, 40)</code></div>\n<div class=\"d24-range\"><b>Chunk 2</b><div class=\"d24-track\"><span class=\"d24-fill\" style=\"left:42.25%;width:56.34%\"></span></div><code>[30, 70)</code></div>\n<div class=\"d24-range\"><b>Chunk 3</b><div class=\"d24-track\"><span class=\"d24-fill\" style=\"left:84.51%;width:15.49%\"></span></div><code>[60, 71)</code></div>\n</div>\n<div class=\"d24-statrow\"><div class=\"d24-stat\"><small>원문 길이</small><strong>71자</strong></div><div class=\"d24-stat\"><small>청크 길이 합</small><strong>91자</strong></div><div class=\"d24-stat\"><small>고유 위치 Coverage</small><strong>100%</strong></div></div>\n<div class=\"d24-columns\"><div class=\"d24-panel\"><h3>Character vs Token</h3><p>Size 40자는 40토큰이 아닙니다. 실제 모델의 Tokenizer를 사용해 입력 길이를 계산해야 합니다.</p></div><div class=\"d24-panel safe\"><h3>E5 Embedding Text</h3><div class=\"d24-pre\">passage: [선택한 Heading] + Chunk Body</div><p>E5-small의 384차원은 출력 숫자 개수입니다. <b>입력 Token 상한</b>과는 다릅니다.</p></div></div>\n<div class=\"lesson\"><strong>Overlap을 늘릴수록 저장할 반복 내용이 늘 수 있습니다. Size는 실제 질문과 문서로 평가해야 합니다.</strong></div></section>\n<section class=\"sheet\" id=\"review-validation\" aria-labelledby=\"r5\"><div class=\"sheet-heading\"><span class=\"sheet-number\">05</span><h2 id=\"r5\">Chunk Validation · Metadata · 검색 조건</h2></div>\n<p class=\"definition\"><b>Chunk Validation</b>은 문서의 일부가 어디서 왔는지, 길이·본문·위치·중복·누락이 올바른지 확인합니다. <b>Metadata</b>는 그 결과를 출처·버전·분류와 연결합니다.</p>\n<div class=\"d24-flow\"><div class=\"d24-step\"><b>Span</b><span><code>span[\"text\"] == clean_text[start:end]</code></span></div><div class=\"d24-step\"><b>Token Limit</b><span>실제 E5 입력 전체·특수 토큰 확인</span></div><div class=\"d24-step\"><b>Coverage</b><span>겹치는 구간은 한 번만 세기</span></div><div class=\"d24-step\"><b>Metadata</b><span>원문·판·위치·처리 규칙·ID</span></div></div>\n<table class=\"d24-tbl\"><thead><tr><th scope=\"col\">20자 본문의 Chunk 구간</th><th scope=\"col\">Coverage</th><th scope=\"col\">확인할 사항</th></tr></thead><tbody><tr><td><code>[0,8), [6,14), [12,20)</code></td><td>100%</td><td>의도한 Overlap, 전체 구간 포함</td></tr><tr><td><code>[0,8), [10,20)</code></td><td>90%</td><td><code>[8,10)</code>이 누락됨</td></tr><tr><td><code>[0,8), [0,8), [8,20)</code></td><td>100%</td><td>Coverage만으로 중복 생성 오류는 못 찾음</td></tr></tbody></table>\n<div class=\"d24-panel\"><h3>검색 결과와 함께 보존할 Metadata</h3><div class=\"d24-pre\">doc_id · source_version · unit_id · chunk_id<br>source_locator · char_start/end · pipeline_version<br>category · embedding_contract</div></div>\n<div class=\"d24-evidence\"><strong>필터의 순서:</strong> 정확 검색에서는 대상 범위(<code>WHERE category = ...</code> 및 공개 버전)를 제한한 뒤, 해당 범위에서 거리 기준 Top-k를 반환합니다. 전체 Top-k를 구한 뒤 필터링하면 다른 결과가 나올 수 있습니다.</div>\n<div class=\"lesson\"><strong>Coverage 100%도 원본 PDF의 완전한 추출이나 Chunk의 의미 보존을 보증하지 않습니다.</strong></div></section>\n<section class=\"sheet\" id=\"review-publish\" aria-labelledby=\"r6\"><div class=\"sheet-heading\"><span class=\"sheet-number\">06</span><h2 id=\"r6\">pgvector Indexing · Version Publish · Basic RAG 연결</h2></div>\n<p class=\"definition\">18일의 <b>E5-small(384차원) + pgvector</b>를 그대로 사용해 Chunk를 저장합니다. 같은 입력은 중복 증가 없이 재실행하고, 새 판은 검증 전까지 공개하지 않습니다.</p>\n<div class=\"d24-chain\"><div><b>staging</b><span>새 source_version·pipeline_version으로 Chunk·Vector 준비</span></div><div><b>ready</b><span>Span·모델 계약·저장 개수·원문 연결 검사 통과</span></div><div><b>publish</b><span>짧은 Transaction에서 현재 공개 포인터 전환</span></div></div>\n<div class=\"d24-columns\"><div class=\"d24-panel safe\"><h3>성공: v2로 전환</h3><p>가상 사례에서 v1이 A·B·C이고 v2가 A·B라면 공개 후 검색은 <b>v2의 A·B만</b> 반환해야 합니다. 실습 DOC-ATTEND v1·v2는 각각 2청크이며 이전 버전 제외를 검증합니다.</p><div class=\"d24-pre\">current_version = 'v2'<br>current_pipeline_version = 'ingest-e5-v1'</div></div><div class=\"d24-panel critical\"><h3>실패: 기존 정상 버전 유지</h3><p>v2의 Embedding·검증·저장 중 실패가 나면 이전 공개 포인터를 유지합니다. 실행 실패를 원문 삭제로 취급하지 않습니다.</p></div></div>\n<div class=\"d24-evidence\"><strong>20일의 Retriever 계약:</strong> <code>chunk_id</code>·<code>body</code>·<code>source_locator</code>·<code>source_version</code>과 검색 상태를 반환합니다. 16일 <code>KnowledgeAnswer.source_ids</code>가 정수 목록이므로 필요한 경우 별도의 <b>정수 출처 ID 매핑</b>을 명시합니다.</div>\n<div class=\"lesson\"><strong>좋은 인덱싱은 검색 성공뿐 아니라 재실행·버전 변경·부분 실패 뒤의 데이터 일관성까지 설명할 수 있어야 합니다.</strong></div></section>\n</main>\n<footer class=\"review-footer\">한로 강민준 · Day24 Document Parsing · Chunking · Indexing · 2026.11.19</footer>\n</body></html>";
const CHAPTER_IO=[["원본 파일·전날의 검색 기반", "Raw File·Manifest·변경 추적"], ["TXT·Markdown·HTML·PDF", "본문·표·페이지·ParsedUnit"], ["추출 raw_text·정제 정책", "CleanUnit·clean_hash"], ["정제 본문·모델 Tokenizer", "Chunk·Span·embedding_text"], ["Chunk·원문 위치·모델 계약", "통과·격리·Coverage Report"], ["Chunk·문서·버전·원문 위치", "Metadata·Filter·공개 버전"], ["검증된 Chunk·E5·PostgreSQL", "벡터·현재 공개 버전·Top-k"], ["원문·청크·벡터·상태", "검색 근거 + 내일의 Context 연결"]];
const MAP_ROUTES={
