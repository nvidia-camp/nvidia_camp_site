DF가 이미지 중심이어서 Parsing 단계에서 needs_ocr로 보류될 수 있습니다."]]},{"chapter":2,"id":"parse-definition","title":"Parsing은 텍스트 추출보다 넓은 개념입니다","claim":"Document Parsing은 파일 내부 형식을 해석하고 문단·제목·페이지·표 같은 구조 정보를 가능한 범위에서 추출합니다.","kind":"concept","focus":"index","left":[["Parsing","PDF·HTML 등 형식을 읽고 구조와 내용을 처리 가능한 객체로 변환합니다."],["Text Extraction","그 객체에서 검색에 사용할 문자열을 추출합니다."]],"right":[["구조가 필요한 이유","표의 값은 어느 행·열의 값인지, 문장은 어느 제목의 규정인지 알아야 합니다."],["검증할 이유","문자열이 나왔다는 사실이 원문 의미와 순서의 보존을 보증하지 않습니다."]],"example":"원문: [지각과 결석] 10분 초과 → 결석\n잘못 추출: 10분 / 결석 / 다른 행의 값 → 조건 관계 상실","distinction":"실제 실무 문서는 원본 PDF와 추출 결과를 비교하는 단계가 필요합니다.","flow":[],"codes":[]},{"chapter":2,"id":"parser-matrix","title":"파일 형식마다 보존할 구조가 다릅니다","claim":"Parser를 한 가지 정규식으로 대체하지 않고 입력 형식의 특성을 사용합니다.","kind":"table","focus":"index","headers":["형식","권장 파싱 도구·방법","주의할 점"],"rows":[["TXT","Python bytes.decode(UTF-8)","인코딩 오류·줄바꿈"],["Markdown","Markdown parser / 제목 경계","Heading·목록·코드 블록"],["HTML","Beautiful Soup, main/article 선택","메뉴·스크립트·표"],["PDF","pypdf 페이지 추출","읽기 순서·이미지·표"],["DOCX (비교)","python-docx 문단·표 순서","문단만 순회하면 표 누락 가능"]],"note":"DOCX는 구조 차이만 소개하며 오늘 필수 처리 범위는 TXT·Markdown·HTML·PDF입니다.","codes":[]},{"chapter":2,"id":"decode","title":"TXT는 UTF-8을 명시적으로 디코딩합니다","claim":"잘못된 바이트를 자동 삭제하는 errors=\"ignore\"는 원문 누락을 숨깁니다.","kind":"code","focus":"index","codes":["decode"],"left":"입력: bytes","right":"출력: 문자열 또는 decode_error","note":""},{"chapter":2,"id":"markdown","title":"Markdown은 Heading과 본문 경계를 함께 봅니다","claim":"Heading(제목), 목록·코드 블록의 구조를 보존해야 문장과 조건의 소속을 유지할 수 있습니다.","kind":"concept","focus":"index","left":[["Heading Path","`# 출석 안내` → `## 지각과 결석`의 경로를 Metadata로 보관할 수 있습니다."],["본문 경계","제목 다음의 문장은 해당 절과 연결되며 다음 제목을 만나면 구역이 달라집니다."]],"right":[["주의","모든 `#` 기호가 Heading은 아닙니다. 코드 블록과 인용문 안의 문법을 구분해야 합니다."],["실무 설계","Markdown parser 또는 구조 인식 로직의 출력이 올바른지 공통 샘플로 검증합니다."]],"example":"# 출석 안내\n## 지각과 결석\n10분을 초과하면 결석으로 기록합니다.\n## 문의\n출석 문의는 운영실에 연락하세요.","distinction":"본문만 읽어 제목 경로를 버리면 비슷한 규정이 다른 절에서 반복될 때 출처를 설명하기 어렵습니다.","flow":[],"codes":[]},{"chapter":2,"id":"html-parse","title":"HTML에서는 main 본문과 표를 구분합니다","claim":"Beautiful Soup의 get_text()는 모든 표의 행·열 관계를 자동으로 복원하지 않습니다.","kind":"code","focus":"index","codes":["html-parse"],"left":"입력: main이 있는 HTML","right":"출력: 선택 영역의 텍스트 / main_not_found","note":""},{"chapter":2,"id":"table-parsing","title":"표를 읽을 때는 행과 열의 관계가 중요합니다","claim":"숫자만 추출하면 의미를 잃습니다. 표는 행을 보존하거나 열 이름과 함께 문장화합니다.","kind":"table","focus":"index","headers":["원문 구조","잘못된 텍스트","보존한 텍스트"],"rows":[["시설 / 운영시간","09:00 18:00","도서관: 09:00~18:00"],["요일 / 장소","월 화 2층 3층","월: 2층 / 화: 3층"],["비고 / 예외","휴관 허용","일요일: 휴관 (예외 조건 보존)"]],"note":"위 자료는 표 구조 보존을 위한 가상 예시이며 실제 시설 운영 시간이 아닙니다.","codes":[]},{"chapter":2,"id":"pdf-parse","title":"PDF는 페이지별 raw_text와 locator를 남깁니다","claim":"pypdf는 PDF 텍스트를 추출하지만 이미지에 있는 문자를 OCR로 인식하지 않습니다.","kind":"code","focus":"index","codes":["pdf-parse"],"left":"입력: 텍스트 PDF","right":"출력: unit_id·page_number·source_locator·raw_text","note":""},{"chapter":2,"id":"pdf-limit","title":"PDF의 화면 배치가 텍스트 순서를 보장하지 않습니다","claim":"PDF는 표시·인쇄용 배치가 중심이므로 다단 문서·표·머리말을 읽는 순서가 흐트러질 수 있습니다.","kind":"concept","focus":"index","left":[["텍스트 PDF","문자 추출이 가능해도 다단 순서·헤더·표 구조는 검수가 필요합니다."],["Scan PDF","이미지에 문자만 있는 경우 pypdf 결과가 비거나 부족할 수 있습니다."]],"right":[["OCR PDF","텍스트층이 있더라도 OCR 오인식 가능성이 있습니다."],["혼합 PDF","페이지별로 추출 상태가 다를 수 있으므로 문서 전체를 일괄 승인하지 않습니다."]],"example":"DOC-CAREER → page-1 / page-2를 각각 기록\nDOC-SCAN → 원문을 확인하고 needs_ocr로 보류","distinction":"빈 추출 결과는 실제 빈 페이지·손상·스캔 중 어느 상황인지 추가 확인한 뒤 상태를 정합니다.","flow":[],"codes":[]},{"chapter":2,"id":"parsing-demo","title":"형식별 Parsing 입력과 추출 결과를 비교합니다","claim":"브라우저의 텍스트 사례이며 실제 PDF 파일을 브라우저에서 분석하는 기능이 아닙니다.","kind":"parsing-demo","focus":"index"},{"chapter":2,"id":"practice-2","title":"실습 02 · Basic / Intermediate / Advanced","claim":"Basic / Intermediate / Advanced 중 자신의 수준에 맞는 한 단계를 선택합니다. 아래에서 실습 목표와 완료 기준을 확인하세요.","kind":"practice","focus":"index","levels":[["Basic (기본필수)","TXT 문서를 UTF-8로 읽어 ParsedUnit 1건과 source_locator를 만듭니다."],["Intermediate (응용)","TXT·HTML을 같은 ParsedUnit 구조로 반환하고 main 누락을 구분합니다."],["Advanced (심화)","PDF를 페이지별로 추출하고 needs_ocr·빈 결과·오류 상태를 분리합니다."]],"output":"ParsedUnit · raw_text · source_locator · page_number(있는 경우만)"},{"chapter":2,"id":"quiz-2","title":"핵심 확인 · Document Parsing","claim":"정답을 보기 전에 먼저 근거를 말해보세요.","kind":"quiz","focus":"index","items":[["pypdf로 이미지 속 글자를 바로 읽을 수 있나요?","아닙니다. 이미지 문자 인식에는 별도 OCR이 필요합니다."],["HTML의 get_text()가 표의 열 관계까지 자동 보존하나요?","아닙니다. 표의 행·열 구조를 별도로 검사해야 합니다."],["TXT 문서에 page_number=1을 넣어도 될까요?","안 됩니다. 페이지가 없으면 null 또는 None 등으로 표시합니다."]]},{"chapter":3,"id":"cleaning-why","title":"Cleaning은 문서를 짧게 만드는 작업이 아닙니다","claim":"Text Cleaning은 검색을 방해하는 형식상의 잡음을 줄이되 숫자·조건·부정어·제목·문단의 의미를 보존하는 과정입니다.","kind":"concept","focus":"index","left":[["정리해도 되는 것","일반 본문의 CRLF/CR 줄바꿈, 지나친 가로 공백, 일부 반복 머리말 등입니다."],["보존할 것","10분, 초과, 단, 승인 시, 제출 불가 같은 답을 바꾸는 정보입니다."]],"right":[["Raw → Clean","파싱 원문(raw_text)과 정제 본문(clean_text)을 따로 보관합니다."],["Cleaning Version","규칙이 바뀌면 cleaner_version과 clean_hash를 갱신해 비교합니다."]],"example":"원문: \"제출할 수 없습니다.\"\n잘못된 정제: \"제출할 수 있습니다.\" → 부정어 제거로 의미 반전","distinction":"정제 후 길이가 줄었다는 이유만으로 품질이 좋아졌다고 평가할 수 없습니다.","flow":[],"codes":[]},{"chapter":3,"id":"normalization","title":"NFC와 NFKC는 다른 정규화 규칙입니다","claim":"표기 통일은 유용하지만 중요한 문자 형식까지 바꿀 수 있습니다.","kind":"table","focus":"index","headers":["규칙","수행","주의"],"rows":[["CRLF/CR → LF","줄바꿈 형식 통일","문단 사이 빈 줄 유지"],["NFC","정준적으로 동등한 Unicode 표현 조합","일반 본문 기준 설정"],["NFKC","호환 문자 변환","①·² 같은 표기가 달라질 수 있음"],["공백 정리","가로 공백·탭 축소","표·코드·TSV는 예외 정책"]],"note":"NFC는 텍스트 의미를 자동 교정하는 기능이 아닙니다.","codes":[]},{"chapter":3,"id":"clean-code","title":"일반 본문 전용 clean_prose()를 구현합니다","claim":"코드 블록이나 정렬된 표에 동일한 공백 규칙을 무조건 적용하지 않습니다.","kind":"code","focus":"index","codes":["clean-code"],"left":"입력: raw_text","right":"출력: clean_text, 문단 경계 보존","note":""},{"chapter":3,"id":"cleaning-demo","title":"Cleaning 규칙별 Before / After를 직접 비교합니다","claim":"조작형 예시는 Python의 정제 함수를 브라우저에서 실행하는 것이 아니라 같은 목적의 JavaScript 설명용 계산입니다.","kind":"cleaning-demo","focus":"index"},{"chapter":3,"id":"offsets","title":"Cleaning 후의 Offset은 원본 파일 바이트 위치가 아닙니다","claim":"char_start와 char_end는 해당 ParsedUnit의 clean_text에서 계산한 Python 문자열 슬라이싱 범위입니다.","kind":"concept","focus":"index","left":[["바이트 위치","raw_sha256과 파일 크기는 원본 bytes에 대한 값입니다."],["문자 Offset","clean_text[start:end]로 청크를 복원합니다. end는 제외합니다."]],"right":[["원문 위치","PDF page_number나 Markdown Heading Path는 별도로 source_locator로 유지합니다."],["복잡한 역추적","Cleaning 전후의 자세한 좌표 역매핑에는 별도 span map이 필요합니다."]],"example":"text = \"가나다 라마바\"\ntext[4:7] = \"라마바\"\nlen(text) = 7, UTF-8 byte length = 19","distinction":"char_start=4는 원본 PDF의 네 번째 바이트도 아니고 화면 좌표 x=4도 아닙니다.","flow":[],"codes":[]},{"chapter":3,"id":"clean-record","title":"정제 규칙·해시·길이 변화를 기록합니다","claim":"같은 Cleaner를 다시 적용해도 동일한지 멱등성을 확인할 수 있습니다.","kind":"code","focus":"index","codes":["clean-record"],"left":"입력: raw_text","right":"출력: cleaner_version·clean_hash·chars_before/after","note":""},{"chapter":3,"id":"practice-3","title":"실습 03 · Basic / Intermediate / Advanced","claim":"Basic / Intermediate / Advanced 중 자신의 수준에 맞는 한 단계를 선택합니다. 아래에서 실습 목표와 완료 기준을 확인하세요.","kind":"practice","focus":"index","levels":[["Basic (기본필수)","일반 본문의 줄바꿈과 연속 공백을 정리하면서 문단을 남깁니다."],["Intermediate (응용)","NFC, cleaner_version, 변경 전후 길이와 핵심 구절 검사를 추가합니다."],["Advanced (심화)","숫자·부정어를 삭제하는 잘못된 규칙을 탐지하고 정상 규칙으로 회귀 검사합니다."]],"output":"정제 전후 텍스트 · 변경 기록 · 보존할 구절 검사"},{"chapter":3,"id":"quiz-3","title":"핵심 확인 · Text Cleaning","claim":"정답을 보기 전에 먼저 근거를 말해보세요.","kind":"quiz","focus":"index","items":[["Cleaning 결과가 짧으면 품질이 좋아진 건가요?","아닙니다. 숫자·조건·부정어·문단·표 구조를 보존했는지 확인해야 합니다."],["char_start는 raw PDF의 바이트 위치인가요?","아닙니다. 이 수업에서는 해당 CleanUnit의 clean_text 문자 위치입니다."],["같은 함수를 두 번 실행했는데 결과가 같다면 의미가 보존된 건가요?","아닙니다. 멱등성만 확인했으며 의미 보존은 별도 검사입니다."]]},{"chapter":4,"id":"chunking-why","title":"Chunk는 검색과 출처의 기본 단위입니다","claim":"문서 전체를 하나의 Embedding으로 표현하기보다, 질문에 답할 수 있는 절·문단·구간을 Chunk로 만들어 검색합니다.","kind":"concept","focus":"embedding","left":[["Document / ParsedUnit","Document는 수집·버전 관리 대상이고, ParsedUnit은 문서 내부의 페이지·절 등 추출 단위입니다."],["Chunk","ParsedUnit의 clean_text에서 만든 검색·Embedding 단위입니다."]],"right":[["Token","모델 Tokenizer가 만드는 입력 단위이며 Python 문자 수와 다릅니다."],["검색 품질","너무 작은 청크는 조건·예외가 분리될 수 있고 너무 큰 청크는 모델 한도·주제 혼합 문제가 있습니다."]],"example":"원문: \"10분을 초과하면 결석으로 기록합니다.\"\n잘못 분할: \"10분을 초과하면\" | \"결석으로 기록합니다.\"","distinction":"Chunk Size가 작다고 항상 정확도가 좋아지는 것은 아닙니다.","flow":[],"codes":[]},{"chapter":4,"id":"strategies","title":"주요 Chunking Strategies를 비교합니다","claim":"실무에서는 보통 구조 경계와 Token 길이 제한을 함께 사용합니다.","kind":"table","focus":"embedding","headers":["Strategy","분할 기준","우선 검사"],"rows":[["Fixed Character Window","일정한 글자 수","문장·단어·조건의 중간 절단"],["Token-based","Tokenizer로 셀 수 있는 한도","모델 입력 전체 길이"],["Structure-aware","Heading·문단·목록·표","너무 긴 단위의 추가 분할"],["Semantic Chunking","의미 변화·유사도","추가 계산·튜닝·검증"]],"note":"Semantic Chunking은 비교 주제만 소개하며, 오늘의 필수 구현은 Character → Structure+Token 제한으로 진행합니다.","codes":[]},{"chapter":4,"id":"window-math","title":"Character Window는 시작·끝·Overlap이 핵심입니다","claim":"Chunk Size와 Overlap으로 다음 시작 위치를 계산하며 마지막 청크가 원문 끝에 닿으면 종료합니다.","kind":"concept","focus":"embedding","left":[["Size = 40, Overlap = 10","다음 시작점의 간격은 40 - 10 = 30자입니다."],["문자 범위","[0,40), [30,70), [60,71)처럼 끝점은 포함하지 않습니다."]],"right":[["종료 조건","마지막 end가 len(text)면 종료해야 겹친 꼬리만 다시 만들지 않습니다."],["검사","각 Chunk의 text가 clean_text[start:end]와 정확히 일치해야 합니다."]],"example":"원문 길이 71자\n[0,40) 길이40 → [30,70) 길이40 → [60,71) 길이11\n저장 길이 합 91자, 고유 Coverage 71자","distinction":"Overlap은 검색 품질을 보장하는 값이 아니라 경계 문맥과 중복량 사이의 설계 변수입니다.","flow":[],"codes":[]},{"chapter":4,"id":"windows-code","title":"종료 조건이 있는 Character Chunker","claim":"기본 구현은 Character 기준이며 Token 한도 검사는 별도로 진행합니다.","kind":"code","focus":"embedding","codes":["windows-code"],"left":"입력: clean_text, size, overlap","right":"출력: (start,end,text) 이터레이터","note":""},{"chapter":4,"id":"chunk-demo","title":"Chunk Size와 Overlap을 바꿔 봅니다","claim":"실제 문자열을 자르고 위치·반복량·누락 여부를 JavaScript로 직접 계산하는 학습 시연입니다.","kind":"chunk-demo","focus":"embedding"},{"chapter":4,"id":"token-contract","title":"E5-small의 입력 규칙은 어제와 동일합니다","claim":"전날 확정한 intfloat/multilingual-e5-small 384차원 Embedding 모델을 계속 사용합니다.","kind":"concept","focus":"embedding","left":[["출력 차원 ≠ 입력 길이","384차원은 벡터의 숫자 개수입니다. 모델 입력 토큰 상한을 뜻하지 않습니다."],["Query / Passage","질의에는 query: , 문서 청크에는 passage: 를 붙이는 E5 모델의 입력 계약을 따릅니다."]],"right":[["512토큰과 비교값","E5-small 모델의 최대 입력 설정을 확인합니다. 목표 160·Overlap 32 등은 강의 실험 출발점이지 최적값이 아닙니다."],["실제 길이","passage: 접두어와 선택한 Heading을 포함한 최종 입력에 대해 같은 Tokenizer로 셉니다."]],"example":"embedding_text = \"passage: \" + chunk_text\ntokenizer(embedding_text, truncation=False)\n→ 실제 특수 토큰 포함 길이를 검사","distinction":"입력 길이는 현재 사용하는 E5-small의 Tokenizer와 model.max_seq_length로 확인합니다. 다른 모델의 Token 한도나 측정값을 그대로 적용하지 않습니다.","flow":[],"codes":[]},{"chapter":4,"id":"e5-length","title":"실제 Embedding 입력의 Token 수를 확인합니다","claim":"E5 모델을 CPU로 로드하고 18일과 같은 설정으로 검사·인코딩합니다.","kind":"code","focus":"embedding","codes":["e5-length"],"left":"입력: passage: 접두어+본문","right":"출력: Token 길이·한도 초과 여부","note":""},{"chapter":4,"id":"structure-aware","title":"Structure-aware Chunking을 우선 고려합니다","claim":"Heading과 문단을 먼저 나누고 긴 부분만 모델 입력 길이에 맞춰 추가 분할합니다.","kind":"concept","focus":"embedding","left":[["Markdown Heading","Heading Path를 Metadata로 남기고 본문 Chunk의 소속을 유지합니다."],["PDF Page","페이지·다단 순서를 대조하고 다른 페이지를 무조건 이어 붙이지 않습니다."]],"right":[["HTML Table","행과 열의 관계를 유지한 뒤 분할합니다."],["긴 한 문장","문장 하나도 한도를 넘으면 추가 분할하거나 이유를 기록하고 격리합니다."]],"example":"제목: 출석 안내 > 지각과 결석\n본문: 수업 시작 후 10분까지...\nEmbedding Input: passage: 출석 안내 / 지각과 결석\n수업 시작 후 10분까지...","distinction":"제목은 입력에 추가한 문자열입니다. 본문 원문 Slice 범위에 제목 문자 수를 더하지 않습니다.","flow":[],"codes":[]},{"chapter":4,"id":"token-demo","title":"Heading·접두어를 추가하면 입력이 달라집니다","claim":"실제 Token 수는 브라우저에서 계산하지 않습니다. E5 Tokenizer로 검사할 정확한 문자열을 보여줍니다.","kind":"token-demo","focus":"embedding"},{"chapter":4,"id":"chunk-boundary-cases","title":"문장·목록·표를 한 Chunk로 보존하는 기준","claim":"실무 문서의 조건·예외·행·열 관계를 잘못 끊지 않도록 경계를 먼저 확인합니다.","kind":"table","focus":"embedding","headers":["블록","같이 남길 내용","잘못 나누면"],"rows":[["조건문","기준 시간 + 판정 결과","10분 초과가 어느 상태인지 모름"],["번호 목록","번호 + 항목 본문","다른 목록에 설명이 붙음"],["표","열 제목 + 행 값 + 단위","값이 다른 행·열로 연결"],["코드 블록","들여쓰기 + 줄 순서","실행 의미·예제가 훼손됨"]],"note":"고정 Character Window만 사용하면 이러한 경계가 잘릴 수 있어 Structure-aware 전략을 비교합니다.","codes":[]},{"chapter":4,"id":"overlap-tradeoff","title":"Overlap과 Chunk Size의 Trade-off","claim":"Chunk의 수와 중복량, 필요한 조건의 연결을 함께 비교해야 합니다.","kind":"table","focus":"embedding","headers":["설정","기대 효과","주의"],"rows":[["Overlap = 0","중복 적음","경계에서 조건 분리 가능"],["적절한 Overlap","인접 문맥 포함","저장·인코딩 대상 증가"],["큰 Overlap","넓은 문맥 반복","Top-k를 유사 Chunk가 차지할 수 있음"],["Structure-aware","문장·절·표 의미 유지","구조 추출 실패 시 추가 검증 필요"]],"note":"한 문서의 Chunk가 다른 문서의 내용을 겹침으로 섞지 않도록 출처 경계를 유지합니다.","codes":[]},{"chapter":4,"id":"practice-4","title":"실습 04 · Basic / Intermediate / Advanced","claim":"Basic / Intermediate / Advanced 중 자신의 수준에 맞는 한 단계를 선택합니다. 아래에서 실습 목표와 완료 기준을 확인하세요.","kind":"practice","focus":"embedding","levels":[["Basic (기본필수)","한 본문을 Character Window로 분할하고 시작·끝과 종료 조건을 검사합니다."],["Intermediate (응용)","다중 문서를 분할합니다. 실제 Tokenizer 측정은 python main.py --live-e5에서 수행하고, 기본 실행은 not_run으로 구분합니다."],["Advanced (심화)","Heading과 Chunk 경계를 검증하고 초과 입력을 재분할·격리합니다. 실제 Token 길이 검사는 --live-e5로 수행합니다."]],"output":"Chunk 본문 · Character Span · Overlap · 최종 Embedding 입력 길이"},{"chapter":4,"id":"quiz-4","title":"핵심 확인 · Chunking Strategies","claim":"정답을 보기 전에 먼저 근거를 말해보세요.","kind":"quiz","focus":"embedding","items":[["384차원 E5 모델은 384토큰까지만 받나요?","아닙니다. 출력 차원과 최대 입력 Token 수는 서로 다른 모델 속성입니다."],["청크에 Heading을 추가한 뒤에는 무엇을 검사하나요?","접두어·Heading·본문을 합친 최종 Embedding 입력 전체의 Token 길이를 검사합니다."],["마지막 청크가 원문 끝에 닿으면 겹친 꼬리를 한 번 더 만드나요?","아닙니다. 끝에 도달하면 종료합니다."]]},{"chapter":5,"id":"validate-first","title":"검색 가능한 Chunk가 되려면 검증을 통과해야 합니다","claim":"Embedding 생성 전에 자료의 원문 연결·빈 내용·위치·길이·중복·누락을 검사합니다.","kind":"concept","focus":"retriever","left":[["Span Contract","0 ≤ char_start < char_end ≤ len(clean_text), 그리고 Chunk text가 해당 Slice와 같아야 합니다."],["Token Contract","실제 최종 Embedding 입력이 모델 한도 내이고, Zero vector·NaN 등 비정상 벡터는 저장하지 않습니다."]],"right":[["Identity Contract","doc_id·source_version·unit_id·chunk_id가 원문과 대응해야 합니다."],["Failure Policy","검증 실패 자료는 정상 검색집합에 조용히 추가하지 않고 이유를 남겨 격리합니다."]],"example":"잘못된 예: text = \"10분 초과\"인데 clean_text[0:10] = \"10분까지 지각\"\n→ 같은 길이여도 본문 불일치로 실패","distinction":"검증 실패를 삭제로 표현하지 않습니다. 처리 실패와 원본 파일 삭제는 다른 사건입니다.","flow":[],"codes":[]},{"chapter":5,"id":"span-code","title":"중간 Span(text)을 CleanUnit과 대조합니다","claim":"문자 구간 검증은 분할 중간 Span에 적용합니다. 검증을 통과한 text가 최종 Chunk의 body로 들어갑니다.","kind":"code","focus":"retriever","codes":["span-code"],"left":"입력: 중간 Span(text) + 해당 clean_text","right":"출력: 일치 검증 / 구간 오류","note":""},{"chapter":5,"id":"coverage-concept","title":"Coverage는 고유한 문자 위치를 계산합니다","claim":"청크의 길이를 모두 더하면 Overlap이 중복 계산됩니다. Coverage는 해당 CleanUnit이 덮인 위치의 합집합 비율입니다.","kind":"concept","focus":"retriever","left":[["Coverage","덮인 고유 위치 / 검사 대상 clean_text 길이입니다."],["Duplicate","같은 chunk_id·같은 Span이 두 번 생성된 오류는 Coverage 100%와 동시에 존재할 수 있습니다."]],"right":[["Overlap","의도한 중첩이며 Duplicate ID 오류와 구분합니다."],["한계","Coverage 100%는 PDF Parsing 누락이나 Cleaning 단계의 의미 손실까지 검증하지 않습니다."]],"example":"전체 20자, 구간 [0,8), [6,14), [12,20)\nChunk 길이 합 24자 · 고유 Coverage 20/20=100% · 반복 추가량 20%","distinction":"같은 출처의 실제 반복 문장과 서로 다른 출처의 동일 문장을 무조건 삭제하지 않습니다.","flow":[],"codes":[]},{"chapter":5,"id":"coverage-demo","title":"Coverage·중복·누락을 직접 비교합니다","claim":"구간의 합집합으로 계산하며 실제 문서 내용의 의미 보존 점수는 아닙니다.","kind":"coverage-demo","focus":"retriever"},{"chapter":5,"id":"coverage-code","title":"Coverage를 구간 병합으로 계산합니다","claim":"긴 문서에서 모든 문자 위치를 Python set에 추가하지 않고 구간 병합을 사용합니다.","kind":"code","focus":"retriever","codes":["coverage-code"],"left":"입력: 전체 길이·유효 Span 목록","right":"출력: Coverage · Missing Span","note":""},{"chapter":5,"id":"chunk-errors","title":"검증 실패를 원인별로 분류합니다","claim":"같은 재시도로 모든 오류를 해결하지 않습니다.","kind":"table","focus":"retriever","headers":["검사 실패","원인 위치","조치"],"rows":[["empty_chunk","Parsing / Cleaning","원문과 변경 규칙 확인"],["span_mismatch","Cleaning Version / Offset","동일 기준 텍스트로 복원"],["too_many_tokens","Chunker / 접두어","재분할 또는 격리"],["duplicate_chunk_id","Chunk ID 생성","동일 ID의 중복 처리 검토"],["missing_source","Metadata 전달","출처 연결 복구 전 저장 보류"]],"note":"모델이 무조건 잘못된 것은 아닙니다. 검색 품질 불량이면 파싱·분할·출처를 먼저 대조합니다.","codes":[]},{"chapter":5,"id":"validate-all","title":"인덱싱 전 검증 결과표를 만듭니다","claim":"Coverage·길이·메타데이터 검사를 통과한 Chunk만 다음 단계로 넘깁니다.","kind":"code","focus":"retriever","codes":["validate-all"],"left":"입력: CleanUnit과 Chunk 목록","right":"출력: 통과·격리·실패 이유 기록","note":""},{"chapter":5,"id":"boundary-quality","title":"조건과 결과가 같은 청크에 있어야 합니다","claim":"구조 검사 통과만으로 검색 질문에 필요한 의미가 모두 남았다고 판단하지 않습니다.","kind":"concept","focus":"retriever","left":[["사람이 확인","\"15분 늦으면?\"에 답하려면 \"10분 초과\"와 \"결석\" 조건이 함께 읽혀야 합니다."],["정량 검증","길이·위치·Coverage는 Python으로 검사할 수 있습니다."]],"right":[["정성 검증","원문에서 숫자·부정·예외·조건을 사람이 대조합니다."],["19일의 경계","Retrieval의 Recall@k·MRR·nDCG 정식 평가와 생성 Faithfulness 평가는 25일에 확대합니다."]],"example":"검색 결과: 출석 안내의 한 청크\n확인: 10분 초과 → 결석이라는 관계가 intact한가?","distinction":"실제 정책이 아닌 가상 교육센터의 수업 예제입니다.","flow":[],"codes":[]},{"chapter":5,"id":"practice-5","title":"실습 05 · Basic / Intermediate / Advanced","claim":"Basic / Intermediate / Advanced 중 자신의 수준에 맞는 한 단계를 선택합니다. 아래에서 실습 목표와 완료 기준을 확인하세요.","kind":"practice","focus":"retriever","levels":[["Basic (기본필수)","Span 범위·본문 Slice 일치 여부를 검사합니다."],["Intermediate (응용)","Coverage·Missing Span·중복 ID와 처리 건수를 집계합니다."],["Advanced (심화)","복합 실패를 격리·수정·회귀 검사하고 청크 경계 의미를 대조합니다."]],"output":"검증 보고서 · 누락 구간 · 오류 유형 · 사람이 확인한 근거"},{"chapter":5,"id":"quiz-5","title":"핵심 확인 · Chunk Validation","claim":"정답을 보기 전에 먼저 근거를 말해보세요.","kind":"quiz","focus":"retriever","items":[["Coverage 100%이면 원본 PDF 내용이 완전 보존됐나요?","아닙니다. 기준은 해당 clean_text이며 앞선 Parsing·Cleaning 오류는 별도로 확인해야 합니다."],["의도한 Overlap을 오류 중복으로 지우면 되나요?","아닙니다. 같은 ID 중복과 설계상 Overlap은 다른 개념입니다."],["Token 한도를 넘는 청크를 그냥 잘라서 저장해도 되나요?","아닙니다. 재분할하거나 처리 상태를 격리해야 합니다."]]},{"chapter":6,"id":"metadata-meaning","title":"Metadata는 근거의 위치와 처리 조건입니다","claim":"원문과 벡터만 보관하면 특정 Chunk가 어느 문서·버전·페이지에서 나왔는지 확인하기 어렵습니다.","kind":"concept","focus":"retriever","left":[["원문 연결","doc_id·source_version·source_uri·source_locator로 문서를 다시 찾습니다."],["Chunk 위치","unit_id·char_start·char_end·chunk_index를 함께 보관합니다."]],"right":[["처리 재현","pipeline_version·embedding_contract·cleaner_version으로 생성 조건을 식별합니다."],["검색 조건","category·현재 공개 버전을 WHERE 조건으로 사용합니다."]],"example":"DOC-ATTEND / v1 / sec-1 / [0,40)\nsource_locator: attendance.md#지각-기준\npipeline_version: ingest-e5-v1","distinction":"source_locator와 Offset은 다른 위치 체계입니다. 실제 문서 페이지·Heading과 정제 텍스트의 Slice를 분리합니다.","flow":[],"codes":[]},{"chapter":6,"id":"identity-fields","title":"doc_id · chunk_id · content_hash의 역할을 구분합니다","claim":"식별자의 범위와 본문 동일성은 같은 것이 아닙니다.","kind":"table","focus":"retriever","headers":["필드","무엇을 구분하나","예시"],"rows":[["doc_id","문서 자체","DOC-ATTEND"],["source_version","원문 개정","v1 / v2"],["unit_id","절·페이지","sec-1 / page-2"],["chunk_id","한 버전·처리조건의 청크","결정적으로 생성한 ID"],["content_hash","본문 바이트가 같은지","SHA-256(clean chunk text)"]],"note":"같은 본문이 다른 문서에 있으면 content_hash가 같을 수 있으므로 다른 출처의 청크를 자동 삭제하지 않습니다.","codes":[]},{"chapter":6,"id":"metadata-record","title":"Chunk Metadata를 명시적으로 구성합니다","claim":"page_number는 PDF처럼 실제 페이지가 있을 때만 사용합니다.","kind":"code","focus":"retriever","codes":["metadata-record"],"left":"입력: 문서·ParsedUnit·Chunk","right":"출력: 출처·버전·Offset·분류","note":""},{"chapter":6,"id":"chunk-id","title":"같은 입력에서 같은 Chunk ID를 생성합니다","claim":"영속 ID에 Python 내장 hash()를 사용하지 않고 안정적인 직렬화와 SHA-256을 사용합니다.","kind":"code","focus":"retriever","codes":["chunk-id"],"left":"입력: 문서·버전·단위·Span·pipeline_version","right":"출력: 결정적 chunk_id","note":""},{"chapter":6,"id":"where-order","title":"Metadata Filter는 Top-k 이전에 검색 범위를 정합니다","claim":"WHERE category = ... AND 공개 버전 조건을 적용해 대상 청크에서 가까운 k개를 구합니다.","kind":"concept","focus":"retriever","left":[["필터 후 Top-k","학사 청크만 대상으로 거리 순위를 정합니다."],["Top-k 후 필터","전체 상위 k개를 먼저 고른 뒤 학사만 남기면 원래 대상 후보가 누락될 수 있습니다."]],"right":[["현재 공개 버전","source_version과 pipeline_version을 함께 확인합니다."],["권한 조건","category는 콘텐츠 분류입니다. 실제 사용자 권한·문서 접근 가능성은 별도 정책입니다."]],"example":"SELECT ... FROM chunks\nWHERE category = %s AND is_current = TRUE\nORDER BY embedding <=> %s LIMIT %s","distinction":"ANN 인덱스에서는 필터와 후보 탐색의 실제 실행 경로를 별도로 확인해야 합니다.","flow":[],"codes":[]},{"chapter":6,"id":"metadata-demo","title":"Category·Version Filter가 결과를 바꿉니다","claim":"실제 pgvector 서버를 호출하지 않고 가상 데이터의 조건 필터를 JavaScript로 수행합니다.","kind":"metadata-demo","focus":"retriever"},{"chapter":6,"id":"filtered-sql","title":"PostgreSQL에서 공개 버전과 Category를 함께 필터링합니다","claim":"Psycopg의 %s 자리표시는 pgAdmin에 그대로 실행하는 SQL이 아닙니다.","kind":"code","focus":"retriever","codes":["filtered-sql"],"left":"입력: category, query_vector, k","right":"출력: 현재 공개 버전의 청크·출처·거리","note":""},{"chapter":6,"id":"practice-6","title":"실습 06 · Basic / Intermediate / Advanced","claim":"Basic / Intermediate / Advanced 중 자신의 수준에 맞는 한 단계를 선택합니다. 아래에서 실습 목표와 완료 기준을 확인하세요.","kind":"practice","focus":"retriever","levels":[["Basic (기본필수)","Chunk에 문서·버전·원문 위치를 붙이고 category로 선택합니다."],["Intermediate (응용)","필수 Metadata와 현재 공개 버전 조건을 검사합니다."],["Advanced (심화)","잘못된 Offset·다른 Pipeline Version 혼입을 탐지하고 정상 검색 후보를 재확인합니다."]],"output":"Chunk Metadata · Filter 전후 후보 · 공개 버전 검사"},{"chapter":6,"id":"quiz-6","title":"핵심 확인 · Metadata & Filtering","claim":"정답을 보기 전에 먼저 근거를 말해보세요.","kind":"quiz","focus":"retriever","items":[["본문이 같은 두 문서의 청크는 하나로 삭제해도 되나요?","아닙니다. 출처가 다를 수 있어 별도 정책과 근거가 필요합니다."],["Category Filter가 곧 접근 권한 검사인가요?","아닙니다. 권한은 서버에서 별도로 검증해야 합니다."],["source_version과 pipeline_version은 같은 것인가요?","아닙니다. 하나는 원문 개정, 다른 하나는 처리·Embedding 설정을 구분합니다."]]},{"chapter":7,"id":"indexing-vs-index","title":"Indexing Pipeline과 DB Index는 다릅니다","claim":"문서 인덱싱은 수집부터 검증·저장·검색 대상 공개까지의 과정이고, HNSW는 검색 성능을 위한 DB 내부 자료구조입니다.","kind":"concept","focus":"index","left":[["Document Indexing","원본 → ParsedUnit → CleanUnit → Chunk → Embedding → pgvector 저장·공개."],["Database Index","B-tree는 일반 필터, HNSW는 ANN Vector Search를 보조합니다."]],"right":[["전날 재사용","PostgreSQL 18.6에 준비한 pgvector와 E5-small 모델을 그대로 사용합니다."],["오늘 추가","문서·청크·버전·오류 상태를 저장하고 올바른 현재 판을 선택합니다."]],"example":"CREATE TABLE ... embedding vector(384)\nCREATE INDEX ... hnsw (embedding vector_cosine_ops) -- 필요 시","distinction":"작은 교육 데이터에서는 Exact Search로 기능을 먼저 검증합니다. 인덱스 생성이 Parsing·Chunk 검증을 대신하지 않습니다.","flow":[],"codes":[]},{"chapter":7,"id":"sql-schema","title":"문서·버전·청크를 PostgreSQL에 저장합니다","claim":"기존 데이터를 보존하고 실습별 전용 Schema에서 문서·버전·청크 3개 테이블을 분리합니다.","kind":"code","focus":"index","codes":["sql-schema"],"left":"실제 준비: Git Bash → python tools/setup_db.py --apply","right":"4개 전용 Schema · ingest_documents / ingest_versions / ingest_chunks","note":""},{"chapter":7,"id":"embed-and-save","title":"검증 통과 Chunk만 E5로 Embedding합니다","claim":"접두어와 Normalize 옵션을 전날과 동일하게 유지합니다.","kind":"code","focus":"index","codes":["embed-and-save"],"left":"입력: 검증된 Chunk의 embedding_text","right":"출력: 384차원 벡터와 1:1 대응","note":""},{"chapter":7,"id":"upsert-version","title":"UPSERT는 이전 판의 사라진 Chunk를 자동 삭제하지 않습니다","claim":"같은 Chunk ID의 재실행과 문서 본문 개정은 구분해야 합니다.","kind":"concept","focus":"index","left":[["동일 입력 재실행","doc_id·source_version·pipeline_version·Span이 같으면 결과가 불필요하게 늘지 않습니다."],["원문 개정","source_version을 새로 부여하고 v2 Chunk·Embedding을 별도로 준비합니다."]],"right":[["처리 규칙 변경","pipeline_version을 새로 부여해 기존 Offset·벡터와 혼합하지 않습니다."],["공개 판 선택","현재 포인터가 v2를 가리키면 v1에서만 존재하던 Chunk는 검색 결과에서 제외합니다."]],"example":"v1: Chunk A, B, C\nv2: Chunk A, B\n준비 중: v1 검색 유지 → 검증 완료: v2 A,B만 검색","distinction":"위 A·B·C → A·B는 청크가 실제로 줄어드는 가상 사례입니다. 실습의 DOC-ATTEND v1·v2는 각각 2개 청크이며 동일 Markdown Parser로 처리한 뒤 이전 버전이 검색에서 제외되는지를 검증합니다.","flow":[],"codes":[]},{"chapter":7,"id":"sql-publish","title":"완전 적재를 검증하고 한 Transaction에서 새 버전을 공개합니다","claim":"새 버전의 Chunk 수를 확인한 다음 ready와 현재 포인터를 같은 Transaction에서 변경합니다.","kind":"code","focus":"index","codes":["sql-publish"],"left":"입력: Staging이 끝난 doc_id·source_version·pipeline_version","right":"행 잠금·expected_count 확인 → ready → 공개 포인터 변경","note":""},{"chapter":7,"id":"version-demo","title":"v1 / v2 공개 전환과 실패를 시연합니다","claim":"청크 수가 줄어드는 가상 시나리오의 상태 전환 시연입니다. 실습 v1·v2는 각각 2개 Chunk이며 실제 DB 실행 화면은 아닙니다.","kind":"version-demo","focus":"index"},{"chapter":7,"id":"sql-retrieve","title":"현재 공개된 Chunk만 Top-k 검색합니다","claim":"Psycopg Connection은 register_vector(conn)를 적용한 후 벡터를 전달합니다.","kind":"code","focus":"index","codes":["sql-retrieve"],"left":"입력: E5 query embedding·category·k","right":"출력: Integer citation_id + Chunk ID·본문·Locator","note":""},{"chapter":7,"id":"practice-7","title":"실습 07 · Basic / Intermediate / Advanced","claim":"Basic / Intermediate / Advanced 중 자신의 수준에 맞는 한 단계를 선택합니다. 아래에서 실습 목표와 완료 기준을 확인하세요.","kind":"practice","focus":"index","levels":[["Basic (기본필수)","Chunk와 citation_id 결과 구조를 확인합니다. 기본 실행은 저장 준비만 수행하며 실제 E5·pgvector 저장·조회는 --live-db에서 확인합니다."],["Intermediate (응용)","기본 실행은 Chunk를 준비합니다. --live-db에서 PostgreSQL에 Staging·Publish하고 현재 버전을 검색합니다."],["Advanced (심화)","v1과 개정 v2를 동일 Markdown Parser로 처리하고, --live-db에서 Rollback·재시도·이전 버전 검색 제외를 검증합니다."]],"output":"기본 실행: prepared_only_not_db / 실제 실행(--live-db): 현재 버전·검색·Rollback 검증"},{"chapter":7,"id":"quiz-7","title":"핵심 확인 · pgvector Indexing Pipeline","claim":"정답을 보기 전에 먼저 근거를 말해보세요.","kind":"quiz","focus":"index","items":[["UPSERT로 새 입력에 없는 Chunk가 자동 삭제되나요?","아닙니다. 공개 버전 선택 또는 별도 삭제 처리가 필요합니다."],["E5 Embedding 동안 긴 DB Transaction을 유지해야 하나요?","아닙니다. Embedding·검증 후 필요한 DB 변경을 트랜잭션으로 묶습니다."],["HNSW가 있으면 문서 Parsing도 끝난 건가요?","아닙니다. 검색 Index와 문서 처리 Pipeline은 별개입니다."]]},{"chapter":8,"id":"full-flow","title":"하나의 문서를 끝까지 추적합니다","claim":"원본 파일에서 추출한 정보가 최종 pgvector 검색 결과의 Chunk·출처까지 연결되어야 합니다.","kind":"concept","focus":"context","left":[["입력과 전처리","DOC-ATTEND의 Raw File → ParsedUnit → CleanUnit → Chunk."],["품질 검사","각 Chunk의 Span·Token 길이·Coverage·Metadata·Embedding 계약 확인."]],"right":[["저장·공개","새 원문 버전과 처리 버전을 staging → ready → published 포인터로 관리합니다."],["검색 확인","질의의 query Embedding으로 Top-k를 조회하고 Chunk·출처·원문 위치를 대조합니다."]],"example":"DOC-ATTEND / v1 / sec-1 / [start,end)\npassage: ... → E5-small → vector(384)\npgvector → citation_id + chunk_id + body + source_locator","distinction":"오늘 반환값은 검색 원문과 출처입니다. 생성형 답변 API는 20일에 완성합니다.","flow":[],"codes":[]},{"chapter":8,"id":"pipeline-code","title":"Python Pipeline의 단계별 함수를 연결합니다","claim":"실습 coursekit 함수와 같은 입력 계약으로 Parsing → Cleaning → Chunking → 검증 → E5 → Staging·Publish를 연결합니다.","kind":"code","focus":"context","codes":["pipeline-code"],"left":"입력: 문서·Config·동일 E5 모델","right":"출력: 문서별 처리 Report 및 검색 가능한 Chunk","note":""},{"chapter":8,"id":"pipeline-demo","title":"기본 5개 문서 + 오류 검증 1건의 처리 흐름","claim":"가상 사례의 처리 목표를 시뮬레이션합니다. 실제 파일·DB를 실행한 성공 결과가 아닙니다.","kind":"pipeline-demo","focus":"context"},{"chapter":8,"id":"failure-policy","title":"실무 Pipeline은 오류의 범위를 구분합니다","claim":"문서 1개의 처리 실패와 공통 인프라 실패는 같은 정책으로 처리하지 않습니다.","kind":"table","focus":"context","headers":["문제","대상","권장 처리"],"rows":[["needs_ocr","스캔 PDF 1건","해당 문서 보류·원문 유지"],["too_many_tokens","긴 청크","재분할 또는 격리 후 나머지 확인"],["DB 인증 실패","전체 저장 작업","공개 전환 중단·비밀 값 로그 금지"],["같은 입력 재실행","기존 문서","멱등성 확인·중복 방지"],["문서 v2 실패","해당 새 버전","현재 v1 공개 유지"]],"note":"보안·삭제 요청은 단순 인덱싱 실패보다 우선할 수 있으며, 접근 철회된 자료를 과거 정상 버전이라며 계속 노출해서는 안 됩니다.","codes":[]},{"chapter":8,"id":"citation-bridge","title":"내일 RAG가 받을 Retriever Contract","claim":"검색 결과는 본문뿐 아니라 어떤 원문에서 왔고 이번 Context에 포함됐는지를 함께 설명해야 합니다.","kind":"concept","focus":"context","left":[["Retriever Output","citation_id: 양의 정수, chunk_id: 문자열, body, doc_id, source_locator, source_version, score/거리."],["기존 출력 계약","11/16 KnowledgeAnswer.source_ids는 list[int]이므로 문자열 Chunk ID를 그대로 넣지 않습니다."]],"right":[["명시적 ID Mapping","서버의 citation_id ↔ chunk_id·source_locator 매핑을 유지합니다."],["다음 단계","11/20에 Retrieved Chunk → Context Builder → Prompt → OpenAI Responses API → Validator를 연결합니다."]],"example":"검색 결과: {citation_id: 201, chunk_id: \"...\", body: \"...\"}\nContext에 201을 실제 포함한 경우만 source_ids:[201] 허용","distinction":"201은 설명용 식별자입니다. 실제 DB가 반환한 ID와 자동으로 동일하다고 가정하지 않습니다.","flow":[],"codes":[]},{"chapter":8,"id":"practice-8","title":"실습 08 · Basic / Intermediate / Advanced","claim":"Basic / Intermediate / Advanced 중 자신의 수준에 맞는 한 단계를 선택합니다. 아래에서 실습 목표와 완료 기준을 확인하세요.","kind":"practice","focus":"context","levels":[["Basic (기본필수)","제공된 함수로 TXT 1건을 처리하고 Chunk·출처를 출력합니다."],["Intermediate (응용)","기본 5문서와 지원 외 형식 1건을 합친 6건의 상태(parsed 4·needs_ocr 1·unsupported 1)를 집계합니다."],["Advanced (심화)","오프라인으로 6건을 준비하고, --live-db에서 E5 저장·v2 개정·실패 Rollback과 검색 버전을 검증합니다."]],"output":"기본 실행: 6건 상태·Prepared Chunk / 실제 실행(--live-db): 공개 버전·검색 출처·Citation ID"},{"chapter":8,"id":"quiz-8","title":"핵심 확인 · End-to-End Integration","claim":"정답을 보기 전에 먼저 근거를 말해보세요.","kind":"quiz","focus":"context","items":[["DOC-SCAN을 정상 인덱싱으로 보고해도 되나요?","아닙니다. 텍스트 추출을 확인하고 needs_ocr 상태를 분리합니다."],["검색한 Chunk 문자열 ID를 바로 KnowledgeAnswer.source_ids에 넣을 수 있나요?","아닙니다. 해당 계약은 정수 출처 ID이므로 명시적 매핑이 필요합니다."],["오늘의 파이프라인이 생성형 답변까지 완료했나요?","아닙니다. 원문·벡터·출처를 준비하고 검색을 확인합니다. 생성형 답변은 20일에 연결합니다."]]}],"codes":{"collect":{"title":"허용하는 로컬 원문 파일 열거","lang":"python","raw":"from pathlib import Path\nROOT = Path(__file__).resolve().parent\nsource_dir = ROOT / \"data\" / \"raw\"\nif not source_dir.is_dir():\n    raise FileNotFoundError(source_dir)\nallowed = {\".txt\", \".md\", \".html\", \".pdf\"}\nfiles = sorted(p for p in source_dir.iterdir() if p.is_file()\n               and p.suffix.lower() in allowed)\nfor path in files:\n    print(path.name, path.stat().st_size)","desc":"하위 폴더는 탐색하지 않습니다. 지원하지 않는 파일도 Manifest에는 별도 상태로 기록해야 합니다. 강의용 독립 예제는 이 .py 파일을 mentee/mentor 루트에 둘 때의 경로입니다. 실습 하위 폴더에서는 coursekit.io.DATA를 사용합니다.","independent":true,"html_lines":["<span class=\"py-keyword\">from</span> pathlib <span class=\"py-keyword\">import</span> Path","ROOT <span class=\"py-keyword\">=</span> Path(__file__)<span class=\"py-keyword\">.</span>resolve()<span class=\"py-keyword\">.</span>parent","source_dir <span class=\"py-keyword\">=</span> ROOT <span class=\"py-keyword\">/</span> <span class=\"py-string\">&quot;data&quot;</span> <span class=\"py-keyword\">/
