const D24_VOCAB={"what-ingest":[{"name":"Document Ingestion","definition":"문서를 수집하고 읽은 뒤, 검색용 Chunk·Metadata·Embedding으로 변환하는 데이터 준비 과정입니다.","full":"Document Ingestion Pipeline","example":"원본 PDF → Parsing → Cleaning → Chunking → pgvector 저장","why":"11/20의 RAG가 읽을 근거를 먼저 만들기 위해 필요합니다."}],"documents":[{"name":"UTF-8","definition":"Unicode(전 세계 문자를 고유한 코드 번호로 나타내는 표준)의 글자를 파일 bytes로 표현하는 대표적인 Encoding 방식입니다.","full":"Unicode Transformation Format – 8-bit","example":"완성형 한글 ‘가’ → UTF-8 3 bytes","why":"TXT를 읽을 때 문자 수와 바이트 크기, Encoding 오류를 구분하기 위해 필요합니다."},{"name":"TXT / Markdown / HTML / PDF","definition":"TXT는 별도 서식 없이 문자로 된 문서, Markdown은 #·목록 등 간단한 문법을 쓰는 텍스트 문서, HTML은 웹페이지의 태그 기반 구조, PDF는 화면·인쇄 배치를 보존하는 문서 형식입니다.","full":"Text · HyperText Markup Language · Portable Document Format","example":"TXT: 과제 안내 / Markdown: 출석 규정 / HTML: 시설 안내 / PDF: 상담 안내","why":"파일 형식마다 사용해야 할 Parser와 보존할 구조가 다릅니다."},{"name":"OCR","definition":"이미지에 그려진 글자를 인식해 문자 데이터로 변환하는 기술입니다. PDF에 글자가 ‘보인다’는 사실만으로 추출 가능한 텍스트가 있는 것은 아닙니다.","full":"Optical Character Recognition","example":"스캔한 출석 안내문 → OCR → 문자열","why":"스캔 PDF를 무조건 정상 Parsing으로 처리하지 않기 위해 구분합니다."}],"raw-vs-derived":[{"name":"Raw File / Derived Data","definition":"Raw File은 수집한 원본 파일입니다. Derived Data는 이 원본을 읽고 정제·분할해 새로 만든 데이터입니다.","example":"원본 assignment.txt는 보존하고 clean_text·Chunk를 따로 생성","why":"처리 규칙을 수정해도 원본에서 다시 시작할 수 있습니다."},{"name":"bytes / SHA-256","definition":"byte는 8bit의 데이터 단위입니다. SHA-256은 입력 bytes를 고정된 256bit 해시 값으로 만드는 함수로, 파일 바이트의 변경 여부를 비교하는 데 사용합니다.","full":"Secure Hash Algorithm 256-bit","example":"바이트 한 개가 달라지면 일반적으로 SHA-256 결과도 달라집니다.","why":"SHA-256은 문장의 의미 유사도나 원문 신뢰도를 판정하지 않습니다."}],"file-list":[{"name":"pathlib · Path","definition":"Python 표준 라이브러리의 경로 관리 도구입니다. Path(__file__).resolve().parent는 실행 중인 .py 파일이 있는 폴더를 기준으로 경로를 만듭니다.","example":"ROOT / \"data\" / \"raw\" → 원문 폴더","why":"VS Code 실행 위치가 달라도 같은 파일을 가리키기 위해 사용합니다."},{"name":"File extension","definition":"파일명 끝의 .txt, .md, .html, .pdf 같은 확장자입니다. 사용할 Parser를 고르는 단서는 되지만 실제 파일 형식을 보증하지 않습니다.","example":"파일 이름만 .pdf로 바꿔도 내부 파일 형식은 변하지 않습니다.","why":"실제 Parsing 성공 여부와 별도로 확인해야 합니다."}],"manifest":[{"name":"Manifest","definition":"이번 실행에서 어떤 문서를 처리할지, 어디서 왔고 어떤 상태인지 기록한 목록입니다.","example":"doc_id · source_uri · source_version · raw_sha256 · status","why":"실패·보류된 문서도 남겨 누락을 추적합니다."},{"name":"doc_id / source_version","definition":"doc_id는 문서 자체의 식별자, source_version은 그 문서 내용의 특정 판을 가리키는 값입니다. 파일명·SHA-256과 역할이 다릅니다.","example":"DOC-ATTEND의 출석 규정이 바뀌면 doc_id는 유지하고 v1 → v2 기록","why":"같은 문서의 개정 이력을 검색 결과에서 구분합니다."}],"parse-definition":[{"name":"Parsing / Text Extraction","definition":"Parsing은 파일의 규칙과 구조를 해석하는 과정입니다. Text Extraction은 그 결과에서 검색할 문자열을 꺼내는 작업으로, Parsing의 일부입니다.","example":"HTML 표: 행과 열을 읽기 → 텍스트로 꺼낼 때도 관계 보존","why":"문자만 나왔다고 제목·표의 의미가 보존되지는 않습니다."},{"name":"ParsedUnit","definition":"Parser가 만든 ‘문서 안의 처리 단위’를 나타내는 교육용 레코드 이름입니다.","example":"PDF page-1 → {doc_id, unit_id, page_number, raw_text}","why":"문서의 어느 페이지·절을 읽었는지 나중에 확인합니다."}],"parser-matrix":[{"name":"Parser Library","definition":"각 파일 형식의 내부 구조를 읽는 코드나 라이브러리입니다. PDF는 pypdf, HTML은 Beautiful Soup처럼 형식에 맞는 도구를 사용합니다.","example":"TXT: bytes.decode / HTML: BeautifulSoup / PDF: PdfReader","why":"확장자만 보고 동일한 문자열 함수로 모든 형식을 처리하지 않습니다."}],"decode":[{"name":"UTF-8","definition":"Unicode 문자와 파일 bytes를 연결하는 가변 길이 Encoding입니다. 기본 라틴 문자 대부분은 1byte, 한글 ‘가’는 3bytes, 일부 이모지는 4bytes로 저장됩니다.","full":"Unicode Transformation Format – 8-bit","example":"Python의 len(\"가\")는 문자 수 1, len(\"가\".encode(\"utf-8\"))은 3입니다.","why":"문자 수와 파일 바이트 크기를 혼동하지 않고 TXT를 정확히 읽기 위해 필요합니다.","code":"text = \"가\"\nraw = text.encode(\"utf-8\")   # str → bytes\nprint(len(text), len(raw))  # 1 3\nprint(raw.decode(\"utf-8\")) # 가"},{"name":"Encoding / Decoding","definition":"Encoding은 문자열(str)을 규칙에 따라 bytes로 바꾸는 일이고, Decoding은 bytes를 같은 규칙으로 문자열로 해석하는 일입니다.","example":"\"가\".encode(\"utf-8\") / raw.decode(\"utf-8\")","why":"실제 파일의 Encoding과 다르면 UnicodeDecodeError가 발생할 수 있습니다."}],"markdown":[{"name":"Markdown / Heading","definition":"Markdown은 # 같은 문법으로 제목·목록·코드 블록을 나타내는 문서 형식입니다. Heading은 #·##처럼 표시한 제목이며, Heading Path는 상위 제목에서 현재 소제목까지의 경로입니다.","example":"# 출석 안내 → ## 지각과 결석","why":"본문만 저장해 제목 소속을 잃지 않도록 합니다."}],"html-parse":[{"name":"Beautiful Soup / HTML element","definition":"Beautiful Soup은 HTML 문서를 태그 구조로 읽는 Python Parser 라이브러리입니다. <main>은 페이지 주요 내용 영역을 표시하는 HTML element 중 하나입니다.","example":"soup.select_one(\"main\") → 주요 영역 선택","why":"메뉴나 사이트 공통 영역의 텍스트가 검색 본문에 섞이는 것을 줄입니다."},{"name":"get_text()","definition":"HTML element 아래에 있는 글자를 결합해 문자열로 돌려주는 메서드입니다. 표의 행·열 의미는 자동 보장하지 않습니다.","example":"<th>시설</th><td>도서관</td> → 글자만 꺼내면 관계 소실 가능","why":"표는 행·열을 따로 읽거나 원문과 대조해야 합니다."}],"pdf-parse":[{"name":"pypdf / PdfReader","definition":"pypdf는 PDF 구조와 텍스트층을 읽는 Python 라이브러리입니다. PdfReader로 문서를 열고 page.extract_text()로 페이지별 문자열을 얻습니다.","example":"page_number=2 / source_locator=\"career.pdf#page=2\"","why":"문서와 페이지별 출처를 잃지 않기 위해 사용합니다."},{"name":"Source Locator","definition":"원본에서 해당 텍스트를 다시 찾아볼 수 있도록 저장한 위치 정보입니다.","example":"career.pdf#page=2, attendance.md#지각-결석","why":"뒤의 Citation(출처 표시) 단계에서 근거를 다시 확인할 수 있습니다."}],"pdf-limit":[{"name":"Text PDF / Scanned PDF / OCR Text Layer","definition":"Text PDF는 선택·추출 가능한 문자 데이터가 있고, Scanned PDF는 페이지가 이미지 중심입니다. OCR Text Layer가 있는 PDF는 이미지 위·뒤에 인식 결과의 문자 데이터가 함께 있을 수 있습니다.","example":"스캔 PDF에 글자가 보여도 extract_text()가 비어 있을 수 있습니다.","why":"문자 추출 성공, 읽기 순서 정확성, OCR 정확성을 서로 구분합니다."}],"cleaning-why":[{"name":"Text Cleaning","definition":"Parsing 후 텍스트의 불필요한 형식 차이를 줄이는 과정입니다. 문장의 의미를 바꾸지 않는 것이 목표입니다.","example":"\"출석   안내\" → \"출석 안내\"; \"제출 불가\"는 그대로 유지","why":"숫자·부정어·조건이 없어지면 잘못된 검색 근거가 만들어집니다."},{"name":"CRLF / CR / LF","definition":"줄바꿈을 표현하는 제어 문자입니다. Windows 텍스트는 주로 CRLF(\\r\\n), 다른 환경에서는 LF(\\n)를 쓰며, CR(\\r)만 있는 경우도 있습니다.","full":"Carriage Return / Line Feed","example":"\"A\\r\\nB\" → Cleaning 뒤 \"A\\nB\"","why":"플랫폼별 줄바꿈 차이를 통일하되 문단 사이 빈 줄은 보존합니다."}],"normalization":[{"name":"Unicode Normalization","definition":"겉으로 같은 글자가 서로 다른 코드포인트 순서로 표현될 때 비교하기 쉽게 만드는 표준 변환입니다. NFC와 NFKC는 변환 범위가 다릅니다.","example":"‘ᄀ’+‘ᅡ’와 ‘가’는 표현이 달라도 같은 글자로 취급될 수 있습니다.","why":"원문을 보존하고 검색용 Clean Text의 변환 규칙을 기록합니다."},{"name":"NFC","definition":"Unicode에서 정준적으로 동등한 표현을 분해한 뒤 가능한 경우 다시 조합하는 정규화 형식입니다. 호환 기호의 모양 차이는 일반적으로 보존합니다.","full":"Normalization Form C · Canonical Decomposition + Canonical Composition","example":"ᄀ + ᅡ → 가 (두 자모의 조합)","why":"이번 일반 본문 Cleaning의 기본 선택입니다.","code":"import unicodedata\nprint(unicodedata.normalize(\"NFC\", \"가\"))\n# 가"},{"name":"NFKC","definition":"정준 등가뿐 아니라 호환 관계의 문자도 분해하고 다시 조합하는 형식입니다. 동그라미 숫자·위첨자 등의 표기가 일반 문자로 바뀔 수 있습니다.","full":"Normalization Form KC · Compatibility Decomposition + Canonical Composition","example":"① → 1, ² → 2","why":"표기가 중요한 번호·지수·단위를 훼손할 수 있어 무조건 적용하지 않습니다.","code":"import unicodedata\nprint(unicodedata.normalize(\"NFKC\", \"①\"))\n# 1\nprint(unicodedata.normalize(\"NFKC\", \"²\"))\n# 2"}],"clean-code":[{"name":"Regular Expression (Regex)","definition":"문자열에서 특정 패턴을 찾거나 바꾸는 표현식입니다. `r\"[ \\t]+\"`는 공백·탭이 연속된 부분을 뜻합니다.","example":"re.sub(r\"[ \\t]+\", \" \", line)","why":"가로 공백만 축소하고 줄바꿈은 남기는 Cleaning에 사용합니다."},{"name":"strip()","definition":"문자열 양 끝의 공백을 제거하는 Python 메서드입니다.","example":"\"  출석  \".strip() → \"출석\"","why":"코드 들여쓰기나 정렬된 표에는 부적절할 수 있어 일반 본문에 한정합니다."}],"offsets":[{"name":"Offset / Span","definition":"Offset은 기준 문자열에서의 문자 위치이고, Span은 시작과 끝으로 표시한 연속 구간입니다. Python Slice `text[start:end]`는 시작을 포함하고 끝을 제외합니다.","example":"\"가나다 라마바\"[4:7] → \"라마바\"","why":"Chunk 본문이 어떤 CleanUnit의 어느 위치에서 왔는지 확인합니다."},{"name":"Source Locator vs Character Offset","definition":"source_locator는 원본 PDF의 페이지·Markdown 제목 등 사람이 원문을 찾는 정보이고, char_start/end는 정제한 clean_text 내부의 문자 위치입니다.","example":"career.pdf#page=2 ≠ clean_text[4:7]","why":"정제 후 위치를 원본 PDF의 바이트 위치나 화면 좌표로 오해하지 않습니다."}],"clean-record":[{"name":"Idempotency","definition":"같은 입력에 같은 함수를 다시 적용해도 결과가 달라지지 않는 성질입니다.","example":"clean_prose(clean_prose(text)) == clean_prose(text)","why":"Cleaning 규칙이 반복 실행 때 결과를 계속 바꾸지 않는지 확인합니다."},{"name":"clean_hash","definition":"정제된 문자열을 UTF-8 bytes로 변환한 뒤 계산한 해시입니다. 원본 파일의 raw_sha256과는 다른 대상에 대한 값입니다.","example":"sha256(clean_text.encode(\"utf-8\")).hexdigest()","why":"파서·Cleaning 설정 변경 후 결과가 바뀌었는지 비교합니다."}],"chunking-why":[{"name":"Chunk / Token","definition":"Chunk는 검색·Embedding을 위해 만든 본문 조각이고, Token은 모델 Tokenizer가 텍스트를 나눈 입력 단위입니다. Token 수는 글자 수와 같지 않습니다.","example":"한 문서 → 여러 Chunk; 한 Chunk → 여러 Token","why":"문서의 주제를 지나치게 섞지 않고 모델의 길이 제한도 지키기 위해 구분합니다."}],"strategies":[{"name":"Structure-aware / Token-based","definition":"Structure-aware는 Heading·문단·목록·표 경계를 우선하는 분할이고, Token-based는 모델 Tokenizer가 세는 길이로 상한을 정합니다.","example":"Heading 단위로 나눈 뒤 긴 구간만 Token 길이로 다시 분할","why":"문맥과 모델 입력 한도를 동시에 고려합니다."},{"name":"Semantic Chunking","definition":"문장·문단 임베딩 등의 의미 변화 정보를 이용해 분할 경계를 정하는 접근입니다. 추가 모델 계산과 검증이 필요합니다.","example":"서로 다른 주제로 넘어가는 지점을 경계 후보로 설정","why":"오늘은 비교 원리만 소개하고 필수 구현에는 넣지 않습니다."}],"window-math":[{"name":"Chunk Size / Overlap","definition":"Chunk Size는 하나의 Chunk에 넣을 목표 길이이고 Overlap은 인접 Chunk에 중복해 포함할 구간입니다. 두 값은 같은 단위(문자 또는 Token)로 설정해야 합니다.","example":"100자, size=40, overlap=10 → [0,40), [30,70), [60,100)","why":"문맥이 경계에서 잘리는 문제와 중복 저장량의 균형을 확인합니다."}],"windows-code":[{"name":"Generator / yield","definition":"Python의 yield는 함수를 한 번에 끝내지 않고 각 결과를 순서대로 내보냅니다. 해당 함수를 Generator라고 합니다.","example":"yield start, end, text[start:end] → Chunk를 하나씩 반환","why":"문서를 순회하면서 구간을 생성하고 마지막 구간에서 반복을 종료하기 위해 사용합니다."}],"token-contract":[{"name":"E5 Query / Passage Prefix","definition":"E5 Embedding 모델에서 질문은 `query: `, 검색 대상 본문은 `passage: `를 붙입니다. 본문과 질문의 입력 역할을 지정하는 모델별 약속입니다.","example":"질문: query: 15분 늦으면? / Chunk: passage: 10분 초과는 결석","why":"두 입력을 같은 E5 모델의 검색 목적에 맞는 표현으로 변환합니다."},{"name":"Embedding Dimension vs Max Tokens","definition":"384-dimensional은 출력 벡터의 숫자 개수이고, 최대 입력 Token 길이는 인코딩 전에 받아들이는 Token 개수입니다. 서로 다른 값입니다.","example":"Output vector(384) ≠ Input max_seq_length(예: 512)","why":"본문에 Heading과 Prefix를 추가한 뒤 실제 입력 길이를 다시 검사합니다."}],"e5-length":[{"name":"Tokenizer / Special Tokens","definition":"Tokenizer는 문자열을 모델 입력용 Token ID 목록으로 바꿉니다. Special Token은 문장 경계 등 모델의 처리를 위한 별도 Token입니다.","example":"모델 tokenizer의 input_ids 전체 길이를 셉니다.","why":"글자 수나 임의 환산율 대신 실제 모델 입력의 길이를 검사합니다."},{"name":"truncation=False","definition":"길어도 입력을 자르지 않고 원래 Token 길이를 확인하도록 Tokenizer에 전달하는 옵션입니다.","example":"Token 수 > model.max_seq_length → 분할 다시 수행","why":"이미 잘린 문자열만 검사해 유효하다고 오판하지 않기 위해 필요합니다."}],"structure-aware":[{"name":"Heading Path","definition":"상위 Heading에서 현재 Heading까지 연결한 제목 경로입니다. Chunk 본문과 별도로 Metadata로 저장하거나 Embedding 입력에 붙일 수 있습니다.","example":"출석 안내 / 지각과 결석 → 해당 본문","why":"제목이 본문에 포함되면 Token 길이를 다시 계산해야 합니다."}],"overlap-tradeoff":[{"name":"Trade-off","definition":"한 요소를 늘려 얻는 효과가 다른 비용 증가를 동반하는 관계입니다.","example":"Overlap↑ → 경계 문맥↑, 저장·Embedding 반복량↑","why":"한 설정을 모든 문서에 적용하기보다 실제 검색 결과와 비용을 비교합니다."}],"validate-first":[{"name":"Validation / Invariant","definition":"Validation은 정해 둔 입력·결과 조건을 검사하는 절차입니다. Invariant는 파이프라인 전체에서 계속 지켜야 하는 조건입니다.","example":"Chunk 본문 == clean_text[start:end]","why":"벡터에 들어간 내용과 원문 위치가 서로 다른 오류를 사전에 잡습니다."}],"coverage-concept":[{"name":"Coverage","definition":"해당 clean_text의 문자 위치 중 하나 이상의 Chunk가 덮은 고유 위치 비율입니다. 겹친 위치는 한 번만 셉니다.","example":"20자 원문, 고유 위치 20개 포함 → Coverage 100%","why":"분할 과정의 위치 누락을 찾습니다. Parsing 단계 누락 여부까지 증명하지는 않습니다."},{"name":"Overlap vs Duplicate","definition":"Overlap은 설계상 인접 Chunk가 일부 문자를 공유하는 것이고, Duplicate는 같은 chunk_id나 같은 구간이 잘못 반복 생성되는 문제입니다.","example":"[0,8)·[6,14) 는 의도된 Overlap일 수 있음","why":"Coverage 100%여도 Duplicate가 존재할 수 있으므로 따로 검사합니다."}],"coverage-code":[{"name":"Interval Merge","definition":"시작·끝 범위(Span)를 정렬하고 겹치는 범위를 합쳐 고유 길이를 계산하는 알고리즘입니다.","example":"[0,8) + [6,14) → [0,14)","why":"문자마다 set 원소를 만드는 대신 구간 단위로 Coverage를 계산합니다."}],"chunk-errors":[{"name":"Quarantine","definition":"검증 실패 자료를 조용히 삭제하지 않고 이유·원문 위치와 함께 별도 상태로 보관하는 처리입니다.","example":"too_many_tokens → 재분할 전까지 격리","why":"문서가 검색에서 빠진 이유를 나중에 찾아 수정할 수 있습니다."}],"boundary-quality":[{"name":"Retrieval Metrics · Recall@k / MRR / nDCG","definition":"Recall@k는 상위 k개에서 정답 근거를 얼마나 찾았는지, MRR은 첫 정답의 순위가 얼마나 앞서는지, nDCG는 관련성 등급을 고려한 순위 품질을 평가합니다.","example":"정답 문서가 1위인지 5위인지에 따라 MRR 등이 달라집니다.","why":"오늘은 청크 경계와 원문 근거를 확인하고, 11/25에 정식 지표를 계산합니다."},{"name":"Faithfulness","definition":"생성 답변의 각 주장이 실제로 제공된 근거에 의해 뒷받침되는 정도를 평가하는 개념입니다.","example":"근거에 없는 보관 기간을 답했다면 Faithfulness 문제가 생김","why":"19일은 생성 답변 이전의 근거 데이터 품질을 다룹니다."}],"metadata-meaning":[{"name":"Metadata","definition":"본문 자체가 아니라 본문의 출처·분류·원문 버전·처리 조건을 설명하는 데이터입니다.","example":"doc_id, category, page_number, source_locator, pipeline_version","why":"검색 결과가 어느 원문의 어떤 부분인지 되짚고 범위를 제한할 수 있습니다."},{"name":"URI / Source Locator","definition":"URI(Uniform Resource Identifier)는 원문 리소스 위치나 이름을 표현하는 식별자입니다. Source Locator는 문서 안의 페이지·절 등 구체적인 구간을 찾는 값입니다.","full":"Uniform Resource Identifier","example":"source_uri: attendance.md / locator: attendance.md#지각-결석","why":"원문 파일 자체와 그 안의 근거 위치를 별도로 찾습니다."}],"identity-fields":[{"name":"Identifier vs Content Hash","definition":"Identifier는 문서·청크 같은 객체를 구별하는 키입니다. Content Hash는 텍스트의 바이트 내용이 같은지 비교하는 값입니다.","example":"서로 다른 문서의 동일 문장은 content_hash가 같아도 doc_id는 다름","why":"검색 결과에서 출처가 합쳐지거나 유실되지 않게 합니다."}],"chunk-id":[{"name":"Deterministic ID","definition":"동일 입력과 동일 직렬화 규칙이면 재실행 때 항상 같은 ID가 만들어지는 식별자입니다.","example":"doc_id + version + span 등을 정렬한 JSON → SHA-256","why":"같은 내용을 반복 인덱싱할 때 불필요한 청크 중복을 막습니다."},{"name":"Serialization","definition":"사전(dict) 등 구조화된 데이터를 정해 둔 형식의 문자열·bytes로 변환하는 과정입니다.","example":"json.dumps(identity, sort_keys=True, separators=(\",\", \":\"))","why":"필드 순서나 공백 차이로 동일한 ID 입력이 다른 해시가 되지 않게 합니다."}],"where-order":[{"name":"Metadata Filter / Top-k","definition":"Metadata Filter는 category·버전 같은 조건에 해당하는 후보만 고르고, Top-k는 그 안에서 거리순으로 최대 k개를 선택합니다.","example":"WHERE category=학사 → ORDER BY cosine distance → LIMIT 3","why":"전체에서 3개를 찾고 나중에 분류를 제거하는 것과 결과가 다릅니다."},{"name":"WHERE / ANN","definition":"WHERE는 SQL에서 조회 대상 행을 제한하는 조건절입니다. ANN은 가까운 벡터를 빠르게 찾기 위한 근사 이웃 탐색이며 Exact Search와 결과가 다를 수 있습니다.","full":"Approximate Nearest Neighbor","example":"WHERE source_version=current_version","why":"권한 조건과 공개 버전을 검색 전에 제대로 적용하는 것이 중요합니다."}],"filtered-sql":[{"name":"Parameter Binding · %s","definition":"Psycopg가 SQL의 자리표시자(%s)와 전달할 데이터를 별도로 처리하는 방법입니다. 사용자 입력을 SQL 문자열에 직접 이어 붙이지 않습니다.","example":"cur.execute(sql, (category, query_vector, k))","why":"SQL Injection과 잘못된 인용 처리 위험을 줄이고 쿼리를 재사용합니다."}],"indexing-vs-index":[{"name":"Indexing Pipeline / Database Index","definition":"Indexing Pipeline은 문서 수집부터 검증·Embedding·저장·공개까지 이어지는 작업입니다. Database Index는 저장된 행을 빠르게 찾도록 돕는 자료구조입니다.","example":"Document Indexing 실행 ≠ CREATE INDEX 완료","why":"HNSW만 만들어도 문서가 자동 Parsing·Chunking되는 것은 아닙니다."},{"name":"B-tree / HNSW","definition":"B-tree는 일반적인 정렬·조건 조회에 쓰이는 DB Index 계열이고, HNSW는 가까운 벡터 후보를 찾기 위한 ANN 그래프 Index입니다.","full":"Hierarchical Navigable Small World","example":"category 조건은 B-tree의 활용 가능성이 있고, 벡터 거리 검색은 HNSW를 고려","why":"작은 교육 데이터는 Exact Search로 먼저 정확성을 확인합니다."}],"sql-schema":[{"name":"Primary Key / Foreign Key","definition":"Primary Key(PK)는 행을 유일하게 식별하는 키이고, Foreign Key(FK)는 다른 테이블의 키를 참조해 관계를 보호하는 제약입니다.","example":"ingest_chunks의 (doc_id, source_version, pipeline_version) → ingest_versions의 같은 복합키","why":"청크가 존재하지 않는 문서를 참조하지 않도록 합니다."},{"name":"JSONB / vector(384)","definition":"JSONB는 PostgreSQL의 구조화된 JSON 저장 타입입니다. vector(384)는 pgvector의 숫자 384개짜리 벡터 타입입니다.","example":"Metadata의 선택 속성은 JSONB, 검색 Embedding은 vector(384)","why":"차원 제약은 맞춰도 원문과 모델이 올바르게 대응하는지는 별도 검증합니다."}],"embed-and-save":[{"name":"normalize_embeddings / np.isfinite","definition":"normalize_embeddings=True는 Embedding의 길이를 단위 길이로 맞추고, np.isfinite는 NaN·Inf가 없는지 확인합니다.","example":"(N,384) 모양, 모든 원소 유한, 각 행 Norm≈1","why":"유효하지 않은 벡터와 다른 모델 공간의 벡터를 섞지 않기 위해 검사합니다."}],"upsert-version":[{"name":"UPSERT · ON CONFLICT","definition":"INSERT할 때 Key 충돌이 발생하면 지정한 UPDATE 등 대체 동작을 실행하도록 만든 SQL 패턴입니다.","example":"같은 chunk_id가 이미 있으면 내용·버전 계약부터 대조","why":"기존 v1에만 있던 Chunk를 자동 삭제하는 기능은 아닙니다."},{"name":"Staging / Published Version","definition":"Staging은 새 문서 판의 결과를 준비하고 검증하는 상태, Published는 현재 검색에 노출하도록 선택된 판입니다.","example":"v2 준비 중에는 v1을 검색; v2 검증 후 새 포인터 전환","why":"중간 실패가 사용자 검색 결과를 섞지 않게 합니다."}],"sql-publish":[{"name":"Transaction · COMMIT / ROLLBACK","definition":"Transaction은 DB 작업을 하나의 확정 단위로 묶는 기능입니다. COMMIT은 변경을 확정하고, ROLLBACK은 미확정 변경을 취소합니다.","example":"준비된 v2의 expected_count 확인 → ready 표시 → 현재 포인터 변경을 한 Transaction에서 수행","why":"실패한 새 판이 공개되는 것을 막고 기존 정상 판을 유지합니다."},{"name":"Current Pointer / ready","definition":"Current Pointer는 현재 공개할 source_version·pipeline_version의 조합을 가리키는 DB 값입니다. ready는 검증을 마친 판의 상태이고, ready 자체가 곧 공개라는 뜻은 아닙니다.","example":"ready(v2) + current_pointer(v1) → 검색은 계속 v1","why":"실제 검색 집합의 버전과 데이터 품질 상태를 분리합니다."}],"version-demo":[{"name":"State Machine","definition":"staging·ready·failed처럼 허용된 상태와, 상태 사이에서 가능한 이동을 정의한 모델입니다.","example":"staging → ready → 공개 / staging → failed → 기존 공개 유지","why":"실패했다고 포인터를 성급히 변경하지 않도록 합니다."}],"sql-retrieve":[{"name":"register_vector(conn)","definition":"pgvector Python 어댑터가 현재 Psycopg Connection에서 vector 타입을 보내고 받도록 등록하는 함수입니다.","example":"Psycopg 연결 → register_vector(conn) → 벡터 파라미터 사용","why":"`pip install pgvector`만으로 연결별 타입 등록까지 자동 완료되지는 않습니다."},{"name":"citation_id","definition":"검색 결과가 실제 생성 답변의 출처 목록에 들어갈 때 사용하는 양의 정수 식별자입니다. chunk_id(문자열)와 별도로 관리합니다.","example":"citation_id=201 ↔ chunk_id=DOC-ATTEND의 특정 Chunk","why":"11/16의 KnowledgeAnswer.source_ids: list[int]와 연결하려면 매핑이 필요합니다."}],"full-flow":[{"name":"End-to-End","definition":"Raw File부터 검색 결과와 Source Locator까지 중간 연결을 빠짐없이 확인하는 방식입니다.","example":"Raw → ParsedUnit → CleanUnit → Chunk → E5 → pgvector → Retriever","why":"어느 단계에서 문서가 빠지거나 조건이 훼손됐는지 추적합니다."}],"pipeline-code":[{"name":"Pipeline / Config / Report","definition":"Pipeline은 여러 처리 단계의 연결, Config는 적용할 모델·분할·정제 설정, Report는 처리 수·오류 이유·완료 상태를 기록한 결과입니다.","example":"ingest_document(doc, config, model, conn) → chunks·report","why":"함수 한 개의 성공보다 전체 원문·청크·벡터·공개 상태의 일관성을 확인합니다."}],"citation-bridge":[{"name":"Retriever Contract","definition":"Retriever가 다른 모듈에 전달하기로 약속한 결과 필드와 자료형입니다. 본문 외에 출처·버전·ID·검색 상태가 포함됩니다.","example":"{citation_id, chunk_id, body, doc_id, source_locator, source_version}","why":"다음 날 Context Builder가 무엇을 받는지 명확해집니다."},{"name":"Citation Mapping","definition":"수치형 citation_id와 문자열 chunk_id·원문 위치를 대응시키는 관리 규칙입니다.","example":"201 ↔ DOC-ATTEND / v1 / sec-1 / [0,40)","why":"source_ids에 임의 문자열을 넣거나 전달하지 않은 출처를 인용하지 않습니다."}]};

function renderCode(key){
 const c=D.codes[key];if(!c)return '';
 const lang=key==='sql-schema'?'SQL · Schema DDL':{python:'Python',sql:'SQL · psycopg',cmd:'CMD · x64 Native Tools',bash:'Git Bash',dotenv:'.env'}[c.lang]||c.lang;
 const glyph={python:'py',sql:'db',cmd:'cmd',bash:'$',dotenv:'env'}[c.lang]||'•';
 return `<section class="inline-python" aria-label="${esc(lang)} 코드"><section class="python-block" data-code-key="${esc(key)}" aria-label="${esc(lang)} · ${esc(c.title)}"><header class="python-editor-bar"><span class="python-tab"><span class="python-file-mark" aria-hidden="true">${esc(glyph)}</span>${esc(lang)}</span><h3>${esc(c.title)}</h3><button type="button" class="d24-code-copy" data-action="copyCode" data-code="${esc(key)}" aria-label="${esc(c.title)} 코드 복사">복사</button></header><pre><code class="python-source" aria-label="${esc(lang)} 소스코드">${c.html_lines.map((line,i)=>`<span class="python-line" data-line="${i+1}">${line||' '}</span>`).join('\n')}</code></pre></section>${c.desc?`<p class="template-note">${esc(c.desc)}</p>`:''}</section>`;
}

function copyCode(key){const str=D.codes[key]?.raw;if(!str)return;const t=document.createElement('textarea');t.value=str;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}t.remove();if(!ok&&navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(str).then(()=>toast('코드를 복사했습니다.')).catch(()=>toast('코드를 직접 선택해 복사해 주세요.'));return;}toast(ok?'코드를 복사했습니다.':'직접 선택해 복사해 주세요.');}

const actions={chapter:e=>goChapter(e.dataset.ch),go:e=>go(e.dataset.scene),openMap,openSummary,help:showHelp,prev:()=>goIndex(S.i-1),next:()=>goIndex(S.i+1),close:e=>{let d=document.getElementById(e.dataset.dialog);d?.close();},copyCode:e=>copyCode(e.dataset.code),codeTab:e=>{S.codeTabs[e.dataset.scene]=Number(e.dataset.index);rerender();},mapMode:e=>{stopMapPlay();S.mapMode=e.dataset.mode;S.mapStep=-1;render();},mapNext:()=>{stopMapPlay();nextMapStep();},mapPrev:()=>{stopMapPlay();S.mapStep=Math.max(S.mapStep-1,-1);render();},mapReset:()=>{stopMapPlay();S.mapStep=-1;render();},mapPlay:()=>{if(S.mapPlaying){stopMapPlay();render();return;}if(S.mapStep>=MAP_ROUTES[S.mapMode].seq.length-1)S.mapStep=-1;S.mapPlaying=true;nextMapStep();if(S.mapPlaying)S.mapTimer=setInterval(nextMapStep,1850);},mapNode:e=>{S.mapSelected=e.dataset.node;if($('#atlasDialog').open)renderMapDialog();else render();},mapClear:()=>{S.mapSelected=null;if($('#atlasDialog').open)renderMapDialog();else render();},quizReveal:e=>{S.answers[e.dataset.key]=!S.answers[e.dataset.key];rerender();},mathReset:()=>{S.math.x=0.8;S.math.y=0.6;rerender();},lane:e=>{S.lane=e.dataset.mode;rerender();},resetChecks:()=>{S.checks={};rerender();},qualityReveal:()=>{S.qualityReveal=!S.qualityReveal;rerender();},hnswPrev:()=>{S.hnswStep=Math.max(0,S.hnswStep-1);rerender();},hnswNext:()=>{S.hnswStep=Math.min(3,S.hnswStep+1);rerender();},fullscreen:()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}};
function rerender(){let y=$('#stageScroll').scrollTop;render();$('#stageScroll').scrollTop=y;}
document.addEventListener('click',e=>{const el=e.target.closest?.('[data-action]');if(!el||!actions[el.dataset.action])return;actions[el.dataset.action](el);});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='sceneJump'){go(el.value);return;}if(el.dataset.check!==undefined){S.checks[el.dataset.check]=el.checked;rerender();return;}if(el.id==='mathX')S.math.x=Number(el.value);else if(el.id==='mathY')S.math.y=Number(el.value);else if(el.id==='fixtureQuery')S.topk.query=el.value;else if(el.id==='fixtureK')S.topk.k=Number(el.value);else if(el.id==='fixtureCategory')S.topk.category=el.value;else if(el.id==='prefixDoc')S.prefixDoc=Number(el.value);else if(el.id==='qualityQuestion'){S.qualityQ=el.value;S.qualityReveal=false;}else if(el.id==='qualityDoc'){S.qualityId=Number(el.value);S.qualityReveal=false;}else return;rerender();});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey)return;const tg=e.target?.tagName||'';if(/INPUT|SELECT|TEXTAREA/.test(tg))return;if(e.target.closest?.('.atlas-node')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();actions.mapNode(e.target.closest('.atlas-node'));return;}if(document.querySelector('dialog[open]'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();goIndex(S.i+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();goIndex(S.i-1);}else if(e.key.toLowerCase()==='m')openMap();else if(e.key.toLowerCase()==='f')actions.fullscreen();});

// Day24 standalone interactive diagrams. Calculations are browser-only fixtures; NOT local model/DB runs.
const DOC24={parse:'md',clean:'simple',chunkSize:40,overlap:10,case:'overlap',cat:'all',ver:'v1',vstep:0,pipeStep:0,head:true};
const DEMO24_TEXT='수업 시작 후 10분까지 입실하면 지각으로 기록합니다. 10분을 초과하면 결석으로 기록합니다. 출석 문의는 운영실에 연락하세요.';
function d24Btn(text,id,v,selected){return `<button data-d24="${id}" data-value="${v}" ${selected?'class="selected" aria-pressed="true"':''}>${esc(text)}</button>`;}
function d24Parse(){const src={txt:['TXT · DOC-ASSIGN','과제 안내\n제출 기한은 공지에 따릅니다.\n\n문의는 운영실에 하세요.','UTF-8 decode → 줄바꿈·빈 줄 유지'],md:['Markdown · DOC-ATTEND','# 출석 안내\n## 지각과 결석\n10분 초과는 결석입니다.\n## 문의\n운영실에 문의하세요.','Heading Path 보존 → 절 본문과 연결'],html:['HTML · DOC-FACILITY','<nav>홈 이용안내</nav><main><h2>시설</h2><table><tr><th>시설</th><th>시간</th></tr><tr><td>열람실</td><td>09:00~18:00</td></tr></table></main>','main 본문 선택 → 메뉴 제외 / 표 구조 대조'],pdf:['PDF · DOC-CAREER','page 1: 상담 신청 안내\npage 2: 상담 일정 안내','페이지별 unit_id·source_locator 기록'],scan:['Scan PDF · DOC-SCAN','[이미지로만 구성한 교육용 스캔 페이지]','pypdf 단독 인식 불가 → needs_ocr']},a=src[DOC24.parse];return `<div class="tabs">${Object.keys(src).map(k=>d24Btn(k.toUpperCase(),'parse',k,DOC24.parse===k)).join('')}</div><div class="cols">${box('원본 사례 · '+a[0],`<pre>${esc(a[1])}</pre>`)}${box('파싱 결과에서 확인할 사항',`<p>${esc(a[2])}</p><p class="muted">${DOC24.parse==='scan'?'추출 실패가 아니라 OCR 필요 상태로 분리합니다.':'실제 파일을 열거나 OCR을 실행하지 않은 작성 예시입니다.'}</p>`,'soft')}</div>`;}
function d24Clean(){const raw='출석   안내\r\n\r\n10분  초과는 결석.\n제출할 수 없습니다.';const cleaned=DOC24.clean==='none'?raw:DOC24.clean==='bad'?raw.replace(/10분/g,'').replace(/없습니다/g,'있습니다'):raw.replace(/\r\n|\r/g,'\n').replace(/ +/g,' ');return `<div class="tabs">${d24Btn('원문 유지','clean','none',DOC24.clean==='none')}${d24Btn('가로 공백·줄바꿈 정리','clean','simple',DOC24.clean==='simple')}${d24Btn('오류 규칙 예시','clean','bad',DOC24.clean==='bad')}</div><div class="cols">${box('raw_text',`<pre>${esc(JSON.stringify(raw))}</pre>`)}${box('clean_text · '+(DOC24.clean==='bad'?'의미 훼손 예시':'설명용'),`<pre>${esc(JSON.stringify(cleaned))}</pre>`,'soft')}</div><div class="callout ${DOC24.clean==='bad'?'warn':''}">${DOC24.clean==='bad'?'숫자와 부정어가 삭제/변경됐습니다. 이런 결과는 검색집합에 넣기 전에 거부해야 합니다.':'문단 경계·숫자·부정어 보존을 검사합니다. 코드·표에는 같은 규칙을 무조건 사용하지 않습니다.'}</div>`;}
function d24Chunk(){let len=DEMO24_TEXT.length,size=DOC24.chunkSize,ov=DOC24.overlap,sp=[],st=0;for(let i=0;i<100&&st<len;i++){let en=Math.min(len,st+size);sp.push([st,en]);if(en===len)break;st=en-ov;}let total=sp.reduce((n,x)=>n+x[1]-x[0],0);return `<div class="cols">${box('Chunk Size · Character',`<label>Size ${size}자</label><input id="d24size" type="range" min="20" max="100" step="10" value="${size}"><label>Overlap ${ov}자</label><input id="d24overlap" type="range" min="0" max="${Math.min(40,size-10)}" step="10" value="${ov}"><p class="muted">원문 ${len}자 · 저장 문자 합 ${total}자 · ${sp.length}개 Chunk</p>`)}${box('원문 · 교육용 출석 안내',`<p>${esc(DEMO24_TEXT)}</p><div class="callout">Character 기준이므로 E5 Token 길이나 Semantic 경계를 보증하지 않습니다.</div>`,'soft')}</div><div class="table-wrap spaced"><table><thead><tr><th>Chunk</th><th>Span [start,end)</th><th>본문</th></tr></thead><tbody>${sp.map((v,i)=>`<tr><td>${i+1}</td><td>[${v.join(',')})</td><td>${esc(DEMO24_TEXT.slice(...v))}</td></tr>`).join('')}</tbody></table></div><div class="callout">Coverage는 ${len}/${len}=100%이지만, 조건과 결과가 같은 Chunk에 들어가는지는 별도 평가가 필요합니다.</div>`;}
function d24Token(){const txt='수업 시작 후 10분까지 입실하면 지각으로 기록합니다.',prefix='passage: ',head=DOC24.head?'출석 안내 / 지각과 결석\n':'';return `<div class="tabs">${d24Btn('본문만','head','0',!DOC24.head)}${d24Btn('제목 + 본문','head','1',DOC24.head)}</div><div class="cols">${box('Chunk Body · 원문 Slice',`<pre>${esc(txt)}</pre><p>원문 Offset은 이 문자열 기준입니다.</p>`)}${box('E5 Embedding Text',`<pre>${esc(prefix+head+txt)}</pre><p>이 전체 문자열을 <code>model.tokenizer(..., truncation=False)</code>로 검사합니다.</p>`,'soft')}</div><div class="callout">실제 E5 Token 수는 이 HTML이 계산하지 않습니다. max_seq_length와 특수 토큰 포함 여부를 Python에서 확인해야 합니다.</div>`;}
function d24Coverage(){const scenarios={overlap:[[0,8],[6,14],[12,20]],missing:[[0,8],[10,20]],duplicate:[[0,8],[0,8],[8,20]]};const ranges=scenarios[DOC24.case],covered=new Set();for(const [a,b]of ranges){for(let i=a;i<b;i++)covered.add(i);}const total=ranges.reduce((n,[a,b])=>n+b-a,0);return `<div class="tabs">${d24Btn('의도한 Overlap','coverage','overlap',DOC24.case==='overlap')}${d24Btn('누락 발생','coverage','missing',DOC24.case==='missing')}${d24Btn('중복 생성','coverage','duplicate',DOC24.case==='duplicate')}</div><div class="card"><h2>정제 본문 20자리 · 구간별 Coverage</h2>${ranges.map(([a,b],i)=>`<div class="row" style="margin:12px 0"><span style="width:78px">Chunk ${i+1}</span><div style="flex:1;background:#e7edf4;height:22px;border-radius:5px;display:flex"><span style="display:block;margin-left:${a*5}%;width:${(b-a)*5}%;height:100%;background:${i%2?'#2b6f65':'#426fa3'};border-radius:4px"></span></div><code>[${a},${b})</code></div>`).join('')}<div class="grid3"><div class="card soft"><h3>Coverage</h3><div class="big">${covered.size*5}%</div></div><div class="card soft"><h3>저장 합계</h3><div class="big">${total}자</div></div><div class="card soft"><h3>반복 추가량</h3><div class="big">${Math.round((total-covered.size)/20*100)}%</div></div></div></div><p class="d23-note">Coverage는 문자 위치에 대한 계산입니다. 중복 ID를 탐지하거나 Parsing의 누락을 검증하는 지표는 아닙니다.</p>`;}
function d24Metadata(){const data=[{id:'ATT-v1',cat:'학사',ver:'v1',t:'출석 안내: 지각과 결석 기준'}, {id:'ATT-v2',cat:'학사',ver:'v2',t:'출석 안내: 개정 규정'}, {id:'FAC-v1',cat:'시설',ver:'v1',t:'시설 안내: 이용 시간'}, {id:'ASS-v1',cat:'학사',ver:'v1',t:'과제 제출 안내'}, {id:'CAR-v1',cat:'지원',ver:'v1',t:'취업 상담 안내'}];const rows=data.filter(x=>(DOC24.cat==='all'||x.cat===DOC24.cat)&&(DOC24.ver==='all'||x.ver===DOC24.ver));return `<div class="cols"><div class="card"><label>Category</label><select id="d24cat"><option value="all">전체</option>${['학사','시설','지원'].map(x=>`<option ${DOC24.cat===x?'selected':''}>${x}</option>`).join('')}</select><label class="spaced">Source Version</label><select id="d24ver">${['all','v1','v2'].map(x=>`<option value="${x}" ${DOC24.ver===x?'selected':''}>${x==='all'?'전체':x}</option>`).join('')}</select><p class="muted">이 표에서는 두 값을 임의로 선택합니다. 실제 서비스의 공개 판은 문서별 current 포인터로 제한해야 합니다.</p></div>${box('선택된 후보 · '+rows.length+'건',rows.length?`<div class="stack">${rows.map(x=>`<div class="knowledge"><strong>${esc(x.id)}</strong> · ${esc(x.cat)} · ${x.ver}<p>${esc(x.t)}</p></div>`).join('')}</div>`:'<p>조건을 만족하는 후보가 없습니다.</p>','soft')}</div>`;}
function d24Version(){const stages=[['v1 공개','v1의 A·B·C가 현재 검색 결과입니다.'],['v2 준비 중','v2 A·B를 준비하지만 공개 검색은 여전히 v1 A·B·C입니다.'],['검증 실패','v2 공개를 중단하고 현재 포인터를 v1으로 유지합니다.'],['수정·검증 통과','v2 Chunk가 ready가 되었으나 공개 포인터 변경 전입니다.'],['v2 공개','짧은 Transaction에서 포인터를 바꾸고 현재 검색은 v2 A·B만 반환합니다.']];let s=stages[DOC24.vstep];return `<div class="tabs">${stages.map((x,i)=>d24Btn(String(i+1)+' '+x[0],'vstep',String(i),DOC24.vstep===i)).join('')}</div><div class="cols">${box('현재 상태',`<h2>${esc(s[0])}</h2><p>${esc(s[1])}</p>`)}${box('현재 검색 결과',`<div class="big">${DOC24.vstep===4?'v2: A · B':'v1: A · B · C'}</div><p>v1의 C가 v2에서 사라졌다면 UPSERT만으로는 공개 범위가 교정되지 않습니다.</p>`,'soft')}</div><p class="d23-note">A·B·C → A·B는 청크 감소를 설명하는 별도 가상 사례입니다. 실습 DOC-ATTEND v1·v2는 각 2청크이며, 공개 후 이전 버전 청크가 검색되지 않는지 확인합니다. 실제 PostgreSQL Transaction 실행은 이 HTML에서 수행하지 않습니다.</p>`;}
function d24Pipeline(){const stages=[['Collect','Manifest 6개','기본 문서 5건 + 지원 외 형식 테스트 1건'],['Parse','parsed 4 · 보류 2','needs_ocr 1건 + unsupported 1건'],['Clean','CleanUnit 4문서','숫자·조건·문단 유지'],['Chunk','여러 Chunk','문자 Span · Token 한도'],['Validate','정상 Chunk만','Coverage·중복·원문 대조'],['Embed','E5-small 384차원','passage: 접두어'],['Publish','pgvector에 공개','출처·버전·현재 포인터'],['Retrieve','검색 후보·원문','11/20 Context의 입력']];return `<div class="tabs">${stages.map((x,i)=>d24Btn(String(i+1)+' '+x[0],'pipe',String(i),DOC24.pipeStep===i)).join('')}</div>${flow(stages.slice(Math.max(0,DOC24.pipeStep-1),Math.min(8,DOC24.pipeStep+3)).map((x)=>[x[0],x[1]]))}<div class="cols spaced">${box('현재 단계',`<h2>${esc(stages[DOC24.pipeStep][0])}</h2><p>${esc(stages[DOC24.pipeStep][2])}</p>`)}${box('전체 문서 결과 · 설명용',`<p>실습 입력 6건 · parsed 4건 · needs_ocr 1건 · unsupported 1건</p><p>실제 실행 결과는 수강생 PC에서 직접 측정·기록해야 합니다.</p>`,'soft')}</div>`;}
RENDER['parsing-demo']=d24Parse;RENDER['cleaning-demo']=d24Clean;RENDER['chunk-demo']=d24Chunk;RENDER['token-demo']=d24Token;RENDER['coverage-demo']=d24Coverage;RENDER['metadata-demo']=d24Metadata;RENDER['version-demo']=d24Version;RENDER['pipeline-demo']=d24Pipeline;
document.addEventListener('click',e=>{const t=e.target.closest('[data-d24]');if(!t)return;const n=t.dataset.d24,v=t.dataset.value; if(n==='parse')DOC24.parse=v;else if(n==='clean')DOC24.clean=v;else if(n==='coverage')DOC24.case=v;else if(n==='head')DOC24.head=v==='1';else if(n==='vstep')DOC24.vstep=+v;else if(n==='pipe')DOC24.pipeStep=+v;else return;rerender();});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='d24size'){DOC24.chunkSize=+t.value;DOC24.overlap=Math.min(DOC24.overlap,DOC24.chunkSize-10)}else if(t.id==='d24overlap')DOC24.overlap=+t.value;else if(t.id==='d24cat')DOC24.cat=t.value;else if(t.id==='d24ver')DOC24.ver=t.value;else return;rerender();});

let hashId=location.hash.slice(1);let initial=D.scenes.findIndex(x=>x.id===(MERGED_REDIRECTS[hashId]||hashId));if(initial>=0)S.i=initial;
render();
window.Day24App={D,S,MAP_NODES,MAP_EDGES,MAP_ROUTES,go,goIndex,render,vectorMath,searchFixture,FIXTURE_CANDIDATES,INSTALL_CHECKS,QUALITY_CASES,actions};
