class=\"tk-str\">sources</span><span class=\"tk-str\">&quot;</span>)}","    <span class=\"tk-kw\">return</span> <span class=\"tk-var\">json</span><span class=\"tk-op\">.</span><span class=\"tk-var\">dumps</span>(<span class=\"tk-var\">clean</span>, <span class=\"tk-var\">ensure_ascii</span><span class=\"tk-op\">=</span><span class=\"tk-kw\">False</span>)"],"role":"이 강의의 후속 페이지에 있는 같은 Python 코드입니다. 실제 연결이 필요한 부분은 주석·NotImplementedError로 표시됩니다."},"lecture/05_read_only_query.py":{"source":"import os\nimport psycopg\n\nSQL = \"\"\"SELECT task_id, submission_status, updated_at\n         FROM task_submissions\n         WHERE task_id = %s AND owner_id = %s\"\"\"\n\ndef read_submission(task_id: int, user_id: str) -> dict:\n    # DATABASE_URL은 SELECT만 허용된 전용 DB 계정이어야 합니다.\n    with psycopg.connect(os.environ[\"DATABASE_URL\"]) as conn:\n        with conn.cursor() as cur:\n            cur.execute(SQL, (task_id, user_id))  # 둘 다 값으로 바인딩\n            row = cur.fetchone()\n    if row is None:\n        return {\"status\": \"not_found_or_forbidden\"}\n    return {\"status\": \"ok\", \"task_id\": row[0],\n            \"submission_status\": row[1],\n            \"updated_at\": row[2].isoformat()}\n","hl":["<span class=\"tk-kw\">import</span> <span class=\"tk-var\">os</span>","<span class=\"tk-kw\">import</span> <span class=\"tk-var\">psycopg</span>","&nbsp;","<span class=\"tk-var\">SQL</span> <span class=\"tk-op\">=</span> <span class=\"tk-str\">&quot;&quot;&quot;</span><span class=\"tk-str\">SELECT task_id, submission_status, updated_at</span>","         <span class=\"tk-var\">FROM</span> <span class=\"tk-var\">task_submissions</span>","         <span class=\"tk-var\">WHERE</span> <span class=\"tk-var\">task_id</span> <span class=\"tk-op\">=</span> <span class=\"tk-op\">%</span><span class=\"tk-var\">s</span> <span class=\"tk-var\">AND</span> <span class=\"tk-var\">owner_id</span> <span class=\"tk-op\">=</span> <span class=\"tk-op\">%</span><span class=\"tk-var\">s</span><span class=\"tk-str\">&quot;&quot;&quot;</span>","&nbsp;","<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">read_submission</span>(<span class=\"tk-var\">task_id</span>: <span class=\"tk-type\">int</span>, <span class=\"tk-var\">user_id</span>: <span class=\"tk-type\">str</span>) <span class=\"tk-op\">-</span><span class=\"tk-op\">&gt;</span> <span class=\"tk-type\">dict</span>:","    <span class=\"tk-comment\"># DATABASE_URL은 SELECT만 허용된 전용 DB 계정이어야 합니다.</span>","    <span class=\"tk-kw\">with</span> <span class=\"tk-var\">psycopg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">connect</span>(<span class=\"tk-var\">os</span><span class=\"tk-op\">.</span><span class=\"tk-var\">environ</span>[<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">DATABASE_URL</span><span class=\"tk-str\">&quot;</span>]) <span class=\"tk-kw\">as</span> <span class=\"tk-var\">conn</span>:","        <span class=\"tk-kw\">with</span> <span class=\"tk-var\">conn</span><span class=\"tk-op\">.</span><span class=\"tk-var\">cursor</span>() <span class=\"tk-kw\">as</span> <span class=\"tk-var\">cur</span>:","            <span class=\"tk-var\">cur</span><span class=\"tk-op\">.</span><span class=\"tk-var\">execute</span>(<span class=\"tk-var\">SQL</span>, (<span class=\"tk-var\">task_id</span>, <span class=\"tk-var\">user_id</span>))  <span class=\"tk-comment\"># 둘 다 값으로 바인딩</span>","            <span class=\"tk-var\">row</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">cur</span><span class=\"tk-op\">.</span><span class=\"tk-var\">fetchone</span>()","    <span class=\"tk-kw\">if</span> <span class=\"tk-var\">row</span> <span class=\"tk-op\">is</span> <span class=\"tk-kw\">None</span>:","        <span class=\"tk-kw\">return</span> {<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">status</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">not_found_or_forbidden</span><span class=\"tk-str\">&quot;</span>}","    <span class=\"tk-kw\">return</span> {<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">status</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">ok</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">task_id</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-var\">row</span>[<span class=\"tk-num\">0</span>],","            <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">submission_status</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-var\">row</span>[<span class=\"tk-num\">1</span>],","            <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">updated_at</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-var\">row</span>[<span class=\"tk-num\">2</span>]<span class=\"tk-op\">.</span><span class=\"tk-var\">isoformat</span>()}"],"role":"이 강의의 후속 페이지에 있는 같은 Python 코드입니다. 실제 연결이 필요한 부분은 주석·NotImplementedError로 표시됩니다."},"lecture/05_tool_runtime.py":{"source":"from dataclasses import dataclass\nfrom langchain.tools import tool, ToolRuntime\n\n@dataclass\nclass UserContext:\n    user_id: str  # 인증 middleware가 제공한 사용자 ID\n\n@tool\ndef lookup_status(task_id: int, runtime: ToolRuntime[UserContext]) -> dict:\n    \"\"\"Read the authenticated user's task submission status by task ID.\"\"\"\n    if task_id < 1:\n        raise ValueError(\"task_id must be positive\")\n    # 실제 DB 조회 구현은 05_read_only_query.py에서 가져옵니다.\n    return read_submission(task_id, runtime.context.user_id)\n\n# 모델에는 task_id만 Tool 인수로 보입니다.\n# read_submission()은 앞 페이지에서 정의한 외부 함수입니다.\n","hl":["<span class=\"tk-kw\">from</span> <span class=\"tk-var\">dataclasses</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">dataclass</span>","<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">tools</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">tool</span>, <span class=\"tk-var\">ToolRuntime</span>","&nbsp;","<span class=\"tk-var\">@dataclass</span>","<span class=\"tk-kw\">class</span> <span class=\"tk-type\">UserContext</span>:","    <span class=\"tk-var\">user_id</span>: <span class=\"tk-type\">str</span>  <span class=\"tk-comment\"># 인증 middleware가 제공한 사용자 ID</span>","&nbsp;","<span class=\"tk-var\">@tool</span>","<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">lookup_status</span>(<span class=\"tk-var\">task_id</span>: <span class=\"tk-type\">int</span>, <span class=\"tk-var\">runtime</span>: <span class=\"tk-var\">ToolRuntime</span>[<span class=\"tk-var\">UserContext</span>]) <span class=\"tk-op\">-</span><span class=\"tk-op\">&gt;</span> <span class=\"tk-type\">dict</span>:","    <span class=\"tk-str\">&quot;&quot;&quot;Read the authenticated user&#x27;s task submission status by task ID.&quot;&quot;&quot;</span>","    <span class=\"tk-kw\">if</span> <span class=\"tk-var\">task_id</span> <span class=\"tk-op\">&lt;</span> <span class=\"tk-num\">1</span>:","        <span class=\"tk-kw\">raise</span> <span class=\"tk-var\">ValueError</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">task_id must be positive</span><span class=\"tk-str\">&quot;</span>)","    <span class=\"tk-comment\"># 실제 DB 조회 구현은 05_read_only_query.py에서 가져옵니다.</span>","    <span class=\"tk-kw\">return</span> <span class=\"tk-var\">read_submission</span>(<span class=\"tk-var\">task_id</span>, <span class=\"tk-var\">runtime</span><span class=\"tk-op\">.</span><span class=\"tk-var\">context</span><span class=\"tk-op\">.</span><span class=\"tk-var\">user_id</span>)","&nbsp;","<span class=\"tk-comment\"># 모델에는 task_id만 Tool 인수로 보입니다.</span>","<span class=\"tk-comment\"># read_submission()은 앞 페이지에서 정의한 외부 함수입니다.</span>"],"role":"이 강의의 후속 페이지에 있는 같은 Python 코드입니다. 실제 연결이 필요한 부분은 주석·NotImplementedError로 표시됩니다."},"lecture/06_create_agent.py":{"source":"from langchain.agents import create_agent\nfrom langchain_openai import ChatOpenAI\nfrom langchain.agents.middleware import ToolCallLimitMiddleware\n\n# rag_search, lookup_status는 각자의 파일에서 import 합니다.\n# from app.tools.rag_tool import rag_search\n# from app.tools.db_tool import lookup_status, UserContext\n\nmodel = ChatOpenAI(model=\"gpt-4.1-mini\")  # API Key 필요\nagent = create_agent(\n    model=model,\n    tools=[rag_search, lookup_status],\n    system_prompt=(\"정책 질문은 rag_search로 확인하고, 제출 상태는 \"\n                   \"lookup_status로 확인하세요. 근거가 없으면 추측하지 마세요.\"),\n    context_schema=UserContext,\n    middleware=[ToolCallLimitMiddleware(run_limit=4)],\n)\n","hl":["<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">agents</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">create_agent</span>","<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain_openai</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">ChatOpenAI</span>","<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">agents</span><span class=\"tk-var\">.</span><span class=\"tk-var\">middleware</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">ToolCallLimitMiddleware</span>","&nbsp;","<span class=\"tk-comment\"># rag_search, lookup_status는 각자의 파일에서 import 합니다.</span>","<span class=\"tk-comment\"># from app.tools.rag_tool import rag_search</span>","<span class=\"tk-comment\"># from app.tools.db_tool import lookup_status, UserContext</span>","&nbsp;","<span class=\"tk-var\">model</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">ChatOpenAI</span>(<span class=\"tk-var\">model</span><span class=\"tk-op\">=</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">gpt-4.1-mini</span><span class=\"tk-str\">&quot;</span>)  <span class=\"tk-comment\"># API Key 필요</span>","<span class=\"tk-var\">agent</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">create_agent</span>(","    <span class=\"tk-var\">model</span><span class=\"tk-op\">=</span><span class=\"tk-var\">model</span>,","    <span class=\"tk-var\">tools</span><span class=\"tk-op\">=</span>[<span class=\"tk-var\">rag_search</span>, <span class=\"tk-var\">lookup_status</span>],","    <span class=\"tk-var\">system_prompt</span><span class=\"tk-op\">=</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">정책 질문은 rag_search로 확인하고, 제출 상태는 </span><span class=\"tk-str\">&quot;</span>","                   <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">lookup_status로 확인하세요. 근거가 없으면 추측하지 마세요.</span><span class=\"tk-str\">&quot;</span>),","    <span class=\"tk-var\">context_schema</span><span class=\"tk-op\">=</span><span class=\"tk-var\">UserContext</span>,","    <span class=\"tk-var\">middleware</span><span class=\"tk-op\">=</span>[<span class=\"tk-var\">ToolCallLimitMiddleware</span>(<span class=\"tk-var\">run_limit</span><span class=\"tk-op\">=</span><span class=\"tk-num\">4</span>)],",")"],"role":"이 강의의 후속 페이지에 있는 같은 Python 코드입니다. 실제 연결이 필요한 부분은 주석·NotImplementedError로 표시됩니다."},"lecture/06_agent_invoke.py":{"source":"from langchain.messages import AIMessage, HumanMessage, ToolMessage\n\n# agent, UserContext는 앞 페이지에서 만든 객체입니다.\n# auth_user_id는 로그인 인증에 성공한 FastAPI 서버가 제공한 값입니다.\nrequest = \"과제 제출 규정과 내 101번 과제 제출 상태를 알려줘.\"\nresult = agent.invoke(\n    {\"messages\": [{\"role\": \"user\", \"content\": request}]},\n    context=UserContext(user_id=auth_user_id),\n)\n\nfor msg in result[\"messages\"]:\n    if isinstance(msg, AIMessage):\n        print(\"AI:\", msg.content, \"tool_calls:\", msg.tool_calls)\n    elif isinstance(msg, ToolMessage):\n        print(\"TOOL:\", msg.name, msg.tool_call_id, msg.content)\n    elif isinstance(msg, HumanMessage):\n        print(\"USER:\", msg.content)\n# 마지막 메시지가 무조건 정답이라고 가정하지 말고 결과를 검증합니다.\n","hl":["<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">messages</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">AIMessage</span>, <span class=\"tk-var\">HumanMessage</span>, <span class=\"tk-var\">ToolMessage</span>","&nbsp;","<span class=\"tk-comment\"># agent, UserContext는 앞 페이지에서 만든 객체입니다.</span>","<span class=\"tk-comment\"># auth_user_id는 로그인 인증에 성공한 FastAPI 서버가 제공한 값입니다.</span>","<span class=\"tk-var\">request</span> <span class=\"tk-op\">=</span> <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">과제 제출 규정과 내 101번 과제 제출 상태를 알려줘.</span><span class=\"tk-str\">&quot;</span>","<span class=\"tk-var\">result</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">agent</span><span class=\"tk-op\">.</span><span class=\"tk-var\">invoke</span>(","    {<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">messages</span><span class=\"tk-str\">&quot;</span>: [{<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">role</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">user</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">content</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-var\">request</span>}]},","    <span class=\"tk-var\">context</span><span class=\"tk-op\">=</span><span class=\"tk-var\">UserContext</span>(<span class=\"tk-var\">user_id</span><span class=\"tk-op\">=</span><span class=\"tk-var\">auth_user_id</span>),",")","&nbsp;","<span class=\"tk-kw\">for</span> <span class=\"tk-var\">msg</span> <span class=\"tk-op\">in</span> <span class=\"tk-var\">result</span>[<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">messages</span><span class=\"tk-str\">&quot;</span>]:","    <span class=\"tk-kw\">if</span> <span class=\"tk-type\">isinstance</span>(<span class=\"tk-var\">msg</span>, <span class=\"tk-var\">AIMessage</span>):","        <span class=\"tk-type\">print</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">AI:</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">content</span>, <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">tool_calls:</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">tool_calls</span>)","    <span class=\"tk-kw\">elif</span> <span class=\"tk-type\">isinstance</span>(<span class=\"tk-var\">msg</span>, <span class=\"tk-var\">ToolMessage</span>):","        <span class=\"tk-type\">print</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">TOOL:</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">name</span>, <span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">tool_call_id</span>, <span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">content</span>)","    <span class=\"tk-kw\">elif</span> <span class=\"tk-type\">isinstance</span>(<span class=\"tk-var\">msg</span>, <span class=\"tk-var\">HumanMessage</span>):","        <span class=\"tk-type\">print</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">USER:</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">content</span>)","<span class=\"tk-comment\"># 마지막 메시지가 무조건 정답이라고 가정하지 말고 결과를 검증합니다.</span>"],"role":"이 강의의 후속 페이지에 있는 같은 Python 코드입니다. 실제 연결이 필요한 부분은 주석·NotImplementedError로 표시됩니다."},"lecture/06_final_text.py":{"source":"from langchain.messages import AIMessage\n\ndef final_text(agent_result: dict) -> str:\n    for msg in reversed(agent_result[\"messages\"]):\n        if isinstance(msg, AIMessage) and not msg.tool_calls:\n            if isinstance(msg.content, str):\n                return msg.content\n            raise ValueError(\"non-text final response needs parsing\")\n    raise ValueError(\"final AIMessage not found\")\n\n# 여기는 최종 텍스트 추출만 담당합니다.\n# 출처 ID 검증·Tool 성공 여부·API 상태 판정은 별도의 Validator가 필요합니다.\n","hl":["<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">messages</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">AIMessage</span>","&nbsp;","<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">final_text</span>(<span class=\"tk-var\">agent_result</span>: <span class=\"tk-type\">dict</span>) <span class=\"tk-op\">-</span><span class=\"tk-op\">&gt;</span> <span class=\"tk-type\">str</span>:","    <span class=\"tk-kw\">for</span> <span class=\"tk-var\">msg</span> <span class=\"tk-op\">in</span> <span class=\"tk-type\">reversed</span>(<span class=\"tk-var\">agent_result</span>[<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">messages</span><span class=\"tk-str\">&quot;</span>]):","        <span class=\"tk-kw\">if</span> <span class=\"tk-type\">isinstance</span>(<span class=\"tk-var\">msg</span>, <span class=\"tk-var\">AIMessage</span>) <span class=\"tk-op\">and</span> <span class=\"tk-op\">not</span> <span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">tool_calls</span>:","            <span class=\"tk-kw\">if</span> <span class=\"tk-type\">isinstance</span>(<span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">content</span>, <span class=\"tk-type\">str</span>):","                <span class=\"tk-kw\">return</span> <span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">content</span>","            <span class=\"tk-kw\">raise</span> <span class=\"tk-var\">ValueError</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">non-text final response needs parsing</span><span class=\"tk-str\">&quot;</span>)","    <span class=\"tk-kw\">raise</span> <span class=\"tk-var\">ValueError</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">final AIMessage not fo       const msg=fx.msgs[Number(st.step)];out=`<div class="d29-result-grid">${box('현재 Agent Message',msg)}${box('전체 실행 요약',{requested_tools:fx.calls.map(x=>x.name),messages:fx.msgs.length,last_answer:fx.final})}</div>`+remark('Tool 호출 수와 순서는 미리 정의한 Fixture입니다. 실제 create_agent의 Tool 선택은 모델 응답에 따라 달라지므로 Trace 검증이 필요합니다.');
    }else if(key==='guard-lab'){
      c=controls(key,[['failure','발생 상황',[['none','정상'],['invalid','Schema Error'],['forbidden','권한 거절'],['down','DB Down'],['401','LLM API 401'],['loop','도구 반복 6회'],['noanswer','문서 근거 없음']]],['limit','Tool Call 상한',[['2','2회'],['4','4회'],['6','6회']]]]);
      const actions={none:['ok','정상 결과 검증 후 반환'],invalid:['validation_error','실행 전 인수 차단'],forbidden:['forbidden','타인 조회 차단·Audit'],down:['db_error','DB 장애 분리·제한된 재시도'],401:['model_auth_error','인증 설정 점검·실행 중단'],loop:[6>Number(st.limit)?'limit_exceeded':'potential_loop','상한 도달 시 중단·계산 비용 기록'],noanswer:['insufficient_context','추측하지 않고 정보 부족']};
      const v=actions[st.failure];out=`<div class="d29-result-grid">${box('검사 결과',{status:v[0],tool_call_limit:Number(st.limit)})}${box('권장 대응',v[1])}</div>`+remark('반복 상한은 도구 호출 제한입니다. 전체 모델 호출 횟수·실행시간·HTTP Timeout은 별도 제어가 필요합니다.');
    }else if(key==='e2e-lab'){
      c=controls(key,[['task','질문',scenarios],['user','인증 사용자',[['stu-001','stu-001'],['stu-002','stu-002']]],['failure','실행 환경',[['none','정상'],['db','DB Down'],['auth','LLM API 인증 실패']]]]);
      const fx=fixtureAgent(st.task,st.user),calls=fx.calls.map(x=>x.name);const needDB=calls.includes('lookup_status');const err=st.failure==='auth'||(st.failure==='db'&&needDB);
      const status=err?503:200;const result=err?{status:'service_error',code:st.failure==='auth'?'upstream_authentication':'database_unavailable',detail:'진단 로그 확인'}:{status:st.task==='status'&&st.user==='stu-002'?'not_found_or_forbidden':'answered',answer:fx.final,source_ids:calls.includes('rag_search')?['POL-01']:[]};
      out=`<div class="d29-result-grid">${box('FastAPI → Agent Tool Trace',{http_status:status,user_id_from_auth:st.user,tool_calls:calls})}${box('검증된 API 응답(예시)',result)}</div>`+remark('최종 API 상태·메시지 형태는 교육용 정책 예시입니다. 실제 서비스는 검증된 출처·권한·로그와 응답 Schema를 반드시 적용합니다.');
    }
    return c+`<div class="d29-demo-result">${out}</div>`;
  }
  // IDE source + step data are provided by the build script.
  const FILES=D.files, IDE_STEPS=D.ide_steps;
  function glossary(){return `<input class="d26-search" id="d29GlossarySearch" placeholder="Tool Calling, @tool, Agent Harness 등 검색"><div class="d29-glossary" id="d29GlossaryContent">${D.glossary.map(([w,txt])=>`<div><b>${esc(w)}</b></div><div>${esc(txt)}</div>`).join('')}</div>`;}
  let i=0;
  const stage=$('#stage'),scroll=$('#stageScroll'),footer=$('#sceneFooter');
  function render(){const s=S[i],front=s.kind==='cover'||s.kind==='contents';stage.className='stage '+(front?'frontmatter-stage':'');stage.innerHTML=renderPage(s,i);scroll.scrollTop=0;
    $('#chapters').innerHTML=CH.map(c=>`<button data-jump="${S.findIndex(s=>s.chapter===c.n)}" class="chapter${s.chapter===c.n?' active':''}"><span class="num">${String(c.n).padStart(2,'0')}</span><span>${esc(c.title)}<small>${esc(c.short)}</small></span></button>`).join('');
    $('#miniMapMount').innerHTML=front?'':`<button class="mini-map-button" data-dialog="map" aria-label="현재 위치를 원래 전체지도에서 열기">${mapArea(s.chapter,{mini:true})}<span><i></i>${esc(CH[s.chapter-1].focus)}</span><small>전체 지도 열기 · M</small></button>`;
    $('#positionMount').innerHTML=front?'':`<div class="position-strip"><span class="position-label">현재 위치</span><div><span>AI 업무 서비스</span><b>›</b><strong>${esc(CH[s.chapter-1].focus)}</strong><small>${esc(CH[s.chapter-1].where)}</small></div><button class="small" data-dialog="map">전체지도</button></div>`;
    $('#miniMapMount').hidden=front;$('#positionMount').hidden=front;
    $('#sceneJump').innerHTML=`<option value="${i}">${esc(s.title)}</option>`+S.filter((x,j)=>j!==i&&x.chapter===s.chapter).map(x=>`<option value="${S.indexOf(x)}">${esc(x.title)}</option>`).join('');
    $('#sceneJump').value=String(i);
    $('#progress').style.width=`${100*(i+1)/S.length}%`;
    footer.textContent=`${i+1} / ${S.length}`;$('#prevScene').disabled=i===0;$('#nextScene').disabled=i===S.length-1;
    document.title=`${i+1}/${S.length} ${s.title} · DAY29 AI Agent & Tool Calling`;
  }
  function go(target){if(typeof target==='string'){const ix=S.findIndex(x=>x.id===target);if(ix<0)return;i=ix;}else i=Math.max(0,Math.min(S.length-1,Number(target)));render();try{history.replaceState({},'',`#${encodeURIComponent(S[i].id)}`)}catch{}}
  function modal(name,keepNode=false){if(name==='map'&&!keepNode)selectedAtlasNode=null;const el=$('#d29Dialog'),head=$('#d29DialogTitle'),body=$('#d29DialogBody');
    head.textContent={map:'전체 지도 · AI Agent Service',glossary:'용어사전 · 핵심 개념',help:'강의자료 사용 안내'}[name]||name;
    body.innerHTML=name==='map'?mapModalHTML():name==='glossary'?glossary():`<div class="d29-grid"><div class="d29-quad"><h2>탐색</h2><p>←·→ 이전/다음, Home/End 처음/끝, M 전체지도, G 용어사전, F 전체화면. 오른쪽 하단 페이지 이동 버튼도 사용할 수 있습니다.</p></div><div class="d29-quad"><h2>시연</h2><p>8개 조작형 예제의 문서·Tool 선택·DB 상태는 교육용 Fixture입니다. 4페이지의 개념 카드, 5페이지의 비교 행, 7·13·25·33·44·59페이지의 단계 블록은 클릭하면 VS Code형 소스와 입력·출력 다이어그램이 열립니다. 실제 LLM·PostgreSQL·CUDA·API를 실행하지 않습니다.</p></div><div class="d29-quad"><h2>강의와 실습</h2><p>8개 Chapter마다 01_basic·02_intermediate·03_advanced의 실습 안내가 포함되어 있습니다. 실제 실습 ZIP은 별도 제작합니다.</p></div><div class="d29-quad"><h2>현업 안전 경계</h2><p>Tool의 args와 Runtime Context 신원을 구분하고, 출처·권한·호출 제한·오류를 서버에서 검증합니다. 실제 API/DB 예제는 해당 패키지와 인증 설정이 필요합니다.</p></div></div>`;
    if(!el.open)el.showModal();
  }
  function summary(){const sheets=CH.map(c=>`<section><header><span>${String(c.n).padStart(2,'0')}</span><h2>${esc(c.title)}</h2></header><p>${esc(c.short)} · ${esc(c.where)}</p><div class="row">${S.filter(x=>x.chapter===c.n&&x.kind==='concept').slice(0,3).map(x=>`<article><h3>${esc(x.title)}</h3><p>${esc(x.claim)}</p></article>`).join('')}</div><div class="tip"><b>핵심</b> ${esc(c.focus)} · INPUT: ${esc(c.inp)} → OUTPUT: ${esc(c.out)}</div></section>`).join('');const css=`body{font-family:Malgun Gothic,Arial,sans-serif;background:#f4f7fb;color:#20334d;margin:0;padding:26px;font-size:15px;line-height:1.55}h1{margin:0;color:#1c2b40}.sub{color:#64758b;margin-bottom:28px}section{max-width:1150px;background:#fff;margin:0 auto 18px;padding:26px 30px;border:1px solid #d5e1ed;border-radius:12px;break-after:page}section header{display:flex;align-items:baseline;gap:15px;border-bottom:2px solid #d5e1ed;margin-bottom:13px}section header span{font-size:20px;color:#426fa3;font-weight:bold}h2{margin:0 0 13px;font-size:23px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}article{border-left:3px solid #426fa3;padding:8px 13px;background:#f6f9fc}h3{font-size:16px;margin:0 0 8px}article p{font-size:13px;line-height:1.65}.tip{background:#e8f0f9;padding:13px;margin-top:18px}button{font-size:14px;padding:8px 16px}@media print{@page{size:A4 landscape;margin:10mm}body{background:white;padding:0}section{border:none;margin:0;padding:8mm;break-after:page}.bar,button{display:none}}`;
    const win=window.open('','_blank');if(!win){alert('브라우저 팝업 차단을 해제하면 인쇄용 핵심요약을 열 수 있습니다.');return;}win.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Day29 · 핵심요약</title><style>${css}</style></head><body><div class="bar" style="max-width:1150px;margin:auto"><h1>DAY29 · AI Agent Fundamentals &amp; Tool Calling</h1><p class="sub">8개 Chapter의 핵심 개념 · 11/26 → 11/27 프로젝트 연결</p><button onclick="print()">인쇄</button></div>${sheets}</body></html>`);win.document.close();}
  document.addEventListener('click',event=>{
    const close=event.target.closest?.('[data-explore-close]');
    if(close){$('#d29ExploreDialog').close();return;}
    const file=event.target.closest?.('[data-explore-file]');
    if(file){refreshExploreCode(file.dataset.exploreFile);return;}
    const opener=event.target.closest?.('[data-explore-open],[data-explore-row]');
    if(opener){openExplore(opener.dataset.exploreOpen||opener.dataset.exploreRow);return;}
  });
  document.addEventListener('click',event=>{
    const node=event.target.closest?.('[data-action="atlasNode"]');
    if(node){inspectAtlasNode(node.dataset.node);return;}
    const clear=event.target.closest?.('[data-atlas-clear]');
    if(clear){selectedAtlasNode=null;document.querySelector('#d29DialogBody').innerHTML=mapModalHTML();return;}
    const btn=event.target.closest('button,[data-jump]');if(!btn)return;
    if(btn.dataset.jump!==undefined){const d=$('#d29Dialog');if(d.open)d.close();go(Number(btn.dataset.jump));return;}
    if(btn.id==='prevScene')return go(i-1);if(btn.id==='nextScene')return go(i+1);
    if(btn.dataset.dialog)return modal(btn.dataset.dialog);
    if(btn.dataset.action==='summary')return summary();
    if(btn.dataset.action==='fullscreen'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();return;}
    if(btn.dataset.action==='close')return $('#d29Dialog').close();
    if(btn.dataset.copy){
      const card=btn.closest('.d29-editor'), id=card.dataset.srcId;
      const source=S.find(s=>s.id===id)?.raw||FILES[card.dataset.codeName]?.source||EXP.sources[card.dataset.codeName]?.source;
      if(source){
        const success=()=>{btn.textContent='복사 완료';};
        const fallback=()=>{
          const ta=document.createElement('textarea');ta.value=source;
          ta.style.position='fixed';ta.style.left='-10000px';document.body.appendChild(ta);
          ta.select();const ok=document.execCommand('copy');ta.remove();
          btn.textContent=ok?'복사 완료':'복사할 수 없습니다';
        };
        if(navigator.clipboard?.writeText)navigator.clipboard.writeText(source).then(success).catch(fallback);
        else fallback();
      }
      return;
    }
    if(btn.dataset.traceI!==undefined){const wrap=btn.closest('[data-trace]'),s=S.find(x=>x.id===wrap.dataset.trace);const t=s.trace[Number(btn.dataset.traceI)];wrap.querySelectorAll('[data-trace-i]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));wrap.querySelector('.d29-trace-body').innerHTML=`<div><b>INPUT</b>${pre(t[1])}</div><div><b>OUTPUT</b>${pre(t[2])}</div>`;wrap.querySelector('.d29-trace-why').textContent=t[3]||'';return;}
    if(btn.dataset.ideFile){const root=btn.closest('[data-ide]'),file=btn.dataset.ideFile;root.querySelectorAll('[data-ide-file]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));root.querySelector('[data-ide-editor]').innerHTML=editor({id:'ide-code',filename:file,hl:FILES[file].hl,raw:FILES[file].source});root.querySelector('[data-ide-description]').textContent=FILES[file].role;return;}
    if(btn.dataset.ideStep!==undefined){const root=btn.closest('[data-ide]'),s=IDE_STEPS[Number(btn.dataset.ideStep)];root.querySelectorAll('[data-ide-step]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));root.querySelector('[data-ide-flow]').innerHTML=`<p><b>INPUT:</b> ${esc(s.input)}</p><p><b>OUTPUT:</b> ${esc(s.output)}</p><p>${esc(s.note)}</p>`;return;}
  });
  document.addEventListener('change',e=>{
    if(e.target.id==='sceneJump')return go(Number(e.target.value));
    const el=e.target.closest('[data-d29-key]');if(!el)return;
    const root=el.closest('[data-demo-key]');if(!root)return;
    const st=state[root.dataset.demoKey];st[el.dataset.d29Key]=el.value;root.querySelector('.d29-demo-root').innerHTML=renderDemo(root.dataset.demoKey);
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='d29GlossarySearch'){const q=e.target.value.trim().toLowerCase();$('#d29GlossaryContent').innerHTML=D.glossary.filter(row=>row.join(' ').toLowerCase().includes(q)).map(([w,txt])=>`<div><b>${esc(w)}</b></div><div>${esc(txt)}</div>`).join('');}
  });
  document.addEventListener('keydown',e=>{
    if($('#d29ExploreDialog').open)return;
    const node=e.target.closest?.('[data-action="atlasNode"]');
    if(node&&(e.key==='Enter'||e.key===' ')){e.preventDefault();inspectAtlasNode(node.dataset.node);return;}
    if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,select,textarea,[contenteditable]'))return;
    if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}
    else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(S.length-1)}
    else if(e.key.toLowerCase()==='m')modal('map');else if(e.key.toLowerCase()==='g')modal('glossary');
    else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
  });
  const h=decodeURIComponent(location.hash.replace(/^#/,'')),found=S.findIndex(x=>x.id===h);i=found>=0?found:0;render();
})();

</script></body></html>
