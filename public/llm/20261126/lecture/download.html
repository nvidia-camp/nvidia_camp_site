/* v9: a VS Code-style dark editor for Python source only.
   The lesson canvas, summaries, input controls and source text stay unchanged. */
.inline-python{
  --editor-bg:#1e1e1e;--editor-fg:#d4d4d4;--editor-tabs:#252526;
  --editor-border:#3c3c3c;--editor-accent:#3794ff;--editor-gutter:#999999;
  margin-top:30px;padding-top:0;border-top:0;min-width:0;
}
.inline-python .python-block{
  background:var(--editor-bg);color:var(--editor-fg);
  border:1px solid var(--editor-border);border-radius:8px;
  padding:0;margin:0 0 22px;min-width:0;overflow:hidden;
  box-shadow:0 3px 14px #142d4e12;color-scheme:dark;
}
.python-editor-bar{
  display:flex;align-items:stretch;min-width:0;
  background:var(--editor-tabs);border-bottom:1px solid #333333;
}
.python-tab{
  display:flex;align-items:center;gap:9px;flex:0 0 auto;
  padding:11px 19px 12px;color:#f0f0f0;background:var(--editor-bg);
  border-top:2px solid var(--editor-accent);border-right:1px solid #333333;

  user-select:none;
}
.python-file-mark{
  color:#78b7eb;font:600 12px/1 Consolas,'DejaVu Sans Mono',monospace;
  letter-spacing:-.5px;user-select:none;
}
.inline-python .python-block .python-editor-bar h3{
  font:500 15px/1.6 'Segoe UI','Noto Sans CJK KR','Malgun Gothic',sans-serif;
  color:#c8c8c8;margin:0;padding:11px 18px;align-self:center;
  min-width:0;word-break:keep-all;overflow-wrap:anywhere;
}
.inline-python .python-block pre{
  font-family:'Cascadia Code',Consolas,'D2Coding','Noto Sans Mono CJK KR','DejaVu Sans Mono',monospace;
  font-size:15px;line-height:1.8;font-weight:400;
  color:var(--editor-fg);background:var(--editor-bg);
  padding:18px 0 21px;margin:0;border:0;max-height:none;overflow:visible;
  white-space:normal;tab-size:4;font-variant-ligatures:none;
}
.inline-python .python-block code.python-source{
  display:flex;flex-direction:column;align-items:stretch;
  font:inherit;color:inherit;background:none;border:0;padding:0;

}

.inline-python .py-function{color:#dcdcaa;font-weight:400}

/* Day26 feature adapters for the canonical lecture HTML template.
   Append after the original 55,445-character head stylesheet.
   The template owns the shell, typography, cards, tables, concept layouts,
   front matter, navigation, maps and Python editor. These rules add only
   Day26 controls, result annotations, search, reading and print behavior. */

/* Interactive examples use the template's row, chip, card and heading rules. */
.d26-demo{margin:18px 0;min-width:0}
.d26-demo-head{margin-bottom:18px}
.d26-demo-body{min-width:0}
.d26-controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 18px;margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.d26-control{display:block;flex:1 1 180px;min-width:min(100%,150px);max-width:400px;font-weight:400}
.d26-control.wide{flex-basis:320px;max-width:none}
.d26-control>span{display:block;margin-bottom:7px;font-weight:700;line-height:1.6;overflow-wrap:anywhere}
.d26-control select,.d26-control input[type=text]{min-height:42px}
.d26-control input[type=range]{display:block;min-height:24px}
.d26-control input[type=checkbox]{vertical-align:middle;margin:0 7px 0 0}
.d26-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.d26-split>*{min-width:0}
.d26-pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;max-height:none}
.d26-demo-explain{margin-top:18px}
.d26-demo details{margin:18px 0}
.d26-demo details>summary{cursor:pointer;color:var(--blue);font-weight:600;line-height:1.6}

/* State labels reuse the template's semantic colors and chip proportions. */
.d26-status{display:inline-flex;align-items:center;padding:4px 9px;border-radius:5px;background:var(--pale);color:var(--blue);font-size:13px;font-weight:700;line-height:1.4;white-space:normal;overflow-wrap:anywhere}
.d26-status.ok{background:#e7f3ee;color:var(--ok)}
.d26-status.bad{background:var(--paper);color:var(--bad);box-shadow:inset 0 0 0 1px currentColor}
.d26-status.wait{background:#fff5e7;color:var(--warn)}
.d26-status.neutral{color:var(--muted)}
.d26-metric{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px;padding:12px 0;border-bottom:1px solid var(--line);line-height:1.7}
.d26-metric:last-child{border-bottom:0}

.d26-source-button{margin:10px 6px 0 0}

.d26-note{margin:18px 0;color:var(--muted);line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}

.d26-instruction{display:block;margin:18px 0 8px;color:var(--muted);line-height:1.6}

/* This is an additional editor action, not a replacement editor theme. */
.d26-copy{align-self:center;flex:0 0 auto;margin:8px 12px 8px auto;padding:5px 9px;border-color:#727272;background:#333333;color:#f0f0f0;font-size:13px;line-height:1.4;white-space:nowrap}

/* Reference disclosures and notation use the template's existing components. */

 여부를 제안","규정·상태·두 기능 동시 조회","오늘 직접 구현"]],"note":"어느 방식이 항상 더 좋다는 뜻은 아닙니다. 반복 절차가 명확하고 안정성이 중요하면 고정 Workflow가 더 적합할 수도 있습니다."},{"id":"d29-c1-04","chapter":1,"kind":"concept","title":"Agent가 사용되는 실제 업무를 분해합니다","claim":"사용자가 요청한 내용을 데이터의 출처별로 나누면 어떤 기능을 Tool로 만들지 결정할 수 있습니다.","items":[["업무 문서","정책, 운영 매뉴얼, FAQ 같은 비정형 데이터는 rag_search가 검색합니다."],["운영 DB","개인 과제 상태, 주문 상태, 예약 현황처럼 최신 구조화 데이터는 lookup_status가 조회합니다."],["Agent Platform","사용자 의도를 해석하고 적절한 도구를 호출하되 DB 접속 권한까지 모델에 맡기지는 않습니다."],["Infra","API 인증, DB 연결, 실패 상태, GPU·LLM 실행시간을 관리합니다."]],"example":"예: “과제 제출 규정은 무엇이고 101번 과제는 제출됐나요?” → RAG Tool로 규정 조회 + DB Tool로 101번 상태 조회.","point":"RAG 결과는 “문서 속 규정”이고 DB 결과는 “현재 상태”입니다. 하나가 다른 하나를 대신하지 않습니다."},{"id":"d29-c1-05","chapter":1,"kind":"process","title":"Agent Loop를 단계별로 따라가 봅니다","claim":"Agent가 반복한다는 말은 LLM이 여러 번 생각만 한다는 뜻이 아니라, Tool 결과를 받은 뒤 새로운 메시지로 다시 모델을 호출할 수 있다는 뜻입니다.","steps":[["01","HumanMessage"],["02","LLM 판단"],["03","tool_calls"],["04","Python Tool"],["05","ToolMessage"],["06","LLM 답변"]],"details":[["Tool Call 있음","Agent Harness가 도구 이름과 인수를 검사하고 도구를 실행한 뒤 결과를 모델에게 반환합니다."],["Tool Call 없음","최종 AIMessage가 생성되면 정상적으로 종료할 수 있습니다."],["안전한 중단","호출 제한·권한 오류·DB 오류가 발생하면 정책에 따라 중단하거나 오류를 표시합니다."]],"note":"실제 서비스에서는 한 번에 여러 Tool Call이 반환될 수 있으며, 반드시 위 예시 순서로만 호출되는 것은 아닙니다.","refs":["agent","models"]},{"id":"d29-c1-06","chapter":1,"kind":"demo","title":"시연 · 같은 질문을 세 처리 방식에 적용하기","claim":"질문 유형과 처리 방식을 바꾸면 어느 경로가 충분하고 어디서 추가 도구가 필요한지 확인합니다.","demo":"mode-lab","why":""},{"id":"d29-c1-07","chapter":1,"kind":"practice","title":"실습 01 안내 · RAG와 Agent 흐름 구분","claim":"앞의 개념과 코드를 하나의 구현 결과로 연결합니다. 각 수준은 같은 목표를 공유하며 TODO 범위와 책임 분리가 달라집니다.","prep":"3개 업무 질문·RAG/Agent 흐름표","goal":"질문별 처리 방식·필요한 Tool 목록과 이유","levels":[["01_basic","질문 3개를 보고 고정 RAG 또는 Agent가 필요한지 표시하고 이유를 한 문장으로 씁니다."],["02_intermediate","질문 의도에 따라 문서 조회/상태 조회/복합 조회를 결정하는 조건을 작성합니다."],["03_advanced","데이터 소스별 책임과 Agent가 쓰지 말아야 할 Tool을 포함한 요구사항·실패 사례를 설계합니다."]],"checks":[["규정과 내 제출 상태를 한 번에 묻는 경우 왜 RAG만으로 부족한가요?","현재 제출 상태는 문서가 아니라 DB에 있기 때문입니다."],["Tool이 실행될 때 SQL을 작성하는 주체는 항상 LLM인가요?","아닙니다. 오늘의 Tool은 서버에 미리 작성된 SELECT를 사용합니다."]],"notice":"실제 Agent 구현은 Chapter 06에서 연결하며, 여기서는 전체 목적과 역할을 먼저 고정합니다."},{"id":"d29-c2-01","chapter":2,"kind":"concept","title":"Tool Calling은 어떤 기능인가요?","claim":"Tool Calling은 모델이 일반 문장 대신 “어떤 Tool을 어떤 인수로 호출해 달라”는 구조화된 요청을 반환하도록 하는 기능입니다.","items":[["모델의 역할","Tool 이름과 JSON 형태의 args를 제안합니다. 서버 DB에 직접 접속한 것은 아닙니다."],["앱의 역할","허용된 Tool인지 확인하고 입력을 검증한 다음 Python 함수를 실제 실행합니다."],["결과 반환","Tool의 결과를 ToolMessage로 대화에 추가하면 모델이 이를 읽고 다음 행동 또는 답변을 결정합니다."],["업무 적용","사내 Copilot, 고객 지원, CRM 조회, 주문 상태 확인, 보고서 생성의 도구 호출 기반이 됩니다."]],"example":"예: model response.tool_calls = [{name: \"lookup_status\", args: {task_id: 101}, id: \"call_001\"}]","point":"“모델이 도구를 호출했다”는 표현은 편의상 쓰이지만, 로컬 Python Tool의 실제 실행 책임은 Agent Harness 또는 애플리케이션에 있습니다.","refs":["models","tools"]},{"id":"d29-c2-02","chapter":2,"kind":"table","title":"Agent 메시지의 네 가지 역할","claim":"LLM과 Tool 사이의 정보 이동은 메시지 타입을 구분하면 이해하기 쉽습니다.","headers":["메시지","누가 만드는가","포함된 값","현업 관찰 지점"],"rows":[["SystemMessage","개발자·서비스 설정","역할·지침·금지 작업","안전 정책의 설명"],["HumanMessage","사용자","업무 요청","FastAPI 요청 본문"],["AIMessage","모델","tool_calls 또는 최종 content","모델 판단·결과"],["ToolMessage","도구 실행 환경","tool_call_id·도구 결과","DB/RAG 응답 로그"]],"note":"tool_calls는 AIMessage에 실리며, ToolMessage는 같은 호출 ID를 통해 요청과 연결됩니다. 메시지 내용에는 민감한 실행 결과가 포함될 수 있습니다.","refs":["models"]},{"id":"d29-c2-03","chapter":2,"kind":"code","title":"`bind_tools()`는 실행이 아니라 Tool 목록 전달입니다","claim":"도구의 Schema를 모델에게 전달하면 모델은 호출 요청을 생성할 수 있습니다. 하지만 Tool의 Python 함수가 자동으로 실행되지는 않습니다.","filename":"02_bind_tools.py","raw":"from langchain_openai import ChatOpenAI\nfrom langchain.tools import tool\n\n@tool\ndef lookup_status(task_id: int) -> str:\n    \"\"\"Return the submission status for a task ID (demo only).\"\"\"\n    return f\"task={task_id}: submitted\"\n\nmodel = ChatOpenAI(model=\"gpt-4.1-mini\")  # tool calling 지원 모델 예시\nbound = model.bind_tools([lookup_status])\n# invoke()는 모델 API를 호출합니다. 도구를 직접 실행하지 않습니다.\nresponse = bound.invoke(\"101번 과제가 제출됐는지 확인해줘\")\nprint(response.tool_calls)  # 모델 판단에 따라 비어 있을 수 있습니다.\n","terms":[["bind_tools()","모델에 Tool 정의를 제공하는 메서드","Tool Call 요청 생성까지 담당"],["tool_calls","AIMessage의 호출 요청 목록","name, args, id가 핵심"]],"io":["Tool Schema + User 질문","모델 API 응답 (AIMessage)","Python Tool 실행은 아직 발생하지 않음"],"trace":[],"note":"","runtime":"requires API+SDK","refs":["models","tools"],"hl":["<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain_openai</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">ChatOpenAI</span>","<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">tools</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">tool</span>","&nbsp;","<span class=\"tk-var\">@tool</span>","<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">lookup_status</span>(<span class=\"tk-var\">task_id</span>: <span class=\"tk-type\">int</span>) <span class=\"tk-op\">-</span><span class=\"tk-op\">&gt;</span> <span class=\"tk-type\">str</span>:","    <span class=\"tk-str\">&quot;&quot;&quot;Return the submission status for a task ID (demo only).&quot;&quot;&quot;</span>","    <span class=\"tk-kw\">return</span> <span class=\"tk-str\">f</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">task=</span><span class=\"tk-str\">{</span><span class=\"tk-var\">task_id</span><span class=\"tk-str\">}</span><span class=\"tk-str\">: submitted</span><span class=\"tk-str\">&quot;</span>","&nbsp;","<span class=\"tk-var\">model</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">ChatOpenAI</span>(<span class=\"tk-var\">model</span><span class=\"tk-op\">=</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">gpt-4.1-mini</span><span class=\"tk-str\">&quot;</span>)  <span class=\"tk-comment\"># tool calling 지원 모델 예시</span>","<span class=\"tk-var\">bound</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">model</span><span class=\"tk-op\">.</span><span class=\"tk-var\">bind_tools</span>([<span class=\"tk-var\">lookup_status</span>])","<span class=\"tk-comment\"># invoke()는 모델 API를 호출합니다. 도구를 직접 실행하지 않습니다.</span>","<span class=\"tk-var\">response</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">bound</span><span class=\"tk-op\">.</span><span class=\"tk-var\">invoke</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">101번 과제가 제출됐는지 확인해줘</span><span class=\"tk-str\">&quot;</span>)","<span class=\"tk-type\">print</span>(<span class=\"tk-var\">response</span><span class=\"tk-op\">.</span><span class=\"tk-var\">tool_calls</span>)  <span class=\"tk-comment\"># 모델 판단에 따라 비어 있을 수 있습니다.</span>"]},{"id":"d29-c2-04","chapter":2,"kind":"process","title":"Tool Call 요청과 ToolMessage를 연결합니다","claim":"같은 call ID로 요청·실행 결과를 짝지어야 여러 도구 호출이 발생해도 결과를 구분할 수 있습니다.","steps":[["AIMessage","tool_calls"],["Harness","name·args 검증"],["Python","lookup_status"],["ToolMessage","call_001"],["Model","결과 해석"]],"details":[["요청 예시","{\"name\":\"lookup_status\",\"args\":{\"task_id\":101},\"id\":\"call_001\"}"],["ToolMessage 예시","{\"tool_call_id\":\"call_001\",\"content\":\"{\\\"status\\\":\\\"submitted\\\"}\"}"],["중요 경계","서버가 Tool 실행 완료를 확인하기 전에는 제출 상태를 성공으로 단정하지 않습니다."]],"note":"","refs":["models"]},{"id":"d29-c2-05","chapter":2,"kind":"code","title":"Harness 없이 실행 경계를 이해하는 최소 예시","claim":"수업에서는 모델 요청과 Python 실행을 분리해 보여 줍니다. 실제 프로젝트는 다음 Chapter의 create_agent가 반복을 관리합니다.","filename":"02_dispatch_explained.py","raw":"from langchain.messages import ToolMessage\n\ndef dispatch_one(tool_call: dict, allowed: dict):\n    # 모델이 임의의 함수 이름을 제안할 수 있으므로 허용 목록으로 제한합니다.\n    name = tool_call[\"name\"]\n    if name not in allowed:\n        raise ValueError(f\"Tool not allowed: {name}\")\n    tool = allowed[name]\n    return tool.invoke(tool_call)  # ToolCall 입력 시 ToolMessage 반환\n\n# 아래 호출은 ToolCall을 받은 뒤 실행 환경에서 수행하는 작업 예시입니다.\n# message = dispatch_one(call, {\"lookup_status\": lookup_status})\n# history.extend([ai_message, message]); response = bound.invoke(history)\n","terms":[["ToolMessage","실제 도구 실행 결과를 모델에게 전달하는 메시지","tool_call_id가 요청 ID와 대응"],["Tool Dispatcher","요청된 Tool을 허용 목록에서 찾아 실행하는 부분","임의 함수 실행 금지"]],"io":["ToolCall dict, 허용된 Tool 목록","Tool 실행·결과 반환","ToolMessage + 다음 모델 입력"],"trace":[],"note":"","runtime":"concept code","refs":["models","tools"],"hl":["<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">messages</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">ToolMessage</span>","&nbsp;","<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">dispatch_one</span>(<span class=\"tk-var\">tool_call</span>: <span class=\"tk-type\">dict</span>, <span class=\"tk-var\">allowed</span>: <span class=\"tk-type\">dict</span>):","    <span class=\"tk-comment\"># 모델이 임의의 함수 이름을 제안할 수 있으므로 허용 목록으로 제한합니다.</span>","    <span class=\"tk-var\">name</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">tool_call</span>[<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">name</span><span class=\"tk-str\">&quot;</span>]","    <span class=\"tk-kw\">if</span> <span class=\"tk-var\">name</span> <span class=\"tk-op\">not</span> <span class=\"tk-op\">in</span> <span class=\"tk-var\">allowed</span>:","        <span class=\"tk-kw\">raise</span> <span class=\"tk-var\">ValueError</span>(<span class=\"tk-str\">f</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">Tool not allowed: </span><span class=\"tk-str\">{</span><span class=\"tk-var\">name</span><span class=\"tk-str\">}</span><span class=\"tk-str\">&quot;</span>)","    <span class=\"tk-var\">tool</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">allowed</span>[<span class=\"tk-var\">name</span>]","    <span class=\"tk-kw\">return</span> <span class=\"tk-var\">tool</span><span class=\"tk-op\">.</span><span class=\"tk-var\">invoke</span>(<span class=\"tk-var\">tool_call</span>)  <span class=\"tk-comment\"># ToolCall 입력 시 ToolMessage 반환</span>","&nbsp;","<span class=\"tk-comment\"># 아래 호출은 ToolCall을 받은 뒤 실행 환경에서 수행하는 작업 예시입니다.</span>","<span class=\"tk-comment\"># message = dispatch_one(call, {&quot;lookup_status&quot;: lookup_status})</span>","<span class=\"tk-comment\"># history.extend([ai_message, message]); response = bound.invoke(history)</span>"]},{"id":"d29-c2-06","chapter":2,"kind":"demo","title":"시연 · Tool Call → ToolMessage → 최종 답변","claim":"단계 선택과 사용자 요청을 바꾸면서 모델의 요청·실제 실행·응답 재입력이 언제 일어나는지 확인합니다.","demo":"protocol-lab","why":""},{"id":"d29-c2-07","chapter":2,"kind":"practice","title":"실습 02 안내 · Tool Calling 메시지 추적","claim":"앞의 개념과 코드를 하나의 구현 결과로 연결합니다. 각 수준은 같은 목표를 공유하며 TODO 범위와 책임 분리가 달라집니다.","prep":"교육용 AIMessage/tool_calls/ToolMessage 예시","goal":"Tool Call ID와 인수·결과의 연결을 설명하는 Trace 표","levels":[["01_basic","제공된 Tool Call에서 name·args·id를 읽고 결과 메시지와 연결합니다."],["02_intermediate","두 Tool Call ID의 순서·결과를 매칭하고 잘못된 호출을 식별합니다."],["03_advanced","허용되지 않은 Tool, 응답 누락, 중복 ID를 검사하는 Dispatch Contract를 구현합니다."]],"checks":[["`model.bind_tools()` 호출 즉시 DB에 SELECT가 실행되나요?","아니요. Tool Schema를 모델에 전달할 뿐, 실제 실행은 별도입니다."],["도구 결과의 ID가 왜 필요한가요?","어떤 Tool Call의 결과인지 메시지를 연결하기 위해서입니다."]],"notice":"실습에서는 결과를 미리 정의한 Fixture로 확인하고 모델 API 호출과 구분합니다."},{"id":"d29-c3-01","chapter":3,"kind":"concept","title":"Tool은 무엇이며 어떤 계약을 가져야 하나요?","claim":"Tool은 Agent가 사용할 수 있게 이름·설명·입력 Schema·반환값을 명시한 호출 가능한 기능입니다.","items":[["Name","모델이 선택할 고유한 이름입니다. 예: rag_search, lookup_status."],["Description","언제 이 Tool을 써야 하는지 설명합니다. 모델 선택에 중요한 맥락입니다."],["Args Schema","입력 필드·자료형·허용 범위를 정의합니다. 예: task_id는 양의 정수."],["Output Contract","성공·미존재·권한 실패·서비스 오류를 구분해 반환합니다."]],"example":"현업에서는 Agent Platform 담당자가 Tool 계약을 설계하고, Data/DB 담당자는 조회 구현과 권한 검증을 맡기도 합니다.","point":"Tool은 단순 함수 이름 목록이 아닙니다. 애매한 Docstring과 무제한 인수는 잘못된 Tool 선택 또는 위험한 실행으로 이어집니다.","refs":["tools"]},{"id":"d29-c3-02","chapter":3,"kind":"code","title":"`@tool`은 일반 Python 함수를 LangChain Tool로 만듭니다","claim":"Decorator가 함수 이름·Docstring·Type Hint를 읽어 모델에게 제공할 Tool 정의를 구성합니다.","filename":"03_first_tool.py","raw":"from langchain.tools import tool\n\n@tool\ndef rag_search(query: str, category: str = \"학사\") -> str:\n    \"\"\"Search policy documents and return cited evidence for a question.\n\n    Args:\n        query: Search phrase about a policy or procedure.\n        category: Document category, e.g. 학사 or 시설.\n    \"\"\"\n    # 여기서는 교육용 결과만 반환합니다. Day27 RAG는 Chapter 04에서 연결.\n    return f\"[demo] {category} 문서에서 {query} 관련 근거 확인\"\n\nprint(rag_search.name)              # rag_search\nprint(rag_search.args)              # Tool Schema 필드\nprint(rag_search.invoke({\"query\": \"과제 제출 규정\"}))\n","terms":[["@tool","함수를 도구 객체로 만드는 Decorator","Name·Description·Args Schema 제공"],["Docstring","함수가 하는 일과 인수 설명","모델의 Tool 선택에 도움"],["Type Hint","query: str 같은 자료형 선언","기본 입력 Schema 생성"]],"io":["함수 + Decorator","StructuredTool + Schema","invoke() 시 Python 함수 실행"],"trace":[],"note":"","runtime":"requires SDK","refs":["tools"],"hl":["<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">tools</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">tool</span>","&nbsp;","<span class=\"tk-var\">@tool</span>","<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">rag_search</span>(<span class=\"tk-var\">query</span>: <span class=\"tk-type\">str</span>, <span class=\"tk-var\">category</span>: <span class=\"tk-type\">str</span> <span class=\"tk-op\">=</span> <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">학사</span><span class=\"tk-str\">&quot;</span>) <span class=\"tk-op\">-</span><span class=\"tk-op\">&gt;</span> <span class=\"tk-type\">str</span>:","    <span class=\"tk-str\">&quot;&quot;&quot;</span><span class=\"tk-str\">Search policy documents and return cited evidence for a question.</span>","&nbsp;","    <span class=\"tk-var\">Args</span>:","        <span class=\"tk-var\">query</span>: <span class=\"tk-var\">Search</span> <span class=\"tk-var\">phrase</span> <span class=\"tk-var\">about</span> <span class=\"tk-var\">a</span> <span class=\"tk-var\">policy</span> <span class=\"tk-op\">or</span> <span class=\"tk-var\">procedure</span><span class=\"tk-op\">.</span>","        <span class=\"tk-var\">category</span>: <span class=\"tk-var\">Document</span> <span class=\"tk-var\">category</span>, <span class=\"tk-var\">e</span><span class=\"tk-op\">.</span><span class=\"tk-var\">g</span><span class=\"tk-op\">.</span> <span class=\"tk-var\">학사</span> <span class=\"tk-op\">or</span> <span class=\"tk-var\">시설</span><span class=\"tk-op\">.</span>","    <span class=\"tk-str\">&quot;&quot;&quot;</span>","    <span class=\"tk-comment\"># 여기서는 교육용 결과만 반환합니다. Day27 RAG는 Chapter 04에서 연결.</span>","    <span class=\"tk-kw\">return</span> <span class=\"tk-str\">f</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">[demo] </span><span class=\"tk-str\">{</span><span class=\"tk-var\">category</span><span class=\"tk-str\">}</span><span class=\"tk-str\"> 문서에서 </span><span class=\"tk-str\">{</span><span class=\"tk-var\">query</span><span class=\"tk-str\">}</span><span class=\"tk-str\"> 관련 근거 확인</span><span class=\"tk-str\">&quot;</span>","&nbsp;","<span class=\"tk-type\">print</span>(<span class=\"tk-var\">rag_search</span><span class=\"tk-op\">.</span><span class=\"tk-var\">name</span>)              <span class=\"tk-comment\"># rag_search</span>","<span class=\"tk-type\">print</span>(<span class=\"tk-var\">rag_search</span><span class=\"tk-op\">.</span><span class=\"tk-var\">args</span>)              <span class=\"tk-comment\"># Tool Schema 필드</span>","<span class=\"tk-type\">print</span>(<span class=\"tk-var\">rag_search</span><span class=\"tk-op\">.</span><span class=\"tk-var\">invoke</span>({<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">query</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">과제 제출 규정</span><span class=\"tk-str\">&quot;</span>}))"]},{"id":"d29-c3-03","chapter":3,"kind":"table","title":"Tool Schema의 실제 JSON 모습","claim":"Tool Calling 모델은 설명문뿐 아니라 어떤 필드를 채워야 하는지 구조적으로 확인합니다.","headers":["Schema 항목","예시","설명"],"rows":[["name","lookup_status","모델이 제안할 도구 이름"],["description","Read a task submission status","이 도구를 언제 쓰는지 설명"],["properties.task_id","{\"type\":\"integer\",\"minimum\":1}","양의 정수 인수"],["required","[\"task_id\"]","요청에 꼭 있어야 하는 값"],["return","{\"status\":\"submitted\"}","실행 후 반환하는 애플리케이션 계약"]],"note":"JSON Schema는 “요청을 검증할 형식”이지 실제 조회 권한을 대신하지 않습니다. 서버는 실행 전 필드를 다시 검증합니다. 여기의 return 행은 모델에 제공하는 Tool 입력 JSON Schema의 필드가 아니라, 개발자가 별도로 정의한 Tool Output Contract 예시입니다.","refs":["tools"]},{"id":"d29-c3-04","chapter":3,"kind":"code","title":"Pydantic `Field`로 잘못된 Tool 인수를 걸러냅니다","claim":"모델이 잘못된 `task_id`를 생성하더라도 Pydantic Schema에서 허용 범위를 검사할 수 있습니다.","filename":"03_status_schema.py","raw":"from pydantic import BaseModel, Field, ValidationError\nfrom langchain.tools import tool\n\nclass StatusArgs(BaseModel):\n    task_id: int = Field(ge=1, strict=True, description=\"조회할 과제의 양의 정수 ID\")\n\n@tool(args_schema=StatusArgs)\ndef lookup_status(task_id: int) -> str:\n    \"\"\"Get a task submission status; actual DB access is implemented later.\"\"\"\n    return f\"task {task_id}: submitted (demo)\"\n\ntry:\n    print(StatusArgs.model_validate({\"task_id\": -1}))\nexcept ValidationError as exc:\n    print(\"입력 검증 실패:\", exc.errors()[0][\"type\"])\n","terms":[["BaseModel","Pydantic 검증 Schema의 기반 클래스","요청 필드 형식 규정"],["Field(ge=1, strict=True)","양의 정수만 허용하는 제약","음수·문자열 과제 ID 차단"],["ValidationError","Schema를 통과하지 못한 입력 오류","도구 실행 전에 탐지"]],"io":["tool_call.args","Pydantic 검사","통과 시 Tool 실행, 실패 시 오류"],"trace":[],"note":"","runtime":"requires SDK","refs":["tools","pydantic"],"hl":["<span class=\"tk-kw\">from</span> <span class=\"tk-var\">pydantic</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">BaseModel</span>, <span class=\"tk-var\">Field</span>, <span class=\"tk-var\">ValidationError</span>","<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">tools</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">tool</span>","&nbsp;","<span class=\"tk-kw\">class</span> <span class=\"tk-type\">StatusArgs</span>(<span class=\"tk-var\">BaseModel</span>):","    <span class=\"tk-var\">task_id</span>: <span class=\"tk-type\">int</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">Field</span>(<span class=\"tk-var\">ge</span><span class=\"tk-op\">=</span><span class=\"tk-num\">1</span>, <span class=\"tk-var\">strict</span><span class=\"tk-op\">=</span><span class=\"tk-kw\">True</span>, <span class=\"tk-var\">description</span><span class=\"tk-op\">=</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">조회할 과제의 양의 정수 ID</span><span class=\"tk-str\">&quot;</span>)","&nbsp;","<span class=\"tk-var\">@tool</span>(<span class=\"tk-var\">args_schema</span><span class=\"tk-op\">=</span><span class=\"tk-var\">StatusArgs</span>)","<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">lookup_status</span>(<span class=\"tk-var\">task_id</span>: <span class=\"tk-type\">int</span>) <span class=\"tk-op\">-</span><span class=\"tk-op\">&gt;</span> <span class=\"tk-type\">str</span>:","    <span class=\"tk-str\">&quot;&quot;&quot;Get a task submission status; actual DB access is implemented later.&quot;&quot;&quot;</span>","    <span class=\"tk-kw\">return</span> <span class=\"tk-str\">f</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">task </span><span class=\"tk-str\">{</span><span class=\"tk-var\">task_id</span><span class=\"tk-str\">}</span><span class=\"tk-str\">: submitted (demo)</span><span class=\"tk-str\">&quot;</span>","&nbsp;","<span class=\"tk-kw\">try</span>:","    <span class=\"tk-type\">print</span>(<span class=\"tk-var\">StatusArgs</span><span class=\"tk-op\">.</span><span class=\"tk-var\">model_validate</span>({<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">task_id</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-op\">-</span><span class=\"tk-num\">1</span>}))","<span class=\"tk-kw\">except</span> <span class=\"tk-var\">ValidationError</span> <span class=\"tk-kw\">as</span> <span class=\"tk-var\">exc</span>:","    <span class=\"tk-type\">print</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">입력 검증 실패:</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-var\">exc</span><span class=\"tk-op\">.</span><span class=\"tk-var\">errors</span>()[<span class=\"tk-num\">0</span>][<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">type</span><span class=\"tk-str\">&quot;</span>])"]},{"id":"d29-c3-05","chapter":3,"kind":"concept","title":"Tool 결과는 무엇을 돌려주어야 하나요?","claim":"모델에게 읽힐 결과와 서버가 검증·기록할 결과의 책임을 구분해야 합니다.","items":[["성공","status, result, sources를 일관되게 작성합니다. 예: status=answered."],["No-answer","검색 근거가 없으면 status=insufficient_context로 표시하고 없는 정보를 만들어 내지 않습니다."],["Not Found","DB에 과제가 없으면 status=not_found를 명시합니다."],["Forbidden / Error","권한 위반이나 DB 장애는 조회 실패와 별도의 오류로 처리합니다."]],"example":"현업 예: 고객지원 Agent가 “답할 정보 없음”과 “DB 인증 실패”를 구분해야 무분별한 재시도를 막고 운영자가 문제를 추적할 수 있습니다.","point":"Python 함수 반환이 자동으로 API 성공 응답이 되는 것은 아닙니다. 서버는 결과·출처·상태를 다시 검증합니다."},{"id":"d29-c3-06","chapter":3,"kind":"concept","title":"모델의 Tool 선택과 서버 검증은 역할이 다릅니다","claim":"Schema가 맞는 입력도 권한 없는 데이터를 가져오는 요청일 수 있습니다. 모델의 “이 데이터를 조회해도 된다”는 판단을 보안 검증으로 사용하지 않습니다.","items":[["Schema 검사","task_id가 올바른 정수인지, category가 허용 목록인지 검사합니다."],["권한 검사","현재 인증된 사용자가 해당 task_id의 소유자인지 서버가 확인합니다."],["최소 권한","DB 계정에는 실제로 필요한 SELECT 권한만 부여합니다."],["오류 기록","유효성 오류·권한 오류·존재하지 않는 ID·DB 장애를 분리합니다."]],"example":"예: 사용자가 자신의 과제 101을 조회하는 것은 허용되지만 타인의 과제 202를 모델이 지정해도 DB에서는 차단되어야 합니다.","point":"모델에게 user_id를 요청받아 그대로 신뢰하면 타인 정보가 노출될 수 있습니다. 신뢰할 수 있는 서버 인증 컨텍스트가 필수입니다.","refs":["tools","postgres"]},{"id":"d29-c3-07","chapter":3,"kind":"demo","title":"시연 · Tool Schema 검사기를 사용해 봅니다","claim":"task_id·category를 바꾸면 입력 검증이 통과하는지와 실제 실행 전에 막히는 이유를 확인합니다.","demo":"schema-lab","why":""},{"id":"d29-c3-08","chapter":3,"kind":"practice","title":"실습 03 안내 · `@tool`·Schema·검증","claim":"앞의 개념과 코드를 하나의 구현 결과로 연결합니다. 각 수준은 같은 목표를 공유하며 TODO 범위와 책임 분리가 달라집니다.","prep":"Python 함수·Type Hint·Pydantic 예제","goal":"이름·Schema가 명확하고 음수 ID를 거절하는 Tool","levels":[["01_basic","@tool 함수와 Docstring을 완성하고 `.invoke()`로 교육용 결과를 확인합니다."],["02_intermediate","Pydantic args_schema와 입력 오류 테스트를 추가합니다."],["03_advanced","Schema 검증과 인증·권한 검증을 분리한 Tool Contract를 설계합니다."]],"checks":[["Type Hint만 넣으면 접근 권한까지 검사되나요?","아니요. 자료형 검사는 권한 검사를 대체하지 못합니다."],["Docstring이 중요한 이유는?","모델이 Tool 목적과 적절한 사용 시점을 파악하도록 돕기 때문입니다."]],"notice":"실제 DB 작업은 실습 05에서 수행합니다. 여기서는 Tool 정의와 입력 계약에 집중합니다."},{"id":"d29-c4-01","chapter":4,"kind":"process","title":"기존 Day27 RAG를 `rag_search` Tool로 재사용합니다","claim":"RAG를 처음부터 다시 만드는 것이 아니라 이미 작동하는 검색·생성·출처 검증 기능에 Tool 인터페이스를 추가합니다.","steps":[["Agent","rag_search 요청"],["Tool Wrapper","입력·권한"],["RAG","E5·pgvector"],["Rerank","GPU CrossEncoder"],["Generation","Context+LLM"],["Tool Result","status·sources"]],"details":[["재사용","Day26 Basic RAG, Day27 Rewrite·Reranking, Day28 품질 평가 결과를 그대로 사용합니다."],["새로 구현","@tool Wrapper가 query/category를 받고 기존 RAG 서비스 함수를 호출합니다."],["분리해야 할 것","Golden Labels는 오프라인 평가용이며 실제 Agent Tool 입력에는 포함하지 않습니다."]],"note":"RAG 전체를 답변 Tool로 감싸는 방식을 먼저 배우고, 검색 결과만 반환하는 Tool은 비용 최적화 대안으로 비교합니다.","refs":["rag"]},{"id":"d29-c4-02","chapter":4,"kind":"concept","title":"RAG를 Tool로 노출할 때 무엇이 달라지나요?","claim":"RAG Pipeline 내부는 그대로이지만 “사용자 질문마다 무조건 실행”하던 방식에서 “Agent가 필요할 때 호출”하는 기능으로 바뀝니다.","items":[["입력","query, category처럼 Tool에 필요한 필드만 받고, 권한·신원은 서버에서 전달합니다."],["내부 처리","E5 query Embedding(CUDA) → pgvector → Reranker(CUDA) → Context → LLM."],["출력","근거 기반 answer, verified sources, status를 반환합니다."],["실무 적용","문서 기반 업무 규정 문의, 사내 Wiki 검색, 고객지원 지식베이스에 사용됩니다."]],"example":"예: “제출 기한이 지나면 어떻게 되나요?”는 RAG Tool 하나로 충분할 수 있습니다. 제출한 실제 상태는 추가 DB Tool이 필요합니다.","point":"기존 RAG API의 응답 형식이 서로 다를 수 있으므로 Wrapper에서 정해진 Tool 결과 계약으로 변환해야 합니다. 다만 Category allowlist는 문서 접근 권한 검사가 아닙니다. 실제 RAG 내부에서 인증된 사용자 기준으로 접근 가능한 문서를 필터링해야 합니다."},{"id":"d29-c4-03","chapter":4,"kind":"code","title":"`rag_search` Wrapper로 실제 RAG를 감쌉니다","claim":"아래 예제는 기존 Day27 RAG 서비스에 맞춰 함수 이름·반환 구조를 연결할 자리입니다. 함수가 저절로 생기는 것은 아닙니다.","filename":"04_rag_tool.py","raw":"import json\nfrom langchain.tools import tool\n\n# Day27에서 구현한 Enhanced RAG 함수를 이 위치에 연결합니다.\n# from app.rag_service import run_enhanced_rag\n\ndef run_existing_rag(query: str, category: str) -> dict:\n    \"\"\"Adapter: replace this function body with your Day27 RAG service call.\"\"\"\n    raise NotImplementedError(\"Day27 RAG 연결 필요\")\n\n@tool\ndef rag_search(query: str, category: str = \"학사\") -> str:\n    \"\"\"Search approved documents and return a grounded answer and citations.\"\"\"\n    if category not in {\"학사\", \"시설\"}:\n        raise ValueError(\"unsupported category\")\n    data = run_existing_rag(query=query, category=category)\n    # 이미 서버에서 검증한 sources만 전달합니다.\n    clean = {k: data[k] for k in (\"status\", \"answer\", \"sources\")}\n    return json.dumps(clean, ensure_ascii=False)\n","terms":[["Adapter","기존 서비스의 서로 다른 입력·출력 형태를 연결하는 얇은 함수","Day27 RAG 호출 교체"],["NotImplementedError","연결해야 할 외부 코드를 아직 넣지 않았다는 표시","실행 가능한 완성본이라고 오인 방지"]],"io":["query·category + 내부 인증 컨텍스트","Day27 RAG Service 실제 호출","status·answer·검증된 sources"],"trace":[],"note":"현업에서는 sources가 실제 included_ids에 속하는지 검증한 뒤 반환해야 합니다.","runtime":"integration skeleton","refs":["rag","tools"],"hl":["<span class=\"tk-kw\">import</span> <span class=\"tk-var\">json</span>","<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">tools</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">tool</span>","&nbsp;","<span class=\"tk-comment\"># Day27에서 구현한 Enhanced RAG 함수를 이 위치에 연결합니다.</span>","<span class=\"tk-comment\"># from app.rag_service import run_enhanced_rag</span>","&nbsp;","<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">run_existing_rag</span>(<span class=\"tk-var\">query</span>: <span class=\"tk-type\">str</span>, <span class=\"tk-var\">category</span>: <span class=\"tk-type\">str</span>) <span class=\"tk-op\">-</span><span class=\"tk-op\">&gt;</span> <span class=\"tk-type\">dict</span>:","    <span class=\"tk-str\">&quot;&quot;&quot;Adapter: replace this function body with your Day27 RAG service call.&quot;&quot;&quot;</span>","    <span class=\"tk-kw\">raise</span> <span class=\"tk-var\">NotImplementedError</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">Day27 RAG 연결 필요</span><span class=\"tk-str\">&quot;</span>)","&nbsp;","<span class=\"tk-var\">@tool</span>","<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">rag_search</span>(<span class=\"tk-var\">query</span>: <span class=\"tk-type\">str</span>, <span class=\"tk-var\">category</span>: <span class=\"tk-type\">str</span> <span class=\"tk-op\">=</span> <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">학사</span><span class=\"tk-str\">&quot;</span>) <span class=\"tk-op\">-</span><span class=\"tk-op\">&gt;</span> <span class=\"tk-type\">str</span>:","    <span class=\"tk-str\">&quot;&quot;&quot;Search approved documents and return a grounded answer and citations.&quot;&quot;&quot;</span>","    <span class=\"tk-kw\">if</span> <span class=\"tk-var\">category</span> <span class=\"tk-op\">not</span> <span class=\"tk-op\">in</span> {<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">학사</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">시설</span><span class=\"tk-str\">&quot;</span>}:","        <span class=\"tk-kw\">raise</span> <span class=\"tk-var\">ValueError</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">unsupported category</span><span class=\"tk-str\">&quot;</span>)","    <span class=\"tk-var\">data</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">run_existing_rag</span>(<span class=\"tk-var\">query</span><span class=\"tk-op\">=</span><span class=\"tk-var\">query</span>, <span class=\"tk-var\">category</span><span class=\"tk-op\">=</span><span class=\"tk-var\">category</span>)","    <span class=\"tk-comment\"># 이미 서버에서 검증한 sources만 전달합니다.</span>","    <span class=\"tk-var\">clean</span> <span class=\"tk-op\">=</span> {<span class=\"tk-var\">k</span>: <span class=\"tk-var\">data</span>[<span class=\"tk-var\">k</span>] <span class=\"tk-kw\">for</span> <span class=\"tk-var\">k</span> <span class=\"tk-op\">in</span> (<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">status</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">answer</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">sources</span><span class=\"tk-str\">&quot;</span>)}","    <span class=\"tk-kw\">return</span> <span class=\"tk-var\">json</span><span class=\"tk-op\">.</span><span class=\"tk-var\">dumps</span>(<span class=\"tk-var\">clean</span>, <span class=\"tk-var\">ensure_ascii</span><span class=\"tk-op\">=</span><span class=\"tk-kw\">False</span>)"]},{"id":"d29-c4-04","chapter":4,"kind":"table","title":"Tool 결과의 출처 계약을 명확히 합니다","claim":"검증되지 않은 출처 ID를 Agent가 그대로 인용하면 Agent 응답이 그럴듯해도 신뢰할 수 없습니다.","headers":["필드","성공 예시","검사 기준"],"rows":[["status","answered","answered / insufficient_context / error 분리"],["answer","제출 기한은 담당자 공지 기준입니다.","해당 Context가 사실을 지지하는가"],["sources","[{source_id: \"C-17\", locator: \"policy.md#3\"}]","included_ids와 대조해 검증한 출처만 전달"],["missing_information","정확한 날짜를 알 수 없음","정보 부족 시 누락된 요소 표시"],["trace_id","req-001","오류/원문 점검용 내부 기록 ID"]],"note":"Agent는 RAG가 반환한 문자열을 다시 해석할 수 있지만, 최종 Citation Validator는 서버가 보관한 검증 출처를 기준으로 동작하도록 설계합니다."},{"id":"d29-c4-05","chapter":4,"kind":"concept","title":"RAG Tool 반환 설계 두 가지를 비교합니다","claim":"RAG를 Agent Tool로 만들 때 답변까지 생성할지, 검색 근거만 돌려줄지는 Latency·비용·품질 목표에 따라 결정합니다.","items":[["Answer Tool","기존 RAG가 내부 LLM까지 호출해 answer+sources를 반환합니다. 이전 수업을 재사용하기 쉽습니다."],["Evidence Tool","Retriever·Reranker가 선정한 Context와 sources만 Tool 결과로 반환하고 Agent가 최종 답변을 생성합니다."],["Trade-off","Answer Tool은 Agent가 다시 LLM을 호출하면 이중 생성 비용이 발생할 수 있습니다."],["오늘 선택","11/27 준비를 위해 구현이 단순한 Answer Tool을 사용하고, 최적화 설계는 비교만 합니다."]],"example":"현업 예: 문의 자동화 플랫폼에서는 근거 확보 Tool과 최종 응답 생성을 분리해 출처 검증을 통제하기도 합니다.","point":"둘 중 무엇이 “정답”인 것이 아니라 중복 LLM 호출 여부와 Context·Citation 계약을 측정해 선택합니다."},{"id":"d29-c4-06","chapter":4,"kind":"code","title":"No-answer와 서비스 오류를 구분합니다","claim":"검색 근거가 없다는 것은 정상적인 업무 결과일 수 있지만 CUDA OOM·DB 연결 실패는 시스템 오류입니다.","filename":"04_rag_result_contract.py","raw":"def normalize_rag_result(data: dict) -> dict:\n    status = data.get(\"status\")\n    if status == \"answered\":\n        if not data.get(\"sources\"):\n            raise ValueError(\"answered must have verified sources\")\n        return {\"status\": \"answered\", \"answer\": data[\"answer\"],\n                \"sources\": data[\"sources\"]}\n    if status == \"insufficient_context\":\n        if data.get(\"sources\"):\n            raise ValueError(\"no-answer cannot cite sources\")\n        return {\"status\": \"insufficient_context\", \"answer\": \"근거 부족\",\n                \"sources\": []}\n    # 401 인증 오류, DB 오류, GPU 오류 등은 실패로 유지합니다.\n    raise RuntimeError(f\"RAG execution failed: {status}\")\n","terms":[["insufficient_context","찾은 문서로 안전하게 답할 수 없음","정상 처리 가능 상태"],["RuntimeError","실제 실행 시스템이 실패한 상태","상위 서비스에서 별도 오류 기록"]],"io":["기존 RAG의 status·answer·sources","정규화된 Tool 결과","검증된 성공/정보 부족 또는 오류"],"trace":[],"note":"","runtime":"pure Python","hl":["<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">normalize_rag_result</span><span class=\"tk-var\">(</span><span class=\"tk-var\">data</span><span class=\"tk-var\">:</span> <span class=\"tk-var\">dict</span><span class=\"tk-var\">)</span> <span class=\"tk-op\">-</span><span class=\"tk-op\">&gt;</span> <span class=\"tk-var\">dict</span><span class=\"tk-var\">:</span>","    <span class=\"tk-var\">status</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">data</span><span class=\"tk-op\">.</span><span class=\"tk-var\">get</span><span class=\"tk-var\">(</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">status</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">)</span>","    <span class=\"tk-kw\">if</span> <span class=\"tk-var\">status</span> <span class=\"tk-op\">==</span> <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">answered</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">:</span>","        <span class=\"tk-kw\">if</span> <span class=\"tk-op\">not</span> <span class=\"tk-var\">data</span><span class=\"tk-op\">.</span><span class=\"tk-var\">get</span><span class=\"tk-var\">(</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">sources</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">)</span><span class=\"tk-var\">:</span>","            <span class=\"tk-kw\">raise</span> <span class=\"tk-var\">ValueError</span><span class=\"tk-var\">(</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">answered must have verified sources</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">)</span>","        <span class=\"tk-kw\">return</span> <span class=\"tk-var\">{</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">status</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">:</span> <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">answered</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">,</span> <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">answer</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">:</span> <span class=\"tk-var\">data</span><span class=\"tk-var\">[</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">answer</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">]</span><span class=\"tk-var\">,</span>","                <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">sources</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">:</span> <span class=\"tk-var\">data</span><span class=\"tk-var\">[</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">sources</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">]</span><span class=\"tk-var\">}</span>","    <span class=\"tk-kw\">if</span> <span class=\"tk-var\">status</span> <span class=\"tk-op\">==</span> <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">insufficient_context</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">:</span>","        <span class=\"tk-kw\">if</span> <span class=\"tk-var\">data</span><span class=\"tk-op\">.</span><span class=\"tk-var\">get</span><span class=\"tk-var\">(</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">sources</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">)</span><span class=\"tk-var\">:</span>","            <span class=\"tk-kw\">raise</span> <span class=\"tk-var\">ValueError</span><span class=\"tk-var\">(</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">no-answer cannot cite sources</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">)</span>","        <span class=\"tk-kw\">return</span> <span class=\"tk-var\">{</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">status</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">:</span> <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">insufficient_context</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">,</span> <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">answer</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">:</span> <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">근거 부족</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">,</span>","                <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">sources</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">:</span> <span class=\"tk-var\">[</span><span class=\"tk-var\">]</span><span class=\"tk-var\">}</span>","    <span class=\"tk-comment\"># 401 인증 오류, DB 오류, GPU 오류 등은 실패로 유지합니다.</span>","    <span class=\"tk-kw\">raise</span> <span class=\"tk-var\">RuntimeError</span><span class=\"tk-var\">(</span><span class=\"tk-str\">f</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">RAG execution failed: </span><span class=\"tk-str\">{</span><span class=\"tk-var\">status</span><span class=\"tk-str\">}</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">)</span>"]},{"id":"d29-c4-07","chapter":4,"kind":"demo","title":"시연 · RAG Tool의 반환값을 확인합니다","claim":"질문·Tool 방식·실패 유형을 바꾸며 verified sources, No-answer, 비용 차이를 관찰합니다.","demo":"rag-tool-lab","why":""},{"id":"d29-c4-08","chapter":4,"kind":"practice","title":"실습 04 안내 · 기존 RAG를 Tool로 감싸기","claim":"앞의 개념과 코드를 하나의 구현 결과로 연결합니다. 각 수준은 같은 목표를 공유하며 TODO 범위와 책임 분리가 달라집니다.","prep":"Day27 Enhanced RAG 코드·실습 03의 @tool","goal":"rag_search(query, category)의 명확한 성공/오류 출력","levels":[["01_basic","기존 RAG 호출부를 @tool Wrapper로 연결하고 결과를 확인합니다."],["02_intermediate","status·answer·sources를 검증하며 No-answer와 오류를 분리합니다."],["03_advanced","권한·출처 ID·Latency·예외를 기록하고 이중 생성 비용을 비교합니다."]],"checks":[["Gold Label을 rag_search 입력에 넣어도 되나요?","안 됩니다. Gold는 평가 전용 정답입니다."],["Retriever가 문서를 반환한 것과 그 문서를 답변 근거로 사용한 것은 같은가요?","아닙니다. 실제 포함된 Context ID만 인용 근거가 됩니다."]],"notice":"Day27 프로젝트별 함수 이름은 다를 수 있으므로 기존 구현에 맞춰 Adapter를 연결해야 합니다."},{"id":"d29-c5-01","chapter":5,"kind":"process","title":"PostgreSQL 조회는 Agent의 두 번째 Tool입니다","claim":"문서 규정은 RAG에 있고, 개인의 제출 상태는 PostgreSQL에 있습니다. 구조화된 최신 상태를 안전하게 조회하는 별도 Tool이 필요합니다.","steps":[["Agent","lookup_status 요청"],["Authorization","인증된 사용자 기준 조회 허용 확인"],["DB Tool","SQL 파라미터"],["PostgreSQL","SELECT + owner"],["ToolMessage","현재 상태"]],"details":[["DB는 누가 쓰나요?","Tool 내부에 개발자가 작성한 Parameterized SQL을 사용합니다. LLM에 SQL 실행 권한을 주지 않습니다."],["어떤 신원을 쓰나요?","로그인 인증을 거친 서버의 user_id를 Runtime Context로 전달합니다. 모델이 생성한 값은 신원으로 신뢰하지 않습니다."],["최소 권한","DB의 전용 읽기 계정은 SELECT만 가능하도록 권한을 제한합니다."],["Authentication vs Authorization","FastAPI는 Agent 실행 전에 로그인 신원을 인증합니다(Authentication). DB Tool은 그 신원과 task_id로 조회 권한을 판단합니다(Authorization)."]],"note":"","refs":["tools","psycopg","postgres"]},{"id":"d29-c5-02","chapter":5,"kind":"concept","title":"`lookup_status`는 무엇을 반환할까요?","claim":"사용자가 지정한 과제 ID에 대해 현재 인증된 사용자 자신의 제출 상태만 읽어 반환하는 Read-only Tool입니다.","items":[["Tool 인수","task_id는 모델이 선택하는 양의 정수입니다."],["신뢰된 값","user_id는 FastAPI 인증 계층에서 확인한 서버 측 값입니다."],["DB 결과","submitted, pending 같은 상태와 업데이트 시각을 읽습니다."],["구분할 실패","없는 ID, 타인 데이터, DB 장애를 모두 “제출 안 됨”으로 바꾸지 않습니다."]],"example":"예: user=stu-001의 과제 101은 submitted일 수 있지만, 202는 stu-002의 과제라 조회가 금지됩니다.","point":"예제 데이터는 교육용 합성 데이터입니다. 실무에서는 민감도·최소한의 반환 필드·감사 로그를 추가합니다."},{"id":"d29-c5-03","chapter":5,"kind":"table","title":"현업 DB 테이블의 구조와 샘플 행","claim":"실습의 데이터가 실제로 어디에 저장되어 있는지 Schema·PK·소유자·상태를 먼저 연결합니다.","headers":["task_id (PK)","owner_id","submission_status","updated_at"],"rows":[["101","stu-001","submitted","2026-11-26 09:05"],["102","stu-001","pending","2026-11-26 10:20"],["202","stu-002","submitted","2026-11-25 17:30"]],"note":"교육용 합성 데이터입니다. 실제 테이블은 현재 수강생 프로젝트의 스키마에 맞게 이름과 타입을 조정합니다."},{"id":"d29-c5-04","chapter":5,"kind":"code","title":"Parameterized SQL로 읽기 전용 조회를 구현합니다","claim":"사용자 입력을 SQL 문자열로 이어 붙이는 대신 `%s` Parameter Placeholder를 사용해 데이터로 전달합니다.","filename":"05_read_only_query.py","raw":"import os\nimport psycopg\n\nSQL = \"\"\"SELECT task_id, submission_status, updated_at\n         FROM task_submissions\n         WHERE task_id = %s AND owner_id = %s\"\"\"\n\ndef read_submission(task_id: int, user_id: str) -> dict:\n    # DATABASE_URL은 SELECT만 허용된 전용 DB 계정이어야 합니다.\n    with psycopg.connect(os.environ[\"DATABASE_URL\"]) as conn:\n        with conn.cursor() as cur:\n            cur.execute(SQL, (task_id, user_id))  # 둘 다 값으로 바인딩\n            row = cur.fetchone()\n    if row is None:\n        return {\"status\": \"not_found_or_forbidden\"}\n    return {\"status\": \"ok\", \"task_id\": row[0],\n            \"submission_status\": row[1],\n            \"updated_at\": row[2].isoformat()}\n","terms":[["%s Placeholder","SQL과 사용자 입력 값을 분리하는 자리 표시자","SQL Injection 위험을 줄임"],["SELECT","데이터를 변경하지 않고 조회","Read-only Tool 핵심"]],"io":["task_id + 신뢰된 user_id","Parameterized SELECT + owner_id 조건","존재하는 본인 결과 또는 미조회"],"trace":[],"note":"결과가 없는 경우 실제로 미존재인지 권한 밖인지 외부에 구분 노출하지 않는 정책도 가능합니다.","runtime":"requires PostgreSQL+psycopg","refs":["psycopg","postgres"],"hl":["<span class=\"tk-kw\">import</span> <span class=\"tk-var\">os</span>","<span class=\"tk-kw\">import</span> <span class=\"tk-var\">psycopg</span>","&nbsp;","<span class=\"tk-var\">SQL</span> <span class=\"tk-op\">=</span> <span class=\"tk-str\">&quot;&quot;&quot;</span><span class=\"tk-str\">SELECT task_id, submission_status, updated_at</span>","         <span class=\"tk-var\">FROM</span> <span class=\"tk-var\">task_submissions</span>","         <span class=\"tk-var\">WHERE</span> <span class=\"tk-var\">task_id</span> <span class=\"tk-op\">=</span> <span class=\"tk-op\">%</span><span class=\"tk-var\">s</span> <span class=\"tk-var\">AND</span> <span class=\"tk-var\">owner_id</span> <span class=\"tk-op\">=</span> <span class=\"tk-op\">%</span><span class=\"tk-var\">s</span><span class=\"tk-str\">&quot;&quot;&quot;</span>","&nbsp;","<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">read_submission</span>(<span class=\"tk-var\">task_id</span>: <span class=\"tk-type\">int</span>, <span class=\"tk-var\">user_id</span>: <span class=\"tk-type\">str</span>) <span class=\"tk-op\">-</span><span class=\"tk-op\">&gt;</span> <span class=\"tk-type\">dict</span>:","    <span class=\"tk-comment\"># DATABASE_URL은 SELECT만 허용된 전용 DB 계정이어야 합니다.</span>","    <span class=\"tk-kw\">with</span> <span class=\"tk-var\">psycopg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">connect</span>(<span class=\"tk-var\">os</span><span class=\"tk-op\">.</span><span class=\"tk-var\">environ</span>[<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">DATABASE_URL</span><span class=\"tk-str\">&quot;</span>]) <span class=\"tk-kw\">as</span> <span class=\"tk-var\">conn</span>:","        <span class=\"tk-kw\">with</span> <span class=\"tk-var\">conn</span><span class=\"tk-op\">.</span><span class=\"tk-var\">cursor</span>() <span class=\"tk-kw\">as</span> <span class=\"tk-var\">cur</span>:","            <span class=\"tk-var\">cur</span><span class=\"tk-op\">.</span><span class=\"tk-var\">execute</span>(<span class=\"tk-var\">SQL</span>, (<span class=\"tk-var\">task_id</span>, <span class=\"tk-var\">user_id</span>))  <span class=\"tk-comment\"># 둘 다 값으로 바인딩</span>","            <span class=\"tk-var\">row</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">cur</span><span class=\"tk-op\">.</span><span class=\"tk-var\">fetchone</span>()","    <span class=\"tk-kw\">if</span> <span class=\"tk-var\">row</span> <span class=\"tk-op\">is</span> <span class=\"tk-kw\">None</span>:","        <span class=\"tk-kw\">return</span> {<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">status</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">not_found_or_forbidden</span><span class=\"tk-str\">&quot;</span>}","    <span class=\"tk-kw\">return</span> {<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">status</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">ok</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">task_id</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-var\">row</span>[<span class=\"tk-num\">0</span>],","            <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">submission_status</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-var\">row</span>[<span class=\"tk-num\">1</span>],","            <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">updated_at</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-var\">row</span>[<span class=\"tk-num\">2</span>]<span class=\"tk-op\">.</span><span class=\"tk-var\">isoformat</span>()}"]},{"id":"d29-c5-05","chapter":5,"kind":"concept","title":"`ToolRuntime`는 서버 인증 정보를 어떻게 전달하나요?","claim":"ToolRuntime는 Agent 실행 중 사용 가능한 State·Context 등에 접근하는 LangChain 인터페이스입니다. 서버가 전달한 인증 정보를 모델의 Tool 인수와 분리할 때 유용합니다.","items":[["Model-visible args","task_id는 모델이 선택할 수 있는 인수입니다."],["Injected Runtime","runtime은 Agent Harness가 주입합니다. LLM Tool Schema에는 사용자 신원 필드로 노출하지 않습니다."],["context_schema","Dataclass 등으로 신뢰된 런타임 값을 정의할 수 있습니다."],["경계 조건","로그인하지 않은 요청은 Agent 실행 전에 API에서 거절해야 합니다."]],"example":"예: model은 lookup_status(task_id=101)를 요청하지만 runtime.context.user_id=stu-001은 인증된 FastAPI 요청에서 옵니다.","point":"Demo에서 user_id를 드롭다운으로 바꾸는 것은 권한 차이를 설명하기 위한 시뮬레이션일 뿐, 실무에서 사용자 입력을 그대로 신뢰하라는 뜻이 아닙니다. Authentication은 FastAPI에서 Agent 호출 전에 수행하고, Authorization은 각 Tool·DB의 실제 데이터 조회 전에 적용합니다.","refs":["tools"]},{"id":"d29-c5-06","chapter":5,"kind":"code","title":"`ToolRuntime[UserContext]`로 DB Tool 신원을 고정합니다","claim":"모델이 지정하는 값과 인증이 완료된 사용자 식별값을 함수 시그니처 수준에서 분리합니다.","filename":"05_lookup_tool.py","raw":"from dataclasses import dataclass\nfrom langchain.tools import tool, ToolRuntime\n\n@dataclass\nclass UserContext:\n    user_id: str  # 인증 middleware가 제공한 사용자 ID\n\n@tool\ndef lookup_status(task_id: int, runtime: ToolRuntime[UserContext]) -> dict:\n    \"\"\"Read the authenticated user's task submission status by task ID.\"\"\"\n    if task_id < 1:\n        raise ValueError(\"task_id must be positive\")\n    # 실제 DB 조회 구현은 05_read_only_query.py에서 가져옵니다.\n    return read_submission(task_id, runtime.context.user_id)\n\n# 모델에는 task_id만 Tool 인수로 보입니다.\n# read_submission()은 앞 페이지에서 정의한 외부 함수입니다.\n","terms":[["ToolRuntime","Agent 실행 컨텍스트를 Tool에 주입하는 인터페이스","LLM에 신뢰할 신원을 요구하지 않음"],["UserContext","서버 인증 정보의 자료형","context_schema로 Agent에 연결"]],"io":["모델 인수 task_id + 서버 주입 runtime","인증된 owner_id 조건 조회","본인 제출 상태만 반환"],"trace":[],"note":"","runtime":"requires SDK+DB adapter","refs":["tools"],"hl":["<span class=\"tk-kw\">from</span> <span class=\"tk-var\">dataclasses</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">dataclass</span>","<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">tools</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">tool</span>, <span class=\"tk-var\">ToolRuntime</span>","&nbsp;","<span class=\"tk-var\">@dataclass</span>","<span class=\"tk-kw\">class</span> <span class=\"tk-type\">UserContext</span>:","    <span class=\"tk-var\">user_id</span>: <span class=\"tk-type\">str</span>  <span class=\"tk-comment\"># 인증 middleware가 제공한 사용자 ID</span>","&nbsp;","<span class=\"tk-var\">@tool</span>","<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">lookup_status</span>(<span class=\"tk-var\">task_id</span>: <span class=\"tk-type\">int</span>, <span class=\"tk-var\">runtime</span>: <span class=\"tk-var\">ToolRuntime</span>[<span class=\"tk-var\">UserContext</span>]) <span class=\"tk-op\">-</span><span class=\"tk-op\">&gt;</span> <span class=\"tk-type\">dict</span>:","    <span class=\"tk-str\">&quot;&quot;&quot;Read the authenticated user&#x27;s task submission status by task ID.&quot;&quot;&quot;</span>","    <span class=\"tk-kw\">if</span> <span class=\"tk-var\">task_id</span> <span class=\"tk-op\">&lt;</span> <span class=\"tk-num\">1</span>:","        <span class=\"tk-kw\">raise</span> <span class=\"tk-var\">ValueError</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">task_id must be positive</span><span class=\"tk-str\">&quot;</span>)","    <span class=\"tk-comment\"># 실제 DB 조회 구현은 05_read_only_query.py에서 가져옵니다.</span>","    <span class=\"tk-kw\">return</span> <span class=\"tk-var\">read_submission</span>(<span class=\"tk-var\">task_id</span>, <span class=\"tk-var\">runtime</span><span class=\"tk-op\">.</span><span class=\"tk-var\">context</span><span class=\"tk-op\">.</span><span class=\"tk-var\">user_id</span>)","&nbsp;","<span class=\"tk-comment\"># 모델에는 task_id만 Tool 인수로 보입니다.</span>","<span class=\"tk-comment\"># read_submission()은 앞 페이지에서 정의한 외부 함수입니다.</span>"]},{"id":"d29-c5-07","chapter":5,"kind":"demo","title":"시연 · 다른 사용자·과제 ID를 조회해 봅니다","claim":"동일 task_id라도 인증된 user_id가 다르면 DB 조회 결과와 권한 판정이 어떻게 달라지는지 관찰합니다.","demo":"db-tool-lab","why":""},{"id":"d29-c5-08","chapter":5,"kind":"practice","title":"실습 05 안내 · PostgreSQL Read-only Tool","claim":"앞의 개념과 코드를 하나의 구현 결과로 연결합니다. 각 수준은 같은 목표를 공유하며 TODO 범위와 책임 분리가 달라집니다.","prep":"합성 task_submissions 테이블·psycopg·서버 인증 컨텍스트","goal":"본인 정보만 조회하고 오류를 명시하는 lookup_status","levels":[["01_basic","제공된 데이터로 task_id 101·102의 상태 조회를 구현합니다."],["02_intermediate","Parameterized SQL과 미존재/권한 실패 처리를 분리합니다."],["03_advanced","ToolRuntime 인증 컨텍스트, SELECT 전용 계정, 권한 회귀 테스트를 구성합니다."]],"checks":[["왜 `SELECT ... WHERE task_id=%s`만으로는 부족한가요?","owner_id 같은 신뢰된 사용자 범위를 함께 제한해야 타인 정보가 보이지 않습니다."],["모델이 user_id를 지정하도록 하면 되나요?","안 됩니다. 인증 계층에서 확인한 신원과 분리해야 합니다."]],"notice":"Windows 11 PostgreSQL 직접 설치 환경을 유지합니다. Docker·WSL은 필요하지 않습니다."},{"id":"d29-c6-01","chapter":6,"kind":"concept","title":"`create_agent`는 무엇을 자동으로 관리하나요?","claim":"LangChain `create_agent`는 Model과 등록된 Tools로 Agent 실행 구조를 만들어, Tool Call 요청·Tool 실행·결과의 모델 재입력·반복 종료를 관리합니다.","items":[["Model","Tool Calling 가능한 Chat Model을 지정합니다. 이번 과정에서는 ChatOpenAI를 사용합니다."],["Tools","rag_search와 lookup_status를 등록합니다. 모델에 노출되는 Tool Schema가 구성됩니다."],["system_prompt","어떤 때 어떤 Tool을 사용해야 하는지와 답변 정책을 제공합니다."],["Agent Loop","모델이 최종 응답을 할 때까지 Tool 실행과 모델 호출을 반복할 수 있습니다."]],"example":"현업에서는 개발자가 Agent의 모든 if/else를 직접 작성하지 않고도 Model + Tool의 연결 구조를 빠르게 구성할 수 있습니다.","point":"create_agent 자체가 권한 검증이나 데이터 품질을 대신하지 않습니다. Tool 내부의 읽기·검증·오류 규칙은 여전히 개발자 책임입니다.","refs":["agent"]},{"id":"d29-c6-02","chapter":6,"kind":"code","title":"실제 `create_agent()`를 구성합니다","claim":"Tool 목록을 넘기고 별도의 ChatOpenAI 객체를 지정합니다. 여기에는 두 도구가 앞의 페이지에서 정의돼 있어야 합니다.","filename":"06_create_agent.py","raw":"from langchain.agents import create_agent\nfrom langchain_openai import ChatOpenAI\nfrom langchain.agents.middleware import ToolCallLimitMiddleware\n\n# rag_search, lookup_status는 각자의 파일에서 import 합니다.\n# from app.tools.rag_tool import rag_search\n# from app.tools.db_tool import lookup_status, UserContext\n\nmodel = ChatOpenAI(model=\"gpt-4.1-mini\")  # API Key 필요\nagent = create_agent(\n    model=model,\n    tools=[rag_search, lookup_status],\n    system_prompt=(\"정책 질문은 rag_search로 확인하고, 제출 상태는 \"\n                   \"lookup_status로 확인하세요. 근거가 없으면 추측하지 마세요.\"),\n    context_schema=UserContext,\n    middleware=[ToolCallLimitMiddleware(run_limit=4)],\n)\n","terms":[["create_agent()","Model·Tools·Prompt·Middleware를 연결해 Agent 실행 구성","Tool Call 반복을 관리"],["context_schema","서버 신원 등 Runtime Context의 자료형","ToolRuntime과 연결"],["ToolCallLimitMiddleware","도구 호출 횟수에 상한 적용","반복 폭주 제한"]],"io":["Model + 2 Tool + Context","Agent 실행 객체",".invoke()로 실제 호출 가능"],"trace":[],"note":"실습 프로젝트에서는 주석 처리된 Tool import를 실제 경로로 변경합니다. API 인증이 필요합니다.","runtime":"integration skeleton","refs":["agent","middleware"],"hl":["<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">agents</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">create_agent</span>","<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain_openai</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">ChatOpenAI</span>","<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">agents</span><span class=\"tk-var\">.</span><span class=\"tk-var\">middleware</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">ToolCallLimitMiddleware</span>","&nbsp;","<span class=\"tk-comment\"># rag_search, lookup_status는 각자의 파일에서 import 합니다.</span>","<span class=\"tk-comment\"># from app.tools.rag_tool import rag_search</span>","<span class=\"tk-comment\"># from app.tools.db_tool import lookup_status, UserContext</span>","&nbsp;","<span class=\"tk-var\">model</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">ChatOpenAI</span>(<span class=\"tk-var\">model</span><span class=\"tk-op\">=</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">gpt-4.1-mini</span><span class=\"tk-str\">&quot;</span>)  <span class=\"tk-comment\"># API Key 필요</span>","<span class=\"tk-var\">agent</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">create_agent</span>(","    <span class=\"tk-var\">model</span><span class=\"tk-op\">=</span><span class=\"tk-var\">model</span>,","    <span class=\"tk-var\">tools</span><span class=\"tk-op\">=</span>[<span class=\"tk-var\">rag_search</span>, <span class=\"tk-var\">lookup_status</span>],","    <span class=\"tk-var\">system_prompt</span><span class=\"tk-op\">=</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">정책 질문은 rag_search로 확인하고, 제출 상태는 </span><span class=\"tk-str\">&quot;</span>","                   <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">lookup_status로 확인하세요. 근거가 없으면 추측하지 마세요.</span><span class=\"tk-str\">&quot;</span>),","    <span class=\"tk-var\">context_schema</span><span class=\"tk-op\">=</span><span class=\"tk-var\">UserContext</span>,","    <span class=\"tk-var\">middleware</span><span class=\"tk-op\">=</span>[<span class=\"tk-var\">ToolCallLimitMiddleware</span>(<span class=\"tk-var\">run_limit</span><span class=\"tk-op\">=</span><span class=\"tk-num\">4</span>)],",")"]},{"id":"d29-c6-03","chapter":6,"kind":"code","title":"`agent.invoke()`가 받는 메시지 구조","claim":"단일 질문만 보내는 것처럼 보여도 반환값에는 Tool Call과 ToolMessage가 누적될 수 있습니다.","filename":"06_agent_invoke.py","raw":"from langchain.messages import AIMessage, HumanMessage, ToolMessage\n\n# agent, UserContext는 앞 페이지에서 만든 객체입니다.\n# auth_user_id는 로그인 인증에 성공한 FastAPI 서버가 제공한 값입니다.\nrequest = \"과제 제출 규정과 내 101번 과제 제출 상태를 알려줘.\"\nresult = agent.invoke(\n    {\"messages\": [{\"role\": \"user\", \"content\": request}]},\n    context=UserContext(user_id=auth_user_id),\n)\n\nfor msg in result[\"messages\"]:\n    if isinstance(msg, AIMessage):\n        print(\"AI:\", msg.content, \"tool_calls:\", msg.tool_calls)\n    elif isinstance(msg, ToolMessage):\n        print(\"TOOL:\", msg.name, msg.tool_call_id, msg.content)\n    elif isinstance(msg, HumanMessage):\n        print(\"USER:\", msg.content)\n# 마지막 메시지가 무조건 정답이라고 가정하지 말고 결과를 검증합니다.\n","terms":[["agent.invoke()","Agent에 messages와 Runtime Context를 넣어 실행","모델·Tool 실행의 출발점"],["result[\"messages\"]","실행 중 쌓인 Human/AI/Tool 메시지 목록","Tool 실행 확인에 사용"]],"io":["messages + 인증된 UserContext","LLM 및 필요한 Tool 실행","messages Trace · 최종 응답"],"trace":[],"note":"","runtime":"integration skeleton","refs":["agent","tools"],"hl":["<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">messages</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">AIMessage</span>, <span class=\"tk-var\">HumanMessage</span>, <span class=\"tk-var\">ToolMessage</span>","&nbsp;","<span class=\"tk-comment\"># agent, UserContext는 앞 페이지에서 만든 객체입니다.</span>","<span class=\"tk-comment\"># auth_user_id는 로그인 인증에 성공한 FastAPI 서버가 제공한 값입니다.</span>","<span class=\"tk-var\">request</span> <span class=\"tk-op\">=</span> <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">과제 제출 규정과 내 101번 과제 제출 상태를 알려줘.</span><span class=\"tk-str\">&quot;</span>","<span class=\"tk-var\">result</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">agent</span><span class=\"tk-op\">.</span><span class=\"tk-var\">invoke</span>(","    {<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">messages</span><span class=\"tk-str\">&quot;</span>: [{<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">role</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">user</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">content</span><span class=\"tk-str\">&quot;</span>: <span class=\"tk-var\">request</span>}]},","    <span class=\"tk-var\">context</span><span class=\"tk-op\">=</span><span class=\"tk-var\">UserContext</span>(<span class=\"tk-var\">user_id</span><span class=\"tk-op\">=</span><span class=\"tk-var\">auth_user_id</span>),",")","&nbsp;","<span class=\"tk-kw\">for</span> <span class=\"tk-var\">msg</span> <span class=\"tk-op\">in</span> <span class=\"tk-var\">result</span>[<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">messages</span><span class=\"tk-str\">&quot;</span>]:","    <span class=\"tk-kw\">if</span> <span class=\"tk-type\">isinstance</span>(<span class=\"tk-var\">msg</span>, <span class=\"tk-var\">AIMessage</span>):","        <span class=\"tk-type\">print</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">AI:</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">content</span>, <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">tool_calls:</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">tool_calls</span>)","    <span class=\"tk-kw\">elif</span> <span class=\"tk-type\">isinstance</span>(<span class=\"tk-var\">msg</span>, <span class=\"tk-var\">ToolMessage</span>):","        <span class=\"tk-type\">print</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">TOOL:</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">name</span>, <span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">tool_call_id</span>, <span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">content</span>)","    <span c t_response.py","raw":"from langchain.messages import AIMessage\n\ndef final_text(agent_result: dict) -> str:\n    for msg in reversed(agent_result[\"messages\"]):\n        if isinstance(msg, AIMessage) and not msg.tool_calls:\n            if isinstance(msg.content, str):\n                return msg.content\n            raise ValueError(\"non-text final response needs parsing\")\n    raise ValueError(\"final AIMessage not found\")\n\n# 여기는 최종 텍스트 추출만 담당합니다.\n# 출처 ID 검증·Tool 성공 여부·API 상태 판정은 별도의 Validator가 필요합니다.\n","terms":[["Final AIMessage","Tool Call 요청이 아닌 최종 자연어 응답","UI에서 표시할 후보"],["State","messages 등 Agent 실행 정보를 담는 구조","단일 str로 오인하지 않기"]],"io":["agent_result[\"messages\"]","마지막 최종 AIMessage 검색","str 또는 명시적 오류"],"trace":[],"note":"","runtime":"requires langchain messages","refs":["agent"],"hl":["<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">messages</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">AIMessage</span>","&nbsp;","<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">final_text</span>(<span class=\"tk-var\">agent_result</span>: <span class=\"tk-type\">dict</span>) <span class=\"tk-op\">-</span><span class=\"tk-op\">&gt;</span> <span class=\"tk-type\">str</span>:","    <span class=\"tk-kw\">for</span> <span class=\"tk-var\">msg</span> <span class=\"tk-op\">in</span> <span class=\"tk-type\">reversed</span>(<span class=\"tk-var\">agent_result</span>[<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">messages</span><span class=\"tk-str\">&quot;</span>]):","        <span class=\"tk-kw\">if</span> <span class=\"tk-type\">isinstance</span>(<span class=\"tk-var\">msg</span>, <span class=\"tk-var\">AIMessage</span>) <span class=\"tk-op\">and</span> <span class=\"tk-op\">not</span> <span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">tool_calls</span>:","            <span class=\"tk-kw\">if</span> <span class=\"tk-type\">isinstance</span>(<span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">content</span>, <span class=\"tk-type\">str</span>):","                <span class=\"tk-kw\">return</span> <span class=\"tk-var\">msg</span><span class=\"tk-op\">.</span><span class=\"tk-var\">content</span>","            <span class=\"tk-kw\">raise</span> <span class=\"tk-var\">ValueError</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">non-text final response needs parsing</span><span class=\"tk-str\">&quot;</span>)","    <span class=\"tk-kw\">raise</span> <span class=\"tk-var\">ValueError</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">final AIMessage not found</span><span class=\"tk-str\">&quot;</span>)","&nbsp;","<span class=\"tk-comment\"># 여기는 최종 텍스트 추출만 담당합니다.</span>","<span class=\"tk-comment\"># 출처 ID 검증·Tool 성공 여부·API 상태 판정은 별도의 Validator가 필요합니다.</span>"]},{"id":"d29-c6-08","chapter":6,"kind":"demo","title":"시연 · 단일·복합 질문의 Agent 실행 추적","claim":"요청 유형을 선택하면 AIMessage·ToolMessage의 개수와 Tool 선택이 달라지는 교육용 실행 Trace를 확인합니다.","demo":"agent-lab","why":""},{"id":"d29-c6-09","chapter":6,"kind":"practice","title":"실습 06 안내 · 단일 Agent에 Tool 2개 등록","claim":"앞의 개념과 코드를 하나의 구현 결과로 연결합니다. 각 수준은 같은 목표를 공유하며 TODO 범위와 책임 분리가 달라집니다.","prep":"앞의 rag_search · lookup_status Tool·ChatOpenAI 설정","goal":"실제 Tool 호출 결과를 포함한 Agent 메시지 실행 로그","levels":[["01_basic","create_agent(tools=[...])를 완성하고 Tool 2개를 등록합니다."],["02_intermediate","0개·1개·2개 Tool 사례를 기록하고 결과·출처를 확인합니다."],["03_advanced","파일별 책임 분리·Runtime Context·실행 로그·오류 테스트를 추가합니다."]],"checks":[["결과의 `messages`에 ToolMessage가 보이지 않으면 두 Tool이 호출됐다고 할 수 있나요?","실행을 확인할 수 없습니다. Tool Call/ToolMessage와 서버 로그를 대조합니다."],["모델이 Tool 두 개를 반드시 호출하나요?","아닙니다. 질문과 모델 판단에 따라 달라집니다."]],"notice":"11월 27일 개인 프로젝트의 직접적인 기반이 되는 핵심 실습입니다."},{"id":"d29-c7-01","chapter":7,"kind":"concept","title":"Agent Reliability는 무엇을 확인하나요?","claim":"Agent의 최종 문장이 그럴듯한지뿐 아니라 올바른 Tool을 안전하게 호출했고, 실패 상태와 운영 비용을 관리했는지 확인하는 활동입니다.","items dleware"],"hl":["<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">agents</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">create_agent</span>","<span class=\"tk-kw\">from</span> <span class=\"tk-var\">langchain</span><span class=\"tk-var\">.</span><span class=\"tk-var\">agents</span><span class=\"tk-var\">.</span><span class=\"tk-var\">middleware</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">ToolCallLimitMiddleware</span>","&nbsp;","<span class=\"tk-comment\"># rag_search, lookup_status, model은 이전 Chapter에서 정의합니다.</span>","<span class=\"tk-var\">agent</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">create_agent</span>(","    <span class=\"tk-var\">model</span><span class=\"tk-op\">=</span><span class=\"tk-var\">model</span>,","    <span class=\"tk-var\">tools</span><span class=\"tk-op\">=</span>[<span class=\"tk-var\">rag_search</span>, <span class=\"tk-var\">lookup_status</span>],","    <span class=\"tk-var\">middleware</span><span class=\"tk-op\">=</span>[","        <span class=\"tk-var\">ToolCallLimitMiddleware</span>(<span class=\"tk-var\">run_limit</span><span class=\"tk-op\">=</span><span class=\"tk-num\">4</span>, <span class=\"tk-var\">exit_behavior</span><span class=\"tk-op\">=</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">error</span><span class=\"tk-str\">&quot;</span>),","        <span class=\"tk-var\">ToolCallLimitMiddleware</span>(<span class=\"tk-var\">tool_name</span><span class=\"tk-op\">=</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">lookup_status</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-var\">run_limit</span><span class=\"tk-op\">=</span><span class=\"tk-num\">2</span>,","                                <span class=\"tk-var\">exit_behavior</span><span class=\"tk-op\">=</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">error</span><span class=\"tk-str\">&quot;</span>),","    ],",")","<span class=\"tk-comment\"># run_limit은 단일 실행의 도구 호출 상한 예시입니다.</span>","<span class=\"tk-comment\"># Agent 전체 종료 시간·LLM 호출 한도는 별도 정책으로 관리합니다.</span>"]},{"id":"d29-c7-04","chapter":7,"kind":"concept","title":"권한은 Prompt가 아니라 서버에서 검증합니다","claim":"모델에게 “타인 정보를 보지 마세요”라고 지시하는 것만으로는 권한 제어가 완성되지 않습니다.","items":[["신뢰 경계","사용자·모델·문서 내용은 신뢰할 수 있는 서버 인증 결과와 분리합니다."],["DB Filter","owner_id=auth_user_id를 SQL WHERE에 적용합니다."],["RAG Filter","조회 가능한 문서 Category·권한을 Retriever 이전/실행 단계에서 제한합니다."],["Audit","검증 실패·도구 요청·조회 범위·결과 상태를 보안 정책에 맞게 기록합니다."]],"example":"예: 사용자 A가 “B의 과제 상태”를 묻더라도 Agent가 B의 신원을 임의로 생성해 DB에 전달할 수 없어야 합니다.","point":"12월 1일에 Prompt Injection·Guardrails를 더 다루며, 오늘은 Tool 경계의 최소 권한 원칙을 적용합니다.","refs":["tools","postgres"]},{"id":"d29-c7-05","chapter":7,"kind":"code","title":"Tool 결과를 검증하는 서버 측 Validator","claim":"Tool 성공 여부와 근거 출처를 분리해 검증합니다. 특히 Citation은 모델이 제시한 ID가 아니라 서버가 보관한 실제 Context 출처 ID를 기준으로 대조해야 합니다.","filename":"07_validate_contract.py","raw":"def validate_tool_result(data: dict, verified_source_ids: set[str]) -> dict:\n    # verified_source_ids는 서버가 실제 Context 선택 기록에서 만든 집합입니다.\n    # LLM이 생성한 출처 목록을 정답 목록으로 다시 사용하면 안 됩니다.\n    status = data.get(\"status\")\n    if status == \"answered\":  # RAG Tool\n        sources = data.get(\"sources\", [])\n        ids = [item[\"source_id\"] for item in sources]\n        if not ids or len(ids) != len(set(ids)):\n            raise ValueError(\"missing or duplicate citations\")\n        if not set(ids).issubset(verified_source_ids):\n            raise ValueError(\"citation outside verified Context\")\n        return data\n    if status == \"insufficient_context\":\n        if data.get(\"sources\"):\n            raise ValueError(\"no-answer cannot cite sources\")\n        return data\n    if status in {\"ok\", \"not_found_or_forbidden\", \"not_found\"}:  # DB Tool\n        if data.get(\"sources\"):\n            raise ValueError(\"DB status cannot cite RAG sources\")\n        return data\n    raise RuntimeError(\"Tool failed or returned unknown status\")\n","terms":[["verified_source_ids","실제 Context 선택 단계에서 서버가 기록한 출처 ID 목록","LLM 응답과 독립된 증거 기준"],["Output Validation","Tool별 상태·출처 계약을 점검하는 처리","없는 근거 인용·오류 성공 위장 방지"]],"io":["RAG·DB Tool 응답 + 서버 보관 verified_source_ids","status·Citation ID·중복·Tool 오류 검사","검증 통과 결과 또는 명시적 오류"],"trace":[],"note":"교육용 최소 Validator입니다. 출처 ID가 일치해도 원문이 답변의 모든 주장을 지지하는지는 Faithfulness와 별도로 검사합니다. RAG source_id는 문자열 ID로 통일한 예시이며 실제 서비스의 출처 Schema에 맞게 조정합니다.","runtime":"pure Python","hl":["<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">validate_tool_result</span><span class=\"tk-var\">(</span><span class=\"tk-var\">data</span><span class=\"tk-var\">:</span> <span class=\"tk-var\">dict</span><span class=\"tk-var\">,</span> <span class=\"tk-var\">verified_source_ids</span><span class=\"tk-var\">:</span> <span class=\"tk-var\">set</span><span class=\"tk-var\">[</span><span class=\"tk-var\">str</span><span class=\"tk-var\">]</span><span class=\"tk-var\">)</span> <span class=\"tk-op\">-</span><span class=\"tk-op\">&gt;</span> <span class=\"tk-var\">dict</span><span class=\"tk-var\">:</span>","    <span class=\"tk-comment\"># verified_source_ids는 서버가 실제 Context 선택 기록에서 만든 집합입니다.</span>","    <span class=\"tk-comment\"># LLM이 생성한 출처 목록을 정답 목록으로 다시 사용하면 안 됩니다.</span>","    <span class=\"tk-var\">status</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">data</span><span class=\"tk-op\">.</span><span class=\"tk-var\">get</span><span class=\"tk-var\">(</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">status</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">)</span>","    <span class=\"tk-kw\">if</span> <span class=\"tk-var\">status</span> <span class=\"tk-op\">==</span> <span class=\"tk-str\">&quot;</span><span class=\"tk-str\">answered</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">:</span>  <span class=\"tk-comment\"># RAG Tool</span>","        <span class=\"tk-var\">sources</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">data</span><span class=\"tk-op\">.</span><span class=\"tk-var\">get</span><span class=\"tk-var\">(</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">sources</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">,</span> <span class=\"tk-var\">[</span><span class=\"tk-var\">]</span><span class=\"tk-var\">)</span>","        <span class=\"tk-var\">ids</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">[</span><span class=\"tk-var\">item</span><span class=\"tk-var\">[</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">source_id</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">]</span> <span class=\"tk-kw\">for</span> <span class=\"tk-var\">item</span> <span class=\"tk-op\">in</span> <span class=\"tk-var\">sources</span><span class=\"tk-var\">]</span>","        <span class=\"tk-kw\">if</span> <span class=\"tk-op\">not</span> <span class=\"tk-var\">ids</span> <span class=\"tk-op\">or</span> <span class=\"tk-var\">len</span><span class=\"tk-var\">(</span><span class=\"tk-var\">ids</span><span class=\"tk-var\">)</span> <span class=\"tk-op\">!=</span> <span class=\"tk-var\">len</span><span class=\"tk-var\">(</span><span class=\"tk-var\">set</span><span class=\"tk-var\">(</span><span class=\"tk-var\">ids</span><span class=\"tk-var\">)</span><span class=\"tk-var\">)</span><span class=\"tk-var\">:</span>","            <span class=\"tk-kw\">raise</span> <span class=\"tk-var\">ValueError</span><span class=\"tk-var\">(</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">missing or duplicate citations</span><span class=\"tk-str\">&quot;</span><span class=\"tk-var\">)</span>","        <span class=\"tk-kw\">if</span> <span class=\"tk-op\">not</span> <span class=\"tk-var\">set</span><span class=\"tk-var\">(</span><span class=\"tk-var\">ids</span><span class=\"tk-var\">)</span><span class=\"tk-op\">.</span><span class=\"tk-var\">issubset</sp     question: str = Field(min_length=1, max_length=500)\n\ndef get_authenticated_user_id() -> str:\n    # 실제 프로젝트의 JWT/Session 검증 Dependency로 교체해야 합니다.\n    raise NotImplementedError(\"인증된 서버 사용자 추출 연결 필요\")\n\n@router.post(\"/ask\")\ndef ask_agent(body: AgentRequest, user_id: str = Depends(get_authenticated_user_id)):\n    from app.agent import agent, UserContext  # 프로젝트 실제 경로로 맞춥니다.\n    result = agent.invoke(\n        {\"messages\": [{\"role\": \"user\", \"content\": body.question}]},\n        context=UserContext(user_id=user_id),\n    )\n    # result의 최종 메시지·출처·오류 계약을 서버에서 검증한 뒤 반환합니다.\n    return {\"status\": \"needs_validation\", \"message_count\": len(result[\"messages\"])}\n","terms":[["Depends","FastAPI 의존성 주입","검증된 신원·DB 세션을 전달"],["AgentRequest","요청 JSON의 Pydantic Schema","빈 질문·길이 검증"],["API Adapter","Agent 결과를 최종 API 응답 계약으로 변환하는 계층","출처·상태 검증"]],"io":["POST /api/v1/agent/ask + 인증","Agent.invoke(messages, context)","서버 검증 전 잠정 응답"],"trace":[],"note":"이 코드는 보안 경계 설명을 위한 구조 예시입니다. 인증 Dependency·출처 Validation을 채우기 전에는 배포하지 않습니다.","runtime":"integration skeleton","refs":["fastapi","tools"],"hl":["<span class=\"tk-kw\">from</span> <span class=\"tk-var\">fastapi</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">APIRouter</span>, <span class=\"tk-var\">Depends</span>","<span class=\"tk-kw\">from</span> <span class=\"tk-var\">pydantic</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">BaseModel</span>, <span class=\"tk-var\">Field</span>","&nbsp;","<span class=\"tk-var\">router</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">APIRouter</span>(<span class=\"tk-var\">prefix</span><span class=\"tk-op\">=</span><span class=\"tk-str\">&quot;</span><span class=\"tk-str\">/api/v1/agent</span><span class=\"tk-str\">&quot;</span>, <span class=\"tk-var\">tags</span><span class=\"tk-op\">=</span>[<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">agent</span><span class=\"tk-str\">&quot;</span>])","&nbsp;","<span class=\"tk-kw\">class</span> <span class=\"tk-type\">AgentRequest</span>(<span class=\"tk-var\">BaseModel</span>):","    <span class=\"tk-var\">question</span>: <span class=\"tk-type\">str</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">Field</span>(<span class=\"tk-var\">min_length</span><span class=\"tk-op\">=</span><span class=\"tk-num\">1</span>, <span class=\"tk-var\">max_length</span><span class=\"tk-op\">=</span><span class=\"tk-num\">500</span>)","&nbsp;","<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">get_authenticated_user_id</span>() <span class=\"tk-op\">-</span><span class=\"tk-op\">&gt;</span> <span class=\"tk-type\">str</span>:","    <span class=\"tk-comment\"># 실제 프로젝트의 JWT/Session 검증 Dependency로 교체해야 합니다.</span>","    <span class=\"tk-kw\">raise</span> <span class=\"tk-var\">NotImplementedError</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">인증된 서버 사용자 추출 연결 필요</span><span class=\"tk-str\">&quot;</span>)","&nbsp;","<span class=\"tk-var\">@router</span><span class=\"tk-op\">.</span><span class=\"tk-var\">post</span>(<span class=\"tk-str\">&quot;</span><span class=\"tk-str\">/ask</span><span class=\"tk-str\">&quot;</span>)","<span class=\"tk-kw\">def</span> <span class=\"tk-fn\">ask_agent</span>(<span class=\"tk-var\">body</span>: <span class=\"tk-var\">AgentRequest</span>, <span class=\"tk-var\">user_id</span>: <span class=\"tk-type\">str</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">Depends</span>(<span class=\"tk-var\">get_authenticated_user_id</span>)):","    <span class=\"tk-kw\">from</span> <span class=\"tk-var\">app</span><span class=\"tk-var\">.</span><span class=\"tk-var\">agent</span> <span class=\"tk-kw\">import</span> <span class=\"tk-var\">agent</span>, <span class=\"tk-var\">UserContext</span>  <span class=\"tk-comment\"># 프로젝트 실제 경로로 맞춥니다.</span>","    <span class=\"tk-var\">result</span> <span class=\"tk-op\">=</span> <span class=\"tk-var\">agent</span><span class=\"tk-op\">.</span><span clas
