ct-defs{font-size:calc(13px + 2pt)}.subtle,.scope-line,.record-note,figcaption{font-size:calc(11px + 2pt)}.flow-labels{font-size:calc(11px + 2pt)}.slot{padding:9px 12px}.slot b,.variant p{font-size:calc(15px + 2pt)}.light-box,.assembly-box{padding:12px 15px}.assembly-box b{font-size:calc(15px + 2pt)}.assembly-box span{font-size:calc(13px + 2pt)}.question-card{padding:12px}.budget-strip{margin-top:14px;font-size:calc(12px + 2pt)}.contract-row{gap:18px;margin:12px 0}.contract-card{padding:12px 16px}.gate-flow .flow-node strong{font-size:calc(16px + 2pt)}.gate-flow .flow-node span{font-size:calc(12px + 2pt)}.counterexample{font-size:calc(13px + 2pt);padding:10px 16px}.branch-condition b,.branch-result b{font-size:calc(15px + 2pt)}.branch-condition span,.branch-result span{font-size:calc(12px + 2pt)}.branch-condition,.branch-result{padding:13px}.attempt-strip{font-size:calc(15px + 2pt)}.variant{padding:12px 16px}.variant small{font-size:calc(12px + 2pt)}.eval-order .flow-node strong{font-size:calc(15px + 2pt)}.eval-order .flow-node span{font-size:calc(12px + 2pt)}.eval-order{margin:14px 0}}\n\n/* v8: avoid splitting Korean words while allowing long identifiers to wrap. */\np,figcaption,.inline-def,.flow-node,.branch-result,.branch-condition,.lesson,dd{word-break:keep-all;overflow-wrap:anywhere}\n\n/* Topic-specific visualizations, kept within the supplied summary layout. */\n.day22-summary .two-col,.day22-summary .three-col{margin-top:18px;margin-bottom:18px}\n.day22-summary .light-box h3{margin-bottom:10px}\n.day22-summary .light-box.green{background:var(--green)}\n.day22-summary .light-box.warm{background:var(--gold)}\n.day22-summary .light-box p:last-child{margin-bottom:0}\n.day22-summary .event-name{font:600 calc(15px + 2pt)/1.65 Consolas,'Noto Sans Mono CJK KR',monospace;overflow-wrap:anywhere}\n.day22-summary table{width:100%;border-collapse:collapse;font-size:calc(16px + 2pt);margin:20px 0;word-break:keep-all}\n.day22-summary th,.day22-summary td{text-align:left;padding:12px 14px;border:1px solid var(--line);vertical-align:top}\n.day22-summary th{background:var(--pale)}\n.day22-summary .equation{padding:22px;text-align:center;line-height:1.85;font-size:calc(20px + 2pt);background:var(--pale);border-radius:12px;margin:20px 0}\n.day22-summary .subset{border:1px solid #b9cddd;border-radius:12px;padding:22px;background:var(--pale)}\n.day22-summary .subset .inner{margin:15px 0 0;padding:12px 15px;background:var(--green);border:1px solid #b4d3c5;border-radius:8px;font-size:calc(16px + 2pt)}\n.day22-summary .timeline{display:grid;grid-template-columns:1fr 3fr 1fr;gap:6px;margin:22px 0 16px}\n.day22-summary .timeline>div{padding:18px 12px;text-align:center;background:var(--pale);border-radius:8px}\n.day22-summary .timeline>div:nth-child(2){background:var(--navy);color:#fff}\n.day22-summary .timeline small{display:block;color:inherit;font-size:calc(14px + 2pt)}\n.day22-summary .measure{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}\n.day22-summary .measure p{font-size:calc(15px + 2pt);margin-top:7px}\n.day22-summary .review-branch-root{background:var(--navy);color:white;padding:18px 24px;border-radius:12px;text-align:center;font-weight:700}\n.day22-summary .review-branch-path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:20px}\n.day22-summary .loop{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0}\n.day22-summary .loop span{background:var(--pale);padding:12px 16px;border:1px solid var(--line);border-radius:8px}\n@media(max-width:700px){.day22-summary .review-branch-path,.day22-summary .measure{grid-template-columns:1fr}.day22-summary .equation{font-size:calc(17px + 2pt)}.day22-summary th,.day22-summary td{font-size:calc(13px + 2pt);padding:10px 8px}}\n<\/style><\/head><body class=\"day22-summary\"><header class=\"review-top\"><div><div class=\"tag\">DAY 22 · 핵심요약<\/div><h1>LLM API 클라이언트<\/h1><p>AI Agent가 재사용할 모델 호출·검증·기록의 흐름<\/p><\/div><button class=\"review-print\" onclick=\"window.print()\" type=\"button\">인쇄<\/button><\/header><main>\n<section aria-labelledby=\"summary-whole-title\" class=\"sheet\" id=\"whole\"><div class=\"sheet-heading\"><span class=\"sheet-number\">01<\/span><h2 id=\"summary-whole-title\">모델을 호출하는 한 번의 작업<\/h2><\/div><p class=\"definition\">API는 프로그램 간 접점입니다. 이 과정에서는 각 실습의 .env에서 API 키를 읽어 OpenAI에 직접 연결합니다. LLM Client는 호출과 우리 서비스의 정책을 묶습니다.<\/p>\n<p class=\"subtle\">기존 가상환경을 계속 사용하고 필요한 패키지만 추가합니다. 터미널은 Git Bash, 설정은 실습별 .env, 기본 모델은 <code>gpt-5.4-mini-2026-03-17<\/code>입니다.<\/p><figure><div class=\"flow\" style=\"--n:4\"><div class=\"flow-node\"><strong>질문·Context<\/strong><span>선택한 근거만<\/span><\/div><div class=\"flow-node primary\"><strong>LLM Client<\/strong><span>인증·모델·전송<\/span><\/div><div class=\"flow-node\"><strong>외부 LLM<\/strong><span>생성·응답<\/span><\/div><div class=\"flow-node\"><strong>검증·기록<\/strong><span>상태·근거·usage<\/span><\/div><\/div><\/figure><div class=\"two-col\"><div class=\"light-box\"><h3>그대로 유지하는 것<\/h3><p>Prompt·선택 지식·KnowledgeAnswer·출처 규칙·사람의 근거 검토를 이어 사용합니다.<\/p><\/div><div class=\"light-box green\"><h3>오늘 추가하는 것<\/h3><p>API 수신, Streaming, 오류 정책, 비용·시간 기록, 캐시와 모델 선택을 연결합니다.<\/p><\/div><\/div><p class=\"lesson\">검색과 도구 실행은 이후에 추가됩니다. 모델의 JSON 응답은 도구를 실행해도 된다는 권한이 아닙니다.<\/p><\/section>\n<section aria-labelledby=\"summary-request-title\" class=\"sheet\" id=\"request\"><div class=\"sheet-heading\"><span class=\"sheet-number\">02<\/span><h2 id=\"summary-request-title\">입력의 역할과 출력의 검사<\/h2><\/div><div class=\"two-col\"><div class=\"light-box\"><h3>instructions<\/h3><p>앱이 정한 작업·제약·실패 기준·출력 규칙입니다.<\/p><\/div><div class=\"light-box\"><h3>input<\/h3><p>이번 질문과 실제 선택한 지식입니다. DB 전체가 자동으로 전달되지는 않습니다.<\/p><\/div><\/div><figure><div class=\"flow\" style=\"--n:4\"><div class=\"flow-node\"><strong>WireAnswer<\/strong><span>API에 보낼 Schema<\/span><\/div><div class=\"flow-node\"><strong>완료 판정<\/strong><span>거절·불완전 분리<\/span><\/div><div class=\"flow-node\"><strong>KnowledgeAnswer<\/strong><span>로컬 구조·규칙<\/span><\/div><div class=\"flow-node\"><strong>근거 검토<\/strong><span>주장과 원문 대조<\/span><\/div><\/div><\/figure><table><tr><th>상태가 속한 곳<\/th><th>무엇을 뜻하는가<\/th><\/tr><tr><td>HTTP 200<\/td><td>통신의 응답 상태<\/td><\/tr><tr><td>response.status = completed<\/td><td>모델 생성 응답의 완료<\/td><\/tr><tr><td>answer_object.status = answered / insufficient_context<\/td><td>자료로 답변 가능 / 제공된 정보 부족<\/td><\/tr><\/table><p class=\"lesson\">Structured Outputs는 구조를 제약합니다. 구조 통과 ≠ 근거 적합 ≠ 사람 승인입니다.<\/p><\/section>\n<section aria-labelledby=\"summary-stream-title\" class=\"sheet\" id=\"stream\"><div class=\"sheet-heading\"><span class=\"sheet-number\">03<\/span><h2 id=\"summary-stream-title\">먼저 보여도, 아직 확정할 수는 없습니다<\/h2><\/div><p><b>Streaming<\/b>은 생성 중 일부를 먼저 받는 방식입니다. <b>SSE(Server-Sent Events)<\/b>는 서버가 HTTP 연결로 이벤트를 이어 보내는 방식이고, <b>delta<\/b>는 새 텍스트 조각입니다.<\/p><figure><div class=\"flow\" style=\"--n:4\"><div class=\"flow-node\"><strong class=\"event-name\">response.created<\/strong><span>시작<\/span><\/div><div class=\"flow-node\"><strong class=\"event-name\">response.output_text.delta<\/strong><span>부분 미리보기<\/span><\/div><div class=\"flow-node\"><strong class=\"event-name\">response.output_text.done<\/strong><span>텍스트 항목 종료<\/span><\/div><div class=\"flow-node primary\"><strong class=\"event-name\">response.completed<\/strong><span>전체 응답 확인<\/span><\/div><\/div><\/figure><div class=\"two-col\"><div class=\"light-box green\"><h3>완료 응답을 받은 경우<\/h3><p>최종 원문과 usage를 확인하고 기존 검증기로 넘깁니다. 근거 검토는 여전히 남습니다.<\/p><\/div><div class=\"light-box warm\"><h3>중단·거절·불완전인 경우<\/h3><p>이유를 기록하고 부분 JSON을 정상 답변으로 쓰지 않습니다. 성공 캐시에 저장하지 않습니다.<\/p><\/div><\/div><p class=\"lesson\">조각 10개 ≠ 출력 10 Token. 첫 텍스트가 빠름 ≠ 총 완료 시간이 짧음.<\/p><\/section>\n<section aria-labelledby=\"summary-retry-title\" class=\"sheet\" id=\"retry\"><div class=\"sheet-heading\"><span class=\"sheet-number\">04<\/span><h2 id=\"summary-retry-title\">실패 원인에 따라 다음 행동이 다릅니다<\/h2><\/div><div class=\"review-branch-root\">실패 원인 · 상태 · 남은 예산 확인<\/div><div class=\"review-branch-path\"><div class=\"light-box\"><h3>설정·권한·한도<\/h3><p>401·403·잘못된 요청·할당량 문제는 반복 전송으로 고치지 않습니다. 설정을 확인하고 중단합니다.<\/p><\/div><div class=\"light-box green\"><h3>일시적 제한<\/h3><p>429의 세부 원인을 확인합니다. Retry-After의 최소 대기와 남은 시간·횟수를 지킨 경우에만 다시 보냅니다.<\/p><\/div><div class=\"light-box warm\"><h3>출력·수신 문제<\/h3><p>JSON·Schema 형식만 한 번 수정합니다. 거절·출처 오류·정보 부족·timeout은 같은 수정 루프로 보내지 않습니다.<\/p><\/div><\/div><div class=\"equation\">생성 최대 2회 × 생성당 전송 최대 2회<br/><strong>전체 실제 전송 최대 4회<\/strong><\/div><p class=\"subtle\">이 값은 교안의 정책입니다. SDK 추가 재시도는 0회로 두고 앱에서 관리합니다. Timeout·스트림 중단의 자동 재전송도 하지 않는 수업 정책입니다.<\/p><p class=\"lesson\">Exponential backoff는 실패가 반복될수록 대기 시간을 늘리는 방식이고, Jitter는 재시도 시점을 분산하는 작은 무작위 지연입니다. 서버의 최소 대기를 줄여서 다시 보내지 않습니다.<\/p><\/section>\n<section aria-labelledby=\"summary-metrics-title\" class=\"sheet\" id=\"metrics\"><div class=\"sheet-heading\"><span class=\"sheet-number\">05<\/span><h2 id=\"summary-metrics-title\">포함 관계와 측정 구간을 맞춥니다<\/h2><\/div><div class=\"two-col\"><div class=\"subset\"><b>input_tokens · 전체 입력<\/b><div class=\"inner\">cached_tokens는 이 안의 일부<\/div><\/div><div class=\"subset\"><b>output_tokens · 전체 출력<\/b><div class=\"inner\">reasoning_tokens는 이 안의 일부<\/div><\/div><\/div><div class=\"equation\">[(입력 − 캐시 입력) × 일반 단가<br/>+ 캐시 입력 × 캐시 단가 + 출력 × 출력 단가]<br/>÷ 1,000,000<\/div><p class=\"subtle\">USD / 1M tokens 단가를 적용하는 교안의 표준 텍스트 계산식입니다. 단가·모델·서비스 모드가 달라지면 적용 범위도 확인합니다.<\/p><div class=\"timeline\"><div>준비<\/div><div>API 요청<small>시작 → 첫 텍스트 → 종료<\/small><\/div><div>검증<\/div><\/div><div class=\"measure\"><div><b>first_text_ms<\/b><p>요청 시작 → 첫 비어 있지 않은 텍스트<\/p><\/div><div><b>request_ms<\/b><p>요청 시작 → 종료·실패<\/p><\/div><div><b>e2e_ms<\/b><p>준비·대기·재시도·검증을 포함한 전체<\/p><\/div><\/div><p><code>generation_no<\/code>는 생성 번호, <code>send_attempt<\/code>는 그 생성의 전송 시도입니다. 처음 실패를 마지막 성공으로 덮지 않습니다.<\/p><p class=\"lesson\">None = 미관측, 0 = 관측된 0, not_run = 미실행. 알려진 비용의 소계와 미확인 전송을 따로 기록합니다.<\/p><\/section>\n<section aria-labelledby=\"summary-cache-title\" class=\"sheet\" id=\"cache\"><div class=\"sheet-heading\"><span class=\"sheet-number\">06<\/span><h2 id=\"summary-cache-title\">재사용과 모델 선택은 서로 다른 정책입니다<\/h2><\/div><div class=\"three-col\"><div class=\"light-box\"><h3>Response Cache<\/h3><p>승인된 최종 답변을 재사용합니다. 유효한 hit이면 새 API 전송을 생략할 수 있습니다.<\/p><\/div><div class=\"light-box green\"><h3>Prompt Caching<\/h3><p>같은 입력 앞부분의 계산을 재사용합니다. 새 API 요청과 새로운 출력 생성은 계속됩니다.<\/p><\/div><div class=\"light-box\"><h3>KV Cache<\/h3><p>모델의 Key·Value 상태를 재사용합니다. 최종 답변을 보관하는 앱 저장소가 아닙니다.<\/p><\/div><\/div><div class=\"loop\"><span>입력·모델·권한·계약<\/span><b>→<\/b><span>Cache key<\/span><b>→<\/b><span>TTL·승인·현재 검사<\/span><b>→<\/b><span>hit / miss<\/span><\/div><p><b>TTL(Time To Live)<\/b>은 유효 기간입니다. 같은 질문이어도 지식 본문이나 권한이 바뀌면 예전 답을 재사용하지 않습니다. SHA-256 해시는 식별용이지 암호화가 아닙니다.<\/p><figure><div class=\"flow\" style=\"--n:4\"><div class=\"flow-node\"><strong>mode<\/strong><span>fast / quality<\/span><\/div><div class=\"flow-node\"><strong>허용 목록<\/strong><span>권한·기능·예산<\/span><\/div><div class=\"flow-node primary\"><strong>한 모델 선택<\/strong><span>route_reason 기록<\/span><\/div><div class=\"flow-node\"><strong>같은 검증<\/strong><span>동일한 출력 계약<\/span><\/div><\/div><\/figure><p class=\"lesson\">Model Routing은 호출 전 모델 선택입니다. fast·quality는 교안의 모드명이지 우열 보장이 아닙니다.<\/p><\/section>\n<footer class=\"review-footer\">기준: Day22_Lecture_20261117(2).pptx · 모델·단가 관련 공식 문서 대조 2026.11.15<br/>강사 제공 로그에서는 기본 모델의 일반 텍스트 생성만 확인했습니다. Structured Outputs·Streaming·비교 모델은 별도 확인하며, 수강생은 자신의 키와 환경에서 실행합니다.<\/footer><a class=\"topback\" href=\"#top\">처음으로 ↑<\/a><\/main><\/body><\/html>\n";

function runRetry(seq,providedIds=[101]){

function metrics(records,cases){

 for(const variant of ['A','B']){
  const rr=records.filter(r=>r.variant===variant&&cases.some(c=>c.id===r.case_id)&&r.attempt===1);

 }
 return out;
}

function responseGate(c,raw){if(c[2])return {error:'refusal',message:'거절 콘텐츠를 확인했습니다. 형식 수정을 요구하지 않고 종료합니다.'};if(c[1]!=='completed')return {error:c[1],message:'생성이 완료되지 않았습니다. 부분 JSON을 정상 답변으로 넘기지 않습니다.'};if(!raw.trim())return {error:'empty_output',message:'completed이지만 텍스트가 비어 있습니다. 정상 답변을 만들어 채우지 않습니다.'};return {error:null,message:'완료된 텍스트를 로컬 검사기에 전달할 수 있습니다.'};}
function gateDemo(){let c=GATE_CASES[S.gateCase],raw=S.gateRaw??c[3],r=S.gateResult;let stages=r?[!r.gate.error?'pass':'fail',...(!r.gate.error?r.validation.stages:['skipped','skipped','skipped','skipped'])]:Array(5).fill('pending');return `<div class="row between"><label class="widget-select">응답 상황${select('gateCase',Object.entries(GATE_CASES).map(([k,v])=>[k,v[0]]),S.gateCase)}<\/label>${sampleLabel('작성한 응답 샘플 · 브라우저에서 응답 상태와 로컬 규칙을 검사합니다.')}<\/div><div class="cols spaced">${card('응답에서 확인할 값',`${defs([['response.status',c[1]],['refusal 콘텐츠',c[2]?'있음':'없음'],['provided_ids',j(c[4])]])}<label class="smalltext">output_text<textarea id="gateRaw" spellcheck="false">${esc(raw)}<\/textarea><\/label><div class="stagebar">${btn('순서대로 검사','gateCheck','','primary')}${btn('샘플 복원','gateReset')}<\/div>`)}${card('검사 결과',`<div class="gate-stack">${['생성 완료·거절·빈 출력','JSON 문법','Schema·자료형','출처·상태 규칙','사람의 근거 검토'].map((n,i)=>`<div class="gate ${stages[i]}"><b>${i+1}<\/b><strong>${n}<\/strong><span>${{pass:'통과',fail:'실패',pending:i===4&&r&&!r.gate.error&&!r.validation.error?'검토 대기':'미수행',skipped:'미수행'}[stages[i]]}<\/span><\/div>`).join('')}<\/div>${r?note(r.gate.error?`${r.gate.error}\n${r.gate.message}`:r.validation.error?`${r.validation.error}\n${r.validation.detail}`:'자동 검사 통과. 근거와 질문 대응은 사람이 확인합니다.',r.gate.error||r.validation?.error?'warn':'ok'):''}${S.gateCase==='false_evidence'?note('반례: 101의 본문은 파일 보관 안내입니다. 101이 제공 범위에 있어도 서버 실행 위치의 근거는 아닙니다.','warn'):''}`)}<\/div>`;}

function streamEvents(mode){const good=C.raw(C.answer('개인 폴더에 보관합니다.',[101]));const chunks=[good.slice(0,25),good.slice(25,75),good.slice(75)];let arr=[{type:'response.created',time:0},{type:'response.output_text.delta',delta:'',time:150}];if(mode==='refusal')return [...arr,{type:'response.refusal.delta',delta:'요청을 처리할 수 없습니다.',time:250},{type:'response.completed',time:1200,refusal:true}];for(let i=0;i<chunks.length;i++){arr.push({type:'response.output_text.delta',delta:chunks[i],time:250+i*400});if(mode==='interrupted'&&i===0)return[...arr,{type:'connection_lost',time:700}];}arr.push({type:'response.output_text.done',time:1100});arr.push({type:mode==='incomplete'?'response.incomplete':'response.completed',time:1200});return arr;}
function streamState(mode,step){const es=streamEvents(mode).slice(0,step);let parts=[],first=null,final=null,refused=false,interrupted=false;for(const e of es){if(e.type==='response.output_text.delta'){parts.push(e.delta);if(e.delta&&first===null)first=e.time;}if(e.type==='response.refusal.delta')refused=true;if(['response.completed','response.incomplete'].includes(e.type))final=e;if(e.type==='connection_lost')interrupted=true;}
const status=interrupted?'interrupted':final?refused?'refused':final.type==='response.incomplete'?'incomplete':'completed':es.length?'partial':'not_started';return{es,text:parts.join(''),first,final,status,canValidate:status==='completed'};}
function streamDemo(){const r=streamState(S.streamCase,S.streamStep),max=streamEvents(S.streamCase).length;return `<div class="row between"><label class="widget-select">이벤트 시나리오${select('streamCase',[['normal','조각 → 텍스트 종료 → 전체 완료'],['interrupted','조각 → 연결 중단'],['incomplete','조각 → 불완전 종료'],['refusal','거절 → 생성 완료']],S.streamCase)}<\/label>${sampleLabel('모의 이벤트 · 표시된 ms는 시연용 시간입니다.')}<\/div><div class="stagebar">${btn('다음 이벤트','streamNext',S.streamStep>=max?'disabled':'','primary')}${btn(S.playing?'일시정지':'자동 진행','streamPlay')}${btn('처음으로','streamReset')}<\/div><div class="cols spaced">${card('도착한 이벤트',`<div class="event-log">${r.es.length?r.es.map(e=>`<div><time>${e.time} ms<\/time><code>${esc(e.type)}<\/code><small>${e.delta!==undefined?e.delta===''?'빈 조각':esc(e.delta):''}<\/small><\/div>`).join(''):'<p class="muted">아직 수신하지 않았습니다.<\/p>'}<\/div>`)}${card('미리보기와 최종 상태',`<pre class="json-view stream-preview">${esc(r.text||'아직 텍스트가 없습니다.')}<\/pre>${defs([['first_text_ms',r.first===null?'None · 텍스트 미관측':`${r.first} ms`],['수신 결과',r.status],['최종 검증',r.canValidate?'완료 응답 확보 → 로컬 검사 가능':'아직 검증된 답변이 아님']])}${note(r.canValidate?'Response가 완료되어도 JSON·출처·근거 검토는 남아 있습니다.':'부분 버퍼는 성공 답변·성공 캐시에 넣지 않습니다.',r.canValidate?'ok':'')}`)}<\/div>`;}
function latencyDemo(){let v=S.latency,valid=Object.values(v).every(x=>Number.isFinite(x)&&x>=0)&&v.first<=v.request;if(!valid)return `<div class="form-grid">${number('latPrep','준비 시간 (ms)',v.prep)}${number('latFirst','첫 텍스트까지 (ms)',v.first)}${number('latRequest','요청 전체 (ms)',v.request)}${number('latCheck','검증 (ms)',v.check)}<\/div>${note('0 이상의 수를 입력하고, 첫 텍스트 시간은 요청 전체 시간 이내로 정하세요.','fail')}`;let total=v.prep+v.request+v.check,scale=920/(total||1),x=55;const bar=(start,len,y,color,label)=>`<rect x="${x+start*scale}" y="${y}" width="${Math.max(1,len*scale)}" height="42" rx="5" fill="${color}"/><text x="${x+start*scale+Math.max(1,len*scale)/2}" y="${y+27}" font-size="16.6667" text-anchor="middle" fill="white">${len*scale>85?label:''}<\/text>`;return `${sampleLabel('가상 구간 계산 · 네트워크나 모델 응답을 측정한 값이 아닙니다.')}<div class="grid4 controls">${number('latPrep','준비 시간 (ms)',v.prep,0,10000,50)}${number('latFirst','첫 텍스트까지 (ms)',v.first,0,20000,50)}${number('latRequest','요청 전체 (ms)',v.request,0,20000,50)}${number('latCheck','검증 시간 (ms)',v.check,0,10000,10)}<\/div><div class="card spaced"><svg class="timeline" viewBox="0 0 1040 230" role="img" aria-label="준비 요청 검증의 측정 구간">${bar(0,v.prep,55,'#708ca9','준비')}${bar(v.prep,v.request,55,'#426fa3','API 요청')}${bar(v.prep+v.request,v.check,55,'#2b6f65','검증')}<line x1="${x+v.prep*scale}" y1="38" x2="${x+v.prep*scale}" y2="150" stroke="#a45329"/><line x1="${x+(v.prep+v.first)*scale}" y1="38" x2="${x+(v.prep+v.first)*scale}" y2="150" stroke="#a45329" stroke-dasharray="5 4"/><text x="${x+v.prep*scale}" y="25" fill="#244b78" font-size="17.6667">요청 시작<\/text><text x="${x+(v.prep+v.first)*scale}" y="174" fill="#a45329" font-size="17.6667" text-anchor="middle">첫 텍스트<\/text><line x1="55" y1="207" x2="975" y2="207" stroke="#73899f"/><text x="55" y="227" font-size="16.6667">0<\/text><text x="975" y="227" text-anchor="end" font-size="16.6667">${total} ms<\/text><\/svg><\/div><div class="grid3 spaced">${[['first_text_ms',v.first,'요청 시작 → 첫 텍스트'],['request_ms',v.request,'요청 시작 → 종료'],['e2e_ms',total,'준비 시작 → 검증 결과']].map(([n,x,t])=>card(n,`<div class="stat">${fmt(x)}<small> ms<\/small><\/div><p>${t}<\/p>`)).join('')}<\/div>`;}
const ERRORS={auth:{label:'401 · 인증 실패',code:'invalid_api_key',path:'stop',title:'설정 확인 후 별도 실행',why:'키·프로젝트 설정을 확인합니다. 기다렸다가 같은 잘못된 키를 반복해서 보내지 않습니다.'},permission:{label:'403 · 권한 없음',code:'permission_denied',path:'stop',title:'권한 확인',why:'허용 모델·프로젝트 권한을 확인합니다. 다른 사람의 키로 우회하지 않습니다.'},bad:{label:'400 · 잘못된 요청',code:'invalid_request',path:'fix',title:'요청 구성 수정',why:'지원하지 않는 인자·Schema·모델 설정을 고친 뒤 별도로 실행합니다.'},rate:{label:'429 · 일시적 Rate Limit',code:'rate_limit_exceeded',path:'wait',title:'최소 대기와 횟수 확인',why:'Retry-After를 존중하고, 남은 시간·전송 예산 안에서만 재전송합니다.'},quota:{label:'429 · 잔액·할당량 문제',code:'insufficient_quota',path:'stop',title:'이번 작업 중단',why:'잔액·결제·지출·조직 한도 등을 확인합니다. 같은 요청의 반복은 해결책이 아닙니다.'},unknown:{label:'429 · 원인 불명',code:'unknown',path:'stop',title:'원인 확인 전 중단',why:'HTTP 코드만 보고 일시적 제한이라고 추정하지 않습니다. error.code·error.type을 확인합니다.'},server:{label:'500 · 재시도를 허용한 서버 오류',code:'server_error',path:'wait',title:'정해 둔 조건에서 제한적 재전송',why:'교안의 허용된 서버 오류라면 남은 예산 안에서 한 번 재시도합니다. 실패 기록은 보존합니다.'},timeout:{label:'Timeout · 응답 미확인',code:'APITimeoutError',path:'stop',title:'자동 재전송하지 않음',why:'서버 처리와 비용이 이미 발생했을 수 있습니다. usage가 없으면 None으로 기록합니다.'}};
function errorDemo(){const e=ERRORS[S.error];return `<label class="widget-select">오류 종류${select('errorKind',Object.entries(ERRORS).map(([k,v])=>[k,v.label]),S.error)}<\/label><div class="error-source spaced"><b>${esc(e.label)}<\/b><code>${esc(e.code)}<\/code><\/div><div class="branch-stems"><span>요청 문제<\/span><span>일시적 제한<\/span><span>설정·권한·불명<\/span><\/div><div class="grid3">${[['fix','요청 수정','지원 인자·Schema 확인'],['wait','대기 후 제한적 재전송','남은 시간·횟수·최소 대기 시간 확인'],['stop','중단·원인 확인','반복만으로 해결하지 않음']].map(([id,t,p])=>card(t,`<p>${p}<\/p>`,e.path===id?'chosen branch-card':'dimmed branch-card')).join('')}<\/div>${note(e.title+'\n'+e.why,e.path==='wait'?'':'warn')}${sampleLabel('오류 분류 시연 · 실제 인증 실패나 429를 발생시키지 않습니다.')}`;}
function budgetDemo(){const b=S.budget,n=b.gen*b.send*(b.sdk+1);return `<div class="grid3 controls"><label>최대 생성 횟수${select('budgetGen',[[1,'1회 · 최초만'],[2,'2회 · 최초 + 수정']],b.gen)}<\/label><label>생성당 앱 전송 횟수${select('budgetSend',[[1,'1회'],[2,'2회']],b.send)}<\/label><label>SDK 추가 재시도${select('budgetSdk',[[0,'0회 · 교안 정책'],[1,'1회 · 중첩 비교'],[2,'2회 · 중첩 비교']],b.sdk)}<\/label><\/div><div class="budget-tree spaced">${Array.from({length:b.gen},(_,g)=>`<section><h3>생성 ${g+1} · ${g?'형식 수정':'최초 요청'}<\/h3><div class="row">${Array.from({length:b.send},(_,t)=>`<div class="send-box"><b>앱 전송 ${t+1}<\/b><span>SDK 전송 최대 ${b.sdk+1}회<\/span><\/div>`).join('')}<\/div><\/section>`).join('')}<\/div><div class="cols spaced">${card('중첩 시 가능한 상한',`<div class="stat">${n}<small>회<\/small><\/div><p>${b.gen} × ${b.send} × (${b.sdk} + 1)<\/p>`)}${card('교안의 전체 전송 상한',`<div class="stat">4<small>회 이하<\/small><\/div><p>실제 전송 직전에 공통 예산을 검사합니다.<\/p>`)}<\/div>${note(b.sdk?'SDK에도 재시도를 맡기면 앱의 계산과 실제 전송 수가 달라질 수 있습니다. 이 수업은 SDK 추가 재시도 0회로 고정합니다.':'최대값일 뿐입니다. 첫 응답이 정상이라면 1회에서 끝내며, 오류에 따라 즉시 중단합니다.',b.sdk?'warn':'ok')}`;}
function waitResult(w){const h=w.header===''?null:Number(w.header);if([w.attempt,w.jitter,w.remaining,w.used].some(x=>!Number.isFinite(x))||w.attempt<1||w.jitter<0||w.jitter>.25||w.remaining<0||w.used<0||!Number.isInteger(w.attempt)||!Number.isInteger(w.used)||(h!==null&&(!Number.isFinite(h)||h<0)))return{invalid:true};let fallback=Math.min(8,2**(w.attempt-1)),base=h===null?fallback:h,wait=base+w.jitter;return{fallback,base,wait,result:wait>w.remaining?'deferred':w.used>=4?'attempt_limit':'wait_allowed'};}
function waitDemo(){const w=S.wait,r=waitResult(w);return `${sampleLabel('본문의 대기 정책을 계산합니다. Jitter는 비교를 위해 고정 입력하며 실제로 sleep하지 않습니다.')}<div class="grid3 controls">${number('waitHeader','Retry-After (초 · 빈칸은 없음)',w.header,0,1000,.1)}${number('waitAttempt','실패 횟수 attempt',w.attempt,1,10,1)}${number('waitJitter','Jitter (초)',w.jitter,0,.25,.01)}${number('waitRemaining','남은 대기 예산 (초)',w.remaining,0,1000,.1)}${number('waitUsed','이미 사용한 전송 수',w.used,0,4,1)}<\/div>${r.invalid?note('범위에 맞는 수를 입력하세요. Jitter는 0~0.25초이며 실패·전송 횟수는 정수입니다.','fail'):`<div class="cols spaced">${card('이번 대기 계산',`<div class="formula">${r.base} + ${w.jitter} = <strong>${r.wait.toFixed(2)}초<\/strong><\/div><p>헤더가 있으면 헤더 값, 없으면 min(8, 2<sup>attempt−1<\/sup>)<\/p>`)}${card('정책 판단',`<div class="big">${{deferred:'deferred · 이번 실행 중단',attempt_limit:'attempt_limit · 전송 상한',wait_allowed:'대기 판단 통과'}[r.result]}<\/div><p>${r.result==='deferred'?'서버 최소 대기를 줄이지 않습니다. 이번 실행에서 재전송하지 않습니다.':r.result==='attempt_limit'?'전체 전송 4회를 이미 사용했습니다. 더 보내지 않습니다.':'대기 후 실제 전송 직전에 남은 예산을 다시 확인합니다.'}<\/p>`)}<\/div>`}`;}

function sha256(text){const bytes=new TextEncoder().encode(text);let words=[],bitlen=bytes.length*8;for(let i=0;i<bytes.length;i++)words[i>>2]=(words[i>>2]||0)|(bytes[i]<<(24-(i%4)*8));words[bitlen>>5]=(words[bitlen>>5]||0)|(0x80<<(24-bitlen%32));let last=(((bitlen+64)>>9)<<4)+15;words[last]=bitlen>>>0;words[last-1]=Math.floor(bitlen/4294967296);const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2],H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19],rot=(x,n)=>(x>>>n)|(x<<(32-n));for(let i=0;i<words.length;i+=16){let w=[],[a,b,c,d,e,f,g,h]=H;for(let t=0;t<64;t++){if(t<16)w[t]=words[i+t]||0;else{let s0=rot(w[t-15],7)^rot(w[t-15],18)^(w[t-15]>>>3),s1=rot(w[t-2],17)^rot(w[t-2],19)^(w[t-2]>>>10);w[t]=(w[t-16]+s0+w[t-7]+s1)|0;}let S1=rot(e,6)^rot(e,11)^rot(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[t]+w[t])|0,S0=rot(a,2)^rot(a,13)^rot(a,22),maj=(a&b)^(a&c)^(b&c),t2=(S0+maj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}[a,b,c,d,e,f,g,h].forEach((v,k)=>H[k]=(H[k]+v)|0);}return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');}

function help(){const links=DAY22_SOURCES.map(([title,url])=>`<li><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)}<\/a><\/li>`).join('');$('#helpBody').innerHTML=`<h2>이동과 시연<\/h2><p>← / → : 화면 이동 · M : 전체 지도 · F : 전체화면 · Esc : 열린 창 닫기<br>Space : 현재 단계별 시연의 다음 단계. 입력 중에는 단축키가 작동하지 않습니다.<\/p><h2>자료의 범위<\/h2><p>첨부 Day22 PPT의 학습 내용·실습 01~08·출력 계약을 기준으로 설명 화면을 재구성했습니다. 기존 실습 파일을 수정하거나 새 실습 과제를 추가하지 않습니다.<\/p><p>HTML의 조작형 이벤트·오류·시간·사용량은 설명용 시연입니다. 별도로 표시한 강사 제공 실행 기록만 실제 관찰값입니다. API 키를 받지 않으며 외부 모델을 호출하지 않습니다. Python 코드는 기존 로컬 실습에서 읽고 실행할 예제·발췌입니다.<\/p><h2>전날 코드와의 연결<\/h2><p>16일 HTML의 validate_answer는 raw·provided_ids·load_json을 받습니다. 24페이지에서는 load_json_strict를 명시하고, inspect_answer 연결 함수의 정의도 함께 보여 줍니다. 기존 실습의 모듈과 함수가 이미 준비돼 있다면 그 구현을 사용하며, 여러 코드 발췌를 한 파일에 무조건 이어 붙이지 않습니다.<\/p><h2>실습 환경<\/h2><p>Windows 11·VS Code·Git Bash를 사용합니다. 기존 수업용 가상환경을 계속 선택하고 필요한 패키지만 추가합니다. 각 실습 실행 파일 옆의 .env에서 키·모델을 읽어 OpenAI Responses API에 직접 연결합니다. HTML에는 키를 입력하지 않습니다.<\/p><h2>모델·단가 확인<\/h2><p>기본 모델은 gpt-5.4-mini-2026-03-17입니다. 강사 제공 로그에서 일반 텍스트 생성 completed와 31·36·67 tokens를 확인했습니다. Structured Outputs·Streaming과 비교 모델의 실제 생성은 별도 확인 대상입니다. 공식 문서의 기능 지원, 강사 환경의 실행 기록, 제작 환경의 로컬 검수를 구분합니다. 단가표는 기존 교안의 표준 텍스트 범위이며 실제 청구를 확인한 기록이 아닙니다.<\/p><details class="teaching-detail"><summary>원본의 표기 차이<\/summary><p>원래 실행 ID는 원본 본문에서 original_run_id, 캐시 코드에서는 origin_run_id로 나타납니다. 본 자료의 코드 설명은 origin_run_id를 유지합니다. 실제 파일의 필드명은 기존 실습을 따릅니다.<\/p><p>본문의 interrupted와 부록의 stream_interrupted는 스트림 중단을 나타내는 예시 이름입니다. refusal은 API의 콘텐츠 유형, refused는 앱 결과 표기의 예입니다. 서로 같은 API 필드로 취급하지 않습니다.<\/p><p>본문 대기 정책과 부록의 retry_delay는 상수와 기준식이 다릅니다. 별도 예시로 보존했으며 기존 실습을 새 정책으로 바꾸지 않습니다.<\/p><\/details><h2 class="spaced">공식 참고자료<\/h2><ul class="reference-list">${links}<\/ul>`;$('#helpDialog').showModal();}
const actions={prev:()=>goIndex(S.i-1),next:()=>goIndex(S.i+1),chapter:e=>goIndex(D.scenes.findIndex(s=>s.chapter===+e.dataset.ch)),atlasOpen:openMap,review:openReview,help,close:e=>document.getElementById(e.dataset.dialog).close(),fullscreen:()=>{if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});else document.documentElement.requestFullscreen?.().catch(()=>{});},mapMode:e=>{S.mapMode=e.dataset.mode;S.mapStep=-1;rerender();},mapNext:()=>{S.mapStep=Math.min(7,S.mapStep+1);rerender();},mapReset:()=>{S.mapStep=-1;rerender();},callNext:()=>{S.callStep=Math.min(4,S.callStep+1);rerender();},callReset:()=>{S.callStep=0;rerender();},gateCheck:()=>{const c=GATE_CASES[S.gateCase],raw=$('#gateRaw').value,g=responseGate(c,raw);S.gateRaw=raw;S.gateResult={gate:g,validation:g.error?null:C.validate(raw,c[4],true)};rerender();},gateReset:()=>{S.gateRaw=null;S.gateResult=null;rerender();},streamNext:()=>{S.streamStep=Math.min(streamEvents(S.streamCase).length,S.streamStep+1);if(S.streamStep===streamEvents(S.streamCase).length)stopPlay();rerender();},streamReset:()=>{stopPlay();S.streamStep=0;rerender();},streamPlay:()=>{if(S.playing){stopPlay();rerender();return;}if(S.streamStep>=streamEvents(S.streamCase).length)S.streamStep=0;S.playing=setInterval(()=>actions.streamNext(),850);rerender();},failureNext:()=>{S.failureStep=Math.min(FAILURES[S.failure].steps.length,S.failureStep+1);rerender();},failureReset:()=>{S.failureStep=0;rerender();},cacheRead:()=>{S.cache.result=readDemoCache();rerender();},cacheGenerate:()=>{let hit=readDemoCache();if(hit.hit){S.cache.result=hit;rerender();return;}S.cache.sends++;S.cache.pending=true;S.cache.result={hit:false,reason:'모의 응답 수신. 근거를 확인한 뒤 저장하세요.'};rerender();},cacheApprove:()=>{const c=S.cache;if(!c.pending)return;const raw=C.raw(C.answer(c.version==='v1'?'개인 폴더에 보관합니다.':'지정된 공유 폴더에 보관합니다.',[101]));c.entry={key:cacheKey(),raw,approved:true,expiry:c.now+60,origin:'demo-'+String(c.sends).padStart(3,'0')};c.pending=false;c.result={hit:false,reason:'승인한 시연 답변을 60초 TTL로 저장했습니다. 다시 조회하세요.'};rerender();},cacheReset:()=>{S.cache={now:0,version:'v1',scope:'classroom-demo',entry:null,pending:false,approved:false,result:null,sends:0};rerender();},prefixMode:e=>{S.prefix=e.dataset.mode;rerender();},integrationNext:()=>{S.integrateStep=Math.min(INTEGRATIONS[S.integrate].seq.length-1,S.integrateStep+1);rerender();},integrationReset:()=>{S.integrateStep=0;rerender();},integrationStep:e=>{S.integrateStep=+e.dataset.step;rerender();}};
