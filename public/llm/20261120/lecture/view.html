/* v9: a VS Code-style dark editor for Python source only.
   The lesson canvas, summaries, input controls and source text stay unchanged. */
.inline-python{
  --editor-bg:#1e1e1e;--editor-fg:#d4d4d4;--editor-tabs:#252526;
  --editor-border:#3c3c3c;--editor-accent:#3794ff;--editor-gutter:#999999;
  margin-top:30px;padding-top:0;border-top:0;min-width:0;
}
.inline-python .python-block{
  background:var(--editor-bg);color:var(--editor-fg);
  border:1px solid var(--editor-border);border-radius:8px;
  padding:0;margin:0 0 22px;min-width:0;overflow:hidden;
  box-shadow:0 3px 14px #142d4e12;color-scheme:dark;
}
.python-editor-bar{
  display:flex;align-items:stretch;min-width:0;
  background:var(--editor-tabs);border-bottom:1px solid #333333;
}
.python-tab{
  display:flex;align-items:center;gap:9px;flex:0 0 auto;
  padding:11px 19px 12px;color:#f0f0f0;background:var(--editor-bg);
  border-top:2px solid var(--editor-accent);border-right:1px solid #333333;
  font:500 14px/1.45 PretendardLecture, 'Segoe UI','Noto Sans CJK KR',sans-serif;
  user-select:none;
}
.python-file-mark{
  color:#78b7eb;font:600 12px/1 Consolas,'DejaVu Sans Mono',monospace;
  letter-spacing:-.5px;user-select:none;
}

  font:500 15px/1.6 PretendardLecture, 'Segoe UI','Noto Sans CJK KR','Malgun Gothic',sans-serif;
  color:#c8c8c8;margin:0;padding:11px 18px;align-self:center;
  min-width:0;word-break:keep-all;overflow-wrap:anywhere;
}
.inline-python .python-block pre{
  font-family:'Cascadia Code',Consolas,'D2Coding','Noto Sans Mono CJK KR','DejaVu Sans Mono',monospace;
  font-size:15px;line-height:1.8;font-weight:400;
  color:var(--editor-fg);background:var(--editor-bg);
  padding:18px 0 21px;margin:0;border:0;max-height:none;overflow:visible;
  white-space:normal;tab-size:4;font-variant-ligatures:none;
}

  display:flex;flex-direction:column;align-items:stretch;
  font:inherit;color:inherit;background:none;border:0;padding:0;
  white-space:normal;
}
.inline-python .python-line{
  display:block;position:relative;margin:0;
  padding:0 22px 0 68px;min-height:1.8em;line-height:1.8;

  border:0;box-shadow:none;background:transparent;
}

  content:attr(data-line);position:absolute;left:0;top:0;
  width:47px;padding-right:12px;color:var(--editor-gutter);

}

.inline-python .py-number{color:#b5cea8;font-weight:400}
.inline-python .py-function{color:#dcdcaa;font-weight:400}

<script>const DATA={"chapters":[{"id":1,"name":"명세서 이해","keywords":"SRS · ERD · API Specification","goal":"요구사항을 구현·검증 단위로 해석합니다.","focus":"request"},{"id":2,"name":"ERD · DB 구축","keywords":"PK · FK · DDL · Seed","goal":"전체 ERD를 읽고 DB를 먼저 구축합니다.","focus":"db"},{"id":3,"name":"API 명세 · Postman","keywords":"REST · JSON · HTTP Status","goal":"입력·출력 계약을 구현과 테스트에 연결합니다.","focus":"router"},{"id":4,"name":"기술 전체 연결","keywords":"FastAPI · pgvector · E5 · LLM","goal":"11/10~19 기술의 시스템상 위치를 구분합니다.","focus":"service"},{"id":5,"name":"구현 순서와 전략","keywords":"DB First · Layered Backend · Gate","goal":"작동하는 작은 흐름을 순서대로 완성합니다.","focus":"repo"},{"id":6,"name":"오후 프로젝트 시작","keywords":"Basic · Intermediate · Advanced","goal":"자신의 시작점을 선택하고 완료 증거를 남깁니다.","focus":"agent"}],"scenes":[{"chapter":0,"id":"cover","title":"보고서 처리 Agent · 개인 일일 프로젝트","claim":"SRS를 읽고 DB부터 구축하는 50분 실무형 안내","kind":"cover","minutes":1},{"chapter":0,"id":"contents","title":"목차","claim":"무엇을 만들지 확인한 뒤 구현 순서로 연결합니다.","kind":"contents","minutes":1},{"chapter":1,"id":"goal","title":"오늘의 핵심 과제는 6종 보고서 서비스 완성","claim":"보고서 CRUD·검색·요약·Agent를 한 프로젝트로 연결합니다.","kind":"concept","minutes":2,"left":[["입력과 출력","보고서 등록·조회·수정·삭제, ID·제목·유사도 조회, LLM 요약을 API로 제공합니다."],["데이터의 역할","보고서 원문·종류별 속성은 PostgreSQL의 일반 테이블에, Overview Embedding은 pgvector 컬럼에 저장합니다."]],"right":[["성공 증거","Postman 요청/응답 + DB의 실제 행 + 검색 결과 + 실제 LLM 응답을 각각 확인합니다."],["현실적인 범위","6개 카테고리, 기본 보고서 180건, 개요 벡터 180개. 파일 업로드·OCR·Multi-Agent는 이번 필수 범위가 아닙니다."]],"example":"등록: 실험 보고서 → ID 생성 → 상세 1행 → 개요 벡터 1개\n검색: “가중치” → 관련 보고서 한 건 / not_found\n요약: report_id → 원문 조회 → LLM API → 요약 JSON","terms":[["CRUD","Create / Read / Update / Delete. 데이터를 생성·조회·수정·삭제하는 기본 기능입니다.","등록 POST, 조회 GET, 수정 PUT, 삭제 DELETE"],["Overview","검색에 쓰는 보고서 개요(10~1,000자)입니다.","전체 원문과 다르고, 이를 384차원 벡터로 변환합니다."]]},{"chapter":1,"id":"three-docs","title":"SRS · ERD · API 명세서는 무엇이 다른가?","claim":"세 문서는 같은 기능을 서로 다른 관점에서 설명합니다.","kind":"docs","minutes":2,"terms":[["SRS","Software Requirements Specification. 시스템이 해야 하는 기능·조건·합격 기준을 정의하는 요구사항 명세서입니다.","B-05: 공통 보고서와 상세 행을 함께 저장"],["ERD","Entity–Relationship Diagram. 데이터 테이블과 열, 키, 테이블 사이 관계를 표현한 그림입니다.","reports.report_id ↔ experiment_reports.report_id"],["API Specification","프로그램 사이 요청·응답 규칙을 정한 문서입니다.","POST /api/v1/reports → 201 Created"]]},{"chapter":1,"id":"trace","title":"요구사항 하나를 끝까지 추적해 봅니다","claim":"SRS 항목을 읽었다면 관련 DB·API·검증 증거까지 찾습니다.","kind":"trace","minutes":2,"terms":[["Traceability","요구사항 ID를 설계·코드·테스트에 연결해 빠진 구현이 없는지 추적하는 성질입니다.","B-05 → reports + 상세 테이블 → API-02 → T-03"]]},{"chapter":2,"id":"erd-keys","title":"ERD에서 PK·FK·제약조건 읽기","claim":"컬럼 이름만 읽지 말고 데이터가 지켜야 할 규칙까지 확인합니다.","kind":"erd-keys","minutes":2,"terms":[["PK / FK","PK(Primary Key)는 행의 고유 식별자, FK(Foreign Key)는 다른 테이블의 행을 참조하는 열입니다.","reports.report_id = PK, experiment_reports.report_id = PK+FK"],["NOT NULL · CHECK","NOT NULL은 반드시 값이 있어야 한다는 조건, CHECK는 값·길이·범위를 검사하는 조건입니다.","reports.revision ≥ 1, report_categories.code 는 6개 코드 중 하나"]]},{"chapter":2,"id":"erd-full","title":"실제 전체 ERD 한 장을 읽습니다","claim":"요구사항 명세서와 동일한 10개 테이블·73개 컬럼을 화면 안에서 확대해 확인합니다.","kind":"erd","minutes":3,"terms":[["1:N / 1:1","한 카테고리에는 여러 보고서(1:N)가 연결되고, 각 보고서는 해당 상세 테이블의 한 행(1:1)과 연결됩니다.","카테고리 1 → 보고서 여러 건 → 종류별 상세 1건"]]},{"chapter":2,"id":"erd-read","title":"보고서 1건을 어떤 테이블에 저장하는가?","claim":"카테고리 → 공통 등록부 → 종류별 상세 + 검색 벡터를 분리합니다.","kind":"erd-read","minutes":2,"terms":[["ON DELETE CASCADE","부모 행을 삭제하면 참조하는 자식 행도 같이 삭제되도록 설정한 FK 규칙입니다.","reports 삭제 → 상세 행·report_embeddings 정리"],["Transaction","관련 작업들을 모두 확정(Commit)하거나 실패 시 되돌림(Rollback)으로 처리하는 DB 작업 단위입니다.","보고서 + 상세 행 + 벡터를 같은 성공/실패 단위로 저장"]]},{"chapter":2,"id":"db-first","title":"DDL → Seed → Embedding → 검증 순으로 DB를 구축","claim":"데이터가 없으면 뒤의 API가 올바른지 검증할 수 없습니다.","kind":"db-first","minutes":2,"codes":["verify-sql"],"terms":[["DDL","Data Definition Language. CREATE TABLE 등 데이터 구조를 만드는 SQL입니다.","schema.sql 실행"],["Seed Data","개발·테스트를 위한 초기 데이터입니다.","seed.sql: 6개 분류 · 180개 보고서 · 60개 Prompt 버전"],["Idempotency","같은 작업을 다시 실행해도 최종 상태가 중복·변질되지 않는 성질입니다.","seed.sql을 다시 실행해도 보고서 180건 유지"]]},{"chapter":3,"id":"api-anatomy","title":"API 명세서를 읽는 순서","claim":"Method·URL·입력 위치·검증 규칙·응답·오류를 한 덩어리로 읽습니다.","kind":"api-anatomy","minutes":2,"terms":[["Endpoint","클라이언트가 요청하는 HTTP Method + URL 조합입니다.","POST /api/v1/reports"],["Path / Query / Body","Path는 대상 ID, Query는 조회 옵션, Body는 보낼 데이터 본문입니다.","/reports/12 / ?title=가중치 / JSON 문서"],["Status Code","HTTP 처리 결과를 나타내는 숫자입니다.","201 생성, 200 조회, 204 삭제, 404 없음, 422 입력 오류"]]},{"chapter":3,"id":"api-create","title":"API-02: 등록 JSON을 읽고 DB 컬럼에 대응시킵니다","claim":"카테고리별 details는 달라도 공통 요청 계약은 같습니다.","kind":"api-create","minutes":2,"terms":[["Pydantic","FastAPI에서 요청 필드의 자료형·필수값·범위를 검사하는 데이터 모델 도구입니다.","title 1~200자, overview 10~1,000자 검사"],["Request Body","POST·PUT 등에 실어 보내는 JSON 본문입니다.","category_code, title, author, content, overview, details"]]},{"chapter":3,"id":"api-results","title":"API-03/04/07: 검색 실패의 의미가 다릅니다","claim":"리소스 없음(404), 목록 0건(200), 관련 없음(200)을 구분합니다.","kind":"api-results","minutes":2,"terms":[["not_found","유사도 검색은 정상 수행됐지만 관련성 기준을 통과한 보고서가 없는 결과 상태입니다.","HTTP 200 + {\"status\":\"not_found\",\"best_match\":null}"],["HTTP 422","입력 필드의 자료형·길이·필수값 조건이 잘못됐다는 응답입니다.","POST에 필수 overview가 누락된 경우"]]},{"chapter":3,"id":"postman","title":"Postman Collection으로 구현 완료를 확인합니다","claim":"요청을 매번 새로 만들지 않고 제공된 JSON을 Import하여 실행합니다.","kind":"postman","minutes":2,"terms":[["Collection","Postman에서 API 요청과 검증 코드를 한 묶음으로 저장한 파일입니다.","Report_Agent.postman_collection.json"],["Environment","base_url·report_id와 같은 공통 변수를 저장하는 Postman 환경입니다.","Report_Agent.postman_environment.json"]]},{"chapter":4,"id":"timeline","title":"11월 10~19일에 배운 기술의 자리를 찾습니다","claim":"기술명을 나열하기보다 담당하는 계층과 입·출력을 기억합니다.","kind":"timeline","minutes":2,"terms":[["ORM","Object–Relational Mapping. Python 객체를 DB 테이블·행과 연결하는 방식입니다.","SQLAlchemy Model, Session, Commit"],["Context","LLM에 전달하는 관련 정보와 지시를 포함한 입력 문맥입니다.","보고서 원문을 요약 Prompt에 포함"]]},{"chapter":4,"id":"architecture","title":"전체 그림: 한 요청은 어떤 계층을 거치는가?","claim":"FastAPI 안의 역할 분리와 PostgreSQL 안의 pgvector 위치를 확인합니다.","kind":"architecture","minutes":2,"terms":[["Repository / Service","Repository는 DB 읽기·쓰기, Service는 여러 저장 동작을 묶는 비즈니스 규칙을 담당합니다.","API → Service → Repository → PostgreSQL"],["Integration","외부 모델·서비스 호출을 감싸는 접점입니다.","embedding_client.py / llm_client.py"]]},{"chapter":4,"id":"data-roles","title":"원문·개요·Embedding·요약을 혼동하지 않습니다","claim":"같은 보고서에서 네 종류의 데이터가 서로 다른 목적으로 쓰입니다.","kind":"data-roles","minutes":2,"codes":["e5-example"],"terms":[["Embedding","텍스트의 의미 정보를 수치 벡터로 표현한 결과입니다. E5-small은 이번 수업에서 384차원을 사용합니다.","passage: 개요 → vector(384)"],["Vector Similarity","두 벡터가 의미상 얼마나 가까운지 비교합니다. pgvector의 <=>는 Cosine Distance 연산자입니다.","거리 작을수록 가까움; 유사도=1-거리"]]},{"chapter":4,"id":"hybrid","title":"Hybrid Search는 가장 가까운 것을 무조건 반환하지 않습니다","claim":"Keyword 후보와 Semantic 후보를 비교하여 1건 또는 not_found를 반환합니다.","kind":"hybrid","minutes":2,"terms":[["Keyword / Semantic","Keyword는 글자 포함 여부, Semantic은 Embedding으로 의미적 가까움을 비교합니다.","“가중치”가 제목·본문에 있음 / 의미적으로 유사한 Overview"],["Threshold","관련성이 충분한지 결정하는 기준입니다. 숫자 하나가 모든 데이터에 정답은 아닙니다.","초기 후보 SEARCH_MIN_SIMILARITY=0.75; 검증 데이터로 조정"]]},{"chapter":4,"id":"agent","title":"LLM 요약·RAG·Agent는 어떻게 다른가?","claim":"Basic은 정해진 action으로 도구를 호출하고 Advanced에서 LLM Tool Calling으로 확장합니다.","kind":"agent","minutes":2,"terms":[["RAG","Retrieval-Augmented Generation. 검색한 자료를 LLM의 답변 문맥에 활용하는 방식입니다.","찾은 보고서 원문 → Context → LLM 요약"],["Action Router / Tool Calling","Action Router는 명시된 동작을 분기하는 코드, Tool Calling은 LLM이 허용된 도구를 선택하도록 하는 방식입니다.","Basic: get_report / find_report / summarize_report; Advanced: 허용 Tool 3개"]]},{"chapter":5,"id":"roadmap","title":"문서는 전체를 읽고, 구현은 DB부터 시작합니다","claim":"선행 조건을 통과한 다음 단계로 이동합니다. 순서가 오류 탐색 비용을 줄입니다.","kind":"roadmap","minutes":3,"terms":[["Gate / Acceptance","Gate는 다음 작업으로 넘어가기 전 확인하는 조건, Acceptance는 요구사항의 완료 판정 기준입니다.","DB 180건 검증 후 FastAPI 구현 단계로 이동"]]},{"chapter":5,"id":"folder-map","title":"폴더 구조는 계층별 책임을 반영합니다","claim":"복잡하게 보이려고 분리하지 않고 API·업무 규칙·DB·모델 호출을 나눕니다.","kind":"folders","minutes":2,"terms":[["Router","HTTP Method와 URL을 받아 요청 검증·응답 처리를 연결하는 계층입니다.","app/api/reports.py"],["Session","하나의 DB 작업 맥락을 관리하는 객체입니다. Commit·Rollback을 제어합니다.","app/db/session.py"]]},{"chapter":5,"id":"live-plan","title":"구현 시연은 이 순서로 진행합니다","claim":"빈 폴더에서 출발하되 반복 INSERT·설치 작업은 제공 자료를 사용합니다.","kind":"live","minutes":2,"terms":[["Checkpoint","중간 단계에서 정상 동작이 확인된 상태입니다. 장애가 나도 이 단계부터 다시 시작할 수 있습니다.","DB 적재 확인 → CRUD 확인 → 검색 확인 → LLM 확인"]]},{"chapter":5,"id":"debug","title":"오류가 나면 어느 계약이 깨졌는지부터 확인합니다","claim":"Postman 응답·DB 행·벡터 상태·LLM 결과를 단계별로 분리합니다.","kind":"debug","minutes":2,"terms":[["Rollback","Transaction 중 예외가 나면 미확정 변경을 취소하는 DB 동작입니다.","두 테이블 중 하나가 실패해도 중간 행이 남지 않아야 함"]]},{"chapter":6,"id":"levels","title":"모든 난이도가 같은 구조를 목표로 합니다","claim":"시작 시 제공하는 코드의 양과 완료할 요구사항의 범위만 다릅니다.","kind":"levels","minutes":2,"terms":[["Skeleton Code","함수 시그니처·TODO 등 구조만 제공한 미완성 코드입니다.","Basic: main()은 완성, 핵심 CRUD·검색·요약은 직접 구현"]]},{"chapter":6,"id":"done","title":"완료는 ‘API 200’ 하나로 판정하지 않습니다","claim":"요구사항 ID마다 Postman 결과와 DB 데이터 상태를 함께 제출합니다.","kind":"done","minutes":2,"terms":[["Evidence","요구사항을 구현했다는 확인 가능한 증거입니다.","Postman 응답, SQL COUNT, 오류 응답, 실 LLM 호출 기록(비밀 제외)"]]},{"chapter":6,"id":"quiz","title":"오후 프로젝트 시작 전 최종 판단 4문항","claim":"정답을 보기 전에 구현 순서와 검증 근거를 직접 말해보세요.","kind":"quiz","minutes":2}]};
const CODES={"verify-sql": "-- PostgreSQL Query Tool · 샘플 건수 검증\nSELECT COUNT(*) AS categories FROM report_categories;  -- 기대 6\nSELECT COUNT(*) AS reports FROM reports;                -- 기대 180\nSELECT COUNT(*) AS prompt_versions FROM prompt_versions; -- 기대 60\nSELECT COUNT(*) AS embeddings FROM report_embeddings;  -- 실제 E5 실행 후 180\n\nSELECT COUNT(*) AS experiment_count FROM experiment_reports; -- 기대 30", "e5-example": "from sentence_transformers import SentenceTransformer\n\nmodel = SentenceTransformer(\"intfloat/multilingual-e5-small\")\noverview = \"클래스 가중치 적용에 따른 모델 성능 비교\"\nvector = model.encode([\"passage: \" + overview], normalize_embeddings=True)\nprint(vector.shape)   # (1, 384)\n# 질문을 찾을 때는 \"query: \" + 질문으로 encode합니다."};

const SUMMARY_HTML="<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Day25 핵심요약 · 보고서 처리 Agent</title><style>:root{--navy:#1c2b40;--blue:#426fa3;--line:#d7e0eb;--ink:#222f44}*{box-sizing:border-box}html{font-family:PretendardLecture, \"Malgun Gothic\",sans-serif;color:var(--ink);background:#f3f6fa}body{max-width:1100px;margin:auto;padding:35px 25px}h1{font-size:29px;margin:5px 0}h2{font-size:19px;color:#2f557e}p,li{line-height:1.75}header{margin-bottom:30px}small{color:#607387}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:22px;margin:0 0 14px}.card p{font-size:14px}.flow{background:#eef3fa;padding:14px;border-radius:8px;font-weight:bold;color:#2b5278;line-height:1.9}.end{color:#167062}.print{float:right;background:white;border:1px solid #cbd8e7;border-radius:7px;padding:8px 12px;cursor:pointer}@media(max-width:730px){.row{grid-template-columns:1fr}}@media print{body{padding:0;background:white}.card{break-inside:avoid}.print{display:none}}</style></head><body><header><small>Day 25 · 2026.11.20 (금) · 오전 50분</small><button class=\"print\" onclick=\"print()\">인쇄</button><h1>보고서 처리 Agent · 핵심요약</h1><p>어떤 문서를 읽고, 어떤 순서로 DB·API·검색·LLM을 구현해야 하는지 한 장의 흐름으로 정리합니다.</p></header><div class=\"card\"><h2>01 · 문서 읽기</h2><div class=\"flow\">SRS (무엇·합격 기준) → ERD (테이블·관계) → API 명세 (입출력·오류) → 테스트 증거</div><p>B-05 등록 요구사항 → reports + 해당 상세 + report_embeddings → API-02 POST → Postman 201/SQL 실측</p></div><div class=\"card\"><h2>02 · 실제 구현은 DB부터</h2><div class=\"flow\">ERD·SQL·Seed → ORM·Session → E5 어댑터 → CRUD → 일괄 색인 → Hybrid → LLM/Agent → Postman</div><p>시드: 카테고리 6, 보고서 180, 상세 각 30, Prompt 버전 60. 등록 전에 E5 encode/encode_overview를 준비하고, 검색 전에 초기 180건을 일괄 색인합니다.</p></div><div class=\"row\"><div class=\"card\"><h2>03 · 물리 DB 계약</h2><p><b>reports</b>: 공통 ID, category_id, overview, index_status, revision</p><p><b>6개 상세 테이블</b>: report_id(PK/FK), title, content, author, create_at, update_at + 종류별 속성</p><p><b>report_embeddings</b>: report_id, embedding VECTOR(384), model_name, overview_hash, indexed_revision, indexed_at</p><p><b>prompt_versions</b>: Prompt 버전 이력</p></div><div class=\"card\"><h2>04 · API 핵심</h2><p>API-02 POST /api/v1/reports → 201 (생성)</p><p>API-03 GET /api/v1/reports/{report_id} → 200/404</p><p>API-04 GET /api/v1/reports?title=... → 200 빈 목록 가능</p><p>API-07 POST /api/v1/search/similar → 200 found/not_found</p><p>API-08 POST /api/v1/reports/{id}/summarize → 실 LLM API</p></div></div><div class=\"row\"><div class=\"card\"><h2>05 · 기술 전체 연결</h2><p>FastAPI Router → Service → Repository/Integration → PostgreSQL + pgvector · E5 · LLM API</p><p>Keyword는 제목·개요·본문의 포함 여부, Semantic은 E5 query:/passage: 벡터 기반 거리. Basic은 명시적 Action Router이며 자율 Agent가 아닙니다.</p></div><div class=\"card\"><h2>06 · 오후 시작점</h2><p><b>Basic</b>: 동일 폴더 + Skeleton · TODO · main() 완성</p><p><b>Intermediate</b>: 동일 폴더 구조만 제공</p><p><b>Advanced</b>: 빈 폴더, 공통 SQL·환경자료 별도 제공</p><p class=\"end\"><b>완료 증거</b>: 요구사항 ID + Postman 응답 + DB 행/벡터 + LLM 기록. 검색 결과 ID로 요약하고 출처를 대조합니다. not_found이면 요약하지 않습니다.</p></div></div><p><small>오프라인 학습용 요약. 예시 응답·점수는 실제 서버나 모델 실행 결과를 의미하지 않습니다. 기준 명세서 v1.4.</small></p></body></html>";

function syntax(raw,lang){const out=[];const rx=/#[^\n]*|--[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:def|from|import|return|if|else|except|try|raise|with|as|class|for|in|True|False|None|SELECT|FROM|JOIN|WHERE|ON|ORDER|BY|COUNT|AS|AND|CREATE|TABLE|INSERT|INTO|VALUES|ALTER|NOT|NULL|PRIMARY|KEY|REFERENCES|DEFAULT|ROLLBACK|COMMIT)\b|\b\d+(?:\.\d+)?\b/g;let pos=0,m;
 while((m=rx.exec(raw))){if(m.index>pos)out.push(esc(raw.slice(pos,m.index)));const t=m[0],cls=t.startsWith('#')||t.startsWith('--')?'py-comment':t.startsWith('"')||t.startsWith("'")?'py-string':/^[0-9]/.test(t)?'py-number':'py-keyword';out.push(`<span class="${cls}">${esc(t)}</span>`);pos=rx.lastIndex;}out.push(esc(raw.slice(pos)));return out.join('');}

 const route=MAP25_ROUTES[mode]||MAP25_ROUTES.all;
 const active=step>=0?[route.seq[Math.min(step,route.seq.length-1)]]:(focus||map25focus());
 const serial=`d25atlas${++map25serial}`;
 const edgeHTML=MAP25_EDGES.map(([a,z,path,word,x,y,kind])=>{
   const relevant=route.nodes.includes(a)&&route.nodes.includes(z);
   const hot=step>=1&&a===route.seq[step-1]&&z===route.seq[step];
   return `<g class="atlas-edge ${kind} ${!relevant?'dim':''} ${hot?'traversing':''}"><path d="${path}" marker-end="url(#${serial}arr)"/>${mini?'':`<text x="${x}" y="${y}" text-anchor="middle">${esc(word)}</text>`}</g>`;
 }).join('');

 }).join('');

 'db':['초기 데이터가 180건이 아님','seed.sql 이전에 보고서 FK를 위반했는지, 중복 실행·ON CONFLICT 조건을 확인합니다.','테이블 COUNT와 참조 무결성 SQL을 확인하고 API 구현 전에 고칩니다.'],
 'json':['POST가 422를 반환','Path/Body를 혼동했는지, details의 카테고리별 필수 필드·공백·길이를 확인합니다.','Postman 요청 Body JSON과 Pydantic Schema를 같은 줄에서 비교합니다.'],
 'vector':['Update 후 오래된 보고서가 검색됨','overview 변경 시 Embedding 재계산과 indexed_revision, ready 상태를 확인합니다.','API 응답만 보지 말고 report_embeddings 행과 SQL 조회로 검증합니다.'],
 'llm':['요약이 503 또는 504','API 키 존재, 네트워크, 모델 명칭, Timeout, 호출 제한을 확인합니다.','실제 호출 여부를 명시하고 키·본문은 로그에 남기지 않습니다.'],
 'wrong':['검색어와 무관한 보고서 반환','Keyword 후보와 Semantic 후보의 필터 및 threshold, 동점 규칙을 확인합니다.','무관 질문이 not_found가 되는지 평가 세트로 확인합니다.']

const LEVELS={
 Basic:{get:'현업형 폴더 + Python Skeleton 제공. 함수 시그니처·상세 TODO·완성된 main() 제공. CRUD 구현은 비어 있음.',goal:'B-01~B-15: 6종 CRUD → ID/Title → 실제 E5 → Hybrid → 실제 LLM → 명시적 action',start:'완성된 구조를 읽고 핵심 Service·Repository·Router 기능을 직접 구현합니다.'},
 Intermediate:{get:'동일한 현업형 폴더 구조만 제공. Python 소스 파일과 Skeleton은 없음.',goal:'B-01~15 + I-01~09: 필터·입력 검증·Prompt 버전·구조화 요약·검색+요약 연결',start:'자신이 필요한 파일을 만들고 함수·API 계약을 명세서에서 직접 설계합니다.'},
 Advanced:{get:'빈 프로젝트 폴더에서 시작. 공통 SQL/.env.example/requirements.txt/명세서는 별도로 제공.',goal:'B+I+A-01~09: 낙관적 잠금, 재색인·Rollback, Tool Calling, 평가·운영 로그',start:'폴더 구조부터 직접 만들되 같은 ERD·API·데이터 계약을 지킵니다.'}

function levels(){return `<div class="tabs">${Object.keys(LEVELS).map(k=>activeBtn('0'+(Object.keys(LEVELS).indexOf(k)+1)+' · '+k,'level',k,state.level)).join('')}</div><div class="grid3 d25-level-grid">${Object.entries(LEVELS).map(([k,v])=>card(k,`<p><b>받는 것</b> · ${esc(v.get)}</p><p><b>목표</b> · ${esc(v.goal)}</p>`,k===state.level?'d25-focus':'' )).join('')}</div>${note(LEVELS[state.level].start)}${note('세 단계는 다른 프로젝트가 아닙니다. 같은 API·ERD·최종 폴더 구조를 기준으로 더 깊은 범위를 선택적으로 구현합니다.')}`;}
function done(){return `<div class="grid3 d25-evidence">${card('DB · SQL 증거','<p>카테고리 6 · 보고서 180 · 상세 6×30 · Prompt 버전 60 · E5 벡터 180</p><p>FK 누락·벡터 차원 오류가 없는지 SQL로 확인합니다.</p>')}${card('API · Postman 증거','<p>등록 201, ID 조회 200/404, 목록 200, 수정 200, 삭제 204, 잘못된 입력 422</p><p>유사도 찾음/없음 모두 200으로 구분합니다.</p>','soft')}${card('AI · 실행 증거','<p>원문 기반 실제 LLM 요약, Action 도구 실행 여부, 오류·Timeout의 명시적 기록</p><p>Mock 결과는 실사용 성공으로 표기하지 않습니다.</p>')}</div>${arrowFlow([['명세 요구사항 ID','B-* / I-* / A-*'],['실제 코드','폴더·파일·함수'],['테스트 증거','Postman + DB + LLM'],['제출','README · 미완료 내역']])}${note('제출물: 프로젝트·README·Postman·검증 SQL·완료 ID·미완료 목록. 마지막으로 검색 결과 ID를 요약 API에 넣고 report_id/source_revision을 대조합니다. not_found이면 요약하지 않습니다. 비밀값은 제외합니다.')}`;}
const QUIZ=[
 ['DB 구현 전에 명세서에서 무엇을 먼저 확인해야 하나요?','SRS 요구사항·ERD 저장 구조·API 입출력·검증 기준 전체를 먼저 읽고, 실제 구현은 DB부터 시작합니다.'],
 ['보고서 원문과 Overview Embedding은 어디에 있나요?','content는 6개 상세 보고서 테이블에 있고, overview는 reports, embedding은 같은 PostgreSQL의 report_embeddings vector(384)에 있습니다.'],
 ['POST /reports가 201을 반환하면 모든 검증이 끝난 것인가요?','아닙니다. 해당 상세 행과 벡터가 실제 DB에 저장됐는지, 잘못된 입력·장애·수정·삭제가 정상 처리되는지 확인해야 합니다.'],
 ['‘가중치’ 검색에서 관련 후보가 없는데 HTTP 404여야 할까요?','아닙니다. 정상 검색 결과가 없는 것이므로 HTTP 200에 status=not_found와 best_match=null을 반환합니다.']
];
function quiz(){return `<div class="d25-quizzes">${QUIZ.map(([q,a],i)=>`<div class="quiz-item"><p><b>Q${i+1}</b> · ${esc(q)}</p>${btn(state.quiz[i]?'정답 접기':'정답과 이유 확인','quiz',`data-value="${i}"`,'small')}${state.quiz[i]?`<div class="answer-box">${esc(a)}</div>`:''}</div>`).join('')}</div>${note('세 가지 질문에 답할 수 있으면 오후 구현을 시작할 준비가 됐습니다: 무엇을 / 어디에 / 어떻게 검증할 것인가?')}`;}
const RENDER={cover,contents,concept,docs,trace,'erd-keys':erdKeys,erd, 'erd-read':erdRead,'db-first':dbFirst,'api-anatomy':apiAnatomy,'api-create':apiCreate,'api-results':apiResults,postman,timeline,architecture,'data-roles':dataRoles,hybrid,agent,roadmap,folders,live,debug,levels,done,quiz};
function loc(){const x=cur(),ch=DATA.chapters[x.chapter-1];return `<div class="position-strip"><span class="position-label">현재 위치</span><div><span>보고서 처리 Agent</span><b>›</b><strong>${esc(map25label())}</strong><small>${esc(ch?.name||x.title)}</small></div>${btn('전체 지도','openMap','','small')}</div>`;}
function minmap(){return `<button class="mini-map-button" data-action="openMap" aria-label="전체 서비스 지도 열기">${svgMap25({mini:true,mode:'all',focus:map25focus()})}<span><i></i>${esc(map25label())}</span><small>전체 지도 열기 · M</small></button>`;}
function render(){let sc=cur(),front=sc.chapter===0;const stage=$('#stage');stage.className='stage '+(front?'frontmatter-stage':sc.kind==='concept'?'concept-stage':sc.kind==='architecture'?'map-stage':'');$('#stageScroll').classList.toggle('frontmatter-scroll',front);$('#positionMount').hidden=front;$('#miniMapMount').hidden=front;
 stage.innerHTML=front?RENDER[sc.kind](sc):`<header class="scene-head"><div class="eyebrow">${String(sc.chapter).padStart(2,'0')} · ${esc(DATA.chapters[sc.chapter-1].name)} </div><h1>${esc(sc.title)}</h1><p>${esc(sc.claim)}</p></header>${RENDER[sc.kind](sc)}${termHtml(sc)}<div class="d25-nextcue">${state.index===DATA.scenes.length-1?'이제 실습 구현을 시작합니다.':'이해 점검 후 다음 화면으로 이동합니다.'} <span>단축키 ← / →</span></div>`;
 $('#positionMount').innerHTML=front?'':loc();$('#miniMapMount').innerHTML=front?'':minmap();$('#chapters').innerHTML=DATA.chapters.map(ch=>`<button class="chapter ${sc.chapter===ch.id?'active':''}" data-action="chapter" data-value="${ch.id}" ${sc.chapter===ch.id?'aria-current="step"':''}><span class="num">${String(ch.id).padStart(2,'0')}</span><span>${esc(ch.name)}</span></button>`).join('');
 $('#sceneJump').innerHTML=DATA.scenes.map((x,i)=>`<option value="${x.id}" ${i===state.index?'selected':''}>${String(i+1).padStart(2,'0')} · ${esc(x.title)}</option>`).join('');$('#sceneFooter').textContent=`${state.index+1} / ${DATA.scenes.length}`;$('#progress').style.width=`${100*(state.index+1)/DATA.scenes.length}%`;$('#prevScene').disabled=state.index===0;$('#nextScene').disabled=state.index===DATA.scenes.length-1;document.title=`${sc.title} · Day25`;
}
function goto(i){map25stop();state.mapStep=-1;state.index=Math.max(0,Math.min(DATA.scenes.length-1,i));state.selectedNode=null;render();$('#stageScroll').scrollTop=0;try{history.replaceState(null,'','#'+cur().id);}catch(e){}}
function go(id){let idx=DATA.scenes.findIndex(x=>x.id===id);if(idx>=0)goto(idx);}
function gotoChapter(ch){let idx=DATA.scenes.findIndex(x=>x.chapter===+ch);if(idx>=0)goto(idx);}
function atlasDialog(){map25stop();state.selectedNode=null;$('#atlasBody').innerHTML=map25view(true);$('#atlasDialog').showModal();}
function openErd(){const content=()=>`<div class="d25-erd-controls"><span>실제 ERD 10개 테이블 · 73개 컬럼</span><div class="tabs">${[['fit','맞춤'],['1','100%'],['1.25','125%'],['1.5','150%']].map(([id,name])=>activeBtn(name,'erdZoom',id,state.erdZoom)).join('')}</div></div><div class="d25-erd-viewport d25-erd-large"><img class="d25-erd-image" style="width:${state.erdZoom==='fit'?'100%':1940*+state.erdZoom+'px'}" src="${ERD_IMAGE}" alt="전체 ERD: 테이블 및 제약조건"></div>`;$('#erdBody').innerHTML=content();$('#erdDialog').showModal();}
function summary(){const w=window.open('','_blank');if(!w){alert('팝업이 차단되었습니다. 함께 배포한 핵심요약 HTML을 여세요.');return;}w.document.open();w.document.write(SUMMARY_HTML);w.document.close();}
function help(){let inner=`<h2>Day25 · 조작 방법과 근거</h2><p><b>← / →</b>로 이전·다음 화면을 이동하고, <b>M</b> 키 또는 상단 전체 지도를 사용합니다. 전체 지도에서는 경로를 선택한 뒤 '한 단계씩' 또는 '자동 따라가기'로 흐름을 확인하고, 노드를 선택하면 설명을 볼 수 있습니다. <b>F</b>는 전체 화면입니다.</p><p>각 화면의 용어는 그 페이지 하단의 '핵심 용어 · 지금 이해하기'에서 설명합니다.</p><p><b>기준 문서</b>: 보고서 처리 Agent 요구사항 명세서 v1.4. 테이블 10개·73개 컬럼·API 15개·B/I/A 체크리스트 33개를 기준으로 제작했습니다.</p><p><b>주의</b>: 브라우저 속 검색 점수·API 예상 응답·파이프라인 단계는 로컬 교육용 시연입니다. PostgreSQL·E5·LLM API를 실제 호출하지 않았습니다.</p><p><b>실습 환경</b>: Windows 11, VS Code, Git Bash, PostgreSQL 18.6 + pgvector, 기존 Python venv, multilingual-e5-small, LLM API. Docker·WSL을 요구하지 않습니다.</p><p><b>중요</b>: 실제 API 키·비밀번호를 HTML·Git에 저장하지 마세요.</p>`;$('#helpBody').innerHTML=inner;$('#helpDialog').showModal();}
function copyCode(id){let raw=CODES[id];if(id==='api-body'){const x={category_code:state.doc,title:state.invalid?'':'가중치 적용에 따른 분류 모델 실험',author:'김연구',content:'실험 조건과 성능 변화를 비교했다.',overview:'클래스 불균형 데이터의 가중치 적용에 따른 모델 성능을 분석한 보고서',details:PAYLOADS[state.doc]};if(state.doc==='PROMPT')x.content=x.details.prompt_text;raw=JSON.stringify(x,null,2);}if(!raw)return;let el=document.createElement('textarea');el.value=raw;el.style.position='fixed';el.style.left='-9999px';document.body.appendChild(el);el.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}el.remove();if(!ok&&navigator.clipboard)navigator.clipboard.writeText(raw).then(()=>toast('코드를 복사했습니다.'));else toast(ok?'코드를 복사했습니다.':'복사할 코드를 선택해 복사하세요.');}
function toast(msg){const d=$('#toast');d.hidden=false;d.textContent=msg;clearTimeout(d._t);d._t=setTimeout(()=>d.hidden=true,2300);}
function redraw(){let y=$('#stageScroll').scrollTop;render();$('#stageScroll').scrollTop=y;if($('#atlasDialog').open)atlasDialogRefresh();if($('#erdDialog').open&&cur().kind==='erd')$('#erdBody').querySelector('.d25-erd-image').style.width=state.erdZoom==='fit'?'100%':(1940*+state.erdZoom)+'px';}
function atlasDialogRefresh(){if($('#atlasDialog').open)$('#atlasBody').innerHTML=map25view(true);}
const ACTIONS={
 prev:()=>goto(state.index-1),next:()=>goto(state.index+1),chapter:e=>gotoChapter(e.dataset.value),openMap:atlasDialog,
 close:e=>{map25stop();document.getElementById(e.dataset.dialog)?.close();},openSummary:summary,help,openErd,copy:e=>copyCode(e.dataset.code),
 trace:e=>{state.trace=e.dataset.value;redraw()},erdZoom:e=>{state.erdZoom=e.dataset.value;redraw()},erdType:e=>{state.erdType=e.dataset.value;redraw()},
 postStep:e=>{state.postStep=+e.dataset.value;redraw()},postPrev:()=>{state.postStep=Math.max(0,state.postStep-1);redraw()},postNext:()=>{state.postStep=Math.min(POST_STEPS.length-1,state.postStep+1);redraw()},
 tech:e=>{state.tech=e.dataset.value;redraw()},mapMode:e=>{map25stop();state.mode=e.dataset.value;state.mapStep=-1;state.selectedNode=null;redraw()},
 mapReset:()=>{map25stop();state.mapStep=-1;redraw()},mapPrev:()=>{map25stop();state.mapStep=Math.max(-1,state.mapStep-1);redraw()},
 mapNext:()=>{map25stop();map25next()},
 mapPlay:()=>{if(state.mapPlaying){map25stop();redraw();return;}if(state.mapStep>=MAP25_ROUTES[state.mode].seq.length-1)state.mapStep=-1;state.mapPlaying=true;map25next();if(state.mapPlaying)state.mapTimer=setInterval(map25next,1850);},
 mapNode:e=>{state.selectedNode=e.dataset.value;redraw()},mapClear:()=>{state.selectedNode=null;redraw()},
 roadStep:e=>{state.roadStep=+e.dataset.value;redraw()},folder:e=>{state.folder=e.dataset.value;redraw()},level:e=>{state.level=e.dataset.value;redraw()},quiz:e=>{const i=+e.dataset.value;state.quiz[i]=!state.quiz[i];redraw()},
 fullscreen:()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
};
document.addEventListener('click',e=>{let b=e.target.closest?.('[data-action]');if(!b||!ACTIONS[b.dataset.action])return;if(b.hasAttribute('disabled'))return;ACTIONS[b.dataset.action](b);});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='sceneJump'){go(el.value);return;}if(el.id==='apiCategory')state.doc=el.value;else if(el.id==='invalidApi')state.invalid=el.checked;else if(el.id==='hybridQuery')state.hybrid=el.value;else if(el.id==='debugKey')state.debugKey=el.value;else return;redraw();});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;let el=e.target;if(el.closest?.('.atlas-node')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();let node=el.closest('.atlas-node');ACTIONS.mapNode(node);return;}if(/INPUT|SELECT|TEXTAREA|BUTTON/.test(el.tagName))return;if($('#atlasDialog').open||$('#helpDialog').open||$('#erdDialog').open)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();goto(state.index+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();goto(state.index-1);}else if(e.key.toLowerCase()==='m')atlasDialog();else if(e.key.toLowerCase()==='f')ACTIONS.fullscreen();});
window.addEventListener('hashchange',()=>{let id=location.hash.slice(1);if(id&&id!==cur().id)go(id);});
let init=DATA.scenes.findIndex(x=>x.id===location.hash.slice(1));if(init>=0)state.index=init;
render();window.Day25App={DATA,state,goto,go,render,MODE_TEXT,PATHS,TRACE,CASES};
