ng\">status</span><span class=\"py-string\">\"</span>: <span class=\"py-string\">\"</span><span class=\"py-string\">needs_clarification</span><span class=\"py-string\">\"</span>}","        <span class=\"py-comment\"># 원 질문을 덮어쓰지 않고 검색용 질문만 별도 필드에 기록합니다.</span>","        <span class=\"py-keyword\">return</span> {**state, <span class=\"py-string\">\"</span><span class=\"py-string\">status</span><span class=\"py-string\">\"</span>: <span class=\"py-string\">\"</span><span class=\"py-string\">ready</span><span class=\"py-string\">\"</span>,","                <span class=\"py-string\">\"</span><span class=\"py-string\">search_query</span><span class=\"py-string\">\"</span>: result.standalone_query}","    <span class=\"py-keyword\">return</span> RunnableLambda(rewrite_step)","","rewrite_stage = make_rewrite_stage(rewrite_chain)","<span class=\"py-comment\"># rewrite_stage.invoke(state) 시점에 Prompt 생성 및 실제 LLM API 호출.</span>"]}},{"id":"d27-runnable-rerank","chapter":6,"kind":"code","title":"LangChain Pipeline의 실제 실행 순서를 완성합니다","claim":"새로운 코드를 중복 작성하지 않고 Chapter 4·5에서 만든 Runnable을 연결합니다.","left":"입력: ready 상태의 state. 기존 retrieval_stage와 rerank_stage를 주입.","right":"출력: candidate_docs와 ranked_docs를 모두 보존한 state.","code":{"lang":"python","title":"app/pipeline.py · Retrieve | Rerank","raw":"from langchain_core.runnables import RunnableLambda\n\n# Chapter 4의 retrieval_stage와 Chapter 5의 rerank_stage를 재사용합니다.\ndef skip_if_unclear(state: dict) -> dict:\n    if state.get(\"status\") != \"ready\":\n        raise ValueError(\"query needs clarification\")\n    return state\n\n# 왼쪽 출력 dict가 오른쪽 Runnable의 입력 dict가 됩니다.\nsearch_pipeline = (RunnableLambda(skip_if_unclear)\n                   | retrieval_stage | rerank_stage)\n# result = search_pipeline.invoke({\"status\":\"ready\", \"search_query\":..., \"category\":...})\n# 결과: 원 question, candidate_docs, ranked_docs가 모두 남아 있습니다.","desc":"코드는 역할 연결 발췌입니다. 실제 검색·재정렬 함수는 앞 Chapter의 입력 계약에 따라 주입합니다.","highlighted":["<span class=\"py-keyword\">from</span> langchain_core.runnables <span class=\"py-keyword\">import</span> RunnableLambda","","<span class=\"py-comment\"># Chapter 4의 retrieval_stage와 Chapter 5의 rerank_stage를 재사용합니다.</span>","<span class=\"py-keyword\">def</span> <span class=\"py-function\">skip_if_unclear</span>(state: dict) -&gt; dict:","    <span class=\"py-keyword\">if</span> state.get(<span class=\"py-string\">\"</span><span class=\"py-string\">status</span><span class=\"py-string\">\"</span>) != <span class=\"py-string\">\"</span><span class=\"py-string\">ready</span><span class=\"py-string\">\"</span>:","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">\"</span><span class=\"py-string\">query needs clarification</span><span class=\"py-string\">\"</span>)","    <span class=\"py-keyword\">return</span> state","","<span class=\"py-comment\"># 왼쪽 출력 dict가 오른쪽 Runnable의 입력 dict가 됩니다.</span>","search_pipeline = (RunnableLambda(skip_if_unclear)","                   | retrieval_stage | rerank_stage)","<span class=\"py-comment\"># result = search_pipeline.invoke({\"status\":\"ready\", \"search_query\":..., \"category\":...})</span>","<span class=\"py-comment\"># 결과: 원 question, candidate_docs, ranked_docs가 모두 남아 있습니다.</span>"]},"references":[{"label":"LangChain · Python documentation","url":"https://docs.langchain.com/oss/python/langchain/overview"}],"flowTrace":[{"label":"실행 가능 확인","input":"state[\"status\"]","output":"ready 상태 또는 명확한 오류","line":4,"why":"확인이 필요한 질의는 검색하지 않습니다."},{"label":"Retriever","input":"state[\"search_query\"]","output":"candidate_docs","line":11,"why":"기존 E5·pgvector Retriever를 실행합니다."},{"label":"Reranker","input":"candidate_docs","output":"ranked_docs","line":11,"why":"검색된 후보만 재정렬하고 원본 질문을 보존합니다."}],"introTerms":[{"term":"Pipeline / Stage","meaning":"Pipeline은 여러 처리 단계의 연결이고 Stage는 각 역할의 한 단계","use":"Rewrite·Retrieve·Rerank를 분리해 각 단계의 입력과 실패 지점을 확인"}]},{"id":"d27-generation-original","chapter":6,"kind":"code","title":"Context Builder를 이어 연결하고 원 질문을 지킵니다","claim":"LLM은 원래 사용자의 요청을 답하되, Rerank를 거친 문서의 Context를 근거로 사용합니다.","left":"입력: ranked_docs와 Day26 build_context 함수.","right":"출력: context/included_ids를 보존한 state; Prompt에 넘길 question/context dict.","code":{"lang":"python","title":"app/pipeline.py · Generation Input","raw":"from langchain_core.runnables import RunnableLambda\n\ndef context_step(state: dict) -> dict:\n    # Day26의 build_context는 (문맥 문자열, 실제 선택 Document)를 반환합니다.\n    context, included_docs = build_context(state[\"ranked_docs\"], max_items=3)\n    return {**state, \"context\": context, \"included_ids\":\n            [doc.metadata[\"citation_id\"] for doc in included_docs]}\n\ndef prompt_inputs(state: dict) -> dict:\n    # 검색용 search_query가 아니라 원래 사용자 question으로 답합니다.\n    return {\"question\": state[\"question\"], \"context\": state[\"context\"]}\n\ncontext_stage = RunnableLambda(context_step)\ngeneration_input_stage = RunnableLambda(prompt_inputs)\n# 이후 generation_chain = ChatPromptTemplate | ChatOpenAI","desc":"SearchQuery와 사용자 메시지 원문을 분리하지 않으면 질문을 새로 쓰는 과정에서 사용자 의도가 바뀔 수 있습니다.","highlighted":["<span class=\"py-keyword\">from</span> langchain_core.runnables <span class=\"py-keyword\">import</span> RunnableLambda","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">context_step</span>(state: dict) -&gt; dict:","    <span class=\"py-comment\"># Day26의 build_context는 (문맥 문자열, 실제 선택 Document)를 반환합니다.</span>","    context, included_docs = build_context(state[<span class=\"py-string\">\"</span><span class=\"py-string\">ranked_docs</span><span class=\"py-string\">\"</span>], max_items=<span class=\"py-number\">3</span>)","    <span class=\"py-keyword\">return</span> {**state, <span class=\"py-string\">\"</span><span class=\"py-string\">context</span><span class=\"py-string\">\"</span>: context, <span class=\"py-string\">\"</span><span class=\"py-string\">included_ids</span><span class=\"py-string\">\"</span>:","            [doc.metadata[<span class=\"py-string\">\"</span><span class=\"py-string\">citation_id</span><span class=\"py-string\">\"</span>] <span class=\"py-keyword\">for</span> doc in included_docs]}","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">prompt_inputs</span>(state: dict) -&gt; dict:","    <span class=\"py-comment\"># 검색용 search_query가 아니라 원래 사용자 question으로 답합니다.</span>","    <span class=\"py-keyword\">return</span> {<span class=\"py-string\">\"</span><span class=\"py-string\">question</span><span class=\"py-string\">\"</span>: state[<span class=\"py-string\">\"</span><span class=\"py-string\">question</span><span class=\"py-string\">\"</span>], <span class=\"py-string\">\"</span><span class=\"py-string\">context</span><span class=\"py-string\">\"</span>: state[<span class=\"py-string\">\"</span><span class=\"py-string\">context</span><span class=\"py-string\">\"</span>]}","","context_stage = RunnableLambda(context_step)","generation_input_stage = RunnableLambda(prompt_inputs)","<span class=\"py-comment\"># 이후 generation_chain = ChatPromptTemplate | ChatOpenAI</span>"]},"flowTrace":[{"label":"근거 선택","input":"state[\"ranked_docs\"]","output":"context · included_docs","line":5,"why":"재정렬된 후보 중 이번 LLM 입력에 넣을 본문을 고릅니다."},{"label":"출처 보존","input":"included_docs","output":"included_ids","line":6,"why":"실제 포함한 Document의 citation_id만 남깁니다."},{"label":"생성 입력","input":"question + context","output":"Prompt 입력 dict","line":9,"why":"검색용 search_query 대신 원래 사용자 question을 씁니다."}]},{"id":"d27-data-contract","chapter":6,"kind":"table","title":"실무 Pipeline에서는 단계별 출력 이름을 명확히 둡니다","claim":"같은 documents 변수를 계속 덮어쓰면 어떤 단계가 품질을 바꾸었는지 확인하기 어렵습니다.","headers":["입력·중간값","자료 형태","왜 보관하는가"],"rows":[["question · history","str · list[dict]","사용자 원 요청과 관련 대화 유지"],["search_query · search_queries","str · list[str]","Query Rewrite/Expansion 결과와 호출 근거"],["candidate_hits","list[Hit]","Retriever 원래 순위·점수·Metadata 확인"],["ranked_hits","list[Hit]","Rerank 후 순위와 같은 청크 ID 대조"],["context · included_ids","str · list[int]","모델에 실제 전달한 근거와 출처 경계"],["answer · sources","JSON/Pydantic · 출처 목록","검증 통과 후 사용자 응답 구성"]],"note":"LLM 출력에 source_ids가 있다고 해서 실제 source_locator를 모델이 만들어서는 안 됩니다. 서버가 보관한 Metadata로 연결합니다."},{"id":"d27-pipeline-errors","chapter":6,"kind":"concept","title":"Stage를 연결해도 오류 처리는 Stage별로 구분합니다","claim":"Query Rewrite 오류, Retriever 오류, Reranker 오류, Generator 오류는 원인이 다르므로 같은 정상 결과로 덮어쓰지 않습니다.","left":[["Retry와 Fallback","Reranker가 실행되지 않으면 정책에 따라 오류로 종료하거나 원 검색 순위를 사용한 Fallback임을 기록할 수 있습니다. 조용히 기본 검색으로 바꾸면 개선 효과를 잘못 평가합니다."],["보안·출처","Rewrite/Expansion으로 새 질의를 만들더라도 원 요청의 Category·권한·현재 Version을 재사용하고, included_ids를 최종 Validator에 전달합니다."]],"right":[["상태 예시","rewrite_failed / retrieval_failed / rerank_failed / generation_failed / insufficient_context"],["추적 예시","어느 단계에서 실패했는지, 후보 수와 원래 질문·검색용 질문이 무엇이었는지 남깁니다."]],"distinction":"이번 수업의 Fallback 정책은 설계 예시이며 무조건 Fallback을 사용해야 한다는 규칙은 아닙니다."},{"id":"d27-pipeline-demo","chapter":6,"kind":"demo","title":"시연 · Chain의 중간값이 어떻게 이어지는지 추적합니다","claim":"실행 단계를 선택하면 질문과 후보·재정렬·Context 자료형이 어떻게 변하는지 관찰합니다.","demo":"pipeline-lab","left":[["파일과 노드","검색·재정렬·Context가 서로 다른 노드여도 프로젝트 파일을 자유롭게 나눌 수 있습니다."],["invoke","연결식 구성과 실제 실행 시점이 다름을 확인합니다."]],"right":[["출처","ranked_hits를 Context로 만들 때 실제 포함 ID를 별도로 보관합니다."],["생성","LLM 응답은 준비된 사례이며 HTML 내부에서 Python이 실행되지 않습니다."]],"note":"시연은 준비한 중간값을 표시합니다. 실제 LangChain·PostgreSQL·Cross-Encoder를 실행하지 않습니다."},{"id":"d27-pr6","chapter":6,"kind":"practice","title":"실습 06 · 기존 LangChain RAG에 Rewrite와 Reranker 연결","claim":"Rewrite→Retriever→Rerank→Context의 Runnable Pipeline을 연결합니다.","preparation":"Day26 coursekit 모듈의 입력·출력 규칙과 오늘의 Query Plan·Rerank 함수를 사용합니다.","output":"질문부터 candidate_hits·ranked_hits·included_ids까지 이어지는 실행 추적표","levels":[{"name":"01_basic · 기본필수","folder":"01_basic","task":"제공된 Runnable과 state dict에서 검색용 질문·원 질문 연결 TODO를 완성합니다.","result":"모든 단계의 입력·출력 순서 확인"},{"name":"02_intermediate · 응용","folder":"02_intermediate","task":"검색·재정렬 단계와 출처 Metadata 보존을 직접 연결합니다.","result":"candidate와 reranked 결과 모두 확인"},{"name":"03_advanced · 심화","folder":"03_advanced","task":"예외 분기·Fallback 표시·중간값 로그를 추가합니다.","result":"Stage별 실패를 다른 상태로 반환"}],"criterion":"생성용 원 질문, 검색용 질문, 후보와 재정렬 결과, 실제 Context 출처가 각각 기록됩니다.","caution":"프레임워크를 사용해도 API Key·DB·접근제어·출처 검사는 직접 관리합니다."},{"id":"d27-q6","chapter":6,"kind":"quiz","title":"이해 확인 · LangChain 연결의 책임","claim":"Pipeline 코드를 보고 무엇이 실제로 실행되는지 구분합니다.","items":[["RunnableLambda 객체를 만든 순간 검색 함수가 실행되나요?","아닙니다. 해당 Runnable을 invoke하거나 Chain을 실행할 때 동작합니다."],["Rerank 이후 후보가 달라졌을 때 원래 candidate_hits를 왜 보존하나요?","전후 비교·오류 추적·출처 대조를 위해서입니다."],["LangChain을 사용하면 출처 검증과 권한 검사가 자동으로 완성되나요?","아니요. 검색 필터·출처 확인은 앱의 규칙과 연결해야 합니다."]]},{"id":"d27-compare-definition","chapter":7,"kind":"concept","title":"검색 개선은 동일 조건의 Before/After로 확인합니다","claim":"같은 질문·같은 문서 버전·같은 검색 범위를 사용해 새 단계가 어떤 후보와 순위를 바꿨는지 관찰합니다.","left":[["한 번에 하나만 변경","Rewrite와 Rerank를 동시에 바꾸면 어느 변경이 결과를 개선했는지 구분하기 어렵습니다. Baseline → Rewrite만 → Rerank만 → 둘 다 순서로 구분해 볼 수 있습니다."],["질문과 정답 후보를 고정","시험용 질문과 관련 문서 ID를 먼저 기록한 뒤 비교합니다. 결과를 보고 정답 레이블을 수정하면 비교가 왜곡됩니다."]],"right":[["기준 실행","원 질문 → E5 검색 → Context 3개"],["개선 실행","Rewrite → 동일 E5 검색 → 동일 후보 Rerank → Context 3개"]],"distinction":"숫자 하나로 품질을 단정하지 않고, 어떤 문서를 왜 선택했는지 내용도 함께 읽습니다."},{"id":"d27-before-after-table","chapter":7,"kind":"table","title":"동일한 질문으로 순위를 나란히 비교합니다","claim":"같은 후보에 대한 재정렬 효과와 Rewrite로 후보 자체가 바뀐 효과는 구분합니다.","headers":["관찰 항목","Baseline","Improved"],"rows":[["검색용 질문","“그럼 취소는?”","“회의실 예약 취소 방법은?”"],["상위 후보(예시)","C1 신청 절차, C2 시설 위치, C3 취소 절차","C3 취소 절차, C1 신청 절차, C2 시설 위치"],["정답 후보의 위치","3위","1위"],["Context Top-2 포함","C3가 빠짐","C3 포함 가능"],["실제 개선 판단","답변과 출처 원문을 추가 확인","정보 부족·Grounding도 함께 확인"]],"note":"이 표는 예상 가능한 학습용 사례입니다. 실제 모델과 DB에서 항상 이렇게 개선되는 것은 아닙니다."},{"id":"d27-ranking-check","chapter":7,"kind":"code","title":"복잡한 평가 지표 전에 Top-k 포함 여부를 확인합니다","claim":"다음 날의 Recall@k·MRR·nDCG에 들어가기 전에 정답 문서가 후보에 있는지만 먼저 계산합니다.","left":"입력: 고정 질문, 관련 문서 ID, 순위가 정해진 후보.","right":"출력: Top-2에 관련 문서가 있는지에 대한 bool.","code":{"lang":"python","title":"compare.py · Top-k 포함 여부","raw":"def contains_relevant(top_ids: list[str], relevant_ids: set[str], k: int) -> bool:\n    # Top-k 중 하나라도 사전에 정한 관련 문서가 있는지 확인합니다.\n    return any(doc_id in relevant_ids for doc_id in top_ids[:k])\n\ngold = {\"C3\"}  # 질문에 답할 근거라고 사전에 표시한 문서\nbaseline = [\"C1\", \"C2\", \"C3\"]\nimproved = [\"C3\", \"C1\", \"C2\"]\nprint(contains_relevant(baseline, gold, 2))  # False\nprint(contains_relevant(improved, gold, 2))  # True","desc":"이 함수는 Recall@k 전체 공식을 대신하지 않습니다. 본격적인 Retrieval Evaluation은 11월 25일에 배웁니다.","highlighted":["<span class=\"py-keyword\">def</span> <span class=\"py-function\">contains_relevant</span>(top_ids: list[str], relevant_ids: set[str], k: int) -&gt; bool:","    <span class=\"py-comment\"># Top-k 중 하나라도 사전에 정한 관련 문서가 있는지 확인합니다.</span>","    <span class=\"py-keyword\">return</span> any(doc_id in relevant_ids <span class=\"py-keyword\">for</span> doc_id in top_ids[:k])","","gold = {<span class=\"py-string\">\"</span><span class=\"py-string\">C3</span><span class=\"py-string\">\"</span>}  <span class=\"py-comment\"># 질문에 답할 근거라고 사전에 표시한 문서</span>","baseline = [<span class=\"py-string\">\"</span><span class=\"py-string\">C1</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">C2</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">C3</span><span class=\"py-string\">\"</span>]","improved = [<span class=\"py-string\">\"</span><span class=\"py-string\">C3</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">C1</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">C2</span><span class=\"py-string\">\"</span>]","print(contains_relevant(baseline, gold, <span class=\"py-number\">2</span>))  <span class=\"py-comment\"># False</span>","print(contains_relevant(improved, gold, <span class=\"py-number\">2</span>))  <span class=\"py-comment\"># True</span>"]}},{"id":"d27-stage-logging","chapter":7,"kind":"code","title":"단계별 입력과 소요 시간을 실행 기록으로 남깁니다","claim":"모델 추론 시간은 CUDA의 비동기 실행을 고려해 측정합니다. 원격 LLM API·DB 호출은 GPU 동기화 대상이 아닙니다.","left":"입력: Stage 이름, 함수, 인수. 로컬 GPU 추론 단계일 때 gpu_stage=True.","right":"출력: 정상 결과와 Latency(ms), 실패 시 Stage 이름을 포함한 오류.","code":{"lang":"python","title":"tracing.py · 실측 시간 측정","raw":"from time import perf_counter\nimport torch\n\ndef timed_call(name: str, fn, *args, gpu_stage=False, **kwargs):\n    # CUDA kernel은 비동기이므로 GPU 단계는 시작·종료 시 동기화합니다.\n    if gpu_stage:\n        if not torch.cuda.is_available():\n            raise RuntimeError(\"CUDA GPU가 필요합니다.\")\n        torch.cuda.synchronize()\n    start = perf_counter()\n    try:\n        result = fn(*args, **kwargs)\n        if gpu_stage:\n            torch.cuda.synchronize()\n        elapsed = round((perf_counter() - start) * 1000, 1)\n        return result, {\"stage\": name, \"ok\": True, \"latency_ms\": elapsed}\n    except Exception:\n        if gpu_stage:\n            torch.cuda.synchronize()\n        elapsed = round((perf_counter() - start) * 1000, 1)\n        # 민감한 Prompt·API Key를 오류 로그에 남기지 않습니다.\n        raise RuntimeError(f\"{name} failed after {elapsed}ms\") from None\n\n# 예: timed_call(\"rerank\", rerank_stage.invoke, state, gpu_stage=True)","desc":"출력 시간은 실행할 때만 측정되며 강의 시연의 숫자와 별개입니다. 실무에서는 원 예외 정보를 안전한 서버 로그로 관리합니다.","highlighted":["<span class=\"py-keyword\">from</span> time <span class=\"py-keyword\">import</span> perf_counter","<span class=\"py-keyword\">import</span> torch","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">timed_call</span>(name: str, fn, *args, gpu_stage=<span class=\"py-keyword\">False</span>, **kwargs):","    <span class=\"py-comment\"># CUDA kernel은 비동기이므로 GPU 단계는 시작·종료 시 동기화합니다.</span>","    <span class=\"py-keyword\">if</span> gpu_stage:","        <span class=\"py-keyword\">if</span> not torch.cuda.is_available():","            <span class=\"py-keyword\">raise</span> RuntimeError(<span class=\"py-string\">\"</span><span class=\"py-string\">CUDA GPU가 필요합니다.</span><span class=\"py-string\">\"</span>)","        torch.cuda.synchronize()","    start = perf_counter()","    <span class=\"py-keyword\">try</span>:","        result = fn(*args, **kwargs)","        <span class=\"py-keyword\">if</span> gpu_stage:","            torch.cuda.synchronize()","        elapsed = round((perf_counter() - start) * <span class=\"py-number\">1000</span>, <span class=\"py-number\">1</span>)","        <span class=\"py-keyword\">return</span> result, {<span class=\"py-string\">\"</span><span class=\"py-string\">stage</span><span class=\"py-string\">\"</span>: name, <span class=\"py-string\">\"</span><span class=\"py-string\">ok</span><span class=\"py-string\">\"</span>: <span class=\"py-keyword\">True</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">latency_ms</span><span class=\"py-string\">\"</span>: elapsed}","    <span class=\"py-keyword\">except</span> Exception:","        <span class=\"py-keyword\">if</span> gpu_stage:","            torch.cuda.synchronize()","        elapsed = round((perf_counter() - start) * <span class=\"py-number\">1000</span>, <span class=\"py-number\">1</span>)","        <span class=\"py-comment\"># 민감한 Prompt·API Key를 오류 로그에 남기지 않습니다.</span>","        <span class=\"py-keyword\">raise</span> RuntimeError(<span class=\"py-string\">f</span><span class=\"py-string\">\"</span><span class=\"py-string\">{</span>name<span class=\"py-string\">}</span><span class=\"py-string\"> failed after </span><span class=\"py-string\">{</span>elapsed<span class=\"py-string\">}</span><span class=\"py-string\">ms</span><span class=\"py-string\">\"</span>) <span class=\"py-keyword\">from</span> <span class=\"py-keyword\">None</span>","","<span class=\"py-comment\"># 예: timed_call(\"rerank\", rerank_stage.invoke, state, gpu_stage=True)</span>"]},"introTerms":[{"term":"perf_counter()","meaning":"경과시간을 측정하기 위한 고해상도 Python 타이머","use":"Stage 실행 전후 차이를 계산해 밀리초(ms) 기록을 남길 때 사용"},{"term":"torch.cuda.synchronize()","meaning":"비동기로 실행될 수 있는 CUDA 작업이 끝날 때까지 기다리는 함수","use":"GPU 추론 시간 측정 전후에 호출하여 측정 구간이 누락되지 않도록 함"}]},{"id":"d27-diagnose-failures","chapter":7,"kind":"table","title":"좋은 비교표에는 실패의 종류도 남아야 합니다","claim":"정보 부족과 실행 오류를 같은 실패로 묶으면 어떤 조치를 해야 하는지 알 수 없습니다.","headers":["상황","관찰할 기록","후속 조치"],"rows":[["Rewrite가 잘못된 대상으로 변환","original vs search_query","History와 의미 보존 규칙 점검"],["후보에 정답 문서가 없음","candidate_ids · 적용 Filter","검색 K·Query·Indexing·버전 확인"],["후보에는 있지만 Top-N에서 빠짐","candidate_rank vs rerank_rank","Reranker 모델·Top-N 검토"],["Reranker 실행 오류","stage=rerank, 예외 종류","서버 자원·모델 로드·Timeout 확인"],["맞는 출처 ID, 잘못된 주장","answer · source_id · 원문","11/26 Grounding·회귀 테스트로 연결"]],"note":"사용자에게 전달할 응답은 예외를 안전하게 요약하고 민감 로그와 설정값은 공개하지 않습니다."},{"id":"d27-latency-tradeoff","chapter":7,"kind":"concept","title":"품질이 좋아져도 응답시간이 늘어날 수 있습니다","claim":"Rewrite 모델 호출과 Cross-Encoder 계산을 추가하면 단계 수가 늘어나므로, 개선된 근거와 실제 응답시간을 함께 관찰해야 합니다.","left":[["동일 조건 비교","모델·문서·검색 Top-k·캐시 사용 여부가 다르면 Latency의 원인을 비교하기 어렵습니다. 단일 실행 대신 반복 실행의 분포를 기록하는 것이 좋습니다."],["필요한 경우에만 실행","짧고 명확한 질문은 Rewrite를 생략하고, 후보가 적은 경우 Rerank를 줄이는 정책을 사용할 수 있습니다. 다만 생략 여부를 실행 기록에 남깁니다."]],"right":[["기록 예시","rewrite_ms / retrieve_ms / rerank_ms / generation_ms / total_ms"],["다음 단계","수업 11/25에 질문 세트와 평가 지표를 통해 Retrieval과 Generation을 따로 평가합니다."]],"distinction":"이 HTML은 실제 모델 호출을 하지 않으므로 표시하는 실행시간은 측정값이 아닙니다."},{"id":"d27-compare-demo","chapter":7,"kind":"demo","title":"시연 · 검색 전후의 Top-k 포함 여부를 계산합니다","claim":"여러 질문과 알고리즘 상태를 선택해 관련 문서의 위치·Top-k 포함 여부를 비교합니다.","demo":"compare-lab","left":[["정답 레이블","정답 문서 ID를 시연 전에 정하고 변경하지 않습니다."],["순위 변화","같은 후보의 Rerank 효과와 Rewrite로 후보가 바뀐 경우를 구분합니다."]],"right":[["Top-k 선택","k를 바꾸면 정답 문서 포함 여부도 달라질 수 있습니다."],["한계","예시 레이블을 넘어서 실제 답변의 Grounding은 별도로 확인해야 합니다."]],"note":"순위는 교육용 고정 사례입니다. 실제 Recall·Precision 통계나 모델 성능 측정으로 제시하지 않습니다."},{"id":"d27-pr7","chapter":7,"kind":"practice","title":"실습 07 · 검색 개선 전후의 차이를 기록합니다","claim":"LangChain Pipeline 실행 전후의 후보·순위·실행시간을 비교합니다.","preparation":"전날 5개 질문의 일부와 관련 청크 ID, 강의 제공 예시 순위를 사용합니다.","output":"후보 순위·Top-k 포함 여부·Stage 실행 결과 비교표","levels":[{"name":"01_basic · 기본필수","folder":"01_basic","task":"같은 후보 목록의 순위를 비교하고 정답 ID가 Top-2에 있는지 확인합니다.","result":"Before/After 표와 이유 작성"},{"name":"02_intermediate · 응용","folder":"02_intermediate","task":"Rewrite만 적용한 조건과 Rerank만 적용한 조건을 더합니다.","result":"변경 단계를 분리한 비교표"},{"name":"03_advanced · 심화","folder":"03_advanced","task":"실패 유형·실측 Stage 시간·정답 레이블 고정을 확인합니다.","result":"재현 가능한 실행/실패 로그"}],"criterion":"비교할 질문·버전·Category·Top-k가 고정되어 있고 결과가 실제 문서와 연결됩니다.","caution":"모의 점수를 실제 평가 지표처럼 보고하거나 한 번의 결과로 항상 개선된다고 판단하지 않습니다."},{"id":"d27-q7","chapter":7,"kind":"quiz","title":"이해 확인 · 결과 비교의 원칙","claim":"무엇을 고정하고 어떤 수치를 기록할지 생각합니다.","items":[["Reranking 효과를 비교할 때 왜 Candidate Set을 고정하나요?","후보가 달라지면 첫 검색 효과와 재정렬 효과를 분리할 수 없기 때문입니다."],["질문별 관련 문서 ID를 결과를 본 뒤 수정해도 되나요?","아닙니다. 평가 편향이 생깁니다. 관련성 기준은 결과 관찰 전에 정해야 합니다."],["시연에서 임의로 지정한 Reranker 점수와 실제 추론 결과가 같은가요?","아닙니다. 시연 숫자는 흐름 설명용 예시이고 실측 결과는 실제 모델 실행에서 얻어야 합니다."]]},{"id":"d27-final-architecture","chapter":8,"kind":"architecture","title":"오늘 추가한 단계가 기존 RAG 서비스에 합쳐집니다","claim":"User Question → Rewrite → Retrieve → Rerank → Context → Prompt → LLM → Validation으로 연결합니다.","diagram":"rag","sections":[["입력에서의 변화","대화 History와 원 질문을 보관하고 검색을 위한 Standalone Query를 준비합니다."],["검색·Context에서의 변화","기존 E5/pgvector 후보 검색을 수행하고, 그 후보에만 Cross-Encoder를 적용해 순서를 바꿉니다."],["생성과 검증은 유지","질문과 실제 Context를 모델에 전달하고 포함한 ID로 출처 범위를 검증합니다."]],"note":"기존 전체지도에서 검색 단계가 확장되는 위치를 확인합니다. Reranker는 Retriever를 대체하지 않습니다.","systemLocation":true},{"id":"d27-full-service","chapter":8,"kind":"code","title":"LangChain을 중심으로 개선된 RAG Service를 조립합니다","claim":"기존 LangChain Stage를 재사용하며 use_rewrite·use_rerank를 적용하고 출처 검증은 별도로 수행합니다.","left":"전제: Day26 서비스와 오늘 만든 Runnable·검증 함수를 실제 환경에서 주입.","right":"출력: needs_clarification, insufficient_context 또는 검증된 출처 포함 응답.","code":{"lang":"python","title":"app/pipeline.py · 개선된 RAG 함수","raw":"from langchain_core.runnables import RunnableLambda\n\n# 각 단계는 이 장에서 이전에 만든 Runnable을 주입받습니다.\ndef make_enhanced_service(rewrite_stage, retrieval_stage,\n                          rerank_stage, context_stage, generation_chain,\n                          validate_and_attach):\n    def run(request: dict) -> dict:\n        # History 직렬화: 이 예시는 사용자 대화를 문자열로 연결한 학습용 형태입니다.\n        history_text = \"\\n\".join(f'{m.get(\"role\", \"user\")}: {m.get(\"content\", \"\")}'\n                                 for m in request.get(\"history\", []))\n        if request.get(\"use_rewrite\", True):\n            state = rewrite_stage.invoke({**request, \"history_text\": history_text})\n        else:\n            state = {**request, \"status\": \"ready\", \"search_query\": request[\"question\"]}\n        if state.get(\"status\") != \"ready\":\n            return {\"status\": \"needs_clarification\", \"answer\": \"질문 대상을 알려주세요.\"}\n        # 기본 경로는 기존 Retriever; Multi-query는 별도 확장 옵션입니다.\n        state = retrieval_stage.invoke(state)\n        if request.get(\"use_rerank\", True):\n            state = rerank_stage.invoke(state)\n        else:\n            state = {**state, \"ranked_docs\": state[\"candidate_docs\"]}\n        state = context_stage.invoke(state)\n        if not state[\"included_ids\"]:\n            return {\"status\": \"insufficient_context\", \"answer\": \"근거가 부족합니다.\"}\n        # 모델은 사용자 원 질문으로 답하고, 서버가 실제 포함한 ID를 검사합니다.\n        raw = generation_chain.invoke({\"question\": state[\"question\"],\n                                       \"context\": state[\"context\"]})\n        return validate_and_attach(raw, state[\"included_ids\"], state)\n    return RunnableLambda(run)","desc":"구조와 책임을 보여 주는 발췌입니다. 실제 운영에서는 Stage별 예외 매핑·출처 검증·API 응답 모델을 완성해야 합니다.","highlighted":["<span class=\"py-keyword\">from</span> langchain_core.runnables <span class=\"py-keyword\">import</span> RunnableLambda","","<span class=\"py-comment\"># 각 단계는 이 장에서 이전에 만든 Runnable을 주입받습니다.</span>","<span class=\"py-keywo y-string\">status</span><span class=\"py-string\">\"</span>: <span class=\"py-string\">\"</span><span class=\"py-string\">ready</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">search_query</span><span class=\"py-string\">\"</span>: request[<span class=\"py-string\">\"</span><span class=\"py-string\">question</span><span class=\"py-string\">\"</span>]}","        <span class=\"py-keyword\">if</span> state.get(<span class=\"py-string\">\"</span><span class=\"py-string\">status</span><span class=\"py-string\">\"</span>) != <span class=\"py-string\">\"</span><span class=\"py-string\">ready</span><span class=\"py-string\">\"</span>:","            <span class=\"py-keyword\">return</span> {<span class=\"py-string\">\"</span><span class=\"py-string\">status</span><span class=\"py-string\">\"</span>: <span class=\"py-string\">\"</span><span class=\"py-string\">needs_clarification</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">answer</span><span class=\"py-string\">\"</span>: <span class=\"py-string\">\"</span><span class=\"py-string\">질문 대상을 알려주세요.</span><span class=\"py-string\">\"</span>}","        <span class=\"py-comment\"># 기본 경로는 기존 Retriever; Multi-query는 별도 확장 옵션입니다.</span>","        state = retrieval_stage.invoke(state)","        <span class=\"py-keyword\">if</span> request.get(<span class=\"py-string\">\"</span><span class=\"py-string\">use_rerank</span><span class=\"py-string\">\"</span>, <span class=\"py-keyword\">True</span>):","            state = rerank_stage.invoke(state)","        <span class=\"py-keyword\">else</span>:","            state = {**state, <span class=\"py-string\">\"</span><span class=\"py-string\">ranked_docs</span><span class=\"py-string\">\"</span>: state[<span class=\"py-string\">\"</span><span class=\"py-string\">candidate_docs</span><span class=\"py-string\">\"</span>]}","        state = context_stage.invoke(state)","        <spa ontext 생성","input":"ranked_docs","output":"context · included_ids","line":23,"why":"선택한 근거와 사용한 출처 ID를 함께 보존합니다."},{"label":"모델 답변","input":"원 question + context","output":"raw Generation","line":27,"why":"원래 사용자가 한 질문에 대해 답변을 생성합니다."},{"label":"검증·출처","input":"raw + included_ids","output":"검증된 API 응답","line":29,"why":"형식·허용 출처를 검사하고 서버에서 원문 출처를 연결합니다."}]},{"id":"d27-request-schema","chapter":8,"kind":"code","title":"API 입력 계약에 History와 후보 수를 추가합니다","claim":"입력 검증과 검색 모듈의 허용 범위를 일치시켜, API는 통과했는데 DB 검색에서 오류가 나지 않도록 합니다.","left":"입력: 질문·Category·대화 History·후보 수·Context 수·실행 옵션.","right":"출력: Pydantic 검증된 요청 객체.","code":{"lang":"python","title":"app/schemas.py · Input Schema","raw":"from pydantic import BaseModel, Field\nfrom typing import Literal\n\nclass EnhancedRagRequest(BaseModel):\n    question: str = Field(min_length=1, max_length=1000)\n    category: Literal[\"학사\", \"시설\", \"지원\"]\n    history: list[dict[str, str]] = Field(default_factory=list, max_length=6)\n    candidate_k: int = Field(default=10, ge=1, le=20)\n    context_k: int = Field(default=3, ge=1, le=3)\n    use_rewrite: bool = True\n    use_rerank: bool = True","desc":"본문 max_length는 문자 수 제한입니다. 실제 Embedding의 Token 한도는 encode_query에서 별도로 검사합니다.","highlighted":["<span class=\"py-keyword\">from</span> pydantic <span class=\"py-keyword\">import</span> BaseModel, Field","<span class=\"py-keyword\">from</span> typing <span class=\"py-keyword\">import</span> Literal","","<span class=\"py-keyword\">class</span> <span class=\"py-type\">EnhancedRagRequest</span>(BaseModel):","    question: str = Field(min_length=<span class=\"py-number\">1</span>, max_length=<span class=\"py-number\">1000</span>)","    category: Literal[<span class=\"py-string\">\"</span><span class=\"py-string\">학사</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">시설</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">지원</span><span clas /* Day26 content renderer using the original lecture template's HTML patterns.
   Pure string rendering only: no DOM access, event listeners, or state reset. */
(() => {
  'use strict';

  const C = globalThis.D26;
  const D = globalThis.LECTURE_DATA;
  if (!C || !D) throw new Error('Load D26 and LECTURE_DATA before template_renderer.js');
  const {esc} = C;
  C.data = D;
  if (C.state == null) C.state = JSON.parse(JSON.stringify(C.defaults || {}));

  function pairs(items, heading = 'h2') {
    if (!Array.isArray(items)) return items ? `<p>${esc(items)}</p>` : '';
    return items.map(([title, text]) =>
      `<section><${heading}>${esc(title)}</${heading}><p>${esc(text)}</p></section>`
    ).join('');
  }

  function references(items) {
    if (!items?.length) return '';
    return `<details class="teaching-detail d26-refs"><summary>원문 참고 · ${items.length}개</summary><div class="detail-content"><ul>${items.map(reference =>
      `<li><a href="${esc(reference.url)}" target="_blank" rel="noopener noreferrer">${esc(reference.label)}</a></li>`
    ).join('')}</ul></div></details>`;
  }

  function terms(items, large = false) {
    if (!items?.length) return '';
    return `<section class="notation-primer d26-terms${large ? ' d26-glossary' : ''}" aria-label="용어의 의미와 예시">${items.map(([term, definition, example]) =>
      `<p><b>${esc(term)}</b><span>${esc(definition)}${example ? `<small>${esc(example)}</small>` : ''}</span></p>`
    ).join('')}</section>`;
  }

  function comparisonTable(headers, rows) {
    return `<div class="table-wrap axis-table"><table><thead><tr>${headers.map(header =>
      `<th scope="col">${esc(header)}</th>`
    ).join('')}</tr></thead><tbody>${rows.map(row =>
      `<tr class="d26-table-row">${row.map((cell, index) => index === 0
        ? `<th scope="row">${esc(cell)}</th>`
        : `<td>${esc(cell)}</td>`).join('')}</tr>`
    ).join('')}</tbody></table></div>`;
  }

  function cover() {
    return `<section class="lecture-cover" aria-labelledby="lecture-title">
      <p class="cover-course">생성형 AI·LLM 및 RAG 엔지니어링</p>
      <h1 id="lecture-title" class="cover-title"><span class="cover-lead">검색한 문서로 근거 있는 답변 만들기</span><span class="cover-main">Basic RAG &amp; LangChain</span></h1>
      <div class="cover-rule" aria-hidden="true"></div>
      <div class="cover-meta"><div class="cover-session"><strong>DAY 26</strong><span>정규교과 10 / 18</span></div><time datetime="2026-11-23">2026.11.23 (월)</time></div>
    </section>`;
  }

  function contents() {
    return `<section class="keyword-contents" aria-labelledby="contents-title"><h1 id="contents-title">목차</h1><div class="contents-grid">${D.chapters.map(chapter => {
      const index = D.scenes.findIndex(scene => scene.chapter === chapter.number);
      const keywords = Array.isArray(chapter.keywords) ? chapter.keywords.join(' · ') : chapter.description;
      return `<button class="contents-item" data-jump="${index}" aria-label="${String(chapter.number).padStart(2, '0')} ${esc(chapter.title)}로 이동"><span class="contents-number">${String(chapter.number).padStart(2, '0')}</span><span class="contents-copy"><strong>${esc(chapter.title)}</strong><span class="contents-keywords">${esc(keywords)}</span></span></button>`;
    }).join('')}</div></section>`;
  }

  function codeTrace(scene) {
    const steps = scene.flowTrace;
    if (!Array.isArray(steps) || !steps.length) return '';
    const buttons = steps.map((s,i) => `<button type="button" data-d27-trace-step="${i}" aria-pressed="${i===0}"><span>${i+1}</span>${esc(s.label)}</button>`).join('');
    const panels = steps.map((s,i) => `<div class="d27-trace-panel" data-d27-trace-panel="${i}"${i?' hidden':''}>
        <div class="d27-trace-io"><div><b>INPUT</b><code>${esc(s.input)}</code></div><span class="d27-trace-arrow" aria-hidden="true">→</span><div><b>OUTPUT</b><code>${esc(s.output)}</code></div></div>
        <p>${esc(s.why)}</p><button class="d27-trace-goto" type="button" data-d27-trace-goto="${s.line}">코드 ${s.line}행 확인</button>
      </div>`).join('');
    return `<section class="d27-code-trace" data-d27-code-trace="${esc(scene.id)}"><div class="d27-code-trace-heading"><b>EXECUTION TRACE · 코드에서 값이 이동하는 순서</b><small>단계를 누르면 입력과 반환값을 확인할 수 있습니다</small></div><div class="d27-trace-steps">${buttons}</div>${panels}</section>`;
  }

  function codeKeyConcepts(scene) {
    const items=scene.introTerms;
    if(!Array.isArray(items)||!items.length)return '';
    return `<aside class="d27-term-primer" aria-label="코드 읽기 전 핵심 개념"><div class="d27-term-head"><strong>코드 읽기 전 · 핵심 개념</strong><span>이름의 뜻과 실제 사용 위치</span></div><div class="d27-term-grid">${items.map(item=>`<section class="d27-term-item"><h2><code>${esc(item.term)}</code></h2><p>${esc(item.meaning)}</p><small>${esc(item.use)}</small></section>`).join('')}</div></aside>`;
  }

  function codeSection(scene) {
    const code = scene.code;
    const languageKey = String(code.lang || 'python').toLowerCase();
    const language = {python: 'Python', sql: 'SQL', json: 'JSON', text: 'Text'}[languageKey] || code.lang;
    const fileMark = {python: 'py', sql: 'sql', json: '{}', text: 'txt'}[languageKey] || languageKey;
    const lines = Array.isArray(code.highlighted) ? code.highlighted : code.raw.split('\n').map(esc);
    return `${codeKeyConcepts(scene)}<div class="io-strip"><div><b>들어오는 것 · 입력 / 전제</b><span>${esc(scene.left)}</span></div><div><b>여기서 하는 일</b><span>${esc(code.title)}</span></div><div><b>다음으로 넘길 것 · 출력 / 관찰</b><span>${esc(scene.right)}</span></div></div>
      ${codeTrace(scene)}<section class="inline-python" aria-label="본문 ${esc(language)} 코드"><section class="python-block" data-code-key="${esc(scene.id)}" aria-label="${esc(language)} · ${esc(code.title)}"><header class="python-editor-bar"><span class="python-tab"><span class="python-file-mark" aria-hidden="true">${esc(fileMark)}</span>${esc(language)}</span><h3>${esc(code.title)}</h3><button class="small d26-copy" data-code="${esc(scene.id)}" aria-label="${esc(scene.title)} 코드 복사">코드 복사</button></header><pre><code class="python-source" aria-label="${esc(language)} 소스코드">${lines.map((line, index) =>
        `<span class="python-line" data-line="${index + 1}">${line || '<br>'}</span>`
      ).join('\n')}</code></pre></section><p class="template-note">${esc(code.desc)}</p></section>`;
  }

  function learningGoals(scene) {
    return `<div class="grid3">${scene.rows.map((row, index) =>
      `<section class="card level${index === 0 ? ' baseline' : ''}"><h2>${esc(row[0])}</h2><p><b>${esc(scene.headers[1])}</b><br>${esc(row[1])}</p><p><b>${esc(scene.headers[2])}</b><br>${esc(row[2])}</p></section>`
    ).join('')}</div>${scene.note ? `<p class="smalltext muted spaced">${esc(scene.note)}</p>` : ''}`;
  }

  function demoSection(scene) {
    const renderDemo = C.demos?.[scene.demo];
    if (typeof renderDemo !== 'function') throw new Error(`Missing demo renderer: ${scene.demo}`);
    const state = C.state?.[scene.demo] ?? C.defaults?.[scene.demo];
    const title = D.demoTitles?.[scene.demo] || scene.demo;
    return `<section class="d26-demo" data-demo-root="${esc(scene.demo)}"><header class="d26-demo-head row between"><div class="row"><strong>${esc(title)}</strong><span class="chip outline">OFFLINE · 교육용 시연</span></div><button class="small" data-reset-demo="${esc(scene.demo)}">초기값</button></header><div class="d26-demo-body">${renderDemo(state)}</div></section>
      <details class="teaching-detail" data-detail-key="${esc(scene.id)}-observe"><summary>시연에서 관찰할 것</summary><div class="detail-content"><div class="cols d26-demo-explain"><section>${pairs(scene.left, 'h3')}</section><section>${pairs(scene.right, 'h3')}</section></div></div></details>${scene.note ? `<p class="smalltext muted spaced">${esc(scene.note)}</p>` : ''}`;
  }

  function practiceSection(scene) {
    return `<section class="lesson-return"><div><h2>실습 준비와 산출물</h2><p><b>입력·준비:</b> ${esc(scene.preparation)}<br><b>남길 결과:</b> ${esc(scene.output)}</p></div><button data-action="atlasOpen" class="primary">같은 지도에서 확인</button></section>
      <p class="smalltext muted">세 수준 중 하나를 선택합니다. 모든 수준의 공통 목표는 같으며, 직접 완성할 범위와 확인할 조건을 조절합니다.</p>
      <div class="grid3">${scene.levels.map((level, index) => `<section class="card level${index === 0 ? ' baseline' : ''}"><h2>${esc(level.name)}</h2><h3>${esc(level.folder)}</h3><p>${esc(level.task)}</p><p><b>확인할 결과</b><br>${esc(level.result)}</p></section>`).join('')}</div>
      <div class="action-box spaced"><h2>공통 완료 기준</h2><p>${esc(scene.criterion)}</p></div>
      <p class="smalltext muted spaced"><b>주의할 점:</b> ${esc(scene.caution)}</p>`;
  }

  function renderScene(scene) {
    if (scene.kind === 'cover') return cover();
    if (scene.kind === 'contents') return contents();
    let body = `<header class="scene-head"><h1>${esc(scene.title)}</h1><p>${esc(scene.claim)}</p></header>`;
    if (scene.systemLocation) body += C.chapterLocation(scene);
    if (scene.kind === 'architecture') {
      body += C.renderArchitecture(scene);
    } else if (scene.kind === 'concept') {
      body += `<div class="concept-grid"><div class="concept-explanation">${pairs(scene.left)}</div><section class="concept-example">${pairs(scene.right)}${scene.example ? `<pre>${esc(scene.example)}</pre>` : ''}</section></div>${scene.distinction ? `<p class="concept-distinction">${esc(scene.distinction)}</p>` : ''}`;
    } else if (scene.kind === 'table') {
      body += scene.id === 'ch8-learning-goals'
        ? learningGoals(scene)
        : comparisonTable(scene.headers, scene.rows) + (scene.note ? `<p class="smalltext muted spaced">${esc(scene.note)}</p>` : '');
    } else if (scene.kind === 'code') {
      body += codeSection(scene);
      if (scene.walkthrough?.length) {
        body += `<section class="spaced"><h2>코드가 실행되는 순서</h2>${comparisonTable(['확인할 단계', '실제로 하는 일'], scene.walkthrough)}</section>`;
      }
    } else if (scene.kind === 'quiz') {
      body += scene.items.map(([question, answer], index) =>
        `<section class="quiz-item"><p><strong>${String(index + 1).padStart(2, '0')}.</strong> ${esc(question)}</p><details data-detail-key="${esc(scene.id)}-quiz-${index}"><summary>생각한 뒤 해설 보기</summary><div class="answer-box">${esc(answer)}</div></details></section>`
      ).join('');
    } else if (scene.kind === 'glossary') {
      body += terms(scene.terms, true);
    } else if (scene.kind === 'demo') {
      body += demoSection(scene);
    } else if (scene.kind === 'practice') {
      body += practiceSection(scene);
    } else {
      throw new Error(`Unsupported scene kind: ${scene.kind}`);
    }
    if (scene.kind !== 'glossary') body += terms(scene.terms);
    return body + references(scene.references);
  }

  function renderGlossary(query = '') {
    const search = String(query).toLowerCase().trim();
    const matches = D.glossary.filter(row => !search || row.join(' ').toLowerCase().includes(search));
    return `<p class="smalltext muted">${matches.length} / ${D.glossary.length}개 용어 · 이름은 영어로 유지하고, 의미와 예시를 함께 읽습니다.</p>${terms(matches)}`;
  }

  function renderHelp(reading = false) {

    const shortcuts = [

      ['처음 / 마지막', 'Home / End'],
      ['전체 지도 / 용어사전', 'M / G · 용어사전은 사용 안내에서도 열기'],
      ['전체화면 / 사용 안내', 'F / ?'],
      ['핵심요약 / 인쇄', '상단 핵심요약 → 새 요약 창의 인쇄 버튼'],
      ['전체 읽기', '상단 ? → 전체 읽기'],

rap:anywhere}\n</style></head><body><header class=\"review-top\"><div><div class=\"tag\">DAY 27 · 2026.11.24 · 핵심요약</div><h1>LangChain RAG · Query Optimization</h1><p>개념의 뜻 · 처리 위치 · 반드시 지킬 경계만 정리합니다.</p></div><button class=\"review-print\" type=\"button\" onclick=\"window.print()\">인쇄</button></header><main><section class=\"sheet\" id=\"review-1\"><div class=\"sheet-heading\"><span class=\"sheet-number\">01</span><h2>Query Rewrite · Standalone Query</h2></div><p class=\"definition\">Query Rewrite는 원래 의도를 보존하면서 질문을 검색하기 좋은 독립 문장으로 바꾸는 작업입니다.</p><figure><div class=\"two-col\"><div class=\"inline-def\"><b>History</b><p>“그럼 취소는?”의 생략된 대상 복원</p></div><div class=\"inline-def\"><b>Standalone Query</b><p>“회의실 예약 취소 방법은?”</p></div></div></figure><div class=\"lesson\"><strong>핵심 주의점</strong> 검색 전 단계입니다. 대화에 없는 숫자·날짜·조건을 추가하지 않으며 원래 사용자 질문을 보존합니다.</div></section>\n<section class=\"sheet\" id=\"review-2\"><div class=\"sheet-heading\"><span class=\"sheet-number\">02</span><h2>Expansion · Multi-query</h2></div><p class=\"definition\">Expansion은 관련 표현을 보강하는 방법이고, Multi-query는 여러 검색용 질문을 만들어 후보를 모으는 전략입니다.</p><figure><div class=\"two-col\"><div class=\"inline-def\"><b>원 질문</b><p>예약 취소 방법</p></div><div class=\"inline-def\"><b>검색 변형</b><p>예약 철회·취소 절차·취소 가능 조건</p></div></div></figure><div class=\"lesson\"><strong>핵심 주의점</strong> 각 질의에 같은 Category·버전·권한 필터를 적용하고 chunk_id로 중복 제거합니다. 무관한 확장은 검색 품질을 떨어뜨릴 수 있습니다.</div></section>\n<section class=\"sheet\" id=\"review-3\"><div class=\"sheet-heading\"><span class=\"sheet-number\">03</span><h2>Candidate-k · Context-k</h2></div><p class=\"definition\">Retriever는 먼저 후보를 찾고, Reranker가 그 후보를 재정렬한 뒤 일부만 Context에 포함합니다.</p><figure><div class=\"two-col\"><div class=\"inline-def\"><b>Candidate-k</b><p>예: Top-10 검색 후보</p></div><div class=\"inline-def\"><b>Context-k</b><p>예: 재정렬 후 Top-3 선택</p></div></div></figure><div class=\"lesson\"><strong>핵심 주의점</strong> 정답 문서가 후보에 없다면 Reranker로 되살릴 수 없습니다. E5·pgvector의 모델·필터 계약을 유지합니다.</div></section>\n<section class=\"sheet\" id=\"review-4\"><div class=\"sheet-heading\"><span class=\"sheet-number\">04</span><h2>Bi-Encoder · Cross-Encoder</h2></div><p class=\"definition\">Bi-Encoder는 문장을 따로 Embedding하여 빠른 검색에 쓰고, Cross-Encoder는 질문·문서 쌍을 함께 비교해 관련성 점수를 반환합니다.</p><figure><div class=\"two-col\"><div class=\"inline-def\"><b>1단계</b><p>E5 + pgvector로 후보 검색</p></div><div class=\"inline-def\"><b>2단계</b><p>Cross-Encoder로 후보 점수화·재정렬</p></div></div></figure><div class=\"lesson\"><strong>핵심 주의점</strong> Rerank 점수는 정답 확률이 아닙니다. 로컬 추론은 CUDA GPU가 기본이며, 문서 수·VRAM·Batch에 따라 실행 시간이 달라집니다.</div></section>\n<section class=\"sheet\" id=\"review-5\"><div class=\"sheet-heading\"><span class=\"sheet-number\">05</span><h2>LangChain · Service Pipeline</h2></div><p class=\"definition\">LangChain은 Prompt·Model·Retriever의 입력·출력을 Runnable로 연결합니다. Day26의 RAG 앞에 Rewrite, 검색 뒤에 Reranker를 추가합니다.</p><figure><div class=\"two-col\"><div class=\"inline-def\"><b>검색용 질문</b><p>search_query → Retriever·Reranker</p></div><div class=\"inline-def\"><b>답변용 질문</b><p>원래 question → Prompt·Generation</p></div></div></figure><div class=\"lesson\"><strong>핵심 주의점</strong> Runnable과 invoke는 흐름을 연결하지만 필터·원문 검증·오류 처리를 자동 보장하지 않습니다.</div></section>\n<section class=\"sheet\" id=\"review-6\"><div class=\"sheet-heading\"><span class=\"sheet-number\">06</span><h2>Before/After · Validation</h2></div><p class=\"definition\">고정한 질문·문서·필터로 후보 순위와 답변 근거를 비교하고 실행 오류를 단계별로 기록합니다.</p><figure><div class=\"two-col\"><div class=\"inline-def\"><b>Retrieval 비교</b><p>정답 후보가 Top-k에 들어왔는가?</p></div><div class=\"inline-def\"><b>Generation 확인</b><p>출처 ID·원문 주장이 일치하는가?</p></div></div></figure><div class=\"lesson\"><strong>핵심 주의점</strong> 교육용 고정 점수와 실제 모델 실행 결과를 구분합니다. Recall@k·MRR·nDCG는 11/25 수업에서 상세히 배웁니다.</div></section></main><footer class=\"review-footer\">한로 강민준 · Day27 LangChain RAG · 2026.11.24</footer></body></html>";

  const files = {"query.py":"# Rewrite Chain은 이전 수업의 Prompt와 Chat Model을 연결한 Runnable입니다.\ndef rewrite_step(state, rewrite_chain):\n    # API의 history 목록도 받을 수 있도록 검색용 문자열로 준비합니다.\n    history_text = state.get(\"history_text\", \"\")\n    if not history_text:\n        history_text = \"\\n\".join(\n            f'{m.get(\"role\", \"user\")}: {m.get(\"content\", \"\")}'\n            for m in state.get(\"history\", []))\n    result = rewrite_chain.invoke({\n        \"history\": history_text,\n        \"question\": state[\"question\"],\n    })\n    if result.needs_clarification:\n        return {**state, \"status\": \"needs_clarification\"}\n    return {**state, \"status\": \"ready\",\n            \"search_query\": result.standalone_query}","retrieval.py":"from coursekit.checkpoints import make_retriever\n\n# Day26 E5 + pgvector 검색을 다시 만들지 않고 재사용합니다.\ndef retrieve_step(state, search_hits):\n    retriever = make_retriever(search_hits)\n    docs = retriever.invoke({\n        \"query\": state[\"search_query\"],\n        \"category\": state[\"category\"],\n        \"candidate_k\": state.get(\"candidate_k\", 10),\n    })\n    # 반환된 것은 dict Hit가 아니라 LangChain Document 목록입니다.\n    return {**state, \"candidate_docs\": docs}","rerank.py":"import math\n\n# CrossEncoder가 Document 후보를 점수화합니다 (기본 CUDA GPU).\ndef rerank_step(state, cross_encoder):\n    docs = state[\"candidate_docs\"]\n    if not docs:\n        return {**state, \"ranked_docs\": []}\n    pairs = [(state[\"search_query\"], doc.page_content) for doc in docs]\n    scores = cross_encoder.predict(pairs, batch_size=4)\n    if len(scores) != len(docs) or not all(math.isfinite(float(s)) for s in scores):\n        raise ValueError(\"invalid rerank scores\")\n    ranked = sorted(zip(scores, docs), key=lambda pair: float(pair[0]), reverse=True)\n    # Document 원본을 순서만 바꾸므로 citation_id와 metadata는 유지됩니다.\n    return {**state, \"ranked_docs\": [doc for _, doc in ranked[:3]]}","pipeline.py":"from langchain_core.runnables import Runna (() => {

        if (globalThis.navigator?.clipboard?.writeText) {
          await globalThis.navigator.clipboard.writeText(code);
          showToast('코드를 복사했습니다.');
          return;
        }
        const area = document.createElement('textarea');
        area.value = code;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        let copied;
        try { area.select(); copied = document.execCommand('copy'); }
        finally { area.remove(); }
        if (!copied) throw new Error('Copy unavailable');
        showToast('코드를 복사했습니다.');
      } catch {
        dialog('sourceDialog', `<p class="smalltext muted">자동 복사를 사용할 수 없습니다. 아래 코드를 선택해 복사하세요.</p>${pre(code)}`);
      }
    }

    async function fullScreen() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch { showToast('브라우저의 전체화면 기능을 이용하세요.'); }
    }

    const actions = {
      next: () => go(index + 1),
      prev: () => go(index - 1),
      atlasOpen: openMap,
      atlasClose: () => { document.getElementById('atlasDialog').close(); selectedMapNode = null; selectedMapChapter = null; },
      atlasNode: element => inspectMapNode(element.dataset.node, element),
      atlasClear: () => inspectMapNode(null),
      atlasJump: element => go(element.dataset.scene),
      review: openReview,
      glossary: openGlossary,
      help: () => dialog('helpDialog', C.renderHelp(reading)),
      fullscreen: fullScreen,
      read: () => { reading = !reading; selectedMapNode = null; closeDialogs(); render(); },
      close: closeDialogs
    };

    document.addEventListener('click', event => {
      const element = event.target.closest?.('button,a,[data-action]');
      if (!element) return;
      if (element.hasAttribute('data-jump')) { event.preventDefault(); go(Number(element.dataset.jump)); }
      else if (element.dataset.action && actions[element.dataset.action]) { event.preventDefault(); actions[element.dataset.action](element); }
      else if (element.dataset.code) copyCode(element.dataset.code);
      else if (element.dataset.setDemo) updateDemo(element.dataset.setDemo, element.dataset.key, element.dataset.value);
      else if (element.dataset.resetDemo) {
        const name = element.dataset.resetDemo;
        if (!Object.hasOwn(C.defaults, name)) return;
        C.state[name] = clone(C.defaults[name]);
        element.closest('[data-demo-root]').querySelector('.d26-demo-body').innerHTML = C.demos[name](C.state[name]);
      } else if (element.dataset.source) {
        const hit = C.corpus.find(item => item.citation_id === Number(element.dataset.source));
        if (hit) dialog('sourceDialog', `<div class="d26-dialog-text"><h3>[${hit.citation_id}] ${esc(hit.title)}</h3><p><strong>${esc(hit.doc_id)}</strong> · ${esc(hit.source_version)} · ${esc(hit.category)}</p><p>${esc(hit.source_locator)}</p><div class="d26-question">${esc(hit.body)}</div><p class="smalltext muted">교육용 문서 · 실제 DB ID가 아닌 강의용 ID입니다. 이 위치는 모델이 만든 경로가 아니라 시연 Corpus의 레코드에서 가져왔습니다.</p></div>`);
      }
    });

    document.addEventListener('change', event => {
      const element = event.target;
      if (element.id === 'sceneJump') go(Number(element.value));
      else if (element.dataset.demo) updateDemo(element.dataset.demo, element.dataset.key, element.type === 'checkbox' ? element.checked : element.value, true);
    });

    document.addEventListener('input', event => {
      const element = event.target;
      if (element.id === 'glossarySearch') document.getElementById('glossaryResults').innerHTML = C.renderGlossary(element.value);
      else if (element.type === 'range' && element.dataset.demo) {
        const output = element.closest('label')?.querySelector('output');
        if (output) output.textContent = element.value;
      }
    });

    document.addEventListener('keydown', event => {
      const element = event.target;
      if (event.ctrlKey || event.altKey || event.metaKey) return;
      if (element.matches('input,select,textarea') || element.isContentEditable) {
        if (event.key === 'Enter' && element.type === 'text' && element.dataset.demo) {
          event.preventDefault();
          updateDemo(element.dataset.demo, element.dataset.key, element.value, true);
        }
        return;
      }
      const mapNode = element.closest?.('[data-action="atlasNode"]');
      if (mapNode && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        inspectMapNode(mapNode.dataset.node);
        return;
      }
      if (document.querySelector('dialog[open]')) return;
      if (reading && ['PageDown', 'PageUp', 'Home', 'End', ' '].includes(event.key)) return;
      const key = event.key.toLowerCase();
      const keys = {
        arrowright: () => go(index + 1), pagedown: () => go(index + 1),
        arrowleft: () => go(index - 1), pageup: () => go(index - 1),
        home: () => go(0), end: () => go(D.scenes.length - 1),
        m: openMap, g: openGlossary, f: fullScreen,
        '?': () => dialog('helpDialog', C.renderHelp(reading))
      };
      if (key === ' ' && !element.closest('button,a,summary')) { event.preventDefault(); go(index + 1); }
      else if (keys[key]) { event.preventDefault(); keys[key](); }
    });

    window.addEventListener('hashchange', () => {
      const next = fromHash();
      if (next >= 0 && (next !== index || reading)) go(next, false);
    });

    document.getElementById('atlasDialog').addEventListener('close', () => { selectedMapNode = null; });
    C.player = {go, render, openMap, openReview, get currentIndex() { return index; }, get reading() { return reading; }};
    const initial = fromHash();
    if (initial >= 0) index = initial;
    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, {once: true});
  else init();
})();




</script></body></html>
