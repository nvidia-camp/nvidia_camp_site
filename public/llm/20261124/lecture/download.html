/* v9: a VS Code-style dark editor for Python source only.
   The lesson canvas, summaries, input controls and source text stay unchanged. */
.inline-python{
  --editor-bg:#1e1e1e;--editor-fg:#d4d4d4;--editor-tabs:#252526;
  --editor-border:#3c3c3c;--editor-accent:#3794ff;--editor-gutter:#999999;
  margin-top:30px;padding-top:0;border-top:0;min-width:0;
}
.inline-python .python-block{
  background:var(--editor-bg);color:var(--editor-fg);
  border:1px solid var(--editor-border);border-radius:8px;
  padding:0;margin:0 0 22px;min-width:0;overflow:hidden;
  box-shadow:0 3px 14px #142d4e12;color-scheme:dark;
}
.python-editor-bar{
  display:flex;align-items:stretch;min-width:0;
  background:var(--editor-tabs);border-bottom:1px solid #333333;
}
.python-tab{
  display:flex;align-items:center;gap:9px;flex:0 0 auto;
  padding:11px 19px 12px;color:#f0f0f0;background:var(--editor-bg);
  border-top:2px solid var(--editor-accent);border-right:1px solid #333333;

  user-select:none;
}
.python-file-mark{
  color:#78b7eb;font:600 12px/1 Consolas,'DejaVu Sans Mono',monospace;
  letter-spacing:-.5px;user-select:none;
}
.inline-python .python-block .python-editor-bar h3{
  font:500 15px/1.6 'Segoe UI','Noto Sans CJK KR','Malgun Gothic',sans-serif;
  color:#c8c8c8;margin:0;padding:11px 18px;align-self:center;
  min-width:0;word-break:keep-all;overflow-wrap:anywhere;
}
.inline-python .python-block pre{
  font-family:'Cascadia Code',Consolas,'D2Coding','Noto Sans Mono CJK KR','DejaVu Sans Mono',monospace;
  font-size:15px;line-height:1.8;font-weight:400;
  color:var(--editor-fg);background:var(--editor-bg);
  padding:18px 0 21px;margin:0;border:0;max-height:none;overflow:visible;
  white-space:normal;tab-size:4;font-variant-ligatures:none;
}
.inline-python .python-block code.python-source{
  display:flex;flex-direction:column;align-items:stretch;
  font:inherit;color:inherit;background:none;border:0;padding:0;

}

.inline-python .py-function{color:#dcdcaa;font-weight:400}

/* Day26 feature adapters for the canonical lecture HTML template.
   Append after the original 55,445-character head stylesheet.
   The template owns the shell, typography, cards, tables, concept layouts,
   front matter, navigation, maps and Python editor. These rules add only
   Day26 controls, result annotations, search, reading and print behavior. */

/* Interactive examples use the template's row, chip, card and heading rules. */
.d26-demo{margin:18px 0;min-width:0}
.d26-demo-head{margin-bottom:18px}
.d26-demo-body{min-width:0}
.d26-controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 18px;margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.d26-control{display:block;flex:1 1 180px;min-width:min(100%,150px);max-width:400px;font-weight:400}
.d26-control.wide{flex-basis:320px;max-width:none}
.d26-control>span{display:block;margin-bottom:7px;font-weight:700;line-height:1.6;overflow-wrap:anywhere}
.d26-control select,.d26-control input[type=text]{min-height:42px}
.d26-control input[type=range]{display:block;min-height:24px}
.d26-control input[type=checkbox]{vertical-align:middle;margin:0 7px 0 0}
.d26-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.d26-split>*{min-width:0}
.d26-pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;max-height:none}
.d26-demo-explain{margin-top:18px}
.d26-demo details{margin:18px 0}
.d26-demo details>summary{cursor:pointer;color:var(--blue);font-weight:600;line-height:1.6}

/* State labels reuse the template's semantic colors and chip proportions. */
.d26-status{display:inline-flex;align-items:center;padding:4px 9px;border-radius:5px;background:var(--pale);color:var(--blue);font-size:13px;font-weight:700;line-height:1.4;white-space:normal;overflow-wrap:anywhere}
.d26-status.ok{background:#e7f3ee;color:var(--ok)}
.d26-status.bad{background:var(--paper);color:var(--bad);box-shadow:inset 0 0 0 1px currentColor}
.d26-status.wait{background:#fff5e7;color:var(--warn)}
.d26-status.neutral{color:var(--muted)}
.d26-metric{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px;padding:12px 0;border-bottom:1px solid var(--line);line-height:1.7}
.d26-metric:last-child{border-bottom:0}

.d26-source-button{margin:10px 6px 0 0}

.d26-note{margin:18px 0;color:var(--muted);line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}

.d26-instruction{display:block;margin:18px 0 8px;color:var(--muted);line-height:1.6}

/* This is an additional editor action, not a replacement editor theme. */
.d26-copy{align-self:center;flex:0 0 auto;margin:8px 12px 8px auto;padding:5px 9px;border-color:#727272;background:#333333;color:#f0f0f0;font-size:13px;line-height:1.4;white-space:nowrap}

/* Reference disclosures and notation use the template's existing components. */

tion":"Retriever 이후 › Context 이전","focusLabel":"검색 후 문서 정밀 비교","input":"질문·후보 Document 목록","work":"Cross-Encoder 관련성 점수·재정렬","output":"Top-N Documents","keywords":["Cross-Encoder","Reranker","Top-N"]},{"number":6,"title":"LangChain Integration","short":"프레임워크 연결","subtitle":"Runnable · Pipeline · 파일 역할","description":"어제 만든 RAG에 Rewrite와 Reranker를 연결하고 입력·출력 계약을 관리합니다.","takeaway":"각 노드와 파일은 동일한 개념이 아니며, 모델 호출과 검증 책임을 구분합니다.","location":"RAG Service › 함수·파일 연결","focusLabel":"기존 RAG Chain 확장","input":"History·질문·Retriever","work":"Transform→Retrieve→Rerank→Context","output":"검증 전 답변과 출처 목록","keywords":["Runnable","Pipeline","invoke"]},{"number":7,"title":"Compare & Diagnose","short":"결과 진단","subtitle":"Before/After · Latency","description":"같은 질문과 동일한 후보/필터 조건에서 개선 전후의 검색 결과를 비교합니다.","takeaway":"예시 점수와 실제 측정 수치를 혼동하지 않습니다.","location":"실행 결과 확인 › Evaluation 준비","focusLabel":"비교 조건 고정","input":"기준 질문·정답 문서·실행 기록","work":"순위·후보 포함·실패·시간 기록","output":"비교표·실패 분류","keywords":["Before/After","Coverage","Latency"]},{"number":8,"title":"End-to-End & Agent Bridge","short":"통합·확장","subtitle":"RAG 서비스에서 Agent Tool까지","description":"개선된 검색을 RAG API에 연결하고 실패 조건을 확인합니다.","takeaway":"Retriever의 품질과 답변의 사실성을 별도로 검증해야 합니다.","location":"FastAPI 서비스 › 검증·응답","focusLabel":"개선된 RAG API 경로","input":"사용자 요청·History·검색 조건","work":"Rewrite→Retrieve→Rerank→Generate→Validate","output":"출처 포함 답변 또는 상태·오류","keywords":["FastAPI","Citation","Agent Tool"]}],"scenes":[{"id":"cover","chapter":0,"kind":"cover","title":"LangChain RAG & Reranking"},{"id":"contents","chapter":0,"kind":"contents","title":"목차"},{"id":"d27-overview","chapter":1,"kind":"architecture","title":"전체지도에서 RAG 검색 개선 위치를 찾습니다","claim":"11월 23일에 만든 RAG를 유지한 채, 질문을 검색 전에 정리하고 검색 후 문서 후보를 재정렬합니다.","diagram":"service","sections":[["검색 전: Query Transformation","대화 History에서 생략된 대상과 조건을 복원하고, 필요할 때 검색 질문을 확장합니다. 원래 질문은 따로 보관합니다."],["검색 후: Reranker","Retriever가 반환한 후보만 다시 점수화합니다. 질문·문서 쌍을 평가하고 Context에 넣을 순서를 결정합니다."],["기존 기반: RAG API","E5·PostgreSQL 검색과 LangChain Prompt·Model·출처 검증을 재사용합니다."]],"note":"이번 수업의 경계: 실제 Hybrid 구현이나 상세 평가 지표는 필수 범위가 아닙니다.","systemLocation":true},{"id":"d27-lc-definition","chapter":1,"kind":"concept","title":"LangChain은 무엇이며 왜 사용하나요?","claim":"LangChain은 LLM 애플리케이션에서 Prompt·Model·Retriever·Tool 등의 입력과 출력을 공통 방식으로 연결하는 Python 개발 라이브러리입니다.","left":[["Framework의 역할","일일이 다른 API를 연결하는 코드를 줄이고, 각 단계를 같은 실행 인터페이스(invoke 등)로 조립할 수 있게 돕습니다. 그 자체가 LLM을 학습시키거나 검색을 실행하는 새 모델은 아닙니다."],["기존 수업과 연결","11/19의 문서·E5·PostgreSQL은 그대로 둡니다. 11/23의 Document·Retriever·Prompt·Chat Model에 오늘 Rewrite·Reranker를 끼워 넣습니다."]],"right":[["현업 사용 위치","사내 규정 Q&A, 고객지원 Assistant, 보고서 검색 서비스의 Backend에서 질문·근거 검색·모델 호출을 연결하는 애플리케이션 코드에 사용합니다."],["기억할 구분","FastAPI는 HTTP API, PostgreSQL은 데이터 저장·조회, E5는 Embedding, Cross-Encoder는 문서 점수화, LangChain은 이 구성요소를 호출하고 연결하는 역할입니다."]],"distinction":"작은 단순 함수만 필요한 경우에는 순수 Python이 더 간단할 수 있습니다. LangChain을 쓰는 이유는 복잡해지는 연결을 일관되게 관리하기 위해서입니다.","references":[{"label":"LangChain · Python documentation","url":"https://docs.langchain.com/oss/python/langchain/overview"},{"label":"LangChain · Retrieval and RAG","url":"https://docs.langchain.com/oss/python/langchain/retrieval"}]},{"id":"d27-lc-does-not","chapter":1,"kind":"table","title":"LangChain을 쓰면 누가 실제로 일을 하나요?","claim":"Library와 실제 실행 엔진을 구분해야 코드 오류를 정확히 찾을 수 있습니다.","headers":["기술·객체","실제로 하는 일","LangChain의 관여 범위"],"rows":[["ChatPromptTemplate","질문·Context를 Chat Message 입력으로 구성","템플릿 변수 치환과 Message 객체 생성"],["ChatOpenAI","설정된 Provider의 실제 LLM API를 호출","공통 Chat Model 호출 인터페이스"],["Retriever / E5 + pgvector","E5로 GPU Embedding 생성 후 DB에서 후보 조회","기존 검색 함수를 Runnable로 감싸 전달"],["CrossEncoder","CUDA GPU에서 질문–문서 쌍의 관련성 점수 계산","Python 함수를 RunnableLambda로 연결"],["FastAPI · Validator","HTTP 계약·권한·근거·오류 처리","앱에서 별도 책임으로 유지"]],"note":"Document는 본문과 Metadata를 담는 자료 객체이지 실행 노드가 아닙니다. RunnableLambda는 Python 함수를 감싼 실행 단위입니다.","references":[{"label":"LangChain · Python documentation","url":"https://docs.langchain.com/oss/python/langchain/overview"}]},{"id":"d27-lc-types","chapter":1,"kind":"concept","title":"Document와 Runnable, Prompt와 Model은 어떻게 다를까요?","claim":"LangChain 구성요소는 모두 같은 역할이 아닙니다. 무엇을 담는 객체인지, 실행하면 무엇을 만드는 객체인지부터 구분합니다.","left":[["Document · 데이터 보관","page_content에 청크 본문, metadata에 chunk_id·citation_id·source_locator가 있습니다. Document를 생성해도 검색이나 LLM 호출이 실행되지 않습니다."],["Runnable · 실행 단위","RunnableLambda는 Python 함수를 감싸고, Retriever·Prompt·Chat Model도 공통 invoke 방식으로 사용할 수 있습니다. 각 실행 단계의 입력 타입은 서로 다를 수 있습니다."]],"right":[["ChatPromptTemplate","dict의 question/context를 받아 ChatPromptValue(메시지 묶음)를 만듭니다. Prompt 자체는 모델에게 아직 질문하지 않습니다."],["Chat Model","ChatPromptValue(또는 메시지)를 받아 실제 Provider API에 요청해 AIMessage를 반환합니다. Structured Output은 별도의 파싱·검증이 필요합니다."]],"distinction":"중요: “객체 생성 → |로 연결 → invoke로 실행”은 서로 다른 시점입니다. 연결식만 만들었다고 DB·LLM을 호출한 것이 아닙니다.","references":[{"label":"LangChain · Python documentation","url":"https://docs.langchain.com/oss/python/langchain/overview"}]},{"id":"d27-lc-runnable-first","chapter":1,"kind":"code","title":"RunnableLambda와 | 를 처음부터 실행해 봅니다","claim":"같은 Python 함수도 LangChain의 Runnable 인터페이스로 묶으면 왼쪽 출력이 오른쪽 입력으로 이어집니다.","left":"입력: {\"question\": str} → RunnableLambda의 Python 함수.","right":"출력: 첫 단계 dict → 둘째 단계 str. invoke가 실제 실행 시점.","code":{"lang":"python","title":"langchain_intro.py · 처음 실행하는 Runnable","raw":"from langchain_core.runnables import RunnableLambda\n\ndef clean_question(state: dict) -> dict:\n    # 원 질문을 남기고 검색용 문자열을 별도 필드에 준비합니다.\n    return {**state, \"search_query\": state[\"question\"].strip()}\n\ndef explain_step(state: dict) -> str:\n    # 앞 단계가 만든 필드를 다음 단계에서 읽습니다.\n    return f'Retriever 입력: {state[\"search_query\"]}'\n\nchain = RunnableLambda(clean_question) | RunnableLambda(explain_step)\n# 위 줄까지는 실행 흐름을 만든 것뿐입니다.\nresult = chain.invoke({\"question\": \"  회의실 예약 취소 절차는?  \"})\nprint(result)  # Retriever 입력: 회의실 예약 취소 절차는?","desc":"실행 가능한 최소 예시입니다. langchain-core만 필요하며 이 코드는 LLM API·DB·E5를 호출하지 않습니다.","highlighted":["<span class=\"py-keyword\">from</span> langchain_core.runnables <span class=\"py-keyword\">import</span> RunnableLambda","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">clean_question</span>(state: dict) -&gt; dict:","    <span class=\"py-comment\"># 원 질문을 남기고 검색용 문자열을 별도 필드에 준비합니다.</span>","    <span class=\"py-keyword\">return</span> {**state, <span class=\"py-string\">\"</span><span class=\"py-string\">search_query</span><span class=\"py-string\">\"</span>: state[<span class=\"py-string\">\"</span><span class=\"py-string\">question</span><span class=\"py-string\">\"</span>].strip()}","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">explain_step</span>(state: dict) -&gt; str:","    <span class=\"py-comment\"># 앞 단계가 만든 필드를 다음 단계에서 읽습니다.</span>","    <span class=\"py-keyword\">return</span> <span class=\"py-string\">f</span><span class=\"py-string\">'</span><span class=\"py-string\">Retriever 입력: </span><span class=\"py-string\">{</span>state[<span class=\"py-string\">\"</span><span class=\"py-string\">search_query</span><span class=\"py-string\">\"</span>]<span class=\"py-string\">}</span><span class=\"py-string\">'</span>","","chain = RunnableLambda(clean_question) | RunnableLambda(explain_step)","<span class=\"py-comment\"># 위 줄까지는 실행 흐름을 만든 것뿐입니다.</span>","result = chain.invoke({<span class=\"py-string\">\"</span><span class=\"py-string\">question</span><span class=\"py-string\">\"</span>: <span class=\"py-string\">\"</span><span class=\"py-string\">  회의실 예약 취소 절차는?  </span><span class=\"py-string\">\"</span>})","print(result)  <span class=\"py-comment\"># Retriever 입력: 회의실 예약 취소 절차는?</span>"]},"references":[{"label":"LangChain · Python documentation","url":"https://docs.langchain.com/oss/python/langchain/overview"}],"flowTrace":[{"label":"입력 준비","input":"사용자의 질문 문자열","output":"state = {question: ...}","line":13,"why":"invoke()가 순차 실행을 시작합니다. 이 시점에 입력 dict가 첫 Runnable로 전달됩니다."},{"label":"clean_question","input":"state[\"question\"]","output":"{question, search_query}","line":5,"why":"원 질문을 보존하고 검색용 공백을 제거합니다."},{"label":"explain_step","input":"state[\"search_query\"]","output":"\"Retriever 입력: 회의실 예약 취소 절차는?\"","line":9,"why":"앞 단계가 추가한 search_query를 읽습니다."}],"introTerms":[{"term":"RunnableLambda","meaning":"기존 Python 함수를 LangChain의 Runnable 실행 단위로 감싸는 클래스","use":"직접 만든 검색·전처리 함수를 Chain의 한 단계로 연결할 때 사용"},{"term":"| (LCEL 연결)","meaning":"왼쪽 Runnable의 출력이 오른쪽 Runnable의 입력이 되도록 순서를 연결하는 연산자","use":"Chain을 조립할 때 사용하며, 연결식 작성만으로 함수가 실행되지는 않음"},{"term":"invoke(input)","meaning":"Runnable 또는 Chain에 입력을 주어 실제 처리를 실행하는 메서드","use":"여기서는 Python 함수 실행, Chat Model 단계에서는 API 호출이 일어날 수 있음"}]},{"id":"d27-lc-prompt-value","chapter":1,"kind":"code","title":"Prompt.invoke()와 Chat Model.invoke()는 무엇이 다를까요?","claim":"두 객체 모두 invoke를 쓰지만 반환값과 실제 실행 작업은 전혀 다릅니다.","left":"입력: 질문·Context dict를 Prompt에 전달.","right":"출력: Prompt는 Message 묶음, Model은 AIMessage(실제 API 필요).","code":{"lang":"python","title":"langchain_prompt.py · PromptValue vs AIMessage","raw":"from langchain_core.prompts import ChatPromptTemplate\n\nprompt = ChatPromptTemplate.from_messages([\n    (\"system\", \"제공된 근거로만 답하고 없는 사실은 추정하지 마세요.\"),\n    (\"human\", \"질문: {question}\\n근거: {context}\"),\n])\n# 1) Prompt는 dict를 ChatPromptValue로 변환합니다. API 호출 없음.\nvalue = prompt.invoke({\"question\": \"회의실 취소는?\", \"context\": \"취소는 운영실에 요청\"})\nprint(type(value).__name__)  # ChatPromptValue\nprint([message.type for message in value.messages])  # system, human\n\n# 2) 이전 수업에서 설정한 ChatOpenAI model을 연결합니다.\n# generation_chain = prompt | model\n# answer = generation_chain.invoke({\"question\": \"...\", \"context\": \"...\"})\n# 위 invoke를 실제로 호출할 때 Provider API 요청과 비용이 발생합니다.","desc":"위의 Prompt 생성·호출은 로컬에서 실행됩니다. 아래 주석 처리된 실제 LLM 경로는 준비한 model과 유효한 API Key가 필요합니다.","highlighted":["<span class=\"py-keyword\">from</span> langchain_core.prompts <span class=\"py-keyword\">import</span> ChatPromptTemplate","","prompt = ChatPromptTemplate.from_messages([","    (<span class=\"py-string\">\"</span><span class=\"py-string\">system</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">제공된 근거로만 답하고 없는 사실은 추정하지 마세요.</span><span class=\"py-string\">\"</span>),","    (<span class=\"py-string\">\"</span><span class=\"py-string\">human</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">질문: </span><span class=\"py-string\">{question}</span><span class=\"py-string\">\\n</span><span class=\"py-string\">근거: </span><span class=\"py-string\">{context}</span><span class=\"py-string\">\"</span>),","])","<span class=\"py-comment\"># 1) Prompt는 dict를 ChatPromptValue로 변환합니다. API 호출 없음.</span>","value = prompt.invoke({<span class=\"py-string\">\"</span><span class=\"py-string\">question</span><span class=\"py-string\">\"</span>: <span class=\"py-string\">\"</span><span class=\"py-string\">회의실 취소는?</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">context</span><span class=\"py-string\">\"</span>: <span class=\"py-string\">\"</span><span class=\"py-string\">취소는 운영실에 요청</span><span class=\"py-string\">\"</span>})","print(type(value).__name__)  <span class=\"py-comment\"># ChatPromptValue</span>","print([message.type <span class=\"py-keyword\">for</span> message in value.messages])  <span class=\"py-comment\"># system, human</span>","","<span class=\"py-comment\"># 2) 이전 수업에서 설정한 ChatOpenAI model을 연결합니다.</span>","<span class=\"py-comment\"># generation_chain = prompt | model</span>","<span class=\"py-comment\"># answer = generation_chain.invoke({\"question\": \"...\", \"context\": \"...\"})</span>","<span class=\"py-comment\"># 위 invoke를 실제로 호출할 때 Provider API 요청과 비용이 발생합니다.</span>"]},"references":[{"label":"LangChain · Python documentation","url":"https://docs.langchain.com/oss/python/langchain/overview"}],"introTerms":[{"term":"prompt.invoke(dict)","meaning":"Prompt 템플릿의 {question}·{context}를 채워 ChatPromptValue를 만드는 호출","use":"System/Human 메시지를 준비할 때 사용하며, 이 호출만으로 LLM API는 실행되지 않음"},{"term":"model.invoke(messages)","meaning":"준비한 메시지를 Chat Model에 전달하여 응답을 생성하는 호출","use":"실제 Provider API 호출이 발생하며, 일반적인 Chat Model은 AIMessage를 반환"},{"term":"ChatPromptValue / AIMessage","meaning":"전자는 모델에 전달할 메시지 묶음, 후자는 Chat Model이 반환한 응답 객체","use":"입력과 출력의 자료형이 다르므로 다음 단계에서 읽는 필드도 다름"}]},{"id":"d27-lc-state","chapter":1,"kind":"table","title":"한 질문의 State가 어떻게 이동하는지 추적합니다","claim":"State는 question·search_query·candidate_docs 같은 중간값을 이름별로 보관해 다음 Runnable에 넘기는 dict입니다. 각 단계의 입력과 출력이 맞는지 확인해야 Pipeline이 완성됩니다.","headers":["단계","입력 자료형·예시","다음 단계에 넘기는 출력"],"rows":[["HTTP / Request","question + history + category","원 질문·권한 조건을 가진 state dict"],["Rewrite Chain","history·question → Structured Output","search_query, needs_clarification"],["Retriever","search_query + category → E5(GPU)·pgvector","candidate_docs: list[Document]"],["Reranker","search_query + candidate_docs → Cross-Encoder(GPU)","ranked_docs: list[Document]"],["Context Builder","ranked_docs + length budget","context: str, included_ids: list[int]"],["Prompt | Chat Model","question + context → ChatPromptValue","AIMessage 또는 Structured Output 결과"],["Validation / FastAPI","모델 응답 + 실제 included_ids","검증한 답변과 서버가 연결한 출처"]],"note":"반드시 original question을 보존하고, search_query는 Retriever·Reranker 전용으로 사용합니다. Context에 넣지 않은 문서는 최종 출처로 승인하면 안 됩니다."},{"id":"d27-need","chapter":1,"kind":"concept","title":"왜 검색 결과의 순서가 답변에 영향을 줄까요?","claim":"RAG는 검색된 모든 문서를 무한정 모델에 넣지 않습니다. 후보가 틀리거나 순서가 어긋나면 필요한 근거가 Context에서 빠집니다.","left":[["검색 전에 실패","“그것도 가능해?”처럼 대상이 빠진 질문은 Embedding하기 전에 무엇을 가리키는지 복원해야 합니다."],["검색 후에 실패","정확한 문서가 후보 10개 안에는 있지만 9위라면 Context Top-3에서 빠질 수 있습니다."]],"right":[["어제 만든 RAG","질문 → Dense Retriever → Context(2개) → LLM → 출처 검증"],["오늘 확장","원문 질문 → Rewrite → 검색 후보(예: 10개) → Rerank → Context(예: 3개) → LLM"]],"distinction":"관련 문서가 DB에 존재한다는 사실과 “이번 요청의 Context에 포함된다”는 사실은 다릅니다."},{"id":"d27-failure-types","chapter":1,"kind":"table","title":"검색 실패는 발생 위치에 따라 구분합니다","claim":"같은 답변 실패라도 Query·Candidate·Ranking·Generation 중 무엇이 원인인지 먼저 확인해야 합니다.","headers":["관찰한 현상","문제가 발생한 단계","이번 수업의 대응"],"rows":[["“그거 취소는?”을 검색하니 무관한 자료가 나옴","질문 이해: 대상 생략","Rewrite로 명시적 독립 질문 만들기"],["“신청 취소”로 찾으면 “예약 철회” 문서 누락","검색 표현·용어","Expansion 또는 Multi-query로 표현 넓히기"],["정답 청크가 후보 10개 중 8위","후보 순위","Cross-Encoder로 상위 후보 재정렬"],["현재 문서 대신 과거 버전 검색","Version·Metadata 필터","검색 전후 동일한 최신 버전·권한 조건 적용"],["정답 문서가 후보에 전혀 없음","Candidate Recall","Reranker가 해결할 수 없음: 검색 범위·인덱싱 확인"]],"note":""},{"id":"d27-what-not","chapter":1,"kind":"concept","title":"Rewrite와 Rerank는 문제를 해결하는 위치가 다릅니다","claim":"Query Rewrite는 Retriever 이전, Reranking은 Retriever 이후이자 Context Builder 이전의 작업입니다.","left":[["Query Rewrite","검색에 사용할 질문을 바꿉니다. 올바른 대상을 복원하되 사용자의 의도를 새로 만들어서는 안 됩니다."],["Reranking","검색된 Document 후보의 순서를 바꿉니다. 이미 찾지 못한 문서는 만들 수 없습니다."]],"right":[["비전공자가 기억할 문장","질문이 잘못되면 “찾기 전”에 고치고, 후보 순서가 잘못되면 “찾은 후”에 고칩니다."],["현업 예시","사규 Assistant에서 “그 규정 올해도?”를 독립 질의로 변환한 후, 최신 시행일을 가진 후보를 검색하고 관련성 기준으로 재정렬합니다."]],"distinction":"시행일·열람 권한은 점수 순위만으로 보장되지 않습니다. 검색 범위와 권한 검사는 별도로 적용합니다."},{"id":"d27-baseline-code","chapter":1,"kind":"code","title":"LangChain Runnable로 기존 검색과 새 Reranking의 경계를 찾습니다","claim":"Day26의 Python 검색 함수를 버리지 않고 RunnableLambda로 감싸고, 뒤에 새 Reranker를 연결합니다.","left":"전제: Day26의 search_hits, 이번에 준비할 rerank_hits를 기존 서비스에서 주입합니다.","right":"후보를 유지한 state dict에 ranked_hits가 추가됩니다. 실제 실행은 invoke 시 발생합니다.","code":{"lang":"python","title":"rag_flow.py · 처리 경계","raw":"from langchain_core.runnables import RunnableLambda\n\n# 이미 준비한 Day26 Retriever: state를 받아 Document 후보를 반환합니다.\n# 실제 검색 함수는 E5 + PostgreSQL을 호출하고 Metadata를 보존합니다.\ndef retrieve_step(state):\n    hits = search_hits(state[\"search_query\"], state[\"category\"], k=10)\n    return {**state, \"candidate_hits\": hits}\n\n# 오늘 추가하는 Reranker는 첫 검색 결과만 재정렬합니다.\ndef rerank_step(state):\n    ranked = rerank_hits(state[\"search_query\"], state[\"candidate_hits\"])\n    return {**state, \"ranked_hits\": ranked}\n\n# | 는 실행 순서를 정의합니다. 두 단계는 이 시점에 호출되지 않습니다.\nretrieval_chain = RunnableLambda(retrieve_step) | RunnableLambda(rerank_step)\n# retrieval_chain.invoke({\"search_query\": \"...\", \"category\": \"시설\"})","desc":"함수 이름은 의사 코드가 아닌 호출 계약을 보여 주는 Python입니다. 실제 DB/LLM 없이도 함수는 정의할 수 있습니다.","highlighted":["<span class=\"py-keyword\">from</span> langchain_core.runnables <span class=\"py-keyword\">import</span> RunnableLambda","","<span class=\"py-comment\"># 이미 준비한 Day26 Retriever: state를 받아 Document 후보를 반환합니다.</span>","<span class=\"py-comment\"># 실제 검색 함수는 E5 + PostgreSQL을 호출하고 Metadata를 보존합니다.</span>","<span class=\"py-keyword\">def</span> <span class=\"py-function\">retrieve_step</span>(state):","    hits = search_hits(state[<span class=\"py-string\">\"</span><span class=\"py-string\">search_query</span><span class=\"py-string\">\"</span>], state[<span class=\"py-string\">\"</span><span class=\"py-string\">category</span><span class=\"py-string\">\"</span>], k=<span class=\"py-number\">10</span>)","    <span class=\"py-keyword\">return</span> {**state, <span class=\"py-string\">\"</span><span class=\"py-string\">candidate_hits</span><span class=\"py-string\">\"</span>: hits}","","<span class=\"py-comment\"># 오늘 추가하는 Reranker는 첫 검색 결과만 재정렬합니다.</span>","<span class=\"py-keyword\">def</span> <span class=\"py-function\">rerank_step</span>(state):","    ranked = rerank_hits(state[<span class=\"py-string\">\"</span><span class=\"py-string\">search_query</span><span class=\"py-string\">\"</span>], state[<span class=\"py-string\">\"</span><span class=\"py-string\">candidate_hits</span><span class=\"py-string\">\"</span>])","    <span class=\"py-keyword\">return</span> {**state, <span class=\"py-string\">\"</span><span class=\"py-string\">ranked_hits</span><span class=\"py-string\">\"</span>: ranked}","","<span class=\"py-comment\"># | 는 실행 순서를 정의합니다. 두 단계는 이 시점에 호출되지 않습니다.</span>","retrieval_chain = RunnableLambda(retrieve_step) | RunnableLambda(rerank_step)","<span class=\"py-comment\"># retrieval_chain.invoke({\"search_query\": \"...\", \"category\": \"시설\"})</span>"]}},{"id":"d27-failure-demo","chapter":1,"kind":"demo","title":"시연 · 실패 원인을 선택해 적용 위치를 찾습니다","claim":"상황별 문제 지점을 바꾸면 “언제 무엇을 고칠지”가 달라집니다.","demo":"failure-lab","left":[["질문 문제","대명사와 생략된 대상을 검색 전에 복원해야 하는지 확인합니다."],["후보 문제","원문이 현재 버전·Category 필터로 검색 가능한지 살펴봅니다."]],"right":[["순위 문제","후보에 정답 문서가 있는지 먼저 확인한 뒤 Rerank합니다."],["오류 분류","모델 생성이나 인증 오류는 검색 알고리즘 수정으로 해결되지 않습니다."]],"note":"상황과 진단은 강의용 고정 데이터입니다. 실제 기업 시스템의 측정 결과가 아닙니다."},{"id":"d27-pr1","chapter":1,"kind":"practice","title":"실습 01 · 검색 실패 위치 진단","claim":"기존 LangChain RAG의 단계별 실패 위치를 찾아 표시합니다.","preparation":"전날 RAG의 입력·출력과 이번 Chapter의 실패 사례 4종을 사용합니다.","output":"질문별 문제 단계와 개선 후보를 연결한 짧은 진단표","levels":[{"name":"01_basic · 기본필수","folder":"01_basic","task":"주어진 실패 사례에서 Rewrite·Rerank 중 어느 단계가 필요한지 표시합니다.","result":"최소 두 사례에 대해 이유를 설명"},{"name":"02_intermediate · 응용","folder":"02_intermediate","task":"후보 누락과 순위 오류를 나눠 판단하는 조건을 추가합니다.","result":"문제가 없는 경우와 후보 없음까지 구분"},{"name":"03_advanced · 심화","folder":"03_advanced","task":"필터·권한·버전 문제를 검색 실패와 분리하고 진단 경로를 설계합니다.","result":"후보·필터·근거 기록을 포함"}],"criterion":"검색 전/후/생성 단계 중 문제가 생긴 지점과 개선 방법을 수강생이 설명할 수 있습니다.","caution":"정답 문서가 후보 밖에 있으면 Reranker가 해결한다는 답은 잘못입니다."},{"id":"d27-q1","chapter":1,"kind":"quiz","title":"이해 확인 · 검색 개선의 위치","claim":"검색 실패의 위치부터 정확하게 찾을 수 있는지 확인합니다.","items":[["질문 “그거는 어떻게 해?”가 부정확하면 가장 먼저 어느 단계의 문제인가요?","Retriever 이전의 질문 이해 문제입니다. 관련 History가 있을 때만 빠진 대상을 복원합니다."],["정답 문서가 검색 후보 목록에 없을 때 Reranking만 추가하면 찾을 수 있나요?","아니요. Reranker는 주어진 후보만 다시 평가합니다. 검색 조건·확장·Indexing을 확인해야 합니다."],["문서가 최신인지 Cross-Encoder 점수만으로 판단하면 될까요?","아니요. 최신성·접근 권한은 Metadata/업무 규칙으로 검증해야 합니다."]]},{"id":"d27-rewrite-definition","chapter":2,"kind":"concept","title":"Query Rewrite는 무엇을 어떻게 다시 쓰는 기술일까요?","claim":"Query Rewrite는 사용자의 의도를 유지하면서 검색에 적합하도록 질문을 재구성하는 과정입니다.","left":[["대화의 생략","“그것도 가능해?”에는 대상이 없습니다. 직전 대화에서 확실히 확인한 “회의실 예약 취소”를 검색 질문에 복원합니다."],["Standalone Query","이전 대화를 모르는 Retriever도 이해할 수 있는 독립 문장입니다. 질문에 원래 없던 권한·기간·숫자를 추가하지 않습니다."]],"right":[["입력","이전 대화: “회의실 예약 방법을 알려줘.” / 현재 질문: “그럼 취소는?”"],["출력","“교육센터 회의실 예약을 취소하는 방법은 무엇인가?”"]],"distinction":"Standalone Query는 검색용 변환 입력이며 사용자가 보낸 원래 질문과 대화 기록은 별도로 남깁니다."},{"id":"d27-history-cases","chapter":2,"kind":"table","title":"후속 질문에서 무엇을 복원해야 할까요?","claim":"대명사뿐 아니라 대상·기간·조건 등 검색에 필요한 제약이 생략될 수 있습니다.","headers":["History + 현재 질문","검색용 Standalone Query","주의점"],"rows":[["“과제 파일은 어디에?” → “그럼 언제까지?”","“과제 파일의 제출 마감일은 언제인가?”","문서에 없는 날짜를 새로 만들지 않음"],["“시설 이용 신청 절차?” → “취소도 되나?”","“시설 이용 신청을 취소할 수 있는가?”","절차와 취소 여부는 다른 요구"],["“출석 지각 기준은?” → “올해도 똑같아?”","“올해 적용되는 출석 지각 기준은 무엇인가?”","올해 문서가 없으면 답을 유추하지 않음"],["History가 없음 → “그거 바꿔줘”","추가 확인 필요","지칭 대상이 없으면 상상으로 보완하지 않음"]],"note":""},{"id":"d27-rewrite-rule","chapter":2,"kind":"code","title":"먼저 Rewrite의 성공 기준을 함수로 확인합니다","claim":"모델을 사용하기 전에도 공백·History 범위·원래 질문 보존 같은 계약을 정의할 수 있습니다.","left":"입력: 최근 대화 메시지 목록과 사용자가 보낸 질문.","right":"출력: rewrite 모델에 전달할 history/question dict.","code":{"lang":"python","title":"query_input.py · 원래 질문과 History","raw":"def build_rewrite_input(history: list[dict], question: str) -> dict:\n    # 비어 있는 질문은 검색에 보내지 않습니다.\n    if not question.strip():\n        raise ValueError(\"question is empty\")\n    # 대화 전체가 아니라 최근 필요한 부분을 사용합니다.\n    recent = history[-6:]\n    return {\"history\": recent, \"question\": question}\n\nrequest = build_rewrite_input(\n    [{\"role\": \"user\", \"content\": \"회의실 예약 방법은?\"}],\n    \"그럼 취소는?\",\n)\nprint(request[\"question\"])  # 원래 질문은 그대로 보존","desc":"학습용 코드입니다. 실제 모델·DB가 필요한 부분은 환경 준비 후 실행하고, 코드 복사 시 설명 주석도 함께 복사됩니다.","highlighted":["<span class=\"py-keyword\">def</span> <span class=\"py-function\">build_rewrite_input</span>(history: list[dict], question: str) -&gt; dict:","    <span class=\"py-comment\"># 비어 있는 질문은 검색에 보내지 않습니다.</span>","    <span class=\"py-keyword\">if</span> not question.strip():","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">\"</span><span class=\"py-string\">question is empty</span><span class=\"py-string\">\"</span>)","    <span class=\"py-comment\"># 대화 전체가 아니라 최근 필요한 부분을 사용합니다.</span>","    recent = history[-<span class=\"py-number\">6</span>:]","    <span class=\"py-keyword\">return</span> {<span class=\"py-string\">\"</span><span class=\"py-string\">history</span><span class=\"py-string\">\"</span>: recent, <span class=\"py-string\">\"</span><span class=\"py-string\">question</span><span class=\"py-string\">\"</span>: question}","","request = build_rewrite_input(","    [{<span class=\"py-string\">\"</span><span class=\"py-string\">role</span><span class=\"py-string\">\"</span>: <span class=\"py-string\">\"</span><span class=\"py-string\">user</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">content</span><span class=\"py-string\">\"</span>: <span class=\"py-string\">\"</span><span class=\"py-string\">회의실 예약 방법은?</span><span class=\"py-string\">\"</span>}],","    <span class=\"py-string\">\"</span><span class=\"py-string\">그럼 취소는?</span><span class=\"py-string\">\"</span>,",")","print(request[<span class=\"py-string\">\"</span><span class=\"py-string\">question</span><span class=\"py-string\">\"</span>])  <span class=\"py-comment\"># 원래 질문은 그대로 보존</span>"]}},{"id":"d27-rewrite-constraints","chapter":2,"kind":"concept","title":"Query Rewrite가 변경해서는 안 되는 것","claim":"좋은 Rewrite는 표현을 바꾸더라도 대상, 의도, 시간, 부정 표현, 권한 범위를 보존합니다.","left":[["조건을 그대로","“2026년 11월 규정”을 “최신 규정”으로 바꾸면 날짜 제한이 사라집니다. “취소 불가”를 “취소 가능”으로 뒤집으면 질문이 바뀝니다."],["모호하면 질문","History만으로 대상이나 기간을 확인할 수 없다면 Rewrite 실패를 기록하거나 사용자에게 한 번 더 확인합니다."]],"right":[["정상 예시","“그 예약 취소는?” → “앞서 언급한 회의실 예약을 취소하는 절차는?”"],["잘못된 예시","“예약 취소는?” → “회의실 예약은 수수료 없이 언제든 취소 가능한가?” (없는 조건 추가)"]],"distinction":"Rewrite는 사용자 권한을 확장하지 않습니다. 검색 필터는 Rewrite 뒤에도 별도로 유지합니다."},{"id":"d27-rewrite-langchain","chapter":2,"kind":"code","title":"LangChain으로 독립 질문 생성을 요청하는 구조","claim":"ChatPromptTemplate는 History와 질문으로 입력을 구성하고, Structured Output으로 검색용 문장을 받습니다.","left":"전제: 이미 설정한 ChatOpenAI model, history_text, user_question이 필요합니다.","right":"반환: SearchQuery(standalone_query, needs_clarification).","code":{"lang":"python","title":"query_rewrite.py · Prompt와 Structured Output","raw":"from pydantic import BaseModel, Field\nfrom langchain_core.prompts import ChatPromptTemplate\n\nclass SearchQuery(BaseModel):\n    standalone_query: str = Field(description=\"의미를 보존한 검색 질문\")\n    needs_clarification: bool = Field(description=\"대화로 대상을 확정할 수 없으면 True\")\n\nrewrite_prompt = ChatPromptTemplate.from_messages([\n    (\"system\", \"최근 대화에 근거해 검색 가능한 독립 질문을 만드세요. \"\n               \"없는 날짜·조건을 추가하지 말고 모호하면 확인이 필요하다고 표시하세요.\"),\n    (\"human\", \"History:\\n{history}\\n\\n현재 질문:\\n{question}\"),\n])\n# model은 기존 ChatOpenAI 객체. 실제 API 호출은 invoke 때 발생합니다.\nrewrite_chain = rewrite_prompt | model.with_structured_output(SearchQuery)\nresult = rewrite_chain.invoke({\"history\": history_text, \"question\": user_question})","desc":"후반 3줄은 기존 Day26 앱에서 model과 History 변수를 준비한 뒤 사용합니다. 모델 호출에 API Key와 사용량 비용이 발생할 수 있습니다.","highlighted":["<span class=\"py-keyword\">from</span> pydantic <span class=\"py-keyword\">import</span> BaseModel, Field","<span class=\"py-keyword\">from</span> langchain_core.prompts <span class=\"py-keyword\">import</span> ChatPromptTemplate","","<span class=\"py-keyword\">class</span> <span class=\"py-type\">SearchQuery</span>(BaseModel):","    standalone_query: str = Field(description=<span class=\"py-string\">\"</span><span class=\"py-string\">의미를 보존한 검색 질문</span><span class=\"py-string\">\"</span>)","    needs_clarification: bool = Field(description=<span class=\"py-string\">\"</span><span class=\"py-string\">대화로 대상을 확정할 수 없으면 True</span><span class=\"py-string\">\"</span>)","","rewrite_prompt = ChatPromptTemplate.from_messages([","    (<span class=\"py-string\">\"</span><span class=\"py-string\">system</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">최근 대화에 근거해 검색 가능한 독립 질문을 만드세요. </span><span class=\"py-string\">\"</span>","               <span class=\"py-string\">\"</span><span class=\"py-string\">없는 날짜·조건을 추가하지 말고 모호하면 확인이 필요하다고 표시하세요.</span><span class=\"py-string\">\"</span>),","    (<span class=\"py-string\">\"</span><span class=\"py-string\">human</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">History:</span><span class=\"py-string\">\\n</span><span class=\"py-string\">{history}</span><span class=\"py-string\">\\n</span><span class=\"py-string\">\\n</span><span class=\"py-string\">현재 질문:</span><span class=\"py-string\">\\n</span><span class=\"py-string\">{question}</span><span class=\"py-string\">\"</span>),","])","<span class=\"py-comment\"># model은 기존 ChatOpenAI 객체. 실제 API 호출은 invoke 때 발생합니다.</span>","rewrite_chain = rewrite_prompt | model.with_structured_output(SearchQuery)","result = rewrite_chain.invoke({<span class=\"py-string\">\"</span><span class=\"py-string\">history</span><span class=\"py-string\">\"</span>: history_text, <span class=\"py-string\">\"</span><span class=\"py-string\">question</span><span class=\"py-string\">\"</span>: user_question})"]},"references":[{"label":"LangChain · Python documentation","url":"https://docs.langchain.com/oss/python/langchain/overview"}],"flowTrace":[{"label":"Prompt 정의","input":"System·Human 지시 템플릿","output":"ChatPromptTemplate","line":8,"why":"변수 위치를 정할 뿐, 이 단계에서 모델 API를 호출하지 않습니다."},{"label":"Chain 실행","input":"history_text + user_question","output":"Prompt 메시지 → 모델 입력","line":15,"why":"invoke()가 Prompt 구성과 모델 호출을 순서대로 실행합니다. 이 줄의 최종 반환값은 SearchQuery입니다."},{"label":"모델 출력","input":"ChatPromptValue","output":"SearchQuery 객체","line":14,"why":"LLM은 Structured Output 계약으로 독립 질문과 확인 필요 여부를 반환합니다."}],"introTerms":[{"term":"BaseModel · Field","meaning":"Pydantic으로 반환받을 데이터의 필드·자료형·설명을 정의하는 도구","use":"standalone_query와 needs_clarification 두 값을 갖는 SearchQuery 계약 작성"},{"term":"with_structured_output()","meaning":"모델의 반환 형태를 지정한 Schema에 맞추도록 구성하는 메서드","use":"Rewrite 결과를 일반 문장이 아닌 SearchQuery 객체로 받아 후속 분기에 사용"}]},{"id":"d27-rewrite-evaluation","chapter":2,"kind":"table","title":"Rewrite 결과는 무엇을 확인해야 할까요?","claim":"문장 자체가 자연스럽다는 사실보다, 실제 질문의 의미와 검색 결과가 맞는지가 중요합니다.","headers":["확인할 항목","성공 조건","실패 신호"],"rows":[["대상 복원","직전 대화로 확인한 대상이 포함","과제 질문인데 출석 문서로 변경"],["조건 보존","기간·숫자·부정이 유지","2025년 질문을 2026년으로 변경"],["확인 필요 여부","모호할 때 확인 요청","History가 없는데 특정 예약으로 단정"],["검색 결과","정답 후보를 찾는지 별도 확인","Rewrite가 그럴듯해도 엉뚱한 문서 반환"]],"note":"Rewrite 자체의 검사는 “답변을 평가하는 것”과 다릅니다. 답변 생성은 기존 RAG의 후속 단계입니다."},{"id":"d27-preserve-questions","chapter":2,"kind":"code","title":"검색용 질문과 답변용 질문을 구분합니다","claim":"Reranker와 검색에는 독립 질문을 사용하되 최종 답변이 현재 사용자 요청에서 벗어나지 않도록 만듭니다.","left":"입력: 원 질문·독립 질문·모호성 여부.","right":"출력: ready 시 original/search_query 모두 보존.","code":{"lang":"python","title":"query_plan.py · original vs search_query","raw":"def plan_question(original_question: str, rewritten: str, clarify: bool):\n    # 검색할 수 없는 모호한 질문은 요청을 멈춥니다.\n    if clarify or not rewritten.strip():\n        return {\"status\": \"needs_clarification\", \"original\": original_question}\n    return {\n        \"status\": \"ready\",\n        \"original\": original_question,  # 최종 사용자 질문\n        \"search_query\": rewritten,        # Retriever와 Reranker에 전달\n    }\n\nplan = plan_question(\"그럼 취소는?\", \"회의실 예약 취소 방법은?\", False)\nprint(plan[\"original\"], plan[\"search_query\"])","desc":"학습용 코드입니다. 실제 모델·DB가 필요한 부분은 환경 준비 후 실행하고, 코드 복사 시 설명 주석도 함께 복사됩니다.","highlighted":["<span class=\"py-keyword\">def</span> <span class=\"py-function\">plan_question</span>(original_question: str, rewritten: str, clarify: bool):","    <span class=\"py-comment\"># 검색할 수 없는 모호한 질문은 요청을 멈춥니다.</span>","    <span class=\"py-keyword\">if</span> clarify or not rewritten.strip():","        <span class=\"py-keyword\">return</span> {<span class=\"py-string\">\"</span><span class=\"py-string\">status</span><span class=\"py-string\">\"</span>: <span class=\"py-string\">\"</span><span class=\"py-string\">needs_clarification</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">original</span><span class=\"py-string\">\"</span>: original_question}","    <span class=\"py-keyword\">return</span> {","        <span class=\"py-string\">\"</span><span class=\"py-string\">status</span><span class=\"py-string\">\"</span>: <span class=\"py-string\">\"</span><span class=\"py-string\">ready</span><span class=\"py-string\">\"</span>,","        <span class=\"py-string\">\"</span><span class=\"py-string\">original</span><span class=\"py-string\">\"</span>: original_question,  <span class=\"py-comment\"># 최종 사용자 질문</span>","        <span class=\"py-string\">\"</span><span class=\"py-string\">search_query</span><span class=\"py-string\">\"</span>: rewritten,        <span class=\"py-comment\"># Retriever와 Reranker에 전달</span>","    }","","plan = plan_question(<span class=\"py-string\">\"</span><span class=\"py-string\">그럼 취소는?</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">회의실 예약 취소 방법은?</span><span class=\"py-string\">\"</span>, <span class=\"py-keyword\">False</span>)","print(plan[<span class=\"py-string\">\"</span><span class=\"py-string\">original</span><span class=\"py-string\">\"</span>], plan[<span class=\"py-string\">\"</span><span class=\"py-string\">search_query</span><span class=\"py-string\">\"</span>])"]}},{"id":"d27-rewrite-demo","chapter":2,"kind":"demo","title":"시연 · 대화 내용에 따라 독립 질문을 선택합니다","claim":"History·원 질문을 바꾸고 복원된 대상과 보존한 조건을 비교합니다.","demo":"rewrite-lab","left":[["대화가 있는 경우","모델 없이 준비된 예시 Rewrite를 보여 줍니다."],["대화가 없는 경우","임의로 대상을 만들지 않고 확인 필요를 표시합니다."]],"right":[["의미 보존","기존 날짜·부정·Category 조건이 바뀌지 않았는지 봅니다."],["다음 단계","선택한 검색용 질문이 Retriever에 전달됩니다."]],"note":"Rewrite 결과는 사전에 작성한 예시이며 이 HTML은 LLM API를 호출하지 않습니다."},{"id":"d27-pr2","chapter":2,"kind":"practice","title":"실습 02 · 대화 후속 질문의 독립 질의 변환","claim":"ChatPromptTemplate | Chat Model을 사용한 Rewrite Chain에서 결과와 상태를 확인합니다.","preparation":"대화 History 4개와 ChatPromptTemplate·SearchQuery 코드 골격을 사용합니다.","output":"원 질문·검색용 질문·확인 필요 여부의 비교표","levels":[{"name":"01_basic · 기본필수","folder":"01_basic","task":"예시 History에서 대명사를 복원하는 TODO를 완성합니다.","result":"정확한 대상과 원 질문이 보존됨"},{"name":"02_intermediate · 응용","folder":"02_intermediate","task":"날짜·부정 표현 보존 검사와 모호한 History 분기를 추가합니다.","result":"의미가 바뀌는 Rewrite를 거절"},{"name":"03_advanced · 심화","folder":"03_advanced","task":"Structured Output 파싱과 재확인 분기, 실행 기록을 더합니다.","result":"정상·모호·모델 오류를 분리"}],"criterion":"모든 결과에서 original과 search_query를 분리해 기록하고, 추정한 사실을 새로 넣지 않습니다.","caution":"비전공자에게는 학습용 예시를 먼저 제공하며 실제 API 호출의 결과는 별도로 표시합니다."},{"id":"d27-q2","chapter":2,"kind":"quiz","title":"이해 확인 · Rewrite의 경계","claim":"독립 질문 생성과 원래 의도 보존을 구분합니다.","items":[["“그건 언제까지야?”를 맥락 없이 “회의실 예약 마감은?”이라고 바꾸면 괜찮을까요?","아니요. 앞선 맥락으로 대상을 확정할 수 없으면 확인이 필요합니다."],["Rewrite를 했으면 사용자 질문 원문을 삭제해도 되나요?","아닙니다. 원문 질문·History·검색용 질문을 나눠 보관해야 생성·감사·오류 확인에 도움이 됩니다."],["사용자가 지정한 2025년 기간을 최신이라는 단어로 바꿔도 될까요?","안 됩니다. 원래 기간의 의미를 유지해야 합니다."]]},{"id":"d27-expansion-definition","chapter":3,"kind":"concept","title":"Query Expansion은 단어를 더 넣는 기술일까요?","claim":"Query Expansion은 질문의 목적을 유지하면서 검색에 도움이 되는 관련 표현이나 용어를 추가하는 방법입니다.","left":[["예시: 같은 업무의 다른 표현","“회의실 예약 취소”를 “회의실 예약 철회”, “예약 취소 절차”와 함께 검색하면 다른 표현의 문서도 후보로 찾을 수 있습니다."],["무조건 확장하지 않기","원래 질문에 없는 환불률·신청 자격을 추가하면 전혀 다른 문서를 찾게 됩니다. 질문이 명확할 때는 그대로 검색하는 것도 합리적입니다."]],"right":[["현업 예시","사내 약어 OOO의 정식 명칭, 현업 팀이 쓰는 줄임말, 제품 코드의 공식 제품명"],["실제 연결","원문 질문과 확장된 검색어를 각각 검색해 후보 목록을 더한 뒤 중복을 제거합니다."]],"distinction":"Expansion은 단지 더 긴 질문을 만드는 일이 아닙니다. 목적과 의미가 맞는 후보를 넓히는 방법입니다."},{"id":"d27-three-transformations","chapter":3,"kind":"table","title":"Rewrite·Expansion·Multi-query의 차이를 한눈에 비교합니다","claim":"이름이 비슷해도 입력을 바꾸는 방법과 실행되는 검색 횟수가 다릅니다.","headers":["방식","입력과 변환","검색에 사용하는 결과"],"rows":[["Rewrite","“그거 취소는?” + 회의실 대화 → “회의실 예약 취소 방법?”","독립 질의 1개"],["Expansion","“예약 취소 방법?” → “예약 취소·철회·해지 절차”","관련 용어를 보강한 질의"],["Multi-query","“예약 취소 방법?” → 취소 절차 / 예약 철회 / 취소 가능 기간","다른 표현의 질의 여러 개"],["변경하지 않음","“회의실 예약 승인 필요?” → 동일 질문","충분히 명확하다면 원문 그대로"]],"note":"Multi-query는 Expansion의 결과를 여러 번 검색에 활용할 수 있지만, 둘은 동일한 개념으로 취급하지 않습니다."},{"id":"d27-query-variants","chapter":3,"kind":"code","title":"질문 후보 목록을 만들 때 원문을 반드시 포함합니다","claim":"여러 질문을 생성하더라도 검색할 내용의 의미·개수·중복을 관리해야 합니다.","left":"입력: 원래 Standalone Query, 관련 표현 후보, 개수 상한.","right":"출력: 중복 없는 검색용 질의 목록.","code":{"lang":"python","title":"queries.py · 질문 목록·중복 제한","raw":"def prepare_queries(original: str, variants: list[str], limit: int = 3):\n    # 원문을 첫 번째 검색 입력으로 보존합니다.\n    if not original.strip() or limit < 1:\n        raise ValueError(\"invalid query or limit\")\n    unique = []\n    for query in [original, *variants]:\n        normalized = query.strip()\n        # 동일 문장을 여러 번 검색하지 않습니다.\n        if normalized and normalized not in unique:\n            unique.append(normalized)\n        if len(unique) >= limit:\n            break\n    return unique\n\nqueries = prepare_queries(\"회의실 예약 취소 방법?\", [\"회의실 예약 철회 절차?\", \"예약 취소 방법?\"])\nprint(queries)","desc":"학습용 코드입니다. 실제 모델·DB가 필요한 부분은 환경 준비 후 실행하고, 코드 복사 시 설명 주석도 함께 복사됩니다.","highlighted":["<span class=\"py-keyword\">def</span> <span class=\"py-function\">prepare_queries</span>(original: str, variants: list[str], limit: int = <span class=\"py-number\">3</span>):","    <span class=\"py-comment\"># 원문을 첫 번째 검색 입력으로 보존합니다.</span>","    <span class=\"py-keyword\">if</span> not original.strip() or limit &lt; <span class=\"py-number\">1</span>:","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">\"</span><span class=\"py-string\">invalid query or limit</span><span class=\"py-string\">\"</span>)","    unique = []","    <span class=\"py-keyword\">for</span> query in [original, *variants]:","        normalized = query.strip()","        <span class=\"py-comment\"># 동일 문장을 여러 번 검색하지 않습니다.</span>","        <span class=\"py-keyword\">if</span> normalized and normalized not in unique:","            unique.append(normalized)","        <span class=\"py-keyword\">if</span> len(unique) &gt;= limit:","            <span class=\"py-keyword\">break</span>","    <span class=\"py-keyword\">return</span> unique","","queries = prepare_queries(<span class=\"py-string\">\"</span><span class=\"py-string\">회의실 예약 취소 방법?</span><span class=\"py-string\">\"</span>, [<span class=\"py-string\">\"</span><span class=\"py-string\">회의실 예약 철회 절차?</span><span class=\"py-string\">\"</span>, <span class=\"py-string\">\"</span><span class=\"py-string\">예약 취소 방법?</span><span class=\"py-string\">\"</span>])","print(queries)"]}},{"id":"d27-multi-query-search","chapter":3,"kind":"concept","title":"Multi-query는 여러 번 검색한 문서를 합치는 전략입니다","claim":"Multi-query는 서로 다른 표현의 질문으로 Retriever를 반복 호출하고 후보 문서 목록을 결합합니다.","left":[["검색 결과는 겹칩니다","질의 A에서 청크 C1·C2를, 질의 B에서 C2·C3을 찾으면 후보는 C1·C2·C3입니다. 같은 청크를 두 번 Context에 넣을 이유가 없습니다."],["같은 필터를 써야 합니다","질의마다 Category·권한·현재 Version 조건이 달라지면 서로 다른 데이터 집합을 비교하게 됩니다. 원래 요청의 정책을 재사용합니다."]],"right":[["입력 질의","Q1: 예약 취소 방법 / Q2: 예약 철회 절차 / Q3: 취소 가능 기간"],["출력 후보","Q1 → C1,C2 / Q2 → C2,C3 / Q3 → C1,C4 → C1,C2,C3,C4"]],"distinction":"같은 chunk_id를 가진 후보는 하나로 합치되, 어느 질의에서 찾았는지는 실행 기록으로 남길 수 있습니다."},{"id":"d27-multi-retrieve","chapter":3,"kind":"code","title":"Multi-query 후보 통합을 LangChain Runnable로 연결합니다","claim":"한 요청의 필터는 동일하게 두고, 질의별 검색 결과에서 같은 chunk_id를 한 건으로 병합합니다.","left":"입력: search_queries, category가 담긴 state와 기존 search_hits 함수.","right":"출력: candidate_hits·candidate_docs·found_by_query를 추가한 state dict. 원 질문 유지.","code":{"lang":"python","title":"multi_query.py · 후보 병합","raw":"from langchain_core.runnables import RunnableLambda\nfrom coursekit.checkpoints import hits_to_documents\n\ndef search_queries_step(state: dict) -> dict:\n    # 공통 Category·Version·권한 조건은 모든 검색에 동일하게 적용합니다.\n    merged, found_by = {}, {}\n    for query in state[\"search_queries\"]:\n        for hit in search_hits(query, state[\"category\"], k=5):\n            key = hit[\"chunk_id\"]\n            merged.setdefault(key, hit)  # 기존 본문·출처 유지\n            found_by.setdefault(key, []).append(query)\n    hits = list(merged.values())\n    return {**state, \"candidate_hits\": hits,\n            \"candidate_docs\": hits_to_documents(hits),\n            \"found_by_query\": found_by}\n\nmulti_query_stage = RunnableLambda(search_queries_step)\n# 실제 DB 검색은 multi_query_stage.invoke(state) 실행 시 발생합니다.","desc":"실제 retrieval 함수 구현과 호출 횟수 제한은 실습 파일에서 준비합니다. 단순 리스트 병합은 검색 점수의 범용 융합을 뜻하지 않습니다.","highlighted":["<span class=\"py-keyword\">from</span> langchain_core.runnables <span class=\"py-keyword\">import</span> RunnableLambda","<span class=\"py-keyword\">from</span> coursekit.checkpoints <span class=\"py-keyword\">import</span> hits_to_documents","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">search_queries_step</span>(state: dict) -&gt; dict:","    <span class=\"py-comment\"># 공통 Category·Version·권한 조건은 모든 검색에 동일하게 적용합니다.</span>","    merged, found_by = {}, {}","    <span class=\"py-keyword\">for</span> query in state[<span class=\"py-string\">\"</span><span class=\"py-string\">search_queries</span><span class=\"py-string\">\"</span>]:","        <span class=\"py-keyword\">for</span> hit in search_hits(query, state[<span class=\"py-string\">\"</span><span class=\"py-string\">category</span><span class=\"py-string\">\"</span>], k=<span class=\"py-number\">5</span>):","            key = hit[<span class=\"py-string\">\"</span><span class=\"py-string\">chunk_id</span><span class=\"py-string\">\"</span>]","            merged.setdefault(key, hit)  <span class=\"py-comment\"># 기존 본문·출처 유지</span>","            found_by.setdefault(key, []).append(query)","    hits = list(merged.values())","    <span class=\"py-keyword\">return</span> {**state, <span class=\"py-string\">\"</span><span class=\"py-string\">candidate_hits</span><span class=\"py-string\">\"</span>: hits,","            <span class=\"py-string\">\"</span><span class=\"py-string\">candidate_docs</span><span class=\"py-string\">\"</span>: hits_to_documents(hits),","            <span class=\"py-string\">\"</span><span class=\"py-string\">found_by_query</span><span class=\"py-string\">\"</span>: found_by}","","multi_query_stage = RunnableLambda(search_queries_step)","<span class=\"py-comment\"># 실제 DB 검색은 multi_query_stage.invoke(state) 실행 시 발생합니다.</span>"]},"flowTrace":[{"label":"질문 목록","input":"state[\"search_queries\"]","output":"검색용 질문 N개","line":7,"why":"각 변형 질문을 순서대로 검색합니다."},{"label":"후보 수집","input":"query + 공통 Category","output":"검색 Hit 목록","line":8,"why":"모든 질의에 같은 검색 범위를 적용합니다."},{"label":"중복 제거","input":"hit[\"chunk_id\"]","output":"chunk_id별 1개 Hit","line":10,"why":"같은 청크를 여러 번 넣지 않고 어떤 질의에서 찾았는지는 별도로 기록합니다."},{"label":"Document 반환","input":"Hit 목록","output":"candidate_docs + found_by_query","line":14,"why":"원문·출처 Metadata를 Document로 넘깁니다."}]},{"id":"d27-multi-query-cost","chapter":3,"kind":"table","title":"질문을 더 많이 만들면 무엇이 늘어날까요?","claim":"후보 범위가 넓어질 수 있지만 동일한 검색을 여러 번 수행할 때 비용과 오류 지점이 늘어납니다.","headers":["관찰 지점","장점","주의할 점"],"rows":[["후보 수","원문 하나로 찾지 못한 문서가 추가될 수 있음","같은 문서를 여러 번 받아 중복 제거 필요"],["Latency","표현 차이로 누락된 자료 확보 가능","순차 검색이면 호출 수에 따라 시간 증가"],["LLM 비용","Rewrite·질의 생성 품질을 높일 수 있음","별도 모델 호출에는 Token·비용 발생"],["품질","다른 표현에서 관련 근거 확보 가능","의미가 바뀐 질의는 오답 후보를 확대"],["정책","기존 검색 필터를 재사용 가능","모든 검색에 같은 권한·버전 조건 강제"]],"note":"실습에서는 우선 질의 2~3개를 비교하고, 실제 서비스에서는 제한·병렬성·시간 제한을 따로 설계합니다."},{"id":"d27-multi-demo","chapter":3,"kind":"demo","title":"시연 · 질의 수를 바꾸며 후보 합집합을 확인합니다","claim":"Multi-query의 검색 결과가 실제로 얼마나 늘고, 무엇이 중복되는지 관찰합니다.","demo":"multi-lab","left":[["질의마다 후보","동일한 청크가 서로 다른 질문에서 반환될 수 있습니다."],["중복 제거","chunk_id를 기준으로 고유 후보 개수를 계산합니다."]],"right":[["다음 처리","후보를 많이 찾았다는 이유만으로 모두 Context에 넣지 않습니다."],["부작용","무관한 표현을 추가하면 검색이 늘어도 근거 품질은 나빠질 수 있습니다."]],"note":"질의별 결과는 학습용 순위 사례입니다. 실제 Embedding 검색이나 모델 출력이 아닙니다."},{"id":"d27-pr3","chapter":3,"kind":"practice","title":"실습 03 · Query Expansion과 Multi-query 후보 통합","claim":"Multi-query 검색을 RunnableLambda로 감싸 후보 병합과 중복을 확인합니다.","preparation":"제공 질문 3개, 질의 후보와 기존 search_hits 계약을 이용합니다.","output":"질의 목록·질의별 후보 ID·중복 제거 후 후보 ID 비교표","levels":[{"name":"01_basic · 기본필수","folder":"01_basic","task":"기본질문과 확장 질문을 2개 준비하고 후보 목록을 합칩니다.","result":"원문 질문 포함·중복 청크 제거"},{"name":"02_intermediate · 응용","folder":"02_intermediate","task":"질의 3개와 found_by 기록을 추가하고 무관한 질문을 제외합니다.","result":"후보 출처와 호출 개수 확인"},{"name":"03_advanced · 심화","folder":"03_advanced","task":"질의별 오류·중복·필터 일치와 검색 개수 상한을 검증합니다.","result":"부분 검색 실패와 잘못된 확장 진단"}],"criterion":"질문별 반환 후보와 unique chunk_id가 계산되고, 같은 요청의 검색 필터가 유지됩니다.","caution":"질문을 여러 개 만들었다고 곧바로 “검색 정확도 향상”이라고 결론 내리지 않습니다."},{"id":"d27-q3","chapter":3,"kind":"quiz","title":"이해 확인 · Multi-query 결과","claim":"검색 횟수와 후보 수, 최종 근거의 차이를 설명합니다.","items":[["질의 Q1에서 C1,C2, Q2에서 C2,C3이 나왔다면 고유 후보는 몇 개인가요?","세 개입니다. chunk_id가 같은 C2는 한 건으로 합칩니다."],["Query Expansion은 관련없는 문장을 많이 넣을수록 좋을까요?","아닙니다. 원 질문의 의미를 보존하고 탐색 비용·노이즈를 고려해야 합니다."],["질의마다 권한 필터를 달리 적용해도 될까요?","안 됩니다. 원 요청의 허용 범위와 버전 규칙을 모든 검색 경로에서 동일하게 적용해야 합니다."]]},{"id":"d27-candidates-definition","chapter":4,"kind":"concept","title":"Candidate Retrieval은 왜 Reranking 이전의 별도 단계인가요?","claim":"Candidate Retrieval은 큰 문서 집합에서 일부 관련 문서를 빠르게 찾아 Reranker에 전달할 후보를 준비하는 단계입니다.","left":[["Candidate-k","첫 검색에서 가져오는 후보 개수입니다. 예를 들어 10개 후보를 찾고 Cross-Encoder가 모두 평가하도록 할 수 있습니다."],["Context-k / Top-N","Reranking 후 최종적으로 Context에 넣는 문서 개수입니다. 후보 10개를 전부 입력하지 않고 3개만 선택할 수 있습니다."]],"right":[["후보의 상한","Retriever가 문서 C9를 반환하지 않았다면 Reranker는 C9를 새로 만들지 않습니다."],["현업 설계","전체 문서 수가 수만 건이라도 후보는 작은 Top-k로 좁히고 정밀 계산에 투입합니다."]],"distinction":"Candidate-k를 높이는 선택은 Recall 가능성과 Latency 부담 모두에 영향을 줍니다."},{"id":"d27-e5-contract","chapter":4,"kind":"table","title":"기존 E5·pgvector 검색 계약을 그대로 지킵니다","claim":"질문 변환을 추가해도 Embedding·DB 계약을 깨지 않아야 결과가 비교 가능합니다.","headers":["구분","기존 조건","이번 확장 때 지켜야 할 점"],"rows":[["Embedding","intfloat/multilingual-e5-small · 384차원","query: 접두어·동일 모델·revision 유지"],["문서 Embedding","passage: 접두어로 색인한 데이터","다른 모델의 384차원과 섞지 않기"],["GPU 기본 실행","CUDA 활성화 · device='cuda:0'","Day26의 coursekit/live.py 모델 로더도 GPU로 변경 필요"],["Metadata","Category, source_version, pipeline_version, ready","모든 질의에서 동일한 유효/현재/권한 조건"],["검색 개수","기존 Day26 search_hits의 k 1~20","문서 후보 수는 기존 허용 상한 안에서 선택"],["출처","chunk_id, citation_id, doc_id, source_locator","중복 제거·정렬 후에도 메타데이터 보존"]],"note":"Reranker용 Cross-Encoder는 기존 문서 벡터를 다시 만들지 않습니다. Day26의 E5 로더는 CPU로 지정되어 있으므로, Day27의 실제 실행에서는 CUDA로 전환합니다. 모델 ID·revision·Prefix·정규화 계약은 유지합니다."},{"id":"d27-candidate-wrapper","chapter":4,"kind":"code","title":"Day26 Retriever 계약을 유지하고 E5 실행 장치를 GPU로 전환합니다","claim":"make_retriever()의 {query, category, candidate_k} 입출력은 유지합니다. 실제 E5 모델 로더는 CUDA를 사용하도록 전환해야 합니다.","left":"전제: Day26 검색 인터페이스를 사용하되, coursekit/live.py의 E5 로더는 CUDA GPU로 변경합니다.","right":"출력: candidate_docs: list[Document]. 문서 ID·출처 Metadata는 그대로 보존합니다.","code":{"lang":"python","title":"candidate_retrieval.py · 기존 검색 재사용","raw":"from langchain_core.runnables import RunnableLambda\nfrom coursekit.checkpoints import make_retriever  # Day26 제공 모듈\n\n# GPU 전환: Day26 coursekit/live.py의 _cached_encoder()에서\n# SentenceTransformer(..., device=\"cpu\")를 device=\"cuda:0\"으로 변경합니다.\n# torch.cuda.is_available() == True를 확인한 뒤 검색 함수를 준비합니다.\n\n# Day26의 Runnable Retriever를 그대로 사용합니다.\nbase_retriever = make_retriever(search_hits)\n\ndef retrieve_step(state: dict) -> dict:\n    k = state.get(\"candidate_k\", 10)\n    if not isinstance(k, int) or not 1 <= k <= 20:\n        raise ValueError(\"candidate_k must be 1..20\")\n    docs = base_retriever.invoke({\n        \"query\": state[\"search_query\"],  # Day26 함수 계약은 query라는 이름 사용\n        \"category\": state[\"category\"],\n        \"candidate_k\": k,\n    })\n    return {**state, \"candidate_docs\": docs}\n\nretrieval_stage = RunnableLambda(retrieve_step)","desc":"학습용 코드입니다. 실제 모델·DB가 필요한 부분은 환경 준비 후 실행하고, 코드 복사 시 설명 주석도 함께 복사됩니다.","highlighted":["<span class=\"py-keyword\">from</span> langchain_core.runnables <span class=\"py-keyword\">import</span> RunnableLambda","<span class=\"py-keyword\">from</span> coursekit.checkpoints <span class=\"py-keyword\">import</span> make_retriever  <span class=\"py-comment\"># Day26 제공 모듈</span>","","<span class=\"py-comment\"># GPU 전환: Day26 coursekit/live.py의 _cached_encoder()에서</span>","<span class=\"py-comment\"># SentenceTransformer(..., device=\"cpu\")를 device=\"cuda:0\"으로 변경합니다.</span>","<span class=\"py-comment\"># torch.cuda.is_available() == True를 확인한 뒤 검색 함수를 준비합니다.</span>","","<span class=\"py-comment\"># Day26의 Runnable Retriever를 그대로 사용합니다.</span>","base_retriever = make_retriever(search_hits)","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">retrieve_step</span>(state: dict) -&gt; dict:","    k = state.get(<span class=\"py-string\">\"</span><span class=\"py-string\">candidate_k</span><span class=\"py-string\">\"</span>, <span class=\"py-number\">10</span>)","    <span class=\"py-keyword\">if</span> not isinstance(k, int) or not <span class=\"py-number\">1</span> &lt;= k &lt;= <span class=\"py-number\">20</span>:","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">\"</span><span class=\"py-string\">candidate_k must be 1..20</span><span class=\"py-string\">\"</span>)","    docs = base_retriever.invoke({","        <span class=\"py-string\">\"</span><span class=\"py-string\">query</span><span class=\"py-string\">\"</span>: state[<span class=\"py-string\">\"</span><span class=\"py-string\">search_query</span><span class=\"py-string\">\"</span>],  <span class=\"py-comment\"># Day26 함수 계약은 query라는 이름 사용</span>","        <span class=\"py-string\">\"</span><span class=\"py-string\">category</span><span class=\"py-string\">\"</span>: state[<span class=\"py-string\">\"</span><span class=\"py-string\">category</span><span class=\"py-string\">\"</span>],","        <span class=\"py-string\">\"</span><span class=\"py-string\">candidate_k</span><span class=\"py-string\">\"</span>: k,","    })","    <span class=\"py-keyword\">return</span> {**state, <span class=\"py-string\">\"</span><span class=\"py-string\">candidate_docs</span><span class=\"py-string\">\"</span>: docs}","","retrieval_stage = RunnableLambda(retrieve_step)"]},"flowTrace":[{"label":"Retriever 준비","input":"Day26 search_hits 함수","output":"base_retriever Runnable","line":9,"why":"기존 E5·pgvector 검색을 재사용할 Runnable을 준비합니다."},{"label":"검색 실행","input":"search_query · category · candidate_k","output":"Document 후보 목록","line":15,"why":"실행 시 질문 필드를 query로 전달하고 후보 수를 검증합니다."},{"label":"결과 보존","input":"Document 목록","output":"state[\"candidate_docs\"]","line":20,"why":"다음 Reranker가 읽을 Key를 추가합니다."}],"introTerms":[{"term":"make_retriever(search_hits)","meaning":"Day26 프로젝트가 제공한 함수로, 기존 Python 검색 함수를 Runnable로 감쌈","use":"LangChain 내장 함수명이 아니라 기존 E5·pgvector 검색을 재사용하기 위한 Adapter"},{"term":"base_retriever.invoke()","meaning":"질문·Category·후보 수를 전달하여 실제 Retriever를 실행","use":"실행 결과를 LangChain Document 목록으로 받아 다음 Reranker에 전달"}]},{"id":"d27-candidate-document","chapter":4,"kind":"code","title":"Candidate가 LangChain Document로 바뀌어도 ID는 남겨 둡니다","claim":"검색 점수를 바꿔도 본문·출처 ID가 유실되지 않도록 Document에 Metadata를 유지합니다.","left":"전제: 기존 search_hits가 반환한 정규화된 Hit dict.","right":"출력: page_content + metadata를 가진 Document.","code":{"lang":"python","title":"documents.py · 후보 본문과 출처","raw":"from langchain_core.documents import Document\n\ndef to_document(hit: dict) -> Document:\n    # 본문은 page_content, 출처는 metadata로 구분합니다.\n    return Document(\n        page_content=hit[\"body\"],\n        metadata={\n            \"chunk_id\": hit[\"chunk_id\"],\n            \"citation_id\": hit[\"citation_id\"],\n            \"doc_id\": hit[\"doc_id\"],\n            \"source_version\": hit[\"source_version\"],\n            \"source_locator\": hit[\"source_locator\"],\n            \"category\": hit[\"category\"],\n        },\n    )","desc":"Document는 저장 형태이며 모델 점수를 계산하는 실행 노드가 아닙니다.","highlighted":["<span class=\"py-keyword\">from</span> langchain_core.documents <span class=\"py-keyword\">import</span> Document","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">to_document</span>(hit: dict) -&gt; Document:","    <span class=\"py-comment\"># 본문은 page_content, 출처는 metadata로 구분합니다.</span>","    <span class=\"py-keyword\">return</span> Document(","        page_content=hit[<span class=\"py-string\">\"</span><span class=\"py-string\">body</span><span class=\"py-string\">\"</span>],","        metadata={","            <span class=\"py-string\">\"</span><span class=\"py-string\">chunk_id</span><span class=\"py-string\">\"</span>: hit[<span class=\"py-string\">\"</span><span class=\"py-string\">chunk_id</span><span class=\"py-string\">\"</span>],","            <span class=\"py-string\">\"</span><span class=\"py-string\">citation_id</span><span class=\"py-string\">\"</span>: hit[<span class=\"py-string\">\"</span><span class=\"py-string\">citation_id</span><span class=\"py-string\">\"</span>],","            <span class=\"py-string\">\"</span><span class=\"py-string\">doc_id</span><span class=\"py-string\">\"</span>: hit[<span class=\"py-string\">\"</span><span class=\"py-string\">doc_id</span><span class=\"py-string\">\"</span>],","            <span class=\"py-string\">\"</span><span class=\"py-string\">source_version</span><span class=\"py-string\">\"</span>: hit[<span class=\"py-string\">\"</span><span class=\"py-string\">source_version</span><span class=\"py-string\">\"</span>],","            <span class=\"py-string\">\"</span><span class=\"py-string\">source_locator</span><span class=\"py-string\">\"</span>: hit[<span class=\"py-string\">\"</span><span class=\"py-string\">source_locator</span><span class=\"py-string\">\"</span>],","            <span class=\"py-string\">\"</span><span class=\"py-string\">category</span><span class=\"py-string\">\"</span>: hit[<span class=\"py-string\">\"</span><span class=\"py-string\">category</span><span class=\"py-string\">\"</span>],","        },","    )"]}},{"id":"d27-k-vs-n","chapter":4,"kind":"table","title":"Candidate 수와 Context 수는 같을 필요가 없습니다","claim":"작은 후보 수는 정답 누락 위험이 있고, 너무 큰 후보 수는 Reranking의 시간·자원을 증가시킵니다.","headers":["설정 예시","Retrieval 단계","Rerank/Context 단계"],"rows":[["candidate_k=3, context_k=3","3개만 검색","3개에서 순서를 바꿔 3개 사용 → 후보 누락 위험"],["candidate_k=10, context_k=3","10개 검색","10개를 점수화한 뒤 상위 3개 사용"],["candidate_k=20, context_k=3","20개 검색","더 넓지만 Cross-Encoder 계산량 증가"],["Candidate에 정답 없음","어떤 k에서도 정답 후보가 오지 않음","재정렬해도 정답 문서는 나타나지 않음"]],"note":"최종 Context는 길이 예산과 문서 블록 전체가 들어갈 수 있는지 다시 확인합니다."},{"id":"d27-candidate-demo","chapter":4,"kind":"demo","title":"시연 · 검색 후보 수와 필터를 변경합니다","claim":"Candidate-k와 Category를 바꾸어 Reranker에 들어갈 문서 목록이 어떻게 달라지는지 확인합니다.","demo":"candidate-lab","left":[["검색 범위","Category·현재 Version 등 검색 전제 조건을 확인합니다."],["후보 누락","정답이 후보에 없을 경우 재정렬 효과가 제한됩니다."]],"right":[["최종 선택","Candidate-k가 Context 개수와 같지 않습니다."],["효과의 한계","점수를 계산해도 검색 후보 밖의 문서는 새로 찾지 못합니다."]],"note":"후보 ID·순위는 준비한 교육용 사례입니다. 저장된 DB 결과로 보아서는 안 됩니다."},{"id":"d27-pr4","chapter":4,"kind":"practice","title":"실습 04 · Candidate Retrieval 계약 확인","claim":"Day26 make_retriever() Runnable을 재사용하여 Candidate Document를 받습니다.","preparation":"Day26 search_hits 함수 계약, Document Metadata, 세 Category와 현재 버전 조건을 사용합니다.","output":"후보 ID·출처·필터·Context 선택 수의 확인표","levels":[{"name":"01_basic · 기본필수","folder":"01_basic","task":"candidate_k를 검증하고 후보 수와 context_k를 구분합니다.","result":"기본 검색 후보와 최종 선택 개수 확인"},{"name":"02_intermediate · 응용","folder":"02_intermediate","task":"다중 질의 후보를 합치고 Metadata를 보존합니다.","result":"중복 제거 후 chunk_id와 출처 일치"},{"name":"03_advanced · 심화","folder":"03_advanced","task":"버전·권한·준비상태 누락을 확인하며 경계 조건을 검사합니다.","result":"필터 누락·k 초과·데이터 누락을 진단"}],"criterion":"모든 후보에 chunk_id와 source_locator가 남아 있고 검색 결과와 Context 선택이 분리됩니다.","caution":"문서를 다시 Embedding하거나 다른 모델의 저장 벡터를 혼합하지 않습니다."},{"id":"d27-q4","chapter":4,"kind":"quiz","title":"이해 확인 · 검색 후보의 한계","claim":"Reranker에 무엇을 전달할 수 있는지 확인합니다.","items":[["Candidate-k=10, Context-k=3은 어떤 의미인가요?","검색 후보 10개를 가져와 평가하고, 재정렬 후 Context에는 최대 3개를 선택한다는 뜻입니다."],["다른 E5 모델이 만든 384차원 벡터를 섞어서 같은 SQL 비교를 해도 되나요?","아니요. 차원만 같아도 다른 Embedding 공간일 수 있습니다."],["Multi-query 중 하나만 Category 조건을 해제해도 되나요?","안 됩니다. 모든 검색 요청에 동일한 접근·버전 필터를 적용해야 합니다."]]},{"id":"d27-rerank-definition","chapter":5,"kind":"concept","title":"Reranking은 검색된 후보의 순서를 다시 정합니다","claim":"Reranking은 Retriever가 반환한 후보를 질문과 더 정밀하게 비교해 순위를 바꾸는 단계입니다.","left":[["왜 필요한가","초기 Retriever는 전체 문서에서 빠르게 후보를 찾는 데 초점을 둡니다. 첫 순위가 최종 답변의 근거 우선순위와 항상 일치하지는 않습니다."],["어디에 있는가","Retriever → Candidate 목록 → Reranker → Context Builder입니다. Reranker의 출력을 다시 Embedding할 필요는 없습니다."]],"right":[["현업 예시","“회의실 예약 취소” 질문에서 예약 신청 방법보다 취소 가능 조건과 철회 절차가 담긴 청크를 더 위로 올립니다."],["입력·출력","Input = search_query + 후보 Documents / Output = 점수와 새 순서가 붙은 Documents"]],"distinction":"정답이 검색 후보에 없을 때의 해결책은 Rerank가 아니라 첫 검색 단계의 범위·품질 점검입니다."},{"id":"d27-bi-cross-definition","chapter":5,"kind":"concept","title":"Bi-Encoder와 Cross-Encoder는 무엇이 다를까요?","claim":"Bi-Encoder는 질문과 문서를 각각 Embedding하고, Cross-Encoder는 질문·문서 쌍을 함께 입력하여 관련성을 평가합니다.","left":[["Bi-Encoder · 1차 검색","질문 벡터와 미리 저장한 문서 벡터를 비교하므로 대규모 문서에서 빠르게 후보를 찾습니다. 전날 E5·pgvector가 이 역할입니다."],["Cross-Encoder · 2차 정렬","문서 후보마다 질문과 문서를 함께 읽어 점수를 계산합니다. 비교 횟수가 늘어나므로 좁힌 후보에 사용합니다."]],"right":[["질문","“회의실 예약 취소 절차는?”"],["두 후보","C1: 회의실 예약 신청 방법 / C2: 회의실 예약 철회 및 취소 조건"]],"distinction":"Cross-Encoder가 더 정밀할 수 있어도 모든 도메인·언어·문서에서 반드시 성능이 좋아진다는 보장은 없습니다.","references":[{"label":"Sentence Transformers · Cross-Encoder usage","url":"https://sbert.net/docs/cross_encoder/usage/usage.html"}]},{"id":"d27-bi-vs-cross","chapter":5,"kind":"table","title":"Bi-Encoder와 Cross-Encoder의 입력·출력을 비교합니다","claim":"두 모델의 계산 결과는 서로 다른 척도이므로 점수 자체를 비교하지 않습니다.","headers":["구분","Bi-Encoder · Candidate Retrieval","Cross-Encoder · Reranking"],"rows":[["입력","Question 하나 / Document 하나 각각 입력","(Question, Document) 쌍을 함께 입력"],["모델 출력","두 개의 Embedding 벡터","쌍의 관련성 점수 1개"],["저장·재사용","문서 벡터를 미리 DB에 저장 가능","모든 새 질문에 대해 쌍을 다시 계산"],["속도 특성","대규모 검색에 유리","후보 수만큼 계산하여 일반적으로 느림"],["전날 학습","E5 + pgvector","이번 Chapter의 CrossEncoder"]],"note":"Reranker 점수의 부호·값 범위는 모델/설정에 따라 달라집니다. 순위 판단과 정답 확률 판단을 혼동하면 안 됩니다.","references":[{"label":"Sentence Transformers · Cross-Encoder usage","url":"https://sbert.net/docs/cross_encoder/usage/usage.html"},{"label":"Sentence Transformers · CrossEncoder.predict API","url":"https://sbert.net/docs/package_reference/cross_encoder/model.html"}]},{"id":"d27-cross-encoder-basic","chapter":5,"kind":"code","title":"CUDA GPU에서 다국어 Cross-Encoder를 실행합니다","claim":"이번 수업의 Reranker는 CUDA GPU 추론이 기본입니다. 먼저 환경을 검사하고 질문–문서 쌍의 관련성을 계산합니다.","left":"준비: NVIDIA GPU, CUDA 지원 PyTorch, sentence-transformers, 모델 파일 다운로드.","right":"출력: GPU에서 계산한 두 문서의 관련성 점수. 모델 점수는 정답 확률과 다릅니다.","code":{"lang":"python","title":"cross_encoder.py · 실제 모델 호출","raw":"import torch\nfrom sentence_transformers import CrossEncoder\n\n# 로컬 Embedding·Reranking 모델 추론은 NVIDIA CUDA GPU를 기본으로 합니다.\nif not torch.cuda.is_available():\n    raise RuntimeError(\"CUDA GPU 미사용: NVIDIA Driver와 CUDA 지원 PyTorch를 확인하세요.\")\n\ndevice = \"cuda:0\"\nprint(\"사용 GPU:\", torch.cuda.get_device_name(0))\nmodel = CrossEncoder(\"BAAI/bge-reranker-v2-m3\", device=device)\n\nquestion = \"회의실 예약을 취소하는 방법은?\"\npassages = [\n    \"회의실 예약은 담당자 승인 후 확정됩니다.\",\n    \"회의실 예약을 취소하려면 운영실에 철회를 요청합니다.\",\n]\n# 두 문서를 GPU에서 각각 (Question, Document) 쌍으로 평가합니다.\npairs = [(question, passage) for passage in passages]\nscores = model.predict(pairs, batch_size=2)\nprint(scores)  # 모델 관련성 점수이며 정답 확률이 아닙니다.","desc":"GPU를 사용할 수 없으면 조용히 CPU로 전환하지 않고 환경 오류를 알립니다. VRAM이 부족하면 후보 수·batch_size를 줄이고 GPU 사용량을 확인합니다.","highlighted":["<span class=\"py-keyword\">import</span> torch","<span class=\"py-keyword\">from</span> sentence_transformers <span class=\"py-keyword\">import</span> CrossEncoder","","<span class=\"py-comment\"># 로컬 Embedding·Reranking 모델 추론은 NVIDIA CUDA GPU를 기본으로 합니다.</span>","<span class=\"py-keyword\">if</span> not torch.cuda.is_available():","    <span class=\"py-keyword\">raise</span> RuntimeError(<span class=\"py-string\">\"</span><span class=\"py-string\">CUDA GPU 미사용: NVIDIA Driver와 CUDA 지원 PyTorch를 확인하세요.</span><span class=\"py-string\">\"</span>)","","device = <span class=\"py-string\">\"</span><span class=\"py-string\">cuda:0</span><span class=\"py-string\">\"</span>","print(<span class=\"py-string\">\"</span><span class=\"py-string\">사용 GPU:</span><span class=\"py-string\">\"</span>, torch.cuda.get_device_name(<span class=\"py-number\">0</span>))","model = CrossEncoder(<span class=\"py-string\">\"</span><span class=\"py-string\">BAAI/bge-reranker-v2-m3</span><span class=\"py-string\">\"</span>, device=device)","","question = <span class=\"py-string\">\"</span><span class=\"py-string\">회의실 예약을 취소하는 방법은?</span><span class=\"py-string\">\"</span>","passages = [","    <span class=\"py-string\">\"</span><span class=\"py-string\">회의실 예약은 담당자 승인 후 확정됩니다.</span><span class=\"py-string\">\"</span>,","    <span class=\"py-string\">\"</span><span class=\"py-string\">회의실 예약을 취소하려면 운영실에 철회를 요청합니다.</span><span class=\"py-string\">\"</span>,","]","<span class=\"py-comment\"># 두 문서를 GPU에서 각각 (Question, Document) 쌍으로 평가합니다.</span>","pairs = [(question, passage) <span class=\"py-keyword\">for</span> passage in passages]","scores = model.predict(pairs, batch_size=<span class=\"py-number\">2</span>)","print(scores)  <span class=\"py-comment\"># 모델 관련성 점수이며 정답 확률이 아닙니다.</span>"]},"references":[{"label":"BAAI · multilingual bge-reranker-v2-m3 model","url":"https://huggingface.co/BAAI/bge-reranker-v2-m3"},{"label":"Sentence Transformers · CrossEncoder.predict API","url":"https://sbert.net/docs/package_reference/cross_encoder/model.html"}],"introTerms":[{"term":"CrossEncoder(..., device=\"cuda:0\")","meaning":"질문과 문서를 함께 읽어 점수를 매길 Reranker 모델을 GPU에 준비","use":"모델을 불러오는 단계이며, 아직 질문–문서 점수를 계산한 것은 아님"},{"term":"predict(pairs, batch_size=2)","meaning":"(질문, 문서) 쌍을 모델에 입력해 관련성 점수를 계산하는 메서드","use":"실제 GPU 추론이 일어나는 위치. batch_size는 한 번에 처리할 입력 쌍 수"}]},{"id":"d27-rerank-pairs","chapter":5,"kind":"code","title":"Document 목록을 모델 입력 쌍으로 바꿉니다","claim":"질문은 동일하게 사용하고 각 문서의 page_content를 쌍의 두 번째 요소로 전달합니다.","left":"입력: search_query, 검색된 LangChain Document 목록.","right":"출력: (질문, 문서 본문) 쌍 목록. 개수는 후보 개수와 동일.","code":{"lang":"python","title":"rerank_pairs.py · Query와 Document 결합","raw":"from langchain_core.documents import Document\n\ndef build_pairs(search_query: str, documents: list[Document]):\n    # Reranker는 새 문서를 만들지 않습니다.\n    return [(search_query, doc.page_content) for doc in documents]\n\npairs = build_pairs(\"회의실 예약 취소 방법\", [\n    Document(page_content=\"신청은 승인 뒤 확정됩니다.\", metadata={\"chunk_id\": \"C1\"}),\n    Document(page_content=\"취소는 운영실에 요청합니다.\", metadata={\"chunk_id\": \"C2\"}),\n])\nprint(len(pairs))  # 2개 후보 → 2개 입력 쌍","desc":"학습용 코드입니다. 실제 모델·DB가 필요한 부분은 환경 준비 후 실행하고, 코드 복사 시 설명 주석도 함께 복사됩니다.","highlighted":["<span class=\"py-keyword\">from</span> langchain_core.documents <span class=\"py-keyword\">import</span> Document","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">build_pairs</span>(search_query: str, documents: list[Document]):","    <span class=\"py-comment\"># Reranker는 새 문서를 만들지 않습니다.</span>","    <span class=\"py-keyword\">return</span> [(search_query, doc.page_content) <span class=\"py-keyword\">for</span> doc in documents]","","pairs = build_pairs(<span class=\"py-string\">\"</span><span class=\"py-string\">회의실 예약 취소 방법</span><span class=\"py-string\">\"</span>, [","    Document(page_content=<span class=\"py-string\">\"</span><span class=\"py-string\">신청은 승인 뒤 확정됩니다.</span><span class=\"py-string\">\"</span>, metadata={<span class=\"py-string\">\"</span><span class=\"py-string\">chunk_id</span><span class=\"py-string\">\"</span>: <span class=\"py-string\">\"</span><span class=\"py-string\">C1</span><span class=\"py-string\">\"</span>}),","    Document(page_content=<span class=\"py-string\">\"</span><span class=\"py-string\">취소는 운영실에 요청합니다.</span><span class=\"py-string\">\"</span>, metadata={<span class=\"py-string\">\"</span><span class=\"py-string\">chunk_id</span><span class=\"py-string\">\"</span>: <span class=\"py-string\">\"</span><span class=\"py-string\">C2</span><span class=\"py-string\">\"</span>}),","])","print(len(pairs))  <span class=\"py-comment\"># 2개 후보 → 2개 입력 쌍</span>"]}},{"id":"d27-rerank-score","chapter":5,"kind":"table","title":"Cross-Encoder의 점수는 정답 확률과 같지 않습니다","claim":"점수는 해당 모델이 정의한 쿼리·문서 관련성의 값입니다. 수치가 크다는 이유만으로 답변의 정확성이 보장되지는 않습니다.","headers":["관찰","올바른 해석","주의할 해석"],"rows":[["C2 4.3 / C1 1.2 (예시 숫자)","이 쿼리에 대해 모델이 C2를 위로 놓음","C2가 4.3% 정확하다? → 잘못"],["C2 0.81 / C1 0.66 (모델이 그렇게 출력할 때)","같은 모델·쿼리의 상대 순위 비교","0.81이 보편적인 신뢰 확률? → 잘못"],["Cross 점수와 Cosine 0.81","점수 정의가 달라 직접 비교하지 않음","같은 숫자이므로 같은 의미? → 잘못"],["후보가 전부 엉뚱한 경우","그중 상대적으로 더 가까운 문서가 1위","1위이므로 답을 생성해야 한다? → 잘못"]],"note":"표의 숫자는 동작 원리 설명용 임의 예시이며 실제 실행·측정 결과가 아닙니다.","references":[{"label":"Sentence Transformers · Cross-Encoder usage","url":"https://sbert.net/docs/cross_encoder/usage/usage.html"}]},{"id":"d27-candidate-ceiling","chapter":5,"kind":"concept","title":"Reranker 성능의 상한은 초기 후보 집합이 정합니다","claim":"정답이 포함된 후보를 먼저 검색하지 못하면 어떤 Reranker도 그 정답 문서를 선택할 수 없습니다.","left":[["Candidate Recall의 역할","정답 문서가 최초 검색의 Top-k에 들어오는지가 우선입니다. Rerank는 그 후보의 순서를 개선하는 두 번째 단계입니다."],["Reranking에서 비교할 것","같은 Candidate Set에 Baseline 순위와 Cross-Encoder 순위를 적용해야 재정렬 효과를 분리해 볼 수 있습니다."]],"right":[["기준 예시","C1,C2,C3 후보 안에 정답 C3가 3위 → Rerank 후 1위: 개선 가능"],["불가능한 예시","C1,C2,C4에 정답 C3가 없음 → Rerank로 C3를 추가할 수 없음"]],"distinction":"실제 Recall@k·MRR·nDCG 계산은 다음 날 RAG Evaluation 수업에서 다룹니다."},{"id":"d27-rerank-implementation","chapter":5,"kind":"code","title":"Cross-Encoder를 LangChain Rerank Stage로 연결합니다","claim":"CrossEncoder가 점수를 계산하고, RunnableLambda가 이 계산을 Pipeline의 실행 단위로 감쌉니다.","left":"입력: candidate_docs, search_query, 로드해 둔 cross_encoder.","right":"출력: ranked_docs가 추가된 state; chunk ID와 출처 Metadata 보존.","code":{"lang":"python","title":"reranker.py · 점수·문서 정렬","raw":"import math\nfrom langchain_core.runnables import RunnableLambda\n\ndef rerank_step(state: dict) -> dict:\n    docs = state[\"candidate_docs\"]\n    if not docs:\n        return {**state, \"ranked_docs\": []}\n    # CrossEncoder는 LangChain 내부 모델이 아니라 별도 점수 계산기입니다.\n    pairs = [(state[\"search_query\"], doc.page_content) for doc in docs]\n    scores = cross_encoder.predict(pairs, batch_size=4)\n    if len(scores) != len(docs) or not all(math.isfinite(float(s)) for s in scores):\n        raise ValueError(\"invalid rerank scores\")\n    # 원본 Document 인스턴스를 재배치하므로 Metadata는 보존됩니다.\n    ranked = sorted(zip(scores, docs), key=lambda p: float(p[0]), reverse=True)\n    return {**state, \"ranked_docs\": [doc for _, doc in ranked[:3]]}\n\nrerank_stage = RunnableLambda(rerank_step)\n# rerank_stage.invoke(state)를 호출할 때 실제 CrossEncoder가 실행됩니다.","desc":"프로덕션에서는 모델 출력 비유한값·빈 본문·초과 길이·타임아웃 처리를 추가합니다.","highlighted":["<span class=\"py-keyword\">import</span> math","<span class=\"py-keyword\">from</span> langchain_core.runnables <span class=\"py-keyword\">import</span> RunnableLambda","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">rerank_step</span>(state: dict) -&gt; dict:","    docs = state[<span class=\"py-string\">\"</span><span class=\"py-string\">candidate_docs</span><span class=\"py-string\">\"</span>]","    <span class=\"py-keyword\">if</span> not docs:","        <span class=\"py-keyword\">return</span> {**state, <span class=\"py-string\">\"</span><span class=\"py-string\">ranked_docs</span><span class=\"py-string\">\"</span>: []}","    <span class=\"py-comment\"># CrossEncoder는 LangChain 내부 모델이 아니라 별도 점수 계산기입니다.</span>","    pairs = [(state[<span class=\"py-string\">\"</span><span class=\"py-string\">search_query</span><span class=\"py-string\">\"</span>], doc.page_content) <span class=\"py-keyword\">for</span> doc in docs]","    scores = cross_encoder.predict(pairs, batch_size=<span class=\"py-number\">4</span>)","    <span class=\"py-keyword\">if</span> len(scores) != len(docs) or not all(math.isfinite(float(s)) <span class=\"py-keyword\">for</span> s in scores):","        <span class=\"py-keyword\">raise</span> ValueError(<span class=\"py-string\">\"</span><span class=\"py-string\">invalid rerank scores</span><span class=\"py-string\">\"</span>)","    <span class=\"py-comment\"># 원본 Document 인스턴스를 재배치하므로 Metadata는 보존됩니다.</span>","    ranked = sorted(zip(scores, docs), key=<span class=\"py-keyword\">lambda</span> p: float(p[<span class=\"py-number\">0</span>]), reverse=<span class=\"py-keyword\">True</span>)","    <span class=\"py-keyword\">return</span> {**state, <span class=\"py-string\">\"</span><span class=\"py-string\">ranked_docs</span><span class=\"py-string\">\"</span>: [doc <span class=\"py-keyword\">for</span> _, doc in ranked[:<span class=\"py-number\">3</span>]]}","","rerank_stage = RunnableLambda(rerank_step)","<span class=\"py-comment\"># rerank_stage.invoke(state)를 호출할 때 실제 CrossEncoder가 실행됩니다.</span>"]},"flowTrace":[{"label":"후보 준비","input":"state[\"candidate_docs\"]","output":"(search_query, document) 쌍","line":9,"why":"질문과 각 Document 본문을 하나의 입력으로 묶습니다."},{"label":"Cross-Encoder","input":"pairs · CUDA GPU","output":"관련성 점수 N개","line":10,"why":"모델이 점수를 계산합니다. LangChain 자체가 점수를 만드는 것은 아닙니다."},{"label":"검사·정렬","input":"scores + docs","output":"점수가 높은 순서의 Document","line":14,"why":"점수 개수와 유한성을 검사한 뒤 원본 Document를 정렬합니다."},{"label":"Stage 출력","input":"ranked Docs","output":"state[\"ranked_docs\"]","line":15,"why":"Metadata를 유지한 채 다음 Context 단계로 보냅니다."}]},{"id":"d27-rerank-ops","chapter":5,"kind":"table","title":"실무 Reranking은 품질과 자원 요구를 함께 설계합니다","claim":"이번 실습은 CUDA GPU를 기본으로 사용하며, 모델 품질과 VRAM·Batch·Latency 및 실패 처리를 함께 설계합니다.","headers":["설계 항목","기본 결정","운영상 점검"],"rows":[["모델 언어","한국어 지원 다국어 Reranker 선택","실제 한국어 업무 문서로 검증"],["후보 수","예: 10개 후보 평가","CUDA GPU Latency와 질문·문서 길이 측정"],["Batch","예: batch_size=2부터 시작","GPU VRAM·Peak Memory·배치 크기 확인"],["결과 없음","Context 없이 정보 부족 처리","LLM이 없는 사실을 생성하지 않도록"],["Reranker 실패","명시적인 오류 또는 정책에 따른 기록된 Fallback","조용히 다른 결과를 정상이라고 표시하지 않기"],["접근 제어","문서 검색 전에 권한·현재 버전 제한","Rerank 단계에서 권한을 새로 부여하지 않기"]],"note":"기본 실행 환경은 NVIDIA CUDA GPU입니다. CPU는 별도로 선택하는 예외 경로일 뿐 자동 Fallback이 아닙니다. GPU OOM이면 batch_size·후보 수·입력 길이를 조정합니다."},{"id":"d27-rerank-demo","chapter":5,"kind":"demo","title":"시연 · 후보의 순위가 바뀌는 것을 확인합니다","claim":"첫 검색 순위와 교육용 Cross-Encoder 점수로 계산한 새 순위를 비교합니다.","demo":"rerank-lab","left":[["같은 후보","초기 검색 후보의 ID는 그대로 유지합니다."],["관련성 점수","같은 모델이 계산한 점수를 기준으로 내림차순 정렬합니다."]],"right":[["Context Top-N","재정렬 후 위쪽 문서만 Context에 들어갈 수 있습니다."],["한계","정답 ID가 후보에 없다면 결과 목록에서 등장하지 않습니다."]],"note":"표시된 Reranker 점수는 고정 교육용 값입니다. 실제 bge-reranker 실행 출력이 아닙니다."},{"id":"d27-pr5","chapter":5,"kind":"practice","title":"실습 05 · Cross-Encoder로 후보를 재정렬하기","claim":"CrossEncoder를 감싼 RunnableLambda로 검색 후보의 순서를 재조정합니다.","preparation":"강의 제공 후보, 모델 호출 코드, Document Metadata, 계산 확인용 고정 점수를 사용합니다.","output":"Baseline 순위와 Rerank 순위·출처 ID 비교표","levels":[{"name":"01_basic · 기본필수","folder":"01_basic","task":"고정 점수로 Document를 재정렬하고 실제 CrossEncoder 호출 구조를 확인합니다.","result":"ID는 그대로 유지되고 순위만 바뀜"},{"name":"02_intermediate · 응용","folder":"02_intermediate","task":"입력 쌍·Top-N·Metadata 보존 TODO를 추가합니다.","result":"실제 모델 실행·고정 예시 결과를 구분"},{"name":"03_advanced · 심화","folder":"03_advanced","task":"빈 후보·점수 개수 불일치·비유한값·실행 실패를 검사합니다.","result":"정렬 전후 감사 기록과 실패 사유"}],"criterion":"같은 후보를 대상으로 원본 순위와 재정렬 순위를 보고, 출처 Metadata를 모두 유지합니다.","caution":"한국어 문서에 대한 실제 성능과 실행 시간은 로컬 환경에서 관찰해야 합니다."},{"id":"d27-q5","chapter":5,"kind":"quiz","title":"이해 확인 · Cross-Encoder의 역할","claim":"점수·순위·후보의 차이를 구분합니다.","items":[["왜 Cross-Encoder는 보통 검색한 Top-k 후보에만 사용할까요?","질문·문서 쌍마다 계산하므로 비용이 더 들고 대규모 전체 자료에 적용하기 어렵기 때문입니다."],["Reranker 점수 0.8은 답변이 80% 정확하다는 뜻일까요?","아닙니다. 모델의 관련성 점수이므로 확률로 단정할 수 없습니다."],["C9가 후보에 없으면 Reranker가 C9를 결과에 넣을까요?","아닙니다. 초기 후보 검색 범위나 전략을 고쳐야 합니다."]]},{"id":"d27-langchain-position","chapter":6,"kind":"concept","title":"LangChain에서 새로 추가하는 구성요소는 어디에 있을까요?","claim":"Day26에서 익힌 Document·Runnable·Prompt·Model의 역할을 다시 확인하고, 같은 LangChain 흐름에 Rewrite와 Reranker를 추가합니다.","left":[["기존 RAG 연결","Day26에서 RunnableLambda로 검색 함수를 감쌌고, Document를 Context로 바꾼 뒤 ChatPromptTemplate와 ChatOpenAI를 호출했습니다."],["오늘 추가하는 부분","Retriever 앞에 Rewrite 함수를, Retriever 뒤에 Reranker 함수를 둡니다. 검색용 질문과 원래 질문은 서로 다른 필드입니다."]],"right":[["변하지 않는 것","검색 데이터의 E5·Category·Version, 실제 included_ids의 범위, 결과·출처를 검증하는 규칙"],["변하는 것","입력에서 search_query가 준비되고, candidate_docs와 reranked_docs가 서로 다른 이름으로 기록됩니다."]],"distinction":"LangChain을 도입했다고 접근제어·공식 근거 검증·출처 복원이 자동으로 이루어지는 것은 아닙니다.","references":[{"label":"LangChain · Python documentation","url":"https://docs.langchain.com/oss/python/langchain/overview"},{"label":"LangChain · Retrieval and RAG","url":"https://docs.langchain.com/oss/python/langchain/retrieval"}]},{"id":"d27-vscode","chapter":6,"kind":"table","title":"VS Code에서 파일 구조와 실행 노드의 관계를 봅니다","claim":"Explorer는 소스 파일의 위치를, 노드는 데이터가 실제로 처리되는 순서를 보여 줍니다. 변수 색상과 단계별 입출력을 함께 확인합니다.","headers":["실무에서 맡는 역할","교육용 프로젝트 파일","실행 노드"],"rows":[["질문·History를 독립 질문으로 변환","app/query.py","Query Rewrite"],["기존 E5·SQL에서 후보 검색","app/retrieval.py","Retriever"],["Cross-Encoder로 후보 순위 변경","app/rerank.py","Reranker"],["입력·중간값·응답 연결","app/pipeline.py","Orchestration"],["FastAPI 계약과 오류 응답","app/api.py","API Router"]],"note":"교육용 VS Code 구조 예시이며 실제 Day26 배포 폴더와 파일명이 반드시 같을 필요는 없습니다. 기존 coursekit/checkpoints.py의 make_retriever, build_context를 함수로 재사용합니다."},{"id":"d27-runnable-rewrite","chapter":6,"kind":"code","title":"실제 Rewrite Chain을 Runnable Stage에 연결합니다","claim":"Stage는 Pipeline에서 한 가지 역할을 맡는 처리 단계입니다. 여기서는 Rewrite Chain의 결과를 받아 검색용 질문을 만들고, 확인이 필요한 요청은 검색 전에 멈춥니다.","left":"입력: history_text·question, Chapter 2에서 준비한 rewrite_chain.","right":"출력: original question을 보존한 status와 search_query; 호출은 invoke 시점.","code":{"lang":"python","title":"app/query.py · RunnableLambda","raw":"from langchain_core.runnables import RunnableLambda\n\ndef make_rewrite_stage(rewrite_chain):\n    def rewrite_step(state: dict) -> dict:\n        # Chapter 2의 실제 Prompt | Chat Model 호출입니다.\n        result = rewrite_chain.invoke({\"history\": state[\"history_text\"],\n                                       \"question\": state[\"question\"]})\n        if result.needs_clarification or not result.standalone_query.strip():\n            return {**state, \"status\": \"needs_clarification\"}\n        # 원 질문을 덮어쓰지 않고 검색용 질문만 별도 필드에 기록합니다.\n        return {**state, \"status\": \"ready\",\n                \"search_query\": result.standalone_query}\n    return RunnableLambda(rewrite_step)\n\nrewrite_stage = make_rewrite_stage(rewrite_chain)\n# rewrite_stage.invoke(state) 시점에 Prompt 생성 및 실제 LLM API 호출.","desc":"이 예제의 RunnableLambda 자체는 LLM을 호출하지 않습니다. 실제 Rewrite 모델 호출은 앞에서 설명한 별도 단계입니다.","highlighted":["<span class=\"py-keyword\">from</span> langchain_core.runnables <span class=\"py-keyword\">import</span> RunnableLambda","","<span class=\"py-keyword\">def</span> <span class=\"py-function\">make_rewrite_stage</span>(rewrite_chain):","    <span class=\"py-keyword\">def</span> <span class=\"py-function\">rewrite_step</span>(state: dict) -&gt; dict:","        <span class=\"py-comment\"># Chapter 2의 실제 Prompt | Chat Model 호출입니다.</span>","        result = rewrite_chain.invoke({<span class=\"py-string\">\"</span><span class=\"py-string\">history</span><span class=\"py-string\">\"</span>: state[<span class=\"py-string\">\"</span><span class=\"py-string\">history_text</span><span class=\"py-string\">\"</span>],","                                       <span class=\"py-string\">\"</span><span class=\"py-string\">question</span><span class=\"py-string\">\"</span>: state[<span class=\"py-string\">\"</span><span class=\"py-string\">question</span><span class=\"py-string\">\"</span>]})","        <span class=\"py-keyword\">if</span> result.needs_clarification or not result.standalone_query.strip():","            <span class=\"py-keyword\">return</span> {**state, <span class=\"py-string\">\"</span><span class=\"py-stri
