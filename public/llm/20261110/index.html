<style>
:root {
  --color-primary: #142849;
  --color-heading: #1C2B40;
  --color-text: #222F44;
  --color-muted: #52667E;
  --color-canvas: #F9FBFE;
  --color-surface: #FFFFFF;
  --color-soft: #F0F6FD;
  --color-border: #D8E4F2;
  --color-code-bg: #1B2435;
  --color-code-text: #FFFFFF;
  /* 코드 안에서만 쓰는 파생값 (배경 #1B2435 대비 4.5:1 이상) */
  --code-muted: #9AACC4;
  --code-soft: #CFE0F5;
  --code-mark-bg: rgba(240, 246, 253, 0.13);
  /* 새로 생긴 줄: 연한 청색 + 남색 왼쪽 선 + '새로 생김' 글자 */
  --new-bg: #E3EEFB;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
  --font-code: Consolas, "SFMono-Regular", Menlo, "Malgun Gothic", monospace;
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
  --space-6: 1.5rem; --space-8: 2rem;
  --radius-control: 0.75rem; --radius-card: 1rem; --radius-badge: 9999px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--color-canvas); color: var(--color-text); font: 400 1rem/1.7 var(--font-body); word-break: keep-all; overflow-wrap: anywhere; }
main { max-width: 80rem; margin-inline: auto; padding: var(--space-8); }
h1, h2 { color: var(--color-heading); margin: 0; }
h1 { font-size: clamp(1.6rem, 3vw, 2.1rem); line-height: 1.3; }
h2 { font-size: 1.3rem; line-height: 1.4; }
a { color: var(--color-primary); text-underline-offset: 0.2em; }
:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 3px; }
code, pre { font-family: var(--font-code); }

/* 단계 목록 */
.steps { display: flex; flex-wrap: wrap; gap: var(--space-4); margin: var(--space-6) 0; }
.group { display: flex; flex-direction: column; gap: var(--space-2); }
.group-label { font-size: 0.8rem; font-weight: 700; color: var(--color-muted); }
.group-items { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip { font: inherit; font-size: 0.9rem; font-weight: 600; min-height: 2.5rem; padding: var(--space-2) var(--space-4); border-radius: var(--radius-badge); border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-primary); cursor: pointer; }
.chip:hover { background: var(--color-soft); }
.chip[aria-current="step"] { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
.chip .n { opacity: 0.7; margin-right: 0.3em; }

.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-card); padding: var(--space-6); }

/* 위: 할 일 · 성공 · 용어 */
.brief { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-4); align-items: start; }
.badge { display: inline-block; padding: 0.1rem var(--space-2); border-radius: var(--radius-badge); background: var(--color-soft); color: var(--color-primary); font-size: 0.8rem; font-weight: 700; }
.brief h2 { margin-top: var(--space-2); }
.endpoint { margin: var(--space-1) 0 0; }
.endpoint code { font-size: 0.92rem; color: var(--color-muted); }
.brief dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-1) var(--space-4); margin: var(--space-3) 0 0; }
.brief dt { font-size: 0.85rem; font-weight: 700; color: var(--color-muted); padding-top: 0.1rem; }
.brief dd { margin: 0; }
.brief dd.ok { font-weight: 700; color: var(--color-primary); }
.word { display: inline-block; margin: 0 var(--space-2) var(--space-1) 0; }
.word b { font-family: var(--font-code); font-size: 0.92rem; color: var(--color-primary); background: var(--color-soft); padding: 0.05rem 0.45rem; border-radius: 0.4rem; margin-right: 0.35rem; }
.variant-btn { font: inherit; font-weight: 600; font-size: 0.9rem; min-height: 2.75rem; padding: var(--space-2) var(--space-4); border-radius: var(--radius-control); border: 1px dashed var(--color-primary); background: var(--color-surface); color: var(--color-primary); cursor: pointer; white-space: nowrap; }
.variant-btn[aria-pressed="true"] { background: var(--color-primary); color: #fff; border-style: solid; }

/* 가운데: 코드 | 브라우저 */
.mid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--space-6); margin-top: var(--space-6); align-items: start; }
.col-label { font-size: 0.8rem; font-weight: 700; color: var(--color-muted); margin: 0 0 var(--space-2); }
.stack > * + * { margin-top: var(--space-3); }
.pane { background: var(--color-code-bg); color: var(--color-code-text); border-radius: var(--radius-card); overflow: hidden; }
.pane-head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-4); font-size: 0.8rem; color: var(--code-soft); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
.pane-head b { color: #fff; font-weight: 600; }
.pane-btn { font: inherit; font-size: 0.78rem; color: var(--code-soft); background: transparent; border: 1px solid rgba(207, 224, 245, 0.4); border-radius: var(--radius-badge); padding: 0.15rem 0.6rem; cursor: pointer; }
.pane-btn:hover { background: rgba(255, 255, 255, 0.08); }
pre { margin: 0; padding: var(--space-3) 0; overflow-x: auto; font-size: 0.82rem; line-height: 1.65; white-space: pre; word-break: normal; overflow-wrap: normal; }
.ln { display: block; padding-right: var(--space-4); }
.ln .no { display: inline-block; width: 3.2em; padding-right: 0.9em; text-align: right; color: var(--code-muted); user-select: none; }
.ln.mark { background: var(--code-mark-bg); box-shadow: inset 3px 0 0 var(--color-soft); }
.ln.mark .no { color: #fff; }
.ln.removed { text-decoration: line-through; opacity: 0.75; }
.ln.removed .no::before { content: "−"; margin-right: 0.3em; }
.ln.dim { opacity: 0.45; }
.tk-kw { color: #fff; font-weight: 700; }
.tk-str { color: var(--code-soft); }
.tk-com { color: var(--code-muted); font-style: italic; }
.tk-dec { color: #fff; text-decoration: underline; text-decoration-color: rgba(207, 224, 245, 0.5); text-underline-offset: 0.2em; }
.term { padding: var(--space-3) var(--space-4); }
.term pre { padding: 0; white-space: pre-wrap; word-break: normal; overflow-wrap: anywhere; color: var(--code-soft); }
.term .cmd { color: #fff; font-weight: 600; }

/* 브라우저 창 */
.browser { border: 1px solid var(--color-border); border-radius: var(--radius-card); overflow: hidden; background: var(--color-surface); }
.browser-bar { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--color-soft); border-bottom: 1px solid var(--color-border); }
.addr { flex: 1; min-width: 0; padding: 0.2rem 0.8rem; border-radius: var(--radius-badge); background: var(--color-surface); border: 1px solid var(--color-border); font: 0.85rem var(--font-code); color: var(--color-text); overflow-wrap: anywhere; }
.addr .host { color: var(--color-muted); }
.status { font-size: 0.8rem; font-weight: 700; color: var(--color-primary); white-space: nowrap; }
.viewport { padding: var(--space-3) var(--space-4); }
.json { padding: 0; font-size: 0.84rem; color: var(--color-text); white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; }
.json .row { display: block; padding: 0 var(--space-2); border-radius: 0.3rem; }
.json .row.new { background: var(--new-bg); box-shadow: inset 3px 0 0 var(--color-primary); }
.json .tag { font: 700 0.72rem var(--font-body); color: var(--color-primary); margin-left: 0.5em; white-space: nowrap; }
.shot-step { font-size: 0.8rem; font-weight: 700; color: var(--color-muted); margin: var(--space-3) 0 var(--space-1); }
.shot-step:first-child { margin-top: 0; }
.shot-wrap { overflow-x: auto; }
.shot { display: block; width: 100%; height: auto; border: 1px solid var(--color-border); border-radius: 0.5rem; }
.editor-tab { font: 700 0.82rem var(--font-code); color: var(--color-primary); }
.server-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-control); background: var(--color-code-bg); color: var(--code-soft); font: 0.8rem var(--font-code); }
.server-line span:first-child { font-family: var(--font-body); font-weight: 700; color: #fff; }

/* 다시 확인 */
.result-head { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: baseline; margin-bottom: var(--space-2); }
.result-head .change { font-weight: 700; color: var(--color-primary); }

/* 아래: 한 문장 설명 */
.why { margin-top: var(--space-6); padding-top: var(--space-4); border-top: 1px solid var(--color-border); display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-2) var(--space-6); }
.why p { margin: 0; max-width: 52rem; }
.refs { font-size: 0.85rem; color: var(--color-muted); }
.refs a { font-weight: 600; }
.recap { margin-top: var(--space-4); padding: var(--space-3) var(--space-4); background: var(--color-soft); border-radius: var(--radius-control); font-size: 0.92rem; }
.recap b { color: var(--color-primary); font-family: var(--font-code); margin-right: 0.3em; }
.recap span + span::before { content: "·"; margin: 0 0.6em; color: var(--color-muted); }

/* 큰 그림 */
.flow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); gap: var(--space-3); align-items: center; margin-top: var(--space-6); }
.node { padding: var(--space-4); border: 2px solid var(--color-primary); border-radius: var(--radius-card); text-align: center; }
.node b { display: block; font-size: 1.15rem; color: var(--color-heading); }
.node span { font-size: 0.85rem; color: var(--color-muted); }
.link { text-align: center; font-size: 0.85rem; font-weight: 700; color: var(--color-primary); line-height: 1.5; }
.intro-stack { display: flex; flex-direction: column; gap: var(--space-6); }
.intro-card { scroll-margin-top: var(--space-4); }
.table-wrap { overflow-x: auto; margin-top: var(--space-6); }
.rest { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.rest th { text-align: left; font-size: 0.8rem; color: var(--color-muted); padding: var(--space-2) var(--space-3); border-bottom: 2px solid var(--color-border); }
.rest td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border); white-space: nowrap; }
.rest code { color: var(--color-primary); }
.method { font-family: var(--font-code); color: var(--color-heading); }
.cmp code + code { margin-top: var(--space-1); }
.cmp.good { border-color: var(--color-primary); }
.cmp-row, .msg-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); margin-top: var(--space-6); }
.cmp, .msg { padding: var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-card); background: var(--color-soft); }
.cmp b, .msg > b { display: block; font-size: 1.1rem; color: var(--color-heading); }
.cmp span { display: block; font-size: 0.9rem; color: var(--color-muted); }
.cmp code { display: block; margin-top: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-control); background: var(--color-surface); font-size: 0.85rem; color: var(--color-primary); }
.platform { list-style: none; display: flex; flex-wrap: wrap; gap: var(--space-2); padding: 0; margin: 0; }
.platform li { padding: var(--space-2) var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-control); font-weight: 600; }
.platform li span { display: block; font-size: 0.75rem; font-weight: 700; color: var(--color-muted); }
.platform li.now { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
.platform li.now span { color: var(--code-soft); }
.platform li { position: relative; }
.platform li + li { margin-left: var(--space-4); }
.platform li + li::before { content: "→"; position: absolute; left: -1.05rem; top: 50%; transform: translateY(-50%); color: var(--color-muted); font-weight: 700; }
.msg dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-1) var(--space-3); margin: var(--space-2) 0 0; }
.msg dt { font-size: 0.85rem; font-weight: 700; color: var(--color-muted); }
.msg dd { margin: 0; }
.msg code { font-size: 0.88rem; color: var(--color-primary); }
.url { display: flex; flex-wrap: wrap; margin-top: var(--space-6); }
.seg { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding: var(--space-2) var(--space-3); border: 1px solid var(--color-border); background: var(--color-soft); }
.seg + .seg { border-left: 0; }
.seg:first-child { border-radius: var(--radius-control) 0 0 var(--radius-control); }
.seg:last-child { border-radius: 0 var(--radius-control) var(--radius-control) 0; }
.seg code { font-size: 1rem; font-weight: 700; color: var(--color-primary); }
.seg span { font-size: 0.8rem; color: var(--color-muted); }
.url-note { margin: var(--space-2) 0 0; font-size: 0.9rem; color: var(--color-muted); }
.roles { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin: 0; }
.roles div { padding: var(--space-2) var(--space-4); background: var(--color-soft); border-radius: var(--radius-control); }
.roles dt { font-weight: 700; color: var(--color-primary); }
.roles dd { margin: 0; font-size: 0.85rem; }
.roles .arrow { color: var(--color-muted); font-weight: 700; }
.next { color: var(--color-muted); font-size: 0.92rem; }
.recap-note { margin: var(--space-2) 0 0; color: var(--color-muted); }
.recap-note span + span::before { content: "·"; margin: 0 0.6em; }
.crud { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-6); align-items: center; }
.crud span { padding: var(--space-1) var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-badge); font-size: 0.9rem; }
.crud b { font-family: var(--font-code); color: var(--color-primary); margin-left: 0.3em; }

.pager { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); margin-top: var(--space-4); }
.btn { font: inherit; font-weight: 600; min-height: 2.75rem; padding: var(--space-2) var(--space-6); border-radius: var(--radius-control); border: 1px solid transparent; cursor: pointer; }
.btn-primary { background: var(--color-primary); color: #fff; }
.btn-primary:hover { background: var(--color-code-bg); }
.btn-secondary { background: var(--color-soft); color: var(--color-primary); }
.btn-secondary:hover { background: var(--color-border); }
.btn:disabled { background: var(--color-soft); color: var(--color-muted); cursor: default; }
.pos { font-size: 0.9rem; color: var(--color-muted); }

@media (max-width: 64rem) {
  .mid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 44rem) {
  main { padding: var(--space-4); }
  .card { padding: var(--space-4); }
  .brief { grid-template-columns: minmax(0, 1fr); }
  .brief dl { grid-template-columns: minmax(0, 1fr); }
  .brief dt { padding-top: var(--space-2); }
  .flow { grid-template-columns: minmax(0, 1fr); }
  .link { padding: var(--space-1) 0; }
  .cmp-row, .msg-row { grid-template-columns: minmax(0, 1fr); }
  .seg { flex: 1 1 auto; }
  .seg code { white-space: nowrap; }
  .roles { flex-direction: column; align-items: stretch; }
  .roles .arrow { align-self: center; transform: rotate(90deg); }
  .seg + .seg { border-left: 1px solid var(--color-border); }
  .seg, .seg:first-child, .seg:last-child { border-radius: var(--radius-control); }
  .url { gap: var(--space-1); }
  .btn { padding-inline: var(--space-4); }
  .shot-wrap .shot { width: 34rem; max-width: none; }
}
</style>
</head>

What_is_a_URL"], "no": "0-3"}, {"id": "rest", "period": "웹 기초", "title": "REST", "kind": "intro", "section": "rest", "lead": "REST는 API 주소를 짓는 약속입니다. 주소에는 무엇을(명사), Method에는 어떻게(동사)를 담습니다.", "table": [["GET", "/api/knowledge", "목록 읽기", "200"], ["GET", "/api/knowledge/{knowledge_id}", "하나 읽기", "200"], ["POST", "/api/knowledge", "만들기", "201"], ["PUT", "/api/knowledge/{knowledge_id}", "바꾸기", "200"], ["DELETE", "/api/knowledge/{knowledge_id}", "지우기", "204"]], "versus": [["REST가 아닌 주소", ["/api/getKnowledge?id=2", "/api/updateKnowledge?id=2", "/api/deleteKnowledge?id=2"]], ["REST 주소", ["GET /api/knowledge/2", "PUT /api/knowledge/2", "DELETE /api/knowledge/2"]]], "why": "주소 두 개와 Method 네 개로 읽기·만들기·바꾸기·지우기를 모두 나타냅니다. 강의에서 '최종 API 약속'으로 정리한 다섯 요청이 이 모양입니다. 이렇게 지은 API를 RESTful API라고 부릅니다.", "next": "다음 단계부터 왼쪽은 코드와 터미널, 오른쪽은 브라우저 화면입니다.", "doc": ["MDN · REST", "https://developer.mozilla.org/ko/docs/Glossary/REST"], "no": "0-4"}, {"id": "start", "period": "1교시 · 첫 서버", "title": "서버 실행", "endpoint": "python -m uvicorn main:app --reload", "task": "main.py의 app을 Uvicorn으로 켜고, 브라우저에서 /docs를 연다", "success": "터미널에 'Application startup complete.', /docs에 경로 6개", "words": [["/docs", "FastAPI가 코드를 보고 자동으로 만든 문서. 여기서 요청도 보낼 수 있다"]], "code": {"file": "main.py", "source": "# main.py — 지식 관리 API\n# 실행: python -m uvicorn main:app --reload\nfrom fastapi import FastAPI, HTTPException\nfrom pydantic import BaseModel, Field\n\nfrom storage import read_data, write_data\n\napp = FastAPI()\n\n\n@app.get(\"/health\")\ndef health():\n    return {\"status\": \"ok\"}\n\n\n@app.get(\"/api/knowledge\")\ndef list_knowledge():\n    return read_data()[\"entries\"]\n\n\ndef find_entry(data, knowledge_id):\n    for entry in data[\"entries\"]:\n        if entry[\"id\"] == knowledge_id:\n            return entry\n    raise HTTPException(status_code=404, detail=\"Knowledge not found\")\n\n\n@app.get(\"/api/knowledge/{knowledge_id}\")\ndef get_knowledge(knowledge_id: int):\n    return find_entry(read_data(), knowledge_id)\n\n\nclass Knowledge(BaseModel):\n    title: str = Field(min_length=1, max_length=80)\n    content: str = Field(min_length=1, max_length=2000)\n    category: str = Field(min_length=1, max_length=30)\n\n\n@app.post(\"/api/knowledge\", status_code=201)\ndef create_knowledge(knowledge: Knowledge):\n    data = read_data()\n    entry = {\"id\": data[\"next_id\"], **knowledge.model_dump()}\n    data[\"entries\"].append(entry)\n    data[\"next_id\"] += 1\n    write_data(data)\n    return entry\n\n\n@app.put(\"/api/knowledge/{knowledge_id}\")\ndef update_knowledge(knowledge_id: int, knowledge: Knowledge):\n    data = read_data()\n    entry = find_entry(data, knowledge_id)\n    entry.update(knowledge.model_dump())\n    write_data(data)\n    return entry\n\n\n@app.delete(\"/api/knowledge/{knowledge_id}\", status_code=204)\ndef delete_knowledge(knowledge_id: int):\n    data = read_data()\n    data[\"entries\"].remove(find_entry(data, knowledge_id))\n    write_data(data)\n", "focus": [8, 13], "mark": [8]}, "terminal": {"title": "터미널 · 서버", "lines": ["$ python -m uvicorn main:app --reload", "INFO:     Will watch for changes in these directories: ['~/fastapi_knowledge']", "INFO:     Uvicorn running on http://127.0.0.1:8000 (Press CTRL+C to quit)", "INFO:     Started reloader process [5751] using WatchFiles", "INFO:     Started server process [5753]", "INFO:     Waiting for application startup.", "INFO:     Application startup complete."]}, "views": [{"kind": "shot", "url": "http://127.0.0.1:8000/docs", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABGgAAALwCAIAAABEDdRzAAAQAElEQVR4nOzdBXwTZx8H8CdSp05LW7S4u9vQAcNhMAZDB8PHGAx5cZehQ4YM34DBkG3AkCFDhxfX0mItFeqFWpr3nzzp0yNJkxQ6pP19P/3A5XKxu0v7/O7/3HNKtVrNAAAAAAAAIGNyBgAAAAAAACYhOAEAAAAAAJiB4AQAAAAAAGAGghMAAAAAAIAZCE4AAAAAAABmIDgBAAAAAACYgeAEAAAAAABgBoITAAAAAACAGQhOAAAAAAAAZiA4AQAAAAAAmIHgBAAAAAAAYAaCEwAAAAAAgBkITgAAAAAAAGYgOAEAAAAAAJiB4AQAAAAAAGAGghMAAAAAAIAZCE4AAAAAAABmIDgBAAAAAACYgeAEAAAAAABgBoITAAAAAACAGQhOAAAAAAAAZi a()\n    data[\"entries\"].remove(find_entry(data, knowledge_id))\n    write_data(data)\n", "focus": [33, 36], "mark": [34]}, "views": [{"kind": "docs", "url": "http://127.0.0.1:8000/docs", "caption": "Body에서 title 줄을 지우고 Execute", "response": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABBQAAALuCAIAAACRpNKOAAAQAElEQVR4nOzdBXgU194G8Nm4uxIPSYBAkADBCR6kUKSUQluq9FJX2q966+2l1EuFClVKBWkLlOLungAhIS7E3bObfO/uCcN2I2yUAO/vycM9Ozs7O7PZ9J73/OfMGOVUlUhERERERESXYyARERERERHpgeGBiIiIiIj0wvBARERERER6YXggIiIiIiK9MDwQEREREZFeGB6IiIiIiEgvDA9ERERERKQXhgciIiIiItILwwMREREREemF4YGIiIiIiPTC8EBERERERHpheCAiIiIiIr0wPBARERERkV4YHoiIiIiISC8MD0REREREpBeGByIiIiIi0gvDAxERERER6YXhgYiIiIiI9MLwQEREREREemF4ICIiIiIivTA8EBERERGRXhgeiIiIiIhILwwPRERERESkF4YHIiIiIiLSC8MDERERERHpheGBiIiIiIj0wvBARERERER6MZKutKcfeyU5MRWN8DFD73/kLomIiIiIiDol3fBQW1u7b/fh6DOxKSlpyYlpuTl5jk4OLq5Ovn5eI0cP7dEzUKFQSG2quLikvLwCjcqKSolIkjIuZCmrlWi4d3E1NDJE47/P/q+0pAyNl99cZGVtJRERERHRlfCv8HDu7PkvP/0hNiZeeyHyA37Ono75e93W1xc/G9InWKJrQm5O/mcfL9dZaGtr0zXA19ffu2ugr6mpiXQl/OfOJ0Xjm58+RHZF48SxKLFEqVRJRERERHSFXAoPm/7evvSDbyS6bpQUlxw+cLz+8i3/7MS/6LU//MS9/fqHSM2HFCq6+3h5UPeuEhERERFdE+rCQ1Zmjk5ymDd/ZtdAP2cXp8qKyvz8wjOR53bvPCDRNQpRwdjYqLCgSJxCJmkqTi8/txhfgzm3zpCa6fjRyJ9/WI2GtbVVC8LDrJtvqNCcw2ZqZioRERERUaehDg+1tbWffnQpOQQG+f/fS484OTtqrzdoSOhd983Fmg1uRaVU5eUVmJub6nk+ekF+oaGhobWNvievV1VVV1VW8mT39vP58iUmJsZolJWWHTtyatmnPyBI4OGK71cPGzHI07uL1IHm3zNHIiIiIqLORx0eos/EHj8SKS96+MkFOslBpjNbuqSk9Jef1p46fjoxIUUs8fL2CBvcb9LUcc4uDWwBA9K/r/wrLjZBHt4ePGxAfm6B1Ij8vIKVP645HXkuJTkND83NzVAMGTcxfPTYYRK1DwtLi+Hhg4N7dbtr3iNiyfIvf37xtSflFRAg9+46ePZMbGJ8ipmZqY+vZ5/QXn369RTPpqdl/Ll648kTp8XDXTv2JyepL6U1auyw7sGBUt0ZTZHJiWlFRcWVlVX2DnZ9+vacMHmUkdGlM+i++3pleZn6G4IUYWFh3tiuxp6L27X9AN6xtLTM1s7G1c15QFjf3n05J4eIiIiovah7bKdOnJEfj50wAt1BfV6J8ekP3vlCjE/L0MvHz4a/trzw6hO9eveQl9fU1Hz20beb/t6us5EDe480tv09Ow988v7XcswAtKNOncXPoX1HH3/mfjFSTu3BwdH+tjtv+vHb39E+cugEfn0GBupbgmRn5b73v8/ORJ2T18Szq35dN3HKmPsenI9qUkF+0d/rtsrPnj0dgx80uvUIEOHhjZff1/nO4Dvwx+q/X37zafcurmLJ6l/Xi8Ytt81oLDz8uuKPn777XWfhH    for entry in data[\"entries\"]:\n        if entry[\"id\"] == knowledge_id:\n            return entry\n    raise HTTPException(status_code=404, detail=\"Knowledge not found\")\n\n\n@app.get(\"/api/knowledge/{knowledge_id}\")\ndef get_knowledge(knowledge_id: int):\n    return find_entry(read_data(), knowledge_id)\n\n\nclass Knowledge(BaseModel):\n    title: str = Field(min_length=1, max_length=80)\n    content: str = Field(min_length=1, max_length=2000)\n    category: str = Field(min_length=1, max_length=30)\n\n\n@app.post(\"/api/knowledge\", status_code=201)\ndef create_knowledge(knowledge: Knowledge):\n    data = read_data()\n    entry = {\"id\": data[\"next_id\"], **knowledge.model_dump()}\n    data[\"entries\"].append(entry)\n    data[\"next_id\"] += 1\n    write_data(data)\n    return entry\n\n\n@app.put(\"/api/knowledge/{knowledge_id}\")\ndef update_knowledge(knowledge_id: int, knowledge: Knowledge):\n    data = read_data()\n    entry = find_entry(data, knowledge_id)\n    entry.update(knowledge.model_dump())\n    write_data(data)\n    return entry\n\n\n@app.delete(\"/api/knowledge/{knowledge_id}\", status_code=204)\ndef delete_knowledge(knowledge_id: int):\n    data = read_data()\n    data[\"entries\"].remove(find_entry(data, knowledge_id))\n    write_data(data)\n", "focus": [49, 55], "mark": [52, 53, 54]}, "views": [{"kind": "docs", "url": "http://127.0.0.1:8000/docs", "caption": "PUT /api/knowledge/{knowledge_id} → Try it out → 2 입력 → Execute", "response": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABBQAAAGICAIAAAB+4SRUAAAQAElEQVR4nOzdB3wU1doG8NlN76T3kBBq6CH03kVAiqBiF0VR1Ou1e62fFb14r128KioqooL03juETgIkpJLee082+Z7dE4Z1U5iEhCTk+f/yg9nZ2dnZmS3ve95zZoyrCtMkIiIiIiKia1FLRERERERECjB5ICIiIiIiRZg8EBERERGRIkweiIiIiIhIESYPRERERESkCJMHIiIiIiJShMkDEREREREpwuSBiIiIiIgUYfJARERERESKMHkgIiIiIiJFmDwQEREREZEiTB6IiIiIiEgRJg9ERERERKQIkwciIiIiIlKEyQMRERERESnC5IGIiIiIiBRh8kBERERERIoweSAiIiIiIkWYPBARERERkSJMHoiIiIiISBEmD0REREREpAiTByIiIiIiUoTJAxERERERKcLkgYiIiIiIFGHyQEREREREijB "category\": \"setup\"},", "tag": null}, {"text": "  {\"id\": 2, \"title\": \"서버 실행\", \"content\": \"python -m uvicorn main:app --reload로 켠다.\", \"category\": \"api\"},", "tag": "바뀜"}, {"text": "  {\"id\": 3, \"title\": \"입력 오류\", \"content\": \"422이면 입력값을 확인한다.\", \"category\": \"api\"},", "tag": null}, {"text": "  {\"id\": 4, \"title\": \"실습 환경 안내\", \"content\": \"Python 3.10 이상을 사용한다.\", \"category\": \"setup\"}", "tag": null}, {"text": "]"}]}}, "why": "주소의 2로 바꿀 지식을 찾고, Body로 받은 세 값으로 덮어씁니다. 보낸 값에 id가 없어서 id 2는 그대로 남습니다. write_data(data)가 저장하므로 목록을 다시 열어도 바뀐 내용이 보입니다.", "doc": ["Body - Updates", "https://fastapi.tiangolo.com/tutorial/body-updates/"], "no": "9"}, {"id": "delete", "period": "5교시 · DELETE", "title": "204 No Content", "endpoint": "DELETE /api/knowledge/{knowledge_id}", "task": "/docs에서 3번 지식을 지운다", "success": "Code 204, Response body 없음. /api/knowledge/3은 404", "words": [["204", "처리했고 돌려줄 내용은 없다는 상태코드"]], "code": {"file": "main.py", "source": "# main.py — 지식 관리 API\n# 실행: python -m uvicorn main:app --reload\nfrom fastapi import FastAPI, HTTPException\nfrom pydantic import BaseModel, Field\n\nfrom storage import read_data, write_data\n\napp = FastAPI()\n\n\n@app.get(\"/health\")\ndef health():\n    return {\"status\": \"ok\"}\n\n\n@app.get(\"/api/knowledge\")\ndef list_knowledge():\n    return read_data()[\"entries\"]\n\n\ndef find_entry(data, knowledge_id):\n    for entry in data[\"entries\"]:\n        if entry[\"id\"] == knowledge_id:\n            return entry\n    raise HTTPException(status_code=404, detail=\"Knowledge not found\")\n\n\n@app.get(\"/api/knowledge/{knowledge_id}\")\ndef get_knowledge(knowledge_id: int):\n    return find_entry(read_data(), knowledge_id)\n\n\nclass Knowledge(BaseModel):\n    title: str = Field(min_length=1, max_length=80)\n    content: str = Field(min_length=1, max_length=2000)\n    category: str = Field(min_length=1, max_length=30)\n\n\n@app.post(\"/api/knowledge\", status_code=201)\ndef create_knowledge(knowledge: const KW = new Set("import from def class return if else elif for in is None not and or with as raise try finally del True False".split(" "));
function highlight(line) {
  const re = /(#.*$)|("""[^]*?"""|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(@[\w.]+)|\b([A-Za-z_]\w*)\b/g;

    else if (m[2]) out += `<span class="tk-str">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="tk-dec">${esc(m[3])}</span>`;
    else if (KW.has(m[4])) out += `<span class="tk-kw">${esc(m[4])}</span>`;
    else out += esc(m[4]);
    last = re.lastIndex;
  }
  return out + esc(line.slice(last));
}

function codePane(step) {
  const c = step.code;
  const rows = c.source.replace(/\n$/, "").split("\n");
  const [from, to] = c.focus;
  const removed = variantOn && step.variant ? step.variant.remove_line : null;
  const marks = new Set(c.mark);
  let body = "";
  rows.forEach((text, i) => {
    const no = i + 1;
    const inFocus = no >= from && no <= to;
    if (!fullCode && !inFocus) return;
    const cls = ["ln"];
    if (no === removed) cls.push("removed");
    else if (marks.has(no)) cls.push("mark");
    if (fullCode && !inFocus) cls.push("dim");
    body += `<span class="${cls.join(" ")}"><span class="no">${no}</span>${highlight(text) || " "}</span>`;
  });
  return `<div class="pane"><div class="pane-head"><span><b>${esc(c.file)}</b></span>
    <button class="pane-btn" type="button" data-act="full">${fullCode ? "이 부분만 보기" : "전체 코드 보기"}</button></div>
    <pre><code>${body}</code></pre></div>`;
}

function terminalPane(t) {
  const lines = t.lines.map((l) => (l.startsWith("$ ") ? `<span class="cmd">${esc(l)}</span>` : esc(l))).join("\n");
  return `<div class="pane"><div class="pane-head"><span><b>${esc(t.title)}</b></span></div><div class="term"><pre>${lines}</pre></div></div>`;
}

function address(url) {
  const m = url.match(/^(https?:\/\/[^/]+)(.*)$/);
  return m ? `<span class="host">${esc(m[1])}</span>${esc(m[2])}` : esc(url);
}

function browser(view) {
  if (view.kind === "file") {
    const rows = view.lines.map((l) => `<span class="row">${esc(l.text)}</span>`).join("");
    return `<div class="browser"><div class="browser-bar"><span class="editor-tab">${esc(view.name)}</span></div>
      <div class="viewport"><pre class="json">${rows}</pre></div></div>`;
  }
  if (view.kind === "shot") {
    return `<div class="browser"><div class="browser-bar"><span class="addr">${address(view.url)}</span></div>
      <div class="viewport"><img class="shot" src="${view.img}" alt="/docs 경로 목록"></div></div>`;
  }
  if (view.kind === "docs") {
    const input = view.input ? `<div class="shot-wrap"><img class="shot" src="${view.input}" alt="Body 입력과 Execute 버튼"></div><p class="shot-step">Server response</p>` : "";
    return `<div class="browser"><div class="browser-bar"><span class="addr">${address(view.url)}</span></div>
      <div class="viewport"><p class="shot-step">${esc(view.caption)}</p>${input}
        <div class="shot-wrap"><img class="shot" src="${view.response}" alt="Server response의 Code와 Response body"></div></div></div>`;
  }
  const rows = view.lines.map((l) => `<span class="row${l.tag ? " new" : ""}">${esc(l.text)}${l.tag ? `<span class="tag">${esc(l.tag)}</span>` : ""}</span>`).join("");
  return `<div class="browser"><div class="browser-bar"><span class="addr">${address(view.url)}</span><span class="status">${view.status}</span></div>
    <div class="viewport"><pre class="json">${rows}</pre></div></div>`;
}

// 설명은 한 문장씩 줄을 나눠 보여 준다
function sentences(text) {
  return esc(text).replace(/(다\.)\s+/g, "$1<br>");
}

function serverLine(lines) {
  return `<div class="server-line"><span>서버 터미널</span>${lines.map((l) => `<span>${esc(l)}</span>`).join("")}</div>`;
}

function introBody(step) {
  if (step.section === "api") {
    const cards = step.compare.map((c) => `<div class="cmp"><b>${esc(c.name)}</b><span>${esc(c.form)} · ${esc(c.who)}</span>
      <code>${esc(c.sample)}</code></div>`).join("");
    const plat = step.platform.map(([when, what], i) =>
      `<li class="${i === 0 ? "now" : ""}"><span>${esc(when)}</span>${esc(what)}</li>`).join("");
    return `<div class="cmp-row">${cards}</div>
      <p class="col-label" style="margin:var(--space-6) 0 var(--space-2)">앞으로 이어지는 순서</p>
      <ol class="platform">${plat}</ol>`;
  }
  if (step.section === "http") {
    const [a, b, c] = step.nodes;
    const node = ([n, d]) => `<div class="node"><b>${esc(n)}</b><span>${esc(d)}</span></div>`;
    const pair = step.pair.map((p) => `<div class="msg"><b>${esc(p.name)}</b><dl>${p.rows.map(([k, v]) =>
      `<dt>${esc(k)}</dt><dd><code>${esc(v)}</code></dd>`).join("")}</dl></div>`).join("");
    return `<div class="flow">${node(a)}<div class="link">요청 →<br>← 응답</div>${node(b)}<div class="link">읽기 →<br>← 저장</div>${node(c)}</div>
      <div class="msg-row">${pair}</div>`;
  }
  if (step.section === "rest") {
    const rows = step.table.map(([m, path, what, code]) =>
      `<tr><td><b class="method">${esc(m)}</b></td><td><code>${esc(path)}</code></td><td>${esc(what)}</td><td><code>${esc(code)}</code></td></tr>`).join("");
    const vs = step.versus.map(([name, list], i) => `<div class="cmp${i ? " good" : ""}"><b>${esc(name)}</b>
      ${list.map((x) => `<code>${esc(x)}</code>`).join("")}</div>`).join("");
    return `<div class="table-wrap"><table class="rest"><thead><tr><th>Method</th><th>주소</th><th>하는 일</th><th>성공</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <div class="cmp-row">${vs}</div>`;
  }
  const segs = step.segments.map(([part, name]) => `<span class="seg"><code>${esc(part)}</code><span>${esc(name)}</span></span>`).join("");
  const roles = step.roles.map(([r, c], i) => `${i ? '<span class="arrow">→</span>' : ""}<div><dt>${esc(r)}</dt><dd><code>${esc(c)}</code></dd></div>`).join("");
  return `<div class="url">${segs}</div>
    <p class="url-note">${esc(step.query)}</p>
    <p class="col-label" style="margin:var(--space-6) 0 var(--space-2)">${esc(step.roles_label)}</p>
    <dl class="roles">${roles}</dl>`;
}

function renderIntro(step) {
  return `<article class="card">
    <span class="badge">${esc(step.period)}</span>
    <h2 style="margin-top:var(--space-2)">${esc(step.title)}</h2>
    <p style="margin:var(--space-2) 0 0">${esc(step.lead)}</p>
    ${introBody(step)}
    <div class="why"><p>${sentences(step.why)}${step.next ? `<br><span class="next">${esc(step.next)}</span>` : ""}</p>
      <span class="refs">참고 <a href="${esc(step.doc[1])}" target="_blank" rel="noopener">${esc(step.doc[0])} ↗</a></span></div>
  </article>`;
}

function renderStep(step) {
  const v = variantOn && step.variant ? step.variant : null;
  const src = v || step;
  const variantBtn = step.variant
    ? `<button class="variant-btn" type="button" data-act="variant" aria-pressed="${variantOn}">${variantOn ? "원래 코드로" : "바꿔 보기 · " + esc(step.variant.label)}</button>` : "";
  const words = (step.words || []).map(([w, m]) => `<span class="word"><b>${esc(w)}</b>${esc(m)}</span>`).join("");
  const left = [codePane(step)];
  if (step.terminal) left.push(terminalPane(step.terminal));
  else if (src.server) left.push(terminalPane({ title: "터미널 · 서버", lines: src.server }));
  const right = src.views.map(browser);
  if (src.result) {
    right.push(`<div><div class="result-head"><span class="col-label" style="margin:0">다시 확인 · ${esc(src.result.label)}</span>
      <span class="change">${esc(src.result.change)}</span></div>${browser(src.result.view)}</div>`);
  }
  const note = step.recap_note ? `<p class="recap-note">앞자리로 읽기 ${step.recap_note.map((t) => `<span>${esc(t)}</span>`).join("")}</p>` : "";
  const recap = step.recap ? `<div class="recap">지금까지 만난 상태코드 ${step.recap.map(([c, m]) => `<span><b>${esc(c)}</b>${esc(m)}</span>`).join("")}${note}</div>` : "";
  return `<article class="card">
    <div class="brief">
      <div>
        <span class="badge">${esc(step.period)}</span>
        <h2>${esc(step.title)}</h2>
        ${step.endpoint ? `<p class="endpoint"><code>${esc(step.endpoint)}</code></p>` : ""}
        <dl>
          <dt>할 일</dt><dd>${esc(step.task)}</dd>
          <dt>성공</dt><dd class="ok">✓ ${esc(src.success)}</dd>
          ${words ? `<dt>용어</dt><dd>${words}</dd>` : ""}
        </dl>
      </div>
      ${variantBtn}
    </div>
    <div class="mid">
      <div><p class="col-label">코드 · 터미널</p><div class="stack">${left.join("")}</div></div>
      <div><p class="col-label">브라우저 화면</p><div class="stack">${right.join("")}</div></div>
    </div>
    <div class="why"><p>${sentences(src.why)}</p>
      <span class="refs">공식 문서 <a href="${esc(step.doc[1])}" target="_blank" rel="noopener">${esc(step.doc[0])} ↗</a></span></div>
    ${recap}
  </article>`;
}

// 웹 기초 네 장은 단계 칸 하나("0 웹 기초")로 묶고, 한 화면에 세로로 이어서 보여 준다
const FIRST_INTRO = STEPS.findIndex((s) => s.kind === "intro");
const isIntro = (i) => STEPS[i].kind === "intro";
const navIndex = (i) => (isIntro(i) ? FIRST_INTRO : i);

function mark(i) {
  const n = navIndex(i);
  document.querySelectorAll(".chip").forEach((el) => {
    if (Number(el.dataset.i) === n) el.setAttribute("aria-current", "step");
    else el.removeAttribute("aria-current");
  });
  history.replaceState(null, "", "#" + STEPS[i].id);
}

function render() {
  const step = STEPS[current];
  const box = document.getElementById("step");
  box.innerHTML = step.kind === "intro"
    ? `<div class="intro-stack">${STEPS.map((s) => s.kind === "intro"
        ? `<div class="intro-card" id="card-${s.id}">${renderIntro(s)}</div>` : "").join("")}</div>`
    : renderStep(step);
  mark(current);
}

function go(i) {
  if (i < 0 || i >= STEPS.length) return;
  current = i; variantOn = false; fullCode = false;
  render();
  if (isIntro(i) && i !== FIRST_INTRO) document.getElementById("card-" + STEPS[i].id).scrollIntoView({ block: "start" });
  else window.scrollTo(0, 0);
}

// 화살표 키: 웹 기초 묶음은 한 칸으로 센다
function step(dir) {
  let i = navIndex(current) + dir;
  if (dir > 0) while (i < STEPS.length && isIntro(i)) i++;
  if (i >= 0 && isIntro(i)) i = FIRST_INTRO;
  go(i);
}

function buildNav() {
  const groups = [];
  STEPS.forEach((s, i) => {
    if (s.kind === "intro" && i !== FIRST_INTRO) return;
    const label = s.kind === "intro" ? "시작" : s.period;
    const no = s.kind === "intro" ? "0" : s.no;
    const title = s.kind === "intro" ? s.period : s.title;
    let g = groups.find((x) => x.period === label);
    if (!g) groups.push((g = { period: label, items: [] }));
    g.items.push(`<button class="chip" type="button" data-i="${i}"><span class="n">${esc(no)}</span>${esc(title)}</button>`);
  });
  document.getElementById("steps").innerHTML = groups.map((g) =>
    `<div class="group"><span class="group-label">${esc(g.period)}</span><div class="group-items">${g.items.join("")}</div></div>`).join("");
}

document.addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (chip) go(Number(chip.dataset.i));
  const act = e.target.closest("[data-act]");
  if (act && act.dataset.act === "variant") { variantOn = !variantOn; render(); }
  if (act && act.dataset.act === "full") { fullCode = !fullCode; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

if ("scrollRestoration" in history) history.scrollRestoration = "manual";
buildNav();
const start = STEPS.findIndex((s) => "#" + s.id === location.hash);
go(start >= 0 ? start : 0);
</script>
</body>
</html>
